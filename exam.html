\n<tr><td>턴버클<\/td><td>로드 장력 조정<\/td><\/tr>\n<tr><td>D링·래싱 아이 플레이트<\/td><td>해치커버·래싱 브리지의 고박 지점<\/td><\/tr>\n<tr><td>트위스트록(수동, 반자동 SAT, 전자동 FAT)<\/td><td>단과 단 연결, 들림 방지<\/td><\/tr>\n<tr><td>베이스 소켓·도브테일 기초<\/td><td>최하단 고정<\/td><\/tr>\n<tr><td>스태커·브리지 피팅·미드록<\/td><td>열과 열 연결, 횡 지지<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>래싱 브리지<\/h4>\n<ul>\n<li><b>목적<\/b>: 갑판에서 1~3단 높이에 고박점을 두어 3·4단째 컨테이너 하단까지 로드 고박 → 래킹·코너 포스트 하중 감소 → 더 무거운 컨테이너를 높게 적재.<\/li>\n<li><b>구조 고려<\/b>: 해치커버와 브리지의 상대 운동(선체 비틀림)으로 래싱 길이 변화, 갑판·해치코밍 연결부 피로, 진동, 중량·풍압 증가(복원성), 작업 통로·안전 난간, 냉동 컨테이너 전원 소켓 설치.<\/li>\n<li><b>계산<\/b>: 선급 컨테이너 고박 규칙으로 GM에 따른 가속도, 풍하중을 적용해 로드 장력, 코너 포스트 압축, 래킹력, 트위스트록 인장을 확인(적재지침에 bay별 허용 스택 중량).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-3-1<\/td><td>로드식 고박장치의 속구<\/td><td class=\"num\">25<\/td><td>속구별 기능 + 고박 하중 원리<\/td><\/tr>\n<tr><td class=\"num\">121-1-9<\/td><td>Lashing bridge<\/td><td class=\"num\">10<\/td><td>목적과 구조 고려<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 112회형\">\n<h5>1. 개요<\/h5><p>갑판 컨테이너는 횡동요 관성력·풍하중에 의한 래킹·전도·들림을 하단 고정(소켓·트위스트록)과 대각 로드 고박으로 막음.<\/p>\n<h5>2. 속구와 기능<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>속구<\/th><th>기능<\/th><\/tr><\/thead><tbody>\n<tr><td>래싱 로드(장·단)<\/td><td>코너 캐스팅과 갑판·래싱 브리지 아이를 대각 연결<\/td><\/tr>\n<tr><td>턴버클<\/td><td>로드 장력 조정<\/td><\/tr>\n<tr><td>D링·아이 플레이트<\/td><td>해치커버·래싱 브리지 고박점<\/td><\/tr>\n<tr><td>트위스트록(수동·SAT·FAT)<\/td><td>단 연결, 들림 방지<\/td><\/tr>\n<tr><td>베이스 소켓·도브테일<\/td><td>최하단 고정<\/td><\/tr>\n<tr><td>스태커·브리지 피팅·미드록<\/td><td>열 간 횡 지지<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 고박 하중 원리<\/h5><ul><li>GM이 크면 횡동요 가속도 증가 → 래싱 하중 증가(래싱 계산은 실제 GM으로)<\/li><li>확인 항목: 로드 장력, 코너 포스트 압축, 래킹력, 트위스트록 인장, 스택 중량<\/li><\/ul>\n<h5>4. 래싱 브리지<\/h5><p>고박점을 1~3단 높이로 올려 상단 컨테이너까지 로드 고박 → 스택 중량 증가 가능. 해치커버와 상대운동, 연결부 피로, 작업 안전 통로 고려.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 고박 능력이 실제 적재용량(loadable capacity)을 결정하므로, 래싱 브리지 높이와 GM 운용을 함께 설계해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"hatch-covers","p":9,"n":"9.3","h":"해치커버(Hatch Cover): 폴딩형과 폰툰형","t":"해치커버(Hatch Cover): 폴딩형과 폰툰형","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 1교시 2번 · 10점"],"q":["<b>133회(2024) 1-2<\/b> 해치커버 중 폴딩형과 폰툰형"],"k":"폴딩형은 경첩으로 연결된 패널들을 유압 실린더로 접어 해치 끝에 세워 두는 방식이고, 폰툰형은 크레인으로 패널을 통째로 들어 옮기는 방식이다. 폴딩형은 빠르고 독립적이지만 유압계가 복잡하고, 폰툰형은 단순·저렴하지만 크레인이 필요하다.","x":"\n<p class=\"key\">폴딩형은 경첩으로 연결된 패널들을 유압 실린더로 접어 해치 끝에 세워 두는 방식이고, 폰툰형은 크레인으로 패널을 통째로 들어 옮기는 방식이다. 폴딩형은 빠르고 독립적이지만 유압계가 복잡하고, 폰툰형은 단순·저렴하지만 크레인이 필요하다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>폴딩형(folding)<\/th><th>폰툰형(pontoon, lift-away)<\/th><\/tr><\/thead><tbody>\n<tr><td>작동<\/td><td>2~4개 패널을 유압(또는 와이어)으로 접어 해치 끝에 수직 보관<\/td><td>육상·선상 크레인으로 패널을 들어 다른 해치 위나 부두에 둠<\/td><\/tr>\n<tr><td>장점<\/td><td>개폐 빠름, 선박 자체 개폐, 갑판 측면 공간 불필요<\/td><td>구조 단순, 경량·저비용, 정비 쉬움, 대형 해치에 적합<\/td><\/tr>\n<tr><td>단점<\/td><td>유압·경첩·패킹 정비, 해치 끝 보관 공간, 비용<\/td><td>크레인 필요, 하역 시간 증가<\/td><\/tr>\n<tr><td>적용<\/td><td>일반화물선, 다목적선, 중갑판(tween deck)<\/td><td>컨테이너선(비풍우밀 래버린스 커버 포함)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>그 밖에 벌크선의 측면 롤링형(side rolling), 리프트 앤 롤형, 적층형(stacking)이 있다. 설계하중은 IACS UR S21(green sea, 화물하중), 풍우밀은 고무 가스켓과 압착 바, 클리트로 확보하고 호스시험 또는 초음파 시험으로 확인한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>폴딩형<\/th><th>폰툰형<\/th><\/tr><\/thead><tbody>\n<tr><td>작동<\/td><td>2~4 패널을 유압으로 접어 해치 끝 보관<\/td><td>크레인으로 패널을 들어 옮김<\/td><\/tr>\n<tr><td>장점<\/td><td>빠름, 자체 개폐<\/td><td>단순·경량·저비용<\/td><\/tr>\n<tr><td>단점<\/td><td>유압·경첩 정비, 비용<\/td><td>크레인 필요<\/td><\/tr>\n<tr><td>적용<\/td><td>일반화물·다목적선<\/td><td>컨테이너선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 설계하중(UR S21)과 가스켓·클리트 풍우밀성 확보가 공통 핵심이며, 호스·초음파 시험으로 확인함.<\/p><\/div><\/section><\/details>"},{"id":"bilge-well","p":9,"n":"9.4","h":"빌지웰(Bilge Well)","t":"빌지웰(Bilge Well)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 6번 · 10점"],"q":["<b>115회(2018) 1-6<\/b> 빌지웰(Bilge well)"],"k":"빌지웰은 화물창·기관실 바닥에 고이는 물(빌지)을 모아 빌지 흡입관으로 뽑아낼 수 있도록 이중저 내저판을 오목하게 만든 집수정이다.","x":"\n<p class=\"key\">빌지웰은 화물창·기관실 바닥에 고이는 물(빌지)을 모아 빌지 흡입관으로 뽑아낼 수 있도록 이중저 내저판을 오목하게 만든 집수정이다.<\/p>\n<ul>\n<li><b>위치<\/b>: 화물창 후단 좌우 구석(선박은 대개 선미 트림으로 물이 뒤로 모임), 기관실 저부.<\/li>\n<li><b>구성<\/b>: 집수정, 스트레이너(로즈 박스, 머드 박스), 흡입관(역류방지 밸브), 측심관, 덮개(화물 유입 방지 구멍판).<\/li>\n<li><b>빌지관 지름<\/b>(SOLAS·선급): 주관 d = 25 + 1.68·√(L(B + D)) mm, 지관 d = 25 + 2.16·√(C(B + D)) mm (C: 구획 길이).<\/li>\n<li><b>침수 감지<\/b>: 벌크선은 SOLAS XII/12에 따라 화물창 침수 경보(내저판 위 0.5 m와 화물창 깊이의 15% 수준 2단계)를 빌지웰 부근에 설치.<\/li>\n<li><b>설계 고려<\/b>: 내저판 구조 연속성(오목부 주위 보강), 피로·부식, 화물 잔류물 막힘 방지, 청소 접근성.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>화물창·기관실 바닥 빌지를 모아 흡입하기 위한 내저판 오목 집수정.<\/p>\n<h5>2. 구성·위치<\/h5><p>화물창 후단 좌우 구석, 스트레이너(로즈·머드 박스), 역류방지 밸브, 측심관, 덮개.<\/p>\n<div class=\"calc\">주관 d = 25 + 1.68·√(L(B+D)) mm,  지관 d = 25 + 2.16·√(C(B+D)) mm<\/div>\n<p class=\"concl\"><b>3. 의견<\/b>: 벌크선은 침수 경보(SOLAS XII/12)와 함께 배치하고, 오목부 주위 구조 연속성과 막힘 방지를 확인해야 함.<\/p><\/div><\/section><\/details>"},{"id":"pumps","p":9,"n":"9.5","h":"선박용 펌프의 형식별 특성과 주요 사용처","t":"선박용 펌프의 형식별 특성과 주요 사용처","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 2교시 4번 · 25점"],"q":["<b>115회(2018) 2-4<\/b> 선박용 펌프의 형식별 특성 및 주요 사용처"],"k":"펌프는 회전 날개로 유체에 속도를 주는 터보형(원심, 축류, 사류)과 체적을 밀어내는 용적형(왕복, 기어, 스크루, 베인)으로 나뉜다. 대유량·저양정은 터보형, 고점도·고압·자흡이 필요하면 용적형을 쓴다.","x":"\n<p class=\"key\">펌프는 회전 날개로 유체에 속도를 주는 터보형(원심, 축류, 사류)과 체적을 밀어내는 용적형(왕복, 기어, 스크루, 베인)으로 나뉜다. 대유량·저양정은 터보형, 고점도·고압·자흡이 필요하면 용적형을 쓴다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>형식<\/th><th>특성<\/th><th>주요 사용처<\/th><\/tr><\/thead><tbody>\n<tr><td>원심<\/td><td>대유량, 연속 흐름, 구조 단순. 자흡 불가(진공 프라이밍 필요), 유량-양정 곡선 운전점<\/td><td>해수·청수 냉각, 밸러스트, 소화, 화물(유조선 원심 카고펌프), 잠수식 카고펌프<\/td><\/tr>\n<tr><td>축류·사류<\/td><td>초대유량·저양정<\/td><td>대형 냉각수, 순환수, 스러스터 개념<\/td><\/tr>\n<tr><td>왕복(피스톤)<\/td><td>자흡력 우수, 고압, 맥동<\/td><td>빌지, 스트리핑, 과거 보일러 급수<\/td><\/tr>\n<tr><td>기어<\/td><td>고점도 유체, 일정 유량, 소형<\/td><td>윤활유, 연료유 이송<\/td><\/tr>\n<tr><td>스크루(2·3축)<\/td><td>맥동 적음, 고점도·고압, 저소음<\/td><td>주기 윤활유, 연료유 공급, 화물유 스트리핑, 유압<\/td><\/tr>\n<tr><td>베인<\/td><td>중압, 소형<\/td><td>유압 장치<\/td><\/tr>\n<tr><td>이젝터(eductor)<\/td><td>구동수 제트로 흡입, 가동부 없음<\/td><td>스트리핑, 비상 빌지, 탱크 세정 배출<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">원심펌프 상사법칙(인버터 절감의 근거)과 캐비테이션 방지 조건<\/div><div class=\"mj\">\\[Q\\propto n,\\quad H\\propto n^2,\\quad P\\propto n^3,\\qquad \\mathrm{NPSH}_A>\\mathrm{NPSH}_R\\]<\/div><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 분류<\/h5><p>터보형(원심·축류·사류: 속도 에너지) / 용적형(왕복·기어·스크루·베인: 체적 압출) / 기타(이젝터).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>형식<\/th><th>특성<\/th><th>사용처<\/th><\/tr><\/thead><tbody>\n<tr><td>원심<\/td><td>대유량, 자흡 불가<\/td><td>냉각수, 밸러스트, 소화, 화물<\/td><\/tr>\n<tr><td>축류·사류<\/td><td>초대유량·저양정<\/td><td>대형 냉각수<\/td><\/tr>\n<tr><td>왕복<\/td><td>자흡 우수, 고압, 맥동<\/td><td>빌지, 스트리핑<\/td><\/tr>\n<tr><td>기어<\/td><td>고점도, 일정 유량<\/td><td>윤활유, 연료 이송<\/td><\/tr>\n<tr><td>스크루<\/td><td>저맥동·고점도·저소음<\/td><td>윤활유·연료 공급, 유압<\/td><\/tr>\n<tr><td>이젝터<\/td><td>가동부 없음<\/td><td>스트리핑, 비상 빌지<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"calc\">상사법칙: Q ∝ n, H ∝ n², P ∝ n³ / 캐비테이션: NPSH_A > NPSH_R<\/div>\n<p class=\"concl\"><b>2. 결론<\/b>: 유체 점도·자흡 필요성·유량-양정으로 형식을 고르고, 원심펌프는 인버터 제어로 큰 에너지 절감이 가능함.<\/p><\/div><\/section><\/details>"},{"id":"valves","p":9,"n":"9.6","h":"밸브 특성: 글로브, 체크, 버터플라이, 감압, 다이아프램 밸브와 스팀트랩","t":"밸브 특성: 글로브, 체크, 버터플라이, 감압, 다이아프램 밸브와 스팀트랩","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 4교시 2번 · 25점"],"q":["<b>118회(2019) 4-2<\/b> 밸브 특성(글로브, 체크, 버터플라이, 감압, 다이아프램, 스팀트랩)"],"k":"밸브는 차단, 유량 조절, 역류 방지, 압력 조절, 응축수 배출 같은 기능에 맞춰 고른다.","x":"\n<p class=\"key\">밸브는 차단, 유량 조절, 역류 방지, 압력 조절, 응축수 배출 같은 기능에 맞춰 고른다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>밸브<\/th><th>구조·원리<\/th><th>특성<\/th><th>용도<\/th><\/tr><\/thead><tbody>\n<tr><td>글로브(Globe)<\/td><td>디스크가 시트에 수직으로 닫힘, S자 유로<\/td><td>유량 조절 우수, 기밀 양호, 압력손실 큼, 방향성 있음<\/td><td>증기·연료 조절, 나사식 역지 겸용(SDNR)<\/td><\/tr>\n<tr><td>체크(Check)<\/td><td>유압으로 디스크가 열리고 역류 시 닫힘(스윙, 리프트, 볼)<\/td><td>자동 역류 방지<\/td><td>펌프 토출, 빌지 흡입(역류 침수 방지), 선외 배출<\/td><\/tr>\n<tr><td>버터플라이(Butterfly)<\/td><td>원판이 축을 중심으로 90° 회전<\/td><td>소형·경량, 대구경, 압력손실 작음, 원격 구동 쉬움<\/td><td>밸러스트·화물·해수 대구경 관<\/td><\/tr>\n<tr><td>감압(Pressure reducing)<\/td><td>하류 압력을 감지해 개도를 자동 조절<\/td><td>하류 압력 일정 유지<\/td><td>증기, 압축공기, 가스연료 공급<\/td><\/tr>\n<tr><td>다이아프램(Diaphragm)<\/td><td>유연한 막이 유로를 눌러 개폐<\/td><td>유체가 작동부와 격리, 누설·오염 없음, 저압<\/td><td>부식성·위생 유체, 약품, 청수<\/td><\/tr>\n<tr><td>스팀트랩(Steam trap)<\/td><td>증기는 막고 응축수만 배출(플로트·버킷식, 온도식, 디스크식)<\/td><td>증기 손실 방지, 수격 방지<\/td><td>증기 가열관 끝단, 증기 배관 드레인<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>밸브<\/th><th>구조·원리<\/th><th>특성<\/th><th>용도<\/th><\/tr><\/thead><tbody>\n<tr><td>글로브<\/td><td>디스크가 시트에 수직, S자 유로<\/td><td>조절 우수, 손실 큼, 방향성<\/td><td>증기·연료 조절, SDNR<\/td><\/tr>\n<tr><td>체크<\/td><td>역류 시 자동 폐쇄(스윙·리프트·볼)<\/td><td>역류 방지<\/td><td>펌프 토출, 빌지 흡입, 선외 배출<\/td><\/tr>\n<tr><td>버터플라이<\/td><td>원판 90° 회전<\/td><td>경량·대구경·원격 구동<\/td><td>밸러스트·화물·해수<\/td><\/tr>\n<tr><td>감압<\/td><td>하류 압력 감지 자동 개도<\/td><td>하류압 일정<\/td><td>증기·공기·가스연료<\/td><\/tr>\n<tr><td>다이아프램<\/td><td>막이 유로 개폐<\/td><td>유체 격리·무누설·저압<\/td><td>부식성·위생 유체<\/td><\/tr>\n<tr><td>스팀트랩<\/td><td>증기는 막고 응축수만 배출<\/td><td>증기 손실·수격 방지<\/td><td>가열관 끝, 증기관 드레인<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 기능(차단·조절·역류방지·압력조절·배출)에 맞춰 선정하고, 선체 관통부 밸브는 선급의 재질·위치 요건을 따름.<\/p><\/div><\/section><\/details>"},{"id":"expansion-joint","p":9,"n":"9.7","h":"선박용 배관재 신축이음(Expansion Joint)의 종류와 특징","t":"선박용 배관재 신축이음(Expansion Joint)의 종류와 특징","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 2번 · 10점"],"q":["<b>118회(2019) 1-2<\/b> 선박용 배관재 신축이음(Expansion Joint)의 종류 및 특징"],"k":"신축이음은 온도 변화에 의한 관의 팽창·수축, 선체 굽힘에 의한 상대변위, 기기 진동을 흡수해 배관과 지지점·기기 노즐의 과대 응력을 막는다.","x":"\n<p class=\"key\">신축이음은 온도 변화에 의한 관의 팽창·수축, 선체 굽힘에 의한 상대변위, 기기 진동을 흡수해 배관과 지지점·기기 노즐의 과대 응력을 막는다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>특징<\/th><th>적용<\/th><\/tr><\/thead><tbody>\n<tr><td>벨로우즈(금속)<\/td><td>주름관이 축·횡·각 변위 흡수, 누설 없음, 고온·고압. 피로 수명·비틀림 취약<\/td><td>배기관, 증기관, 극저온 LNG 배관<\/td><\/tr>\n<tr><td>슬리브(미끄럼)형<\/td><td>내관이 외관 속에서 미끄러짐, 패킹 밀봉. 큰 축변위, 패킹 정비<\/td><td>유조선 갑판 화물관<\/td><\/tr>\n<tr><td>루프(U·Ω)형<\/td><td>관 자체 굽힘 유연성 이용, 정비 불필요, 공간 큼<\/td><td>증기관, 고온관<\/td><\/tr>\n<tr><td>고무 신축이음<\/td><td>진동·소음 차단, 경량, 내열·내유 한계<\/td><td>해수·청수 펌프 전후<\/td><\/tr>\n<tr><td>드레서형 커플링<\/td><td>고무 링 압착, 축변위·약간의 각변위<\/td><td>장대 갑판관(선체 호깅·새깅 변위)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>화재 위험 구역의 비금속 신축이음은 형식승인과 화재시험 요건을 확인하고, 극저온·고온 관은 앵커·가이드 지지점과 함께 설계한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 목적<\/h5><p>열팽창·선체 굽힘 상대변위·진동을 흡수해 배관·지지점·노즐 과응력 방지.<\/p>\n<h5>2. 종류<\/h5><ul><li>벨로우즈: 무누설·고온고압(배기관, LNG 배관), 피로 주의<\/li><li>슬리브: 큰 축변위, 패킹(유조선 갑판관)<\/li><li>루프(U·Ω): 정비 불필요, 공간 큼<\/li><li>고무: 진동 차단(해수 펌프 전후)<\/li><li>드레서 커플링: 장대 갑판관 호깅·새깅<\/li><\/ul><\/div><\/section><\/details>"},{"id":"ballast-system","p":9,"n":"9.8","h":"밸러스트 장치의 설계순서와 밸러스트 파이프 배관방식","t":"밸러스트 장치의 설계순서와 밸러스트 파이프 배관방식","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 6번 · 10점","127회 2교시 4번 · 25점"],"q":["<b>127회(2022) 1-6<\/b> 밸러스트 파이프 배관방식","<b>127회(2022) 2-4<\/b> 밸러스트 장치의 설계순서"],"k":"밸러스트 장치는 필요한 밸러스트량과 주입·배출 시간에서 펌프 용량을 정하고, 탱크 배치에 맞는 배관 방식과 관경을 결정한 뒤, 평형수처리장치(BWTS)와 원격 밸브·계측을 통합해 설계한다.","x":"\n<p class=\"key\">밸러스트 장치는 필요한 밸러스트량과 주입·배출 시간에서 펌프 용량을 정하고, 탱크 배치에 맞는 배관 방식과 관경을 결정한 뒤, 평형수처리장치(BWTS)와 원격 밸브·계측을 통합해 설계한다.<\/p>\n<h4>설계순서<\/h4>\n<ol>\n<li><b>밸러스트 조건<\/b>: 밸러스트 출항·입항, 황천 밸러스트, 화물창 밸러스트, 밸러스트 교환(D-1) 시 강도·복원성.<\/li>\n<li><b>탱크 배치·용량<\/b>: 이중저·윙·피크 탱크, 트림·횡경사·종강도 조정 능력, 유조선 분리 밸러스트(SBT).<\/li>\n<li><b>소요 시간 → 펌프 용량<\/b>: 화물 하역 시간과 동기(벌크선은 적하 속도에 맞춰 배출), 펌프 대수·용량.<\/li>\n<li><b>배관 방식·관경<\/b>: 유속 기준(흡입 측 낮게), 주관·지관 관경.<\/li>\n<li><b>펌프 양정<\/b>: 정수두 + 마찰손실, NPSH 확인. 중력 주입·배출 활용.<\/li>\n<li><b>BWTS<\/b>: 처리 용량 ≥ 펌프 유량, 필터·UV·전기분해 방식 선정, 설치 공간·전력, 역세척.<\/li>\n<li><b>밸브·계측<\/b>: 원격 유압·공압 밸브, 탱크 액위 계측, 밸브 원격조작 시스템.<\/li>\n<li><b>부대<\/b>: 스트리핑 이젝터, 공기관(충수 속도 125% 대응 단면), 씨체스트·선외 배출, 유조선은 밸러스트관이 화물탱크를 통과하지 않게 분리.<\/li>\n<\/ol>\n<h4>배관 방식<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>매니폴드(주관-지관) 방식<\/td><td>기관실 매니폴드에서 각 탱크로 독립 지관. 조작 단순, 배관량 많음<\/td><\/tr>\n<tr><td>링 메인(loop) 방식<\/td><td>선체를 따라 루프 주관, 탱크별 분기 밸브. 이중화·유연성<\/td><\/tr>\n<tr><td>덕트킬(파이프 덕트) 방식<\/td><td>이중저 중심 덕트에 주관 배치, 밸브 접근·정비 용이, 탱크 내 배관 최소<\/td><\/tr>\n<tr><td>탱크 내 배관 방식<\/td><td>탱크 안으로 관 통과, 공간 절약, 원격 밸브 필요, 부식·정비 불리<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">127-1-6<\/td><td>밸러스트 파이프 배관방식<\/td><td class=\"num\">10<\/td><td>매니폴드·링·덕트킬·탱크 내 배관 비교<\/td><\/tr>\n<tr><td class=\"num\">127-2-4<\/td><td>밸러스트 장치 설계순서<\/td><td class=\"num\">25<\/td><td>조건 → 용량 → 시간 → 펌프 → 관경 → BWTS<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 127-2-4형\">\n<h5>1. 개요<\/h5><p>밸러스트 장치는 흘수·트림·복원성·종강도를 조정하는 계통으로, 하역 시간과 BWM 협약 처리 요건을 함께 만족해야 함.<\/p>\n<h5>2. 설계순서<\/h5><ol><li>밸러스트 조건: 출·입항 밸러스트, 황천, 화물창 밸러스트, 교환 시 강도·복원성<\/li><li>탱크 배치·용량<\/li><li>주입·배출 시간 → 펌프 용량·대수(하역률과 동기)<\/li><li>배관 방식·관경(유속 기준)<\/li><li>양정·NPSH 계산, 중력 주배수 활용<\/li><li>BWTS 선정(처리용량 ≥ 펌프 유량, 방식·공간·전력)<\/li><li>원격 밸브·액위 계측·제어<\/li><li>스트리핑 이젝터, 공기관 단면, 씨체스트·배출구, 유조선 분리 배관<\/li><\/ol>\n<h5>3. 배관방식(127-1-6 대비)<\/h5><p>매니폴드식(독립 지관, 조작 단순) / 링 메인(이중화) / 덕트킬(밸브 접근 용이) / 탱크 내 배관(공간 절약, 원격 밸브 필요)<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: BWTS가 펌프 유량과 압력손실을 좌우하므로, 개조선은 BWTS 처리용량이 하역 시간 제약이 되지 않는지 먼저 확인해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"cargo-pumping","p":9,"n":"9.9","h":"액체화물 펌핑시스템의 종류·구성품과 스트리핑 펌프","t":"액체화물 펌핑시스템의 종류·구성품과 스트리핑 펌프","c":2,"r":2,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 5번 · 10점","130회 1교시 6번 · 10점"],"q":["<b>130회(2023) 1-5<\/b> 스트리핑 펌프(Stripping Pump)","<b>130회(2023) 1-6<\/b> 액체카고 펌핑시스템의 종류 및 구성품"],"k":"액체화물 펌핑은 펌프실에 원심 화물펌프를 모은 중앙 펌프실 방식과, 탱크마다 잠수식 펌프를 둔 딥웰(submerged) 방식으로 나뉜다. 주 펌프가 흡입을 잃은 뒤 남는 잔류 화물은 스트리핑 펌프(용적형·이젝터)로 빼낸다.","x":"\n<p class=\"key\">액체화물 펌핑은 펌프실에 원심 화물펌프를 모은 중앙 펌프실 방식과, 탱크마다 잠수식 펌프를 둔 딥웰(submerged) 방식으로 나뉜다. 주 펌프가 흡입을 잃은 뒤 남는 잔류 화물은 스트리핑 펌프(용적형·이젝터)로 빼낸다.<\/p>\n<h4>종류<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>구성<\/th><th>특징·적용<\/th><\/tr><\/thead><tbody>\n<tr><td>중앙 펌프실<\/td><td>증기터빈·전동 원심 화물펌프(대개 3대), 스트리핑 펌프, 밸러스트 펌프, 진공 스트리핑 장치<\/td><td>원유선. 대용량, 펌프실 위험구역(가스 탐지·환기)<\/td><\/tr>\n<tr><td>딥웰(유압 구동)<\/td><td>탱크마다 유압 구동 잠수 펌프(Framo 등), 유압 동력팩<\/td><td>케미컬·제품유선. 화물 분리 완벽, 펌프실 없음, 스트리핑 성능 우수<\/td><\/tr>\n<tr><td>잠수식 전동<\/td><td>탱크 내 잠수 전동기 펌프(화물이 냉각·윤활)<\/td><td>LNG·LPG선, 스프레이 펌프·비상 펌프 별도<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>구성품<\/h4>\n<ul>\n<li>화물펌프, 스트리핑 펌프·이젝터, 화물 배관(저부 주관, 크로스오버, 드롭 라인, 매니폴드), 버터플라이 밸브·원격 제어.<\/li>\n<li>안전: PV 밸브·고속 배출 벤트, 불활성가스(IGS), 원유세정(COW) 장치, 고액위·과충전 경보, 비상차단(ESD).<\/li>\n<li>계측: 레이더 액위계, 온도·압력 센서, 화물 가열 코일.<\/li>\n<\/ul>\n<h4>스트리핑 펌프<\/h4>\n<ul>\n<li>원심 화물펌프는 액위가 낮아지면 공기 흡입으로 흡입을 잃는다. 이때 탱크 바닥·배관의 잔류 화물을 자흡력이 좋은 왕복·스크루 펌프나 이젝터로 빼낸다.<\/li>\n<li>MARPOL Annex II: 2007년 이후 건조 케미컬선은 탱크당 잔류량 75 L 이하(스트리핑 시험으로 확인).<\/li>\n<li>잔류량 감소는 화물 손실과 세정수·오염 감소에 직결.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점, 같은 회차)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">130-1-5<\/td><td>스트리핑 펌프<\/td><td>필요 이유·형식·MARPOL 잔류량<\/td><\/tr>\n<tr><td class=\"num\">130-1-6<\/td><td>액체카고 펌핑시스템 종류·구성품<\/td><td>중앙 펌프실·딥웰·잠수식 비교<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 130-1-5\">\n<h5>1. 정의<\/h5><p>원심 화물펌프가 흡입을 잃은 뒤 탱크 바닥·배관의 잔류 화물을 빼내는 펌프.<\/p>\n<h5>2. 형식<\/h5><p>자흡력 좋은 왕복·스크루 펌프, 이젝터, 진공 스트리핑 장치.<\/p>\n<h5>3. 규정<\/h5><p>MARPOL Annex II: 2007년 이후 건조 케미컬선 탱크당 잔류량 75 L 이하(스트리핑 시험).<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 잔류량 감소는 화물 손실·세정수·오염 감소로 직결되며, 딥웰 펌프 선박은 스트리핑 성능이 우수함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 130-1-6\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>구성<\/th><th>적용<\/th><\/tr><\/thead><tbody>\n<tr><td>중앙 펌프실<\/td><td>터빈·전동 원심펌프 3대, 스트리핑, 밸러스트 펌프<\/td><td>원유선<\/td><\/tr>\n<tr><td>딥웰(유압)<\/td><td>탱크별 잠수 펌프 + 유압 동력팩<\/td><td>케미컬·제품유선<\/td><\/tr>\n<tr><td>잠수식 전동<\/td><td>탱크 내 전동 펌프, 스프레이·비상 펌프<\/td><td>LNG·LPG선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>공통 구성품: 화물 배관·매니폴드·버터플라이 밸브, PV 밸브, IGS, COW, 액위계·과충전 경보, ESD.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"cargo-handling","p":9,"n":"9.10","h":"벌크선·Ro/Ro선·유조선·LNG선의 하역장치 종류와 특성","t":"벌크선·Ro/Ro선·유조선·LNG선의 하역장치 종류와 특성","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 3교시 2번 · 25점"],"q":["<b>136회(2025) 3-2<\/b> 벌크선·Ro/Ro선·유조선·LNG선의 하역장치 종류와 특성"],"k":"하역장치는 화물 형태에 맞춘다. 벌크는 주로 육상 설비와 선상 크레인·그랩, Ro/Ro는 램프와 리프트로 차량이 스스로 이동, 유조선과 LNG선은 펌프와 배관으로 액체를 이송한다.","x":"\n<p class=\"key\">하역장치는 화물 형태에 맞춘다. 벌크는 주로 육상 설비와 선상 크레인·그랩, Ro/Ro는 램프와 리프트로 차량이 스스로 이동, 유조선과 LNG선은 펌프와 배관으로 액체를 이송한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>선종<\/th><th>하역장치<\/th><th>특성<\/th><\/tr><\/thead><tbody>\n<tr><td>벌크선<\/td><td>대형선은 육상 적하기·언로더(그랩, 연속식), 핸디·수프라막스급은 갑판 크레인(30~36 t) + 그랩, 자가하역선은 벨트 컨베이어·붐<\/td><td>그랩 충격으로 내저판·호퍼 손상 → 내저판 두께 여유(GRAB 표기), 해치커버 개폐 연계<\/td><\/tr>\n<tr><td>Ro/Ro·PCTC<\/td><td>선미·측면(쿼터) 램프, 내부 램프, 승강식 차량갑판, 리프트, 수밀 문<\/td><td>차량 자주 하역으로 빠름, 램프 강도·축하중, 수밀성 관리, 화재 위험(전기차)<\/td><\/tr>\n<tr><td>유조선<\/td><td>화물펌프·스트리핑, 매니폴드, 호스 핸들링 크레인, COW, IGS, 가열<\/td><td>펌프 능력과 육상 배관 저항으로 하역률 결정, 폭발 방지 설비<\/td><\/tr>\n<tr><td>LNG선<\/td><td>탱크별 잠수식 화물펌프(2대), 스프레이 펌프, 증발가스 압축기(HD/LD), 기화기, 매니폴드·ESD 링크<\/td><td>극저온, 증발가스 처리, 선박-육상 ESD, 냉각 절차<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>선종<\/th><th>하역장치<\/th><th>특성<\/th><\/tr><\/thead><tbody>\n<tr><td>벌크선<\/td><td>육상 적하기·언로더, 갑판 크레인 + 그랩, 자가하역<\/td><td>그랩 충격 → 내저판 여유(GRAB 표기)<\/td><\/tr>\n<tr><td>Ro/Ro<\/td><td>선미·측면 램프, 내부 램프, 승강 갑판, 리프트<\/td><td>빠름, 램프 강도·축하중, 화재 위험<\/td><\/tr>\n<tr><td>유조선<\/td><td>화물펌프·스트리핑, 매니폴드, 호스 크레인, COW, IGS<\/td><td>폭발 방지, 하역률은 펌프·배관 저항<\/td><\/tr>\n<tr><td>LNG선<\/td><td>잠수 화물펌프, 스프레이 펌프, 압축기, 기화기, ESD<\/td><td>극저온, BOG 처리<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 하역장치는 화물 형태와 항만 인프라에 맞춰 선택하며, 하역 시간이 선박 회전율과 수익을 좌우함.<\/p><\/div><\/section><\/details>"},{"id":"hvac","p":9,"n":"9.11","h":"HVAC: 통풍·냉난방장치 설계 고려사항과 거주구 덕트 배치·덕트 사이즈 결정","t":"HVAC: 통풍·냉난방장치 설계 고려사항과 거주구 덕트 배치·덕트 사이즈 결정","c":3,"r":3,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 3교시 3번 · 25점","133회 1교시 5번 · 10점","139회 1교시 11번 · 10점"],"q":["<b>130회(2023) 3-3<\/b> 거주구 덕트 배치 시 고려사항과 덕트 사이즈 결정과정","<b>133회(2024) 1-5<\/b> HVAC","<b>139회(2026) 1-11<\/b> 선박 통풍 및 냉난방장치(HVAC) 설계 시 고려사항"],"k":"선박 HVAC는 설계 외기 조건(ISO 7547)에서 거주구의 온습도와 신선공기량을 확보하고, 방화 구획을 지키며, 소음·에너지·정비를 고려해 설계한다. 덕트는 풍량을 정한 뒤 허용 풍속과 압력손실로 크기를 결정하고, 구조·방화 경계와 충돌하지 않게 배치한다.","x":"\n<p class=\"key\">선박 HVAC는 설계 외기 조건(ISO 7547)에서 거주구의 온습도와 신선공기량을 확보하고, 방화 구획을 지키며, 소음·에너지·정비를 고려해 설계한다. 덕트는 풍량을 정한 뒤 허용 풍속과 압력손실로 크기를 결정하고, 구조·방화 경계와 충돌하지 않게 배치한다.<\/p>\n<h4>설계 고려사항<\/h4>\n<ul>\n<li><b>설계 조건<\/b>: ISO 7547 — 하절 외기 35 °C/70%, 실내 27 °C/50%, 동절 외기 −20 °C, 실내 22 °C. 항로에 따라 선주 사양 조정.<\/li>\n<li><b>열부하<\/b>: 외피 전도, 일사, 재실자, 조명·기기, 신선공기 부하.<\/li>\n<li><b>신선공기<\/b>: 재실자당 최소 외기량, 화장실·조리실은 부압 배기.<\/li>\n<li><b>방식<\/b>: 중앙 단일덕트(재열기 구역 제어), 이중덕트, 가변풍량(VAV), 개별 팬코일.<\/li>\n<li><b>방화<\/b>: A·B급 경계 관통부 방화 댐퍼, 주수직구역 경계, 조리실 배기 덕트 그리스 트랩·방화 댐퍼(SOLAS II-2/9.7), 기관구역·거주구 계통 분리.<\/li>\n<li><b>소음<\/b>: 덕트 풍속 제한, 소음기, 팬 탄성 지지(소음 코드 한도).<\/li>\n<li><b>에너지·환경<\/b>: 열회수 장치, 인버터 팬, 냉매 규제(HCFC 금지, 저GWP 냉매).<\/li>\n<li><b>정비·위생<\/b>: 필터 교체·덕트 청소 접근, 응축수 배수.<\/li>\n<li>기관실 환기(ISO 8861), 위험물 화물창 기계환기(시간당 6회 환기) 등은 별도 계통.<\/li>\n<\/ul>\n<h4>덕트 배치 고려사항<\/h4>\n<ul>\n<li>천장 공간 확보: 갑판 높이, 갑판보·거더 관통 최소화(구조 보강 필요 시 사전 협의).<\/li>\n<li>방화 경계 관통 최소화, 계단·탈출로 상부 회피.<\/li>\n<li>배관·케이블 트레이와 층 구분(간섭 검토, 3D 모델).<\/li>\n<li>균등 분배를 위한 대칭 배치, 리턴·배기 경로 확보.<\/li>\n<\/ul>\n<h4>덕트 사이즈 결정 과정<\/h4>\n<ol>\n<li>구역별 열부하·환기 요구로 실별 풍량 산정.<\/li>\n<li>덕트 계통도 작성(주덕트·분기·말단).<\/li>\n<li>허용 풍속 설정: 고속 방식 주덕트 대략 15~20 m/s(소음기 필요), 저속 방식·분기 5~10 m/s, 말단 디퓨저 저속.<\/li>\n<li>등마찰법 또는 정압재취득법으로 단면 결정(Q = A·V).<\/li>\n<li>최원 경로 압력손실(직관 + 국부) 계산 → 팬 정압 선정.<\/li>\n<li>댐퍼로 풍량 균형, 소음 검토, 보온(결로 방지) 두께 반영해 외형 치수 확정.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">133-1-5<\/td><td>HVAC<\/td><td class=\"num\">10<\/td><td>정의·구성·설계 조건<\/td><\/tr>\n<tr><td class=\"num\">139-1-11<\/td><td>HVAC 설계 시 고려사항<\/td><td class=\"num\">10<\/td><td>조건·방화·소음·에너지<\/td><\/tr>\n<tr><td class=\"num\">130-3-3<\/td><td>덕트 배치 고려사항과 덕트 사이즈 결정<\/td><td class=\"num\">25<\/td><td>풍량 → 풍속 → 등마찰법 → 팬 선정 흐름<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 133·139회형\">\n<h5>1. 정의<\/h5>\n<p>HVAC: 난방·환기·공조로 거주구의 온습도와 신선공기를 유지하는 설비. 공조기(AHU), 덕트, 재열기, 디퓨저, 냉동기로 구성.<\/p>\n<h5>2. 설계 고려사항<\/h5>\n<ol><li>설계 조건(ISO 7547): 하절 외기 35 °C/70% → 실내 27 °C/50%, 동절 −20 °C → 22 °C<\/li>\n<li>열부하(전도·일사·인원·조명·외기)와 신선공기량<\/li>\n<li>방화: A·B급 관통부 방화 댐퍼, 조리실 배기 그리스 트랩<\/li>\n<li>소음: 덕트 풍속 제한·소음기(IMO 소음 코드)<\/li>\n<li>에너지: 열회수, 인버터 팬, 저GWP 냉매<\/li><\/ol>\n<p class=\"concl\"><b>3. 의견<\/b>: 덕트는 천장 공간과 구조 관통을 좌우하므로 구조·배관과 3D 통합 설계가 필요함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 130회형(덕트 배치·사이즈)\">\n<h5>1. 개요<\/h5>\n<p>거주구 덕트는 필요 풍량을 소음 한도 안의 풍속으로 운반하면서, 방화 구획·구조 부재·타 의장과 충돌하지 않게 배치해야 함.<\/p>\n<h5>2. 배치 고려사항<\/h5>\n<ul><li>천장 공간(갑판 높이·보 깊이), 구조 관통 최소화(보강 사전 협의)<\/li>\n<li>방화 경계 관통 최소화(방화 댐퍼), 탈출로 상부 회피<\/li>\n<li>배관·케이블 트레이와 층 구분, 3D 간섭 검토<\/li>\n<li>균등 분배를 위한 대칭 배치, 리턴·배기 경로, 화장실·조리실 부압<\/li>\n<li>정비 접근(댐퍼·필터), 결로 방지 보온<\/li><\/ul>\n<h5>3. 덕트 사이즈 결정 과정<\/h5>\n<ol><li>구역별 열부하·환기 요구 → 실별 풍량 Q<\/li>\n<li>계통도 작성(주덕트·분기·말단)<\/li>\n<li>허용 풍속 설정(고속 방식 주덕트 약 15~20 m/s, 분기 5~10 m/s, 말단 저속)<\/li>\n<li>단면 결정: A = Q / V, 등마찰법 또는 정압재취득법<\/li>\n<li>최원 경로 압력손실(직관 + 국부) → 팬 정압·풍량 선정<\/li>\n<li>댐퍼로 풍량 균형, 소음 검토(소음기), 보온 두께 포함 외형 치수 확정<\/li><\/ol>\n<div class=\"calc\">예) 객실 열부하 1.0 kW, ΔT = 10 K → Q = q/(ρ·cp·ΔT) = 1.0/(1.2×1.005×10) ≈ 0.083 m³/s\n    분기 풍속 6 m/s → A = 0.083/6 ≈ 0.014 m² → 원형 덕트 약 φ135 mm<\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 덕트 사이즈는 소음과 공간의 절충이며, 고속 방식은 공간을 줄이는 대신 소음기·팬 동력이 늘어나므로 선종(여객선 vs 화물선)에 맞게 방식을 선택해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"pid","p":9,"n":"9.12","h":"P&amp;ID(Piping and Instrumentation Diagram)","t":"P&ID(Piping and Instrumentation Diagram)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 5번 · 10점"],"q":["<b>124회(2021) 1-5<\/b> P&amp;ID"],"k":"P&ID는 배관, 기기, 밸브, 계측기, 제어 루프, 경보·차단 신호를 표준 기호로 나타낸 계통도로, 공정 설계의 기준 문서다. 시공·시운전·운전·정비와 위험성 검토(HAZOP)의 공통 언어가 된다.","x":"\n<p class=\"key\">P&amp;ID는 배관, 기기, 밸브, 계측기, 제어 루프, 경보·차단 신호를 표준 기호로 나타낸 계통도로, 공정 설계의 기준 문서다. 시공·시운전·운전·정비와 위험성 검토(HAZOP)의 공통 언어가 된다.<\/p>\n<ul>\n<li><b>표시 내용<\/b>: 라인 번호·관경·재질 등급, 기기 번호·사양, 밸브 형식·상태(상시 개/폐), 계측 태그(ISA 기호: 압력·온도·유량·액위 지시·제어·경보), 제어 루프, 연동(인터록), 안전밸브, 열추적·보온, 경계(공급 범위).<\/li>\n<li><b>PFD와 구분<\/b>: PFD는 공정 흐름과 물질수지 중심, P&amp;ID는 실제 시공 가능한 상세.<\/li>\n<li><b>선박 적용<\/b>: 연료유·LNG 연료가스·화물·냉각 계통도, 선급 승인 도면, 시운전 체크리스트 기반, 해양플랜트에서 특히 엄격.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>배관·기기·밸브·계측기·제어 루프·경보·차단을 표준 기호로 나타낸 계통도.<\/p>\n<h5>2. 표시 내용<\/h5><p>라인 번호·관경·재질, 기기 번호, 밸브 상태, 계측 태그(ISA), 인터록, 안전밸브.<\/p>\n<h5>3. 용도<\/h5><p>설계 기준, 시공·시운전·정비, HAZOP, 선급 승인(연료·LNG·화물 계통). PFD는 공정 흐름 중심, P&amp;ID는 시공 상세.<\/p><\/div><\/section><\/details>"},{"id":"echo-sounder","p":9,"n":"9.13","h":"음향측심기(Echo Sounder)","t":"음향측심기(Echo Sounder)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 3번 · 10점"],"q":["<b>124회(2021) 1-3<\/b> 음향측심기(Echo Sounder)"],"k":"음향측심기는 선저 송수파기에서 음파 펄스를 해저로 보내고 반사파가 돌아오는 시간으로 수심을 재는 항해장비다. 수심 d = c·t/2 (c: 수중 음속 약 1,500 m/s).","x":"\n<p class=\"key\">음향측심기는 선저 송수파기에서 음파 펄스를 해저로 보내고 반사파가 돌아오는 시간으로 수심을 재는 항해장비다. 수심 d = c·t/2 (c: 수중 음속 약 1,500 m/s).<\/p>\n<ul>\n<li><b>구성<\/b>: 송수파기(transducer, 수십~수백 kHz), 송수신부, 표시·기록부.<\/li>\n<li><b>요건<\/b>: SOLAS V/19 — 300 GT 이상 선박과 모든 여객선에 비치, IMO 성능기준(수심 범위, 기록 보존, 경보).<\/li>\n<li><b>오차 요인<\/b>: 수온·염분에 따른 음속 변화, 흘수 보정, 기포(aeration), 경사 해저·다중 반사, 선체 소음.<\/li>\n<li><b>설치<\/b>: 선수부 선저의 기포가 적은 곳, 송수파기 탱크(cofferdam) 수밀, 프로펠러·스러스터 소음원과 이격.<\/li>\n<li>다중빔 측심기는 해저 지형 조사, 도플러 선속계와 함께 정박·접안 지원에 쓰인다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 원리<\/h5><div class=\"calc\">수심 d = c·t / 2  (c ≈ 1,500 m/s)<\/div>\n<h5>2. 구성·요건<\/h5><p>송수파기, 송수신부, 표시·기록부. SOLAS V/19: 300 GT 이상·모든 여객선.<\/p>\n<h5>3. 오차·설치<\/h5><p>음속 변화(수온·염분), 흘수 보정, 기포, 다중 반사 / 선수부 기포 적은 선저, 송수파기 탱크 수밀.<\/p><\/div><\/section><\/details>"},{"id":"mgps","p":9,"n":"9.14","h":"MGPS(Marine Growth Preventing System)","t":"MGPS(Marine Growth Preventing System)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 3번 · 25점"],"q":["<b>115회(2018) 4-3<\/b> MGPS(Marine Growth Preventing System)"],"k":"MGPS는 씨체스트·해수 스트레이너에 구리 양극과 알루미늄(또는 철) 양극을 넣고 전류를 흘려 미량의 이온을 해수에 녹여, 해수 배관·냉각기 안에 조개·따개비 같은 해양생물이 붙지 못하게 하는 장치다.","x":"\n<p class=\"key\">MGPS는 씨체스트·해수 스트레이너에 구리 양극과 알루미늄(또는 철) 양극을 넣고 전류를 흘려 미량의 이온을 해수에 녹여, 해수 배관·냉각기 안에 조개·따개비 같은 해양생물이 붙지 못하게 하는 장치다.<\/p>\n<ul>\n<li><b>원리<\/b>: 구리 이온은 유생 부착을 억제하고, 알루미늄(철) 이온은 수산화물 피막을 만들어 관 내면 부식을 줄인다. 제어반에서 해수 유량에 맞춰 전류 조절.<\/li>\n<li><b>효과<\/b>: 해수관·열교환기 막힘 방지, 냉각 성능 유지, 정비 감소.<\/li>\n<li><b>대안<\/b>: 해수 전기분해 차아염소산 발생(해양플랜트 대용량), 초음파 방오.<\/li>\n<li><b>관리<\/b>: 양극 소모 교체(도킹), 전류 기록, 구리 방출 환경 규제 확인.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>씨체스트·스트레이너에 구리·알루미늄(철) 양극을 두고 전류로 이온을 방출해 해수계통 해양생물 부착을 막는 장치.<\/p>\n<h5>2. 원리<\/h5><ul><li>구리 이온: 유생 부착 억제<\/li><li>알루미늄·철 이온: 수산화물 피막으로 관 내면 부식 억제<\/li><li>제어반이 해수 유량에 맞춰 전류 조절<\/li><\/ul>\n<h5>3. 효과<\/h5><p>해수관·열교환기 막힘 방지, 냉각 성능 유지, 정비 감소.<\/p>\n<h5>4. 대안·관리<\/h5><p>전기분해 차아염소산(해양플랜트), 초음파 / 양극 교체, 전류 기록, 구리 방출 규제.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 냉각 성능 저하는 기관 출력 제한으로 이어지므로 MGPS는 저비용 필수 설비이며, 생물오손 관리(틈새 부위)와 연계됨.<\/p><\/div><\/section><\/details>"},{"id":"maintainability","p":9,"n":"9.15","h":"의장설계 시 정비효율성과 작업안전성을 고려한 설계방안","t":"의장설계 시 정비효율성과 작업안전성을 고려한 설계방안","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 6번 · 25점"],"q":["<b>115회(2018) 3-6<\/b> 의장설계 시 정비효율성과 작업안전성을 고려한 설계방안"],"k":"운항 중 정비와 작업의 상당 부분은 설계 단계의 배치로 결정된다. 정비 공간·인양 수단·접근 통로를 설계에 넣고, 위험원(고온, 회전체, 밀폐공간, 추락)을 설계로 제거하는 것이 원칙이다.","x":"\n<p class=\"key\">운항 중 정비와 작업의 상당 부분은 설계 단계의 배치로 결정된다. 정비 공간·인양 수단·접근 통로를 설계에 넣고, 위험원(고온, 회전체, 밀폐공간, 추락)을 설계로 제거하는 것이 원칙이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>설계방안<\/th><\/tr><\/thead><tbody>\n<tr><td>정비 공간<\/td><td>열교환기 튜브·피스톤·로터 인출 공간, 필터 교체 공간을 3D 모델에 예약 체적으로 표시<\/td><\/tr>\n<tr><td>인양·운반<\/td><td>기관실 천장 크레인·레일, 인양 러그, 반출 경로와 해치, 부품 이동 동선<\/td><\/tr>\n<tr><td>접근성<\/td><td>밸브 조작 높이(손이 닿는 범위), 플랫폼·사다리·난간, 계측기 판독 위치, 탱크·공소 영구접근설비(SOLAS II-1/3-6 PMA)<\/td><\/tr>\n<tr><td>격리·이중화<\/td><td>기기별 차단 밸브로 운전 중 정비, 주요 펌프 예비기, 바이패스<\/td><\/tr>\n<tr><td>안전<\/td><td>고온부 보온·차폐, 회전체 가드, 미끄럼 방지 바닥, 조명, 비상 탈출로, 밀폐공간 수 최소화와 환기 설비<\/td><\/tr>\n<tr><td>인간공학<\/td><td>작업 자세, 표지·색 구분, 소음 구역 분리<\/td><\/tr>\n<tr><td>표준화·감시<\/td><td>부품 표준화(예비품 감소), 상태 기반 정비(CBM) 센서, 원격 감시<\/td><\/tr>\n<tr><td>검증<\/td><td>VR 정비성 검토, 선주·승무원 설계 리뷰<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>운항 중 정비·작업 안전은 설계 배치로 결정되므로, 정비 공간·인양·접근을 설계에 넣고 위험원을 설계로 제거해야 함.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>설계방안<\/th><\/tr><\/thead><tbody>\n<tr><td>정비 공간<\/td><td>튜브·피스톤·로터 인출 공간 3D 예약<\/td><\/tr>\n<tr><td>인양·운반<\/td><td>천장 크레인·레일, 러그, 반출 경로<\/td><\/tr>\n<tr><td>접근성<\/td><td>밸브 높이, 플랫폼·사다리·난간, PMA<\/td><\/tr>\n<tr><td>격리·이중화<\/td><td>기기별 차단밸브, 예비기, 바이패스<\/td><\/tr>\n<tr><td>안전<\/td><td>고온부 보온, 회전체 가드, 조명, 탈출로, 밀폐공간 최소화<\/td><\/tr>\n<tr><td>인간공학·표준화<\/td><td>표지·색 구분, 표준 부품, CBM 센서<\/td><\/tr>\n<tr><td>검증<\/td><td>VR 정비성 검토, 승무원 리뷰<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 정비성은 운항 비용과 사고율을 좌우하므로 설계 검토 항목으로 공식화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"igc","p":10,"n":"10.1","h":"IGC Code","t":"IGC Code","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 9번 · 10점"],"q":["<b>115회(2018) 1-9<\/b> IGC Code"],"k":"IGC Code(International Code for the Construction and Equipment of Ships Carrying Liquefied Gases in Bulk)는 액화가스 산적 운반선의 구조·설비 기준으로, SOLAS VII Part C로 강제된다. 현행 개정판(MSC.370(93))은 2016년 7월 1일 이후 용골 거치 선박에 적용된다.","x":"\n<p class=\"key\">IGC Code(International Code for the Construction and Equipment of Ships Carrying Liquefied Gases in Bulk)는 액화가스 산적 운반선의 구조·설비 기준으로, SOLAS VII Part C로 강제된다. 현행 개정판(MSC.370(93))은 2016년 7월 1일 이후 용골 거치 선박에 적용된다.<\/p>\n<h4>적용 대상<\/h4>\n<p>37.8 °C에서 증기압이 0.28 MPa(절대압)를 넘는 액화가스와 Chapter 19에 열거된 제품(LNG, LPG, 에틸렌, 암모니아, CO₂ 등).<\/p>\n<h4>주요 구성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>2 선박 생존능력·화물탱크 위치<\/td><td>선형 1G(가장 위험한 화물), 2G, 2PG, 3G. 1G는 선측에서 B/5 또는 11.5 m 안쪽, 2G·3G는 760 mm 이상<\/td><\/tr>\n<tr><td>3 선박 배치<\/td><td>화물구역 격리(코퍼댐), 에어로크, 출입구 위치<\/td><\/tr>\n<tr><td>4 화물 격납<\/td><td>독립형 Type A·B·C, 멤브레인, 2차 방벽, 설계하중·재료·피로<\/td><\/tr>\n<tr><td>5~6 배관·재료<\/td><td>저온 재료(9% Ni, 스테인리스, 알루미늄, 고망간강), 용접·시험<\/td><\/tr>\n<tr><td>7~9 압력·온도 제어, 배기, 환경 제어<\/td><td>BOG 처리(재액화, 연소), PRV, 불활성화<\/td><\/tr>\n<tr><td>10~13 전기·방화·환기·계측<\/td><td>위험구역, 고정식 소화(건조 분말, 물분무), 가스 탐지<\/td><\/tr>\n<tr><td>15 충전한도<\/td><td>FL 98%, 적재한도 LL<\/td><\/tr>\n<tr><td>16 화물의 연료 사용<\/td><td>BOG를 연료로 쓰는 조건<\/td><\/tr>\n<tr><td>17·19 특별요건·제품 목록<\/td><td>독성·부식성 화물별 추가 요건<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>가스 연료 추진선(화물이 아닌 연료)은 별도로 IGF Code가 적용된다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>액화가스 산적 운반선의 구조·설비 국제 기준, SOLAS VII Part C로 강제. 개정판(MSC.370(93))은 2016.7.1 이후 용골 거치선.<\/p>\n<h5>2. 적용<\/h5><p>37.8 °C 증기압 0.28 MPa(절대) 초과 액화가스와 19장 제품(LNG, LPG, 암모니아, CO₂ 등).<\/p>\n<h5>3. 주요 내용<\/h5><p>선형 1G·2G·2PG·3G와 탱크 위치, 화물 격납(Type A·B·C·멤브레인, 2차 방벽), 재료, 압력·온도 제어, 환경 제어, 방화·가스 탐지, 충전한도(15장), 화물 연료 사용(16장), 특별요건(17장).<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 가스 연료 추진은 별도로 IGF Code를 적용함.<\/p><\/div><\/section><\/details>"},{"id":"imo-tank-types","p":10,"n":"10.2","h":"IMO 화물탱크 형식: 독립형 Type A, B, C와 멤브레인","t":"IMO 화물탱크 형식: 독립형 Type A, B, C와 멤브레인","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 10번 · 10점"],"q":["<b>139회(2026) 1-10<\/b> IMO 독립형 탱크 Type A, B, C의 구조 스케치 및 차이점"],"k":"IGC는 탱크를 설계 방법과 2차 방벽 요구로 구분한다. Type A는 고전적 구조해석에 완전 2차 방벽, Type B는 정밀 해석(피로·균열진전)으로 \"누설 전 파단 없음\"을 입증해 부분 2차 방벽, Type C는 압력용기 기준으로 설계해 2차 방벽이 없다. 멤브레인은 선체가 하중을 받고 얇은 막이 기밀만 맡으며 완전 2차 방벽이 필요하다.","x":"\n<p class=\"key\">IGC는 탱크를 설계 방법과 2차 방벽 요구로 구분한다. Type A는 고전적 구조해석에 완전 2차 방벽, Type B는 정밀 해석(피로·균열진전)으로 \"누설 전 파단 없음\"을 입증해 부분 2차 방벽, Type C는 압력용기 기준으로 설계해 2차 방벽이 없다. 멤브레인은 선체가 하중을 받고 얇은 막이 기밀만 맡으며 완전 2차 방벽이 필요하다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 560 190\" role=\"img\" aria-label=\"IMO 탱크 형식 스케치\">\n<g>\n<rect x=\"10\" y=\"20\" width=\"120\" height=\"120\" class=\"fw\"/><rect x=\"24\" y=\"34\" width=\"92\" height=\"92\" class=\"fa\"/><text x=\"70\" y=\"84\" text-anchor=\"middle\" class=\"t2\">각형 독립<\/text>\n<text x=\"70\" y=\"160\" text-anchor=\"middle\" class=\"t1\">Type A<\/text><text x=\"70\" y=\"176\" text-anchor=\"middle\" class=\"t2\">완전 2차 방벽(선체)<\/text>\n<\/g><g>\n<rect x=\"150\" y=\"20\" width=\"120\" height=\"120\" class=\"fw\"/><circle cx=\"210\" cy=\"80\" r=\"46\" class=\"fa\"/><path d=\"M168 132 h84\" class=\"lr\"/><text x=\"210\" y=\"84\" text-anchor=\"middle\" class=\"t2\">구형/각형<\/text>\n<text x=\"210\" y=\"160\" text-anchor=\"middle\" class=\"t1\">Type B<\/text><text x=\"210\" y=\"176\" text-anchor=\"middle\" class=\"t2\">부분 2차 방벽(드립트레이)<\/text>\n<\/g><g>\n<rect x=\"290\" y=\"20\" width=\"120\" height=\"120\" class=\"fw\"/><rect x=\"305\" y=\"50\" width=\"90\" height=\"60\" rx=\"30\" class=\"fa\"/><text x=\"350\" y=\"84\" text-anchor=\"middle\" class=\"t2\">압력용기<\/text>\n<text x=\"350\" y=\"160\" text-anchor=\"middle\" class=\"t1\">Type C<\/text><text x=\"350\" y=\"176\" text-anchor=\"middle\" class=\"t2\">2차 방벽 없음<\/text>\n<\/g><g>\n<rect x=\"430\" y=\"20\" width=\"120\" height=\"120\" class=\"fw\"/><rect x=\"438\" y=\"28\" width=\"104\" height=\"104\" class=\"fr\" style=\"opacity:.5\"/><rect x=\"446\" y=\"36\" width=\"88\" height=\"88\" class=\"fa\"/><text x=\"490\" y=\"84\" text-anchor=\"middle\" class=\"t2\">막+단열<\/text>\n<text x=\"490\" y=\"160\" text-anchor=\"middle\" class=\"t1\">Membrane<\/text><text x=\"490\" y=\"176\" text-anchor=\"middle\" class=\"t2\">완전 2차 방벽<\/text>\n<\/g><\/svg><\/figure>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>형식<\/th><th>설계 방법<\/th><th>설계증기압<\/th><th>2차 방벽<\/th><th>대표 적용<\/th><\/tr><\/thead><tbody>\n<tr><td>Type A<\/td><td>고전적 구조해석(선급 규칙 방식)<\/td><td>0.07 MPa 미만<\/td><td>완전(−55 °C 이하 화물)<\/td><td>완전냉각식 LPG선(VLGC), 암모니아<\/td><\/tr>\n<tr><td>Type B<\/td><td>정밀 해석: 3D FE, 피로·균열진전, leak-before-failure<\/td><td>0.07 MPa 미만<\/td><td>부분(드립트레이, 스프레이 실드)<\/td><td>Moss 구형 LNG선, SPB 각형(LNG선·FSRU·연료탱크)<\/td><\/tr>\n<tr><td>Type C<\/td><td>압력용기 기준, p<sub>0<\/sub> ≥ 0.2 + A·C·(ρ<sub>r<\/sub>)<sup>1.5<\/sup> MPa<\/td><td>대개 0.4 MPa 이상<\/td><td>불필요<\/td><td>가압식·반냉각 LPG, 에틸렌, LCO₂, LNG 연료탱크<\/td><\/tr>\n<tr><td>멤브레인<\/td><td>얇은 막(0.7~1.2 mm Invar 또는 주름 304L)이 단열재를 거쳐 내각에 하중 전달<\/td><td>통상 0.025 MPa 이하(최대 0.07)<\/td><td>완전<\/td><td>대형 LNG선(GTT NO96, Mark III), 대형 컨테이너선 LNG 연료탱크<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>독립형은 선체와 분리되어 열수축이 자유롭고 검사가 쉽다. 멤브레인은 선체 공간 효율이 높아 대형 LNG선의 주류이나 슬로싱 제한과 라이선스 비용이 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 스케치 필수\">\n<p>(답안에 네 칸 단면 스케치: 각형 독립 / 구형·각형 + 드립트레이 / 원통 압력용기 / 내각 + 단열 + 막)<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>형식<\/th><th>설계<\/th><th>설계압<\/th><th>2차 방벽<\/th><th>적용<\/th><\/tr><\/thead><tbody>\n<tr><td>Type A<\/td><td>고전적 구조해석<\/td><td>&lt; 0.07 MPa<\/td><td>완전<\/td><td>완전냉각 LPG<\/td><\/tr>\n<tr><td>Type B<\/td><td>정밀 해석·피로·균열진전<\/td><td>&lt; 0.07 MPa<\/td><td>부분<\/td><td>Moss, SPB<\/td><\/tr>\n<tr><td>Type C<\/td><td>압력용기 기준<\/td><td>대개 0.4 MPa 이상<\/td><td>불필요<\/td><td>가압 LPG, LCO₂, LNG 연료<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 설계 해석 수준이 높을수록 2차 방벽 요구가 줄어드는 구조임.<\/p><\/div><\/section><\/details>"},{"id":"secondary-barrier","p":10,"n":"10.3","h":"2차 방벽(Secondary Barrier)","t":"2차 방벽(Secondary Barrier)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 11번 · 10점"],"q":["<b>124회(2021) 1-11<\/b> Secondary Barrier"],"k":"2차 방벽은 1차 방벽(탱크 본체)에서 액체 화물이 새어 나와도 일정 기간 담아 두어 선체 강재가 위험한 저온에 노출되지 않게 하는 화물 격납계의 외곽 요소다. IGC는 누설 화물을 15일 동안 격납할 수 있도록 요구한다.","x":"\n<p class=\"key\">2차 방벽은 1차 방벽(탱크 본체)에서 액체 화물이 새어 나와도 일정 기간 담아 두어 선체 강재가 위험한 저온에 노출되지 않게 하는 화물 격납계의 외곽 요소다. IGC는 누설 화물을 15일 동안 격납할 수 있도록 요구한다.<\/p>\n<h4>요구 수준<\/h4>\n<ul>\n<li>완전 2차 방벽: 멤브레인, Type A(화물 온도 −55 °C 미만). −10~−55 °C 화물이면 적절한 저온강의 선체가 2차 방벽을 겸할 수 있다.<\/li>\n<li>부분 2차 방벽: Type B(작은 누설을 모으는 드립트레이, 스프레이 실드).<\/li>\n<li>불필요: Type C(압력용기의 높은 안전율).<\/li>\n<\/ul>\n<h4>구성 예<\/h4>\n<ul>\n<li>GTT Mark III: 단열 패널 사이 트리플렉스(알루미늄박 + 유리섬유) 유연 2차 방벽.<\/li>\n<li>GTT NO96: 0.7 mm Invar 2차 멤브레인.<\/li>\n<li>방벽 사이 공간(interbarrier space)은 질소로 채우고 가스 탐지·압력 감시, 주기적 기밀 시험.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>1차 방벽 누설 화물을 일시 격납해 선체 강재의 위험 저온 노출을 막는 외곽 요소. 15일 격납 능력(IGC).<\/p>\n<h5>2. 요구<\/h5><p>완전: 멤브레인, Type A(−55 °C 미만) / 부분: Type B / 불필요: Type C. −10~−55 °C 화물은 저온강 선체가 겸용 가능.<\/p>\n<h5>3. 예<\/h5><p>Mark III 트리플렉스, NO96 Invar 2차 막, 방벽 사이 질소·가스 탐지·기밀 시험.<\/p><\/div><\/section><\/details>"},{"id":"membrane-filling","p":10,"n":"10.4","h":"멤브레인 탱크의 적재 제약조건","t":"멤브레인 탱크의 적재 제약조건","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 5번 · 25점"],"q":["<b>115회(2018) 3-5<\/b> Membrane tank의 적재 제약조건"],"k":"멤브레인 탱크는 부분 적재 시 액체 고유주기가 선박 운동 주기와 가까워져 슬로싱 충격이 단열재·막을 손상시킬 수 있다. 그래서 항해 중에는 탱크 높이의 대략 10% 이하 또는 70% 이상으로만 적재하는 중간 적재 금지가 대표 제약이며, 냉각·압력·온도 조건도 제한된다.","x":"\n<p class=\"key\">멤브레인 탱크는 부분 적재 시 액체 고유주기가 선박 운동 주기와 가까워져 슬로싱 충격이 단열재·막을 손상시킬 수 있다. 그래서 항해 중에는 탱크 높이의 대략 10% 이하 또는 70% 이상으로만 적재하는 중간 적재 금지가 대표 제약이며, 냉각·압력·온도 조건도 제한된다.<\/p>\n<h4>제약 항목<\/h4>\n<ul>\n<li><b>적재 높이 제한<\/b>: 통상형 NO96·Mark III 탱크는 항해 중 10%H 초과~70%H 미만 금지(설계·선급 승인 조건에 따라 다름). 강화 단열재·탱크 형상 개선으로 \"임의 적재(any filling)\"를 승인받은 설계도 있다(FSRU, 소형선).<\/li>\n<li><b>최대 적재<\/b>: 충전한도(98% 수준, 기준 온도 밀도 보정).<\/li>\n<li><b>해상 조건<\/b>: 부분 적재 상태 하역·운항 시 해상 상태 제한(FSRU·STS 작업 지침).<\/li>\n<li><b>냉각<\/b>: 냉각 속도 제한(단열재·막 열응력), 밸러스트 항해 중 탱크를 차게 유지하는 힐(heel) 잔량.<\/li>\n<li><b>압력<\/b>: 저압 설계(대개 0.25 bar(g) 수준)로 BOG를 계속 처리해야 함(재액화, 연료, GCU).<\/li>\n<li><b>온도·밀도<\/b>: 화물 온도에 따른 적재한도 계산.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>멤브레인 탱크는 부분 적재 시 액체 고유주기가 선박 운동과 가까워져 슬로싱 충격으로 단열·막이 손상될 수 있어 적재 제약을 둠.<\/p>\n<h5>2. 제약 조건<\/h5><ol><li>적재 높이: 통상형 항해 중 10%H 초과~70%H 미만 금지(강화 설계는 any filling)<\/li><li>최대 적재: 충전한도(98%, 밀도 보정)<\/li><li>해상 조건: 부분 적재 하역·운항 해상 상태 제한<\/li><li>냉각: 냉각 속도 제한, 밸러스트 항해 힐 잔량<\/li><li>압력: 저압 설계 → BOG 지속 처리<\/li><\/ol>\n<div class=\"calc\">공진 확인: ω₁² = (πg/L)·tanh(πh/L)\nL = 40 m: h = 50% → T ≈ 8.1 s(종동요 근접) / h = 10% → T ≈ 15.7 s<\/div>\n<p class=\"concl\"><b>3. 결론<\/b>: 제약은 공진 회피와 단열 강도 한계에서 나오므로, FSRU처럼 부분 적재가 상시인 설비는 강화 단열·형상 설계로 제약을 해소해야 함.<\/p><\/div><\/section><\/details>"},{"id":"sloshing","p":10,"n":"10.5","h":"슬로싱(Sloshing): 하중, 화물창 구조안전성 평가방법, 구조설계 고려사항","t":"슬로싱(Sloshing): 하중, 화물창 구조안전성 평가방법, 구조설계 고려사항","c":3,"r":1,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 1번 · 25점","118회 1교시 5번 · 10점","130회 3교시 1번 · 25점"],"q":["<b>115회(2018) 4-1<\/b> LNG Sloshing에 대한 화물창 구조안전성 평가방법","<b>118회(2019) 1-5<\/b> 슬로싱(Sloshing)","<b>130회(2023) 3-1<\/b> 슬로싱 하중과 구조설계 관점의 고려사항"],"k":"슬로싱은 부분 적재 탱크 안 액체가 선박 운동에 의해 크게 출렁이며 탱크 벽에 충격 압력을 주는 현상이다. 액체 고유주기가 선박 운동 주기와 가까울 때 공진하며, LNG 멤브레인 화물창은 모형시험으로 통계적 설계 압력을 구하고 단열·막 구조의 강도를 비선형 해석으로 확인한다.","x":"\n<p class=\"key\">슬로싱은 부분 적재 탱크 안 액체가 선박 운동에 의해 크게 출렁이며 탱크 벽에 충격 압력을 주는 현상이다. 액체 고유주기가 선박 운동 주기와 가까울 때 공진하며, LNG 멤브레인 화물창은 모형시험으로 통계적 설계 압력을 구하고 단열·막 구조의 강도를 비선형 해석으로 확인한다.<\/p>\n<h4>현상과 하중 특성<\/h4>\n<div class=\"eq\"><div class=\"eql\">사각형 탱크 1차 고유진동수 (L: 탱크 길이, h: 액위)<\/div><div class=\"mj\">\\[\\omega_1^2=\\dfrac{\\pi g}{L}\\tanh\\!\\left(\\dfrac{\\pi h}{L}\\right)\\]<\/div><\/div>\n<ul>\n<li>충격 압력은 매우 짧은 지속시간(수 ms)의 국부 피크로, 통계적 편차가 크다.<\/li>\n<li>위험 부위: 상부 챔퍼(upper chamfer) 모서리, 측벽 액면 근처, 하부 모서리, 펌프 타워(동적 하중·피로).<\/li>\n<li>LNG는 기액 밀도비, 기체 압축성, 상변화(기포 응축)가 충격 크기에 영향 → 축척 보정이 어렵다.<\/li>\n<\/ul>\n<h4>화물창 구조안전성 평가 절차(멤브레인 LNG선)<\/h4>\n<ol>\n<li><b>운동 해석<\/b>: 운항 해역 파랑 통계(북대서양 산포도 등)와 운항 조건으로 선박 6자유도 운동 계산, 위험 적재 높이·해상 조건 선정.<\/li>\n<li><b>모형시험<\/b>: 1:40~1:70 모형 탱크를 6자유도 운동대에 놓고 실제 운동 시계열 재현, 위험 부위에 압력센서 다수 배치, 대표 가스(밀도비 조정) 사용.<\/li>\n<li><b>통계 처리<\/b>: 피크 압력 분포(Weibull, GEV)를 외삽해 목표 재현 수준(예: 운항 수명 대응 확률)의 설계 압력 산정.<\/li>\n<li><b>축척 보정<\/b>: Froude 상사(압력 ∝ ρ·g·L)와 기액 효과 보정, 충격 면적(공간 평균) 고려.<\/li>\n<li><b>강도 평가<\/b>: 단열 박스(합판·폼) 압축·좌굴, 막 주름부 강도를 비선형 FE로 계산하고 안전계수 확인(GTT 방법론, 선급 지침: DNV CG-0158 등).<\/li>\n<li><b>결과 반영<\/b>: 강화 단열재 구역 설정, 적재 높이 제한, 운항 지침.<\/li>\n<\/ol>\n<h4>구조설계 관점 고려사항<\/h4>\n<ul>\n<li>탱크 형상: 길이(종방향 공진 주기), 챔퍼 각도·높이, 탱크 수(짧은 탱크 다수).<\/li>\n<li>단열계 강화: 고밀도 폼·강화 합판 박스를 상부 챔퍼·모서리에 적용.<\/li>\n<li>내각(inner hull) 지지 구조: 슬로싱 하중을 받는 내각판·보강재 국부 강도, 탱크 모서리 연결부.<\/li>\n<li>펌프 타워: 슬로싱 하중과 열수축 조건에서 강도·피로, 하부 지지(베이스 서포트).<\/li>\n<li>일반 탱크(밸러스트·연료·화물유): 제수격벽(wash bulkhead) 배치, 선급 규칙의 슬로싱 압력으로 경계 부재 설계(CSR은 탱크 폭·길이가 일정 이상이면 슬로싱 평가).<\/li>\n<li>운항 측면: 적재 제한 준수 모니터링, 기상 항로.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-5<\/td><td>슬로싱<\/td><td class=\"num\">10<\/td><td>정의, 공진 조건 식, 위험 부위<\/td><\/tr>\n<tr><td class=\"num\">115-4-1<\/td><td>LNG 화물창 구조안전성 평가방법<\/td><td class=\"num\">25<\/td><td>운동해석 → 모형시험 → 통계 → 강도평가 절차<\/td><\/tr>\n<tr><td class=\"num\">130-3-1<\/td><td>슬로싱 하중과 구조설계 고려사항<\/td><td class=\"num\">25<\/td><td>하중 특성 + 설계 대책(형상·단열·제한)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 118회형\">\n<h5>1. 정의<\/h5>\n<p>슬로싱: 부분 적재 탱크 내 액체가 선박 운동으로 크게 출렁이며 탱크 벽에 충격 압력을 가하는 현상.<\/p>\n<h5>2. 발생 조건<\/h5>\n<div class=\"calc\">ω₁² = (πg/L)·tanh(πh/L)\n예) L = 40 m 탱크: 액위 50%(h = 13.5 m) → T ≈ 8.1 s (선박 종동요 주기와 근접 → 공진 위험)\n               액위 10%(h = 2.7 m)  → T ≈ 15.7 s<\/div>\n<h5>3. 위험 부위·영향<\/h5>\n<ul><li>상부 챔퍼 모서리, 액면 부근 측벽, 펌프 타워<\/li><li>ms 단위 국부 충격 → 단열재·막 손상<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 멤브레인 LNG선은 10~70% 중간 적재 제한으로 공진 영역을 피하는 것이 기본 대책임.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 115·130회 통합형\">\n<h5>1. 개요<\/h5>\n<p>슬로싱 하중은 지속시간이 짧고 통계적 편차가 큰 국부 충격 하중이라, 규칙식보다 모형시험·통계 해석으로 설계 압력을 정하고 단열·막 구조의 강도를 평가함.<\/p>\n<h5>2. 하중 특성<\/h5>\n<ul><li>공진: 액체 고유주기 ≈ 선박 운동 주기(종동요·횡동요)일 때 증폭<\/li>\n<li>충격 압력: 수 ms 피크, 국부 면적 집중, 기액 밀도비·기체 압축성·상변화가 크기에 영향<\/li>\n<li>위험 부위: 상부 챔퍼, 모서리, 펌프 타워 베이스<\/li><\/ul>\n<h5>3. 구조안전성 평가 절차<\/h5>\n<ol><li>운동해석: 운항 해역 산포도로 6자유도 운동, 위험 적재 높이·해상 조건 선정<\/li>\n<li>모형시험: 1:40~1:70 모형 탱크, 6자유도 운동대, 압력센서 다수<\/li>\n<li>통계 처리: 피크 압력 분포(Weibull·GEV) 외삽 → 목표 확률 설계 압력<\/li>\n<li>축척 보정: Froude 상사 + 기액 효과, 충격 면적 고려<\/li>\n<li>강도 평가: 단열 박스 압축·좌굴, 막 주름부 비선형 FE → 안전계수 확인(GTT 방법론, 선급 지침)<\/li><\/ol>\n<h5>4. 구조설계 고려사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>탱크 형상<\/td><td>탱크 길이(종방향 공진), 챔퍼 각·높이, 탱크 수<\/td><\/tr>\n<tr><td>단열계<\/td><td>상부 챔퍼·모서리 강화 단열재(고밀도 폼, 강화 합판)<\/td><\/tr>\n<tr><td>내각 지지 구조<\/td><td>챔퍼·모서리 국부 보강, 연결부 상세<\/td><\/tr>\n<tr><td>펌프 타워<\/td><td>슬로싱·열수축 조건 강도·피로<\/td><\/tr>\n<tr><td>운항<\/td><td>적재 높이 제한, 해상 조건 제한, 모니터링<\/td><\/tr>\n<tr><td>일반 탱크<\/td><td>제수격벽 배치, 규칙 슬로싱 압력으로 경계 부재 설계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>5. 결론<\/b>: 슬로싱 설계는 \"공진 회피(형상·적재 제한) + 충격 저항(단열·구조 강화)\"의 조합이며, FSRU처럼 부분 적재가 일상인 선박은 임의 적재(any filling) 강화 설계가 필요함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"filling-limit","p":10,"n":"10.6","h":"IGC/IGF Code의 충전한도(Filling Limit)와 적재한도(Loading Limit)","t":"IGC/IGF Code의 충전한도(Filling Limit)와 적재한도(Loading Limit)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 10번 · 10점"],"q":["<b>136회(2025) 1-10<\/b> IGC/IGF Code에 따른 충전한도와 적재한도"],"k":"충전한도 FL은 화물(연료)이 데워져 압력이 안전밸브 설정압에 도달했을 때도 탱크가 액체로 가득 차지 않도록 정한 최대 액체 체적 비율로, 기준온도에서 98%다. 적재한도 LL은 실제 적재 온도에서 넣을 수 있는 양으로, 밀도 비를 곱해 FL보다 작게 정한다.","x":"\n<p class=\"key\">충전한도 FL은 화물(연료)이 데워져 압력이 안전밸브 설정압에 도달했을 때도 탱크가 액체로 가득 차지 않도록 정한 최대 액체 체적 비율로, 기준온도에서 98%다. 적재한도 LL은 실제 적재 온도에서 넣을 수 있는 양으로, 밀도 비를 곱해 FL보다 작게 정한다.<\/p>\n<div class=\"eq\"><div class=\"eql\">FL = 98% (기준온도 기준)<\/div><div class=\"mj\">\\[LL=FL\\cdot\\dfrac{\\rho_R}{\\rho_L}\\]<\/div><span class=\"c\">ρ<sub>R<\/sub>: 기준온도(안전밸브 설정압에 해당하는 증기압의 온도)에서의 액체 밀도, ρ<sub>L<\/sub>: 적재 온도·압력에서의 액체 밀도<\/span><\/div>\n<ul>\n<li><b>이유<\/b>: 차갑게 적재한 액체는 운항 중 데워지며 팽창한다. 기상부(ullage)가 사라지면 안전밸브로 액체가 분출하고 탱크가 과압된다.<\/li>\n<li>탱크 형상·PRV 위치 등 근거가 있으면 주관청이 98%보다 높은 FL을 허용할 수 있다(IGC 15).<\/li>\n<li>IGF Code(연료탱크)도 같은 원리의 FL·LL을 적용하며, 연료 탱크는 운항 중 계속 소비되어 부분 적재 상태가 일반적이다.<\/li>\n<li>적재 계획에는 탱크별 적재한도 표(온도-압력별)를 승인받아 비치한다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><div class=\"calc\">FL = 98% (기준온도: 안전밸브 설정압의 증기압 온도)\nLL = FL × ρ_R / ρ_L  (ρ_R 기준온도 밀도, ρ_L 적재온도 밀도)<\/div>\n<h5>2. 이유<\/h5><p>차가운 적재 액체가 데워져 팽창해도 기상부를 남겨 안전밸브 액체 분출·과압 방지.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: 근거가 있으면 98% 초과 허용(IGC 15), IGF 연료탱크도 같은 원리이며 소비로 상시 부분 적재임.<\/p><\/div><\/section><\/details>"},{"id":"lng-cargo-tank","p":10,"n":"10.7","h":"LNG선 화물탱크 설계 시 고려사항","t":"LNG선 화물탱크 설계 시 고려사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 3교시 6번 · 25점"],"q":["<b>133회(2024) 3-6<\/b> LNG선 화물탱크 설계 시 고려사항"],"k":"LNG 화물탱크는 −163 °C 극저온, 낮은 설계압, 증발가스, 슬로싱, 선체와의 열적 분리를 동시에 해결해야 한다. 탱크 형식 선택(멤브레인·Moss·SPB)이 공간 효율·건조 비용·운항 제약을 좌우한다.","x":"\n<p class=\"key\">LNG 화물탱크는 −163 °C 극저온, 낮은 설계압, 증발가스, 슬로싱, 선체와의 열적 분리를 동시에 해결해야 한다. 탱크 형식 선택(멤브레인·Moss·SPB)이 공간 효율·건조 비용·운항 제약을 좌우한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>고려사항<\/th><\/tr><\/thead><tbody>\n<tr><td>재료<\/td><td>극저온 인성: 304L 스테인리스, Invar(36% Ni), 9% Ni강, 알루미늄 합금(Moss 5083), 고망간강<\/td><\/tr>\n<tr><td>열수축<\/td><td>상온-극저온 수축(스테인리스 대략 3 mm/m 수준) → 주름 막, Invar(저팽창), 독립형 지지구조의 미끄럼<\/td><\/tr>\n<tr><td>단열·BOR<\/td><td>증발률(현대선 대략 0.07~0.1 %/day) 목표, 단열 두께·재질(PUF, 펄라이트)<\/td><\/tr>\n<tr><td>2차 방벽<\/td><td>형식별 요구, 방벽 사이 질소·가스 탐지<\/td><\/tr>\n<tr><td>하중<\/td><td>정적·동적 화물 압력, 가속도, 슬로싱, 열응력, 선체 변형과의 상호작용<\/td><\/tr>\n<tr><td>피로·균열<\/td><td>Type B는 균열진전 해석과 누설 전 파단 없음 입증<\/td><\/tr>\n<tr><td>선체 강재 온도<\/td><td>단열 손상 가정 시 내각 강재 온도 계산 → 강재 등급(IGC 4.19), 코퍼댐 격벽 글리콜 가열<\/td><\/tr>\n<tr><td>압력·온도 제어<\/td><td>BOG 처리(이중연료 기관, 재액화, GCU), PRV(화재 조건 용량), 진공 보호<\/td><\/tr>\n<tr><td>충전·적재 한도<\/td><td>FL 98%, 적재 높이 제한(멤브레인 슬로싱)<\/td><\/tr>\n<tr><td>화물 처리<\/td><td>펌프 타워, 잠수 펌프, 스프레이 라인, 계측<\/td><\/tr>\n<tr><td>검사·정비<\/td><td>탱크 내부 접근, 기밀 시험(전역 시험), 냉점 감시<\/td><\/tr>\n<tr><td>선박 배치<\/td><td>IGC 선형 2G 위치 요건, 탱크 수·크기(슬로싱·공간), 화물 용량 대비 선체 치수<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>−163 °C·저압·BOG·슬로싱·선체 열적 분리를 동시에 해결해야 하며, 형식(멤브레인·Moss·SPB)이 공간·비용·운항 제약을 좌우함.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>고려사항<\/th><\/tr><\/thead><tbody>\n<tr><td>재료<\/td><td>304L, Invar, 9% Ni, Al 5083, 고망간강<\/td><\/tr>\n<tr><td>열수축<\/td><td>주름 막·Invar·미끄럼 지지<\/td><\/tr>\n<tr><td>단열·BOR<\/td><td>대략 0.07~0.1 %/day 목표<\/td><\/tr>\n<tr><td>2차 방벽<\/td><td>형식별 요구, 질소·탐지<\/td><\/tr>\n<tr><td>하중<\/td><td>화물압·가속도·슬로싱·열응력·선체 변형<\/td><\/tr>\n<tr><td>피로·균열<\/td><td>Type B 누설 전 파단 없음 입증<\/td><\/tr>\n<tr><td>선체 강재<\/td><td>단열 손상 시 내각 온도 → 등급, 코퍼댐 가열<\/td><\/tr>\n<tr><td>압력 제어<\/td><td>BOG(기관·재액화·GCU), PRV 화재 용량<\/td><\/tr>\n<tr><td>충전·적재<\/td><td>FL 98%, 적재 높이 제한<\/td><\/tr>\n<tr><td>배치·검사<\/td><td>IGC 2G 위치, 탱크 수, 접근·기밀 시험<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 대형 LNG선은 공간 효율이 높은 멤브레인이 주류이나 슬로싱 제약과 라이선스 비용이 있어, 용도(FSRU, 연료)에 따라 독립형과 비교해 선정해야 함.<\/p><\/div><\/section><\/details>"},{"id":"lng-fuel-tank","p":10,"n":"10.8","h":"LNG 추진선박의 연료탱크 설계 기준과 선종·크기별 탱크 선정 (개조 포함)","t":"LNG 추진선박의 연료탱크 설계 기준과 선종·크기별 탱크 선정 (개조 포함)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 4번 · 25점","130회 3교시 2번 · 25점"],"q":["<b>124회(2021) 3-4<\/b> LNG 추진선박 연료탱크 설계 시 고려사항","<b>130회(2023) 3-2<\/b> 연료유 추진선을 LNG 추진선으로 개조 시 연료탱크 설계기준과 선종·크기별 탱크 종류"],"k":"LNG 연료탱크는 IGF Code를 따른다. 핵심은 손상 보호 위치(선측 B/5 또는 11.5 m 중 작은 값, 선저 B/15 또는 2 m 중 작은 값, 외판에서 최소 760 mm), 압력 축적 능력(연료 소비 없이 15일), 충전한도, 탱크연결공간(TCS)과 위험구역 관리다. 탱크 형식은 용량과 배치 공간으로 정하며, 수천 m³ 이하는 Type C, 대용량은 멤브레인·Type B가 경제적이다.","x":"\n<p class=\"key\">LNG 연료탱크는 IGF Code를 따른다. 핵심은 손상 보호 위치(선측 B/5 또는 11.5 m 중 작은 값, 선저 B/15 또는 2 m 중 작은 값, 외판에서 최소 760 mm), 압력 축적 능력(연료 소비 없이 15일), 충전한도, 탱크연결공간(TCS)과 위험구역 관리다. 탱크 형식은 용량과 배치 공간으로 정하며, 수천 m³ 이하는 Type C, 대용량은 멤브레인·Type B가 경제적이다.<\/p>\n<h4>설계 기준 (IGF Code 주요 요건)<\/h4>\n<ul>\n<li><b>위치(5.3)<\/b>: 결정론적 거리 기준 또는 확률론적 방법(손상 시 탱크 관통 확률 f<sub>CN<\/sub> 기준: 여객선 0.02, 화물선 0.04). 거주구·A류 기관구역과의 관계, 노천 갑판 배치 우선.<\/li>\n<li><b>탱크 형식<\/b>: IGC와 같은 Type A·B·C·멤브레인 분류와 재료·설계 기준.<\/li>\n<li><b>압력 관리(6.9)<\/b>: 연료를 쓰지 않아도 최소 15일 동안 압력을 안전밸브 설정압 이하로 유지(압력 축적, 재액화, GCU 등).<\/li>\n<li><b>충전한도(6.8)<\/b>: FL 98% 기준, LL 밀도 보정.<\/li>\n<li><b>TCS<\/b>: 탱크 밸브·배관 연결부를 가스밀 공간에 수납, 기계환기·가스 탐지, 누설 액체 대비 저온 강재·드립트레이.<\/li>\n<li><b>배기<\/b>: 벤트 마스트 높이와 위험구역 거리(흡기구·거주구 개구부).<\/li>\n<li><b>방화<\/b>: 탱크 주위 A-60 단열, 물분무, 건조분말.<\/li>\n<li><b>부대<\/b>: 벙커링 스테이션, 연료준비실(기화기·펌프), 이중관 연료배관, 비상차단.<\/li>\n<\/ul>\n<h4>선종·크기별 탱크<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>선종·규모<\/th><th>대표 탱크<\/th><th>배치<\/th><\/tr><\/thead><tbody>\n<tr><td>소형(예인선, 페리, OSV)<\/td><td>Type C 단일 원통<\/td><td>선체 내부(기관실 인근) 또는 갑판<\/td><\/tr>\n<tr><td>벌크선(수프라~뉴캐슬막스)<\/td><td>Type C 원통 1~2기<\/td><td>거주구 전후 노천 갑판<\/td><\/tr>\n<tr><td>유조선(아프라막스~VLCC)<\/td><td>Type C 2기<\/td><td>거주구 앞 상갑판 좌우(화물탱크 영향 없음)<\/td><\/tr>\n<tr><td>PCTC<\/td><td>Type C<\/td><td>선체 내부 하부(차량갑판 손실 최소)<\/td><\/tr>\n<tr><td>대형 컨테이너선<\/td><td>멤브레인(Mark III) 또는 Type B 각형, 수천~1만 m³ 이상<\/td><td>거주구 아래 화물창 공간(용적 효율)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>운항선 개조 시 추가 고려<\/h4>\n<ul>\n<li>탱크 공간 확보(화물창 일부 희생 또는 갑판 탑재) → 화물 손실과 상업성 평가.<\/li>\n<li>기존 구조 보강(탱크 서포트 하중), 복원성·종강도 재평가, 시야(SOLAS V/22).<\/li>\n<li>주기관 이중연료 개조(제작사 패키지), 발전기 교체, 연료가스 공급계 추가.<\/li>\n<li>선급·기국 승인, 도크 기간·비용, EEXI·CII 개선 효과, 연료 가격 차이로 투자 회수.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-3-4<\/td><td>LNG 연료탱크 설계 시 고려사항<\/td><td>IGF 요건 체계<\/td><\/tr>\n<tr><td class=\"num\">130-3-2<\/td><td>개조 시 설계기준, 선종·크기별 탱크<\/td><td>개조 특유 검토 + 선종별 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 124회형\">\n<h5>1. 개요<\/h5><p>LNG 연료탱크는 IGF Code를 따르며, 극저온·저밀도·BOG·가연성 때문에 위치 보호, 압력 관리, 위험구역 관리가 핵심임.<\/p>\n<h5>2. 고려사항<\/h5><ol><li><b>위치<\/b>: 선측 min(B/5, 11.5 m), 선저 min(B/15, 2 m), 외판 760 mm 이상(또는 확률론 f<sub>CN<\/sub>), 노천 배치 우선<\/li><li><b>형식<\/b>: Type C(소·중형, 압력 축적), 멤브레인·Type B(대용량)<\/li><li><b>압력 관리<\/b>: 연료 미사용 15일 압력 유지(축적·재액화·GCU)<\/li><li><b>충전한도<\/b>: FL 98%, LL 밀도 보정<\/li><li><b>TCS·배관<\/b>: 탱크연결공간 가스밀·환기·탐지, 이중관, DBB<\/li><li><b>재료<\/b>: 9% Ni, 304L, 고망간강 / 지지 새들 열수축<\/li><li><b>방화·배기<\/b>: A-60, 물분무, 벤트 마스트 위험구역<\/li><li><b>슬로싱<\/b>: 연료 소비로 상시 부분 적재<\/li><li><b>선박 영향<\/b>: 용적 손실, 복원성·종강도, 시야<\/li><\/ol>\n<h5>3. 선종별 탱크(130회 대비)<\/h5><p>소형선: Type C 원통 / 벌크선: 노천 Type C / 유조선: 상갑판 Type C 2기 / PCTC: 선체 내 Type C / 대형 컨테이너선: 멤브레인·Type B<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 탱크 형식은 용량과 BOG 처리 전략으로, 위치는 화물 손실과 가스 안전의 균형으로 결정하며, 개조선은 공간 확보와 휴선 기간이 경제성을 좌우함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"lng-bulk-case","p":10,"n":"10.9","h":"63,000 DWT LNG 이중연료 벌크선: LNG 연료 특징, 경제적 탱크 형식, 최적 배치","t":"63,000 DWT LNG 이중연료 벌크선: LNG 연료 특징, 경제적 탱크 형식, 최적 배치","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 2교시 6번 · 25점"],"q":["<b>136회(2025) 2-6<\/b> 63,000 DWT LNG 이중연료 벌크선의 IGF 연료탱크(1,450 m³) 형식 결정과 최적 배치"],"k":"결론: 1,450 m³ 단일 탱크는 IMO Type C(원통형 압력용기)가 가장 경제적이며, 거주구 후방의 노천 갑판(기관실 상부 선미루 갑판)에 두는 것이 최적이다. 화물창 용적을 잃지 않고, 연료 배관이 짧으며, 노천 배치로 가스 안전이 좋고, IGF 위치 기준을 여유 있게 만족한다.","x":"\n<p class=\"key\">결론: 1,450 m³ 단일 탱크는 IMO Type C(원통형 압력용기)가 가장 경제적이며, 거주구 후방의 노천 갑판(기관실 상부 선미루 갑판)에 두는 것이 최적이다. 화물창 용적을 잃지 않고, 연료 배관이 짧으며, 노천 배치로 가스 안전이 좋고, IGF 위치 기준을 여유 있게 만족한다.<\/p>\n<h4>주어진 조건<\/h4>\n<p>국제항해, DWT 63,000 t, L<sub>BP<\/sub> 196.5 m, B 32.26 m, D 18.9 m, 구조흘수 13.5 m, LNG 연료탱크 1,450 m³ × 1.<\/p>\n<h4>1) LNG 연료의 특징<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>성상<\/td><td>메탄 주성분(85~99%), 대기압 비점 −162 °C, 액체 밀도 약 430~470 kg/m³<\/td><\/tr>\n<tr><td>에너지<\/td><td>저위발열량 약 48~50 MJ/kg(중유 약 40 MJ/kg). 같은 에너지에 체적은 중유의 약 1.7배, 탱크·단열 포함 실제 공간은 3배 이상<\/td><\/tr>\n<tr><td>배출<\/td><td>SOx·PM 거의 없음, 오토 사이클 기관은 NOx Tier III 충족, CO₂는 탱크-항적 기준 약 20~25% 감소(C<sub>F<\/sub> 2.750 대 중유 3.114)<\/td><\/tr>\n<tr><td>약점<\/td><td>메탄 슬립(온실효과 큼), 증발가스(BOG) 관리, 극저온 재료·단열, 벙커링 인프라<\/td><\/tr>\n<tr><td>위험성<\/td><td>공기 중 가연범위 약 5~15%, 극저온 접촉 시 취성파괴·동상, 기화 직후 냉기는 공기보다 무거워 체류<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>2) 가장 경제적인 IMO 탱크 형식: Type C<\/h4>\n<ul>\n<li><b>용량 규모<\/b>: 1,450 m³는 Type C 단일 원통으로 충분히 만들 수 있는 크기다(예: 직경 약 9.5~10 m, 원통부 길이 약 15~17 m, 반타원 경판 포함 전장 약 20~22 m).<\/li>\n<li><b>2차 방벽 불필요<\/b>: 압력용기 기준 설계로 2차 방벽·방벽간 공간 감시가 없어 단순하다.<\/li>\n<li><b>BOG 관리 단순<\/b>: 설계압(수 bar)으로 압력 축적이 가능해 정박·저부하 중 BOG를 탱크에 담아 둘 수 있다. IGF 15일 압력 유지 요건을 재액화 장치 없이 만족하기 쉽다(멤브레인·Type B는 저압이라 BOG 처리 설비 필요).<\/li>\n<li><b>제작·설치<\/b>: 전문 업체가 공장에서 완제품으로 제작해 새들로 탑재, 선체 공정과 병행. 라이선스 비용 없음.<\/li>\n<li><b>단점<\/b>: 원통형이라 공간 효율이 낮고 중량이 크지만, 이 용량에서는 단가 이점이 크다. 멤브레인·Type B는 대략 수천 m³ 이상(대형 컨테이너선)에서 경제성이 생긴다.<\/li>\n<\/ul>\n<h4>3) 최적 배치: 거주구 후방 노천 갑판<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>후보<\/th><th>장점<\/th><th>단점<\/th><th>판정<\/th><\/tr><\/thead><tbody>\n<tr><td>A. 거주구 후방 노천 갑판(기관실 위)<\/td><td>화물 용적·하역 무영향, 연료준비실·기관실과 배관 최단, 노천이라 누설 가스 확산, 선교 전방 시야 무영향, 중앙선 배치로 선측 거리 B/5 = 6.45 m 쉽게 만족<\/td><td>구명정·계류 설비와의 공간 조정, 선미 하중 증가에 따른 트림·국부 보강<\/td><td>최적<\/td><\/tr>\n<tr><td>B. 거주구 전방 상갑판(5번 해치 뒤)<\/td><td>노천, 배관 비교적 짧음<\/td><td>해치커버 개폐·크레인 작업 간섭, 선교 시야(SOLAS V/22) 검토, 그랩 하역 충돌 위험<\/td><td>차선<\/td><\/tr>\n<tr><td>C. 화물창 내부(5번 창 일부)<\/td><td>무게중심 낮음<\/td><td>화물 용적·재화중량 손실, 화물창 구조 변경, TCS·환기 복잡, 손상 보호 검토<\/td><td>비경제적<\/td><\/tr>\n<tr><td>D. 기관실 내부<\/td><td>배관 최단<\/td><td>폐위 공간 가스 위험, A류 기관구역 방화 경계, 공간 부족, B/15 = 2.15 m 등 위치 기준과 기기 배치 충돌<\/td><td>부적합<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>배치 시 확인할 사항<\/h4>\n<ul>\n<li>IGF 위치: 선측에서 min(B/5, 11.5 m) = 6.45 m 이상, 선저에서 min(B/15, 2.0 m) = 2.0 m 이상(노천 갑판이면 충분), 외판에서 760 mm 이상.<\/li>\n<li>탱크연결공간(TCS)과 벙커링 스테이션 위치(좌우 양현 접근), 벤트 마스트 높이와 위험구역이 거주구 개구·공기 흡입구에 걸리지 않게.<\/li>\n<li>A-60 방화 경계, 물분무 장치, 탱크 하부 저온 누설 대비 드립트레이.<\/li>\n<li>구조: 새들 하중을 기관실 횡격벽·웨브로 전달하는 갑판 하부 보강, 열수축 대응 미끄럼 새들.<\/li>\n<li>복원성·종강도: 높은 위치의 탱크 중량(빈 상태·만재 상태) 반영, 밸러스트 계획 수정.<\/li>\n<li>구명정(자유낙하식) 진수 경로, 계류 작업 공간, 접근 통로 재배치.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5~3쪽 · 설계형\">\n<h5>1) LNG 연료 특징<\/h5><p>메탄 주성분, −162 °C, 밀도 약 450 kg/m³, LHV 약 48~50 MJ/kg(체적 중유 1.7배, 탱크 포함 3배 이상), SOx·PM 거의 없음, NOx Tier III(오토), CO₂ 약 20~25%↓(C<sub>F<\/sub> 2.750), 메탄 슬립·BOG·극저온 위험.<\/p>\n<h5>2) 경제적 탱크 형식: IMO Type C<\/h5><ul><li>1,450 m³ 단일 원통으로 제작 가능(직경 약 9.5~10 m, 전장 약 20~22 m)<\/li><li>2차 방벽 불필요, 압력 축적으로 BOG 보관(IGF 15일 요건 용이)<\/li><li>공장 완제품 제작·새들 탑재, 라이선스 비용 없음<\/li><li>멤브레인·Type B는 수천 m³ 이상에서 경제성<\/li><\/ul>\n<h5>3) 최적 배치: 거주구 후방 노천 갑판(기관실 상부)<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>후보<\/th><th>판정<\/th><th>이유<\/th><\/tr><\/thead><tbody>\n<tr><td>거주구 후방 노천<\/td><td>최적<\/td><td>화물 무영향, 배관 최단, 노천 확산, 시야 무영향, B/5 = 6.45 m 만족<\/td><\/tr>\n<tr><td>거주구 전방 상갑판<\/td><td>차선<\/td><td>해치·크레인 간섭, 시야 검토<\/td><\/tr>\n<tr><td>화물창 내부<\/td><td>비경제<\/td><td>화물 손실, 구조 변경<\/td><\/tr>\n<tr><td>기관실 내부<\/td><td>부적합<\/td><td>폐위 가스 위험, 공간<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>확인: 선측 min(B/5, 11.5) = 6.45 m, 선저 min(B/15, 2.0) = 2.0 m, TCS·벙커링 스테이션·벤트 위험구역, A-60, 새들 하부 보강, 복원성·종강도, 구명정 경로.<\/p>\n<p class=\"concl\"><b>결론<\/b>: Type C + 선미 노천 배치가 화물 손실 없이 가스 안전과 경제성을 동시에 만족하는 해법임.<\/p><\/div><\/section><\/details>"},{"id":"gas-safe-esd","p":10,"n":"10.10","h":"가스연료 기관구역의 2가지 대체개념: Gas-safe와 ESD-protected 기관구역","t":"가스연료 기관구역의 2가지 대체개념: Gas-safe와 ESD-protected 기관구역","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 6번 · 25점"],"q":["<b>124회(2021) 3-6<\/b> 가스연료기관 기관구역의 가스폭발 최소화를 위한 2가지 대체개념"],"k":"IGF Code는 가스 연료 기관이 있는 기관구역의 폭발 위험을 줄이는 두 가지 개념을 둔다. Gas-safe 개념은 이중관으로 가스 누설 자체가 기관구역에 들어오지 못하게 하고, ESD-protected 개념은 단일관을 허용하되 누설이 감지되면 자동 차단과 비방폭 전기기기 차단으로 위험을 제거한다.","x":"\n<p class=\"key\">IGF Code는 가스 연료 기관이 있는 기관구역의 폭발 위험을 줄이는 두 가지 개념을 둔다. Gas-safe 개념은 이중관으로 가스 누설 자체가 기관구역에 들어오지 못하게 하고, ESD-protected 개념은 단일관을 허용하되 누설이 감지되면 자동 차단과 비방폭 전기기기 차단으로 위험을 제거한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Gas-safe 기관구역<\/th><th>ESD-protected 기관구역<\/th><\/tr><\/thead><tbody>\n<tr><td>개념<\/td><td>정상·비정상 모든 조건에서 비위험 구역<\/td><td>정상 시 비위험, 비정상(누설) 시 위험구역이 될 수 있음<\/td><\/tr>\n<tr><td>가스 배관<\/td><td>이중관(또는 덕트) 안에 가스관, 환형 공간 환기·가스 탐지<\/td><td>단일관 허용(대략 1.0 MPa 이하 저압)<\/td><\/tr>\n<tr><td>누설 시 조치<\/td><td>환형 공간에서 감지 → 해당 가스 공급 차단<\/td><td>기관구역 가스 탐지 → 가스 공급 자동 차단(ESD), 방폭이 아닌 전기기기 전원 차단<\/td><\/tr>\n<tr><td>환기<\/td><td>통상 기관실 환기<\/td><td>강화 환기(시간당 30회 이상), 가스 탐지기 다수<\/td><\/tr>\n<tr><td>배치 조건<\/td><td>제약 적음<\/td><td>독립된 2개 이상 기관구역으로 이중화(한쪽 ESD 시 추진·발전 유지), 구역 크기·형상 제한<\/td><\/tr>\n<tr><td>적용<\/td><td>대부분 이중연료 선박(2행정 고압 포함)<\/td><td>저압 4행정 가스 발전기 다수 배치 선박<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>IGF Code는 가스 연료 기관구역 폭발 위험을 두 대체 개념으로 관리함.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Gas-safe<\/th><th>ESD-protected<\/th><\/tr><\/thead><tbody>\n<tr><td>개념<\/td><td>모든 조건 비위험<\/td><td>정상 비위험, 누설 시 위험 가능<\/td><\/tr>\n<tr><td>배관<\/td><td>이중관·덕트, 환형 환기·탐지<\/td><td>단일관(약 1.0 MPa 이하)<\/td><\/tr>\n<tr><td>누설 시<\/td><td>해당 공급 차단<\/td><td>가스 차단 + 비방폭 전기기기 차단<\/td><\/tr>\n<tr><td>환기<\/td><td>통상<\/td><td>강화(시간당 30회 이상)<\/td><\/tr>\n<tr><td>배치<\/td><td>제약 적음<\/td><td>독립 2개 이상 기관구역 이중화<\/td><\/tr>\n<tr><td>적용<\/td><td>대부분 DF 선박<\/td><td>저압 4행정 가스 발전기 다수<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: Gas-safe는 누설 자체를 막고, ESD-protected는 누설을 감지해 즉시 무력화하는 개념이며, 이중화 배치가 가능한 선박만 ESD 방식이 경제적임.<\/p><\/div><\/section><\/details>"},{"id":"dbb","p":10,"n":"10.11","h":"LNG 연료추진선박의 이중차단 및 배출밸브(Double Block and Bleed Valve)","t":"LNG 연료추진선박의 이중차단 및 배출밸브(Double Block and Bleed Valve)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 12번 · 10점"],"q":["<b>130회(2023) 1-12<\/b> LNG 연료추진선박의 이중차단 및 배출밸브(Double block and bleed valve)"],"k":"이중차단·배출(DBB)은 가스 연료 공급관에 차단밸브 두 개를 직렬로 두고 그 사이에 배출(bleed) 밸브를 두는 구성이다. 기관 정지·비상 시 두 차단밸브가 닫히고 배출밸브가 열려, 사이에 갇힌 가스를 안전한 장소(벤트 마스트)로 내보내 기관 쪽으로 가스가 새지 않게 한다.","x":"\n<p class=\"key\">이중차단·배출(DBB)은 가스 연료 공급관에 차단밸브 두 개를 직렬로 두고 그 사이에 배출(bleed) 밸브를 두는 구성이다. 기관 정지·비상 시 두 차단밸브가 닫히고 배출밸브가 열려, 사이에 갇힌 가스를 안전한 장소(벤트 마스트)로 내보내 기관 쪽으로 가스가 새지 않게 한다.<\/p>\n<ul>\n<li><b>위치<\/b>: 각 가스 소비기기(주기관, 발전기관, 보일러) 앞의 가스밸브유닛(GVU)에 설치. 기관구역 밖 주 가스밸브(master gas fuel valve)와 함께 구성(IGF Code).<\/li>\n<li><b>작동<\/b>: 차단밸브는 고장 시 닫힘(fail-close), 배출밸브는 고장 시 열림(fail-open). 정상 운전 시 차단밸브 개, 배출밸브 폐.<\/li>\n<li><b>목적<\/b>: 밸브 시트 누설이 있어도 하류로 가스가 가지 않음(이중 장벽), 정비 시 안전한 격리, 정지 후 잔류 가스 제거.<\/li>\n<li>질소 퍼지 연결과 함께 운용해 정비 전 배관을 불활성화한다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>차단밸브 2개 직렬 + 사이 배출밸브. 정지·비상 시 차단 2개 폐, 배출 개 → 사이 가스를 벤트 마스트로 배출.<\/p>\n<h5>2. 위치·작동<\/h5><p>각 가스 소비기기 앞 GVU(주 가스밸브와 함께, IGF). 차단 fail-close, 배출 fail-open.<\/p>\n<h5>3. 목적<\/h5><p>시트 누설에도 하류 가스 차단(이중 장벽), 정비 격리, 잔류 가스 제거, 질소 퍼지 연계.<\/p><\/div><\/section><\/details>"},{"id":"air-lock","p":10,"n":"10.12","h":"가스운반선의 에어로크(Air Lock)","t":"가스운반선의 에어로크(Air Lock)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 1번 · 25점"],"q":["<b>139회(2026) 3-1<\/b> gas carrier의 air lock"],"k":"에어로크는 화물구역의 위험구역과 비위험(가스안전) 구역 사이 출입구에 두 개의 가스밀 강제 문을 두고 그 사이 공간을 비위험 측에서 가압 환기해, 문을 여닫을 때 가스가 안전 구역으로 들어오지 못하게 하는 장치다(IGC 3.6).","x":"\n<p class=\"key\">에어로크는 화물구역의 위험구역과 비위험(가스안전) 구역 사이 출입구에 두 개의 가스밀 강제 문을 두고 그 사이 공간을 비위험 측에서 가압 환기해, 문을 여닫을 때 가스가 안전 구역으로 들어오지 못하게 하는 장치다(IGC 3.6).<\/p>\n<h4>요건(IGC 3.6)<\/h4>\n<ul>\n<li>자동으로 닫히는 가스밀 강제 문 2개, 간격 1.5 m 이상 2.5 m 이하, 문을 열어 고정하는 장치 금지.<\/li>\n<li>문턱 높이 300 mm 이상.<\/li>\n<li>에어로크 공간은 비위험 구역에서 기계환기해 위험구역보다 양압 유지.<\/li>\n<li>두 문이 동시에 열리면 양쪽에 시각·청각 경보.<\/li>\n<li>가압 상실 시 보호 공간의 방폭이 아닌 전기기기 차단(또는 경보 후 차단).<\/li>\n<li>가스 탐지 설비.<\/li>\n<\/ul>\n<h4>적용 예<\/h4>\n<p>화물 압축기실에 인접한 전동기실 출입구, 위험구역 안에 출입구가 있을 수밖에 없는 거주구·제어실 출입구.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>위험구역과 가스안전 구역 사이 출입구에 두 개의 가스밀 강제 문과 가압 공간을 두어 문 개폐 시 가스 유입을 막는 장치(IGC 3.6).<\/p>\n<h5>2. 요건<\/h5><ul><li>자동 폐쇄 가스밀 강제 문 2개, 간격 1.5~2.5 m, 고정 장치 금지<\/li><li>문턱 300 mm 이상<\/li><li>비위험 구역에서 기계환기, 위험구역보다 양압<\/li><li>두 문 동시 개방 시 양측 시청각 경보<\/li><li>가압 상실 시 비방폭 전기기기 차단<\/li><li>가스 탐지<\/li><\/ul>\n<h5>3. 적용<\/h5><p>압축기실 인접 전동기실 출입구, 위험구역 내 거주구·제어실 출입구.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 에어로크는 배치로 위험구역 출입구를 피할 수 없을 때의 대책이므로, 일반배치에서 출입구 위치를 먼저 최적화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"methane-slip","p":10,"n":"10.13","h":"메탄슬립(Methane Slip)","t":"메탄슬립(Methane Slip)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 3번 · 10점"],"q":["<b>130회(2023) 1-3<\/b> 메탄슬립(Methane Slip)"],"k":"메탄슬립은 가스 기관에서 연소되지 않은 메탄이 배기로 빠져나가는 현상이다. 메탄은 100년 기준 지구온난화지수가 CO₂의 약 28~30배(20년 기준 80배 이상)라서 슬립이 크면 LNG의 CO₂ 감축 효과가 상쇄된다.","x":"\n<p class=\"key\">메탄슬립은 가스 기관에서 연소되지 않은 메탄이 배기로 빠져나가는 현상이다. 메탄은 100년 기준 지구온난화지수가 CO₂의 약 28~30배(20년 기준 80배 이상)라서 슬립이 크면 LNG의 CO₂ 감축 효과가 상쇄된다.<\/p>\n<h4>원인<\/h4>\n<ul>\n<li>피스톤 상부 틈새(crevice)에 갇혀 타지 않은 혼합기.<\/li>\n<li>흡·배기 밸브 겹침(소기) 중 혼합기가 그대로 배출(short-circuit).<\/li>\n<li>벽면 근처 화염 소멸, 저부하 희박 연소의 불완전 연소.<\/li>\n<li>기관 방식별 차이: 저압 오토 4행정 &gt; 저압 오토 2행정 &gt; 고압 디젤(가스 직접 분사) 순으로 크다. 저부하에서 증가.<\/li>\n<\/ul>\n<h4>규제 동향<\/h4>\n<ul>\n<li>EU FuelEU Maritime: 기관 유형별 기본 슬립 계수로 GHG 강도 계산(2025~).<\/li>\n<li>EU ETS: 2026년부터 메탄·N₂O 포함.<\/li>\n<li>IMO: LCA 지침(MEPC.376(80)) 전과정 GHG 평가, 슬립 측정·인증 지침 개발.<\/li>\n<\/ul>\n<h4>저감 대책<\/h4>\n<ul>\n<li>기관 기술: 틈새 체적 축소, 밸브 타이밍 최적화, 고압 직접 분사, 실린더별 연소 제어.<\/li>\n<li>후처리: 메탄 산화 촉매(배기온도가 낮아 효율 확보가 과제), 플라즈마 처리 연구.<\/li>\n<li>운용: 저부하 운전 회피, 하이브리드 배터리로 부하 평준화.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>가스 기관에서 미연 메탄이 배기로 빠지는 현상. 메탄 GWP100 약 28~30(GWP20 80 이상).<\/p>\n<h5>2. 원인<\/h5><p>틈새 체적, 밸브 겹침 단락, 벽면 소염, 저부하 희박 연소. 저압 오토 4행정 &gt; 저압 2행정 &gt; 고압 디젤 순.<\/p>\n<h5>3. 규제·대책<\/h5><p>FuelEU 슬립 계수, EU ETS CH₄(2026) / 틈새 축소·밸브 타이밍·고압 분사, 산화 촉매, 저부하 회피.<\/p><\/div><\/section><\/details>"},{"id":"high-mn","p":10,"n":"10.14","h":"극저온용 고망간강","t":"극저온용 고망간강","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 1번 · 10점"],"q":["<b>130회(2023) 1-1<\/b> 극저온용 고망간강"],"k":"고망간강은 망간을 약 22~25% 넣어 상온부터 −196 °C까지 오스테나이트 조직을 유지하게 만든 극저온 강재다. 니켈을 쓰지 않아 9% Ni강·스테인리스보다 싸고 강도가 높아, POSCO가 개발해 IMO 잠정지침(MSC.1/Circ.1599, 2019)과 ASTM A1106으로 LNG 탱크 재료로 인정받았다.","x":"\n<p class=\"key\">고망간강은 망간을 약 22~25% 넣어 상온부터 −196 °C까지 오스테나이트 조직을 유지하게 만든 극저온 강재다. 니켈을 쓰지 않아 9% Ni강·스테인리스보다 싸고 강도가 높아, POSCO가 개발해 IMO 잠정지침(MSC.1/Circ.1599, 2019)과 ASTM A1106으로 LNG 탱크 재료로 인정받았다.<\/p>\n<h4>특성<\/h4>\n<ul>\n<li>오스테나이트 안정화로 연성-취성 천이가 없어 −196 °C에서도 충격 인성 확보.<\/li>\n<li>항복강도 약 400 MPa 이상, 인장강도 약 800 MPa 수준으로 스테인리스보다 높아 두께 감소 가능.<\/li>\n<li>열전도율이 낮고 열팽창계수가 커 용접 변형이 크다. 가공경화가 커 기계가공이 어렵다.<\/li>\n<\/ul>\n<h4>용접·시공<\/h4>\n<ul>\n<li>전용 고망간 용접재료(FCAW, SAW, GTAW), 입열·층간온도 관리로 고온균열 방지.<\/li>\n<li>망간 흄 노출 관리(환기, 보호구).<\/li>\n<li>변형 관리: 구속·순서, 저입열 공정.<\/li>\n<\/ul>\n<h4>적용<\/h4>\n<p>LNG 연료탱크(벌크선·컨테이너선 Type B·C), LNG 운반선 화물탱크 실증, 극저온 배관. 원가 절감과 국산 소재 공급망 측면에서 국내 조선소가 적용을 확대하고 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>Mn 약 22~25%로 −196 °C까지 오스테나이트를 유지하는 극저온강(POSCO 개발, IMO MSC.1/Circ.1599, ASTM A1106).<\/p>\n<h5>2. 특성<\/h5><p>니켈 없이 저원가, 항복 약 400 MPa 이상·인장 약 800 MPa, 저열전도·고열팽창(변형 큼), 가공경화.<\/p>\n<h5>3. 시공<\/h5><p>전용 용접재료, 입열 관리(고온균열), 망간 흄 관리. LNG 연료·화물탱크 적용 확대.<\/p><\/div><\/section><\/details>"},{"id":"nine-ni","p":10,"n":"10.15","h":"LNG 연료탱크(Type C)를 9% Ni강으로 제작할 때의 재질 특성, 용접, 변형","t":"LNG 연료탱크(Type C)를 9% Ni강으로 제작할 때의 재질 특성, 용접, 변형","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 2교시 6번 · 25점"],"q":["<b>139회(2026) 2-6<\/b> LNG fuel tank(Type C)를 9% Ni steel로 제작할 경우 재질특성, 용접 및 변형"],"k":"9% Ni강은 −196 °C에서 인성을 갖는 페라이트계 강이다. 용접은 모재와 같은 성분의 용접재료로 극저온 인성을 낼 수 없어 니켈기 합금 용접재료를 쓰며, 용접부 강도가 모재보다 낮은 점과 잔류자기에 의한 아크 쏠림이 핵심 관리점이다.","x":"\n<p class=\"key\">9% Ni강은 −196 °C에서 인성을 갖는 페라이트계 강이다. 용접은 모재와 같은 성분의 용접재료로 극저온 인성을 낼 수 없어 니켈기 합금 용접재료를 쓰며, 용접부 강도가 모재보다 낮은 점과 잔류자기에 의한 아크 쏠림이 핵심 관리점이다.<\/p>\n<h4>재질 특성<\/h4>\n<ul>\n<li>QT(담금질·뜨임) 또는 이중 노멀라이징·뜨임 열처리, 항복 약 585 MPa 이상, 인장 약 690~825 MPa(ASTM A553 Type I 수준).<\/li>\n<li>−196 °C 샤르피 인성 보증, 고강도라 스테인리스 대비 판 두께 감소.<\/li>\n<li>강자성체: 잔류자기가 남기 쉬움. 열팽창계수는 탄소강과 비슷(오스테나이트계보다 작음).<\/li>\n<\/ul>\n<h4>용접<\/h4>\n<ul>\n<li><b>용접재료<\/b>: 니켈기(Inconel 625 계열, ENiCrMo-3·ENiCrMo-6 등). 극저온 인성은 우수하나 항복강도가 모재보다 낮아 설계 허용응력이 용접부로 결정될 수 있다.<\/li>\n<li><b>잔류자기·아크 쏠림<\/b>: 인양 자석, 자분탐상, 압연 이력으로 자화 → 탈자 처리(잔류자기를 낮은 수준으로 관리), 자석 리프팅 금지, 교류(AC) 용접 활용, 접지 위치 조정.<\/li>\n<li><b>고온균열<\/b>: 니켈기 용접금속의 응고균열 → 희석률·입열 관리, 층간온도 제한(대략 150 °C 이하), 크레이터 처리.<\/li>\n<li><b>열영향부<\/b>: 과대 입열은 HAZ 인성 저하 → 저입열 다층 용접.<\/li>\n<li><b>열처리<\/b>: IGC·IGF는 탄소강·탄소망간강 Type C에 용접후열처리(PWHT)를 요구하지만, 9% Ni강은 통상 PWHT 대상이 아니다(적용 기준·승인 조건 확인).<\/li>\n<li><b>검사<\/b>: 압력용기 맞대기 용접 방사선 투과시험(전수 요구 수준), 니켈기 용접부는 비자성이라 MT 대신 PT, 압력시험(설계압의 1.5배 수준 수압 또는 공압).<\/li>\n<\/ul>\n<h4>변형<\/h4>\n<ul>\n<li>원통 압력용기는 진원도·국부 편평도 공차가 엄격(외압·진공 시 좌굴). 롤 벤딩 정밀도, 길이 이음 용접 순서(대칭), 보강링 취부 순서 관리.<\/li>\n<li>모재와 용접금속의 열팽창 차이로 잔류응력 → 저입열 다층, 균형 용접.<\/li>\n<li>새들 부착부 국부 변형·응력: 패드판, 열수축을 고려한 고정·미끄럼 새들.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 재질 특성<\/h5><p>QT 또는 이중 노멀라이징·뜨임 페라이트강, 항복 약 585 MPa 이상, −196 °C 인성, 강자성(잔류자기), 열팽창 탄소강과 유사.<\/p>\n<h5>2. 용접<\/h5><ul><li>니켈기 용접재료(ENiCrMo-3 등): 인성 우수, 항복강도 모재보다 낮음 → 설계가 용접부 강도로 지배될 수 있음<\/li><li>잔류자기·아크 쏠림: 탈자, 자석 인양 금지, AC 용접<\/li><li>고온균열: 희석·입열 관리, 층간온도 약 150 °C 이하<\/li><li>HAZ 인성: 저입열 다층<\/li><li>PWHT: 탄소강 Type C와 달리 통상 비대상<\/li><li>검사: 맞대기 RT, 니켈기 용접부 PT, 압력시험<\/li><\/ul>\n<h5>3. 변형<\/h5><ul><li>진원도·편평도 공차(진공·외압 좌굴) → 롤 정밀도, 대칭 용접 순서, 보강링 취부 순서<\/li><li>모재-용접금속 팽창 차 잔류응력 → 저입열 균형 용접<\/li><li>새들 부착부 → 패드판, 고정·미끄럼 새들<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 9% Ni Type C의 품질은 탈자 관리와 니켈기 용접 조건에 달려 있으며, 고망간강 대안과 원가·변형을 비교해 선정함.<\/p><\/div><\/section><\/details>"},{"id":"lng-bunkering","p":10,"n":"10.16","h":"LNG 벙커링 방식 4가지와 장단점","t":"LNG 벙커링 방식 4가지와 장단점","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 2번 · 25점"],"q":["<b>112회(2017) 2-2<\/b> LNG 벙커링 방식 4가지와 각각의 장·단점"],"k":"LNG 벙커링은 탱크로리(TTS), 벙커링 선박(STS), 육상 터미널 배관(PTS), 이동식 탱크(ISO 탱크 컨테이너) 교체의 네 방식이 있다. 공급량·속도·투자비·운영 유연성이 서로 달라 선박 규모와 항만 여건으로 고른다.","x":"\n<p class=\"key\">LNG 벙커링은 탱크로리(TTS), 벙커링 선박(STS), 육상 터미널 배관(PTS), 이동식 탱크(ISO 탱크 컨테이너) 교체의 네 방식이 있다. 공급량·속도·투자비·운영 유연성이 서로 달라 선박 규모와 항만 여건으로 고른다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>장점<\/th><th>단점<\/th><th>적합 선박<\/th><\/tr><\/thead><tbody>\n<tr><td>Truck-to-Ship<\/td><td>초기 투자 작음, 유연한 위치<\/td><td>소량(로리 1대 수십 m³), 느림, 다수 로리 연결 시 위험 증가<\/td><td>소형 페리·예인선<\/td><\/tr>\n<tr><td>Ship-to-Ship<\/td><td>대용량·고속, 정박지·안벽 어디서나, 하역과 동시 작업(SIMOPS) 가능<\/td><td>벙커링선 투자, 두 선박 계류·호환성 확인, 해상 조건 제약<\/td><td>대형 컨테이너선·크루즈·벌크선<\/td><\/tr>\n<tr><td>Port-to-Ship(터미널·배관)<\/td><td>최고 속도, 안정적 공급<\/td><td>고정 위치, 인프라 투자 큼, 선박이 터미널로 이동<\/td><td>정기 노선 페리, 터미널 인근 선박<\/td><\/tr>\n<tr><td>이동식 탱크(ISO 탱크)<\/td><td>이송 작업 없이 탱크 교체, 공급망 단순<\/td><td>소량, 크레인·고박 필요, 탱크 회수 물류<\/td><td>소형선, 시범 선박<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>공통 안전 요소: 선박-공급자 ESD 연동, 긴급분리커플링(ERC), 건식 분리 커플링, 증기 반송 라인, 안전구역 설정, ISO 20519와 업계 지침(SGMF) 준수.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>장점<\/th><th>단점<\/th><th>적합<\/th><\/tr><\/thead><tbody>\n<tr><td>Truck-to-Ship<\/td><td>저투자, 유연<\/td><td>소량·느림<\/td><td>소형 페리·예인선<\/td><\/tr>\n<tr><td>Ship-to-Ship<\/td><td>대용량·고속, 하역 동시<\/td><td>벙커링선 투자, 호환성<\/td><td>대형 컨테이너·벌크·크루즈<\/td><\/tr>\n<tr><td>Port-to-Ship<\/td><td>최고 속도, 안정<\/td><td>고정 위치, 인프라비<\/td><td>정기 페리<\/td><\/tr>\n<tr><td>이동식 탱크<\/td><td>이송 없음<\/td><td>소량, 크레인·고박<\/td><td>소형선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>공통 안전<\/h5><p>선박-공급자 ESD 연동, ERC, 건식 분리 커플링, 증기 반송, 안전구역, ISO 20519·SGMF 지침.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 대형선은 STS가 표준이며, 항만 체류 시간 내 동시 작업(SIMOPS) 승인이 운영 경쟁력임.<\/p><\/div><\/section><\/details>"},{"id":"lco2","p":10,"n":"10.17","h":"7,000 CBM급 LCO₂ 운반선 화물창 설계 시 중요 인자 (삼중점 포함)","t":"7,000 CBM급 LCO₂ 운반선 화물창 설계 시 중요 인자 (삼중점 포함)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 3교시 3번 · 25점"],"q":["<b>136회(2025) 3-3<\/b> 7,000 CBM LCO2 Carrier 화물창 설계 시 중요 인자(삼중점 포함)"],"k":"액화 CO₂는 삼중점(−56.6 °C, 5.18 bar 절대압)보다 높은 압력과 임계점(31.1 °C, 73.8 bar)보다 낮은 온도 사이에서만 액체로 존재한다. 압력이 삼중점 아래로 떨어지면 드라이아이스가 생겨 배관·밸브가 막힌다. 7,000 CBM급은 중압(약 15~20 bar, −30~−20 °C) Type C 탱크가 일반적이며, 운전 압력창, 불순물, 높은 밀도, 재료 인성이 핵심 설계 인자다.","x":"\n<p class=\"key\">액화 CO₂는 삼중점(−56.6 °C, 5.18 bar 절대압)보다 높은 압력과 임계점(31.1 °C, 73.8 bar)보다 낮은 온도 사이에서만 액체로 존재한다. 압력이 삼중점 아래로 떨어지면 드라이아이스가 생겨 배관·밸브가 막힌다. 7,000 CBM급은 중압(약 15~20 bar, −30~−20 °C) Type C 탱크가 일반적이며, 운전 압력창, 불순물, 높은 밀도, 재료 인성이 핵심 설계 인자다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 250\" role=\"img\" aria-label=\"CO2 상평형도\">\n<line x1=\"50\" y1=\"220\" x2=\"420\" y2=\"220\" class=\"ln\"/><line x1=\"50\" y1=\"220\" x2=\"50\" y2=\"20\" class=\"ln\"/>\n<path d=\"M60 215 C 110 205, 140 190, 170 170\" class=\"ln2\"/><text x=\"66\" y=\"200\" class=\"t2\">승화선<\/text>\n<path d=\"M170 170 L190 40\" class=\"ln2\"/><text x=\"150\" y=\"60\" class=\"t2\">융해선<\/text>\n<path d=\"M170 170 C 240 130, 300 90, 360 52\" class=\"lr\"/><text x=\"270\" y=\"126\" class=\"t2\">증발선<\/text>\n<circle cx=\"170\" cy=\"170\" r=\"4\" class=\"dot\"/><text x=\"94\" y=\"166\" class=\"t1\">삼중점<\/text><text x=\"70\" y=\"180\" class=\"t2\">−56.6 °C, 5.18 bar<\/text>\n<circle cx=\"360\" cy=\"52\" r=\"4\" class=\"dot\"/><text x=\"320\" y=\"40\" class=\"t1\">임계점<\/text><text x=\"292\" y=\"72\" class=\"t2\">31.1 °C, 73.8 bar<\/text>\n<text x=\"100\" y=\"110\" class=\"tn\">고체<\/text><text x=\"230\" y=\"70\" class=\"tn\">액체<\/text><text x=\"300\" y=\"180\" class=\"tn\">기체<\/text>\n<rect x=\"200\" y=\"120\" width=\"26\" height=\"16\" class=\"fr\"/><text x=\"230\" y=\"132\" class=\"t2\">중압 운송 영역<\/text>\n<rect x=\"176\" y=\"148\" width=\"18\" height=\"12\" class=\"fa\"/><text x=\"128\" y=\"146\" class=\"t2\">저압<\/text>\n<text x=\"400\" y=\"236\" class=\"t2\">T<\/text><text x=\"30\" y=\"28\" class=\"t2\">P<\/text>\n<\/svg><figcaption>CO₂ 상평형도(개념, 축척 아님). 운송 조건은 삼중점 위 증발선 근처의 과냉 액체 영역이다.<\/figcaption><\/figure>\n<h4>설계 인자<\/h4>\n<ol>\n<li><b>압력·온도 운전창<\/b>: 중압(약 15~20 bar, −30~−20 °C) 또는 저압(약 6~10 bar, −50~−45 °C). 저압은 탱크가 얇아져 대형화에 유리하지만 삼중점과 가까워 하역 중 압력 저하 시 드라이아이스 위험이 커진다. 7,000 CBM은 중압이 현실적.<\/li>\n<li><b>드라이아이스 방지<\/b>: 하역·감압 시 압력 제어, 증기 반송, 안전밸브 분출 시 벤트 라인 고체화 대비, 펌프 흡입부 압력 관리.<\/li>\n<li><b>불순물<\/b>: 포집 CO₂의 H₂O, SO₂, NOx, O₂, H₂S, H₂ → 탄산·황산 부식, 상평형 변화, H₂S에 의한 황화물 응력균열. 화물 사양(순도) 관리와 재료 적합성(IGC 17장 CO₂ 특별요건: 고순도·회수품질 구분).<\/li>\n<li><b>탱크 형식·재료<\/b>: Type C 원통·바이로브 압력용기, 저온 인성 탄소망간강(설계 최저온도 대응 샤르피), 두께가 커서 PWHT 필요. 판 두께 한계가 탱크 직경을 제한.<\/li>\n<li><b>높은 밀도<\/b>: 액체 CO₂ 약 1,100~1,170 kg/m³(LNG의 약 2.5배) → 탱크·새들·선체 하중, 배수량 대비 용적, 슬로싱 하중 증가.<\/li>\n<li><b>BOG·압력 관리<\/b>: 연료로 쓸 수 없으므로 재액화 장치 또는 압력 축적, 단열(PUF) 두께.<\/li>\n<li><b>충전한도와 PRV<\/b>: FL·LL 계산, 화재 시 용량.<\/li>\n<li><b>안전<\/b>: CO₂는 공기보다 무거운 질식성 가스 → 벤트 높이, 저부 체류 공간 가스 탐지, 밀폐공간 관리.<\/li>\n<li><b>하역 설비<\/b>: 잠수식·딥웰 펌프, 육상 저장 조건(압력)과의 호환, 선박-육상 ESD.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 상평형도 필수\">\n<h5>1. 상평형<\/h5><div class=\"calc\">삼중점 −56.6 °C, 5.18 bar(a) / 임계점 31.1 °C, 73.8 bar\n→ 삼중점 위·임계점 아래 증발선 근처 과냉 액체로 운송<\/div><p>(답안에 P-T 상평형도: 고체·액체·기체 영역, 삼중점·임계점, 운송 영역 표시)<\/p>\n<h5>2. 중요 인자<\/h5><ol><li>운전창: 중압(약 15~20 bar, −30~−20 °C, 7,000 CBM 적합) vs 저압(약 6~10 bar, −50 °C 내외, 대형화 유리·드라이아이스 위험)<\/li><li>드라이아이스 방지: 하역 압력 제어, 증기 반송, 벤트 고체화 대비<\/li><li>불순물: H₂O·SO₂·NOx·O₂·H₂S → 부식·SSC, 화물 사양(IGC 17장 고순도·회수품질)<\/li><li>탱크·재료: Type C 원통·바이로브, 저온 인성 C-Mn강, 후판 PWHT, 두께가 직경 제한<\/li><li>밀도 약 1,100~1,170 kg/m³ → 새들·선체 하중, 슬로싱<\/li><li>BOG: 연료 불가 → 재액화·압력 축적, 단열<\/li><li>충전한도·PRV<\/li><li>안전: 질식성(무거움) → 벤트 높이, 저부 탐지<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: LCO₂선 설계의 핵심은 삼중점 여유를 지키는 압력 관리와 불순물 대응 재료 선정이며, CCS 가치사슬 확대로 대형 저압선 수요가 커질 것임.<\/p><\/div><\/section><\/details>"},{"id":"alt-fuels","p":10,"n":"10.18","h":"선박연료의 탄소중립과 탄소중립·무탄소 연료의 종류와 특징","t":"선박연료의 탄소중립과 탄소중립·무탄소 연료의 종류와 특징","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 4교시 3번 · 25점"],"q":["<b>130회(2023) 4-3<\/b> 선박연료의 탄소중립과 탄소중립·무탄소 연료의 종류 및 특징"],"k":"선박연료의 탄소중립은 연료를 태울 때(Tank-to-Wake) 뿐 아니라 생산·운송을 포함한 전과정(Well-to-Wake)에서 순배출을 0에 가깝게 만드는 것이다. 바이오·합성(e-) 연료는 탄소를 포함해도 생산 과정에서 흡수·포집한 탄소를 다시 내므로 탄소중립이 될 수 있고, 암모니아·수소는 연소 시 CO₂가 없는 무탄소 연료다.","x":"\n<p class=\"key\">선박연료의 탄소중립은 연료를 태울 때(Tank-to-Wake) 뿐 아니라 생산·운송을 포함한 전과정(Well-to-Wake)에서 순배출을 0에 가깝게 만드는 것이다. 바이오·합성(e-) 연료는 탄소를 포함해도 생산 과정에서 흡수·포집한 탄소를 다시 내므로 탄소중립이 될 수 있고, 암모니아·수소는 연소 시 CO₂가 없는 무탄소 연료다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>연료<\/th><th>저장<\/th><th>LHV MJ/kg<\/th><th>MGO 대비 체적<\/th><th>특징·과제<\/th><\/tr><\/thead><tbody>\n<tr><td>LNG(바이오·e-LNG)<\/td><td>−162 °C<\/td><td class=\"num\">≈ 48~50<\/td><td class=\"num\">≈ 1.7배<\/td><td>기술 성숙, 화석 LNG는 전환기 연료, 메탄 슬립<\/td><\/tr>\n<tr><td>메탄올(바이오·e-)<\/td><td>상온 액체<\/td><td class=\"num\">≈ 19.9<\/td><td class=\"num\">≈ 2.3배<\/td><td>취급 쉬움, 인화점 낮음(11 °C), 독성, IMO 잠정지침(MSC.1/Circ.1621)<\/td><\/tr>\n<tr><td>암모니아<\/td><td>−33 °C 또는 가압<\/td><td class=\"num\">≈ 18.6<\/td><td class=\"num\">≈ 2.8배<\/td><td>무탄소, 독성·부식, 연소성 낮음(파일럿 연료), N₂O 배출, IMO 잠정지침(MSC.1/Circ.1687)<\/td><\/tr>\n<tr><td>수소(액화·압축)<\/td><td>−253 °C / 350~700 bar<\/td><td class=\"num\">≈ 120<\/td><td class=\"num\">≈ 4배 이상<\/td><td>무탄소, 연료전지, 체적 에너지 밀도 매우 낮음, 수소취화, 누설<\/td><\/tr>\n<tr><td>바이오디젤·HVO<\/td><td>상온<\/td><td class=\"num\">≈ 37~44<\/td><td class=\"num\">≈ 1.0~1.1배<\/td><td>기존 기관에 혼합(drop-in), 원료 공급량 한계, 산화 안정성<\/td><\/tr>\n<tr><td>원자력(SMR)<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>무배출, 장기 무연료 보급, 규제·수용성·항만 접근<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>기술사 관점의 판단<\/h4>\n<ul>\n<li>단일 정답 연료는 없다. 선종·항로·공급 인프라에 따라 다연료 전략(이중연료 기관 + fuel-ready 설계)이 현실적이다.<\/li>\n<li>평가는 WtW 기준 온실가스 강도로 해야 한다(EU FuelEU, IMO LCA 지침). 같은 메탄올도 화석 원료면 오히려 배출이 늘 수 있다.<\/li>\n<li>선박 설계 영향: 연료탱크 공간(체적 2~4배), 독성·저인화점 안전설계(IGF), 이중관·환기·가스 탐지, 벙커링 설비.<\/li>\n<li>에너지 효율(ESD, 풍력, 공기윤활)과 선상 탄소포집(OCCS)을 함께 써서 필요한 연료량 자체를 줄인다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 탄소중립의 의미<\/h5><p>연소(TtW)뿐 아니라 생산·운송(WtT)을 포함한 WtW 순배출을 0에 가깝게 함. 바이오·e-연료는 흡수·포집 탄소 재배출로 중립, 암모니아·수소는 무탄소.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>연료<\/th><th>저장<\/th><th>MGO 대비 체적<\/th><th>특징·과제<\/th><\/tr><\/thead><tbody>\n<tr><td>LNG(바이오·e)<\/td><td>−162 °C<\/td><td>약 1.7배<\/td><td>성숙, 슬립<\/td><\/tr>\n<tr><td>메탄올<\/td><td>상온<\/td><td>약 2.3배<\/td><td>취급 쉬움, 저인화점·독성<\/td><\/tr>\n<tr><td>암모니아<\/td><td>−33 °C/가압<\/td><td>약 2.8배<\/td><td>무탄소, 독성, N₂O<\/td><\/tr>\n<tr><td>수소<\/td><td>−253 °C/고압<\/td><td>4배 이상<\/td><td>무탄소, 저밀도, 취화<\/td><\/tr>\n<tr><td>바이오디젤·HVO<\/td><td>상온<\/td><td>약 1.0~1.1배<\/td><td>drop-in, 공급량<\/td><\/tr>\n<tr><td>원자력<\/td><td>-<\/td><td>-<\/td><td>무배출, 규제·수용성<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 단일 정답 연료는 없으므로 이중연료·fuel-ready 다연료 전략과 효율 기술·OCCS를 병행하고, WtW 기준으로 평가해야 함.<\/p><\/div><\/section><\/details>"},{"id":"fuel-cell","p":10,"n":"10.19","h":"연료전지(Fuel Cell)","t":"연료전지(Fuel Cell)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 12번 · 10점"],"q":["<b>136회(2025) 1-12<\/b> 연료전지(Fuel Cell)"],"k":"연료전지는 수소(또는 수소를 포함한 연료)와 산소의 전기화학 반응으로 연소 없이 전기와 열을 직접 만드는 장치다. 카르노 사이클의 제약이 없어 효율이 높고(대략 45~60%, 열 회수 시 더 높음), NOx·SOx·PM이 거의 없으며 소음·진동이 작다.","x":"\n<p class=\"key\">연료전지는 수소(또는 수소를 포함한 연료)와 산소의 전기화학 반응으로 연소 없이 전기와 열을 직접 만드는 장치다. 카르노 사이클의 제약이 없어 효율이 높고(대략 45~60%, 열 회수 시 더 높음), NOx·SOx·PM이 거의 없으며 소음·진동이 작다.<\/p>\n<div class=\"eq\"><div class=\"eql\">PEMFC 전극 반응 (연료극 / 공기극)<\/div><div class=\"mj\">\\[\\mathrm{H_2}\\rightarrow2\\mathrm{H^+}+2e^-,\\qquad \\tfrac12\\mathrm{O_2}+2\\mathrm{H^+}+2e^-\\rightarrow\\mathrm{H_2O}\\]<\/div><\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th class=\"num\">작동온도<\/th><th>연료<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>PEMFC(고분자)<\/td><td class=\"num\">약 80 °C<\/td><td>고순도 수소<\/td><td>빠른 기동·부하 응답, 소형, 연료 순도 민감<\/td><\/tr>\n<tr><td>HT-PEMFC<\/td><td class=\"num\">약 160 °C<\/td><td>수소, 메탄올 개질<\/td><td>CO 내성 개선<\/td><\/tr>\n<tr><td>SOFC(고체산화물)<\/td><td class=\"num\">600~1,000 °C<\/td><td>LNG, 메탄올, 암모니아 내부 개질<\/td><td>고효율, 연료 유연, 기동 느림·열 사이클 약함<\/td><\/tr>\n<tr><td>MCFC(용융탄산염)<\/td><td class=\"num\">약 650 °C<\/td><td>천연가스<\/td><td>대용량, 수명·부식 과제<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p
