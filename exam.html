class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>점성으로 벽면 속도 0에서 외부 유속까지 변하는 얇은 층(두께 δ: 외부 유속 99% 지점).<\/p>\n<h5>2. 특성<\/h5><ul><li>층류 → 천이(평판 Re ≈ 5×10⁵) → 난류<\/li><li>역압력구배(선미)에서 두꺼워지고 박리 → 점성압력저항<\/li><\/ul>\n<h5>3. 선박에서의 의미<\/h5><ul><li>마찰저항(저속 비대선 전저항의 70~90%), 거칠기 영향<\/li><li>선미 경계층 → 반류 → η<sub>H<\/sub> &gt; 1<\/li><li>모형은 경계층이 두꺼워 반류 축척 보정 필요, 공기윤활은 경계층 제어<\/li><\/ul><\/div><\/section><\/details>"},{"id":"corresponding-speed","p":2,"n":"2.3","h":"대응속도(Corresponding Speed)와 Froude 상사","t":"대응속도(Corresponding Speed)와 Froude 상사","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 1번 · 10점"],"q":["<b>112회(2017) 1-1<\/b> 대응속도(Corresponding Speed)"],"k":"대응속도는 모형과 실선의 Froude 수가 같아지는 속도로, Vs = Vm·√λ (λ = Ls/Lm)다. 이때 두 선박의 파형이 기하학적으로 상사하고, 잉여(조파) 저항계수가 같아진다.","x":"\n<p class=\"key\">대응속도는 모형과 실선의 Froude 수가 같아지는 속도로, V<sub>s<\/sub> = V<sub>m<\/sub>·√λ (λ = L<sub>s<\/sub>/L<sub>m<\/sub>)다. 이때 두 선박의 파형이 기하학적으로 상사하고, 잉여(조파) 저항계수가 같아진다.<\/p>\n<h4>근거: Froude의 비교법칙<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[F_n=\\dfrac{V}{\\sqrt{gL}}\\ \\Rightarrow\\ \\dfrac{V_m}{\\sqrt{L_m}}=\\dfrac{V_s}{\\sqrt{L_s}}\\]<\/div><\/div>\n<ul>\n<li>파의 전파속도는 √(gλ<sub>w<\/sub>/2π)이므로, 선박이 만드는 파의 길이는 V²에 비례한다. 길이 비율이 같으려면 V가 √L에 비례해야 한다.<\/li>\n<li>Froude 가설: 전저항 = 마찰저항(Re 의존) + 잉여저항(Fn 의존). 대응속도에서 잉여저항은 배수량 비(λ³)로 그대로 확대된다.<\/li>\n<\/ul>\n<h4>모형시험 절차에서의 쓰임<\/h4>\n<ol>\n<li>실선 속력에 대응하는 모형 속력으로 예인해 전저항 R<sub>TM<\/sub>을 잰다.<\/li>\n<li>C<sub>TM<\/sub>에서 모형 마찰저항(C<sub>FM<\/sub>)을 빼 잉여저항 계수 C<sub>R<\/sub>을 구한다(2차원법). ITTC 78은 형상계수 (1+k)로 점성저항을 분리한다(3차원법).<\/li>\n<li>실선 C<sub>T<\/sub> = C<sub>R<\/sub> + C<sub>FS<\/sub> + ΔC<sub>F<\/sub> + C<sub>A<\/sub> + C<sub>AA<\/sub>로 외삽.<\/li>\n<\/ol>\n<div class=\"warn\"><p>대응속도에서도 레이놀즈 수는 같지 않다. 그래서 \"대응속도에서 전저항계수가 같다\"고 쓰면 틀린다. 같은 것은 잉여저항계수(또는 조파저항계수)다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>모형과 실선의 Froude 수가 같아지는 속도.<\/p>\n<div class=\"calc\">Fn = V/√(gL) → V_s = V_m·√λ  (λ = L_s/L_m)\n예) λ = 40, V_s = 20 kn → V_m = 20/√40 = 3.16 kn<\/div>\n<h5>2. 의미<\/h5><p>파 길이 ∝ V² → 대응속도에서 파형 상사, 잉여(조파) 저항계수 동일(Froude 가설: R<sub>T<\/sub> = R<sub>F<\/sub>(Re) + R<sub>R<\/sub>(Fn)).<\/p>\n<p class=\"concl\"><b>3. 주의<\/b>: 대응속도에서도 Re는 다르므로 전저항계수가 아니라 잉여저항계수가 같음.<\/p><\/div><\/section><\/details>"},{"id":"hullform-resistance","p":2,"n":"2.4","h":"선체저항의 성분과 저항에 영향을 주는 선형요소","t":"선체저항의 성분과 저항에 영향을 주는 선형요소","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 1번 · 25점"],"q":["<b>112회(2017) 4-1<\/b> 선체저항에 영향을 주는 선형요소들"],"k":"선체저항은 마찰저항, 점성압력(형상)저항, 조파저항, 공기저항, 부가물저항으로 나뉜다. 선형요소는 저속 비대선에서는 점성저항(선미 형상)을, 고속 세장선에서는 조파저항(길이·선수 형상)을 통해 저항을 바꾼다.","x":"\n<p class=\"key\">선체저항은 마찰저항, 점성압력(형상)저항, 조파저항, 공기저항, 부가물저항으로 나뉜다. 선형요소는 저속 비대선에서는 점성저항(선미 형상)을, 고속 세장선에서는 조파저항(길이·선수 형상)을 통해 저항을 바꾼다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 210\" role=\"img\" aria-label=\"저항 성분과 Froude 수\">\n<line x1=\"50\" y1=\"180\" x2=\"420\" y2=\"180\" class=\"ln\"/><line x1=\"50\" y1=\"180\" x2=\"50\" y2=\"20\" class=\"ln\"/>\n<path d=\"M50 120 C 150 128, 300 132, 410 134\" class=\"ln2\"/><text x=\"330\" y=\"126\" class=\"tn\">마찰 C<tspan font-size=\"9\">F<\/tspan><\/text>\n<path d=\"M50 112 C 150 120, 300 124, 410 126\" class=\"lg\"/>\n<path d=\"M50 106 C 130 110, 200 104, 240 92 C 270 80, 300 60, 330 66 C 360 72, 390 50, 410 34\" class=\"lr\"/><text x=\"340\" y=\"44\" class=\"tr\">전저항 C<tspan font-size=\"9\">T<\/tspan><\/text>\n<text x=\"370\" y=\"200\" class=\"t2\">F<tspan font-size=\"9\">n<\/tspan><\/text>\n<line x1=\"110\" y1=\"180\" x2=\"110\" y2=\"175\" class=\"ln\"/><text x=\"94\" y=\"195\" class=\"t2\">0.15<\/text>\n<line x1=\"260\" y1=\"180\" x2=\"260\" y2=\"175\" class=\"ln\"/><text x=\"246\" y=\"195\" class=\"t2\">0.30<\/text>\n<text x=\"60\" y=\"150\" class=\"t2\">점성(형상) 1+k<\/text><text x=\"245\" y=\"74\" class=\"t2\">조파 hump<\/text>\n<\/svg><figcaption>저속 비대선(Fn 0.12~0.18)은 점성저항이 대부분이고, Fn 0.25 이상에서 조파저항의 비중과 hump/hollow가 커진다.<\/figcaption><\/figure>\n<h4>저항 성분<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>성분<\/th><th>원인<\/th><th>지배 변수<\/th><\/tr><\/thead><tbody>\n<tr><td>마찰저항<\/td><td>표면 전단응력<\/td><td>Re, 침수표면적 S, 거칠기<\/td><\/tr>\n<tr><td>점성압력저항<\/td><td>선미 경계층 두께 증가·박리로 압력 회복 부족<\/td><td>선미 형상, LCB, C<sub>b<\/sub><\/td><\/tr>\n<tr><td>조파저항<\/td><td>파 생성 에너지(선수파·선미파 간섭)<\/td><td>Fn, L, 선수 형상, 구상선수<\/td><\/tr>\n<tr><td>쇄파저항<\/td><td>선수파 붕괴<\/td><td>입사각, 선수 어깨<\/td><\/tr>\n<tr><td>공기저항<\/td><td>상부구조·갑판 화물 풍압<\/td><td>정면 투영면적, 컨테이너 적재<\/td><\/tr>\n<tr><td>부가물·추가저항<\/td><td>타·빌지킬·축 브래킷, 파랑 중 부가저항<\/td><td>부가물 배치, 해상상태<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선형요소별 영향<\/h4>\n<ul>\n<li><b>길이 L (L/∇<sup>⅓<\/sup>)<\/b>: 길수록 같은 속력의 Fn이 작아져 조파저항 감소. 침수표면적과 강재중량은 증가.<\/li>\n<li><b>방형계수 C<sub>b<\/sub>, 주형계수 C<sub>p<\/sub><\/b>: 크면 조파·점성저항 증가. 속력에 맞는 C<sub>b<\/sub>가 있다(Watson: Fn이 크면 C<sub>b<\/sub>를 낮춘다).<\/li>\n<li><b>L/B, B/T<\/b>: B가 크면 조파저항과 선미 박리 경향 증가. B/T가 크면 평저부가 넓어 마찰은 크지만 조파는 줄 수 있다.<\/li>\n<li><b>부심 위치 LCB<\/b>: 저속선은 약간 앞(+), 고속선은 뒤(−)가 유리.<\/li>\n<li><b>선수 형상<\/b>: 반입사각(half entrance angle), 구상선수 크기·높이로 선수파 상쇄. 저속 운항이 늘면서 구상선수를 줄이는 개조가 많다.<\/li>\n<li><b>선미 형상<\/b>: U형 선미는 반류가 균일해 추진효율에 유리, V형은 점성저항이 작다. 트랜섬 잠김은 고속선 조파 감소에 유리, 저속에서는 손실.<\/li>\n<li><b>평행부 길이, 중앙단면계수 C<sub>m<\/sub>, 수선면계수 C<sub>wp<\/sub><\/b>: 평행부가 길면 화물창 효율은 좋지만 어깨부 압력구배가 급해진다.<\/li>\n<\/ul>\n<div class=\"pro\"><p>최근 선형 설계는 단일 설계점이 아니라 운항 프로파일(여러 흘수·속력의 가중 평균)로 최적화한다. 같은 C<sub>b<\/sub>라도 선미 CFD로 박리를 없애면 3~5% 동력 차이가 난다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 저항 성분<\/h5><p>마찰(Re·S·거칠기), 점성압력(선미 형상), 조파(Fn·L·선수 형상), 쇄파, 공기, 부가물.<\/p>\n<h5>2. 선형요소별 영향<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>요소<\/th><th>영향<\/th><\/tr><\/thead><tbody>\n<tr><td>L(L/∇<sup>1/3<\/sup>)<\/td><td>길수록 Fn↓ → 조파↓, 침수면적·강재↑<\/td><\/tr>\n<tr><td>C<sub>b<\/sub>·C<sub>p<\/sub><\/td><td>클수록 조파·점성↑, 속력별 적정 C<sub>b<\/sub><\/td><\/tr>\n<tr><td>L/B, B/T<\/td><td>B↑ 조파·박리 경향↑<\/td><\/tr>\n<tr><td>LCB<\/td><td>저속선 약간 앞, 고속선 뒤<\/td><\/tr>\n<tr><td>선수 형상<\/td><td>반입사각, 구상선수로 선수파 상쇄<\/td><\/tr>\n<tr><td>선미 형상<\/td><td>U형 반류 균일(추진효율), V형 점성↓, 트랜섬<\/td><\/tr>\n<tr><td>평행부·C<sub>m<\/sub>·C<sub>wp<\/sub><\/td><td>어깨부 압력구배<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 속력 영역별<\/h5><p>저속 비대선(Fn 0.12~0.18): 점성 지배 → 선미 최적화 / Fn 0.25 이상: 조파 지배 → 길이·선수 최적화<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 운항 프로파일 가중 최적화와 CFD 선미 박리 제거로 같은 C<sub>b<\/sub>에서도 수 % 동력 차이가 남.<\/p><\/div><\/section><\/details>"},{"id":"separability","p":2,"n":"2.5","h":"저항 및 자항요소에 대한 선형가분원리(Separability Principle of Ship Forms)","t":"저항 및 자항요소에 대한 선형가분원리(Separability Principle of Ship Forms)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 2번 · 25점"],"q":["<b>115회(2018) 4-2<\/b> 저항 및 자항요소에 대한 선형가분원리(Separability principle of ship forms)"],"k":"선형가분원리는 선체를 전반부와 후반부로 나누어 볼 때, 전반부 형상은 주로 조파저항을, 후반부 형상은 주로 점성압력저항과 자항요소(반류 w, 추력감소 t, 상대회전효율 ηR)를 지배하므로 두 부분의 영향을 독립적으로 다룰 수 있다는 설계 원리다.","x":"\n<p class=\"key\">선형가분원리는 선체를 전반부와 후반부로 나누어 볼 때, 전반부 형상은 주로 조파저항을, 후반부 형상은 주로 점성압력저항과 자항요소(반류 w, 추력감소 t, 상대회전효율 η<sub>R<\/sub>)를 지배하므로 두 부분의 영향을 독립적으로 다룰 수 있다는 설계 원리다.<\/p>\n<h4>내용<\/h4>\n<ul>\n<li><b>전반부(fore body)<\/b>: 선수 형상, 구상선수, 반입사각, 어깨 → 조파·쇄파저항. 점성저항과 자항요소에는 영향이 작다.<\/li>\n<li><b>후반부(after body)<\/b>: 선미 프레임 형상(U/V), 런 길이, 프로펠러 개구 → 경계층 발달, 박리, 반류 분포 → 점성압력저항, w, t, η<sub>R<\/sub>.<\/li>\n<li>평행부가 충분하면 두 부분의 상호작용이 작아 가분성이 잘 성립한다.<\/li>\n<\/ul>\n<h4>활용<\/h4>\n<ul>\n<li>선수부와 선미부를 따로 계열 변화시킨 모형시험(또는 CFD) 결과를 조합해 최적 선형을 빨리 찾는다.<\/li>\n<li>기존 실적선 선미 + 새 선수(또는 그 반대)의 성능을 추정한다.<\/li>\n<li>개조(구상선수 교체)에서 자항요소는 그대로 두고 조파저항만 재평가하는 근거가 된다.<\/li>\n<\/ul>\n<h4>한계<\/h4>\n<p>근사 원리다. 고속선이나 평행부가 짧은 선형에서는 선수파가 선미까지 영향을 주고, 선수 형상이 선미 경계층 두께를 바꾸어 자항요소에도 영향을 준다. 최종 확인은 전선 모형시험이나 CFD로 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>선체를 전반부·후반부로 나누어, 전반부 형상은 주로 조파저항을, 후반부 형상은 점성압력저항과 자항요소(w, t, η<sub>R<\/sub>)를 지배하므로 독립적으로 다룰 수 있다는 원리.<\/p>\n<h5>2. 내용<\/h5><ul><li>전반부: 선수 형상·구상선수·반입사각·어깨 → 조파·쇄파<\/li><li>후반부: 선미 프레임(U/V)·런 길이·프로펠러 개구 → 경계층·박리·반류<\/li><li>평행부가 충분할수록 성립<\/li><\/ul>\n<h5>3. 활용<\/h5><ul><li>선수·선미 계열 변화 시험 결과 조합으로 빠른 최적화<\/li><li>실적선 선미 + 새 선수 성능 추정<\/li><li>구상선수 개조 시 자항요소 유지 가정<\/li><\/ul>\n<h5>4. 한계<\/h5><p>고속선·짧은 평행부에서 선수파가 선미에 영향, 선수 형상이 선미 경계층에 영향 → 전선 시험·CFD로 최종 확인.<\/p><\/div><\/section><\/details>"},{"id":"powers","p":2,"n":"2.6","h":"선체 추진 시 저항과 동력전달과정의 마력(BHP, SHP, DHP, THP, EHP)","t":"선체 추진 시 저항과 동력전달과정의 마력(BHP, SHP, DHP, THP, EHP)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 6번 · 25점"],"q":["<b>121회(2020) 2-6<\/b> 선체 추진 시 저항과 동력전달과정의 마력(BHP, DHP, THP, EHP)"],"k":"기관이 낸 동력은 축계·프로펠러·선체 상호작용 손실을 거치며 줄어 최종적으로 선체를 끄는 유효동력 PE = RT·V가 된다. 각 단계의 효율을 알아야 저항에서 필요 기관출력을 역산할 수 있다.","x":"\n<p class=\"key\">기관이 낸 동력은 축계·프로펠러·선체 상호작용 손실을 거치며 줄어 최종적으로 선체를 끄는 유효동력 P<sub>E<\/sub> = R<sub>T<\/sub>·V가 된다. 각 단계의 효율을 알아야 저항에서 필요 기관출력을 역산할 수 있다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 520 120\" role=\"img\" aria-label=\"동력 전달 계통\">\n<g class=\"t1\">\n<rect x=\"6\" y=\"30\" width=\"80\" height=\"44\" rx=\"4\" class=\"fa\"/><text x=\"46\" y=\"50\" text-anchor=\"middle\">주기관<\/text><text x=\"46\" y=\"66\" text-anchor=\"middle\" class=\"t2\">BHP P<tspan font-size=\"9\">B<\/tspan><\/text>\n<rect x=\"110\" y=\"30\" width=\"80\" height=\"44\" rx=\"4\" class=\"fa\"/><text x=\"150\" y=\"50\" text-anchor=\"middle\">축계<\/text><text x=\"150\" y=\"66\" text-anchor=\"middle\" class=\"t2\">SHP P<tspan font-size=\"9\">S<\/tspan><\/text>\n<rect x=\"214\" y=\"30\" width=\"86\" height=\"44\" rx=\"4\" class=\"fa\"/><text x=\"257\" y=\"50\" text-anchor=\"middle\">프로펠러 입력<\/text><text x=\"257\" y=\"66\" text-anchor=\"middle\" class=\"t2\">DHP P<tspan font-size=\"9\">D<\/tspan><\/text>\n<rect x=\"324\" y=\"30\" width=\"80\" height=\"44\" rx=\"4\" class=\"fa\"/><text x=\"364\" y=\"50\" text-anchor=\"middle\">추력<\/text><text x=\"364\" y=\"66\" text-anchor=\"middle\" class=\"t2\">THP T·V<tspan font-size=\"9\">A<\/tspan><\/text>\n<rect x=\"428\" y=\"30\" width=\"86\" height=\"44\" rx=\"4\" class=\"fr\"/><text x=\"471\" y=\"50\" text-anchor=\"middle\">선체 견인<\/text><text x=\"471\" y=\"66\" text-anchor=\"middle\" class=\"t2\">EHP R<tspan font-size=\"9\">T<\/tspan>·V<\/text>\n<\/g>\n<g class=\"t2\"><text x=\"88\" y=\"24\">η<tspan font-size=\"9\">S<\/tspan>·η<tspan font-size=\"9\">G<\/tspan><\/text><text x=\"192\" y=\"24\">베어링<\/text><text x=\"300\" y=\"24\">η<tspan font-size=\"9\">0<\/tspan>·η<tspan font-size=\"9\">R<\/tspan><\/text><text x=\"404\" y=\"24\">η<tspan font-size=\"9\">H<\/tspan><\/text><\/g>\n<path d=\"M86 52 h24 M190 52 h24 M300 52 h24 M404 52 h24\" class=\"ln\"/>\n<text x=\"260\" y=\"104\" class=\"t2\" text-anchor=\"middle\">η<tspan font-size=\"9\">D<\/tspan> = P<tspan font-size=\"9\">E<\/tspan>/P<tspan font-size=\"9\">D<\/tspan> = η<tspan font-size=\"9\">0<\/tspan>·η<tspan font-size=\"9\">H<\/tspan>·η<tspan font-size=\"9\">R<\/tspan> ≈ 0.65~0.80<\/text>\n<\/svg><\/figure>\n<h4>정의<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>마력<\/th><th>정의<\/th><th>관계<\/th><\/tr><\/thead><tbody>\n<tr><td>BHP 제동마력 P<sub>B<\/sub><\/td><td>기관 출력축에서 동력계로 잰 출력<\/td><td>기관 정격(MCR)의 기준<\/td><\/tr>\n<tr><td>SHP 축마력 P<sub>S<\/sub><\/td><td>중간축에서 토크미터로 잰 동력<\/td><td>P<sub>S<\/sub> = P<sub>B<\/sub>·η<sub>G<\/sub> (감속기 있을 때)<\/td><\/tr>\n<tr><td>DHP 전달마력 P<sub>D<\/sub><\/td><td>프로펠러에 전달된 동력 2πnQ<\/td><td>P<sub>D<\/sub> = P<sub>S<\/sub>·η<sub>S<\/sub> (η<sub>S<\/sub> ≈ 0.98~0.99)<\/td><\/tr>\n<tr><td>THP 추진마력 P<sub>T<\/sub><\/td><td>추력 × 프로펠러 전진속도 T·V<sub>A<\/sub><\/td><td>P<sub>T<\/sub> = P<sub>D<\/sub>·η<sub>0<\/sub>·η<sub>R<\/sub><\/td><\/tr>\n<tr><td>EHP 유효마력 P<sub>E<\/sub><\/td><td>전저항 × 선속 R<sub>T<\/sub>·V<\/td><td>P<sub>E<\/sub> = P<sub>T<\/sub>·η<sub>H<\/sub><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"mj\">\\[\\eta_H=\\dfrac{1-t}{1-w},\\qquad w=1-\\dfrac{V_A}{V},\\qquad t=1-\\dfrac{R_T}{T}\\]<\/div><\/div>\n<p>단축 비대선은 반류가 커서 η<sub>H<\/sub>가 1.1~1.3으로 1보다 크다. 프로펠러가 선체가 느리게 만든 물을 밀기 때문이다.<\/p>\n<h4>설계 출력 결정<\/h4>\n<ol>\n<li>모형시험·CFD로 P<sub>E<\/sub>, 자항시험으로 η<sub>D<\/sub> → P<sub>D<\/sub>.<\/li>\n<li>해상여유(sea margin, 대개 15%)를 더해 실해역 운항 동력 산정.<\/li>\n<li>기관여유(engine margin, 10~15%)를 두어 NCR(상용출력) = MCR의 85~90%가 되게 기관 선정.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 저항<\/h5><p>R<sub>T<\/sub> = 마찰 + 점성압력 + 조파 + 공기 + 부가물 → P<sub>E<\/sub> = R<sub>T<\/sub>·V<\/p>\n<h5>2. 동력 전달과 마력<\/h5><div class=\"calc\">BHP(P_B) → [감속기 η_G] → SHP(P_S) → [축 η_S ≈ 0.98~0.99] → DHP(P_D = 2πnQ)\n→ [η_0·η_R] → THP(P_T = T·V_A) → [η_H] → EHP(P_E = R_T·V)\nη_D = P_E/P_D = η_0·η_H·η_R ≈ 0.65~0.80,  η_H = (1−t)/(1−w)<\/div>\n<h5>3. 마력 정의<\/h5><ul><li>제동마력: 기관 출력축(동력계) / 축마력: 중간축 토크미터 / 전달마력: 프로펠러 입력 / 추진마력: T·V<sub>A<\/sub> / 유효마력: R<sub>T<\/sub>·V<\/li><\/ul>\n<h5>4. 설계 출력<\/h5><p>P<sub>D<\/sub> + 해상여유(15%) → 기관여유(10~15%) → MCR (NCR = MCR의 85~90%)<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 단축 비대선은 η<sub>H<\/sub>가 1보다 커서(반류 이용) 선미 형상이 저항뿐 아니라 추진효율을 좌우함.<\/p><\/div><\/section><\/details>"},{"id":"power-estimation","p":2,"n":"2.7","h":"소요마력 추정방법","t":"소요마력 추정방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 7번 · 10점"],"q":["<b>118회(2019) 1-7<\/b> 소요마력 추정방법"],"k":"소요마력은 설계 단계에 따라 실적선 비교(어드미럴티 계수) → 통계 회귀식(Holtrop-Mennen) → 계열시험 자료 → CFD → 모형시험(ITTC 1978) 순으로 정밀도를 높여 추정한다.","x":"\n<p class=\"key\">소요마력은 설계 단계에 따라 실적선 비교(어드미럴티 계수) → 통계 회귀식(Holtrop-Mennen) → 계열시험 자료 → CFD → 모형시험(ITTC 1978) 순으로 정밀도를 높여 추정한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>내용<\/th><th>단계·정확도<\/th><\/tr><\/thead><tbody>\n<tr><td>어드미럴티 계수<\/td><td>P = Δ<sup>⅔<\/sup>V³/C, 유사선 C 사용<\/td><td>영업·개념설계, ±10%<\/td><\/tr>\n<tr><td>실적선 EHP 환산<\/td><td>Froude 상사로 유사선 C<sub>R<\/sub> 사용, 마찰은 새로 계산<\/td><td>기본설계 초기<\/td><\/tr>\n<tr><td>통계 회귀식<\/td><td>Holtrop-Mennen 등 주요치수·계수로 저항 성분 회귀<\/td><td>기본설계, ±5~10%<\/td><\/tr>\n<tr><td>계열시험 자료<\/td><td>Taylor, Series 60, 각 조선소 DB<\/td><td>선형 변화 비교<\/td><\/tr>\n<tr><td>CFD<\/td><td>RANS로 저항·자항 직접 계산, 실선 Re 해석<\/td><td>선형 최적화, 모형시험 전 검증<\/td><\/tr>\n<tr><td>모형시험<\/td><td>저항·POW·자항시험 + ITTC 78 외삽<\/td><td>계약 속력 보증 근거, ±2~3%<\/td><\/tr>\n<tr><td>시운전 해석<\/td><td>ISO 15016 / ITTC 보정으로 실선 속력-동력 확정<\/td><td>보증 검증, 후속선 자료<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>어느 방법이든 마지막에 해상여유와 기관여유를 더해 주기관 MCR을 정한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>내용<\/th><th>단계<\/th><\/tr><\/thead><tbody>\n<tr><td>어드미럴티 계수<\/td><td>P = Δ<sup>2/3<\/sup>V³/C<\/td><td>영업<\/td><\/tr>\n<tr><td>실적선 환산<\/td><td>Froude 상사 C<sub>R<\/sub> 이용<\/td><td>기본 초기<\/td><\/tr>\n<tr><td>통계 회귀식<\/td><td>Holtrop-Mennen<\/td><td>기본<\/td><\/tr>\n<tr><td>CFD<\/td><td>RANS 저항·자항<\/td><td>최적화<\/td><\/tr>\n<tr><td>모형시험<\/td><td>저항·POW·자항 + ITTC 78<\/td><td>보증 근거<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 단계별로 정밀도를 높이고 마지막에 해상·기관 여유를 더해 MCR을 정함.<\/p><\/div><\/section><\/details>"},{"id":"admiralty","p":2,"n":"2.8","h":"어드미럴티 계수(Admiralty Coefficient)를 이용한 소요마력 추정","t":"어드미럴티 계수(Admiralty Coefficient)를 이용한 소요마력 추정","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 2번 · 25점","133회 1교시 7번 · 10점"],"q":["<b>115회(2018) 3-2<\/b> Admiralty 계수를 이용한 소요마력 추정방법","<b>133회(2024) 1-7<\/b> 어드미럴티 계수(Admiralty coefficient)"],"k":"어드미럴티 계수 C = Δ⅔·V³/P는 같은 선형 계열, 비슷한 Froude 수의 선박끼리 거의 일정하다는 경험 상수다. 유사 실적선의 C를 쓰면 새 선박의 배수량과 속력만으로 동력을 바로 추정할 수 있다.","x":"\n<p class=\"key\">어드미럴티 계수 C = Δ<sup>⅔<\/sup>·V³/P는 같은 선형 계열, 비슷한 Froude 수의 선박끼리 거의 일정하다는 경험 상수다. 유사 실적선의 C를 쓰면 새 선박의 배수량과 속력만으로 동력을 바로 추정할 수 있다.<\/p>\n<h4>유도<\/h4>\n<ul>\n<li>저항 R ∝ ½ρSV², 침수표면적 S ∝ ∇<sup>⅔<\/sup> ∝ Δ<sup>⅔<\/sup>.<\/li>\n<li>동력 P = R·V/η<sub>D<\/sub> ∝ Δ<sup>⅔<\/sup>V³ (η<sub>D<\/sub> 일정 가정).<\/li>\n<li>따라서 Δ<sup>⅔<\/sup>V³/P = C (단위: Δ[t], V[kn], P[kW] 또는 [PS]이므로 단위계를 반드시 명시).<\/li>\n<\/ul>\n<h4>추정 절차<\/h4>\n<ol>\n<li>선형·크기·Fn이 비슷한 실적선의 시운전 자료에서 C를 계산한다.<\/li>\n<li>P<sub>new<\/sub> = Δ<sub>new<\/sub><sup>⅔<\/sup>·V<sub>new<\/sub>³ / C.<\/li>\n<li>해상여유·기관여유를 더해 MCR을 정한다.<\/li>\n<\/ol>\n<div class=\"eq\"><div class=\"eql\">같은 선박의 흘수 변화 / 속력 변화<\/div><div class=\"mj\">\\[P_2=P_1\\left(\\dfrac{\\Delta_2}{\\Delta_1}\\right)^{2/3},\\qquad P_2=P_1\\left(\\dfrac{V_2}{V_1}\\right)^{3}\\]<\/div><\/div>\n<h4>한계<\/h4>\n<ul>\n<li>R ∝ V² 가정은 조파저항이 커지는 고속에서 깨진다(실제 지수 3보다 크다).<\/li>\n<li>η<sub>D<\/sub>, 선형계수, 거칠기 차이를 반영하지 못한다. Fn 범위가 다르면 C가 크게 달라진다.<\/li>\n<li>연료계수(fuel coefficient) Δ<sup>⅔<\/sup>V³/일일 연료소모량도 같은 원리다.<\/li>\n<\/ul>\n<div class=\"pro\"><p>시운전에서 계약 흘수로 시험하지 못하고 밸러스트 흘수로 시험하면, 계약 상태 동력 환산에 Δ<sup>⅔<\/sup> 비례(어드미럴티 식)를 쓰기도 한다. 다만 보증 판정은 모형시험 기반의 흘수 간 상관을 쓰는 것이 원칙이다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-3-2<\/td><td>Admiralty 계수로 소요마력 추정<\/td><td class=\"num\">25<\/td><td>유도·절차·한계·예제<\/td><\/tr>\n<tr><td class=\"num\">133-1-7<\/td><td>어드미럴티 계수<\/td><td class=\"num\">10<\/td><td>정의·식·가정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 115회형\">\n<h5>1. 정의<\/h5><p>C = Δ<sup>2/3<\/sup>·V³ / P : 같은 선형 계열·비슷한 Fn의 선박에서 거의 일정한 경험 상수.<\/p>\n<h5>2. 유도<\/h5><div class=\"calc\">R ∝ ½ρSV²,  S ∝ Δ^(2/3)  →  P = R·V/η_D ∝ Δ^(2/3)·V³  (η_D 일정 가정)<\/div>\n<h5>3. 추정 절차와 예제<\/h5>\n<div class=\"calc\">실적선: Δ = 60,000 t, V = 14.5 kn, P = 8,000 kW → C = 60,000^(2/3)×14.5³/8,000 = 1,533×3,049/8,000 ≈ 584\n신조선: Δ = 66,000 t, V = 14.5 kn → P = 66,000^(2/3)×3,049/584 ≈ 1,633×3,049/584 ≈ 8,530 kW\n+ 해상여유 15%, 기관여유 10% → MCR ≈ 8,530×1.15/0.90 ≈ 10,900 kW<\/div>\n<h5>4. 한계<\/h5><ul><li>R ∝ V² 가정은 고속(조파 증가)에서 깨짐<\/li><li>η<sub>D<\/sub>·선형계수·거칠기 차이 미반영, Fn 범위가 다르면 C 변화<\/li><li>단위(Δ[t], V[kn], P[kW/PS]) 명시 필수<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 영업·개념설계용 빠른 추정법이며, 계약 보증은 모형시험·CFD 기반으로 다시 확정해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"optimal-hullform","p":2,"n":"2.9","h":"선박의 경제성을 고려한 최적 선형설계","t":"선박의 경제성을 고려한 최적 선형설계","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 2교시 1번 · 25점"],"q":["<b>124회(2021) 2-1<\/b> 선박의 경제성을 고려한 최적 선형설계"],"k":"최적 선형은 저항이 가장 작은 선형이 아니라, 선주의 운송 목적(화물량·항로·속력)을 만족하면서 건조비와 운항비를 합한 경제 지표(소요운임률 RFR, NPV)가 가장 좋은 선형이다. 지금은 EEDI·CII 같은 탄소 규제도 제약조건이다.","x":"\n<p class=\"key\">최적 선형은 저항이 가장 작은 선형이 아니라, 선주의 운송 목적(화물량·항로·속력)을 만족하면서 건조비와 운항비를 합한 경제 지표(소요운임률 RFR, NPV)가 가장 좋은 선형이다. 지금은 EEDI·CII 같은 탄소 규제도 제약조건이다.<\/p>\n<h4>목적함수와 제약<\/h4>\n<ul>\n<li><b>목적함수<\/b>: 소요운임률 RFR = (연간 자본비 + 운항비 + 연료비) / 연간 수송량. 또는 수명 주기 NPV 최대.<\/li>\n<li><b>제약<\/b>: 재화중량·화물용적·TEU, 서비스 속력, 항만·운하 제한(파나막스 폭 32.2 m, 수에즈 흘수 등), 복원성, 건현, 조종성, EEDI 요구치, 진동·캐비테이션.<\/li>\n<\/ul>\n<h4>설계 변수별 경제적 trade-off<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>변수<\/th><th>증가 시 이득<\/th><th>증가 시 손실<\/th><\/tr><\/thead><tbody>\n<tr><td>L<\/td><td>조파저항·연료비 감소<\/td><td>강재중량·건조비 증가, 선대 운용 제약<\/td><\/tr>\n<tr><td>B<\/td><td>복원성, 화물 적재, 강재 효율<\/td><td>저항 증가, 운하 제한<\/td><\/tr>\n<tr><td>T<\/td><td>같은 Δ에서 L·B 축소 가능, 프로펠러 직경 확대<\/td><td>항만 수심 제약<\/td><\/tr>\n<tr><td>C<sub>b<\/sub><\/td><td>같은 치수에 화물 증가<\/td><td>저항·추진효율 악화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>최적화 절차<\/h4>\n<ol>\n<li>실적선 DB와 회귀식으로 주요치수 후보 생성(파라메트릭 스터디).<\/li>\n<li>각 후보의 강재중량·건조비·소요동력·연료비 추정 → RFR 비교로 주요치수 결정.<\/li>\n<li>CFD 기반 형상 최적화: 구상선수, 선미, 선수 어깨를 운항 프로파일(다흘수·다속력 가중) 기준으로 최적화.<\/li>\n<li>모형시험 검증, ESD 조합 평가.<\/li>\n<\/ol>\n<div class=\"pro\"><p>2008년 이후 감속운항(slow steaming)이 일반화되어 설계속력과 실제 운항속력이 달라졌다. 그래서 설계점 단일 최적이 아니라 실제 운항 분포를 가중한 최적화를 해야 하며, 컨테이너선은 구상선수를 저속에 맞춰 개조하는 사례가 많다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>최적 선형은 저항 최소가 아니라 소요운임률(RFR) 또는 NPV가 최적인 선형이며, EEDI·CII가 제약으로 추가됨.<\/p>\n<h5>2. 목적함수·제약<\/h5><ul><li>RFR = (자본비 + 운항비 + 연료비) / 연간 수송량<\/li><li>제약: DWT·용적·TEU, 속력, 항만·운하, 복원성·건현, 조종성, EEDI<\/li><\/ul>\n<h5>3. 주요치수 trade-off<\/h5><p>L↑ 연료↓·강재↑ / B↑ 복원성↑·저항↑ / T↑ 프로펠러↑·항만 제약 / C<sub>b<\/sub>↑ 화물↑·저항↑<\/p>\n<h5>4. 절차<\/h5><ol><li>파라메트릭 스터디(실적 DB)<\/li><li>후보별 중량·건조비·동력·연료비 → RFR 비교<\/li><li>CFD 형상 최적화(다흘수·다속력 가중)<\/li><li>모형시험, ESD 조합<\/li><\/ol>\n<p class=\"concl\"><b>5. 결론<\/b>: 감속 운항과 탄소비용 시대에는 운항 프로파일 기반 최적화와 연료 가격·탄소가 민감도 분석이 필수임.<\/p><\/div><\/section><\/details>"},{"id":"wake","p":2,"n":"2.10","h":"공칭반류(Nominal Wake)와 유효반류(Effective Wake)","t":"공칭반류(Nominal Wake)와 유효반류(Effective Wake)","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 4번 · 25점","124회 1교시 13번 · 10점"],"q":["<b>115회(2018) 4-4<\/b> 유효반류와 공칭반류의 구별, 유효반류 계측이 어려운 이유","<b>124회(2021) 1-13<\/b> 공칭반류와 유효반류"],"k":"공칭반류는 프로펠러가 없을 때 프로펠러 면에서 잰 선체 후류의 속도 결손이고, 유효반류는 프로펠러가 작동하는 상태에서 추력 일치법으로 역산한 평균 유입속도의 결손이다. 프로펠러의 유도속도와 선체 반류가 섞여 있어 유효반류는 직접 계측할 수 없다.","x":"\n<p class=\"key\">공칭반류는 프로펠러가 없을 때 프로펠러 면에서 잰 선체 후류의 속도 결손이고, 유효반류는 프로펠러가 작동하는 상태에서 추력 일치법으로 역산한 평균 유입속도의 결손이다. 프로펠러의 유도속도와 선체 반류가 섞여 있어 유효반류는 직접 계측할 수 없다.<\/p>\n<h4>정의<\/h4>\n<div class=\"eq\"><div class=\"eql\">Taylor 반류계수<\/div><div class=\"mj\">\\[w=1-\\dfrac{V_A}{V}\\]<\/div><\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>공칭반류 w<sub>N<\/sub><\/th><th>유효반류 w<sub>T<\/sub>(또는 w<sub>Q<\/sub>)<\/th><\/tr><\/thead><tbody>\n<tr><td>조건<\/td><td>프로펠러 없이 예인<\/td><td>프로펠러 작동(자항시험)<\/td><\/tr>\n<tr><td>계측<\/td><td>피토관·5공 피토·LDV/PIV로 프로펠러 면 속도분포 측정<\/td><td>자항시험 추력 T → 단독특성 K<sub>T<\/sub>(J)에서 J 역산 → V<sub>A<\/sub><\/td><\/tr>\n<tr><td>정보<\/td><td>원주·반경 방향 분포(비균일성)<\/td><td>체적 평균값 하나<\/td><\/tr>\n<tr><td>용도<\/td><td>프로펠러 날개 설계, 캐비테이션·기진력 평가<\/td><td>동력 추정, 선체효율 η<sub>H<\/sub><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>반류의 성분<\/h4>\n<ul>\n<li>포텐셜 반류: 선미 유선 확산에 의한 속도 감소.<\/li>\n<li>마찰 반류: 경계층 속도 결손(가장 큼).<\/li>\n<li>파 반류: 선미 파의 궤도속도.<\/li>\n<\/ul>\n<h4>유효반류 계측이 어려운 이유<\/h4>\n<ol>\n<li>프로펠러가 작동하면 흡입에 의한 유도속도가 생겨 선체 주위 유동 자체가 바뀐다. 이 상태에서 계측한 속도에는 유도속도가 섞여 있어 \"선체가 만든 반류\"만 분리할 수 없다.<\/li>\n<li>프로펠러 면 바로 앞 유동은 회전·비정상이라 프로브를 둘 수 없다.<\/li>\n<li>그래서 균일류 단독시험(POW)의 K<sub>T<\/sub>–J 관계를 쓰는 추력 일치법(thrust identity)으로 간접 산정한다. 이 값은 단독특성 곡선의 정확도와 축척효과에 의존한다.<\/li>\n<li>모형은 Re가 작아 경계층이 두꺼우므로 w가 실선보다 크다. ITTC 78 식으로 실선값으로 보정한다.<\/li>\n<\/ol>\n<div class=\"eq\"><div class=\"eql\">ITTC 1978 반류 축척 보정<\/div><div class=\"mj\">\\[w_{TS}=(t+0.04)+(w_{TM}-t-0.04)\\,\\dfrac{(1+k)\\,C_{FS}+\\Delta C_F}{(1+k)\\,C_{FM}}\\]<\/div><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-4-4<\/td><td>구별, 유효반류 계측이 어려운 이유<\/td><td class=\"num\">25<\/td><td>이유 4가지와 추력 일치법<\/td><\/tr>\n<tr><td class=\"num\">124-1-13<\/td><td>공칭반류와 유효반류<\/td><td class=\"num\">10<\/td><td>비교표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 115회형\">\n<h5>1. 정의<\/h5><div class=\"calc\">w = 1 − V_A / V  (Taylor 반류계수)<\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>공칭반류<\/th><th>유효반류<\/th><\/tr><\/thead><tbody>\n<tr><td>조건<\/td><td>프로펠러 없이<\/td><td>프로펠러 작동<\/td><\/tr>\n<tr><td>계측<\/td><td>피토관·LDV 속도분포<\/td><td>자항 추력 → POW K<sub>T<\/sub>(J) → V<sub>A<\/sub> 역산<\/td><\/tr>\n<tr><td>정보<\/td><td>분포(비균일성)<\/td><td>평균값<\/td><\/tr>\n<tr><td>용도<\/td><td>날개 설계, 캐비테이션<\/td><td>동력 추정, η<sub>H<\/sub><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 반류 성분<\/h5><p>포텐셜 반류, 마찰 반류(최대), 파 반류<\/p>\n<h5>3. 유효반류 계측이 어려운 이유<\/h5><ol><li>프로펠러 흡입 유도속도가 유동을 바꿔 선체 반류만 분리 불가<\/li><li>프로펠러 면 직전은 회전·비정상 유동으로 프로브 설치 불가<\/li><li>추력 일치법은 POW 곡선 정확도에 의존(간접값)<\/li><li>모형 Re가 작아 경계층이 두꺼움 → 실선 보정 필요<\/li><\/ol>\n<div class=\"calc\">w_TS = (t + 0.04) + (w_TM − t − 0.04)·[(1+k)C_FS + ΔC_F] / [(1+k)C_FM]<\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 동력 추정에는 유효반류, 프로펠러 날개 설계에는 공칭반류 분포를 쓰며, 축척효과 보정이 실선 성능 예측의 핵심임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"pow-test","p":2,"n":"2.11","h":"프로펠러 단독시험(Propeller Open Water Test)의 이유와 방법","t":"프로펠러 단독시험(Propeller Open Water Test)의 이유와 방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 2교시 2번 · 25점"],"q":["<b>115회(2018) 2-2<\/b> 프로펠러 단독시험을 수행하는 이유와 방법"],"k":"단독시험은 선체 없이 균일류 속에서 모형 프로펠러의 추력·토크를 전진비 J별로 계측해 KT, KQ, η0 곡선을 얻는 시험이다. 자항시험 해석(유효반류·ηR 산정)과 실선 동력 추정의 필수 입력이다.","x":"\n<p class=\"key\">단독시험은 선체 없이 균일류 속에서 모형 프로펠러의 추력·토크를 전진비 J별로 계측해 K<sub>T<\/sub>, K<sub>Q<\/sub>, η<sub>0<\/sub> 곡선을 얻는 시험이다. 자항시험 해석(유효반류·η<sub>R<\/sub> 산정)과 실선 동력 추정의 필수 입력이다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 220\" role=\"img\" aria-label=\"프로펠러 단독특성 곡선\">\n<line x1=\"50\" y1=\"190\" x2=\"400\" y2=\"190\" class=\"ln\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"20\" class=\"ln\"/>\n<path d=\"M50 50 L360 175\" class=\"ln2\"/><text x=\"300\" y=\"140\" class=\"tn\">K<tspan font-size=\"9\">T<\/tspan><\/text>\n<path d=\"M50 30 L370 160\" class=\"lg\"/><text x=\"330\" y=\"132\" class=\"t2\">10K<tspan font-size=\"9\">Q<\/tspan><\/text>\n<path d=\"M50 190 C 120 120, 220 70, 300 62 C 330 60, 355 90, 370 140\" class=\"lr\"/><text x=\"230\" y=\"58\" class=\"tr\">η<tspan font-size=\"9\">0<\/tspan><\/text>\n<text x=\"345\" y=\"205\" class=\"t2\">J = V<tspan font-size=\"9\">A<\/tspan>/nD<\/text>\n<\/svg><figcaption>J가 커질수록(가볍게 돌수록) K<sub>T<\/sub>, K<sub>Q<\/sub>는 줄고 효율 η<sub>0<\/sub>는 최대점을 지나 급감한다.<\/figcaption><\/figure>\n<h4>정의<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[J=\\dfrac{V_A}{nD},\\quad K_T=\\dfrac{T}{\\rho n^2D^4},\\quad K_Q=\\dfrac{Q}{\\rho n^2D^5},\\quad \\eta_0=\\dfrac{J\\,K_T}{2\\pi K_Q}\\]<\/div><\/div>\n<h4>수행 이유<\/h4>\n<ul>\n<li>프로펠러 설계 성능 확인(설계점 효율·피치 적정성).<\/li>\n<li>자항시험 해석: 자항 추력과 단독 K<sub>T<\/sub> 곡선으로 V<sub>A<\/sub>(유효반류)와 상대회전효율 η<sub>R<\/sub> = K<sub>Q0<\/sub>/K<sub>Q<\/sub>를 구한다.<\/li>\n<li>실선 동력 추정(ITTC 78)과 운항 중 성능 분석의 기준 곡선.<\/li>\n<li>계열 프로펠러(B-series) 자료와 비교, 설계 수정의 근거.<\/li>\n<\/ul>\n<h4>방법<\/h4>\n<ol>\n<li>모형 프로펠러를 단독시험 장치(open water boat) 앞에 장착, 선체 영향 없도록 축 방향으로 충분히 떨어뜨린다.<\/li>\n<li>잠김 깊이는 직경 이상(공기 흡입·자유표면 영향 방지).<\/li>\n<li>회전수를 일정하게 두고 예인속도를 바꿔(또는 그 반대) J 범위 0~무추력점까지 계측.<\/li>\n<li>Re(0.75R 익현 기준)를 일정 이상(ITTC 권고 수준)으로 유지해 층류 영향을 줄이고, 허브만 단 상태의 추력·토크를 빼서 보정.<\/li>\n<li>결과를 무차원화, 실선 날개 마찰 차이로 K<sub>T<\/sub>·K<sub>Q<\/sub> 축척 보정.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>선체 없이 균일류 중 모형 프로펠러의 추력·토크를 전진비별로 계측해 단독특성 곡선을 얻는 시험.<\/p>\n<div class=\"calc\">J = V_A/(nD),  K_T = T/(ρn²D⁴),  K_Q = Q/(ρn²D⁵),  η_0 = J·K_T/(2πK_Q)<\/div>\n<h5>2. 이유<\/h5><ol><li>프로펠러 설계 성능 확인<\/li><li>자항시험 해석: 추력 일치로 유효반류, η<sub>R<\/sub> = K<sub>Q0<\/sub>/K<sub>Q<\/sub><\/li><li>실선 동력 추정(ITTC 78) 기준 곡선<\/li><li>계열 자료 비교·설계 수정 근거<\/li><\/ol>\n<h5>3. 방법<\/h5><ol><li>단독시험 장치 앞 장착(선체 영향 배제)<\/li><li>잠김 ≥ 직경<\/li><li>회전수 일정, 예인속도 변화로 J = 0 ~ 무추력점<\/li><li>Re 하한 유지, 허브 단독 보정<\/li><li>무차원화, 날개 마찰 축척 보정<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 단독특성은 자항 해석과 동력 추정 전체의 기준이므로 Re 영향 관리가 정확도의 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"propeller-parameters","p":2,"n":"2.12","h":"프로펠러 설계변수의 종류와 정의","t":"프로펠러 설계변수의 종류와 정의","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 2교시 4번 · 25점"],"q":["<b>118회(2019) 2-4<\/b> 프로펠러 설계변수의 종류와 각각의 정의"],"k":"프로펠러 설계는 직경·피치비·날개수·전개면적비·스큐·레이크·익단면을 정해 주어진 동력과 회전수에서 효율을 최대로 하되, 캐비테이션·진동·강도 제약을 만족시키는 일이다.","x":"\n<p class=\"key\">프로펠러 설계는 직경·피치비·날개수·전개면적비·스큐·레이크·익단면을 정해 주어진 동력과 회전수에서 효율을 최대로 하되, 캐비테이션·진동·강도 제약을 만족시키는 일이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>변수<\/th><th>정의<\/th><th>설계 영향<\/th><\/tr><\/thead><tbody>\n<tr><td>직경 D<\/td><td>날개 끝이 그리는 원의 지름<\/td><td>클수록 효율↑(추력 하중 감소), 선체 간격·흘수 제약<\/td><\/tr>\n<tr><td>피치 P, 피치비 P/D<\/td><td>1회전당 이론 전진 거리<\/td><td>회전수-동력 정합(heavy/light running)<\/td><\/tr>\n<tr><td>날개수 Z<\/td><td>3~7<\/td><td>기진 주파수(Z·n), 날개 하중 분산, 효율은 적을수록 약간 유리<\/td><\/tr>\n<tr><td>전개면적비 A<sub>E<\/sub>/A<sub>0<\/sub><\/td><td>날개 전개면적 / 원판 면적<\/td><td>캐비테이션 여유(Keller식), 클수록 마찰손실↑<\/td><\/tr>\n<tr><td>스큐(skew)<\/td><td>날개 중심선의 원주 방향 휨 각<\/td><td>비균일 반류 통과 시차로 압력변동·진동 감소, 날개 응력↑<\/td><\/tr>\n<tr><td>레이크(rake)<\/td><td>날개의 축 방향 기울기<\/td><td>선체 간격 확보<\/td><\/tr>\n<tr><td>보스비 d<sub>h<\/sub>/D<\/td><td>허브 지름/직경<\/td><td>CPP는 크다(효율 손실)<\/td><\/tr>\n<tr><td>익단면<\/td><td>NACA 66 a=0.8 등, 두께·캠버 분포<\/td><td>캐비테이션 버킷 폭, 강도<\/td><\/tr>\n<tr><td>회전수 n<\/td><td>rpm<\/td><td>저회전·대직경일수록 효율↑ (기관 선택과 연동)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">설계 계수 — B<sub>p<\/sub>–δ 선도에서 최적 직경·피치비 선정<\/div><div class=\"mj\">\\[B_p=\\dfrac{N\\sqrt{P_D}}{V_A^{2.5}},\\qquad \\delta=\\dfrac{N\\,D}{V_A}\\]<\/div><\/div>\n<div class=\"eq\"><div class=\"eql\">Keller 식(최소 전개면적비)<\/div><div class=\"mj\">\\[\\dfrac{A_E}{A_0}=\\dfrac{(1.3+0.3Z)\\,T}{(p_0-p_v)\\,D^2}+k\\]<\/div><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>변수<\/th><th>정의<\/th><th>영향<\/th><\/tr><\/thead><tbody>\n<tr><td>직경 D<\/td><td>날개 끝 원 지름<\/td><td>클수록 효율↑, 간격 제약<\/td><\/tr>\n<tr><td>피치비 P/D<\/td><td>1회전 이론 전진거리/D<\/td><td>회전수-동력 정합<\/td><\/tr>\n<tr><td>날개수 Z<\/td><td>3~7<\/td><td>기진 주파수 Z·n<\/td><\/tr>\n<tr><td>전개면적비 A<sub>E<\/sub>/A<sub>0<\/sub><\/td><td>날개 전개면적/원판면적<\/td><td>캐비테이션 여유<\/td><\/tr>\n<tr><td>스큐<\/td><td>원주 방향 휨 각<\/td><td>압력변동·진동↓<\/td><\/tr>\n<tr><td>레이크<\/td><td>축 방향 기울기<\/td><td>선체 간격<\/td><\/tr>\n<tr><td>보스비<\/td><td>허브지름/D<\/td><td>CPP 효율 손실<\/td><\/tr>\n<tr><td>익단면<\/td><td>NACA 66 a=0.8 등<\/td><td>버킷·강도<\/td><\/tr>\n<tr><td>회전수 n<\/td><td>rpm<\/td><td>저회전 대직경 유리<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"calc\">B_p = N·√P_D / V_A^2.5,  δ = N·D / V_A  → B_p–δ 선도에서 최적 D·P/D\nKeller: A_E/A_0 = (1.3 + 0.3Z)·T / [(p_0 − p_v)·D²] + k<\/div>\n<p class=\"concl\"><b>결론<\/b>: 효율(직경·회전수)과 캐비테이션·진동(면적·스큐·날개수)의 절충으로 변수를 정함.<\/p><\/div><\/section><\/details>"},{"id":"cavitation","p":2,"n":"2.13","h":"캐비테이션(Cavitation): 현상, 추력·토크 영향, 방지대책","t":"캐비테이션(Cavitation): 현상, 추력·토크 영향, 방지대책","c":3,"r":1,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 6번 · 10점","121회 1교시 6번 · 10점","133회 2교시 5번 · 25점"],"q":["<b>118회(2019) 1-6<\/b> 캐비테이션이 추력과 토크에 미치는 영향","<b>121회(2020) 1-6<\/b> 공동현상(Cavitation)","<b>133회(2024) 2-5<\/b> 프로펠러 공동현상 방지대책"],"k":"캐비테이션은 날개 표면의 국부 압력이 증기압 아래로 떨어져 증기 기포가 생기고 고압부에서 붕괴하는 현상이다. 침식, 소음, 선체 압력변동(진동), 추력·토크 저하를 일으킨다. 대책의 핵심은 날개 하중을 줄이고 압력 여유를 키우는 것이다.","x":"\n<p class=\"key\">캐비테이션은 날개 표면의 국부 압력이 증기압 아래로 떨어져 증기 기포가 생기고 고압부에서 붕괴하는 현상이다. 침식, 소음, 선체 압력변동(진동), 추력·토크 저하를 일으킨다. 대책의 핵심은 날개 하중을 줄이고 압력 여유를 키우는 것이다.<\/p>\n<h4>발생 조건<\/h4>\n<div class=\"eq\"><div class=\"eql\">국부 최소압력계수가 −C<sub>p,min<\/sub> &gt; σ 이면 캐비테이션 발생<\/div><div class=\"mj\">\\[\\sigma=\\dfrac{p_0+\\rho g h-p_v}{\\tfrac12\\rho V^2}\\]<\/div><\/div>\n<p>p<sub>0<\/sub>는 대기압, h는 축 중심(또는 날개 위치)의 잠김 깊이, p<sub>v<\/sub>는 증기압, V는 날개 단면의 상대속도. 날개 끝이 위로 올 때(12시 방향) 잠김이 작고 반류가 커서 받음각이 커지므로 가장 위험하다.<\/p>\n<h4>종류<\/h4>\n<ul>\n<li><b>시트(sheet)<\/b>: 앞날 부근 흡입면에 막처럼 생김. 받음각 과대. 체적 변동으로 선체 압력변동의 주원인.<\/li>\n<li><b>버블(bubble)<\/b>: 중앙부 두꺼운 단면에서 기포. 침식 위험 큼.<\/li>\n<li><b>클라우드(cloud)<\/b>: 시트가 끊어져 구름처럼 붕괴. 가장 강한 침식·소음.<\/li>\n<li><b>날개 끝 와류(tip vortex)·허브 와류<\/b>: 소음, 타 침식(hub vortex).<\/li>\n<li><b>압력면(face) 캐비테이션<\/b>: 받음각 음(−), 경하 운항 시.<\/li>\n<\/ul>\n<h4>추력과 토크에 미치는 영향<\/h4>\n<ul>\n<li>초기(부분) 캐비테이션은 K<sub>T<\/sub>, K<sub>Q<\/sub>에 거의 영향이 없다.<\/li>\n<li>발달하면 흡입면 저압이 증기압으로 고정되어 양력 증가가 멈춘다. 이후 추력이 급감하는 <b>추력 붕괴(thrust breakdown)<\/b>가 일어나고 토크도 감소한다. 추력 감소가 토크 감소보다 커서 효율이 떨어진다.<\/li>\n<li>선체 압력변동과 날개진동수(Z·n) 성분 기진력 증가 → 선미 진동.<\/li>\n<li>침식으로 표면 거칠기 증가 → 효율 추가 저하, 균열.<\/li>\n<\/ul>\n<h4>방지대책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>프로펠러<\/td><td>전개면적비 증가(Keller·Burrill 기준), 스큐 적용, 날개 끝 하중 경감(tip unloading), 캠버·두께 분포 최적화(버킷 확대), 날개수 조정, 저회전 대직경<\/td><\/tr>\n<tr><td>선미·반류<\/td><td>반류 균일화: 선미 형상(U형, 비대칭 선미), 반류 균일 덕트·핀, 프로펠러-선체 간격 확보(대략 0.2~0.25D 이상)<\/td><\/tr>\n<tr><td>운항<\/td><td>잠김 확보(밸러스트 흘수 관리), 과부하 운전 회피<\/td><\/tr>\n<tr><td>검증<\/td><td>캐비테이션 터널·대형 공동수조 시험(반류 재현), CFD, 선체 압력변동 계측<\/td><\/tr>\n<tr><td>재료·보수<\/td><td>내침식 재료(Ni-Al 청동), 침식부 그라인딩·덧살용접 보수<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-6<\/td><td>캐비테이션이 추력·토크에 미치는 영향<\/td><td class=\"num\">10<\/td><td>추력 붕괴, K<sub>T<\/sub>·K<sub>Q<\/sub> 곡선<\/td><\/tr>\n<tr><td class=\"num\">121-1-6<\/td><td>공동현상<\/td><td class=\"num\">10<\/td><td>정의, σ 식, 종류<\/td><\/tr>\n<tr><td class=\"num\">133-2-5<\/td><td>프로펠러 공동현상 방지대책<\/td><td class=\"num\">25<\/td><td>원인별 대책(프로펠러·반류·운항·검증)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 121회형(공동현상)\">\n<h5>1. 정의<\/h5>\n<p>날개 표면 국부 압력이 증기압 이하로 떨어져 증기 기포가 생기고 고압부에서 붕괴하는 현상.<\/p>\n<h5>2. 발생 조건<\/h5>\n<div class=\"calc\">σ = (p₀ + ρgh − p_v) / (½ρV²),  −Cp,min > σ 이면 발생\n예) 축심 잠김 8 m, D = 9 m, 1.5 rps, V_A = 7 m/s\n    12시 날개 끝: h = 3.5 m, V ≈ 43 m/s → σ ≈ 0.14<\/div>\n<h5>3. 종류·영향<\/h5>\n<ul><li>시트, 버블, 클라우드, 날개 끝 와류, 허브 와류<\/li><li>침식, 소음, 선체 압력변동(진동), 심하면 추력 붕괴<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 날개 끝이 위에 올 때(잠김 최소·반류 최대)가 가장 위험하므로 반류 균일화가 근본 대책임.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 133회형(방지대책)\">\n<h5>1. 개요<\/h5>\n<p>캐비테이션은 날개 하중(받음각)이 압력 여유(σ)를 넘을 때 생기므로, 대책은 \"날개 하중을 줄이고 압력 여유를 키우며 유입 유동을 고르게\" 하는 것임.<\/p>\n<h5>2. 발생 원인<\/h5>\n<ul><li>과대 날개 하중(작은 전개면적, 높은 회전수), 비균일 반류(선미 형상), 얕은 잠김(밸러스트 흘수), 부적절한 단면 형상<\/li><\/ul>\n<h5>3. 방지대책<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>대책<\/th><th>근거<\/th><\/tr><\/thead><tbody>\n<tr><td>프로펠러 설계<\/td><td>전개면적비 증가, 스큐, 날개 끝 하중 경감, 캠버·두께 분포 최적화, 저회전 대직경<\/td><td>Keller 식, 버킷 확대<\/td><\/tr>\n<tr><td>선미·반류<\/td><td>U형·비대칭 선미, 반류 균일 덕트·핀, 선체 간격(대략 0.2~0.25D 이상)<\/td><td>받음각 변동 감소<\/td><\/tr>\n<tr><td>운항<\/td><td>적정 잠김 유지, 과부하 운전 회피<\/td><td>σ 확보<\/td><\/tr>\n<tr><td>검증<\/td><td>공동수조 시험, CFD, 선체 압력변동 계측<\/td><td>설계 확인<\/td><\/tr>\n<tr><td>재료·보수<\/td><td>Ni-Al 청동, 침식부 그라인딩<\/td><td>침식 저항<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 추력·토크 영향(보충)<\/h5>\n<p>초기 캐비테이션은 K<sub>T<\/sub>·K<sub>Q<\/sub>에 거의 영향 없음 → 발달 시 흡입면 압력이 증기압에 고정되어 추력 붕괴, 추력 감소가 토크 감소보다 커서 효율 저하.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 효율과 캐비테이션은 상충(면적 증가는 마찰 손실 증가)하므로, 반류 개선으로 날개 하중 변동을 먼저 줄이고 남은 여유를 프로펠러 설계로 확보하는 순서가 합리적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"rpm-mismatch","p":2,"n":"2.14","h":"시운전 시 프로펠러 회전수가 설계 회전수보다 클 때와 작을 때의 대책","t":"시운전 시 프로펠러 회전수가 설계 회전수보다 클 때와 작을 때의 대책","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 5번 · 25점","124회 2교시 4번 · 25점"],"q":["<b>112회(2017) 2-5<\/b> 프로펠러 회전수가 설계 회전수보다 클 때와 작을 때의 대책","<b>124회(2021) 2-4<\/b> 시운전 시 프로펠러 회전수가 설계 회전수보다 클 때와 작을 때의 대책"],"k":"같은 출력에서 회전수가 설계보다 높으면 프로펠러가 가볍게(light) 돌고, 낮으면 무겁게(heavy) 도는 것이다. 먼저 계측·보정 오류와 선체 상태를 확인하고, 실제 부정합이면 피치(또는 직경) 수정으로 정합시킨다.","x":"\n<p class=\"key\">같은 출력에서 회전수가 설계보다 높으면 프로펠러가 가볍게(light) 돌고, 낮으면 무겁게(heavy) 도는 것이다. 먼저 계측·보정 오류와 선체 상태를 확인하고, 실제 부정합이면 피치(또는 직경) 수정으로 정합시킨다.<\/p>\n<h4>원인 판단부터<\/h4>\n<ul>\n<li>시운전 조건 보정: 흘수·트림, 바람·파도·조류, 수온·수심(ISO 15016 / ITTC 2017 절차)을 적용한 뒤 판단.<\/li>\n<li>설계는 운항 중 오손·해상 상태를 고려해 신조 시 의도적으로 가볍게(light running margin, 대개 4~7%) 설계한다. 이 범위의 고회전은 정상이다.<\/li>\n<li>토크미터 교정, 회전수 계측 확인.<\/li>\n<\/ul>\n<h4>회전수가 설계보다 클 때 (Light running)<\/h4>\n<ul>\n<li>원인: 피치 부족, 선체 저항이 예상보다 작음, 모형-실선 상관 오차.<\/li>\n<li>영향: MCR 회전수 한도에서 출력을 다 못 씀(기관 과회전 제한), 속력 미달 가능.<\/li>\n<li>대책: 날개 뒷날(trailing edge)에 컵(cup)을 붙이거나 굽혀 유효 피치 증가, 피치 수정 재가공, CPP는 피치 설정 변경, 큰 차이면 프로펠러 재설계·교체. 기관 출력-회전수 매칭(정격점 재설정)도 검토.<\/li>\n<\/ul>\n<h4>회전수가 설계보다 작을 때 (Heavy running)<\/h4>\n<ul>\n<li>원인: 피치·직경 과대, 선체 저항 과대(선형·부가물·도막 거칠기), 흘수 과대.<\/li>\n<li>영향: 기관이 토크 한계(과부하)에 걸려 MCR 도달 불가, 열부하 증가, 운항 중 오손이 더해지면 더 악화. 이 경우가 더 위험하다.<\/li>\n<li>대책: 뒷날 절삭·재가공으로 피치 감소, 날개 끝 절삭(tip cropping)으로 직경 축소(효율 약간 손실), CPP 피치 감소, 선체 저항 원인 제거(부가물, 도막), 프로펠러 교체.<\/li>\n<\/ul>\n<div class=\"pro\"><p>프로펠러 수정은 비가역이므로, 설계 단계에서 모형시험 결과로 회전수 여유를 확정하고 시운전 결과는 보정 후 판단하는 것이 원칙이다. 수정량은 K<sub>Q<\/sub> 곡선에서 목표 회전수의 토크 계수를 맞추는 피치 변화량으로 계산한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-2-5 · 124-2-4<\/td><td>시운전 회전수가 설계보다 클 때·작을 때 대책<\/td><td>원인 판단(보정·여유) → heavy/light별 대책<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>같은 출력에서 회전수가 높으면 light running(프로펠러가 가벼움), 낮으면 heavy running(무거움). 정합은 K<sub>Q<\/sub> 곡선상의 토크 계수로 판단함.<\/p>\n<h5>2. 판단 전 확인<\/h5><ol><li>시운전 조건 보정(ISO 15016): 흘수·트림·바람·파도·조류·수심<\/li><li>설계 light running margin(대략 4~7%): 오손·해상 대비 의도적 가벼움<\/li><li>토크미터 G값·영점, 회전수 계측<\/li><\/ol>\n<h5>3. 회전수가 클 때(light running)<\/h5><ul><li>원인: 피치 부족, 저항이 예상보다 작음<\/li><li>영향: 회전수 한도에서 MCR 미사용, 속력 미달 가능<\/li><li>대책: 뒷날 컵(cup) 부착으로 유효 피치 증가, 피치 재가공, CPP 피치 조정, 기관 정격점 재매칭, 심하면 재설계<\/li><\/ul>\n<h5>4. 회전수가 작을 때(heavy running) — 더 위험<\/h5><ul><li>원인: 피치·직경 과대, 저항 과대(선형·부가물·도막), 흘수 과대<\/li><li>영향: 토크 한계로 MCR 도달 불가, 열부하, 운항 중 오손으로 악화<\/li><li>대책: 뒷날 절삭·재가공으로 피치 감소, 날개 끝 절삭(직경 축소), CPP 피치 감소, 저항 원인 제거, 교체<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 프로펠러 수정은 비가역이므로 보정 후 실제 부정합만 수정하며, 수정량은 목표 회전수에서 K<sub>Q<\/sub>가 맞도록 피치 변화량을 계산해 정해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"propulsors","p":2,"n":"2.15","h":"선박추진장치: CPP, CRP, 워터제트, VSP, 선회식 전기추진기, 초전도 전자추진기","t":"선박추진장치: CPP, CRP, 워터제트, VSP, 선회식 전기추진기, 초전도 전자추진기","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 5번 · 25점","118회 2교시 2번 · 25점"],"q":["<b>112회(2017) 4-5<\/b> 선박추진장치(CPP, CRP, 워터제트, VSP, 선회식 전기추진기, 초전도 전자추진기) 중 4개","<b>118회(2019) 2-2<\/b> 선박추진장치(CPP, CRP, 워터제트, VSP, 선회식 전기추진기, 초전도 전자추진기)"],"k":"추진장치는 운항 프로파일에 맞게 선택한다. 고정피치 프로펠러가 가장 효율적이고 단순하지만, 부하 변동·조종성·소음·고속 요구가 있으면 아래 특수 추진기를 쓴다.","x":"\n<p class=\"key\">추진장치는 운항 프로파일에 맞게 선택한다. 고정피치 프로펠러가 가장 효율적이고 단순하지만, 부하 변동·조종성·소음·고속 요구가 있으면 아래 특수 추진기를 쓴다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장치<\/th><th>원리<\/th><th>장점<\/th><th>단점·적용<\/th><\/tr><\/thead><tbody>\n<tr><td>가변피치프로펠러 CPP<\/td><td>허브 내 유압 기구로 날개 피치 변경<\/td><td>부하별 최적 피치, 기관 역전 불필요, 일정 회전 축발전기 운전, 빠른 정지<\/td><td>건조·유지비, 큰 허브로 효율 1~2% 손실. 예인선·여객선·쇄빙선<\/td><\/tr>\n<tr><td>상호반전 CRP<\/td><td>동축 반대 회전 두 프로펠러<\/td><td>앞 프로펠러 회전류 에너지 회수, 효율 5~15% 개선, 날개 하중 분산<\/td><td>복잡한 동축·밀봉, 유지보수. 대형 고속선, 포드형 하이브리드 CRP<\/td><\/tr>\n<tr><td>워터제트<\/td><td>임펠러로 흡입한 물을 노즐로 분사, 반력 추진<\/td><td>고속(30 kn 이상) 효율, 천수, 저소음, 노즐 방향으로 조종<\/td><td>저속 효율 낮음, 흡입구 이물질. 고속 여객선·함정<\/td><\/tr>\n<tr><td>보이스 슈나이더 VSP<\/td><td>수직축 원판에 수직 날개, 날개각 주기적 변화로 임의 방향 추력<\/td><td>전방위 추력 즉시 변경, 타 불필요, 정밀 조종<\/td><td>효율 낮음, 흘수 증가, 고가. 예인선·페리·기뢰제거함<\/td><\/tr>\n<tr><td>선회식 전기추진기(Azipod 등)<\/td><td>포드 내 전동기가 프로펠러 직접 구동, 360° 회전<\/td><td>타·축계 불필요, 배치 자유, 조종성, 반류 양호(당김형)<\/td><td>고가, 대출력 한계, 베어링·밀봉 신뢰성. 크루즈·쇄빙·DP선<\/td><\/tr>\n<tr><td>초전도 전자추진기 MHD<\/td><td>해수에 전류와 강한 자기장을 걸어 로렌츠힘 J×B로 해수 가속<\/td><td>회전체 없음, 무소음·무진동<\/td><td>효율 매우 낮음, 초전도 냉각, 전극 부식. 실험선(일본 YAMATO-1, 1992) 수준<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-4-5<\/td><td>6개 중 4개 선택 설명<\/td><td>잘 아는 4개(CPP·CRP·워터제트·포드) 깊게<\/td><\/tr>\n<tr><td class=\"num\">118-2-2<\/td><td>6개 모두 설명<\/td><td>같은 형식(원리·장점·단점·적용) 6개<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 118회형(6개)\">\n<p>각 장치를 \"원리 / 장점 / 단점·적용\" 3줄 형식으로 통일해 씀.<\/p>\n<ol><li><b>CPP<\/b>: 허브 유압으로 피치 변경 / 부하별 최적 피치, 역전 불필요, 축발전 / 허브비로 효율 1~2% 손실 — 예인선·페리<\/li>\n<li><b>CRP<\/b>: 동축 반대 회전 / 앞 프로펠러 회전류 회수, 효율 향상, 하중 분산 / 동축·밀봉 복잡 — 고속 대형선, 포드 하이브리드<\/li>\n<li><b>워터제트<\/b>: 임펠러 흡입·노즐 분사 반력 / 고속 효율·천수·조종 / 저속 효율 낮음 — 고속선·함정<\/li>\n<li><b>보이스 슈나이더<\/b>: 수직 날개 각 주기 변화로 전방위 추력 / 즉시 방향 변경·타 불필요 / 효율 낮음·흘수 증가 — 예인선·페리<\/li>\n<li><b>선회식 전기추진(포드)<\/b>: 포드 내 전동기, 360° 회전 / 배치 자유·조종성·반류 양호 / 고가·대출력 한계 — 크루즈·쇄빙·DP선<\/li>\n<li><b>초전도 전자추진(MHD)<\/b>: 해수 전류 × 자기장 로렌츠힘 / 회전체 없음·무소음 / 효율 매우 낮음·초전도 냉각 — 실험선 수준<\/li><\/ol>\n<p class=\"concl\"><b>결론<\/b>: 대부분 상선은 FPP가 최적이며, 특수 추진기는 부하 변동·조종·소음·고속 요구가 클 때 효율 손실을 감수하고 선택함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"cpp-economy","p":2,"n":"2.16","h":"가변피치프로펠러(CPP) 장착 선박의 경제성","t":"가변피치프로펠러(CPP) 장착 선박의 경제성","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 2교시 3번 · 25점"],"q":["<b>127회(2022) 2-3<\/b> 가변피치프로펠러(CPP) 장착 선박의 경제성"],"k":"CPP의 경제성은 \"설계점 효율 손실 + 초기비·정비비\"와 \"부하 변동 운전에서의 연료 절감 + 축발전기 운전 + 조종성\"의 비교로 결정된다. 운항 조건이 일정한 원양 화물선은 FPP가, 부하가 자주 바뀌는 선박은 CPP가 유리하다.","x":"\n<p class=\"key\">CPP의 경제성은 \"설계점 효율 손실 + 초기비·정비비\"와 \"부하 변동 운전에서의 연료 절감 + 축발전기 운전 + 조종성\"의 비교로 결정된다. 운항 조건이 일정한 원양 화물선은 FPP가, 부하가 자주 바뀌는 선박은 CPP가 유리하다.<\/p>\n<h4>이득 요인<\/h4>\n<ul>\n<li>부분부하에서 회전수·피치 조합(combinator 운전)으로 기관과 프로펠러를 최적점에 둔다.<\/li>\n<li>일정 회전수 운전 → 축발전기(PTO)로 선내 전력 공급, 발전기 운전시간·연료(경유) 절감.<\/li>\n<li>예인선·트롤선·쇄빙선처럼 무부하와 고부하가 교차하는 선박에서 과부하 없이 최대 추력 사용.<\/li>\n<li>기관 역전 불필요 → 시동공기·클러치 단순화, 정지·후진 응답 빠름, 기관 열부하 변동 감소.<\/li>\n<li>시운전에서 회전수 부정합이 나와도 피치로 보정 가능.<\/li>\n<\/ul>\n<h4>비용 요인<\/h4>\n<ul>\n<li>허브비 증가와 날개 뿌리 형상 제약으로 설계점 효율이 FPP보다 1~3% 낮다.<\/li>\n<li>초기 구입비, 유압계통 정비, 허브 밀봉 누유 위험.<\/li>\n<li>일정 회전수 고정 운전 시 저부하에서 효율이 크게 떨어짐(제어 전략 중요).<\/li>\n<\/ul>\n<h4>평가 방법<\/h4>\n<ol>\n<li>운항 프로파일(속력·부하 시간 분포)로 FPP·CPP 각각의 연간 연료 소비 계산.<\/li>\n<li>축발전기 사용 시 발전기 연료 절감 반영.<\/li>\n<li>초기비 차이와 정비비를 포함해 NPV 또는 회수기간 비교.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>CPP 경제성 = (부하 변동 연료 절감 + 축발전 + 조종성) − (설계점 효율 손실 + 초기·정비비).<\/p>\n<h5>2. 이득<\/h5><ul><li>부분부하 회전수·피치 조합(combinator) 최적 운전<\/li><li>일정 회전 축발전기 → 발전기관 연료 절감<\/li><li>예인선·트롤선·쇄빙선 과부하 없이 최대 추력<\/li><li>역전 불필요, 정지·후진 응답, 시운전 회전수 보정 가능<\/li><\/ul>\n<h5>3. 비용<\/h5><ul><li>허브비 증가로 설계점 효율 1~3% 손실<\/li><li>초기비, 유압·밀봉 정비, 고정 회전 저부하 효율 저하<\/li><\/ul>\n<h5>4. 평가<\/h5><p>운항 프로파일별 연간 연료 → 축발전 절감 → 초기비·정비비 포함 NPV·회수기간 비교.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 부하 일정 원양 화물선은 FPP, 부하 변동·축발전·조종 요구 선박은 CPP가 경제적임.<\/p><\/div><\/section><\/details>"},{"id":"esd","p":2,"n":"2.17","h":"선박 에너지 절감장치(ESD)의 종류와 원리","t":"선박 에너지 절감장치(ESD)의 종류와 원리","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 6번 · 25점","139회 2교시 3번 · 25점"],"q":["<b>112회(2017) 4-6<\/b> 선박의 ESD(Energy Saving Device)의 종류와 원리","<b>139회(2026) 2-3<\/b> 선박 에너지 절감장치(ESD)의 종류와 특성"],"k":"ESD는 프로펠러 전후의 손실(비균일 반류, 회전류, 허브 와류, 날개 끝 와류)과 선체 마찰을 줄여 추진효율을 높이는 부가장치다. 효과는 장치당 대략 2~8%이며, 선형과 운항 조건에 따라 다르므로 모형시험·CFD로 검증해 조합한다.","x":"\n<p class=\"key\">ESD는 프로펠러 전후의 손실(비균일 반류, 회전류, 허브 와류, 날개 끝 와류)과 선체 마찰을 줄여 추진효율을 높이는 부가장치다. 효과는 장치당 대략 2~8%이며, 선형과 운항 조건에 따라 다르므로 모형시험·CFD로 검증해 조합한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>위치<\/th><th>장치<\/th><th>원리<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"3\">프로펠러 앞<\/td><td>반류 균일 덕트(WED, Schneekluth), Mewis Duct<\/td><td>덕트가 선미 유동을 가속·정렬해 반류 균일화, 덕트 양력의 추력 성분<\/td><\/tr>\n<tr><td>전류 고정날개(Pre-Swirl Stator)<\/td><td>프로펠러 회전 반대 방향 선회류를 미리 만들어 후류 회전 에너지 손실 상쇄<\/td><\/tr>\n<tr><td>선미 핀·vortex generator<\/td><td>선미 박리 억제, 반류 개선<\/td><\/tr>\n<tr><td rowspan=\"2\">프로펠러<\/td><td>PBCF(Propeller Boss Cap Fins)<\/td><td>허브 와류를 분산시켜 허브 후방 저압 손실 감소<\/td><\/tr>\n<tr><td>날개 끝 경계 프로펠러(Kappel, CLT)<\/td><td>날개 끝 와류 손실 감소<\/td><\/tr>\n<tr><td rowspan=\"3\">프로펠러 뒤<\/td><td>타구(Rudder bulb, Costa bulb)<\/td><td>허브 와류 회수, 타 앞 박리 방지<\/td><\/tr>\n<tr><td>비틀림 타(twisted rudder), 타 핀(rudder fin)<\/td><td>후류 회전에 맞춘 타 단면으로 추력성 양력 회수, 타 캐비테이션 감소<\/td><\/tr>\n<tr><td>CRP, Grim wheel<\/td><td>후류 회전 에너지 회수<\/td><\/tr>\n<tr><td>선체<\/td><td>공기윤활(ALS), 저마찰 도료, 선수 형상 개조<\/td><td>마찰저항·조파저항 감소<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>ESD 효과는 더해지지 않는다. 앞 장치가 회전류를 이미 회수하면 뒤 장치의 효과는 줄어든다. EEXI·CII 대응 개조에서는 덕트+PBCF+타 bulb처럼 서로 다른 손실을 겨냥한 조합을 CFD로 평가하고, 설치 후 성능 모니터링으로 실효를 검증한다. 덕트는 선미 구조 진동과 피로(용접부) 검토가 필요하다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-4-6<\/td><td>ESD 종류와 원리<\/td><td>손실 종류별 원리<\/td><\/tr>\n<tr><td class=\"num\">139-2-3<\/td><td>ESD 종류와 특성<\/td><td>위치별 분류 + 효과 비중첩 + EEXI·CII 연계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>ESD는 프로펠러 전후의 손실(비균일 반류, 회전류, 허브 와류, 날개 끝 와류)과 선체 마찰을 줄이는 부가장치로, 장치당 대략 2~8% 효과.<\/p>\n<h5>2. 종류와 원리<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>위치<\/th><th>장치<\/th><th>원리<\/th><\/tr><\/thead><tbody>\n<tr><td>앞<\/td><td>WED·Mewis duct<\/td><td>반류 균일화, 덕트 추력<\/td><\/tr>\n<tr><td>앞<\/td><td>Pre-swirl stator<\/td><td>역회전류 선행 생성 → 후류 회전 손실 상쇄<\/td><\/tr>\n<tr><td>프로펠러<\/td><td>PBCF<\/td><td>허브 와류 분산<\/td><\/tr>\n<tr><td>프로펠러<\/td><td>날개 끝 경계형(Kappel 등)<\/td><td>날개 끝 와류 감소<\/td><\/tr>\n<tr><td>뒤<\/td><td>Rudder bulb, twisted rudder, rudder fin<\/td><td>허브 와류·회전류 회수<\/td><\/tr>\n<tr><td>선체<\/td><td>공기윤활, 저마찰 도료<\/td><td>마찰저항 감소<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 적용 시 유의<\/h5><ul><li>효과 비중첩: 같은 손실을 겨냥한 장치는 합산 안 됨 → 다른 손실 조합(덕트 + PBCF + bulb)<\/li><li>CFD·모형시험 검증, 설치 후 성능 모니터링<\/li><li>덕트: 선미 구조 진동·피로, 캐비테이션 영향 검토<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: ESD는 EEXI·CII 대응의 저비용 수단이지만 선형별 효과 차가 크므로 운항 프로파일에 맞춘 검증이 선행되어야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"als","p":2,"n":"2.18","h":"공기윤활시스템(Air Lubrication System)","t":"공기윤활시스템(Air Lubrication System)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 1교시 13번 · 10점"],"q":["<b>133회(2024) 1-13<\/b> Air Lubrication System"],"k":"공기윤활은 선저 평판부에 압축공기를 분사해 기포층이나 공기막으로 선저를 덮어 마찰저항을 줄이는 기술이다. 평저부가 넓은 선박에서 순 절감 효과가 크며, 압축기 동력을 빼고 대략 3~10%의 동력 절감이 보고된다.","x":"\n<p class=\"key\">공기윤활은 선저 평판부에 압축공기를 분사해 기포층이나 공기막으로 선저를 덮어 마찰저항을 줄이는 기술이다. 평저부가 넓은 선박에서 순 절감 효과가 크며, 압축기 동력을 빼고 대략 3~10%의 동력 절감이 보고된다.<\/p>\n<h4>원리<\/h4>\n<ul>\n<li>물보다 점성·밀도가 훨씬 작은 공기를 선저 경계층 하부에 넣어 벽면 전단응력을 낮춘다.<\/li>\n<li>방식: 미세기포(bubble) 분사, 공기층(air layer) 형성, 공동(air cavity) 방식.<\/li>\n<li>평저부 선수 쪽 여러 줄의 분사구에서 공기를 내보내 선저를 따라 선미로 흐르게 한다.<\/li>\n<\/ul>\n<h4>효과 영향 인자<\/h4>\n<ul>\n<li>평저부 면적 비율이 클수록 유리(LNG선·컨테이너선·광폭 유조선·크루즈선).<\/li>\n<li>흘수가 깊으면 정수압이 커서 압축기 동력 증가 → 순 이득 감소.<\/li>\n<li>횡동요·파랑 중 공기가 측면으로 빠져나가 효과 감소.<\/li>\n<li>공기가 프로펠러로 유입되면 추력 저하·진동 → 분사 위치와 공기 유도 설계 중요.<\/li>\n<\/ul>\n<h4>설계 시 고려사항<\/h4>\n<ul>\n<li>선저 관통 개구와 매니폴드 구조 보강, 선저 외판 개구의 피로.<\/li>\n<li>압축기 배치(기관실 또는 선수부), 전력 소비, 소음.<\/li>\n<li>EEDI·EEXI에서 혁신기술(innovative technology)로 효과 반영 가능(MEPC.1/Circ.896 지침).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선저 평판부에 압축공기를 분사해 기포층·공기막으로 마찰저항을 줄이는 기술(순 절감 대략 3~10%).<\/p>\n<h5>2. 영향 인자<\/h5><ul><li>평저부 면적비↑ 유리(LNG선·컨테이너선·광폭 유조선)<\/li><li>흘수↑ → 압축기 동력↑, 횡동요 시 공기 이탈<\/li><li>프로펠러 공기 유입 → 추력·진동 문제<\/li><\/ul>\n<h5>3. 설계<\/h5><p>선저 개구·매니폴드 보강, 압축기 배치·전력, EEDI 혁신기술 반영.<\/p><\/div><\/section><\/details>"},{"id":"wind-assist","p":2,"n":"2.19","h":"일반상선의 풍력 보조추진: 원리, 방법, 문제점과 해결책","t":"일반상선의 풍력 보조추진: 원리, 방법, 문제점과 해결책","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 2교시 3번 · 25점"],"q":["<b>130회(2023) 2-3<\/b> 풍력 추진 적용 원리와 방법, 문제점과 해결책"],"k":"풍력 보조추진은 겉보기 바람(apparent wind)을 날개나 회전체에 받아 생기는 공기역학적 양력의 선수 방향 성분을 추력으로 쓰는 것이다. 주기관 부하를 줄여 연료와 CO₂를 줄이며, 효과는 항로의 바람 통계에 따라 대략 5~20%다.","x":"\n<p class=\"key\">풍력 보조추진은 겉보기 바람(apparent wind)을 날개나 회전체에 받아 생기는 공기역학적 양력의 선수 방향 성분을 추력으로 쓰는 것이다. 주기관 부하를 줄여 연료와 CO₂를 줄이며, 효과는 항로의 바람 통계에 따라 대략 5~20%다.<\/p>\n<h4>원리<\/h4>\n<ul>\n<li>겉보기 바람 = 실제 바람 − 선속 벡터. 선박이 빠를수록 겉보기 바람은 선수 쪽으로 돈다.<\/li>\n<li>양력 L은 겉보기 바람에 수직, 항력 D는 평행. 두 힘의 합력에서 선수 방향 성분이 추력, 횡 방향 성분은 횡력(경사·표류)이 된다.<\/li>\n<li>횡풍(beam wind) 부근에서 추력 성분이 가장 크고, 정면풍에서는 효과가 없다.<\/li>\n<\/ul>\n<h4>방법<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>원리<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>로터 세일(Flettner)<\/td><td>회전 원통의 마그누스 효과<\/td><td>단위면적 양력 최대, 회전 동력 필요<\/td><\/tr>\n<tr><td>경질 날개(rigid wing sail)<\/td><td>날개형 단면의 양력<\/td><td>효율 높음, 대형 구조물, 접이식 가능<\/td><\/tr>\n<tr><td>흡입 날개(suction wing)<\/td><td>표면 흡입으로 경계층 박리 지연, 고양력<\/td><td>소형 고효율, 팬 동력<\/td><\/tr>\n<tr><td>연(kite)<\/td><td>고공의 강한 바람을 견인줄로 이용<\/td><td>갑판 공간 작음, 발진·회수 운용 복잡<\/td><\/tr>\n<tr><td>연질 돛(soft sail)<\/td><td>천 돛<\/td><td>소형선, 인력 필요<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>문제점과 해결책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>문제점<\/th><th>해결책<\/th><\/tr><\/thead><tbody>\n<tr><td>화물 하역 간섭(벌크선 해치, 컨테이너 bay)<\/td><td>레일 이동식·접이식(tilting) 설치, 선수·선미 단부 배치<\/td><\/tr>\n<tr><td>공기 높이(air draft): 교량·크레인<\/td><td>틸팅·텔레스코픽 구조<\/td><\/tr>\n<tr><td>항해 시야(SOLAS V/22)<\/td><td>배치 위치 조정, 시야 사각 검토, 카메라 보완<\/td><\/tr>\n<tr><td>횡경사·표류·조종성<\/td><td>복원성(기상 기준에 풍압면적 추가), 타각 증가 보상, 자동 제어로 과풍 시 정지<\/td><\/tr>\n<tr><td>구조 하중(기초 굽힘, 피로)<\/td><td>갑판 기초 보강, 하부 격벽·거더와 연결, 피로 평가<\/td><\/tr>\n<tr><td>효과 불확실성<\/td><td>항로 바람 통계 기반 성능 예측(극좌표 성능도), 기상 항로 최적화와 결합<\/td><\/tr>\n<tr><td>규정·인증<\/td><td>선급 표기(DNV WAPS 등), EEDI·CII 반영 지침(MEPC.1/Circ.896)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 원리<\/h5><p>겉보기 바람(실제 바람 − 선속)에 날개·회전체가 양력 L(수직)·항력 D(평행) 발생 → 합력의 선수 방향 성분이 추력, 횡 성분은 경사·표류. 횡풍에서 효과 최대, 정면풍 무효.<\/p>\n<h5>2. 방법<\/h5><p>로터 세일(마그누스), 경질 윙세일, 흡입 날개, 연(kite), 연질 돛. 절감 대략 5~20%(항로 바람 의존).<\/p>\n<h5>3. 문제점과 해결<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>문제<\/th><th>해결<\/th><\/tr><\/thead><tbody>\n<tr><td>하역 간섭<\/td><td>레일 이동·틸팅, 선수미 배치<\/td><\/tr>\n<tr><td>공기 높이·시야<\/td><td>틸팅·텔레스코픽, SOLAS V/22 검토<\/td><\/tr>\n<tr><td>횡경사·표류<\/td><td>복원성 재계산, 자동 제어·강풍 정지<\/td><\/tr>\n<tr><td>구조 하중<\/td><td>기초 보강, 피로 평가<\/td><\/tr>\n<tr><td>효과 불확실<\/td><td>바람 통계 성능 예측, 기상 항로<\/td><\/tr>\n<tr><td>인증<\/td><td>선급 표기, MEPC.1/Circ.896 f<sub>eff<\/sub><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 탄소 비용 증가로 회수기간이 짧아지고 있으나, 항로 바람 통계 기반 평가와 하역 간섭 해결이 선행되어야 함.<\/p><\/div><\/section><\/details>"},{"id":"rotor-sail","p":2,"n":"2.20","h":"마그누스 효과를 이용한 로터 세일(Rotor Sail)을 운항선에 설치할 때의 고려사항","t":"마그누스 효과를 이용한 로터 세일(Rotor Sail)을 운항선에 설치할 때의 고려사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 4교시 1번 · 25점"],"q":["<b>139회(2026) 4-1<\/b> 마그누스 효과를 이용한 rotor sail system을 운항선에 설치할 때 고려사항"],"k":"로터 세일은 바람 속에서 회전하는 원통에 생기는 마그누스 양력을 추진력으로 쓴다. 운항선 개조에서는 성능(항로 바람), 구조(기초·피로), 복원성·시야·공기높이, 하역 간섭, 전력·제어, 규정·인증을 함께 검토해야 한다.","x":"\n<p class=\"key\">로터 세일은 바람 속에서 회전하는 원통에 생기는 마그누스 양력을 추진력으로 쓴다. 운항선 개조에서는 성능(항로 바람), 구조(기초·피로), 복원성·시야·공기높이, 하역 간섭, 전력·제어, 규정·인증을 함께 검토해야 한다.<\/p>\n<h4>원리<\/h4>\n<figure class=\"fig\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"마그누스 효과\">\n<circle cx=\"200\" cy=\"100\" r=\"40\" class=\"fa\"/>\n<path d=\"M200 52 A48 48 0 0 1 248 100\" class=\"lr\"/><text x=\"246\" y=\"62\" class=\"tr\">회전 ω<\/text>\n<g class=\"ln\"><path d=\"M30 70 C 120 70, 150 50, 200 48 S 290 60, 370 70\"/><path d=\"M30 130 C 120 130, 150 152, 200 152 S 290 140, 370 130\"/><\/g>\n<text x=\"40\" y=\"60\" class=\"t2\">바람 U (빠름·저압)<\/text><text x=\"40\" y=\"150\" class=\"t2\">느림·고압<\/text>\n<path d=\"M200 100 L200 20\" class=\"ln2\"/><text x=\"206\" y=\"28\" class=\"tn\">양력 L<\/text>\n<\/svg><figcaption>원통 표면이 바람과 같은 방향으로 움직이는 쪽은 유속이 빨라 압력이 낮고, 반대쪽은 압력이 높다. 압력차가 바람에 수직인 양력을 만든다.<\/figcaption><\/figure>\n<div class=\"eq\"><div class=\"eql\">단위 길이당 양력(Kutta–Joukowski). 회전비 α = ωR/U ≈ 3~4에서 C<sub>L<\/sub> ≈ 10 수준<\/div><div class=\"mj\">\\[L'=\\rho\\,U\\,\\Gamma\\]<\/div><\/div>\n<h4>설치 시 고려사항<\/h4>\n<ol>\n<li><b>성능 예측<\/b>: 항로별 풍향·풍속 통계와 로터 극좌표 성능으로 연간 절감량 산정, 기상 항로와 결합. 정면풍 항로는 효과 미미.<\/li>\n<li><b>배치·수량<\/b>: 갑판 공간, 로터 간 간섭(후류), 선수·선미 배치에 따른 요잉 모멘트와 타각 보상.<\/li>\n<li><b>구조<\/b>: 로터 기초의 굽힘·전단 하중(대형 로터 1기 수십 톤, 높이 30 m 이상)을 갑판 하부 격벽·거더로 전달, 갑판 국부 보강, 진동 공진 회피, 피로 평가.<\/li>\n<li><b>복원성<\/b>: 중량과 높은 무게중심 추가, 풍압면적 증가 → 기상 기준과 횡경사 재계산, 적재지침서 갱신.<\/li>\n<li><b>시야·공기높이<\/b>: SOLAS V/22 선교 시야, 교량 통과 → 틸팅 장치.<\/li>\n<li><b>하역·운용<\/b>: 벌크·컨테이너 하역 간섭 → 레일 이동식, 작업 안전구역.<\/li>\n<li><b>전력·제어<\/b>: 회전 구동 전동기 전력(발전기 용량 검토), 자동 제어(바람 각도별 회전수·방향, 강풍 시 정지), 선교 통합.<\/li>\n<li><b>규정·인증<\/b>: 선급 승인(구조·전기·제어), 기국 승인, EEXI·CII 효과 반영(MEPC.1/Circ.896 f<sub>eff<\/sub>), 보험.<\/li>\n<li><b>경제성<\/b>: 설치비·정비비 대비 연료·탄소비용(EU ETS) 절감의 회수기간.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 원리<\/h5><div class=\"calc\">L′ = ρ·U·Γ (Kutta–Joukowski), 회전비 α = ωR/U ≈ 3~4에서 C_L ≈ 10 수준<\/div><p>회전 원통의 유속 차 → 압력차 → 바람에 수직한 양력.<\/p>\n<h5>2. 운항선 설치 고려사항<\/h5><ol><li>성능: 항로 풍향·풍속 통계 + 로터 극좌표 → 연간 절감<\/li><li>배치·수량: 갑판 공간, 로터 간 후류 간섭, 요잉 모멘트·타각 보상<\/li><li>구조: 기초 굽힘·전단(로터 수십 톤, 높이 30 m 이상) → 격벽·거더 연결, 공진 회피, 피로<\/li><li>복원성: 높은 중량·풍압면적 → 기상 기준 재계산<\/li><li>시야·공기높이: SOLAS V/22, 교량 → 틸팅<\/li><li>하역: 레일 이동식, 작업 안전구역<\/li><li>전력·제어: 구동 전력(발전기 용량), 자동 제어, 선교 통합<\/li><li>인증: 선급·기국 승인, EEXI·CII 반영, 보험<\/li><li>경제성: 설치비 대비 연료·탄소비용 절감<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: 개조 성패는 항로 바람 조건과 구조·하역 간섭 해결에 달려 있으므로 사전 성능 시뮬레이션과 구조 검토를 먼저 해야 함.<\/p><\/div><\/section><\/details>"},{"id":"sailing-yacht","p":2,"n":"2.21","h":"세일링 요트가 바람이 불어오는 방향으로 나아갈 수 있는 이유","t":"세일링 요트가 바람이 불어오는 방향으로 나아갈 수 있는 이유","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 3번 · 25점"],"q":["<b>112회(2017) 2-3<\/b> 세일링 요트가 바람이 불어오는 방향으로 추진 가능한 이유를 유체역학적으로 설명"],"k":"돛은 날개처럼 겉보기 바람에 수직인 양력을 만들고, 용골(keel)은 물속에서 표류를 막는 횡력을 만든다. 돛 합력의 앞 방향 성분은 추진력이 되고 옆 방향 성분은 용골이 상쇄하므로, 요트는 바람을 향해 대략 30~45° 각도로 지그재그(tacking)하며 나아간다.","x":"\n<p class=\"key\">돛은 날개처럼 겉보기 바람에 수직인 양력을 만들고, 용골(keel)은 물속에서 표류를 막는 횡력을 만든다. 돛 합력의 앞 방향 성분은 추진력이 되고 옆 방향 성분은 용골이 상쇄하므로, 요트는 바람을 향해 대략 30~45° 각도로 지그재그(tacking)하며 나아간다.<\/p>\n<h4>공기역학 (돛)<\/h4>\n<ul>\n<li>돛은 캠버를 가진 얇은 날개다. 받음각을 가진 돛의 바깥(바람 아래쪽)은 유속이 빨라 저압, 안쪽은 고압 → 양력 L.<\/li>\n<li>양력 L은 겉보기 바람에 수직, 항력 D는 평행. 합력 F를 선체 진행 방향 성분(구동력)과 횡 방향 성분(횡력)으로 분해하면, 겉보기 바람이 선수에서 20~30° 이상 벌어져 있으면 구동력이 양수가 된다.<\/li>\n<\/ul>\n<h4>유체역학 (용골·선체)<\/h4>\n<ul>\n<li>요트는 약간 옆으로 미끄러지며(leeway angle 수 도) 진행한다. 이 받음각으로 용골이 수중 양력을 만들어 돛의 횡력과 평형을 이룬다.<\/li>\n<li>물의 밀도가 공기의 약 800배이므로 작은 용골 면적으로 큰 횡력을 낼 수 있다.<\/li>\n<li>횡력이 만드는 경사 모멘트는 용골 밸러스트의 복원 모멘트가 받친다.<\/li>\n<\/ul>\n<h4>정리<\/h4>\n<p>결국 공중 날개(돛)와 수중 날개(용골)의 두 양력이 짝을 이루어 바람 에너지를 전진 방향으로 바꾼다. 정면풍 안쪽 영역(no-go zone)은 갈 수 없으므로 좌우로 방향을 바꾸는 태킹으로 바람 방향 목적지에 도달한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>돛(공중 날개)과 용골(수중 날개)의 두 양력이 짝을 이뤄 바람 에너지를 전진력으로 바꿈.<\/p>\n<h5>2. 돛의 공기역학<\/h5><ul><li>캠버 있는 날개 → 바깥 저압·안쪽 고압 → 양력 L(겉보기 바람에 수직), 항력 D(평행)<\/li><li>합력 F의 진행 방향 성분 = 구동력, 횡 성분 = 횡력<\/li><li>겉보기 바람이 선수에서 약 20~30° 이상이면 구동력 양수<\/li><\/ul>\n<h5>3. 용골의 유체역학<\/h5><ul><li>작은 표류각(leeway)으로 용골 받음각 → 수중 양력이 횡력과 평형<\/li><li>물 밀도가 공기의 약 800배 → 작은 면적으로 큰 횡력<\/li><li>경사 모멘트는 용골 밸러스트 복원 모멘트가 지지<\/li><\/ul>\n<h5>4. 항해 방법<\/h5><p>정면풍 영역(no-go zone, 약 30~45°)은 직진 불가 → 좌우 태킹으로 바람 방향 목적지 도달.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 답안에는 속도 삼각형(실제 바람·선속·겉보기 바람)과 힘 분해 그림을 반드시 그려야 함.<\/p><\/div><\/section><\/details>"},{"id":"rudder","p":2,"n":"2.22","h":"타(Rudder) 설계의 요구조건, 제한조건, 설계항목","t":"타(Rudder) 설계의 요구조건, 제한조건, 설계항목","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 2교시 6번 · 25점"],"q":["<b>124회(2021) 2-6<\/b> Rudder 설계의 요구조건, 제한조건, 설계항목"],"k":"타는 IMO 조종성 기준을 만족하는 선회·침로안정 성능을 내면서, 프로펠러 후류 중의 캐비테이션·진동·강도 문제를 피하도록 설계한다. 면적·종횡비·단면·평형비·형식이 핵심 설계항목이다.","x":"\n<p class=\"key\">타는 IMO 조종성 기준을 만족하는 선회·침로안정 성능을 내면서, 프로펠러 후류 중의 캐비테이션·진동·강도 문제를 피하도록 설계한다. 면적·종횡비·단면·평형비·형식이 핵심 설계항목이다.<\/p>\n<h4>요구조건<\/h4>\n<ul>\n<li><b>조종성<\/b>: IMO 조종성 기준(MSC.137(76)) — 선회 전진거리 ≤ 4.5L, 선회 전술직경 ≤ 5L, 10°/10° Z시험 1차 overshoot 제한(L/V에 따라 10~20°), 20°/20° 1차 overshoot ≤ 25°, 정지거리 ≤ 15L.<\/li>\n<li><b>규칙 강도<\/b>: 선급 타력 공식(예: C<sub>R<\/sub> = 132·A·V²·κ<sub>1<\/sub>κ<sub>2<\/sub>κ<sub>3<\/sub> [N])으로 타두재·날개판·핀틀·베어링 치수.<\/li>\n<li><b>조타기<\/b>: SOLAS II-1/29 — 최대 흘수·최고 속력에서 한쪽 35°에서 반대쪽 30°까지 28초 이내.<\/li>\n<\/ul>\n<h4>제한조건<\/h4>\n<ul>\n<li>프로펠러·선체와의 간격(진동·캐비테이션), 흘수와 선미 형상(타 높이), 기선 아래 돌출 금지.<\/li>\n<li>프로펠러 후류 회전·고속 유동에 의한 타 캐비테이션(특히 고속 컨테이너선의 혼 갭·하단부).<\/li>\n<li>조타기 토크 용량, 공간·중량, 프로펠러 인출 경로.<\/li>\n<\/ul>\n<h4>설계항목<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>타 면적비 A<sub>R<\/sub>/(L·T)<\/td><td>상선 대략 1.5~2.5%, 고속·컨테이너선은 크게. DNV 등 규칙 최소값 확인<\/td><\/tr>\n<tr><td>종횡비<\/td><td>1.5~2.5. 클수록 양력 기울기↑, 굽힘 모멘트↑<\/td><\/tr>\n<tr><td>형식<\/td><td>반평형 혼 타(semi-spade, Mariner), 전평형 스페이드 타, 플랩 타(Becker), 비틀림 타<\/td><\/tr>\n<tr><td>단면<\/td><td>NACA, HSVA, fishtail(Schilling) — 실속각·양력계수·캐비테이션<\/td><\/tr>\n<tr><td>평형비<\/td><td>타두재 앞 면적 비율 20~30%. 조타 토크 감소, 과평형 시 불안정<\/td><\/tr>\n<tr><td>구조<\/td><td>타두재 지름, 베어링 간격, 날개판·웹 배치, 아연 양극, 배수·검사구<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 요구조건<\/h5><ul><li>IMO 조종성(MSC.137(76)): 전진거리 ≤ 4.5L, 전술직경 ≤ 5L, 10/10 overshoot 제한, 20/20 ≤ 25°, 정지 ≤ 15L<\/li><li>규칙 강도: 타력 C<sub>R<\/sub> = 132·A·V²·κ₁κ₂κ₃ [N]<\/li><li>조타기: 35° → 30° 28초 이내(SOLAS II-1/29)<\/li><\/ul>\n<h5>2. 제한조건<\/h5><p>프로펠러·선체 간격, 흘수·선미 형상, 기선 아래 돌출 금지, 타 캐비테이션, 조타기 토크, 프로펠러 인출 경로.<\/p>\n<h5>3. 설계항목<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>면적비<\/td><td>A<sub>R<\/sub>/(L·T) 대략 1.5~2.5%<\/td><\/tr>\n<tr><td>종횡비<\/td><td>1.5~2.5<\/td><\/tr>\n<tr><td>형식<\/td><td>반평형 혼, 스페이드, 플랩, 비틀림<\/td><\/tr>\n<tr><td>단면<\/td><td>NACA, HSVA, fishtail<\/td><\/tr>\n<tr><td>평형비<\/td><td>20~30%<\/td><\/tr>\n<tr><td>구조<\/td><td>타두재·베어링·날개판·핀틀<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 고속 대형선은 타 캐비테이션 침식이 빈번하므로 비틀림 타와 혼 갭 형상 설계가 중요함.<\/p><\/div><\/section><\/details>"},{"id":"thrusters","p":2,"n":"2.23","h":"사이드 스러스터(Side Thruster)의 종류와 위치선정 기준","t":"사이드 스러스터(Side Thruster)의 종류와 위치선정 기준","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 2교시 4번 · 25점"],"q":["<b>130회(2023) 2-4<\/b> 사이드 스러스터의 종류 및 위치선정 기준"],"k":"사이드 스러스터는 저속 접이안 시 선수·선미에 횡추력을 주는 장치다. 터널식이 가장 일반적이며, 횡모멘트 팔을 키우도록 선수·선미 끝에 두되 공기 흡입을 막을 잠김과 터널 길이를 확보해야 한다.","x":"\n<p class=\"key\">사이드 스러스터는 저속 접이안 시 선수·선미에 횡추력을 주는 장치다. 터널식이 가장 일반적이며, 횡모멘트 팔을 키우도록 선수·선미 끝에 두되 공기 흡입을 막을 잠김과 터널 길이를 확보해야 한다.<\/p>\n<h4>종류<\/h4>\n<ul>\n<li><b>터널 스러스터<\/b>: 선체 횡방향 관통 터널 내 프로펠러(FPP+가변속 전동기, 또는 CPP+정속). 가장 보편적.<\/li>\n<li><b>전방위(azimuth)·인입식(retractable)<\/b>: 선저 아래로 내려 360° 추력. DP선, 보조추진.<\/li>\n<li><b>워터제트·펌프제트 스러스터<\/b>: 터널 없이 흡입·분사, 천수·쇄빙 환경.<\/li>\n<\/ul>\n<h4>위치선정 기준<\/h4>\n<ol>\n<li><b>길이 방향<\/b>: 선수 스러스터는 가능한 한 앞쪽(충돌격벽 전방 구역 활용), 선미는 뒤쪽. 회전 중심으로부터 거리가 클수록 선회 모멘트가 크다.<\/li>\n<li><b>잠김<\/b>: 경하·밸러스트 흘수에서도 터널 상단이 수면 아래 충분히(대략 터널 직경 이상) 잠겨야 공기 흡입과 추력 손실이 없다.<\/li>\n<li><b>터널 길이<\/b>: 너무 짧으면 효율 저하, 대략 터널 직경의 2배 이상 확보 가능한 선폭 위치.<\/li>\n<li><b>선체 형상<\/b>: 선체 측면이 수직에 가까운 곳(경사·곡률 큰 곳은 출구 흐름 박리), 구상선수와의 간섭 회피.<\/li>\n<li><b>저항<\/b>: 터널 개구부에 페어링·그릴, 개구 가장자리 라운딩으로 항해 중 저항 증가 최소화.<\/li>\n<li><b>소음·진동<\/b>: 거주구와 거리, 탄성 마운트.<\/li>\n<\/ol>\n<p>터널 스러스터는 선속 2~4 kn 이상이면 효율이 급감하므로 접이안 전용으로 보고 용량을 정한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 종류<\/h5><ul><li>터널 스러스터(FPP+가변속 또는 CPP)<\/li><li>전방위·인입식(DP, 보조추진)<\/li><li>워터제트·펌프제트 스러스터<\/li><\/ul>\n<h5>2. 위치선정 기준<\/h5><ol><li>길이 방향: 선수는 최대한 앞, 선미는 뒤(모멘트 팔)<\/li><li>잠김: 경하 흘수에서 터널 상단이 대략 터널 직경 이상 잠김(공기 흡입 방지)<\/li><li>터널 길이: 대략 직경의 2배 이상<\/li><li>선체 형상: 측면이 수직에 가까운 곳, 구상선수 간섭 회피<\/li><li>저항: 개구 페어링·그릴·가장자리 라운딩<\/li><li>소음·진동: 거주구 이격, 탄성 마운트<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: 선속 2~4 kn 이상이면 효율이 급감하므로 접이안 전용으로 용량을 정하고, 개구 저항이 항해 동력에 미치는 영향을 함께 평가해야 함.<\/p><\/div><\/section><\/details>"},{"id":"dps","p":2,"n":"2.24","h":"DPS(Dynamic Positioning System)","t":"DPS(Dynamic Positioning System)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 4번 · 10점"],"q":["<b>115회(2018) 1-4<\/b> DPS(Dynamic Positioning System)"],"k":"DP는 위치 기준 센서와 환경 센서의 정보로 컴퓨터가 추진기·스러스터 추력을 실시간 배분해 앵커 없이 선박의 위치와 선수 방향을 유지하는 시스템이다. IMO 지침은 고장 허용 수준에 따라 DP Class 1·2·3을 정의한다.","x":"\n<p class=\"key\">DP는 위치 기준 센서와 환경 센서의 정보로 컴퓨터가 추진기·스러스터 추력을 실시간 배분해 앵커 없이 선박의 위치와 선수 방향을 유지하는 시스템이다. IMO 지침은 고장 허용 수준에 따라 DP Class 1·2·3을 정의한다.<\/p>\n<h4>구성<\/h4>\n<ul>\n<li><b>위치 기준(PRS)<\/b>: DGNSS, 수중음향(HPR), taut wire, 레이저·레이더(근거리).<\/li>\n<li><b>센서<\/b>: 자이로컴퍼스, 동요센서(MRU), 풍향풍속계.<\/li>\n<li><b>제어계<\/b>: 칼만 필터 기반 상태 추정, 바람 피드포워드, 추력 배분 알고리즘.<\/li>\n<li><b>추진계<\/b>: 전방위 추진기, 터널 스러스터, 주추진기+타.<\/li>\n<li><b>동력계<\/b>: 디젤-전기 발전, 전력관리시스템(PMS), 블랙아웃 방지.<\/li>\n<\/ul>\n<h4>등급 (IMO MSC.1/Circ.1580)<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등급<\/th><th>요구<\/th><\/tr><\/thead><tbody>\n<tr><td>Class 1<\/td><td>단일 고장 시 위치 상실 가능<\/td><\/tr>\n<tr><td>Class 2<\/td><td>능동 부품(발전기, 추진기, 스위치보드 등) 단일 고장에도 위치 유지(이중화)<\/td><\/tr>\n<tr><td>Class 3<\/td><td>Class 2 + 한 구획의 화재·침수에도 위치 유지(물리적 분리, A-60 격벽)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>적용: 시추선, OSV, 셔틀탱커(해상 하역), 해저 작업 지원선, 크레인선. 선급은 DYNPOS-AUTR/AUTRO(DNV) 등 표기로 구분한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>위치 기준·환경 센서 정보로 컴퓨터가 추진기 추력을 배분해 앵커 없이 위치·선수각을 유지하는 시스템.<\/p>\n<h5>2. 구성<\/h5><p>위치 기준(DGNSS, 수중음향, taut wire, 레이저), 센서(자이로, MRU, 풍향풍속), 제어(칼만 필터, 추력 배분), 추진·동력(PMS)<\/p>\n<h5>3. 등급(MSC.1/Circ.1580)<\/h5><p>Class 1(단일 고장 시 상실 가능) / 2(능동 부품 단일 고장 대비 이중화) / 3(+한 구획 화재·침수 대비 물리적 분리)<\/p><\/div><\/section><\/details>"},{"id":"roll-reduction","p":2,"n":"2.25","h":"횡동요 저감장치","t":"횡동요 저감장치","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 13번 · 10점"],"q":["<b>115회(2018) 1-13<\/b> 횡동요 저감장치"],"k":"횡동요 저감장치는 감쇠를 키우거나(빌지킬, 감쇠 탱크) 횡동요와 반대 위상의 모멘트를 만들어(핀, 능동 탱크, 자이로) 횡동요 진폭을 줄인다. 공진 근처에서는 감쇠가 진폭을 결정하므로 효과가 가장 크다.","x":"\n<p class=\"key\">횡동요 저감장치는 감쇠를 키우거나(빌지킬, 감쇠 탱크) 횡동요와 반대 위상의 모멘트를 만들어(핀, 능동 탱크, 자이로) 횡동요 진폭을 줄인다. 공진 근처에서는 감쇠가 진폭을 결정하므로 효과가 가장 크다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>장치<\/th><th>원리·특징<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"2\">수동<\/td><td>빌지킬<\/td><td>빌지부 판재가 와류를 만들어 감쇠. 가장 싸고 보편적, 저항 약간 증가<\/td><\/tr>\n<tr><td>수동형 감쇠 탱크(U-tube, 자유표면형)<\/td><td>탱크 수 이동이 횡동요보다 90° 늦게 움직여 반대 모멘트. 정지 시에도 효과, 자유표면으로 GM 감소<\/td><\/tr>\n<tr><td rowspan=\"4\">능동<\/td><td>핀 안정기(fin stabilizer)<\/td><td>측면 핀의 양력 제어. 고속에서 효과 큼, 저속 무효(영속 핀 제외), 여객선·함정<\/td><\/tr>\n<tr><td>능동 탱크<\/td><td>펌프·공기로 탱크 수 이동 제어<\/td><\/tr>\n<tr><td>자이로 안정기<\/td><td>세차 운동의 자이로 모멘트, 소형선<\/td><\/tr>\n<tr><td>타 횡동요 안정(RRS)<\/td><td>고속 조타로 타 양력의 횡동요 모멘트 이용, 함정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">횡동요 운동방정식 — 공진 진폭은 감쇠 B<sub>44<\/sub>에 반비례<\/div><div class=\"mj\">\\[(I+A_{44})\\,\\ddot{\\phi}+B_{44}\\,\\dot{\\phi}+\\Delta\\,\\mathrm{GM}\\,\\phi=M_{wave}(t)\\]<\/div><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 원리<\/h5><p>감쇠 증가 또는 반대 위상 모멘트로 횡동요 진폭 감소(공진 진폭 ∝ 1/B<sub>44<\/sub>).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>장치<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>수동<\/td><td>빌지킬<\/td><td>와류 감쇠, 저렴, 저항 소폭↑<\/td><\/tr>\n<tr><td>수동<\/td><td>감쇠 탱크(U-tube)<\/td><td>90° 위상 지연, 정지 시 유효, GM↓<\/td><\/tr>\n<tr><td>능동<\/td><td>핀 안정기<\/td><td>고속 효과 큼, 저속 무효<\/td><\/tr>\n<tr><td>능동<\/td><td>능동 탱크, 자이로, RRS<\/td><td>제어 필요<\/td><\/tr>\n<\/tbody><\/table><\/div><\/div><\/section><\/details>"},{"id":"bilge-keel","p":2,"n":"2.26","h":"대형 컨테이너선에서 빌지킬 높이를 2배로 했을 때 필요한 조치와 예상 변화","t":"대형 컨테이너선에서 빌지킬 높이를 2배로 했을 때 필요한 조치와 예상 변화","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 5번 · 25점"],"q":["<b>124회(2021) 3-5<\/b> 대형 컨테이너선 빌지킬 높이 2배 확장 시 필요한 조치와 예상 변화"],"k":"빌지킬 높이 2배는 횡동요 감쇠를 크게 늘려 공진·파라메트릭 롤 진폭과 래싱 하중을 줄인다. 그러나 저항 증가, 빌지킬 하중과 끝단 피로, 유동 정렬, 선폭·도킹 간섭을 다시 검토해야 하며, 구조적으로 \"빌지킬이 먼저 떨어지고 외판은 손상되지 않는\" 약한 고리 원칙을 지켜야 한다.","x":"\n<p class=\"key\">빌지킬 높이 2배는 횡동요 감쇠를 크게 늘려 공진·파라메트릭 롤 진폭과 래싱 하중을 줄인다. 그러나 저항 증가, 빌지킬 하중과 끝단 피로, 유동 정렬, 선폭·도킹 간섭을 다시 검토해야 하며, 구조적으로 \"빌지킬이 먼저 떨어지고 외판은 손상되지 않는\" 약한 고리 원칙을 지켜야 한다.<\/p>\n<h4>예상되는 변화<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>변화<\/th><\/tr><\/thead><tbody>\n<tr><td>횡동요 감쇠<\/td><td>와류 생성 감쇠(eddy-making)가 높이와 면적에 따라 크게 증가 → 공진 진폭·파라메트릭 롤 위험 감소<\/td><\/tr>\n<tr><td>복원성 판정<\/td><td>IS Code 기상 기준의 횡동요각 θ₁ 계산식에 빌지킬 면적 계수 k가 들어가 θ₁이 줄어 기상 기준 여유 증가<\/td><\/tr>\n<tr><td>래싱·가속도<\/td><td>횡동요 진폭 감소로 컨테이너 래싱 하중 감소, 적재 단수·중량 제약 완화 가능<\/td><\/tr>\n<tr><td>저항<\/td><td>침수 표면적·형상 항력 증가 → 서비스 속력 동력 소폭 증가(수 % 미만 수준), 정렬이 나쁘면 더 커짐<\/td><\/tr>\n<tr><td>구조 하중<\/td><td>빌지킬에 작용하는 동압·관성력 증가, 끝단 응력집중 증가<\/td><\/tr>\n<tr><td>고유주기<\/td><td>부가질량 약간 증가로 횡동요 고유주기 약간 증가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>필요한 조치<\/h4>\n<ol>\n<li><b>배치 정렬<\/b>: CFD·모형시험(페인트 유선 시험)으로 빌지부 유선 방향에 맞춰 설치해 항력·와류 소음을 최소화.<\/li>\n<li><b>구조 연결<\/b>: 외판에 직접 용접하지 않고 ground bar(덧판)를 두어, 빌지킬 손상 시 외판이 찢어지지 않게 한다. 용접은 ground bar–외판 연속 용접, 빌지킬–ground bar는 상대적으로 약하게.<\/li>\n<li><b>끝단 처리<\/b>: 끝을 완만하게 테이퍼(대략 1:3 이상)하고 내부 늑판·늑골 위치에서 끝나게 해 응력집중과 피로를 줄인다. 끝단 피로 평가.<\/li>\n<li><b>치수 제한<\/b>: 선폭과 기선을 넘어 돌출되지 않도록(접안·도킹·예인선 접촉) 높이 확장 방향 검토, 도킹 블록 배치 조정.<\/li>\n<li><b>규칙·도면<\/b>: 선급 빌지킬 규정 확인, 적재지침서의 기상 기준·래싱 계산 갱신.<\/li>\n<li><b>성능 영향<\/b>: 속력-동력 재추정(보증 속력 영향), EEDI 영향 확인.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>빌지킬 높이 2배는 횡동요 감쇠를 크게 늘리지만 저항·구조 하중·간섭이 늘어 검토가 필요함.<\/p>\n<h5>2. 예상 변화<\/h5><ul><li>감쇠↑ → 공진·파라메트릭 롤 진폭↓, 래싱 하중↓<\/li><li>IS Code 기상 기준 θ₁의 빌지킬 계수 → 기상 기준 여유↑<\/li><li>침수면적·형상 항력↑ → 동력 소폭↑<\/li><li>빌지킬 동압·관성력↑, 끝단 응력집중↑<\/li><li>부가질량 → 고유주기 약간↑<\/li><\/ul>\n<h5>3. 필요한 조치<\/h5><ol><li>CFD·유선 시험으로 유선 방향 정렬<\/li><li>Ground bar 경유 연결(외판 직접 용접 금지, 약한 고리 원칙)<\/li><li>끝단 테이퍼(1:3 이상), 내부 늑판 위치 종료, 끝단 피로 평가<\/li><li>선폭·기선 돌출 금지, 도킹 블록 조정<\/li><li>선급 규칙 확인, 적재지침서 기상 기준·래싱 계산 갱신<\/li><li>속력-동력 재추정(보증·EEDI)<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 감쇠 이득은 래싱·안전에서 크지만, 빌지킬이 먼저 파손되고 외판은 지키는 구조 연결과 끝단 피로 설계가 전제임.<\/p><\/div><\/section><\/details>"},{"id":"parametric-roll","p":2,"n":"2.27","h":"파라메트릭 롤(Parametric Roll) 현상과 회피방법","t":"파라메트릭 롤(Parametric Roll) 현상과 회피방법","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 13번 · 10점"],"q":["<b>136회(2025) 1-13<\/b> 파라메트릭 롤(Parametric Roll) 현상과 회피방법"],"k":"파라메트릭 롤은 선수파·선미파 중에서 파정과 파저가 선체 중앙을 지날 때마다 수선면이 변해 GM이 주기적으로 바뀌고, 그 변화 주기가 횡동요 고유주기의 절반일 때 횡동요가 급격히 커지는 매개변수 공진이다. 대형 컨테이너선과 자동차운반선에서 위험하다.","x":"\n<p class=\"key\">파라메트릭 롤은 선수파·선미파 중에서 파정과 파저가 선체 중앙을 지날 때마다 수선면이 변해 GM이 주기적으로 바뀌고, 그 변화 주기가 횡동요 고유주기의 절반일 때 횡동요가 급격히 커지는 매개변수 공진이다. 대형 컨테이너선과 자동차운반선에서 위험하다.<\/p>\n<h4>발생 메커니즘<\/h4>\n<ul>\n<li>파장이 선장과 비슷할 때, 파정이 중앙에 오면 선수·선미 수선 폭이 줄어(특히 플레어 큰 선수와 평평한 선미) GM 감소, 파저가 중앙에 오면 GM 증가.<\/li>\n<li>GM 변동 주기 = 조우주기 T<sub>e<\/sub>. T<sub>e<\/sub> ≈ T<sub>φ<\/sub>/2이고 감쇠가 작으면 몇 주기 만에 30~40° 횡동요로 발달(Mathieu 불안정).<\/li>\n<li>1998년 APL China호의 대규모 컨테이너 손실이 대표 사례.<\/li>\n<\/ul>\n<div class=\"eq\"><div class=\"eql\">Mathieu형 방정식 — 위험 조건 ω<sub>e<\/sub> ≈ 2ω<sub>φ<\/sub><\/div><div class=\"mj\">\\[\\ddot{\\phi}+2\\zeta\\omega_\\phi\\dot{\\phi}+\\omega_\\phi^2\\left[1+\\dfrac{\\delta\\mathrm{GM}}{\\mathrm{GM}}\\cos(\\omega_e t)\\right]\\phi=0\\]<\/div><\/div>\n<h4>회피방법<\/h4>\n<ul>\n<li><b>운항<\/b>: 선수각·속력을 바꿔 조우주기를 T<sub>φ<\/sub>/2에서 벗어나게 한다. 선장용 극좌표 운항지침(ABS·DNV 지침, IMO MSC.1/Circ.1228), 실시간 경보 시스템.<\/li>\n<li><b>감쇠 증가<\/b>: 빌지킬 확대, 감쇠 탱크(anti-roll tank)가 매우 효과적.<\/li>\n<li><b>설계<\/b>: 수선 부근 선수·선미 형상 변화를 줄여 GM 변동 감소, GM 조건별 2세대 복원성(SGISC) 취약성 평가.<\/li>\n<li><b>적재<\/b>: GM을 조정해 고유주기 이동(래싱 하중과 trade-off).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선수·선미파 중 파정·파저 통과로 GM이 주기 변동하고, 조우주기가 횡동요 고유주기의 절반일 때 횡동요가 급증하는 매개변수 공진.<\/p>\n<div class=\"calc\">위험 조건: T_e ≈ T_φ/2 (ω_e ≈ 2ω_φ), 파장 ≈ 선장, 감쇠 작음<\/div>\n<h5>2. 회피<\/h5><ul><li>운항: 선수각·속력 변경(운항지침, MSC.1/Circ.1228), 경보 시스템<\/li><li>감쇠: 빌지킬, 감쇠 탱크<\/li><li>설계: 수선 부근 형상 변화 축소, SGISC 평가<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 1998년 APL China 사고처럼 대형 컨테이너선에서 치명적이므로 선장 운항지침이 필수임.<\/p><\/div><\/section><\/details>"},{"id":"external-loads","p":3,"n":"3.1","h":"선체에 작용하는 외력의 종류와 특성 (구조설계 시 고려할 외력)","t":"선체에 작용하는 외력의 종류와 특성 (구조설계 시 고려할 외력)","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 2교시 2번 · 25점","127회 4교시 1번 · 25점"],"q":["<b>124회(2021) 2-2<\/b> 선체구조 설계 시 고려해야 할 외력","<b>127회(2022) 4-1<\/b> 선체에 작용하는 외력의 종류 및 특성"],"k":"선체 외력은 정적 하중(중량·부력 불균형, 정수압, 화물압)과 동적 하중(파랑 굽힘·전단·비틀림, 동압, 운동 관성력), 충격 하중(슬래밍, 슬로싱, green water), 그리고 진동·열·사고 하중으로 나뉜다. 설계는 하중마다 기준 초과확률(강도 10⁻⁸, 피로 10⁻²)과 조합(설계하중 시나리오)을 정해 수행한다.","x":"\n<p class=\"key\">선체 외력은 정적 하중(중량·부력 불균형, 정수압, 화물압)과 동적 하중(파랑 굽힘·전단·비틀림, 동압, 운동 관성력), 충격 하중(슬래밍, 슬로싱, green water), 그리고 진동·열·사고 하중으로 나뉜다. 설계는 하중마다 기준 초과확률(강도 10⁻⁸, 피로 10⁻²)과 조합(설계하중 시나리오)을 정해 수행한다.<\/p>\n<h4>분류와 특성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>하중<\/th><th>특성·설계 반영<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"3\">정적<\/td><td>정수중 종굽힘·전단(SWBM, SWSF)<\/td><td>길이 방향 중량-부력 분포 차이. 적재상태별 계산, 적재지침서 허용값<\/td><\/tr>\n<tr><td>정수압<\/td><td>흘수에 비례하는 외판 수압. 구조흘수 기준<\/td><\/tr>\n<tr><td>화물·밸러스트 압력<\/td><td>탱크 정수두(공기관 높이 포함), 벌크 화물 압력(안식각 고려)<\/td><\/tr>\n<tr><td rowspan=\"4\">동적(파랑)<\/td><td>파랑 종굽힘·전단<\/td><td>호깅·새깅 비대칭, IACS UR S11 공식 또는 직접계산(10⁻⁸)<\/td><\/tr>\n<tr><td>비틀림<\/td><td>사파(oblique sea) 중. 개구가 큰 컨테이너선에서 뒤틀림(warping) 응력<\/td><\/tr>\n<tr><td>외판 동압<\/td><td>파도·운동으로 수선 부근 압력 변동. 선측 종늑골 피로의 주원인<\/td><\/tr>\n<tr><td>관성력<\/td><td>가속도(횡동요·종동요·상하동요)에 의한 화물·탱크 내용물 하중, 컨테이너 래싱<\/td><\/tr>\n<tr><td rowspan=\"4\">충격<\/td><td>선저 슬래밍<\/td><td>밸러스트 흘수, 선수 선저 평판부 국부 충격<\/td><\/tr>\n<tr><td>선수 플레어 충격<\/td><td>컨테이너선 선수. 휘핑(whipping)으로 선체거더 하중 가중<\/td><\/tr>\n<tr><td>Green water<\/td><td>선수 갑판 장비·해치커버(UR S21, S26, S27)<\/td><\/tr>\n<tr><td>슬로싱<\/td><td>부분 적재 탱크 내 액체 충격(LNG 화물창, 대형 밸러스트탱크)<\/td><\/tr>\n<tr><td rowspan=\"2\">진동<\/td><td>프로펠러·기관 기진력<\/td><td>선미부 국부 진동, 공진 회피<\/td><\/tr>\n<tr><td>스프링잉(springing)<\/td><td>파랑과 선체거더 고유진동 공진, 대형 컨테이너선·광탄선 피로<\/td><\/tr>\n<tr><td rowspan=\"3\">기타<\/td><td>열하중<\/td><td>LNG·가열 화물의 온도차 응력<\/td><\/tr>\n<tr><td>도킹·진수·접안·예인<\/td><td>도킹 블록 반력, 펜더·계류 국부 하중<\/td><\/tr>\n<tr><td>사고(충돌·좌초·침수)<\/td><td>손상 상태 잔류강도, 침수 화물창 격벽(UR S18)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>설계에서의 처리<\/h4>\n<ul>\n<li><b>확률 수준<\/b>: 강도(항복·좌굴)는 선박 수명 중 최대값 수준인 10⁻⁸, 피로는 하중 응답 분포에서 손상 기여가 가장 큰 10⁻² 수준을 기준으로 한다.<\/li>\n<li><b>조합<\/b>: 같은 순간에 일어나는 하중끼리 등가설계파(EDW)로 조합한다(CSR: HSM, HSA, FSM, BSR, BSP, OST, OSA 등).<\/li>\n<li><b>대상 범위<\/b>: 선체거더(전역) → 주요지지부재(화물창 FE) → 국부 판·보강재 → 상세부(피로·미세 메시)로 내려가며 평가.<\/li>\n<\/ul>\n<div class=\"pro\"><p>규칙 하중은 \"파도의 확률\"이 아니라 하중·응력 응답 분포의 초과확률이다. 답안에서 10⁻⁸을 \"25년 중 1회 최대파\"처럼 쓰지 말고, 응답의 장기 분포 개념으로 설명하면 기술사다운 답안이 된다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-2-2<\/td><td>구조설계 시 고려할 외력<\/td><td>설계 반영 방법(확률 수준, 조합)<\/td><\/tr>\n<tr><td class=\"num\">127-4-1<\/td><td>외력의 종류 및 특성<\/td><td>분류표와 특성(정적·동적·충격)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>선체 외력은 정적·동적·충격·진동·사고 하중으로 나뉘며, 설계는 하중별 초과확률 수준과 동시 발생 조합을 정해 평가함.<\/p>\n<h5>2. 종류와 특성<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>하중<\/th><th>특성<\/th><\/tr><\/thead><tbody>\n<tr><td>정적<\/td><td>정수중 굽힘·전단, 정수압, 화물·탱크 압력<\/td><td>적재상태 의존, 적재지침서로 관리<\/td><\/tr>\n<tr><td>동적<\/td><td>파랑 굽힘·전단·비틀림, 외판 동압, 운동 관성력<\/td><td>확률적, 장기 분포<\/td><\/tr>\n<tr><td>충격<\/td><td>슬래밍, 플레어 충격, green water, 슬로싱<\/td><td>짧은 지속, 국부 집중<\/td><\/tr>\n<tr><td>진동<\/td><td>프로펠러·기관 기진, 스프링잉·휘핑<\/td><td>공진 시 증폭, 피로<\/td><\/tr>\n<tr><td>기타<\/td><td>열하중, 도킹·진수, 충돌·좌초·침수<\/td><td>특수 조건<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 설계 반영<\/h5><ol><li>확률 수준: 강도 10⁻⁸, 피로 10⁻² (응답 분포 기준)<\/li><li>조합: 등가설계파(EDW)로 동시 하중 조합, 설계하중 시나리오(S, S+D, A, I, SL, F)<\/li><li>계층: 선체거더 → 화물창 FE → 국부 → 상세(피로)<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 외력은 \"크기\"뿐 아니라 \"확률 수준과 조합\"으로 정의해야 하며, 대형 컨테이너선은 휘핑·비틀림 같은 동적 성분이 설계를 지배함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"longitudinal-strength","p":3,"n":"3.2","h":"선체 종강도 계산과정과 불만족 시 해결방안","t":"선체 종강도 계산과정과 불만족 시 해결방안","c":2,"r":2,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 3교시 4번 · 25점","136회 4교시 6번 · 25점"],"q":["<b>133회(2024) 3-4<\/b> 선체 종강도 계산과정","<b>136회(2025) 4-6<\/b> 선체 종강도 계산과정과 불만족 시 해결방안"],"k":"종강도 계산은 중량곡선과 부력곡선의 차이(하중곡선)를 한 번 적분해 전단력, 두 번 적분해 굽힘모멘트를 구하고, 파랑 성분을 더한 설계 모멘트를 중앙단면 단면계수로 나눈 응력이 허용응력 이하인지 확인하는 과정이다. 불만족 시에는 단면계수를 키우거나(구조) 정수중 모멘트를 줄인다(적재).","x":"\n<p class=\"key\">종강도 계산은 중량곡선과 부력곡선의 차이(하중곡선)를 한 번 적분해 전단력, 두 번 적분해 굽힘모멘트를 구하고, 파랑 성분을 더한 설계 모멘트를 중앙단면 단면계수로 나눈 응력이 허용응력 이하인지 확인하는 과정이다. 불만족 시에는 단면계수를 키우거나(구조) 정수중 모멘트를 줄인다(적재).<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 460 250\" role=\"img\" aria-label=\"종강도 곡선\">\n<line x1=\"30\" y1=\"60\" x2=\"440\" y2=\"60\" class=\"lg\"/><line x1=\"30\" y1=\"140\" x2=\"440\" y2=\"140\" class=\"lg\"/><line x1=\"30\" y1=\"215\" x2=\"440\" y2=\"215\" class=\"lg\"/>\n<path d=\"M30 60 L60 52 L110 40 L190 72 L270 40 L350 72 L410 50 L440 60\" class=\"ln2\"/><text x=\"444\" y=\"44\" class=\"t2\" text-anchor=\"end\">하중 q = b − w<\/text>\n<path d=\"M30 140 C 80 120, 120 112, 150 128 C 180 146, 210 162, 235 150 C 270 132, 300 118, 340 128 C 380 140, 410 152, 440 140\" class=\"lr\"/><text x=\"444\" y=\"124\" class=\"t2\" text-anchor=\"end\">전단력 Q = ∫q dx<\/text>\n<path d=\"M30 215 C 100 200, 160 172, 235 168 C 310 172, 380 198, 440 215\" class=\"ln\"/><text x=\"235\" y=\"160\" class=\"t2\" text-anchor=\"middle\">굽힘모멘트 M = ∫Q dx (호깅)<\/text>\n<text x=\"6\" y=\"64\" class=\"t2\">0<\/text><text x=\"6\" y=\"144\" class=\"t2\">0<\/text><text x=\"6\" y=\"219\" class=\"t2\">0<\/text>\n<\/svg><figcaption>하중곡선을 적분할 때 선수미 끝에서 Q = 0, M = 0이 되어야 한다(평형 확인).<\/figcaption><\/figure>\n<h4>계산 과정<\/h4>\n<ol>\n<li><b>중량곡선 w(x)<\/b>: 경하중량(선체강재·의장·기관)을 블록별로 분포, 재화중량(화물·연료·밸러스트)을 탱크·화물창 위치에 배분.<\/li>\n<li><b>부력곡선 b(x)<\/b>: 본진 곡선(Bonjean)으로 해당 흘수·트림의 단면적 분포 × ρg. 중량과 부력의 크기·LCG가 일치하는 트림을 반복계산.<\/li>\n<li><b>하중곡선 q = b − w<\/b> → 적분해 정수중 전단력 Q<sub>s<\/sub>, 다시 적분해 정수중 굽힘모멘트 M<sub>s<\/sub>.<\/li>\n<li><b>파랑 성분<\/b>: IACS UR S11 공식 또는 직접 해석.\n<div class=\"eq\"><div class=\"mj\">\\[M_{w,hog}=+190\\,C\\,L^2B\\,C_b\\times10^{-3},\\qquad M_{w,sag}=-110\\,C\\,L^2B\\,(C_b+0.7)\\times10^{-3}\\quad[\\mathrm{kN\\,m}]\\]<\/div><span class=\"c\">C = 10.75 − [(300 − L)/100]<sup>1.5<\/sup> (90 ≤ L ≤ 300 m), 10.75 (300~350 m)<\/span><\/div><\/li>\n<li><b>단면 성질<\/b>: 중앙단면의 연속 종강도 부재(갑판, 외판, 종격벽, 종늑골, 거더)로 중립축 높이, 단면2차모멘트 I, 갑판·선저 단면계수 Z = I/y 계산. 개구 공제, CSR은 부식 공제(순두께) 적용.<\/li>\n<li><b>판정<\/b>:\n<div class=\"eq\"><div class=\"mj\">\\[\\sigma=\\dfrac{M_s+M_w}{Z}\\le\\dfrac{175}{k}\\ \\mathrm{N/mm^2},\\qquad \\tau=\\dfrac{Q\\,S}{I\\,t}\\le\\dfrac{110}{k},\\qquad Z_{min}=C\\,L^2B\\,(C_b+0.7)\\,k\\times10^{-6}\\ \\mathrm{m^3}\\]<\/div><span class=\"c\">k: 재료계수(연강 1.0, HT32 0.78, HT36 0.72, HT40 0.68)<\/span><\/div><\/li>\n<li><b>좌굴·최종강도<\/b>: 갑판·선저 압축 판넬 좌굴, CSR의 선체거더 최종강도 γ<sub>S<\/sub>M<sub>s<\/sub> + γ<sub>W<\/sub>M<sub>w<\/sub> ≤ M<sub>U<\/sub>/γ<sub>R<\/sub> (Smith 법).<\/li>\n<\/ol>\n<h4>불만족 시 해결방안<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방향<\/th><th>방안<\/th><th>효과·비고<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"4\">단면계수 증가<\/td><td>형깊이 D 증가<\/td><td>Z가 대략 D²에 비례해 가장 효과적, 기본설계 단계에서만 가능<\/td><\/tr>\n<tr><td>갑판·선저 판 두께, 종늑골 단면 증가<\/td><td>중립축에서 먼 부재 우선<\/td><\/tr>\n<tr><td>고장력강 적용(k 감소)<\/td><td>허용응력 증가, 단 좌굴·피로 여유는 별도 확인<\/td><\/tr>\n<tr><td>종통 거더·해치코밍 연속화, 개구 축소<\/td><td>유효 단면 증가<\/td><\/tr>\n<tr><td rowspan=\"3\">하중 감소<\/td><td>탱크·화물창 배치 변경으로 SWBM 감소<\/td><td>중앙부 밸러스트, 화물창 길이 조정<\/td><\/tr>\n<tr><td>적재 방법 제한(격창 적재 금지 등)<\/td><td>적재지침서에 반영, 상업성 저하<\/td><\/tr>\n<tr><td>경하중량 분포 개선<\/td><td>선수미 중량 축소<\/td><\/tr>\n<tr><td>전단 불만족<\/td><td>격벽 부근 선측외판·종격벽 국부 증후<\/td><td>전단응력 최대는 격벽 근처 중립축 부근<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">133-3-4<\/td><td>종강도 계산과정<\/td><td>하중곡선 → SF → BM → Z → 판정 단계, 곡선 그림<\/td><\/tr>\n<tr><td class=\"num\">136-4-6<\/td><td>계산과정과 불만족 시 해결방안<\/td><td>계산과정 압축 + 대안 비교표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5~3쪽 · 136회형\">\n<h5>1. 개요<\/h5><p>종강도: 선체를 하나의 보로 보고 길이 방향 굽힘·전단에 견디는지 확인하는 것으로, 선체 구조 설계의 1차 기준임.<\/p>\n<h5>2. 계산과정<\/h5>\n<ol><li>중량곡선 w(x): 경하중량 분포 + 재화중량 배분<\/li><li>부력곡선 b(x): 본진 곡선, 중량·LCG 일치 트림 반복<\/li><li>하중곡선 q = b − w → 적분 Q(x) → 적분 M(x) (양단 0 확인)<\/li><li>파랑 성분(UR S11): M<sub>w,hog<\/sub> = 190·C·L²·B·C<sub>b<\/sub>×10⁻³, M<sub>w,sag<\/sub> = −110·C·L²·B·(C<sub>b<\/sub>+0.7)×10⁻³ kN·m<\/li><li>중앙단면 I, Z (연속 종강도 부재, CSR 순두께)<\/li><li>판정: σ = (M<sub>s<\/sub>+M<sub>w<\/sub>)/Z ≤ 175/k, τ ≤ 110/k, Z ≥ Z<sub>min<\/sub><\/li><li>좌굴·최종강도(CSR: γ<sub>S<\/sub>M<sub>s<\/sub> + γ<sub>W<\/sub>M<sub>w<\/sub> ≤ M<sub>U<\/sub>/γ<sub>R<\/sub>)<\/li><\/ol>\n<h5>3. 불만족 시 해결방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방향<\/th><th>방안<\/th><th>비고<\/th><\/tr><\/thead><tbody>\n<tr><td>Z 증가<\/td><td>형깊이 D 증가(Z ∝ 약 D²)<\/td><td>기본설계 단계만<\/td><\/tr>\n<tr><td>Z 증가<\/td><td>갑판·선저 판두께, 종늑골 단면, 종통 거더<\/td><td>중립축에서 먼 부재 우선<\/td><\/tr>\n<tr><td>허용치 증가<\/td><td>고장력강(k 감소)<\/t
