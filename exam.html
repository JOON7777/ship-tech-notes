열, 입열 범위, PWHT<\/td><td>실제 변수, 인장·굽힘·충격·매크로·경도·NDT<\/td><\/tr>\n<tr><td>승인<\/td><td>선급 승인 후 배포<\/td><td>검사원 입회 시험<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>절차: pWPS → 시험 용접 → NDT·기계시험 → PQR → 인정 범위 내 WPS. 용접사 자격 WPQ 별도. ISO 15614-1, AWS D1.1, ASME IX.<\/p>\n<p class=\"concl\"><b>요점<\/b>: 필수변수(용접법, 모재 그룹, 두께, 재료 등급, 예열 하한, 입열 상한, PWHT)가 바뀌면 새 PQR이 필요함.<\/p><\/div><\/section><\/details>"},{"id":"weld-defects","p":5,"n":"5.7","h":"용접부의 주요 결함 종류, 발생원인 및 방지대책 (언더컷 포함)","t":"용접부의 주요 결함 종류, 발생원인 및 방지대책 (언더컷 포함)","c":2,"r":2,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 4번 · 10점","139회 1교시 12번 · 10점"],"q":["<b>136회(2025) 1-4<\/b> 아크용접의 언더컷 현상 및 방지대책","<b>139회(2026) 1-12<\/b> 용접부의 주요 결함 종류, 발생원인 및 방지대책"],"k":"용접 결함은 균열, 기공, 슬래그 혼입, 융합·용입 불량, 언더컷·오버랩 같은 형상 결함으로 나뉜다. 균열과 면상 결함(융합 불량)은 피로·취성파괴의 시작점이어서 허용되지 않고, 기공·형상 결함은 허용 한도로 관리한다.","x":"\n<p class=\"key\">용접 결함은 균열, 기공, 슬래그 혼입, 융합·용입 불량, 언더컷·오버랩 같은 형상 결함으로 나뉜다. 균열과 면상 결함(융합 불량)은 피로·취성파괴의 시작점이어서 허용되지 않고, 기공·형상 결함은 허용 한도로 관리한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>결함<\/th><th>원인<\/th><th>방지대책<\/th><\/tr><\/thead><tbody>\n<tr><td>저온(수소) 균열<\/td><td>확산성 수소 + 경화 조직 + 구속응력, 용접 후 지연 발생<\/td><td>저수소 용접재료·건조, 예열·층간온도, 후열(수소 방출), 입열 관리<\/td><\/tr>\n<tr><td>고온(응고) 균열<\/td><td>S·P 편석, 비드 형상(깊고 좁은), 큰 구속<\/td><td>용접재료 선정, 비드 폭/깊이 비 관리, 크레이터 처리<\/td><\/tr>\n<tr><td>라멜라 티어링<\/td><td>두께 방향 연성 부족한 판의 T이음<\/td><td>Z 방향 보증강(Z25 등), 이음 설계 변경<\/td><\/tr>\n<tr><td>기공(porosity)<\/td><td>수분·녹·기름·프라이머, 보호가스 부족(바람)<\/td><td>개선면 청소, 방풍, 가스 유량, 용접재료 건조<\/td><\/tr>\n<tr><td>슬래그 혼입<\/td><td>층간 슬래그 제거 불량, 운봉 불량<\/td><td>층간 청소, 적정 전류·각도<\/td><\/tr>\n<tr><td>융합 불량·용입 불량<\/td><td>입열 부족, 개선 각도·루트 간격 부적정, 속도 과대<\/td><td>적정 전류, 개선 관리, 이면 가우징<\/td><\/tr>\n<tr><td>언더컷<\/td><td>전류·전압 과대, 속도 과대, 토치 각도·아크 길이 부적정<\/td><td>전류·속도 감소, 토치 각도 교정, 위빙 시 토우에서 잠시 멈춤. 기준 초과 깊이는 그라인딩 또는 덧비드 보수<\/td><\/tr>\n<tr><td>오버랩<\/td><td>전류 과소, 속도 과소<\/td><td>적정 조건<\/td><\/tr>\n<tr><td>과대 보강·각장 부족<\/td><td>운봉 불량<\/td><td>게이지 관리<\/td><\/tr>\n<tr><td>아크 스트라이크, 스패터<\/td><td>모재 위 아크 발생<\/td><td>아크 개시 위치 관리, 그라인딩<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>언더컷이 문제인 이유<\/h4>\n<p>용접 토우의 홈은 응력집중을 키워 피로 균열의 시작점이 되고, 유효 두께를 줄인다. 선체 구조에서는 깊이 한도(대략 0.5 mm 수준, 선급·IACS Rec. 47 기준) 초과 시 보수한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">136-1-4<\/td><td>아크용접 언더컷 현상·방지대책<\/td><td>원인(전류·속도·각도)과 피로 영향<\/td><\/tr>\n<tr><td class=\"num\">139-1-12<\/td><td>주요 결함 종류·원인·방지대책<\/td><td>결함-원인-대책 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 139회형\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>결함<\/th><th>원인<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>저온균열<\/td><td>확산성 수소 + 경화조직 + 구속<\/td><td>저수소재, 예열·후열<\/td><\/tr>\n<tr><td>고온균열<\/td><td>편석, 깊고 좁은 비드<\/td><td>재료·비드 형상<\/td><\/tr>\n<tr><td>기공<\/td><td>수분·녹·바람<\/td><td>청소, 방풍, 건조<\/td><\/tr>\n<tr><td>슬래그 혼입<\/td><td>층간 청소 불량<\/td><td>층간 청소<\/td><\/tr>\n<tr><td>융합·용입 불량<\/td><td>입열 부족, 개선 부적정<\/td><td>전류·개선 관리, 가우징<\/td><\/tr>\n<tr><td>언더컷<\/td><td>전류·속도 과대, 토치 각도<\/td><td>조건 조정, 토우 정지<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 균열·융합불량 같은 면상 결함은 피로 균열 시작점이므로 허용되지 않으며, UT로 우선 관리해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 136회형(언더컷)\">\n<h5>1. 정의<\/h5><p>용접 토우의 모재가 녹아 파였으나 용착금속으로 채워지지 않은 홈.<\/p>\n<h5>2. 원인<\/h5><p>전류·전압 과대, 용접 속도 과대, 토치 각도·아크 길이 부적정, 위빙 시 토우 체류 부족.<\/p>\n<h5>3. 영향<\/h5><p>토우 응력집중 증가 → 피로 균열 시작, 유효 두께 감소.<\/p>\n<h5>4. 대책<\/h5><p>전류·속도 감소, 각도 교정, 토우에서 잠시 정지. 허용 깊이(대략 0.5 mm 수준) 초과 시 그라인딩 또는 덧비드.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"ndt","p":5,"n":"5.8","h":"용접부 비파괴검사의 종류와 특징 (VT, PT, MT, UT, RT)","t":"용접부 비파괴검사의 종류와 특징 (VT, PT, MT, UT, RT)","c":4,"r":1,"b":[{"c":"hot","t":"4회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 3번 · 25점","118회 3교시 5번 · 25점","124회 4교시 3번 · 25점","133회 4교시 1번 · 25점"],"q":["<b>112회(2017) 4-3<\/b> 용접구조 품질관리를 위한 비파괴검사의 종류와 특징","<b>118회(2019) 3-5<\/b> 용접구조 품질관리를 위한 비파괴검사의 종류와 특징","<b>124회(2021) 4-3<\/b> 용접부 비파괴검사의 종류와 특징","<b>133회(2024) 4-1<\/b> 비파괴검사 VT, PT, MT, UT, RT"],"k":"비파괴검사는 표면 결함을 보는 VT·PT·MT와 내부 결함을 보는 UT·RT로 나뉜다. 선체에서는 VT를 전수로 하고, 맞대기 이음은 RT 또는 UT를 선급이 정한 검사 범위(IACS Rec. 20 등)로, 필릿·T이음 표면 균열은 MT로 확인한다.","x":"\n<p class=\"key\">비파괴검사는 표면 결함을 보는 VT·PT·MT와 내부 결함을 보는 UT·RT로 나뉜다. 선체에서는 VT를 전수로 하고, 맞대기 이음은 RT 또는 UT를 선급이 정한 검사 범위(IACS Rec. 20 등)로, 필릿·T이음 표면 균열은 MT로 확인한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>원리<\/th><th>검출 대상<\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>VT 육안<\/td><td>눈·확대경·게이지<\/td><td>표면 형상(언더컷, 오버랩, 각장, 균열)<\/td><td>가장 싸고 전수 가능<\/td><td>내부 불가, 검사자 의존<\/td><\/tr>\n<tr><td>PT 침투탐상<\/td><td>침투액이 표면 개구 결함에 스며들고 현상제가 빨아냄<\/td><td>표면 열린 균열·기공<\/td><td>재질 무관(스테인리스·알루미늄)<\/td><td>표면 개구 결함만, 전처리·시간<\/td><\/tr>\n<tr><td>MT 자분탐상<\/td><td>자화 시 결함부 누설자속에 자분이 모임<\/td><td>표면·표면 직하 균열<\/td><td>빠르고 민감, 필릿 토우 균열<\/td><td>강자성체만, 결함 방향 영향<\/td><\/tr>\n<tr><td>UT 초음파<\/td><td>초음파 반사(펄스 에코), 굴절 각도 탐촉자<\/td><td>내부 면상 결함(균열, 융합 불량), 라미네이션, 두께<\/td><td>후판·T이음, 깊이·위치 파악, 방사선 없음<\/td><td>숙련 의존, 기록성(PAUT로 보완), 얇은 판·조립 결정립 곤란<\/td><\/tr>\n<tr><td>RT 방사선<\/td><td>X·γ선 투과 필름(디지털)에 농도 차<\/td><td>체적 결함(기공, 슬래그), 용입 불량<\/td><td>영구 기록, 판독 직관적<\/td><td>방사선 안전·작업 통제, 면상 균열 방향 의존, 후판·T이음 곤란<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선체 적용<\/h4>\n<ul>\n<li>선체 맞대기 이음: 선급 지정 검사점(블록 이음, 판계 교차부, 중앙부 갑판·선저 우선)에 RT 또는 UT. 최근 PAUT·TOFD로 RT를 대체하는 추세(작업 중단 없음).<\/li>\n<li>극후판 컨테이너선 블록 이음: UR S33에 따라 100% UT.<\/li>\n<li>완전용입 T이음, 해치 코너·브래킷 토우: UT·MT.<\/li>\n<li>LNG 화물창(멤브레인) 용접: 헬륨 누설시험 등 특수 시험 병행.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 4회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-4-3 · 118-3-5<\/td><td>용접구조 품질관리를 위한 NDT 종류와 특징<\/td><td>품질관리 체계 속 NDT 위치, 선체 적용 범위<\/td><\/tr>\n<tr><td class=\"num\">124-4-3<\/td><td>용접부 NDT 종류와 특징<\/td><td>방법별 원리·검출 대상 비교표<\/td><\/tr>\n<tr><td class=\"num\">133-4-1<\/td><td>VT, PT, MT, UT, RT 각각<\/td><td>다섯 방법을 같은 형식으로 균형 있게, 그림<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5~3쪽\">\n<h5>1. 개요<\/h5>\n<ul><li>비파괴검사(NDT): 용접부를 파괴하지 않고 결함 유무·위치·크기를 확인하는 검사<\/li>\n<li>표면 결함 검사(VT·PT·MT)와 내부 결함 검사(UT·RT)로 구분, 선급 규칙·IACS Rec.20 등의 검사 범위에 따라 적용<\/li><\/ul>\n<h5>2. 방법별 원리와 특징<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>원리<\/th><th>검출<\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>VT<\/td><td>육안·게이지<\/td><td>형상(언더컷·각장·오버랩)<\/td><td>전수, 저비용<\/td><td>내부 불가<\/td><\/tr>\n<tr><td>PT<\/td><td>침투액 모세관 현상 → 현상제<\/td><td>표면 개구 균열<\/td><td>비자성재 가능<\/td><td>개구 결함만<\/td><\/tr>\n<tr><td>MT<\/td><td>자화 시 누설자속에 자분 집중<\/td><td>표면·직하 균열<\/td><td>빠름, 필릿 토우<\/td><td>강자성체만<\/td><\/tr>\n<tr><td>UT<\/td><td>초음파 반사(경사각 탐촉자)<\/td><td>내부 면상 결함, 라미네이션<\/td><td>후판·T이음, 깊이 측정<\/td><td>숙련 의존, 박판 곤란<\/td><\/tr>\n<tr><td>RT<\/td><td>방사선 투과 농도 차<\/td><td>체적 결함(기공·슬래그)<\/td><td>영구 기록<\/td><td>방사선 통제, 면상 균열 방향 의존<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 결함별 적합 방법<\/h5>\n<ul><li>체적 결함(기공·슬래그) → RT 우수 / 면상 결함(균열·융합불량) → UT 우수<\/li>\n<li>표면 균열: 강재는 MT, 스테인리스·알루미늄·니켈기 용접부는 PT<\/li><\/ul>\n<h5>4. 선체 적용<\/h5>\n<ul><li>VT: 모든 용접부 100%<\/li>\n<li>맞대기 이음: 선급 지정 검사점(블록 이음·판계 교차부, 중앙부 갑판·선저 우선)에 RT 또는 UT<\/li>\n<li>극후판(컨테이너선 갑판·코밍) 블록 이음: UR S33에 따라 UT 100%<\/li>\n<li>완전용입 T이음·브래킷 토우: UT·MT<\/li>\n<li>최근: PAUT·TOFD로 RT 대체(작업 중단 없음, 디지털 기록)<\/li><\/ul>\n<h5>5. 품질관리 연계<\/h5>\n<p>WPS·용접사 자격 → 공정 중 VT → NDT → 불합격 시 보수·재검사 → 결과 통계로 용접 조건 개선(재발 방지).<\/p>\n<p class=\"concl\"><b>6. 결론<\/b>: NDT는 결함 성격(체적/면상, 표면/내부)과 재질·두께에 맞춰 조합해야 하며, 피로 균열 시작점이 되는 면상 결함을 놓치지 않도록 고응력부에 UT를 우선 배치하는 것이 기술사의 판단임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"ut","p":5,"n":"5.9","h":"초음파탐상(UT)의 탐상법 종류와 선체 용접이음부 탐상법","t":"초음파탐상(UT)의 탐상법 종류와 선체 용접이음부 탐상법","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 4교시 4번 · 25점"],"q":["<b>130회(2023) 4-4<\/b> 초음파탐상(UT) 탐상법의 종류와 선체 용접이음부 탐상법"],"k":"UT는 탐촉자가 보낸 초음파 펄스가 결함에서 반사되어 돌아오는 시간과 크기로 결함 위치와 크기를 판정한다. 선체 맞대기 용접은 경사각 탐촉자로 용접부 양측에서 지그재그 주사하고, 기준 시험편으로 만든 DAC 곡선 기준 에코 높이와 지시 길이로 합부를 판정한다.","x":"\n<p class=\"key\">UT는 탐촉자가 보낸 초음파 펄스가 결함에서 반사되어 돌아오는 시간과 크기로 결함 위치와 크기를 판정한다. 선체 맞대기 용접은 경사각 탐촉자로 용접부 양측에서 지그재그 주사하고, 기준 시험편으로 만든 DAC 곡선 기준 에코 높이와 지시 길이로 합부를 판정한다.<\/p>\n<h4>탐상법의 종류<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분류<\/th><th>방법<\/th><th>용도<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"3\">원리<\/td><td>펄스 반사법<\/td><td>가장 일반적, 결함 반사 에코<\/td><\/tr>\n<tr><td>투과법<\/td><td>송·수신 분리, 접합부·라미네이션<\/td><\/tr>\n<tr><td>공진법<\/td><td>두께 측정<\/td><\/tr>\n<tr><td rowspan=\"3\">빔 방향<\/td><td>수직 탐상(종파)<\/td><td>라미네이션, 두께, T이음 플랜지 측<\/td><\/tr>\n<tr><td>경사각 탐상(횡파 45°, 60°, 70°)<\/td><td>맞대기 용접부 내부 결함<\/td><\/tr>\n<tr><td>탠덤 탐상<\/td><td>두 탐촉자 송수신, 후판의 수직 면상 결함(융합 불량)<\/td><\/tr>\n<tr><td rowspan=\"2\">접촉<\/td><td>직접 접촉(접촉매질)<\/td><td>현장 표준<\/td><\/tr>\n<tr><td>수침법<\/td><td>자동화 공장 검사<\/td><\/tr>\n<tr><td rowspan=\"2\">고급<\/td><td>PAUT(위상배열)<\/td><td>섹터 주사 영상, 기록 보존, RT 대체<\/td><\/tr>\n<tr><td>TOFD<\/td><td>회절파 도달시간으로 결함 높이 정밀 측정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선체 용접이음부 탐상 절차<\/h4>\n<ol>\n<li><b>준비<\/b>: 표면 스패터·도막 제거, 접촉매질, 판두께 확인. 대략 8 mm 미만 박판은 UT 한계 → RT.<\/li>\n<li><b>교정<\/b>: 표준 시험편(V1, V2)으로 시간축·입사점·굴절각 확인, 대비 시험편(측면 드릴 구멍)으로 거리-진폭 곡선(DAC) 작성, 탐상 감도 설정.<\/li>\n<li><b>탐촉자 선정<\/b>: 두께에 따라 굴절각(얇으면 70°, 두꺼우면 45°·60° 병용), 주파수 2~5 MHz.<\/li>\n<li><b>주사<\/b>: 용접선 양측(가능하면 양면)에서 지그재그·좌우 주사, 횡균열 확인용 용접선 평행 주사.<\/li>\n<li><b>평가<\/b>: 평가 레벨 이상 에코의 최대 높이와 지시 길이 측정, 위치(깊이·거리) 기록.<\/li>\n<li><b>판정<\/b>: 선급 규칙 또는 ISO 11666 합격 기준. 균열로 판단되는 지시는 길이와 무관하게 불합격.<\/li>\n<li><b>보수·재검사<\/b>: 가우징 후 재용접, 동일 방법 재검사.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 원리<\/h5><p>초음파 펄스의 결함 반사 에코 시간(위치)·높이(크기) 판정.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분류<\/th><th>방법·용도<\/th><\/tr><\/thead><tbody>\n<tr><td>원리<\/td><td>펄스 반사(일반), 투과(접합·라미네이션), 공진(두께)<\/td><\/tr>\n<tr><td>빔<\/td><td>수직(종파, 라미네이션·두께), 경사각(횡파 45·60·70°, 맞대기), 탠덤(후판 융합 불량)<\/td><\/tr>\n<tr><td>접촉<\/td><td>직접 접촉(현장), 수침(자동)<\/td><\/tr>\n<tr><td>고급<\/td><td>PAUT(영상·기록, RT 대체), TOFD(결함 높이)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 선체 용접부 절차<\/h5><ol><li>준비: 스패터·도막 제거, 약 8 mm 미만 박판은 RT<\/li><li>교정: V1·V2 시간축·입사점·굴절각, 측면 드릴 구멍 DAC<\/li><li>탐촉자: 얇으면 70°, 두꺼우면 45·60° 병용, 2~5 MHz<\/li><li>주사: 양측 지그재그, 횡균열용 평행 주사<\/li><li>평가·판정: 에코 높이·지시 길이, 선급 규칙·ISO 11666, 균열은 길이 무관 불합격<\/li><li>보수: 가우징·재용접, 동일 방법 재검사<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: RT 대비 방사선 안전·후판 면상결함 검출이 유리해 PAUT 기록화로 대체가 확대되는 추세임.<\/p><\/div><\/section><\/details>"},{"id":"cutting-distortion","p":5,"n":"5.10","h":"강판의 가스절단 시 변형을 억제하거나 완화하는 방법","t":"강판의 가스절단 시 변형을 억제하거나 완화하는 방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 3번 · 25점"],"q":["<b>112회(2017) 3-3<\/b> 강판의 가스절단 시 변형을 억제하거나 완화하는 방법"],"k":"가스절단은 절단선 근처를 국부 가열하므로 절단 가장자리에 수축이 생겨, 좁고 긴 부재는 휘고(camber) 판은 비틀린다. 열을 대칭으로 넣고, 마지막까지 판을 붙잡아 두며, 입열이 작은 공정을 쓰는 것이 기본이다.","x":"\n<p class=\"key\">가스절단은 절단선 근처를 국부 가열하므로 절단 가장자리에 수축이 생겨, 좁고 긴 부재는 휘고(camber) 판은 비틀린다. 열을 대칭으로 넣고, 마지막까지 판을 붙잡아 두며, 입열이 작은 공정을 쓰는 것이 기본이다.<\/p>\n<h4>변형 원인<\/h4>\n<ul>\n<li>절단선 가장자리의 가열·냉각 수축(용접과 같은 원리, 크기는 작다).<\/li>\n<li>압연 잔류응력이 절단으로 해방되며 재분배.<\/li>\n<li>한쪽만 절단한 좁은 띠판은 비대칭 수축으로 휨.<\/li>\n<\/ul>\n<h4>억제 방법<\/h4>\n<ol>\n<li><b>대칭 절단<\/b>: 띠판 양쪽을 다중 토치로 동시 절단.<\/li>\n<li><b>브리지(마이크로 조인트)<\/b>: 일부를 끊지 않고 남겨 판에 구속시킨 뒤 냉각 후 마지막에 분리.<\/li>\n<li><b>절단 순서<\/b>: 내부 구멍·슬롯 먼저, 외곽 윤곽은 나중. 큰 판에서 먼저 잘라 나가지 않게.<\/li>\n<li><b>네스팅 배치<\/b>: 긴 부재를 판 가장자리에 붙이지 않고 양측에 여유(스크랩)를 두어 열을 균형.<\/li>\n<li><b>구속·냉각<\/b>: 절단 정반에 고정·누름, 수중·수면 플라즈마 정반으로 냉각.<\/li>\n<li><b>저입열 공정<\/b>: 플라즈마·레이저 절단(속도 빠르고 열영향 작음).<\/li>\n<li><b>조건 관리<\/b>: 예열 불꽃 과대 금지, 적정 절단 속도·산소 압력.<\/li>\n<li><b>여유 절단<\/b>: 길이 방향 덧살 후 정밀 2차 절단.<\/li>\n<\/ol>\n<h4>완화(교정)<\/h4>\n<p>절단 후 휜 부재는 오목한 쪽 반대편 선가열 또는 프레스 교정. 띠판 휨은 절단 정밀도와 직결되므로, 변형 실적 데이터를 NC 보정치로 반영한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 원인<\/h5><p>절단 가장자리 가열·냉각 수축, 압연 잔류응력 해방, 좁은 띠판 편측 절단 비대칭 수축 → camber·비틀림.<\/p>\n<h5>2. 억제<\/h5><ul><li>대칭 절단(다중 토치 동시)<\/li><li>브리지(마이크로 조인트) 후 냉각 뒤 분리<\/li><li>순서: 내부 구멍·슬롯 → 외곽<\/li><li>네스팅: 긴 부재 양측 스크랩 여유<\/li><li>정반 고정·수중 플라즈마 냉각<\/li><li>저입열 공정(플라즈마·레이저)<\/li><li>조건: 예열 불꽃·속도·산소 압력<\/li><li>덧살 후 2차 정밀 절단<\/li><\/ul>\n<h5>3. 완화(교정)<\/h5><p>오목 반대편 선가열, 프레스 교정.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 변형 실적을 NC 보정치로 피드백하는 것이 정도 관리의 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"backfire","p":5,"n":"5.11","h":"산소-아세틸렌 가스절단 시 역화(Back Fire)와 역류(Counter Flow)","t":"산소-아세틸렌 가스절단 시 역화(Back Fire)와 역류(Counter Flow)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 3번 · 10점"],"q":["<b>118회(2019) 1-3<\/b> 주판의 산소-아세틸렌 가스절단 시 역화(Back Fire)와 역류(Counter Flow)"],"k":"역화는 불꽃이 순간적으로 팁 안으로 들어가 \"펑\" 소리와 함께 꺼지거나 다시 켜지는 현상이고, 역류는 고압 산소가 저압 아세틸렌 쪽 호스로 거꾸로 흘러들어 호스 안에 폭발성 혼합가스를 만드는 현상이다. 불꽃이 호스·조정기까지 타 들어가는 인화(flashback)로 이어지면 폭발 사고가 된다.","x":"\n<p class=\"key\">역화는 불꽃이 순간적으로 팁 안으로 들어가 \"펑\" 소리와 함께 꺼지거나 다시 켜지는 현상이고, 역류는 고압 산소가 저압 아세틸렌 쪽 호스로 거꾸로 흘러들어 호스 안에 폭발성 혼합가스를 만드는 현상이다. 불꽃이 호스·조정기까지 타 들어가는 인화(flashback)로 이어지면 폭발 사고가 된다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>역화(Back fire)<\/th><th>역류(Counter flow)<\/th><\/tr><\/thead><tbody>\n<tr><td>현상<\/td><td>불꽃이 팁 내부로 순간 후퇴<\/td><td>산소가 아세틸렌 호스로 역류<\/td><\/tr>\n<tr><td>원인<\/td><td>팁 과열, 팁이 모재에 닿음, 스패터로 팁 막힘, 가스 유량·압력 부족<\/td><td>팁 막힘, 아세틸렌 압력 &lt; 산소 압력, 밸브 조작 순서 오류<\/td><\/tr>\n<tr><td>위험<\/td><td>반복되면 인화로 진전<\/td><td>호스 내 혼합가스 → 점화 시 호스 폭발<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>예방<\/h4>\n<ul>\n<li>토치와 조정기 양쪽에 역화방지기(flashback arrestor)와 역류방지 밸브(check valve) 설치.<\/li>\n<li>적정 압력 유지(아세틸렌은 저압 사용, 고압 사용 금지), 점화 전 호스 퍼지.<\/li>\n<li>팁 청소·냉각, 팁과 모재 간격 유지, 정해진 점화·소화 순서 준수.<\/li>\n<li>발생 시 즉시 토치 밸브 차단(산소·아세틸렌), 원인 제거 후 재점화, 호스 손상 점검.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>역화<\/th><th>역류<\/th><\/tr><\/thead><tbody>\n<tr><td>현상<\/td><td>불꽃이 팁 내부로 순간 후퇴(\"펑\")<\/td><td>산소가 아세틸렌 호스로 역류<\/td><\/tr>\n<tr><td>원인<\/td><td>팁 과열·접촉·막힘, 압력 부족<\/td><td>팁 막힘, 아세틸렌 &lt; 산소 압력, 밸브 순서 오류<\/td><\/tr>\n<tr><td>위험<\/td><td>인화(flashback)로 진전<\/td><td>호스 내 혼합가스 폭발<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>예방<\/b>: 토치·조정기 양측 역화방지기 + 역류방지 밸브, 적정 압력, 점화 전 퍼지, 팁 청소·간격, 점화·소화 순서. 발생 시 토치 밸브 즉시 차단 후 원인 제거.<\/p><\/div><\/section><\/details>"},{"id":"cutting-accuracy","p":5,"n":"5.12","h":"선각공사에서 절단 정밀도를 좌우하는 요인","t":"선각공사에서 절단 정밀도를 좌우하는 요인","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 2교시 5번 · 25점","136회 2교시 5번 · 25점"],"q":["<b>118회(2019) 2-5<\/b> 선각공사에서 절단 정밀도를 좌우하는 요인 5가지","<b>136회(2025) 2-5<\/b> 선각공사 절단 정밀도에 영향을 주는 요소"],"k":"절단 정밀도는 장비 정도, 절단 조건(커프 보정), 판의 열변형, 판 상태, NC 데이터와 수축 보정, 작업자 설정, 온도 환경에 의해 결정된다. 절단 오차는 취부 틈새와 용접량을 키워 변형·공수를 늘리므로 정도관리의 출발점이다.","x":"\n<p class=\"key\">절단 정밀도는 장비 정도, 절단 조건(커프 보정), 판의 열변형, 판 상태, NC 데이터와 수축 보정, 작업자 설정, 온도 환경에 의해 결정된다. 절단 오차는 취부 틈새와 용접량을 키워 변형·공수를 늘리므로 정도관리의 출발점이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>요인<\/th><th>내용<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>절단기 정도<\/td><td>갠트리 레일 직진도·수평도, 구동계 백래시, 토치 높이 제어<\/td><td>정기 교정, 시험 절단으로 정도 확인<\/td><\/tr>\n<tr><td>절단 조건<\/td><td>절단 속도, 산소·가스 압력, 노즐 크기·높이, 플라즈마 전류 → 커프 폭 변동<\/td><td>판두께별 표준 조건, 커프 보정값 NC 반영, 소모품 교체 주기<\/td><\/tr>\n<tr><td>열변형<\/td><td>절단 중 판의 팽창·수축, 띠판 휨<\/td><td>대칭 절단, 브리지, 절단 순서, 수냉 정반<\/td><\/tr>\n<tr><td>판 상태<\/td><td>평탄도, 압연 잔류응력, 프라이머·녹<\/td><td>교정 후 투입, 쇼트블라스트·프라이머 두께 관리<\/td><\/tr>\n<tr><td>NC 데이터<\/td><td>CAD 전개 오차, 수축여유(덧살) 반영 오류, 네스팅<\/td><td>3D 모델 기반 자동 전개, 실적 기반 수축 보정<\/td><\/tr>\n<tr><td>작업자 설정<\/td><td>판 원점·직각 정렬(squaring) 오차, 마킹<\/td><td>자동 원점 인식(카메라), 표준 작업<\/td><\/tr>\n<tr><td>온도 환경<\/td><td>계절·일교차에 따른 판과 장비의 열팽창<\/td><td>측정 기준온도 관리, 대형 부재는 보정<\/td><\/tr>\n<tr><td>개선(베벨) 절단<\/td><td>베벨 각도·루트면 오차<\/td><td>베벨 헤드 교정, 각도 검사<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-2-5<\/td><td>절단 정밀도 좌우 요인 5가지<\/td><td>정확히 5개, 요인-대책 짝<\/td><\/tr>\n<tr><td class=\"num\">136-2-5<\/td><td>절단 정밀도에 영향을 주는 요소<\/td><td>요인 분류 + 정도관리 체계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>절단 오차는 취부 틈새와 용접량 증가 → 변형 증가 → 수정 공수 증가로 이어지므로 정도관리의 출발점임.<\/p>\n<h5>2. 영향 요인과 대책<\/h5>\n<ol><li><b>절단기 정도<\/b>: 레일 직진도·백래시·토치 높이 → 정기 교정, 시험 절단<\/li>\n<li><b>절단 조건<\/b>: 속도·가스 압력·노즐·플라즈마 전류 → 커프 폭 변동 → 판두께별 표준 조건, 커프 보정, 소모품 교체 주기<\/li>\n<li><b>열변형<\/b>: 판 팽창·띠판 휨 → 대칭 절단, 브리지, 내부→외곽 순서, 수냉 정반<\/li>\n<li><b>판 상태<\/b>: 평탄도·압연 잔류응력·프라이머 → 교정 후 투입<\/li>\n<li><b>NC 데이터<\/b>: 전개 오차·수축 여유 → 3D 기반 자동 전개, 실적 기반 보정<\/li>\n<li>(추가) 원점·직각 정렬, 온도 환경, 베벨 각도<\/li><\/ol>\n<h5>3. 정도관리 체계<\/h5><p>기준 설정(허용 공차) → 공정 계측 → 통계 분석 → NC·조건 보정(피드백)<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 절단 정밀도는 \"장비·조건·열변형·데이터\"의 합이며, 계측 데이터를 NC 보정치로 되돌리는 체계가 있어야 개선이 지속됨.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"curved-forming","p":5,"n":"5.13","h":"선박건조의 곡가공 성형: 외판 곡가공 방식과 특징","t":"선박건조의 곡가공 성형: 외판 곡가공 방식과 특징","c":3,"r":1,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 4번 · 25점","124회 4교시 2번 · 25점","136회 4교시 3번 · 25점"],"q":["<b>112회(2017) 2-4<\/b> 선박건조에서 곡가공 성형","<b>124회(2021) 4-2<\/b> 선박건조에서 사용되는 곡가공 성형","<b>136회(2025) 4-3<\/b> 선체외판의 곡가공 방식과 특징"],"k":"곡가공은 평판을 선체 곡면으로 만드는 공정이다. 한 방향 굽힘(단곡)은 롤·프레스로 냉간 가공하고, 두 방향 굽힘(복곡: 볼록·안장형)은 선상가열 같은 열간 가공으로 판 면내 수축을 만들어 성형한다. 숙련 의존도가 가장 높은 공정이라 자동화(다점 프레스, 가열 로봇)가 진행 중이다.","x":"\n<p class=\"key\">곡가공은 평판을 선체 곡면으로 만드는 공정이다. 한 방향 굽힘(단곡)은 롤·프레스로 냉간 가공하고, 두 방향 굽힘(복곡: 볼록·안장형)은 선상가열 같은 열간 가공으로 판 면내 수축을 만들어 성형한다. 숙련 의존도가 가장 높은 공정이라 자동화(다점 프레스, 가열 로봇)가 진행 중이다.<\/p>\n<h4>곡면의 분류<\/h4>\n<ul>\n<li>단곡(single curvature): 원통·원추형, 선미·선수 일부, 빌지부.<\/li>\n<li>복곡(double curvature): 볼록형(구형, 선수 구상부), 안장형(saddle, 선미 일부).<\/li>\n<\/ul>\n<h4>가공 방식<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>원리<\/th><th>특징·적용<\/th><\/tr><\/thead><tbody>\n<tr><td>롤 벤딩(3롤·4롤)<\/td><td>롤 사이를 통과시키며 냉간 굽힘<\/td><td>단곡 외판, 빌지 판. 빠르고 정밀<\/td><\/tr>\n<tr><td>프레스 벤딩<\/td><td>유압 프레스와 금형<\/td><td>단곡·완만한 복곡, 후판<\/td><\/tr>\n<tr><td>다점 프레스(multi-point press)<\/td><td>높이 조절 핀 배열로 임의 곡면 금형 구성<\/td><td>복곡 자동화, 금형 비용 절감<\/td><\/tr>\n<tr><td>선상가열(line heating)<\/td><td>가스 토치로 선 가열 후 수랭 → 가열부 압축 소성 → 냉각 수축 → 굽힘·면내 수축<\/td><td>복곡 성형의 주력, 숙련 의존, 자동화 로봇 개발<\/td><\/tr>\n<tr><td>삼각가열(wedge heating)<\/td><td>판 가장자리 쐐기형 가열로 면내 수축<\/td><td>볼록형 곡면, 가장자리 수축<\/td><\/tr>\n<tr><td>열간 가공(로 가열 후 프레스)<\/td><td>판 전체 가열 후 성형<\/td><td>극후판·급곡, 재질 열처리 영향 관리<\/td><\/tr>\n<tr><td>형강 곡가공(frame bender)<\/td><td>냉간 굽힘, 역곡선법<\/td><td>늑골·종늑골<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>공정 흐름<\/h4>\n<ol>\n<li>3D 선형에서 외판 전개(평면 전개 + 수축 여유), 가열선 정보 산출.<\/li>\n<li>절단 → 롤로 주곡률 성형 → 선상가열로 2차 곡률 성형.<\/li>\n<li>목형(template)·3D 레이저 계측으로 형상 확인, 반복 수정.<\/li>\n<\/ol>\n<h4>품질 관리<\/h4>\n<ul>\n<li>가열 온도 상한(IACS Rec. 47, 강종·냉각 방식별) 준수 → TMCP·고장력강의 강도·인성 저하 방지.<\/li>\n<li>과도 가열은 판 두께 증가·표면 산화, 반복 가열 횟수 제한.<\/li>\n<li>곡가공 정도가 블록 조립 정도를 좌우하므로 계측 데이터를 가열 계획에 피드백.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-2-4 · 124-4-2<\/td><td>곡가공 성형<\/td><td>곡면 분류, 냉간·열간 방식, 공정 흐름<\/td><\/tr>\n<tr><td class=\"num\">136-4-3<\/td><td>외판 곡가공 방식과 특징<\/td><td>방식별 비교표, 선상가열 원리 그림<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5>\n<p>곡가공: 평판을 선체 곡면으로 성형하는 공정. 단곡은 냉간 기계 가공, 복곡은 선상가열 등 열간 가공으로 판 면내 수축을 만들어 성형함. 숙련 의존도가 가장 높아 자동화가 과제임.<\/p>\n<h5>2. 곡면 분류<\/h5>\n<ul><li>단곡(원통·원추형): 빌지부, 선수미 일부<\/li><li>복곡: 볼록형(구상선수), 안장형(선미부)<\/li><\/ul>\n<h5>3. 선상가열의 원리<\/h5>\n<figure class=\"fig\"><svg viewBox=\"0 0 520 170\" role=\"img\" aria-label=\"선상가열 원리\">\n<rect x=\"30\" y=\"70\" width=\"140\" height=\"18\" class=\"fw\"/><path d=\"M100 40 L100 64\" class=\"lr\"/><text x=\"80\" y=\"34\" class=\"tr\">토치 가열<\/text>\n<text x=\"34\" y=\"110\" class=\"t2\">① 가열부 팽창 시도<\/text><text x=\"34\" y=\"128\" class=\"t2\">→ 주위 냉간부 구속<\/text><text x=\"34\" y=\"146\" class=\"t2\">→ 압축 소성변형<\/text>\n<path d=\"M190 79 h40\" class=\"ln\" marker-end=\"none\"/><text x=\"236\" y=\"84\" class=\"t2\">냉각<\/text>\n<path d=\"M280 70 Q 350 92 420 70 L420 88 Q 350 110 280 88 Z\" class=\"fa\"/>\n<text x=\"290\" y=\"128\" class=\"t2\">② 냉각 시 가열부 수축<\/text><text x=\"290\" y=\"146\" class=\"t2\">→ 각변형(굽힘)·면내 수축<\/text>\n<\/svg><\/figure>\n<h5>4. 가공 방식과 특징<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>적용<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>롤 벤딩(3·4롤)<\/td><td>단곡<\/td><td>빠르고 정밀, 냉간<\/td><\/tr>\n<tr><td>프레스 벤딩<\/td><td>단곡·완만한 복곡, 후판<\/td><td>금형 필요<\/td><\/tr>\n<tr><td>다점 프레스<\/td><td>복곡 자동화<\/td><td>핀 높이로 금형 구성, 범용<\/td><\/tr>\n<tr><td>선상가열<\/td><td>복곡 주력<\/td><td>숙련 의존, 가열선·속도·냉각으로 형상 제어<\/td><\/tr>\n<tr><td>삼각가열<\/td><td>볼록형, 가장자리 수축<\/td><td>면내 수축량 큼<\/td><\/tr>\n<tr><td>형강 벤딩(역곡선법)<\/td><td>늑골·종늑골<\/td><td>냉간<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>5. 공정 흐름<\/h5>\n<p>3D 선형 → 판 전개(수축 여유) → 절단 → 롤 1차 성형 → 선상가열 2차 성형 → 목형·3D 계측 → 수정 반복<\/p>\n<h5>6. 품질 관리<\/h5>\n<ul><li>가열 온도 상한(IACS Rec.47, 강종·냉각 방식별) 준수 → TMCP·고장력강 강도·인성 저하 방지<\/li>\n<li>반복 가열 횟수 제한, 계측 데이터를 가열 계획에 피드백<\/li><\/ul>\n<p class=\"concl\"><b>7. 결론<\/b>: 곡가공 정도가 블록 조립 정도와 탑재 수정 공수를 결정하므로, 가열선 자동 산출·다점 프레스·가열 로봇으로 숙련 의존을 줄이는 것이 생산성 향상의 핵심임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"block-division","p":6,"n":"6.1","h":"선체 블록분할(Block Division) 시 고려사항","t":"선체 블록분할(Block Division) 시 고려사항","c":5,"r":2,"b":[{"c":"hot","t":"5회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 4번 · 25점","118회 1교시 4번 · 10점","124회 1교시 7번 · 10점","133회 1교시 4번 · 10점","139회 4교시 6번 · 25점"],"q":["<b>112회(2017) 3-4<\/b> 선체 블록분할(Block Division) 시 고려사항","<b>118회(2019) 1-4<\/b> 선박 블록분할 시 고려사항","<b>124회(2021) 1-7<\/b> 선박 블록분할 시 고려사항","<b>133회(2024) 1-4<\/b> 선박 블록분할 시 고려사항","<b>139회(2026) 4-6<\/b> 작업성·생산성·공기단축을 위한 블록분할 시 고려사항"],"k":"블록분할은 선체를 공장에서 만들 수 있는 크기로 나누는 생산설계의 출발점이다. 설비 능력(크레인·정반·운반), 구조 강도(이음 위치), 용접 자세, 정도관리, 선행의장·도장, 탑재 순서와 도크 회전율, 표준화를 동시에 만족하는 분할선을 찾는 것이 핵심이며, 이 결정이 이후 공정의 공수와 공기를 대부분 정한다.","x":"\n<p class=\"key\">블록분할은 선체를 공장에서 만들 수 있는 크기로 나누는 생산설계의 출발점이다. 설비 능력(크레인·정반·운반), 구조 강도(이음 위치), 용접 자세, 정도관리, 선행의장·도장, 탑재 순서와 도크 회전율, 표준화를 동시에 만족하는 분할선을 찾는 것이 핵심이며, 이 결정이 이후 공정의 공수와 공기를 대부분 정한다.<\/p>\n<h4>1. 설비·물류 조건<\/h4>\n<ul>\n<li><b>중량·크기<\/b>: 조립 공장 크레인, 블록 운반차(트랜스포터), 도크 골리앗 크레인·해상 크레인 능력 이내. 공장 출입문·도로 폭·높이.<\/li>\n<li><b>정반·판넬 라인<\/b>: 판넬 라인 폭과 길이, 강판 최대 치수(대략 폭 4.5~5 m, 길이 20 m 내외)에 맞춘 판계.<\/li>\n<li><b>뒤집기·인양<\/b>: 턴오버 능력, 러그 배치, 인양 시 변형.<\/li>\n<\/ul>\n<h4>2. 구조·강도<\/h4>\n<ul>\n<li>블록 이음을 고응력부(해치 코너, 브래킷 토우, 구조 불연속부)에 두지 않는다.<\/li>\n<li>판 이음과 보강재 이음을 엇갈리게(stagger) 하고, 횡격벽·웨브 위치에서 일정 거리(대략 150~300 mm) 떼어 맞춤과 용접 공간 확보.<\/li>\n<li>종강도 부재 연속성, 판두께 차이 이음의 테이퍼 위치.<\/li>\n<li>극후판 컨테이너선은 갑판·코밍 블록 이음 엇갈림을 취성균열 정지 대책으로 활용(UR S33).<\/li>\n<\/ul>\n<h4>3. 용접·생산성<\/h4>\n<ul>\n<li>하향 자세 용접 비율 최대화, 상향(천장) 용접 최소화 → 역조립 블록 구성.<\/li>\n<li>자동 용접(판넬 SAW, 캐리지·로봇) 적용 가능한 형상.<\/li>\n<li>평블록과 곡블록 분리(곡블록은 핀 지그 정반에서).<\/li>\n<li>탑재 이음 용접 길이 최소화, 탑재 후 협소부 작업 회피.<\/li>\n<\/ul>\n<h4>4. 정도관리<\/h4>\n<ul>\n<li>블록 강성: 인양·운반 중 변형이 없을 만큼 강성 있는 분할.<\/li>\n<li>수축 여유(덧살)와 기준선 설정, 3D 계측으로 탑재 전 정도 확인.<\/li>\n<\/ul>\n<h4>5. 의장·도장<\/h4>\n<ul>\n<li>선행의장 극대화: 배관·전장·유닛을 블록 단계에서 설치할 수 있게 분할(천장의장).<\/li>\n<li>선행도장: 블록 단계 완전 도장, 탑재 이음부 마스킹 폭 최소화.<\/li>\n<\/ul>\n<h4>6. 탑재·공정<\/h4>\n<ul>\n<li>탑재 순서(선미 기관실 → 선수 방향 또는 중앙 기준 블록부터)와 도크 점유 기간.<\/li>\n<li>그랜드 블록(PE)·메가 블록 구성으로 도크 탑재 횟수 감소.<\/li>\n<li>공장별 부하 평준화, 블록 수와 이음 수의 trade-off.<\/li>\n<\/ul>\n<h4>7. 표준화·기타<\/h4>\n<ul>\n<li>반복 블록(평행부) 표준화, 동형선 재사용, GT 기반 계열화.<\/li>\n<li>작업 안전(고소작업 감소), 설계 변경 영향 최소화.<\/li>\n<\/ul>\n<div class=\"pro\"><p>블록을 크게 하면 도크 기간과 탑재 이음 공수가 줄지만, 크레인·운반 투자와 블록 정도관리 부담이 커진다. 답안 결론에는 \"설비 능력 범위 내 최대 블록화 + 고응력부 회피 + 선행의장·도장률 극대화\"를 기준으로 제시하고, 공기 단축(139회 문항) 관점이면 PE·메가 블록과 탑재 횟수 감소를 강조한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 5회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-3-4<\/td><td>선체 블록분할 시 고려사항<\/td><td class=\"num\">25<\/td><td>설비·구조·용접·정도·의장·공정 전 항목, 그림<\/td><\/tr>\n<tr><td class=\"num\">118-1-4 · 124-1-7 · 133-1-4<\/td><td>선박 블록분할 시 고려사항<\/td><td class=\"num\">10<\/td><td>6개 관점 키워드와 한 줄 의견<\/td><\/tr>\n<tr><td class=\"num\">139-4-6<\/td><td>작업성·생산성·공기단축을 위한 블록분할<\/td><td class=\"num\">25<\/td><td>공기단축 논리(탑재 횟수, 선행율, 도크 회전)를 결론에<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 1쪽\">\n<h5>1. 정의<\/h5>\n<p>블록분할: 선체를 공장 설비로 제작 가능한 단위(블록)로 나누는 생산설계 첫 단계임. 이후 공수·공기·품질의 대부분을 결정함.<\/p>\n<h5>2. 고려사항<\/h5>\n<ol>\n<li><b>설비<\/b>: 크레인·트랜스포터 능력(중량·치수), 정반·판넬 라인 폭, 강판 최대 치수, 턴오버 능력<\/li>\n<li><b>구조<\/b>: 블록 이음을 고응력부(해치 코너, 브래킷 토우)에서 이격, 판·보강재 이음 엇갈림(stagger), 격벽·웨브에서 150~300 mm 이격<\/li>\n<li><b>용접<\/b>: 하향자세 극대화, 상향 용접 최소화, 자동용접 적용 형상<\/li>\n<li><b>정도<\/b>: 인양·운반 시 변형 없는 블록 강성, 수축여유 설정<\/li>\n<li><b>의장·도장<\/b>: 선행의장·선행도장률 극대화, 탑재 이음부 마스킹 최소화<\/li>\n<li><b>공정·표준화<\/b>: 탑재 순서·도크 기간, 공장 부하 평준화, 반복 블록 표준화<\/li>\n<\/ol>\n<p class=\"concl\"><b>3. 의견<\/b>: 설비 능력 범위에서 최대 블록화하되 고응력부 회피를 최우선으로 해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 139회형(작업성·생산성·공기단축)\">\n<h5>1. 개요<\/h5>\n<ul><li>블록분할은 생산설계의 출발점으로, 분할선 하나가 용접 자세·선행의장률·탑재 횟수·도크 기간을 결정함<\/li>\n<li>공기단축의 핵심은 \"도크(탑재) 공정을 지상 공정으로 옮기는 것\"이며, 블록분할이 그 수단임<\/li><\/ul>\n<h5>2. 블록 건조 흐름과 분할의 위치<\/h5>\n<p>부재 가공 → 소조립 → 중조립 → 대조립(블록) → 선행의장·도장 → PE(그랜드블록) → 도크 탑재 → 진수<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 520 198\" role=\"img\" aria-label=\"중앙단면 블록분할 개념\">\n<path d=\"M40 30 L40 150 Q40 170 60 170 L460 170 Q480 170 480 150 L480 30\" class=\"fw\"/>\n<line x1=\"40\" y1=\"30\" x2=\"480\" y2=\"30\" class=\"ln\"/>\n<line x1=\"40\" y1=\"140\" x2=\"480\" y2=\"140\" class=\"ln\"/>\n<line x1=\"80\" y1=\"30\" x2=\"80\" y2=\"140\" class=\"ln\"/><line x1=\"440\" y1=\"30\" x2=\"440\" y2=\"140\" class=\"ln\"/>\n<g class=\"lr\"><line x1=\"40\" y1=\"100\" x2=\"80\" y2=\"100\"/><line x1=\"440\" y1=\"100\" x2=\"480\" y2=\"100\"/><line x1=\"200\" y1=\"140\" x2=\"200\" y2=\"170\"/><line x1=\"320\" y1=\"140\" x2=\"320\" y2=\"170\"/><line x1=\"160\" y1=\"22\" x2=\"160\" y2=\"38\"/><line x1=\"360\" y1=\"22\" x2=\"360\" y2=\"38\"/><\/g>\n<text x=\"230\" y=\"160\" class=\"t2\">이중저 블록<\/text><text x=\"84\" y=\"80\" class=\"t2\">선측 블록<\/text><text x=\"230\" y=\"50\" class=\"t2\">갑판 블록<\/text>\n<text x=\"250\" y=\"186\" class=\"tr\" text-anchor=\"middle\">붉은 선: 블록 이음(엇갈림 배치)<\/text>\n<\/svg><\/figure>\n<h5>3. 작업성 측면<\/h5>\n<ol><li>하향 용접 비율 극대화: 역조립(천장면을 정반에) 블록 구성, 상향 용접 최소화<\/li>\n<li>자동화 적용: 평블록은 판넬 라인(편면 SAW·로봇), 곡블록은 핀 지그 정반으로 분리<\/li>\n<li>접근성: 탑재 후 협소부 용접·의장 작업이 남지 않도록 분할<\/li>\n<li>안전: 고소·밀폐공간 작업 감소<\/li><\/ol>\n<h5>4. 생산성 측면<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>설비 능력<\/td><td>크레인·트랜스포터·턴오버 능력 내 최대 블록, 강판 치수 활용<\/td><\/tr>\n<tr><td>표준화<\/td><td>평행부 반복 블록, 동형선 재사용, 계열(GT)별 전용 라인<\/td><\/tr>\n<tr><td>정도관리<\/td><td>인양 강성, 수축여유, 3D 계측 → 탑재 시 수정 작업 제거<\/td><\/tr>\n<tr><td>부하 평준화<\/td><td>공장별 물량 균형, 병목 공정 회피<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>5. 공기단축 측면<\/h5>\n<ol><li>PE(그랜드블록)·메가블록화 → 도크 탑재 횟수 감소 → 도크 회전율 향상<\/li>\n<li>선행의장·선행도장률 극대화 → 탑재 후 작업 축소, 안벽 기간 단축<\/li>\n<li>탑재 이음 길이 최소화 → 도크 내 용접·검사 시간 감소<\/li>\n<li>기관실·선미부 블록 조기 확보 → 축계·주기 탑재 선행<\/li><\/ol>\n<h5>6. 구조 측면 제약<\/h5>\n<ul><li>블록 이음을 해치 코너·브래킷 토우·구조 불연속부에서 이격, 판 이음·보강재 이음 엇갈림<\/li>\n<li>극후판 컨테이너선 갑판·코밍: 블록 이음 엇갈림을 취성균열 정지 대책(UR S33)과 연계<\/li><\/ul>\n<p class=\"concl\"><b>7. 결론<\/b>: 블록 대형화는 도크 기간과 탑재 공수를 줄이지만 설비 투자와 정도관리 부담이 커지므로, \"설비 능력 범위 내 최대 블록화 + 고응력부 회피 + 선행의장·도장률 극대화\"를 기준으로 분할해야 함. 기술사는 블록분할 단계에서 생산·설계·의장 부서의 요구를 통합 조정해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"slit","p":6,"n":"6.2","h":"슬리트(Slit) 공법","t":"슬리트(Slit) 공법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 3번 · 10점"],"q":["<b>115회(2018) 1-3<\/b> 슬리트(Slit) 공법"],"k":"슬리트 공법은 주판에 종늑골(론지)을 먼저 용접해 붙인 뒤, 늑판·횡부재에 낸 측면 개방형 슬릿으로 횡부재를 옆에서 수평으로 밀어 넣어 조립하는 블록 조립 방법이다. 종래 슬롯(slot) 공법에서 많이 쓰던 칼라 플레이트와 그 용접을 줄여 변형과 공기를 줄인다.","x":"\n<p class=\"key\">슬리트 공법은 주판에 종늑골(론지)을 먼저 용접해 붙인 뒤, 늑판·횡부재에 낸 측면 개방형 슬릿으로 횡부재를 옆에서 수평으로 밀어 넣어 조립하는 블록 조립 방법이다. 종래 슬롯(slot) 공법에서 많이 쓰던 칼라 플레이트와 그 용접을 줄여 변형과 공기를 줄인다.<\/p>\n<h4>종래 슬롯 공법과의 비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>슬롯 공법<\/th><th>슬리트 공법<\/th><\/tr><\/thead><tbody>\n<tr><td>조립<\/td><td>횡부재를 위에서 내려 씌워 종늑골이 슬롯을 관통<\/td><td>종늑골 부착 판넬에 횡부재를 측면에서 수평 삽입<\/td><\/tr>\n<tr><td>칼라 플레이트<\/td><td>슬롯 보강·폐쇄용으로 다수 필요<\/td><td>대폭 감소<\/td><\/tr>\n<tr><td>용접량·변형<\/td><td>칼라 용접으로 증가, 얇은 늑판 수축 변형<\/td><td>감소<\/td><\/tr>\n<tr><td>정도 관리<\/td><td>상대적으로 단순<\/td><td>종늑골 직진도·직각도 정밀 관리 필요(삽입 간섭)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>요점<\/h4>\n<ul>\n<li>삽입 시 늑판의 용접 수축 여유를 미리 반영하고, 인양 빔·풀링 장치로 수평을 유지하며 밀어 넣는다.<\/li>\n<li>슬릿 크기를 최소화하면 용접량을 더 줄이면서 강도를 확보할 수 있다.<\/li>\n<li>컨테이너선 해치코밍과 종격벽을 일체 블록으로 먼저 만들고 상갑판을 끼워 넣는 응용도 있다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>주판에 종늑골을 먼저 용접한 뒤, 늑판·횡부재의 측면 개방형 슬릿으로 횡부재를 옆에서 수평 삽입하는 블록 조립 공법.<\/p>\n<h5>2. 슬롯 공법 대비<\/h5><ul><li>칼라 플레이트·용접량 대폭 감소 → 변형·공기 감소<\/li><li>늑판 수축 여유 반영, 인양 빔·풀링 장치로 수평 삽입<\/li><li>종늑골 직진도·직각도 정밀 관리 필요<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 슬릿 크기 최소화로 강도를 확보하며, 컨테이너선 해치코밍·종격벽 일체 블록에도 응용됨.<\/p><\/div><\/section><\/details>"},{"id":"pre-outfitting","p":6,"n":"6.3","h":"선행의장(Pre-outfitting)의 개념, 장점, 작업방식 (유닛의장 포함)","t":"선행의장(Pre-outfitting)의 개념, 장점, 작업방식 (유닛의장 포함)","c":3,"r":0,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 4번 · 25점","124회 2교시 3번 · 25점","127회 1교시 7번 · 10점"],"q":["<b>115회(2018) 3-4<\/b> 선행의장의 개념과 작업방식 3가지","<b>124회(2021) 2-3<\/b> 선행의장의 장점과 작업방식 3가지","<b>127회(2022) 1-7<\/b> 유닛의장(Unit outfitting)"],"k":"선행의장은 배관·전장·기기 같은 의장품을 선체 탑재 후 선상에서 설치하지 않고, 유닛·블록·그랜드블록 단계에서 미리 설치하는 생산 방식이다. 같은 작업을 하향 자세의 지상 작업장에서 하므로 공수·공기·품질·안전이 모두 좋아진다.","x":"\n<p class=\"key\">선행의장은 배관·전장·기기 같은 의장품을 선체 탑재 후 선상에서 설치하지 않고, 유닛·블록·그랜드블록 단계에서 미리 설치하는 생산 방식이다. 같은 작업을 하향 자세의 지상 작업장에서 하므로 공수·공기·품질·안전이 모두 좋아진다.<\/p>\n<h4>작업방식 3가지<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>내용<\/th><th>예<\/th><\/tr><\/thead><tbody>\n<tr><td>유닛의장(on-unit)<\/td><td>선체와 독립된 틀(skid)에 기기·배관·밸브·계장을 미리 조립해 하나의 단위로 시험 후 블록이나 선상에 한 번에 탑재<\/td><td>펌프 유닛, 청정기 유닛, 밸브 랙, 파이프 랙, 공조 유닛<\/td><\/tr>\n<tr><td>블록의장(on-block)<\/td><td>조립 완료된 블록에 의장품 설치. 블록을 뒤집은 상태에서 천장 배관을 하향 작업으로 설치(천장의장)<\/td><td>기관실 블록 배관·덕트·케이블 트레이·사다리<\/td><\/tr>\n<tr><td>그랜드블록 의장(on-grand-block, PE)<\/td><td>블록을 지상에서 대형으로 합친 PE 단계에서 블록 간 연결 배관·대형 기기 설치<\/td><td>기관실 PE의 주요 배관 연결, 상부구조 거주구 의장<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>이와 대비되는 것이 탑재 후 선상의장(on-board)으로, 가능하면 시운전 관련 최종 연결만 남긴다.<\/p>\n<h4>장점<\/h4>\n<ul>\n<li>하향 작업·지상 작업으로 공수 감소, 품질 향상, 고소작업·밀폐공간 작업 감소(안전).<\/li>\n<li>선체 공정과 병행 작업 → 도크·안벽 기간 단축.<\/li>\n<li>비계(scaffolding) 감소, 작업 환경 개선(조명·환기), 자재 물류 단순화.<\/li>\n<li>유닛은 공장에서 압력·기능 시험 후 탑재 → 선상 시운전 문제 감소.<\/li>\n<\/ul>\n<h4>전제 조건<\/h4>\n<ul>\n<li>설계 조기 완료(의장 도면이 선체 블록 일정보다 앞서야), 3D 모델 기반 간섭 검토.<\/li>\n<li>의장품 조기 조달, 블록 정도관리(배관 연결 정도), 선행도장과의 순서 조정(용접 후 도장 손상 방지).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-3-4<\/td><td>선행의장 개념과 작업방식 3가지<\/td><td class=\"num\">25<\/td><td>개념 정의, 유닛·블록·PE 의장 비교<\/td><\/tr>\n<tr><td class=\"num\">124-2-3<\/td><td>선행의장 장점과 작업방식 3가지<\/td><td class=\"num\">25<\/td><td>장점을 공수·공기·품질·안전으로 정량적 서술<\/td><\/tr>\n<tr><td class=\"num\">127-1-7<\/td><td>유닛의장<\/td><td class=\"num\">10<\/td><td>정의, 예시, 공장 시험 후 탑재<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5>\n<p>선행의장: 배관·전장·기기 등 의장품을 탑재 후 선상이 아니라 유닛·블록·그랜드블록 단계에서 미리 설치하는 생산 방식. 선체와 의장 공정을 병행해 공기를 줄이는 것이 목적임.<\/p>\n<h5>2. 의장 단계<\/h5>\n<p>유닛의장(지상 공장) → 블록의장(조립 블록) → PE의장(그랜드블록) → 선상의장(탑재 후, 최소화 대상)<\/p>\n<h5>3. 작업방식 3가지<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>내용<\/th><th>예<\/th><\/tr><\/thead><tbody>\n<tr><td>유닛의장<\/td><td>선체와 독립된 틀에 기기·배관·밸브를 조립·시험 후 일괄 탑재<\/td><td>펌프·청정기 유닛, 파이프 랙<\/td><\/tr>\n<tr><td>블록의장<\/td><td>블록 단계 설치, 블록을 뒤집어 천장 배관을 하향 작업(천장의장)<\/td><td>기관실 배관·덕트·케이블 트레이<\/td><\/tr>\n<tr><td>PE(그랜드블록) 의장<\/td><td>블록 간 연결 배관·대형 기기를 지상 PE 단계에서 설치<\/td><td>기관실 PE 주배관, 거주구 의장<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 장점<\/h5>\n<ol><li>공수: 하향·지상 작업으로 선상 대비 작업 효율 향상<\/li>\n<li>공기: 선체·의장 병행 → 도크·안벽 기간 단축<\/li>\n<li>품질: 작업 환경(조명·환기) 개선, 유닛은 공장 압력·기능 시험 후 탑재<\/li>\n<li>안전: 고소·밀폐공간 작업과 비계 감소<\/li><\/ol>\n<h5>5. 전제조건<\/h5>\n<ul><li>의장 설계 조기 완료(블록 일정보다 선행), 3D 모델 간섭 검토<\/li>\n<li>의장품 조기 조달, 블록 정도관리(배관 연결 정도), 선행도장과 순서 조정<\/li><\/ul>\n<p class=\"concl\"><b>6. 결론<\/b>: 선행의장률은 설계 출도 시점과 블록 정도에 의해 제한되므로, 설계-생산 동시공학으로 의장 도면을 앞당기는 것이 선행의장 확대의 핵심임.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 127회형(유닛의장)\">\n<h5>1. 정의<\/h5>\n<p>유닛의장: 선체와 분리된 틀(skid)에 기기·배관·밸브·계장을 미리 조립해 한 단위로 만든 뒤 블록이나 선상에 일괄 탑재하는 선행의장 방식.<\/p>\n<h5>2. 예<\/h5><p>펌프 유닛, 연료 청정기 유닛, 밸브 랙, 공조 유닛, 파이프 랙<\/p>\n<h5>3. 장점<\/h5><ul><li>지상 하향 작업, 공장 압력·기능 시험 후 탑재 → 선상 시운전 문제 감소<\/li><li>표준 유닛 반복 적용으로 설계·생산 공수 감소<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 유닛 크기는 탑재 경로·크레인 능력과 함께 정해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"gt","p":6,"n":"6.4","h":"그룹테크놀로지(GT, Group Technology) 기법","t":"그룹테크놀로지(GT, Group Technology) 기법","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 8번 · 10점"],"q":["<b>130회(2023) 1-8<\/b> 그룹테크놀로지(GT) 기법"],"k":"GT는 형상과 공정이 비슷한 부재·블록을 계열(family)로 묶어 같은 작업장과 공정 흐름에서 반복 생산하는 기법이다. 조선에서는 제품 중심 작업분류(PWBS)로 선체블록(HBCM), 구역별 의장(ZOFM), 구역별 도장(ZPTM)을 구성하는 기반이 된다.","x":"\n<p class=\"key\">GT는 형상과 공정이 비슷한 부재·블록을 계열(family)로 묶어 같은 작업장과 공정 흐름에서 반복 생산하는 기법이다. 조선에서는 제품 중심 작업분류(PWBS)로 선체블록(HBCM), 구역별 의장(ZOFM), 구역별 도장(ZPTM)을 구성하는 기반이 된다.<\/p>\n<h4>내용<\/h4>\n<ul>\n<li>부재 분류: 평판·곡판, 형강, 소조립재, 블록 형식(평블록, 곡블록, 상부구조, 기관실) 등 유사성 코드화.<\/li>\n<li>계열별 전용 라인: 판넬 라인, 곡블록 라인, 소조립 라인으로 흐름 생산.<\/li>\n<li>작업 단위(공정 단계 × 작업 구역 × 작업 종류)로 일정·물량을 관리.<\/li>\n<\/ul>\n<h4>효과<\/h4>\n<ul>\n<li>준비 시간 감소, 숙련도 향상, 자동화 적용 용이.<\/li>\n<li>공정 표준화로 일정 예측성과 물량 관리 정확도 향상.<\/li>\n<li>설계 표준화(표준 부재·표준 상세)와 연결되어 설계 공수도 감소.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>형상·공정이 비슷한 부재·블록을 계열로 묶어 같은 작업장·흐름에서 반복 생산하는 기법. 조선 PWBS(HBCM·ZOFM·ZPTM)의 기반.<\/p>\n<h5>2. 내용<\/h5><p>부재·블록 유사성 코드화 → 계열별 전용 라인(판넬·곡블록·소조립) → 공정×구역×종류로 일정·물량 관리.<\/p>\n<h5>3. 효과<\/h5><p>준비시간↓, 숙련·자동화↑, 표준화로 일정 예측·설계 공수↓.<\/p><\/div><\/section><\/details>"},{"id":"scheduling","p":6,"n":"6.5","h":"조선소 생산관리의 대·중·소일정계획과 일정 변동 요인","t":"조선소 생산관리의 대·중·소일정계획과 일정 변동 요인","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 3교시 4번 · 25점"],"q":["<b>121회(2020) 3-4<\/b> 대일정·중일정·소일정계획과 확정 일정계획에 영향을 주는 외적·내적 요인"],"k":"대일정은 선박별 주요 이정표와 도크 배정, 중일정은 블록·공정 단계별 공장 일정과 부하 평준화, 소일정은 작업팀 단위의 주·일 작업지시다. 상위 계획이 하위 계획의 제약이 되는 계층 구조이며, 외적 요인(선주·자재·기상)과 내적 요인(설계·생산성·설비)이 확정 일정을 흔든다.","x":"\n<p class=\"key\">대일정은 선박별 주요 이정표와 도크 배정, 중일정은 블록·공정 단계별 공장 일정과 부하 평준화, 소일정은 작업팀 단위의 주·일 작업지시다. 상위 계획이 하위 계획의 제약이 되는 계층 구조이며, 외적 요인(선주·자재·기상)과 내적 요인(설계·생산성·설비)이 확정 일정을 흔든다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>대일정(master)<\/th><th>중일정<\/th><th>소일정<\/th><\/tr><\/thead><tbody>\n<tr><td>대상<\/td><td>선박·조선소 전체<\/td><td>블록·PE·탑재 네트워크, 공장별<\/td><td>작업장·팀·개인<\/td><\/tr>\n<tr><td>내용<\/td><td>수주~인도 이정표(강재절단, 착공, 기공/용골거치, 진수, 인도), 도크·안벽 배정, 연간 조업도<\/td><td>블록별 조립·도장·의장 시작/완료일, 공장 부하 평준화, 자재 소요 시점<\/td><td>주간·일일 작업지시, 크레인·정반 배정, 인원 배치<\/td><\/tr>\n<tr><td>기간<\/td><td>수년, 월 단위<\/td><td>수개월, 주 단위<\/td><td>주·일 단위<\/td><\/tr>\n<tr><td>도구<\/td><td>도크 계획, 조업도 시뮬레이션<\/td><td>네트워크(CPM), 부하 산적표<\/td><td>MES, 작업지시서<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>일정에 영향을 주는 요인<\/h4>\n<div class=\"grid2\"><div class=\"box\"><h5>외적 요인<\/h5><ul><li>선주 설계 변경·사양 추가, 승인 지연<\/li><li>기자재·강재 납기 지연(주기관, 발전기, 극후판)<\/li><li>선급·기국 승인 지연, 규정 변경<\/li><li>기상(강풍·우천으로 탑재·도장 중단)<\/li><li>환율·자금, 노동 규제, 협력사 수급<\/li><\/ul><\/div>\n<div class=\"box\"><h5>내적 요인<\/h5><ul><li>설계 도면 출도 지연, 설계 오류<\/li><li>재작업(정도 불량, 품질 불합격)<\/li><li>인력 부족·숙련도, 생산성 편차<\/li><li>설비 고장(크레인), 공정 간 간섭<\/li><li>안전사고에 따른 작업 중지, 파업<\/li><\/ul><\/div><\/div>\n<p>대응은 버퍼 관리(주요 경로 여유), 공정 실적 실시간 수집과 재계획(rolling), 공급망 조기 경보, 설계-생산 동시공학이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 일정계획 계층<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>대일정<\/th><th>중일정<\/th><th>소일정<\/th><\/tr><\/thead><tbody>\n<tr><td>대상<\/td><td>선박·조선소<\/td><td>블록·PE·탑재, 공장<\/td><td>팀·개인<\/td><\/tr>\n<tr><td>내용<\/td><td>이정표(절단·착공·기공·진수·인도), 도크·안벽, 조업도<\/td><td>블록 일정, 부하 평준화, 자재 소요<\/td><td>주·일 작업지시, 크레인·정반·인원<\/td><\/tr>\n<tr><td>도구<\/td><td>도크 계획<\/td><td>CPM, 부하 산적<\/td><td>MES<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 영향 요인<\/h5><ul><li>외적: 선주 설계 변경·승인 지연, 기자재·강재 납기, 선급·규정, 기상, 환율·자금, 노동 규제·협력사<\/li><li>내적: 설계 출도 지연·오류, 재작업, 인력·생산성, 설비 고장, 공정 간섭, 안전사고·파업<\/li><\/ul>\n<h5>3. 대응<\/h5><p>주요 경로 버퍼, 실적 실시간 수집·재계획, 공급망 조기 경보, 설계-생산 동시공학.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 상위 일정이 하위 일정의 제약이므로 변동을 하위에서 흡수하는 버퍼·재계획 체계가 일정 준수의 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"block-method","p":6,"n":"6.6","h":"부재접합 방법과 블록공법의 기술변화가 선박 생산효율에 미친 영향","t":"부재접합 방법과 블록공법의 기술변화가 선박 생산효율에 미친 영향","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 3교시 5번 · 25점"],"q":["<b>130회(2023) 3-5<\/b> 부재접합 방법 및 블록공법의 기술변화가 생산효율에 미치는 영향"],"k":"리벳에서 용접으로, 선대 건조에서 블록공법으로, 다시 그랜드블록·메가블록과 자동·로봇 용접으로 바뀌면서 작업 장소가 선상에서 공장으로 옮겨졌다. 그 결과 도크 기간이 줄고 하향·자동 작업 비율이 높아져 생산성·품질·안전이 함께 향상됐다. 대신 블록 정도관리와 대형 설비 투자가 경쟁력의 조건이 됐다.","x":"\n<p class=\"key\">리벳에서 용접으로, 선대 건조에서 블록공법으로, 다시 그랜드블록·메가블록과 자동·로봇 용접으로 바뀌면서 작업 장소가 선상에서 공장으로 옮겨졌다. 그 결과 도크 기간이 줄고 하향·자동 작업 비율이 높아져 생산성·품질·안전이 함께 향상됐다. 대신 블록 정도관리와 대형 설비 투자가 경쟁력의 조건이 됐다.<\/p>\n<h4>부재 접합의 변화<\/h4>\n<ul>\n<li>리벳 → 아크 용접(2차 대전 전후): 중량 감소, 수밀성 향상, 블록 건조 가능. 초기 취성파괴 문제는 재료 인성 관리로 해결.<\/li>\n<li>피복아크 → CO₂ FCAW, 편면 SAW, EGW: 용착속도와 자동화율 증가.<\/li>\n<li>캐리지·로봇 용접, 레이저 하이브리드: 반복 정밀 용접, 저변형 박판.<\/li>\n<\/ul>\n<h4>블록공법의 변화<\/h4>\n<ul>\n<li>선대에서 부재 단위 조립 → 블록 공법(소조립·중조립·대조립) → 그랜드블록(PE)·메가블록 → 대형 링블록, 육상건조·탠덤 건조.<\/li>\n<li>선행의장·선행도장과 결합해 탑재 후 작업 최소화.<\/li>\n<\/ul>\n<h4>생산효율에 미친 영향<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>측면<\/th><th>영향<\/th><\/tr><\/thead><tbody>\n<tr><td>공기<\/td><td>도크 탑재 횟수 감소로 도크 회전율 증가, 연간 건조 척수 증가<\/td><\/tr>\n<tr><td>공수<\/td><td>하향·자동 용접, 지상 작업으로 CGT당 공수 감소<\/td><\/tr>\n<tr><td>품질<\/td><td>작업 환경 표준화, 용접 품질 안정<\/td><\/tr>\n<tr><td>안전<\/td><td>고소·밀폐 작업 감소<\/td><\/tr>\n<tr><td>요구 역량<\/td><td>크레인·운반·정반 투자, 3D 정도관리, 생산설계 능력이 경쟁력의 핵심이 됨<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 접합 방법 변화<\/h5><p>리벳 → 아크 용접(중량↓·수밀↑·블록화 가능) → CO₂ FCAW·편면 SAW·EGW → 로봇·레이저 하이브리드.<\/p>\n<h5>2. 블록공법 변화<\/h5><p>선대 부재 조립 → 블록(소·중·대조립) → PE·메가블록 → 링블록, 육상·탠덤 건조, 선행의장·도장 결합.<\/p>\n<h5>3. 생산효율 영향<\/h5><ul><li>공기: 도크 탑재 횟수↓, 회전율↑<\/li><li>공수: 하향·자동·지상 작업 → CGT당 공수↓<\/li><li>품질·안전: 작업 환경 표준화, 고소·밀폐 작업↓<\/li><li>요구 역량: 크레인·운반 투자, 3D 정도관리, 생산설계<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 작업 장소를 선상에서 공장으로 옮긴 것이 생산성 혁신의 본질이며, 다음 단계는 데이터 기반 스마트 야드임.<\/p><\/div><\/section><\/details>"},{"id":"block-logistics","p":6,"n":"6.7","h":"IoT·빅데이터 기반 선체블록 물류 자동화 시스템 구축방안과 기대효과","t":"IoT·빅데이터 기반 선체블록 물류 자동화 시스템 구축방안과 기대효과","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 3번 · 25점"],"q":["<b>139회(2026) 3-3<\/b> IoT·빅데이터 기반 선체블록 물류자동화 시스템 구축방안과 기대효과"],"k":"블록 물류 자동화는 블록과 운반장비의 위치·상태를 IoT로 실시간 수집하고, 빅데이터 분석과 최적화 알고리즘으로 적치장 배정과 운반 지시를 자동으로 만드는 것이다. 블록 찾기·재취급·대기 시간을 줄여 공정 준수율을 높이는 것이 목적이다.","x":"\n<p class=\"key\">블록 물류 자동화는 블록과 운반장비의 위치·상태를 IoT로 실시간 수집하고, 빅데이터 분석과 최적화 알고리즘으로 적치장 배정과 운반 지시를 자동으로 만드는 것이다. 블록 찾기·재취급·대기 시간을 줄여 공정 준수율을 높이는 것이 목적이다.<\/p>\n<h4>구축 방안<\/h4>\n<ol>\n<li><b>데이터 수집층<\/b>: 블록 태그(RFID, UWB, GNSS), 트랜스포터 텔레매틱스(위치·적재 중량·속도), 크레인 센서, 적치장 카메라. 사내 사설 5G·LTE망.<\/li>\n<li><b>플랫폼층<\/b>: 블록 마스터(치수·중량·무게중심·지지점), 공정 실적(MES), 설계(3D 모델) 연계. 디지털 트윈 야드 지도.<\/li>\n<li><b>분석·최적화층<\/b>: 공정 완료 시점 예측(과거 실적 기반 머신러닝), 적치장 배정 최적화(재취급 최소화), 운반 경로·배차 최적화, 병목 예측.<\/li>\n<li><b>실행층<\/b>: 운반 지시 자동 배포(운전자 태블릿), 자율주행 트랜스포터 단계 도입, 실시간 대시보드.<\/li>\n<li><b>단계적 도입<\/b>: 시범 구역 → 전 야드 확대, 데이터 표준·코드 체계 정비, 작업자 교육.<\/li>\n<\/ol>\n<h4>기대효과<\/h4>\n<ul>\n<li>블록 탐색 시간과 재취급(shuffle) 횟수 감소, 트랜스포터 가동률 향상.<\/li>\n<li>탑재 일정 준수율 향상, 적치장 면적 효율 증가.<\/li>\n<li>운반 중 충돌·과적 방지로 안전 향상, 블록 손상 감소.<\/li>\n<li>축적 데이터로 다음 호선 계획 정확도 향상(데이터 기반 생산관리).<\/li>\n<\/ul>\n<h4>과제<\/h4>\n<p>초기 투자비, 기존 시스템(ERP·MES) 연계, 금속 구조물 환경의 무선 위치 정확도, 사이버보안, 현장 수용성.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>블록·운반장비 위치·상태를 IoT로 수집하고 빅데이터·최적화로 적치·운반을 자동 지시해 탐색·재취급·대기를 줄이는 시스템.<\/p>\n<h5>2. 구축방안<\/h5><ol><li>수집: 블록 태그(RFID·UWB·GNSS), 트랜스포터 텔레매틱스, 크레인 센서, 카메라, 사설 5G<\/li><li>플랫폼: 블록 마스터(치수·중량·지지점), MES·3D 연계, 디지털 트윈 야드<\/li><li>분석: 완료 시점 예측(ML), 적치 배정(재취급 최소), 배차·경로 최적화<\/li><li>실행: 운반 지시 자동 배포, 자율주행 트랜스포터, 대시보드<\/li><li>단계적 도입, 데이터 표준, 교육<\/li><\/ol>\n<h5>3. 기대효과<\/h5><p>탐색·재취급↓, 장비 가동률↑, 탑재 준수율↑, 적치 효율↑, 충돌·과적 방지, 데이터 기반 계획.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 초기 투자·시스템 연계·금속 환경 위치 정확도·보안이 과제이며, 시범 구역 효과 검증 후 확대하는 것이 현실적임.<\/p><\/div><\/section><\/details>"},{"id":"digital-shipyard","p":6,"n":"6.8","h":"3D CAD를 활용한 조선소 생산지원기술 개발 사례","t":"3D CAD를 활용한 조선소 생산지원기술 개발 사례","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 1번 · 25점"],"q":["<b>115회(2018) 3-1<\/b> 3D CAD를 활용한 조선소 생산지원기술의 개발 사례"],"k":"3D 제품 모델은 설계 도구를 넘어 생산정보의 원천이 되었다. 같은 모델에서 절단 NC·네스팅, 배관 스풀도, 블록 조립도, 중량·무게중심, 탑재 시뮬레이션, 로봇 오프라인 프로그래밍, 정도관리 비교를 자동으로 만들어 생산 공수와 오류를 줄인다.","x":"\n<p class=\"key\">3D 제품 모델은 설계 도구를 넘어 생산정보의 원천이 되었다. 같은 모델에서 절단 NC·네스팅, 배관 스풀도, 블록 조립도, 중량·무게중심, 탑재 시뮬레이션, 로봇 오프라인 프로그래밍, 정도관리 비교를 자동으로 만들어 생산 공수와 오류를 줄인다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분야<\/th><th>활용 사례<\/th><th>효과<\/th><\/tr><\/thead><tbody>\n<tr><td>절단·가공<\/td><td>부재 자동 전개·네스팅, NC 데이터, 곡가공 가열선 정보<\/td><td>강재 수율 향상, 마킹 오류 감소<\/td><\/tr>\n<tr><td>조립<\/td><td>3D 조립 작업도·뷰어(태블릿), 조립 순서 시뮬레이션<\/td><td>도면 해석 시간 감소, 종이 도면 감소<\/td><\/tr>\n<tr><td>배관·의장<\/td><td>스풀 자동 생성, 간섭 검토(DMU), 서포트 자동 설계<\/td><td>현장 재작업 감소<\/td><\/tr>\n<tr><td>블록·탑재<\/td><td>블록 분할 검토, 중량·무게중심·러그 위치, 탑재 시뮬레이션<\/td><td>인양 안전, 탑재 계획 정확도<\/td><\/tr>\n<tr><td>용접<\/td><td>로봇 오프라인 프로그래밍(용접선 자동 추출)<\/td><td>자동화율 향상<\/td><\/tr>\n<tr><td>정도관리<\/td><td>3D 레이저·사진측량 계측과 모델 비교<\/td><td>탑재 전 오차 사전 보정<\/td><\/tr>\n<tr><td>물량·일정<\/td><td>모델 기반 물량(용접 길이, 도장 면적) 산출<\/td><td>공수·일정 계획 정확도<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분야<\/th><th>사례<\/th><th>효과<\/th><\/tr><\/thead><tbody>\n<tr><td>절단·가공<\/td><td>자동 전개·네스팅·NC, 가열선 정보<\/td><td>수율↑, 마킹 오류↓<\/td><\/tr>\n<tr><td>조립<\/td><td>3D 작업도·태블릿 뷰어<\/td><td>도면 해석 시간↓<\/td><\/tr>\n<tr><td>배관·의장<\/td><td>스풀 자동 생성, DMU 간섭 검토<\/td><td>재작업↓<\/td><\/tr>\n<tr><td>블록·탑재<\/td><td>분할 검토, 중량·무게중심·러그, 탑재 시뮬레이션<\/td><td>인양 안전<\/td><\/tr>\n<tr><td>용접<\/td><td>로봇 오프라인 프로그래밍<\/td><td>자동화↑<\/td><\/tr>\n<tr><td>정도관리<\/td><td>3D 계측 vs 모델 비교<\/td><td>사전 보정<\/td><\/tr>\n<tr><td>물량·일정<\/td><td>용접 길이·도장 면적 산출<\/td><td>계획 정확도<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 3D 모델을 생산정보의 단일 원천으로 쓰는 것이 핵심이며, 설계 변경이 생산 데이터에 자동 반영되는 체계가 필요함.<\/p><\/div><\/section><\/details>"},{"id":"vr","p":6,"n":"6.9","h":"조선산업에서 가상현실(VR)의 활용분야","t":"조선산업에서 가상현실(VR)의 활용분야","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 4교시 6번 · 25점"],"q":["<b>118회(2019) 4-6<\/b> 조선산업에서 가상현실(VR)의 활용분야"],"k":"VR은 3D 모델 속에 사람이 들어가 실물 크기로 보고 조작하게 해, 건조 전에 설계·작업·안전을 검토하고 교육하는 데 쓰인다. AR·MR과 결합하면 현장 검사와 원격 지원까지 확장된다.","x":"\n<p class=\"key\">VR은 3D 모델 속에 사람이 들어가 실물 크기로 보고 조작하게 해, 건조 전에 설계·작업·안전을 검토하고 교육하는 데 쓰인다. AR·MR과 결합하면 현장 검사와 원격 지원까지 확장된다.<\/p>\n<ul>\n<li><b>설계 검토<\/b>: 선주·선급과 거주구·선교·기관실 배치를 실물 크기로 검토(시야, 동선, 정비 공간, 인간공학).<\/li>\n<li><b>정비성·작업성 검증<\/b>: 밸브 조작 높이, 기기 인출 경로, 용접 접근성 확인.<\/li>\n<li><b>교육·훈련<\/b>: 용접·도장 시뮬레이터(재료 절감), 밀폐공간·화재·추락 위험 체험 안전교육, 선원 운항 훈련.<\/li>\n<li><b>생산 계획<\/b>: 블록 탑재·인양 시뮬레이션, 의장 설치 순서 검토.<\/li>\n<li><b>영업·마케팅<\/b>: 신선형·친환경 설계 홍보, 원격 선주 회의.<\/li>\n<li><b>현장(AR)<\/b>: 모델 겹쳐 보기로 설치 위치·누락 검사, 원격 전문가 지원, 운항 중 디지털 트윈 정비.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<ol><li>설계 검토: 선주·선급과 실물 크기 배치 검토(시야·동선·정비 공간)<\/li><li>정비성·작업성: 밸브 높이, 기기 인출, 용접 접근<\/li><li>교육·훈련: 용접·도장 시뮬레이터, 안전 체험, 선원 훈련<\/li><li>생산 계획: 탑재·인양 시뮬레이션, 의장 순서<\/li><li>영업: 신선형 홍보, 원격 회의<\/li><li>AR 현장: 설치 위치·누락 검사, 원격 지원, 디지털 트윈 정비<\/li><\/ol>\n<p class=\"concl\"><b>결론<\/b>: VR의 가치는 \"건조 전 문제 발견\"과 \"위험 없는 훈련\"이며, 3D 모델 품질이 활용 범위를 좌우함.<\/p><\/div><\/section><\/details>"},{"id":"reverse-eng","p":6,"n":"6.10","h":"역설계(Reverse Engineering)의 개념과 선박설계 적용사례","t":"역설계(Reverse Engineering)의 개념과 선박설계 적용사례","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 3교시 6번 · 25점"],"q":["<b>130회(2023) 3-6<\/b> 역설계(Reverse Engineering)의 개념과 선박설계 적용사례"],"k":"역설계는 이미 존재하는 실물을 3D 스캐닝·사진측량으로 측정해 점군(point cloud)을 얻고, 이를 CAD 모델로 재구성해 설계·개조·검증에 쓰는 것이다. 도면이 없거나 실제 상태가 도면과 다른 운항선 개조에서 특히 유용하다.","x":"\n<p class=\"key\">역설계는 이미 존재하는 실물을 3D 스캐닝·사진측량으로 측정해 점군(point cloud)을 얻고, 이를 CAD 모델로 재구성해 설계·개조·검증에 쓰는 것이다. 도면이 없거나 실제 상태가 도면과 다른 운항선 개조에서 특히 유용하다.<\/p>\n<h4>절차<\/h4>\n<ol>\n<li>측정: 레이저 스캐너(기관실·선체), 사진측량, 접촉식 CMM(프로펠러).<\/li>\n<li>점군 정합·노이즈 제거.<\/li>\n<li>곡면·솔리드 모델링(선형은 NURBS 곡면 재구성).<\/li>\n<li>설계·해석에 활용, 설치 후 재스캔으로 검증.<\/li>\n<\/ol>\n<h4>적용 사례<\/h4>\n<ul>\n<li>운항선 친환경 개조: 스크러버·BWTS·SCR 설치 시 기관실·연돌 스캔으로 배관 경로·간섭 확인.<\/li>\n<li>구상선수·ESD 개조: 실제 선형 스캔 → CFD → 개조 형상 설계.<\/li>\n<li>LNG 연료 개조: 탱크 배치 공간 측정.<\/li>\n<li>프로펠러 날개 형상 측정·수리, 손상 부재 복제 제작.<\/li>\n<li>건조 중 정도관리: 블록 스캔과 설계 모델 비교.<\/li>\n<li>디지털 트윈 구축(as-built 모델).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개념<\/h5><p>실물을 스캔(레이저·사진측량·CMM)해 점군 → 정합 → 곡면·솔리드 모델로 재구성해 설계·개조·검증에 쓰는 것.<\/p>\n<h5>2. 선박설계 적용<\/h5><ul><li>운항선 친환경 개조: 스크러버·BWTS·SCR 배관 경로·간섭<\/li><li>구상선수·ESD 개조: 선형 스캔 → CFD → 개조 설계<\/li><li>LNG 연료 개조 탱크 공간 측정<\/li><li>프로펠러 형상 측정·수리, 손상 부재 복제<\/li><li>건조 중 블록 정도관리, as-built 디지털 트윈<\/li><\/ul>\n<p class=\"concl\"><b>3. 결론<\/b>: 도면이 없거나 실제와 다른 운항선 개조에서 공기·재작업을 줄이는 핵심 기술임.<\/p><\/div><\/section><\/details>"},{"id":"launching","p":6,"n":"6.11","h":"도크에서의 선박 진수(탠덤 진수 포함) 사전 준비사항과 진수 과정","t":"도크에서의 선박 진수(탠덤 진수 포함) 사전 준비사항과 진수 과정","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 5번 · 25점"],"q":["<b>115회(2018) 4-5<\/b> 도크에서의 선박 진수(탠덤 진수 포함) 사전 준비사항 및 진수 과정"],"k":"도크 진수는 도크에 물을 채워 선박을 띄운 뒤 게이트를 열고 예인해 내보내는 과정이다. 사전에 수밀성(선저 개구·탱크 시험)과 부양 상태(중량·흘수·트림·복원성)를 확보하고, 탠덤 건조에서는 미완성 선박의 재배치까지 계획해야 한다.","x":"\n<p class=\"key\">도크 진수는 도크에 물을 채워 선박을 띄운 뒤 게이트를 열고 예인해 내보내는 과정이다. 사전에 수밀성(선저 개구·탱크 시험)과 부양 상태(중량·흘수·트림·복원성)를 확보하고, 탠덤 건조에서는 미완성 선박의 재배치까지 계획해야 한다.<\/p>\n<h4>사전 준비사항<\/h4>\n<ul>\n<li><b>수밀성<\/b>: 선저 외판 개구(씨체스트, 선외 밸브, 측심관) 폐쇄, 수밀 시험·탱크 시험 완료 구역 확인, 선미관 씰·프로펠러·타 설치 완료.<\/li>\n<li><b>도장·부착물<\/b>: 수선 아래 도장 완료, 아연 양극·ICCP 양극, 흘수표·만재흘수선 표시.<\/li>\n<li><b>진수 계산<\/b>: 진수 중량(경하 일부), 무게중심 추정, 부양 흘수·트림, 부양 시 복원성(GM), 밸러스트 계획. 부양 직전 블록 반력 변화 검토.<\/li>\n<li><b>계류·예인<\/b>: 계류줄·비트 배치, 예인선 수배, 도크 게이트 조작, 기상·조석 확인.<\/li>\n<li><b>안전<\/b>: 선내 인원 통제, 소방·비상 대응, 선내 전원·조명·빌지 펌프 준비, 누수 감시조 배치.<\/li>\n<li><b>탠덤<\/b>: 미완성 선박의 부양 여부(부양·재착저), 임시 수밀 격벽, 재배치 위치의 반목(keel block) 사전 설치.<\/li>\n<\/ul>\n<h4>진수 과정<\/h4>\n<ol>\n<li>도크 주수 시작, 단계별로 수위를 올리며 선내 누수 점검.<\/li>\n<li>부양 직전 수위에서 정지, 트림·횡경사·흘수 확인, 밸러스트 조정.<\/li>\n<li>완전 부양 확인(블록에서 이격), 계류 장력 조정.<\/li>\n<li>게이트 개방 → 예인선으로 도크 밖 의장 안벽으로 이동.<\/li>\n<li><b>탠덤(semi-tandem)<\/b>: 완성선 반출 후 미완성선(선미 블록 등)을 부양시켜 도크 앞쪽(또는 정해진 위치)으로 이동, 반목 위에 착저 → 게이트 폐쇄 → 배수 → 다음 선박 블록 탑재 계속.<\/li>\n<li>진수 후 흘수·트림 계측, 누수 최종 점검, 진수 기록.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 사전 준비<\/h5><ul><li>수밀성: 선저 개구 폐쇄, 수밀·탱크 시험 확인, 선미관 씰·프로펠러·타<\/li><li>도장·양극·흘수표<\/li><li>진수 계산: 중량·무게중심, 부양 흘수·트림·GM, 밸러스트, 블록 반력<\/li><li>계류·예인·게이트·기상·조석<\/li><li>안전: 인원 통제, 소방, 빌지 펌프, 누수 감시조<\/li><li>탠덤: 미완성선 부양 여부, 임시 수밀 격벽, 재배치 반목<\/li><\/ul>\n<h5>2. 진수 과정<\/h5><ol><li>단계별 주수·누수 점검<\/li><li>부양 직전 정지, 트림·흘수 확인, 밸러스트 조정<\/li><li>완전 부양 확인, 계류 조정<\/li><li>게이트 개방 → 예인 → 의장 안벽<\/li><li>탠덤: 미완성선 부양·이동 → 반목 착저 → 게이트 폐쇄 → 배수<\/li><li>진수 후 흘수·누수 최종 점검<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: 탠덤 진수는 미완성선의 부양 안정성과 재착저 정도가 핵심 위험이므로 별도 계산과 반목 사전 설치가 필수임.<\/p><\/div><\/section><\/details>"},{"id":"jigs","p":6,"n":"6.12","h":"곡블록 조립 시 조립용 지그(Jig) 사용의 장점","t":"곡블록 조립 시 조립용 지그(Jig) 사용의 장점","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 3교시 4번 · 25점"],"q":["<b>136회(2025) 3-4<\/b> 곡블록 조립 시 조립용 지그(Jig) 사용의 장점"],"k":"곡블록은 외판 곡면을 기준면으로 조립해야 하므로, 높이를 조절할 수 있는 핀 지그(pin jig) 위에 외판을 올려 설계 곡면대로 지지한 뒤 내부 부재를 조립한다. 지그는 곡면 정도 확보, 변형 억제, 하향 작업, 반복 사용을 가능하게 한다.","x":"\n<p class=\"key\">곡블록은 외판 곡면을 기준면으로 조립해야 하므로, 높이를 조절할 수 있는 핀 지그(pin jig) 위에 외판을 올려 설계 곡면대로 지지한 뒤 내부 부재를 조립한다. 지그는 곡면 정도 확보, 변형 억제, 하향 작업, 반복 사용을 가능하게 한다.<\/p>\n<h4>장점<\/h4>\n<ul>\n<li><b>정도<\/b>: 각 핀 높이를 3D 모델 데이터로 설정해 곡면 형상을 정확히 재현, 탑재 시 맞춤 오차 감소.<\/li>\n<li><b>변형 억제<\/b>: 용접 중 외판을 지그에 구속해 변형과 처짐 감소.<\/li>\n<li><b>작업성<\/b>: 블록을 뒤집은 상태(외판이 아래)로 내부 부재를 하향 용접, 비계 감소.<\/li>\n<li><b>범용성<\/b>: 핀 높이만 바꿔 다양한 곡블록에 재사용(전용 정반 불필요), 자동 높이 조절 지그는 설정 시간 단축.<\/li>\n<li><b>안전·공기<\/b>: 안정적인 지지로 안전 향상, 재작업 감소로 공기 단축.<\/li>\n<\/ul>\n<p>주의점: 핀 간격과 지지 반력 관리(판 국부 변형), 지그 높이 데이터 정확도, 열팽창 계절 보정.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>곡블록은 외판 곡면이 기준이므로 높이 조절 핀 지그 위에 외판을 설계 곡면대로 지지하고 내부 부재를 조립함.<\/p>\n<h5>2. 장점<\/h5><ol><li>정도: 3D 데이터로 핀 높이 설정 → 곡면 재현, 탑재 오차↓<\/li><li>변형 억제: 용접 중 구속<\/li><li>작업성: 역조립 하향 용접, 비계↓<\/li><li>범용성: 핀 높이 변경으로 재사용, 자동 조절 지그<\/li><li>안전·공기: 안정 지지, 재작업↓<\/li><\/ol>\n<h5>3. 주의<\/h5><p>핀 간격·반력(판 국부 변형), 높이 데이터 정확도, 열팽창 보정.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 곡블록 정도가 선수미 탑재 수정 공수를 좌우하므로 지그 데이터 자동화가 생산성의 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"quality-control","p":6,"n":"6.13","h":"선박건조 시 품질관리의 단계별 수행내용(설계, 제작, 검사)","t":"선박건조 시 품질관리의 단계별 수행내용(설계, 제작, 검사)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 2교시 5번 · 25점"],"q":["<b>139회(2026) 2-5<\/b> 선박건조 시 품질관리의 단계별 수행내용(설계, 제작, 검사)"],"k":"조선 품질관리는 설계에서 품질을 만들고(규칙·사양 만족과 생산성), 제작에서 품질을 지키고(재료 추적, 절차 준수, 정도관리), 검사에서 품질을 증명(자체·선급·선주 검사, 시험, 기록)하는 체계다. ISO 9001 품질경영시스템과 선급 승인이 그 틀이다.","x":"\n<p class=\"key\">조선 품질관리는 설계에서 품질을 만들고(규칙·사양 만족과 생산성), 제작에서 품질을 지키고(재료 추적, 절차 준수, 정도관리), 검사에서 품질을 증명(자체·선급·선주 검사, 시험, 기록)하는 체계다. ISO 9001 품질경영시스템과 선급 승인이 그 틀이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>수행내용<\/th><\/tr><\/thead><tbody>\n<tr><td>설계<\/td><td>계약 사양·규칙 검토, 설계 검토(DR)·FMEA, 선급 도면 승인, 생산설계 반영(생산성·검사 접근성), 설계 변경 관리, 3D 간섭 검토<\/td><\/tr>\n<tr><td>제작<\/td><td>자재 입고 검사와 추적(밀 시트, 강재 표시), 용접 절차(WPS)·용접사 자격, 공정별 자주검사, 정도관리(절단·조립·블록), 도장 환경·두께 관리, 부적합 관리(NCR)·시정조치<\/td><\/tr>\n<tr><td>검사<\/td><td>검사·시험 계획(ITP)에 따른 자체 QC → 선급·선주 입회(hold/witness point), NDT, 탱크·기밀 시험, 기능 시험, 시운전, 문서화와 인도 서류<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>성과 지표로 1차 합격률, NCR 건수, 재작업 공수를 관리하고, 반복 결함은 원인 분석 후 설계·공정 표준에 반영한다(PDCA).<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>수행내용<\/th><\/tr><\/thead><tbody>\n<tr><td>설계<\/td><td>사양·규칙 검토, DR·FMEA, 선급 승인, 생산성·검사 접근성 반영, 변경 관리, 3D 간섭<\/td><\/tr>\n<tr><td>제작<\/td><td>자재 입고·추적, WPS·용접사 자격, 자주검사, 정도관리, 도장 환경·두께, NCR·시정조치<\/td><\/tr>\n<tr><td>검사<\/td><td>ITP → 자체 QC → 선급·선주 입회(hold/witness), NDT, 기밀시험, 기능시험, 시운전, 인도 문서<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>지표: 1차 합격률, NCR 건수, 재작업 공수 → 반복 결함을 설계·공정 표준에 반영(PDCA), ISO 9001 체계.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 품질은 설계에서 만들고 제작에서 지키며 검사로 증명하는 것으로, 앞 단계일수록 비용 효과가 큼.<\/p><\/div><\/section><\/details>"},{"id":"ksss","p":6,"n":"6.14","h":"한국조선소안전표준화(KSSS, Korean Shipyard Safety Standardization)","t":"한국조선소안전표준화(KSSS, Korean Shipyard Safety Standardization)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 4교시 6번 · 25점"],"q":["<b>115회(2018) 4-6<\/b> 한국조선소안전표준화(KSSS)"],"k":"KSSS는 국내 조선소마다 달랐던 안전 기준을 하나의 공통 표준으로 만들기 위해 2014년 시작된 업계 공동 프로젝트다. 조선사와 오일 메이저·선주사 등 33개사가 참여해 밀폐공간 작업, 안전교육 등 고위험 분야 7개 표준을 만들었다.","x":"\n<p class=\"key\">KSSS는 국내 조선소마다 달랐던 안전 기준을 하나의 공통 표준으로 만들기 위해 2014년 시작된 업계 공동 프로젝트다. 조선사와 오일 메이저·선주사 등 33개사가 참여해 밀폐공간 작업, 안전교육 등 고위험 분야 7개 표준을 만들었다.<\/p>\n<h4>배경<\/h4>\n<ul>\n<li>조선소 간 이동이 잦은 협력사 근로자가 조선소마다 다른 규칙·표지·허가 절차를 익혀야 하는 문제.<\/li>\n<li>해양플랜트 발주처(오일 메이저)가 요구하는 국제 수준 안전관리와 국내 조선소 안전 실적(재해율) 격차가 수주 경쟁력 문제로 제기.<\/li>\n<\/ul>\n<h4>내용<\/h4>\n<ul>\n<li>밀폐공간 작업, 안전교육 등 고위험 작업 분야별 공통 절차·기준(작업허가, 가스 측정, 감시인, 교육 내용·인정).<\/li>\n<li>공통 표준을 적용해 교육 이수와 자격을 조선소 간 상호 인정.<\/li>\n<\/ul>\n<h4>의의<\/h4>\n<p>안전 규칙의 일관성으로 협력사 근로자 혼선을 줄이고, 발주처 요구 수준에 맞춘 안전관리 체계를 갖추는 기반이 된다. 이후 중대재해처벌법(2022) 시행과 함께 조선소 안전관리 체계(위험성평가, 작업중지권)의 바탕이 되었다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>국내 조선소 안전 기준을 공통 표준으로 만든 업계 공동 프로젝트(2014~, 조선사·오일 메이저·선주사 등 33개사, 밀폐공간·안전교육 등 7개 표준).<\/p>\n<h5>2. 배경<\/h5><p>조선소 간 이동하는 협력사 근로자의 규칙·허가 절차 혼선, 해양플랜트 발주처 안전 요구와 재해율 격차.<\/p>\n<h5>3. 내용<\/h5><p>고위험 작업 공통 절차(작업허가, 가스 측정, 감시인, 교육), 교육·자격 상호 인정.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 안전 규칙 일관성으로 협력사 사고를 줄이는 기반이며, 중대재해처벌법 이후 위험성평가·작업중지권 체계로 이어짐.<\/p><\/div><\/section><\/details>"},{"id":"paints","p":6,"n":"6.15","h":"선박용 도료의 종류와 특징, 구역별 적용 도료","t":"선박용 도료의 종류와 특징, 구역별 적용 도료","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 2교시 3번 · 25점"],"q":["<b>115회(2018) 2-3<\/b> 선박용 도료의 종류 및 특징과 구역별 적용 도료"],"k":"선박 도장은 하도(방청)·중도·상도의 도장계로 구성되며, 구역의 부식 환경과 기능(방오, 내마모, 내화학, 내열, 식수 위생)에 맞춰 도료를 고른다. 밸러스트탱크는 PSPC, 원유탱크는 COT PSPC가 강제된다.","x":"\n<p class=\"key\">선박 도장은 하도(방청)·중도·상도의 도장계로 구성되며, 구역의 부식 환경과 기능(방오, 내마모, 내화학, 내열, 식수 위생)에 맞춰 도료를 고른다. 밸러스트탱크는 PSPC, 원유탱크는 COT PSPC가 강제된다.<\/p>\n<h4>도료의 종류<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>도료<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>에폭시(epoxy)<\/td><td>부착·내수·내화학성 우수, 자외선에 초킹 → 내부·하도의 주력<\/td><\/tr>\n<tr><td>폴리우레탄(PU)<\/td><td>내후성·광택 유지 → 외부 상도<\/td><\/tr>\n<tr><td>징크 실리케이트(무기 아연)<\/td><td>희생방식 효과, 내용제성 → 숍프라이머, 케미컬 탱크<\/td><\/tr>\n<tr><td>페놀릭 에폭시<\/td><td>내화학성 향상 → 케미컬·프로덕트 화물탱크<\/td><\/tr>\n<tr><td>방오도료(SPC)<\/td><td>자기마모형 공중합체가 서서히 녹아 살생물제(구리) 방출. TBT는 AFS 협약으로 금지, 사이부트린도 금지 추가<\/td><\/tr>\n<tr><td>오염박리(foul release)<\/td><td>실리콘 저표면에너지, 살생물제 없음, 고속선 유리<\/td><\/tr>\n<tr><td>내열 실리콘, 알키드, 아크릴<\/td><td>배기관·연돌, 거주구 내부, 일반 의장품<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>구역별 적용<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구역<\/th><th>도장계<\/th><\/tr><\/thead><tbody>\n<tr><td>선저(평저·선측 하부)<\/td><td>에폭시 방청 + 결합층 + 방오(SPC 또는 오염박리)<\/td><\/tr>\n<tr><td>수선부(boot top)<\/td><td>에폭시 + 방오 또는 내마모 에폭시(건습 반복, 접안 마찰)<\/td><\/tr>\n<tr><td>건현부·상부구조 외부<\/td><td>에폭시 + 폴리우레탄 상도<\/td><\/tr>\n<tr><td>노출 갑판<\/td><td>에폭시 + PU, 미끄럼 방지 골재<\/td><\/tr>\n<tr><td>밸러스트탱크<\/td><td>PSPC 승인 에폭시(밝은 색 상도, NDFT 320 μm)<\/td><\/tr>\n<tr><td>원유·제품유 탱크<\/td><td>에폭시·페놀릭 에폭시(COT PSPC 대상은 승인 도료)<\/td><\/tr>\n<tr><td>케미컬 탱크<\/td><td>페놀릭 에폭시, 징크 실리케이트 또는 스테인리스<\/td><\/tr>\n<tr><td>청수·식수 탱크<\/td><td>식수 인증 무용제 에폭시<\/td><\/tr>\n<tr><td>벌크 화물창<\/td><td>내마모 에폭시<\/td><\/tr>\n<tr><td>기관실·거주구 내부<\/td><td>알키드·에폭시·아크릴<\/td><\/tr>\n<tr><td>배기관·고온부<\/td><td>내열 실리콘<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 도료 종류<\/h5><p>에폭시(내수·내화학, 하도), 폴리우레탄(내후, 상도), 징크 실리케이트(희생방식·숍프라이머), 페놀릭 에폭시(케미컬), SPC 방오(구리, TBT 금지), 오염박리(실리콘), 내열 실리콘, 알키드·아크릴.<\/p>\n<h5>2. 구역별 적용<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구역<\/th><th>도장계<\/th><\/tr><\/thead><tbody>\n<tr><td>선저<\/td><td>에폭시 + 결합층 + 방오<\/td><\/tr>\n<tr><td>수선부<\/td><td>에폭시 + 방오/내마모<\/td><\/tr>\n<tr><td>건현·상부구조<\/td><td>에폭시 + PU<\/td><\/tr>\n<tr><td>노출 갑판<\/td><td>에폭시 + PU, 미끄럼 방지<\/td><\/tr>\n<tr><td>밸러스트탱크<\/td><td>PSPC 에폭시(밝은 색, 320 μm)<\/td><\/tr>\n<tr><td>화물유 탱크<\/td><td>에폭시·페놀릭(COT PSPC)<\/td><\/tr>\n<tr><td>청수탱크<\/td><td>식수 인증 무용제 에폭시<\/td><\/tr>\n<tr><td>벌크 화물창<\/td><td>내마모 에폭시<\/td><\/tr>\n<tr><td>고온부<\/td><td>내열 실리콘<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>3. 결론<\/b>: 도장 수명은 도료보다 표면처리·환경 관리에 좌우되며, 방오도료는 CII와 생물오손 관리까지 연결됨.<\/p><\/div><\/section><\/details>"},{"id":"tank-coating","p":6,"n":"6.16","h":"50,000 DWT 석유제품운반선 화물창 도장 시 단계별 관리 및 주의사항","t":"50,000 DWT 석유제품운반선 화물창 도장 시 단계별 관리 및 주의사항","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 3번 · 25점"],"q":["<b>121회(2020) 2-3<\/b> 50,000 DWT Product carrier 화물창 도장 작업 시 단계별(탑재 전·화물창 형성 후·시운전 후) 관리 및 주의사항"],"k":"제품유 탱크 도장은 화물 오염과 직결되므로 블록 단계에서 대부분을 끝내고, 탑재 후에는 이음부 보수와 탱크 전체 최종 도장을 환경 통제(제습·가열) 아래에서 하며, 시운전 후에는 손상 보수와 청결 확인으로 마무리한다. 핵심 관리 항목은 표면처리 등급, 염분, 환경, 두께, 경화다.","x":"\n<p class=\"key\">제품유 탱크 도장은 화물 오염과 직결되므로 블록 단계에서 대부분을 끝내고, 탑재 후에는 이음부 보수와 탱크 전체 최종 도장을 환경 통제(제습·가열) 아래에서 하며, 시운전 후에는 손상 보수와 청결 확인으로 마무리한다. 핵심 관리 항목은 표면처리 등급, 염분, 환경, 두께, 경화다.<\/p>\n<h4>1. 탑재 전 블록 단계<\/h4>\n<ul>\n<li>표면처리: 블라스팅 Sa 2½, 조도(대략 50~75 μm), 염분·먼지 기준 확인.<\/li>\n<li>강재 처리: 모서리 라운딩(R2 이상), 용접 비드·스패터·날카로운 부분 그라인딩.<\/li>\n<li>환경: 상대습도 85% 이하, 강판 온도 이슬점 +3 °C 이상, 도장 셸터 내 작업.<\/li>\n<li>도장: 스트라이프 코팅(모서리·용접선), 층별 두께 측정, 도료사 지정 재도장 간격 준수.<\/li>\n<li>탑재 이음부 마스킹(용접 열영향 폭만큼 남김), 블록 운반 중 손상 보호.<\/li>\n<\/ul>\n<h4>2. 탑재 후 화물창 형성 단계<\/h4>\n<ul>\n<li>이음부·손상부 2차 표면처리(사양에 따라 Sa 2½ 또는 St 3), 탱크 내 용접 작업 종료 확인(도장 후 화기작업 금지).<\/li>\n<li>제습기·가열기로 탱크 환경 통제, 방폭 조명·환기(용제 증기 폭발·중독 방지), 밀폐공간 안전.<\/li>\n<li>최종 도장: 전체 두께(DFT) 측정, 핀홀·홀리데이 검사, 경화 조건(온도·시간) 준수. 페놀릭 에폭시는 후경화(가열) 요구 여부 확인.<\/li>\n<li>비계 철거 시 손상 보수, 탱크 청소.<\/li>\n<\/ul>\n<h4>3. 시운전 후<\/h4>\n<ul>\n<li>시운전 중 화물펌프·세정기 작동, 진동으로 생긴 손상 확인·보수.<\/li>\n<li>탱크 청결: 잔류물·먼지 제거, 필요 시 벽면 세척 시험(wall wash).<\/li>\n<li>도장 기록(두께, 환경, 사용 도료 로트) 정리, 선주·도료사 공동 최종 검사.<\/li>\n<\/ul>\n<div class=\"pro\"><p>제품유선은 다음 화물로 메탄올·식물성 기름 같은 민감 화물을 실을 수 있어 도막 경화와 청결이 사업성에 직결된다. 시운전 전에 경화가 끝나지 않은 도막에 화물을 넣으면 화물 오염 클레임으로 이어진다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 탑재 전 블록<\/h5><ul><li>Sa 2½, 조도, 염분·먼지 관리<\/li><li>모서리 R2, 비드·스패터 처리<\/li><li>RH ≤ 85%, 강판 이슬점 +3 °C, 셸터 작업<\/li><li>스트라이프 코팅, 층별 두께, 재도장 간격<\/li><li>탑재 이음부 마스킹, 운반 손상 보호<\/li><\/ul>\n<h5>2. 화물창 형성 후<\/h5><ul><li>이음·손상부 2차 처리(Sa 2½ 또는 St 3), 화기작업 종료 확인<\/li><li>제습·가열, 방폭 조명·환기, 밀폐공간 안전<\/li><li>DFT·핀홀·홀리데이 검사, 경화(페놀릭 후경화)<\/li><li>비계 철거 손상 보수, 청소<\/li><\/ul>\n<h5>3. 시운전 후<\/h5><ul><li>펌프·세정기 작동·진동 손상 보수<\/li><li>청결·벽면 세척 시험<\/li><li>도장 기록 정리, 선주·도료사 공동 검사<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 제품유선은 메탄올·식물유 같은 민감 화물을 싣기 때문에 경화와 청결이 사업성과 직결되므로 경화 확인 전 화물 적재를 금지해야 함.<\/p><\/div><\/section><\/details>"},{"id":"shop-primer","p":6,"n":"6.17","h":"숍프라이머(Shop Primer) 도장의 작업순서","t":"숍프라이머(Shop Primer) 도장의 작업순서","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 3교시 2번 · 25점"],"q":["<b>133회(2024) 3-2<\/b> 숍프라이머(Shop Primer) 도장의 작업순서"],"k":"숍프라이머는 강재 입고 직후 블라스팅한 표면에 얇게 바르는 일시 방청 도료로, 가공·조립 기간 동안 녹을 막는다. 용접·절단에 지장이 없도록 얇고(대략 15~25 μm), 이후 본 도장과 호환되어야 한다.","x":"\n<p class=\"key\">숍프라이머는 강재 입고 직후 블라스팅한 표면에 얇게 바르는 일시 방청 도료로, 가공·조립 기간 동안 녹을 막는다. 용접·절단에 지장이 없도록 얇고(대략 15~25 μm), 이후 본 도장과 호환되어야 한다.<\/p>\n<h4>작업순서(자동 라인)<\/h4>\n<ol>\n<li>강재 입고·식별(등급 표시 보존 관리).<\/li>\n<li>예열·건조: 수분 제거, 이슬점 이상 온도 확보.<\/li>\n<li>쇼트 블라스팅: Sa 2½, 조도 관리(본 도장 부착성).<\/li>\n<li>분진 제거(브러시·흡입).<\/li>\n<li>자동 스프레이 도장: 징크 실리케이트 계열, 막 두께 관리.<\/li>\n<li>건조로 통과·경화.<\/li>\n<li>적재·보관 → 절단 공정 투입.<\/li>\n<\/ol>\n<h4>요구 성능<\/h4>\n<ul>\n<li>용접성: 아연 함량·막 두께가 크면 기공·흄 증가 → 저아연 용접형 프라이머.<\/li>\n<li>절단성: 절단 속도 저하 없음.<\/li>\n<li>호환성: PSPC는 숍프라이머가 본 도장계와 사전 인증(호환)되어야 손상 없는 부분을 남길 수 있다.<\/li>\n<li>2차 표면처리: 용접·절단으로 탄 부분, 녹 발생부는 본 도장 전 블라스팅으로 제거.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>강재 입고 직후 블라스팅 표면에 얇게(대략 15~25 μm) 바르는 일시 방청 도료.<\/p>\n<h5>2. 작업순서<\/h5><ol><li>입고·식별(등급 표시 보존)<\/li><li>예열·건조(이슬점 이상)<\/li><li>쇼트 블라스팅 Sa 2½, 조도 관리<\/li><li>분진 제거<\/li><li>자동 스프레이(징크 실리케이트), 두께 관리<\/li><li>건조로 경화<\/li><li>적재 → 절단 투입<\/li><\/ol>\n<h5>3. 요구 성능<\/h5><p>용접성(저아연·박막), 절단성, 본 도장 호환성(PSPC 사전 인증), 탄·녹 부위는 2차 블라스팅.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 숍프라이머 품질이 이후 모든 도장의 부착 기반이므로 두께·조도 관리가 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"pspc","p":6,"n":"6.18","h":"IMO PSPC(보호도장성능기준)의 주요 규정과 단계별 품질관리 핵심 점검항목","t":"IMO PSPC(보호도장성능기준)의 주요 규정과 단계별 품질관리 핵심 점검항목","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 2교시 4번 · 25점"],"q":["<b>139회(2026) 2-4<\/b> IMO PSPC의 주요 규정과 단계별 품질관리 핵심 점검항목"],"k":"PSPC(MSC.215(82), SOLAS II-1/3-2)는 500 GT 이상 모든 선박의 전용 해수 밸러스트탱크와 길이 150 m 이상 벌크선의 이중선측 공간에 목표 수명 15년(GOOD 상태 유지)의 도장을 강제한다. 도장계 사전 승인, 표면처리·환경·두께 기준, 검사관 자격, 도장 기술 파일(CTF)이 핵심이다.","x":"\n<p class=\"key\">PSPC(MSC.215(82), SOLAS II-1/3-2)는 500 GT 이상 모든 선박의 전용 해수 밸러스트탱크와 길이 150 m 이상 벌크선의 이중선측 공간에 목표 수명 15년(GOOD 상태 유지)의 도장을 강제한다. 도장계 사전 승인, 표면처리·환경·두께 기준, 검사관 자격, 도장 기술 파일(CTF)이 핵심이다.<\/p>\n<h4>주요 규정<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>요구<\/th><\/tr><\/thead><tbody>\n<tr><td>도장계<\/td><td>형식 승인된 에폭시계 다층, 상도는 밝은 색(검사 용이)<\/td><\/tr>\n<tr><td>막 두께<\/td><td>공칭 건조막 두께(NDFT) 320 μm, 90/10 규칙(측정점 90%가 NDFT 이상, 나머지 10%도 0.9×NDFT 이상), 최대 두께는 도료사 기준<\/td><\/tr>\n<tr><td>도장 회수<\/td><td>스프레이 2회 + 스트라이프 코트 2회(용접선 두 번째 스트라이프는 조건부 축소 가능)<\/td><\/tr>\n<tr><td>1차 표면처리<\/td><td>Sa 2½, 조도 30~75 μm, 수용성 염분 50 mg/m² NaCl 이하, 숍프라이머는 징크 실리케이트 또는 동등·호환 승인품<\/td><\/tr>\n<tr><td>강재 처리<\/td><td>모서리 R2 mm 이상 라운딩(또는 3회 그라인딩), 용접 비드·스패터·날카로운 부분 처리(ISO 8501-3 P2 등급)<\/td><\/tr>\n<tr><td>2차 표면처리<\/td><td>탑재 이음·손상부·용접부 Sa 2½. 작은 면적은 St 3 허용<\/td><\/tr>\n<tr><td>환경<\/td><td>상대습도 85% 이하, 강판 온도 이슬점 +3 °C 이상<\/td><\/tr>\n<tr><td>먼지<\/td><td>먼지 크기 등급 3·4·5의 양 등급 1 이하<\/td><\/tr>\n<tr><td>검사<\/td><td>자격 있는 도장 검사관(NACE Level 2, FROSIO Level III 등), 단계별 검사 기록<\/td><\/tr>\n<tr><td>CTF<\/td><td>도장 기술 파일: 사양, 검사 기록, 보수 기록 — 선박 수명 동안 보관<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>단계별 핵심 점검항목<\/h4>\n<ol>\n<li><b>강재·숍프라이머<\/b>: 블라스팅 등급, 조도, 염분, 숍프라이머 두께와 호환 인증.<\/li>\n<li><b>강재 처리(블록)<\/b>: 모서리 R2, 용접 비드·스패터, 라미네이션.<\/li>\n<li><b>2차 표면처리<\/b>: 손상부 등급, 먼지·염분, 탑재 이음부 처리.<\/li>\n<li><b>도장 중<\/b>: 환경 기록(습도·온도·이슬점, 하루 수회), 혼합비·가사시간, 습막 두께, 재도장 간격.<\/li>\n<li><b>도장 후<\/b>: 건조막 두께 측정(90/10), 외관 결함(핀홀, 흘러내림, 미도장), 보수 확인.<\/li>\n<li><b>문서<\/b>: 일일 검사 기록, 부적합·보수 기록 → CTF 등록, 조선소·선주·도료사 3자 합의(검사 계획).<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>MSC.215(82)(SOLAS II-1/3-2): 500 GT 이상 전용 밸러스트탱크, 150 m 이상 벌크선 이중선측 공간, 목표 수명 15년.<\/p>\n<h5>2. 주요 규정<\/h5><div class=\"calc\">에폭시 다층, 밝은 상도 / NDFT 320 μm, 90/10 규칙\n스프레이 2회 + 스트라이프 2회\nSa 2½, 조도 30~75 μm, 염분 ≤ 50 mg/m² NaCl\n모서리 R2 이상, 용접부 ISO 8501-3 P2\nRH ≤ 85%, 강판 이슬점 +3 °C, 먼지 등급 ≤ 1\n자격 검사관(NACE L2, FROSIO L3), CTF 보관<\/div>\n<h5>3. 단계별 점검<\/h5><ol><li>강재·숍프라이머: 블라스팅·조도·염분·호환 인증<\/li><li>강재 처리: R2, 비드·스패터, 라미네이션<\/li><li>2차 처리: 손상부 등급, 먼지·염분<\/li><li>도장 중: 환경 기록, 혼합비·가사시간, 습막, 재도장 간격<\/li><li>도장 후: DFT(90/10), 외관 결함, 보수<\/li><li>문서: 일일 기록, NCR → CTF, 3자 합의<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: PSPC 비용의 대부분은 강재 처리·2차 처리 공수이므로, 블록 단계 완전 도장과 탑재 이음 최소화가 생산성 대책임.<\/p><\/div><\/section><\/details>"},{"id":"corrosion-protection","p":6,"n":"6.19","h":"선박 방식장치의 종류와 장단점 (외부전원방식 ICCP 포함)","t":"선박 방식장치의 종류와 장단점 (외부전원방식 ICCP 포함)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 6번 · 10점","136회 1교시 5번 · 10점"],"q":["<b>112회(2017) 1-6<\/b> 외부전원방식법(ICCP, Impressed Current Cathodic Protection)","<b>136회(2025) 1-5<\/b> 선박 방식장치의 종류와 장단점"],"k":"선체 외판 방식은 도막(차단)과 음극방식(전기화학)으로 한다. 음극방식은 강판 전위를 보호전위(대략 −0.80 V vs Ag/AgCl) 이하로 낮춰 부식 반응을 멈추게 하며, 아연·알루미늄 희생양극 방식과 외부 전원으로 전류를 공급하는 ICCP 방식이 있다.","x":"\n<p class=\"key\">선체 외판 방식은 도막(차단)과 음극방식(전기화학)으로 한다. 음극방식은 강판 전위를 보호전위(대략 −0.80 V vs Ag/AgCl) 이하로 낮춰 부식 반응을 멈추게 하며, 아연·알루미늄 희생양극 방식과 외부 전원으로 전류를 공급하는 ICCP 방식이 있다.<\/p>\n<h4>음극방식 원리<\/h4>\n<p>부식은 강(양극)에서 전자가 빠져나가는 반응이다. 외부에서 전자를 공급해 강 전체를 음극으로 만들면 부식이 억제된다. 과방식(대략 −1.05 V보다 낮음)은 수소 발생으로 도막 박리와 고강도강 수소취화를 일으킨다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>원리<\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>희생양극(아연, Al-Zn-In)<\/td><td>강보다 비(卑)한 금속이 대신 부식되며 전류 공급<\/td><td>전원 불필요, 단순, 과방식 위험 적음, 탱크 내부 사용 가능<\/td><td>소모·교체(도킹 시), 중량·저항 증가, 전류 조절 불가<\/td><\/tr>\n<tr><td>ICCP(외부전원)<\/td><td>정류기가 불용성 양극(MMO, Pt-Ti)으로 전류 공급, 기준전극으로 전위 자동 제어<\/td><td>출력 조절(도막 열화·속력·수온 변화 대응), 장수명, 경량<\/td><td>전원·제어 고장 시 무방식, 과방식 위험, 양극 주위 유전체 차폐 필요, 초기비<\/td><\/tr>\n<tr><td>도막<\/td><td>환경 차단<\/td><td>모든 구역 기본<\/td><td>손상부 국부 부식 → 음극방식 병용<\/td><\/tr>\n<tr><td>재료 선정<\/td><td>내식 재료(스테인리스, Cu-Ni 해수관)<\/td><td>유지보수 감소<\/td><td>이종금속 갈바닉 부식 관리<\/td><\/tr>\n<tr><td>축 접지(shaft grounding)<\/td><td>슬립링으로 축-선체 전기 연결<\/td><td>프로펠러·베어링 전식 방지, 방식 전류 경로 확보<\/td><td>브러시 정비<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>해수 흡입구·냉각계의 해양생물 부착 방지는 MGPS(동·알루미늄 전극)로 별도 처리한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-1-6<\/td><td>외부전원방식(ICCP)<\/td><td>구성·원리·장단점<\/td><\/tr>\n<tr><td class=\"num\">136-1-5<\/td><td>방식장치 종류와 장단점<\/td><td>희생양극 vs ICCP 비교<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 112회형(ICCP)\">\n<h5>1. 정의<\/h5><p>정류기가 불용성 양극(MMO, Pt-Ti)으로 방식 전류를 공급해 선체 전위를 보호전위로 유지하는 음극방식.<\/p>\n<h5>2. 구성·원리<\/h5><p>정류기 + 양극 + 기준전극(Zn 또는 Ag/AgCl) + 제어반. 기준전극 전위를 감시해 전류 자동 조절(강 보호전위 대략 −0.80 V vs Ag/AgCl, 과방식 −1.05 V 이하 회피).<\/p>\n<h5>3. 장단점<\/h5><ul><li>장점: 도막 열화·속력·수온 변화에 출력 대응, 장수명, 경량<\/li><li>단점: 전원·제어 고장 시 무방식, 과방식(도막 박리·수소취화), 양극 주위 유전체 차폐<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 희생양극과 달리 출력 조절이 가능하나, 축 접지와 함께 설계해야 프로펠러·베어링 전식을 막음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"sea-trials","p":7,"n":"7.1","h":"시운전의 목적과 종류, 속력·조종성능 관련 시운전 항목","t":"시운전의 목적과 종류, 속력·조종성능 관련 시운전 항목","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 4교시 5번 · 25점","130회 2교시 2번 · 25점"],"q":["<b>118회(2019) 4-5<\/b> 시운전의 목적 및 종류","<b>130회(2023) 2-2<\/b> 일반상선의 속력 및 조종성능 관련 시운전 항목"],"k":"시운전은 건조된 선박이 계약 성능(속력·연비), 협약·선급 요건(조종성, 조타기, 양묘기, 소음·진동), 기관·설비의 기능을 실제로 만족하는지 해상에서 확인하는 최종 검증이다. 결과는 인도 여부와 보증 판정의 근거가 된다.","x":"\n<p class=\"key\">시운전은 건조된 선박이 계약 성능(속력·연비), 협약·선급 요건(조종성, 조타기, 양묘기, 소음·진동), 기관·설비의 기능을 실제로 만족하는지 해상에서 확인하는 최종 검증이다. 결과는 인도 여부와 보증 판정의 근거가 된다.<\/p>\n<h4>목적<\/h4>\n<ul>\n<li>계약 보증 확인: 서비스 속력, 연료소비율, 재화중량(별도 계측).<\/li>\n<li>규정 확인: SOLAS(조타기, 조종성 정보), IMO 조종성 기준, 소음 코드, 선급 기관 요건.<\/li>\n<li>설비 기능·신뢰성 확인, 조정(튜닝), 승무원 인수.<\/li>\n<\/ul>\n<h4>종류<\/h4>\n<ul>\n<li>계류 시운전(dock/mooring trial): 안벽에서 기관·보기·전기·의장 기능 시험.<\/li>\n<li>예비(builder's) 시운전과 공식(official/acceptance) 시운전: 선주·선급 입회. 실무에서는 함께 진행하는 경우가 많다.<\/li>\n<li>가스 시운전(LNG선), 화물 시운전, 보증 후 성능 확인.<\/li>\n<\/ul>\n<h4>속력 관련 항목<\/h4>\n<ul>\n<li><b>속력 시험<\/b>: 측정 구간을 왕복(double run)으로 여러 출력 단계에서 실시, 축동력·회전수·속력(GNSS) 동시 계측. ISO 15016:2015 / ITTC 절차로 바람·파도·조류·수온·수심·흘수를 보정해 계약 조건 속력 산출.<\/li>\n<li><b>내구 시험<\/b>: 상용·최대 출력 연속 운전, 기관 상태량 기록.<\/li>\n<li><b>연료소비 시험<\/b>, 축계 비틀림 진동 계측, 소음·진동 계측.<\/li>\n<\/ul>\n<h4>조종성능 관련 항목<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시험<\/th><th>내용<\/th><th>IMO 기준(MSC.137(76))<\/th><\/tr><\/thead><tbody>\n<tr><td>선회 시험<\/td><td>좌·우 최대 타각 35°로 선회, 전진거리·전술직경 계측<\/td><td>전진거리 ≤ 4.5L, 전술직경 ≤ 5L<\/td><\/tr>\n<tr><td>Z 시험 10°/10°, 20°/20°<\/td><td>침로 변화와 overshoot 각<\/td><td>1차 overshoot 10/10: L/V에 따라 10~20°, 20/20: ≤ 25°<\/td><\/tr>\n<tr><td>초기 선회성<\/td><td>타각 10° 후 침로 10° 변경 시 진출 거리<\/td><td>≤ 2.5L<\/td><\/tr>\n<tr><td>정지 시험(crash stop)<\/td><td>전속 전진 중 전속 후진, 정지 거리<\/td><td>≤ 15L(대형선은 주관청 판단으로 완화)<\/td><\/tr>\n<tr><td>나선(spiral) 시험<\/td><td>침로 안정성(필요 시)<\/td><td>-<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>그 밖에 조타기 시험, 양묘기·투묘 시험, 비상 발전기·정전 복구, 항해장비 교정, 기관 원격 제어, 경보 시험이 포함된다. 조종성 결과는 선교 조종성 정보(wheelhouse poster, pilot card)로 작성한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-4-5<\/td><td>시운전 목적 및 종류<\/td><td>목적 3축 + 종류<\/td><\/tr>\n<tr><td class=\"num\">130-2-2<\/td><td>속력·조종성능 시운전 항목<\/td><td>IMO 조종성 기준 수치 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 130회형\">\n<h5>1. 목적·종류<\/h5><p>계약 성능·규정·설비 기능 검증. 계류 시운전 → 예비·공식 해상시운전 → 가스·화물 시운전.<\/p>\n<h5>2. 속력 관련<\/h5><ul><li>속력시험: 왕복 측정, 여러 출력 단계, 축동력·회전수·GNSS 속력, ISO 15016 보정<\/li><li>내구시험, 연료소비, 비틀림진동·소음·진동 계측<\/li><\/ul>\n<h5>3. 조종성 관련(IMO MSC.137(76))<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시험<\/th><th>기준<\/th><\/tr><\/thead><tbody>\n<tr><td>선회(35°)<\/td><td>전진거리 ≤ 4.5L, 전술직경 ≤ 5L<\/td><\/tr>\n<tr><td>초기 선회<\/td><td>10° 타·10° 변침 진출 ≤ 2.5L<\/td><\/tr>\n<tr><td>Z 10°/10°<\/td><td>1차 overshoot L/V에 따라 10~20°<\/td><\/tr>\n<tr><td>Z 20°/20°<\/td><td>1차 overshoot ≤ 25°<\/td><\/tr>\n<tr><td>정지(crash stop)<\/td><td>정지 거리 ≤ 15L<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 기타<\/h5><p>조타기(35°→30° 28초), 양묘기, 비상발전기·정전 복구, 항해장비 교정 → 결과로 조종성 정보(wheelhouse poster) 작성.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 만재 상태 시험이 어려우면 시운전 조건 결과를 예측 방법으로 만재 상태로 환산해 기준 만족을 입증해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"trial-law","p":7,"n":"7.2","h":"해상시운전의 정의와 시운전금지해역에서 금지되는 시운전 5가지","t":"해상시운전의 정의와 시운전금지해역에서 금지되는 시운전 5가지","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 4교시 1번 · 25점"],"q":["<b>121회(2020) 4-1<\/b> 해상시운전의 정의, 시운전금지해역에서 금지되는 시운전 5가지"],"k":"해상시운전은 신조·개조·수리한 선박의 운항·조종·기관 성능과 설비 작동 상태를 확인하기 위해 해상에서 실제로 운항해 보는 시험이다. 해상교통안전법(2024년 1월 해사안전법에서 분법) 제12조와 같은 법 시행규칙 제11조는 시운전금지해역에서 다른 선박의 안전을 해칠 수 있는 아래 5가지 시운전을 금지한다.","x":"\n<p class=\"key\">해상시운전은 신조·개조·수리한 선박의 운항·조종·기관 성능과 설비 작동 상태를 확인하기 위해 해상에서 실제로 운항해 보는 시험이다. 해상교통안전법(2024년 1월 해사안전법에서 분법) 제12조와 같은 법 시행규칙 제11조는 시운전금지해역에서 다른 선박의 안전을 해칠 수 있는 아래 5가지 시운전을 금지한다.<\/p>\n<h4>시운전금지해역에서 금지되는 시운전 (해상교통안전법 시행규칙 제11조)<\/h4>\n<ol>\n<li>선박의 선회권(旋回圈) 등 선회 성능을 확인하기 위한 시운전<\/li>\n<li>선박의 침로를 좌우로 바꾸며 지그재그로 항해하는 등 선박의 운항 성능을 확인하기 위한 시운전<\/li>\n<li>전속력 또는 후진으로 항해하거나 급정지하는 등 선박의 기관 성능을 확인하기 위한 시운전<\/li>\n<li>비상 조타 기능 등 선박의 조타 성능을 확인하기 위한 시운전<\/li>\n<li>그 밖에 선박의 침로나 속력의 급격한 변경 등으로 인하여 다른 선박의 항행안전을 저해할 우려가 있는 시운전<\/li>\n<\/ol>\n<h4>의미<\/h4>\n<p>시운전 중인 선박은 갑작스런 선회·정지·지그재그 기동을 하므로 교통량이 많은 항로 부근에서 충돌 위험이 크다. 그래서 금지해역을 정하고, 조선소는 시운전 해역(공해 측 시운전 구역) 계획과 항행경보, 관제 통보로 안전을 확보한다. 이 조항 목록은 3년마다 타당성을 재검토한다(같은 규칙 제71조).<\/p>\n<div class=\"tip\"><p>121회 출제 당시 근거 법령은 해사안전법 시행규칙이었다. 2024년 1월 26일 해사안전기본법과 해상교통안전법으로 나뉘었으므로, 답안에 \"해상교통안전법(구 해사안전법)\"으로 쓰면 최신성이 드러난다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 해상시운전의 정의<\/h5><p>신조·개조·수리 선박의 운항·조종·기관 성능과 설비 작동 상태를 확인하기 위해 해상에서 실제로 운항해 보는 시험.<\/p>\n<h5>2. 근거<\/h5><p>해상교통안전법(2024.1 해사안전법에서 분법) 제12조, 같은 법 시행규칙 제11조.<\/p>\n<h5>3. 시운전금지해역에서 금지되는 시운전 5가지<\/h5><ol><li>선회권 등 선회 성능 확인 시운전<\/li><li>침로를 좌우로 바꾸며 지그재그로 항해하는 등 운항 성능 확인 시운전<\/li><li>전속력·후진 항해·급정지 등 기관 성능 확인 시운전<\/li><li>비상 조타 기능 등 조타 성능 확인 시운전<\/li><li>그 밖에 침로·속력의 급격한 변경으로 다른 선박 항행안전을 저해할 우려가 있는 시운전<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 급격한 기동 시험은 교통량이 많은 해역에서 충돌 위험이 크므로, 조선소는 시운전 해역 계획·항행경보·관제 통보로 안전을 확보해야 함.<\/p><\/div><\/section><\/details>"},{"id":"power-measurement","p":7,"n":"7.3","h":"디젤엔진 선박 시운전 시 주기관 동력 측정방법","t":"디젤엔진 선박 시운전 시 주기관 동력 측정방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 2번 · 25점"],"q":["<b>124회(2021) 3-2<\/b> 디젤엔진 선박 시운전 시 주기관 동력 측정방법"],"k":"시운전 동력은 중간축 비틀림을 재는 토크미터로 축동력 P = 2πnQ를 직접 계측하는 것이 표준이다. 기관 지압선도(실린더 압력)로 도시마력을, 공장시험 자료와 연료펌프 지표로 제동마력을 보조 추정해 교차 확인한다.","x":"\n<p class=\"key\">시운전 동력은 중간축 비틀림을 재는 토크미터로 축동력 P = 2πnQ를 직접 계측하는 것이 표준이다. 기관 지압선도(실린더 압력)로 도시마력을, 공장시험 자료와 연료펌프 지표로 제동마력을 보조 추정해 교차 확인한다.<\/p>\n<h4>1. 토크미터(축동력)<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[Q=\\dfrac{G\\,J\\,\\theta}{L}=\\dfrac{G\\,J\\,(2\\varepsilon_{45^\\circ})}{r},\\qquad P_S=2\\pi\\,n\\,Q\\]<\/div><span class=\"c\">G: 축 재료의 전단탄성계수(약 80~83 GPa), J: 극관성모멘트, ε<sub>45°<\/sub>: 축 표면 45° 방향 변형률(스트레인게이지 브리지)<\/span><\/div>\n<ul>\n<li>스트레인게이지식: 중간축에 45° 방향 풀브리지 부착, 텔레메트리로 신호 전송. 가장 일반적.<\/li>\n<li>광학·위상차식: 축 두 지점의 회전 위상차로 비틀림각 측정(상설 장착형).<\/li>\n<li>정확도 핵심: G 값(재료 시험값 사용 권장), 영점 조정(정지 상태 정·역회전 터닝으로 영점), 온도 보상. ISO 15016은 축동력 직접 계측을 요구한다.<\/li>\n<\/ul>\n<h4>2. 지압선도(도시마력)<\/h4>\n<div class=\"eq\"><div class=\"eql\">2행정 기관<\/div><div class=\"mj\">\\[P_i=p_{mi}\\,A\\,S\\,n\\,i,\\qquad P_B=P_i\\,\\eta_m\\]<\/div><\/div>\n<p>전자식 실린더 압력 계측(PMI 등)으로 평균유효압 산출. 기계효율 가정이 들어가 정밀도는 토크미터보다 낮다. 실린더별 연소 균형 점검에 유용.<\/p>\n<h4>3. 공장시험 자료 활용<\/h4>\n<ul>\n<li>제작사 공장시험(수동력계)에서 얻은 출력-연료지표(fuel index)·과급기 회전수·소기압 관계로 해상 출력 추정.<\/li>\n<li>연료 유량계와 공장시험 연료소비율로 역산.<\/li>\n<\/ul>\n<h4>4. 전기추진선<\/h4>\n<p>추진 전동기 입력 전력 × 효율, 또는 축 토크미터.<\/p>\n<div class=\"pro\"><p>속력 보증 판정에서 동력 1%의 오차는 속력 약 0.3%에 해당한다. 그래서 토크미터의 G 값과 영점 관리가 계약 분쟁을 막는 실무 포인트다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 토크미터(표준)<\/h5><div class=\"calc\">Q = G·J·θ/L = G·J·(2ε_45°)/r,  P_S = 2π·n·Q\nG ≈ 80~83 GPa(재료 시험값 권장), 영점: 정지 상태 정·역 터닝<\/div><p>스트레인게이지 풀브리지 + 텔레메트리, 또는 광학 위상차식. ISO 15016은 축동력 직접 계측 요구.<\/p>\n<h5>2. 지압선도(도시마력)<\/h5><div class=\"calc\">P_i = p_mi·A·S·n·i (2행정),  P_B = P_i·η_m<\/div><p>실린더 압력 계측, 기계효율 가정 → 보조 수단·연소 균형 점검.<\/p>\n<h5>3. 공장시험 자료<\/h5><p>수동력계 시험의 출력-연료지표·과급기 회전수·소기압 관계, 연료 유량계 역산.<\/p>\n<h5>4. 전기추진<\/h5><p>추진 전동기 입력 × 효율 또는 축 토크미터.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 동력 1% 오차는 속력 약 0.3%에 해당하므로 토크미터 G값·영점 관리가 보증 판정의 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"tightness-tests","p":7,"n":"7.4","h":"탱크·선체 기밀시험: Tank Air Test, Hose Test, Leak Test, 수기압(Hydropneumatic) Test","t":"탱크·선체 기밀시험: Tank Air Test, Hose Test, Leak Test, 수기압(Hydropneumatic) Test","c":5,"r":4,"b":[{"c":"hot","t":"5회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 8번 · 10점","130회 1교시 9번 · 10점","133회 1교시 11번 · 10점","133회 2교시 6번 · 25점","139회 1교시 8번 · 10점"],"q":["<b>124회(2021) 1-8<\/b> Tank Air Test","<b>130회(2023) 1-9<\/b> 수기압 테스트(Hydropneumatic Test)","<b>133회(2024) 1-11<\/b> Hose test","<b>133회(2024) 2-6<\/b> 선박 탱크 에어테스트와 테스트 절차","<b>139회(2026) 1-8<\/b> 선체의 누설시험(Leak Test)"],"k":"IACS UR S14는 탱크와 수밀·풍우밀 경계의 시험을 구조시험(structural test: 수압·수기압)과 누설시험(leak test: 공기, 압축공기 필릿, 진공상자, 초음파, 침투)으로 나눈다. 구조시험은 구조가 설계 수두를 견디는지, 누설시험은 용접 경계가 새지 않는지 확인한다. 호스시험은 수압·공기시험을 할 수 없는 개구 폐쇄장치의 수밀·풍우밀성을 확인한다.","x":"\n<p class=\"key\">IACS UR S14는 탱크와 수밀·풍우밀 경계의 시험을 구조시험(structural test: 수압·수기압)과 누설시험(leak test: 공기, 압축공기 필릿, 진공상자, 초음파, 침투)으로 나눈다. 구조시험은 구조가 설계 수두를 견디는지, 누설시험은 용접 경계가 새지 않는지 확인한다. 호스시험은 수압·공기시험을 할 수 없는 개구 폐쇄장치의 수밀·풍우밀성을 확인한다.<\/p>\n<h4>시험 종류<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시험<\/th><th>방법<\/th><th>목적·대상<\/th><\/tr><\/thead><tbody>\n<tr><td>수압시험(hydrostatic)<\/td><td>탱크에 물을 채워 설계 시험수두 가압<\/td><td>구조시험. 대표 탱크(동형선 첫 척의 탱크 형식별)<\/td><\/tr>\n<tr><td>수기압시험(hydropneumatic)<\/td><td>탱크를 일부 물로 채우고 상부에 공기압을 더해 시험수두와 같은 압력 재현<\/td><td>구조시험. 물을 끝까지 채우기 곤란한 대형 탱크·시험 기간 단축<\/td><\/tr>\n<tr><td>공기시험(air test)<\/td><td>탱크 내부 공기 가압 후 용접부에 비눗물 도포, 기포 확인<\/td><td>누설시험. 대부분의 탱크<\/td><\/tr>\n<tr><td>압축공기 필릿 시험<\/td><td>양측 연속 필릿 사이 공간에 공기 주입<\/td><td>필릿 이음 누설<\/td><\/tr>\n<tr><td>진공상자 시험<\/td><td>투명 상자로 국부 진공(대략 0.20~0.26 bar 부압), 기포 확인<\/td><td>접근이 한쪽만 가능한 용접부<\/td><\/tr>\n<tr><td>호스시험(hose test)<\/td><td>노즐 지름 12 mm 이상, 노즐 압력 2 bar 이상의 물줄기를 1.5 m 이내 거리에서 분사<\/td><td>해치커버, 수밀문, 창, 관통부 등 개구 폐쇄장치<\/td><\/tr>\n<tr><td>초음파·침투 누설시험<\/td><td>초음파 발신기와 수신기로 누설 경로 탐지 / 침투액<\/td><td>호스시험 대체, 특수 부위<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>시험 수두<\/h4>\n<p>구조시험 수두는 다음 중 큰 값: 오버플로관 상단, 탱크 정부 + 2.4 m, 탱크 정부 + 안전밸브(PV) 설정압. 화물창 겸 밸러스트 창은 해치코밍 상단.<\/p>\n<h4>Tank Air Test 절차<\/h4>\n<ol>\n<li><b>준비<\/b>: 탱크 내 구조 작업 완료(이후 화기작업 금지), 용접부 도장 전(누설 확인), 모든 개구 폐쇄·맹판, 압력계와 U자관 수주계(물) 설치, 과압 방지 안전장치(릴리프) 설정.<\/li>\n<li><b>가압<\/b>: 천천히 가압해 0.20 bar로 약 1시간 유지(온도·압력 안정).<\/li>\n<li><b>시험압<\/b>: 0.15 bar로 낮춘 뒤 유지 확인.<\/li>\n<li><b>검사<\/b>: 탱크 경계의 모든 용접선·관통부·맨홀에 비눗물 도포, 기포 확인. 선급·선주 입회.<\/li>\n<li><b>보수<\/b>: 누설부 표시 → 감압 → 가우징·재용접 → 재시험.<\/li>\n<li><b>종료<\/b>: 서서히 감압, 기록(압력, 시간, 결과) 작성.<\/li>\n<\/ol>\n<div class=\"warn\"><p>공기시험은 압축 에너지가 커서 과압 시 탱크 경계가 파열할 수 있다. U자관 수주계로 압력을 눈으로 확인하고, 시험 중 큰 평판 근처 인원 접근을 통제한다. 공기압은 수압보다 낮게 설정되므로 구조 강도 확인이 아니라 누설 확인용이다.<\/p><\/div>\n<h4>Leak Test(누설시험) 개념<\/h4>\n<p>139회 \"선체의 누설시험\"은 위 누설시험 전체를 묻는다. 목적(수밀성 확인), 방법별 원리, 시험 시기(도장 전, 구조 작업 완료 후), 시험 압력, 합격 기준(기포·누수 없음)을 표로 정리해 쓴다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 5회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-1-8<\/td><td>Tank Air Test<\/td><td class=\"
