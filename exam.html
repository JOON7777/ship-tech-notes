<script>
(function(){
  var me=location.pathname.indexOf('exam.html')>=0?'exam':'edu', pref='edu';
  try{pref=String(localStorage.getItem('app-view')||'edu').replace(/"/g,'');}catch(e){}
  if(pref!=='exam') pref='edu';
  if(pref!==me && !/[?&]stay/.test(location.search)) location.replace((pref==='exam'?'exam.html':'index.html')+(location.hash||''));
  window.__bip=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault(); window.__bip=e; document.dispatchEvent(new Event('bip'));});
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선기술사 기출 교본</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

};

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
/* Layout: a technical handbook. Fixed contents rail on the left (drawer on phones), one reading column.
   Palette borrowed from a hull drawing: blueprint ink, paper, and antifouling red for exam marks. */
:root{
  --paper:#f4f5f2; --sheet:#ffffff; --ink:#121a23; --ink2:#2b3540; --muted:#55606b; --rule:#d6dad3; --rule2:#e6e9e3;
  --navy:#1b4b77; --navy-bg:#e5edf5; --red:#ad3524; --red-bg:#f8e8e4; --green:#2a6649; --green-bg:#e4efe8;
  --amber:#875700; --amber-bg:#f7eedb; --code:#f0f2ee; --eqbg:#f7f9fb;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --rail:308px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1419; --sheet:#161c23; --ink:#e8edf2; --ink2:#c9d1d9; --muted:#9ca8b3; --rule:#2c353f; --rule2:#222a33;
  --navy:#8bbbe8; --navy-bg:#1a2735; --red:#ef8370; --red-bg:#2f1d1a; --green:#80c7a1; --green-bg:#16271f;
  --amber:#e3b660; --amber-bg:#2a2314; --code:#1c232b; --eqbg:#18202a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1419; --sheet:#161c23; --ink:#e8edf2; --ink2:#c9d1d9; --muted:#9ca8b3; --rule:#2c353f; --rule2:#222a33;
  --navy:#8bbbe8; --navy-bg:#1a2735; --red:#ef8370; --red-bg:#2f1d1a; --green:#80c7a1; --green-bg:#16271f;
  --amber:#e3b660; --amber-bg:#2a2314; --code:#1c232b; --eqbg:#18202a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(16px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:17px;line-height:1.85;letter-spacing:-.003em;
  margin:0;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;font-feature-settings:"tnum" 0}
a{color:var(--navy);text-underline-offset:2px}
b,strong{font-weight:600;color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* rail */
.rail{position:fixed;top:0;bottom:0;left:0;width:var(--rail);background:var(--sheet);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.rail .brand{padding:18px 18px 10px;border-bottom:1px solid var(--rule2)}
.rail .brand b{display:block;font-size:18px;letter-spacing:-.01em}
.rail .brand span{font:500 11.5px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rail .prog{margin-top:8px;height:6px;border-radius:3px;background:var(--rule2);overflow:hidden}
.rail .prog i{display:block;height:100%;width:0;background:var(--green);border-radius:3px}
.rail .progt{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:4px}
.rail .search{padding:10px 14px;border-bottom:1px solid var(--rule2)}
.rail input{width:100%;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.rail .hits{font:12px var(--f-mono);color:var(--muted);margin-top:4px;min-height:1em}
.toc{list-style:none;margin:0;padding:8px 6px 40px;overflow-y:auto;flex:1;font-size:14px;line-height:1.45}
.toc ol{list-style:none;margin:2px 0 8px;padding:0}
.toc a{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:5px;color:var(--ink);text-decoration:none}
.toc a:hover{background:var(--paper)}
.toc .tp>a{font-weight:600;margin-top:6px}
.toc .tp>ol a{color:var(--muted);padding-left:14px}
.toc .tp>ol a:hover{color:var(--ink)}
.toc .n{font:500 11.5px var(--f-mono);color:var(--muted);min-width:2.6em;flex:none}
.toc i{font:normal 600 10.5px var(--f-mono);margin-left:auto;padding:0 6px;border-radius:8px;background:var(--navy-bg);color:var(--navy);flex:none}
.toc i.hot{background:var(--red-bg);color:var(--red)}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--rule);flex:none;align-self:center}
.sd.s1{border-color:var(--amber);background:var(--amber-bg)}
.sd.s2{border-color:var(--navy);background:var(--navy)}
.sd.s3{border-color:var(--green);background:var(--green)}
.toc li.hide{display:none}
.toc a.on{background:var(--navy-bg);color:var(--ink)}
.menu{display:none}

/* main */
main{margin-left:var(--rail);padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:800px;margin:0 auto}
.cover{padding:44px 0 32px;border-bottom:2px solid var(--ink);margin-bottom:28px}
.cover .kicker{font:600 12.5px var(--f-mono);letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.cover h1{font-size:clamp(32px,5.4vw,50px);line-height:1.18;margin:10px 0 14px;letter-spacing:-.025em;text-wrap:balance;font-weight:700}
.cover p.sub{font-size:18px;color:var(--ink2);margin:0;max-width:40em;line-height:1.75}
.cover .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font:500 13.5px var(--f-mono);color:var(--muted)}
.cover .facts b{color:var(--ink);font-family:var(--f-sans);font-size:15px}
h2{font-size:30px;line-height:1.3;margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
.part{margin-top:72px}
.parthead{border-top:3px solid var(--navy);padding-top:14px;margin-bottom:28px}
.parthead .pno{font:600 12.5px var(--f-mono);letter-spacing:.14em;color:var(--navy)}
.parthead .eng{margin:2px 0 0;font:13.5px var(--f-mono);color:var(--muted)}
.parthead .pmeta{margin:6px 0 0;font-size:14px;color:var(--muted)}
.intro h3{font-size:22px;margin:36px 0 10px;letter-spacing:-.01em}
.intro h4{font-size:18.5px;margin:28px 0 8px}
article.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px 34px 24px;margin:0 0 26px}
.qh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.qn{font:600 14px var(--f-mono);color:var(--navy);flex:none}
article.q h3{font-size:23px;line-height:1.4;margin:0;letter-spacing:-.015em;text-wrap:balance;font-weight:700;flex:1 1 300px}
.stbtn{margin-left:auto;font:600 12px var(--f-mono);padding:4px 10px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer;white-space:nowrap}
.stbtn.s1{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.stbtn.s2{border-color:var(--navy);color:var(--navy);background:var(--navy-bg)}
.stbtn.s3{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.reads{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 0;font:500 12.5px var(--f-mono);color:var(--muted)}
.reads .rl{margin-right:2px;letter-spacing:.04em}
.rbox{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);font:600 12px var(--f-mono);color:var(--muted);cursor:pointer;transition:background .12s}
.rbox:hover{border-color:var(--green)}
.rbox[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--sheet)}
.rbox:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.reads .rcnt{margin-left:4px}
.reads .rcnt.full{color:var(--green);font-weight:600}
.toc a .tt{flex:1 1 auto}
.toc .rc{font:600 10.5px var(--f-mono);color:var(--green);flex:none;align-self:center}
.src{margin:12px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.freq{font:500 12px/1.3 var(--f-mono);padding:3px 8px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.c25{border-color:var(--navy);color:var(--navy)}
.freq{background:var(--navy-bg);border-color:transparent;color:var(--navy);font-weight:600}
.freq.hot{background:var(--red);color:#fff}
.freq.pred{background:var(--amber-bg);color:var(--amber)}
.src details{margin-top:8px;font-size:14.5px;color:var(--ink2)}
.src summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.src ul{margin:6px 0 0;padding-left:18px}
.src li b{font:600 12.5px var(--f-mono);color:var(--ink);margin-right:6px}
article.q h4{font-size:18.5px;margin:28px 0 8px;color:var(--ink);display:flex;gap:10px;align-items:baseline;font-weight:700;letter-spacing:-.01em}
article.q h4::before{content:"";width:10px;height:10px;background:var(--navy);flex:none;transform:translateY(-1px);border-radius:2px}
article.q h5{font-size:16px;margin:14px 0 4px}
article.q p{margin:10px 0}
article.q ul,article.q ol{margin:8px 0;padding-left:24px}
article.q li{margin:5px 0}
article.q li::marker{color:var(--muted)}
.key{border-left:4px solid var(--red);background:var(--red-bg);padding:12px 16px;margin:12px 0 8px;border-radius:0 8px 8px 0;font-weight:500;font-size:17.5px;line-height:1.8;color:var(--ink)}
.key::before{content:"핵심";font:600 11.5px var(--f-mono);letter-spacing:.12em;color:var(--red);display:block;margin-bottom:2px}
.pro,.tip,.warn{padding:12px 16px;margin:16px 0 6px;border-radius:8px;font-size:16px;line-height:1.8}
.pro{background:var(--green-bg)}
.pro::before{content:"현업 포인트";font:600 11.5px var(--f-mono);letter-spacing:.08em;color:var(--green);display:block}
.tip{background:var(--navy-bg)}
.tip::before{content:"답안 전략";font:600 11.5px var(--f-mono);letter-spacing:.08em;color:var(--navy);display:block}
.warn{background:var(--amber-bg)}
.warn::before{content:"흔한 실수";font:600 11.5px var(--f-mono);letter-spacing:.08em;color:var(--amber);display:block}
.pro p,.tip p,.warn p{margin:4px 0}

/* equations */
.eq{background:var(--eqbg);border:1px solid var(--rule2);border-left:3px solid var(--navy);padding:12px 18px 10px;border-radius:0 8px 8px 0;margin:14px 0}
.eql{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:2px}
.eq .mj{overflow-x:auto;overflow-y:hidden;color:var(--ink);font-size:17px;text-align:center;padding:2px 0;min-height:1.6em;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
.eq .c{display:block;font-size:13.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--rule);margin-top:6px;padding-top:6px}
mjx-container[display="true"]{margin:.35em 0 !important}
mjx-container{color:var(--ink)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:1px 5px;border-radius:3px}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:12px 0;line-height:1.6}
table.t th,table.t td{border-bottom:1px solid var(--rule2);padding:8px 10px;text-align:left;vertical-align:top}
table.t thead th{border-bottom:1.5px solid var(--ink);font-weight:600;white-space:nowrap;background:var(--navy-bg);color:var(--ink)}
table.t tbody tr:hover td{background:var(--paper)}
table.t td.num,table.t th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.rank td.sits{font:12.5px var(--f-mono);color:var(--muted)}

/* figures */
.fig{margin:20px 0;text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig svg{width:100%;max-width:640px;min-width:460px;height:auto;display:block;margin:0 auto}
.fig.wide svg{max-width:none;min-width:600px}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6;text-align:left;max-width:640px;margin-left:auto;margin-right:auto}
svg text{font-family:var(--f-sans);fill:var(--ink)}
svg .sl{font-size:13px;fill:var(--ink2)}
svg .sv{font:600 13px var(--f-mono);fill:var(--ink)}
svg .sb{fill:var(--navy)}
svg .hc{fill:var(--navy)}
svg .hv{font:600 12px var(--f-mono);fill:var(--ink)}
svg .hv.inv{fill:var(--sheet)}
svg .ln{stroke:var(--ink);fill:none;stroke-width:1.7}
svg .ln2{stroke:var(--navy);fill:none;stroke-width:2.6}
svg .lr{stroke:var(--red);fill:none;stroke-width:2.6}
svg .lg{stroke:var(--muted);fill:none;stroke-width:1.3;stroke-dasharray:5 4}
svg .fa{fill:var(--navy-bg);stroke:var(--navy);stroke-width:1.5}
svg .fr{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}
svg .fw{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
svg .t1{font-size:13.5px;font-weight:500}
svg .t2{font-size:12.5px;fill:var(--ink2)}
svg .tr{fill:var(--red);font-size:13.5px;font-weight:700}
svg .tn{fill:var(--navy);font-size:13.5px;font-weight:700}
svg .dot{fill:var(--ink)}
svg rect.hit:hover{stroke:var(--ink);stroke-width:1.5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.box{border:1px solid var(--rule);border-radius:8px;padding:12px 16px;background:var(--sheet)}
.box h5{margin:0 0 4px;font-size:16px}
details.sit{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;margin:0 0 10px;padding:10px 16px}
details.sit summary{cursor:pointer;font-weight:600}
table.idx td:first-child{width:4.5em}
.intro .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.intro .stat>div{border-top:2px solid var(--ink);padding-top:6px}
.intro .stat b{display:block;font:600 28px var(--f-mono)}
.intro .stat span{font-size:13.5px;color:var(--muted)}

/* study plan */
.plan .ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.plan .ctrl label{font-size:14.5px;color:var(--ink2)}
.plan input[type=date],.plan select{font:inherit;font-size:14.5px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.plan .dday{font:700 30px var(--f-mono);color:var(--red)}
.plan .dsub{font-size:14px;color:var(--muted)}
.selfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:12px 0}
.selfgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule2);border-radius:8px;padding:7px 10px;font-size:14px}
.selfgrid select{font-size:13.5px;padding:3px 6px}
.prio{list-style:none;padding:0;margin:12px 0}
.prio li{display:grid;grid-template-columns:2.2em minmax(0,1fr) 3.2em;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule2);font-size:15px}
.prio .rk{font:600 13px var(--f-mono);color:var(--muted)}
.prio .bar{height:10px;border-radius:0 4px 4px 0;background:var(--navy);margin-top:4px}
.prio .bar.weak{background:var(--red)}
.prio .sc{font:600 13px var(--f-mono);text-align:right;color:var(--ink2)}
.prio .meta{font-size:12.5px;color:var(--muted)}
.weeks td:first-child{white-space:nowrap;font-family:var(--f-mono);font-size:13.5px}
.pbar{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--rule2);vertical-align:middle;overflow:hidden;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px;color:var(--ink2);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font:600 13.5px var(--f-sans);padding:7px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--navy)}
.today{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:12px 18px;margin:12px 0}
.today ol{margin:6px 0;padding-left:22px}

/* model answers (answer-sheet look) */
.model{margin-top:30px;padding-top:6px;border-top:2px dashed var(--rule)}
.model .mtitle{font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--green);margin:10px 0 0}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:36px 22px 16px 50px;margin:14px 0 18px;font-size:16px;line-height:1.9;box-shadow:0 1px 0 var(--rule2)}
.sheet::before{content:attr(data-meta);position:absolute;top:9px;left:50px;font:600 11.5px var(--f-mono);letter-spacing:.06em;color:var(--red)}
.sheet::after{content:"";position:absolute;top:0;bottom:0;left:32px;width:2px;background:var(--red);opacity:.35}
.sheet h5{font-size:16.5px;margin:14px 0 2px;font-weight:700}
.sheet h5:first-child{margin-top:0}
.sheet p{margin:4px 0}
.sheet ul,.sheet ol{margin:2px 0 6px;padding-left:22px}
.sheet li{margin:1px 0}
.sheet .fig{margin:10px 0}
.sheet .fig svg{max-width:520px;min-width:420px}
.sheet .calc{font-family:var(--f-mono);font-size:14px;background:var(--eqbg);border-radius:6px;padding:8px 12px;margin:6px 0;white-space:pre-wrap;line-height:1.7}
.sheet .concl{border-top:1px solid var(--rule2);margin-top:10px;padding-top:6px}
.freq.mdl{background:var(--green-bg);color:var(--green)}
@media (max-width:620px){.sheet{padding:34px 12px 12px 30px}.sheet::before{left:30px}.sheet::after{left:18px}}

.theme{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;
  font:500 12.5px var(--f-mono);padding:7px 12px;border-radius:18px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
@media (max-width:1000px){
  .rail{transform:translateX(-102%);transition:transform .2s;width:min(88vw,340px);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav .rail{transform:none}
  main{margin-left:0;padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .menu{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:15;background:var(--sheet);border-bottom:1px solid var(--rule);

<script id="app-data" type="application/json">{"ed":"exam","L":{"title":"조선기술사 기출 교본","pno":"PART","unit":"파트","modelOpen":"모범답안 보기","qOpen":"기출 원문","guide":"시험 구조와 출제 분석","dlabel":"시험까지","hello":"합격까지 한 칸씩","other":"교육자료 모습으로","reads":"회독","wrote":"답안 써 봄","wroteS":"답안","phases":["플랜 시작 전","1단계 · 약점 파트 1회독","2단계 · 반복 주제 답안 쓰기","3단계 · 회차별 실전 모의","4단계 · 암기 · 최신 이슈","시험 종료"],"weeks8":["3회 이상 반복 13주제 답안 쓰기 (블록분할, 기밀시험, NDT, 경사시험 …)","2회 반복 주제 답안 쓰기 + 15 예상 주제 정독","자신감 2 이하 파트 2회독, 암기 목록 1차","실전 모의: 139·136·133회 (각 400분)","실전 모의: 130·127·124회, 틀린 주제 재학습","실전 모의: 121·118·115·112회 (1교시 중심)","서브노트 · 수치 · 법령 암기, IMO 최근 결과 확인"]},"parts":[{"p":1,"t":"선박계산 · 복원성 · 만재흘수선","e":"Hydrostatics, Stability & Load Line","c":21,"r":9},{"p":2,"t":"저항 · 추진 · 조종 · 내항","e":"Resistance, Propulsion, Manoeuvring & Seakeeping","c":34,"r":8},{"p":3,"t":"선체구조 · 강도 · 재료","e":"Hull Structure, Strength & Materials","c":27,"r":7},{"p":4,"t":"진동 · 소음","e":"Vibration & Noise","c":7,"r":3},{"p":5,"t":"용접 · 절단 · 가공 · 검사","e":"Welding, Cutting, Forming & NDT","c":21,"r":7},{"p":6,"t":"생산 · 공정 · 도장 · 품질","e":"Production, Planning, Coating & Quality","c":26,"r":11},{"p":7,"t":"시험 · 검사 · 시운전","e":"Tests, Inspection & Sea Trials","c":18,"r":10},{"p":8,"t":"기관 · 동력장치 · 전기추진","e":"Machinery, Power Plant & Electric Propulsion","c":31,"r":13},{"p":9,"t":"의장 · 배관 · 하역 · HVAC","e":"Outfitting, Piping, Cargo Handling & HVAC","c":22,"r":8},{"p":10,"t":"가스선 · 대체연료","e":"Gas Carriers & Alternative Fuels","c":23,"r":15},{"p":11,"t":"환경 · 에너지효율 규제","e":"Environment & Energy-Efficiency Regulation","c":16,"r":7},{"p":12,"t":"국제협약 · 국내법 · 안전","e":"Conventions, Korean Law & Safety","c":26,"r":11},{"p":13,"t":"선박설계 · 선종 · 미래기술","e":"Ship Design, Ship Types & Future Technology","c":21,"r":9},{"p":14,"t":"조선 경영 · 금융 · 계약","e":"Shipbuilding Business, Finance & Contracts","c":17,"r":6},{"p":15,"t":"2027 출제 예상 · 트렌드","e":"Likely topics for the 2027 sitting","c":0,"r":0}],"topics":[{"id":"metacenter","p":1,"n":"1.1","h":"메타센터(Metacenter)와 초기 복원성","t":"메타센터(Metacenter)와 초기 복원성","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 5번 · 10점"],"q":["<b>112회(2017) 1-5<\/b> 메타센터(Metacenter)"],"k":"메타센터 M은 미소 횡경사 시 부심 B의 궤적이 그리는 곡률 중심이다. 무게중심 G가 M보다 아래에 있으면(GM > 0) 복원 모멘트 Δ·GM·sinθ가 생겨 선박은 원위치로 돌아온다.","x":"\n<p class=\"key\">메타센터 M은 미소 횡경사 시 부심 B의 궤적이 그리는 곡률 중심이다. 무게중심 G가 M보다 아래에 있으면(GM &gt; 0) 복원 모멘트 Δ·GM·sinθ가 생겨 선박은 원위치로 돌아온다.<\/p>\n<h4>정의와 기하<\/h4>\n<p>선박이 미소각 θ만큼 기울면 수선면 아래 쐐기 체적이 이동해 부심이 B에서 B₁으로 움직인다. 기울기 전과 후의 부력 작용선이 만나는 점이 횡메타센터 M이다. 미소각(대략 7~10° 이내)에서는 M이 거의 고정되므로 초기 복원성을 GM 하나로 판단할 수 있다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 250\" role=\"img\" aria-label=\"메타센터 기하\">\n<line x1=\"20\" y1=\"150\" x2=\"400\" y2=\"150\" class=\"lg\"/>\n<g transform=\"rotate(-12 210 150)\"><path d=\"M90 60 L90 190 Q90 215 115 215 L305 215 Q330 215 330 190 L330 60 Z\" class=\"fw\"/><\/g>\n<line x1=\"60\" y1=\"129\" x2=\"370\" y2=\"195\" class=\"ln2\"/>\n<line x1=\"210\" y1=\"30\" x2=\"210\" y2=\"215\" class=\"lg\"/>\n<circle cx=\"210\" cy=\"55\" r=\"4\" class=\"dot\"/><text x=\"218\" y=\"52\" class=\"tr\">M<\/text>\n<circle cx=\"210\" cy=\"118\" r=\"4\" class=\"dot\"/><text x=\"190\" y=\"116\" class=\"t1\">G<\/text>\n<circle cx=\"210\" cy=\"178\" r=\"3.5\" class=\"dot\"/><text x=\"192\" y=\"190\" class=\"t1\">B<\/text>\n<circle cx=\"234\" cy=\"176\" r=\"3.5\" class=\"dot\"/><text x=\"240\" y=\"190\" class=\"t1\">B₁<\/text>\n<line x1=\"234\" y1=\"176\" x2=\"210\" y2=\"55\" class=\"lr\"/>\n<line x1=\"210\" y1=\"118\" x2=\"224\" y2=\"121\" class=\"ln\"/><text x=\"226\" y=\"128\" class=\"t2\">Z<\/text>\n<text x=\"335\" y=\"190\" class=\"t2\">WL (경사 후)<\/text><text x=\"330\" y=\"145\" class=\"t2\">WL (직립)<\/text>\n<path d=\"M210 118 v40\" class=\"ln\"/><text x=\"186\" y=\"150\" class=\"t2\">W<\/text>\n<path d=\"M234 176 v-40\" class=\"lr\"/><text x=\"238\" y=\"150\" class=\"t2\" style=\"fill:var(--red)\">Δ<\/text>\n<\/svg><figcaption>경사 후 부력 Δ는 B₁을 지나 M을 향한다. G에서 그 작용선까지의 수직거리 GZ가 복원팔이다.<\/figcaption><\/figure>\n<h4>계산식<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[\\mathrm{KM}=\\mathrm{KB}+\\mathrm{BM},\\qquad \\mathrm{BM}=\\dfrac{I_T}{\\nabla},\\qquad \\mathrm{GM}=\\mathrm{KM}-\\mathrm{KG}\\]<\/div><span class=\"c\"><i>I<\/i><sub>T<\/sub>: 수선면의 선체 중심선에 대한 2차 모멘트(상자형이면 L·B³/12), ∇: 배수용적<\/span><\/div>\n<div class=\"eq\"><div class=\"eql\">미소각 근사 / 벽면선(wall-sided) 공식<\/div><div class=\"mj\">\\[\\mathrm{GZ}\\approx\\mathrm{GM}\\sin\\theta,\\qquad \\mathrm{GZ}=\\sin\\theta\\left(\\mathrm{GM}+\\tfrac12\\,\\mathrm{BM}\\tan^2\\theta\\right)\\]<\/div><\/div>\n<ul>\n<li><b>BM은 B³에 비례<\/b>한다. 폭 증가가 복원성 개선에 가장 효과적인 이유다. 반대로 흘수가 커지면 ∇가 늘어 BM은 줄고 KB는 커진다.<\/li>\n<li><b>종메타센터<\/b> M<sub>L<\/sub>: BM<sub>L<\/sub> = I<sub>L<\/sub>/∇. 값이 선장 수준으로 커서 종복원성은 문제가 되지 않고, 트림 계산(MTC = Δ·GM<sub>L<\/sub>/100L)에 쓰인다.<\/li>\n<li><b>횡동요 주기<\/b>: T<sub>φ<\/sub> = 2π·k/√(g·GM) ≈ 0.8B/√GM [s] (k는 관성반경, 대략 0.35~0.40B). GM이 크면 복원성은 좋지만 주기가 짧아 가속도가 커지고 화물·래싱 하중과 승조원 피로가 증가한다.<\/li>\n<\/ul>\n<h4>평형의 세 가지 상태<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>상태<\/th><th>조건<\/th><th>거동<\/th><\/tr><\/thead><tbody>\n<tr><td>안정<\/td><td>G가 M 아래, GM &gt; 0<\/td><td>복원 모멘트로 원위치<\/td><\/tr>\n<tr><td>중립<\/td><td>GM = 0<\/td><td>기운 상태 유지<\/td><\/tr>\n<tr><td>불안정<\/td><td>GM &lt; 0<\/td><td>더 기울다가 loll angle에서 평형(GZ=0 지점), 또는 전복<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>설계에서 GM은 \"클수록 좋다\"가 아니다. 컨테이너선은 GM이 크면 횡동요 가속도로 래싱 하중이 커지고, 작으면 바람·선회 경사가 커진다. 그래서 적재계획서에 최소 GM 곡선(GM limit curve)을 두고, 래싱 계산은 실제 GM으로 한다. 자유표면 수정(GG<sub>v<\/sub>)을 뺀 GM<sub>fluid<\/sub>로 판정하는 것을 잊지 말 것.<\/p><\/div>\n<div class=\"tip\"><p>그림 하나(M, G, B, B₁, Z와 두 수선)와 식 세 줄(KM=KB+BM, BM=I/∇, GZ≈GM sinθ)이면 10점 답안의 뼈대가 된다. 마지막에 GM 과대·과소의 실무 영향을 한 줄 쓴다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 그림 필수\">\n<h5>1. 정의<\/h5><p>미소 횡경사 시 부심 B 궤적의 곡률 중심 M. G가 M 아래(GM &gt; 0)면 복원 모멘트 Δ·GM·sinθ.<\/p>\n<div class=\"calc\">KM = KB + BM,  BM = I_T/∇,  GM = KM − KG\nGZ ≈ GM·sinθ (미소각),  T_φ ≈ 0.8B/√GM [s]<\/div>\n<p>(그림: 직립·경사 수선, B→B₁, M, G, Z)<\/p>\n<p class=\"concl\"><b>의견<\/b>: GM 과대는 횡동요 가속도·래싱 하중↑, 과소는 경사↑ → 적재지침서 GM 한계 곡선으로 관리.<\/p><\/div><\/section><\/details>"},{"id":"cross-curves","p":1,"n":"1.2","h":"복원력 교차곡선(Cross Curves of Stability)","t":"복원력 교차곡선(Cross Curves of Stability)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 2번 · 10점"],"q":["<b>112회(2017) 1-2<\/b> 복원력 교차곡선(Cross Curves of Stability)"],"k":"교차곡선은 가정 기준점(보통 K, 용골)에 대한 복원팔 KN을 배수량의 함수로 경사각별(10°, 20°, …, 90°)로 그린 곡선군이다. 실제 KG를 알면 GZ = KN − KG·sinθ로 어떤 적재상태의 GZ 곡선도 바로 만들 수 있다.","x":"\n<p class=\"key\">교차곡선은 가정 기준점(보통 K, 용골)에 대한 복원팔 KN을 배수량의 함수로 경사각별(10°, 20°, …, 90°)로 그린 곡선군이다. 실제 KG를 알면 GZ = KN − KG·sinθ로 어떤 적재상태의 GZ 곡선도 바로 만들 수 있다.<\/p>\n<h4>왜 필요한가<\/h4>\n<p>GZ는 KG에 따라 달라지므로 적재상태마다 다시 계산해야 한다. 그러나 KN은 선형과 배수량만으로 결정되므로 한 번 계산해 두면 모든 적재상태에 재사용할 수 있다. 대각도에서는 메타센터가 이동하므로 GM·sinθ 근사가 깨지고, 교차곡선으로 정확한 GZ를 얻는다.<\/p>\n<h4>작성 방법<\/h4>\n<ol>\n<li>경사각 θ를 고정하고 여러 배수량에 대해 경사 수선면을 찾는다. 오늘날에는 <b>free trim<\/b>(경사 중 종방향 평형도 만족) 조건으로 3D 선형에서 직접 적분한다.<\/li>\n<li>각 수선에서 부심 위치를 구하고, K를 지나는 연직선으로부터 부력 작용선까지의 거리 KN을 계산한다.<\/li>\n<li>KN을 세로축, 배수량을 가로축으로 경사각별 곡선을 그린다.<\/li>\n<li>적재상태의 Δ와 KG(자유표면 수정 포함)로 각 θ의 KN을 읽고 GZ = KN − KG sin θ를 계산해 정적 복원력 곡선(GZ curve)을 완성한다.<\/li>\n<\/ol>\n<h4>포함하는 체적의 약속<\/h4>\n<ul>\n<li>수밀 선체와 ICLL상 폐위 선루(밀폐 가능한 선루·트렁크)는 부력체로 포함한다. 해치코밍과 풍우밀 해치커버도 포함하는 것이 일반적이다.<\/li>\n<li>개구가 잠기는 각도(downflooding angle, θ<sub>f<\/sub>) 이후의 GZ는 판정에서 쓰지 않는다.<\/li>\n<\/ul>\n<div class=\"tip\"><p>KN 곡선과 GZ 곡선의 관계식, 그리고 \"교차곡선은 선형 고유, GZ 곡선은 적재상태 고유\"라는 대비를 반드시 쓴다. 정적 복원력 곡선의 판정 기준(IS Code 면적·GZ 기준)을 한 줄 연결하면 가점.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>가정 기준점 K에 대한 복원팔 KN을 배수량 함수로 경사각별로 그린 곡선군.<\/p>\n<div class=\"calc\">GZ = KN − KG·sinθ<\/div>\n<h5>2. 작성·활용<\/h5><p>경사각 고정, 배수량별 경사 수선(free trim) → 부심 → KN. 적재상태 Δ·KG로 GZ 곡선 작성. 수밀 선체·폐위 선루 포함, 침수각 이후 제외.<\/p>\n<p class=\"concl\"><b>의견<\/b>: 교차곡선은 선형 고유, GZ 곡선은 적재상태 고유임.<\/p><\/div><\/section><\/details>"},{"id":"is-code","p":1,"n":"1.3","h":"비손상 복원성 기준(2008 IS Code)과 기상 기준","t":"비손상 복원성 기준(2008 IS Code)과 기상 기준","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"2008 IS Code Part A는 모든 화물선·여객선(L ≥ 24 m)의 정적 복원력 곡선에 면적·GZ·GM 기준을, 횡풍과 횡동요가 겹친 상황에 기상 기준(weather criterion)을 요구한다. 2020년에는 파라메트릭 롤 등 동적 현상을 다루는 2세대 복원성 기준(SGISC) 잠정지침이 나왔다.","x":"\n<p class=\"key\">2008 IS Code Part A는 모든 화물선·여객선(L ≥ 24 m)의 정적 복원력 곡선에 면적·GZ·GM 기준을, 횡풍과 횡동요가 겹친 상황에 기상 기준(weather criterion)을 요구한다. 2020년에는 파라메트릭 롤 등 동적 현상을 다루는 2세대 복원성 기준(SGISC) 잠정지침이 나왔다.<\/p>\n<h4>일반 기준(Part A 2.2)<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th class=\"num\">기준<\/th><\/tr><\/thead><tbody>\n<tr><td>GZ 곡선 아래 면적 0~30°<\/td><td class=\"num\">≥ 0.055 m·rad<\/td><\/tr>\n<tr><td>0~40° 또는 0~θ<sub>f<\/sub> 중 작은 각<\/td><td class=\"num\">≥ 0.090 m·rad<\/td><\/tr>\n<tr><td>30~40° 또는 30~θ<sub>f<\/sub><\/td><td class=\"num\">≥ 0.030 m·rad<\/td><\/tr>\n<tr><td>30° 이상에서의 GZ<\/td><td class=\"num\">≥ 0.20 m<\/td><\/tr>\n<tr><td>최대 GZ 발생 각<\/td><td class=\"num\">≥ 25° (권장 30° 이상)<\/td><\/tr>\n<tr><td>초기 GM<sub>0<\/sub>(자유표면 수정 후)<\/td><td class=\"num\">≥ 0.15 m<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 230\" role=\"img\" aria-label=\"GZ 곡선과 기준\">\n<line x1=\"40\" y1=\"190\" x2=\"420\" y2=\"190\" class=\"ln\"/><line x1=\"40\" y1=\"190\" x2=\"40\" y2=\"20\" class=\"ln\"/>\n<path d=\"M40 190 C 90 165, 140 110, 200 75 S 290 60, 320 85 S 380 160, 405 190\" class=\"ln2\"/>\n<path d=\"M40 190 C 90 165, 140 110, 160 100 L160 190 Z\" class=\"fa\" style=\"opacity:.6\"/>\n<path d=\"M160 190 L160 100 C 175 91, 190 82, 200 76 L200 190 Z\" class=\"fr\" style=\"opacity:.6\"/>\n<line x1=\"40\" y1=\"190\" x2=\"120\" y2=\"40\" class=\"lg\"/><text x=\"96\" y=\"40\" class=\"t2\">GM 접선<\/text>\n<line x1=\"120\" y1=\"190\" x2=\"120\" y2=\"186\" class=\"ln\"/><text x=\"112\" y=\"205\" class=\"t2\">57.3°<\/text>\n<text x=\"152\" y=\"205\" class=\"t2\">30°<\/text><text x=\"193\" y=\"205\" class=\"t2\">40°<\/text><text x=\"264\" y=\"205\" class=\"t2\">θ<\/text>\n<text x=\"80\" y=\"180\" class=\"tn\">≥0.055<\/text><text x=\"164\" y=\"180\" class=\"tr\">≥0.03<\/text>\n<text x=\"250\" y=\"55\" class=\"t1\">GZ<tspan class=\"t2\"> max (≥25°)<\/tspan><\/text>\n<text x=\"8\" y=\"30\" class=\"t2\">GZ<\/text>\n<\/svg><figcaption>면적 기준은 에너지(복원 일)의 하한, GZ와 최대각 기준은 대각도 여유의 하한이다.<\/figcaption><\/figure>\n<h4>기상 기준(Part A 2.3)<\/h4>\n<ol>\n<li>정상풍(풍압 504 Pa 기준)에 의한 횡경사 모멘트 레버 l<sub>w1<\/sub>로 정적 경사각 θ<sub>0<\/sub>를 구한다. θ<sub>0<\/sub>는 16° 또는 갑판 끝 침수각의 80% 중 작은 값 이하.<\/li>\n<li>그 상태에서 풍상측으로 θ<sub>1<\/sub>만큼 횡동요한 뒤 돌풍(l<sub>w2<\/sub> = 1.5 l<sub>w1<\/sub>)을 받는다고 가정한다.<\/li>\n<li>면적 b(복원 일) ≥ 면적 a(돌풍이 한 일)이어야 한다.<\/li>\n<\/ol>\n<h4>2세대 복원성(SGISC)<\/h4>\n<p>MSC.1/Circ.1627(2020) 잠정지침은 순수 복원력 손실(pure loss of stability), 파라메트릭 롤, 서프라이딩/브로칭, 데드쉽 상태, 과도 가속도 다섯 가지 파랑 중 실패모드를 3단계(취약성 1·2단계, 직접 평가)로 다룬다. 현재는 권고이며, 대형 컨테이너선 설계 검증과 운항지침(operational guidance)에 쓰인다.<\/p>\n<div class=\"tip\"><p>표 하나와 GZ 곡선 그림이 이 주제의 전부다. 수치 여섯 개를 정확히 외워 두면 경사시험, 자유표면, 손상복원성 문제의 결론부에서 그대로 재사용할 수 있다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 예상(2008 IS Code·2세대 복원성)\">\n<h5>1. 일반 기준(Part A 2.2)<\/h5><div class=\"calc\">면적 0~30° ≥ 0.055 m·rad, 0~40°(θ_f) ≥ 0.090, 30~40° ≥ 0.030\nGZ(30° 이상) ≥ 0.20 m, 최대 GZ 각 ≥ 25°, GM₀ ≥ 0.15 m<\/div>\n<h5>2. 기상 기준<\/h5><p>정상풍 경사 θ₀ ≤ 16°(갑판 끝 침수각 80%), 풍상 횡동요 θ₁ 후 돌풍 l<sub>w2<\/sub> = 1.5 l<sub>w1<\/sub> → 면적 b ≥ a.<\/p>\n<h5>3. 2세대(MSC.1/Circ.1627, 2020)<\/h5><p>순수 복원력 손실, 파라메트릭 롤, 서프라이딩·브로칭, 데드쉽, 과도 가속도 — 3단계 평가.<\/p><\/div><\/section><\/details>"},{"id":"free-surface","p":1,"n":"1.4","h":"자유표면효과(Free Surface Effect)와 최소화 방안","t":"자유표면효과(Free Surface Effect)와 최소화 방안","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 11번 · 10점","136회 2교시 4번 · 25점"],"q":["<b>115회(2018) 1-11<\/b> 자유표면효과(Free surface effect)","<b>136회(2025) 2-4<\/b> 자유표면효과와 복원성 영향 및 최소화 방안"],"k":"탱크에 액체가 부분 적재되면 선박이 기울 때 액체도 기운 쪽으로 이동해 경사 모멘트를 만든다. 이는 무게중심이 가상적으로 GGv = Σρt·i/Δ만큼 올라간 것과 같아 GM이 그만큼 줄어든다.","x":"\n<p class=\"key\">탱크에 액체가 부분 적재되면 선박이 기울 때 액체도 기운 쪽으로 이동해 경사 모멘트를 만든다. 이는 무게중심이 가상적으로 GG<sub>v<\/sub> = Σρ<sub>t<\/sub>·i/Δ만큼 올라간 것과 같아 GM이 그만큼 줄어든다.<\/p>\n<h4>원리<\/h4>\n<p>폭 b, 길이 l인 직사각형 탱크에서 액체 표면이 θ만큼 기울면 액체의 무게중심이 수평으로 이동한다. 이 이동 모멘트를 선박 전체의 복원 모멘트와 비교하면 GM 감소량이 다음과 같다.<\/p>\n<div class=\"eq\"><div class=\"mj\">\\[GG_v=\\dfrac{\\rho_t\\,i}{\\Delta},\\qquad i=\\dfrac{l\\,b^3}{12},\\qquad \\mathrm{GM}_{fluid}=\\mathrm{GM}_{solid}-\\sum GG_v\\]<\/div><span class=\"c\">ρ<sub>t<\/sub>: 탱크 액체 밀도[t/m³], i: 탱크 자유표면의 종방향 축에 대한 2차 모멘트[m⁴], Δ: 배수량[t]. ρ<sub>t<\/sub>·i를 자유표면 모멘트(FSM)라 한다.<\/span><\/div>\n<ul>\n<li>감소량은 <b>액체의 양과 무관<\/b>하고 표면 폭의 세제곱에 비례한다(벽에 닿지 않는 범위에서).<\/li>\n<li>탱크를 종격벽으로 n등분하면 Σi는 1/n²로 줄어든다. 2등분이면 1/4, 3등분이면 1/9.<\/li>\n<li>Δ가 작은 경하·밸러스트 상태에서 영향이 크다.<\/li>\n<\/ul>\n<h4>복원성에 미치는 영향<\/h4>\n<ul>\n<li>초기 GM 감소 → 동일 외력에 더 큰 경사, 횡동요 주기 증가.<\/li>\n<li>GZ 곡선 전체가 낮아져 면적 기준 여유 감소. 대각도에서는 액면이 탱크 상하면에 닿아 실제 모멘트가 각도에 따라 변하므로 IS Code는 각도별 실제 모멘트 계산(또는 30° 기준값)을 허용한다.<\/li>\n<li>슬로싱 공진과 결합하면 동적 경사 증가(소형선·어선 전복사고의 주원인).<\/li>\n<\/ul>\n<h4>최소화 방안<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>방안<\/th><\/tr><\/thead><tbody>\n<tr><td>설계<\/td><td>종격벽·제수격벽(wash bulkhead)으로 탱크 폭 분할, 이중선체 측면 탱크 활용, 넓고 얕은 탱크 지양, 연료·청수 탱크를 좁고 높게 배치<\/td><\/tr>\n<tr><td>운항<\/td><td>탱크는 비우거나(0%) 만재(98%)로 유지, 동시에 여러 탱크를 slack으로 두지 않기, 소비 순서 계획<\/td><\/tr>\n<tr><td>계산<\/td><td>적재지침서에 IS Code Part B 3.3 방식으로 탱크 종류별 최대 FSM을 반영, 적하지침기기로 실시간 확인<\/td><\/tr>\n<tr><td>특수<\/td><td>횡동요 감쇠용 anti-rolling tank는 자유표면을 의도적으로 이용하되 위상지연으로 감쇠를 얻는다<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"warn\"><p>자유표면 수정을 \"액체 무게가 위로 올라간 것\"으로 쓰면 틀린다. 실제 무게중심은 그대로이고, 경사 시 액체 이동이 만드는 모멘트가 가상 상승과 등가라는 점을 명시해야 한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-1-11<\/td><td>자유표면효과<\/td><td class=\"num\">10<\/td><td>원리·GG<sub>v<\/sub> 식<\/td><\/tr>\n<tr><td class=\"num\">136-2-4<\/td><td>복원성 영향과 최소화 방안<\/td><td class=\"num\">25<\/td><td>식 + 분할 효과 수치 + 설계·운항 대책<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 136회형\">\n<h5>1. 정의<\/h5><p>부분 적재 탱크의 액체가 경사 방향으로 이동해 경사 모멘트를 만드는 현상으로, 무게중심이 가상 상승한 것과 같아 GM이 감소함.<\/p>\n<h5>2. 원리<\/h5>\n<div class=\"calc\">GG_v = ρ_t · i / Δ,   i = l·b³/12 (직사각형 탱크)\nGM_fluid = GM_solid − Σ GG_v\n예) l = 20 m, b = 30 m, ρ = 1.025, Δ = 40,000 t\n    i = 45,000 m⁴ → GG_v = 1.15 m\n    종격벽 1개(2등분): i 합 = 2 × 20×15³/12 = 11,250 → GG_v = 0.29 m (1/4)<\/div>\n<h5>3. 복원성에 미치는 영향<\/h5><ul><li>초기 GM 감소 → 같은 외력에 더 큰 경사, 횡동요 주기 증가<\/li><li>GZ 곡선 전체 하강 → 면적 기준 여유 감소<\/li><li>경하·밸러스트 상태(Δ 작음)에서 영향 큼, 슬로싱과 결합 시 동적 경사 증가<\/li><\/ul>\n<h5>4. 최소화 방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>방안<\/th><\/tr><\/thead><tbody>\n<tr><td>설계<\/td><td>종격벽·제수격벽 분할(n등분 → 1/n²), 좁고 깊은 탱크, 이중선체 측면 탱크 활용<\/td><\/tr>\n<tr><td>운항<\/td><td>탱크는 비우거나 만재, 동시 slack 탱크 최소, 소비 순서 계획<\/td><\/tr>\n<tr><td>계산<\/td><td>IS Code Part B 3.3에 따라 탱크 종류별 최대 FSM 반영, 적하지침기기로 확인<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>5. 결론<\/b>: 자유표면 감소량은 액체 양이 아니라 표면 폭의 세제곱에 좌우되므로, 탱크 폭 분할이 가장 효과적인 설계 대책임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"inclining","p":1,"n":"1.5","h":"경사시험(Inclining Test)의 목적·원리·절차와 복원성 불만족 시 대책","t":"경사시험(Inclining Test)의 목적·원리·절차와 복원성 불만족 시 대책","c":4,"r":2,"b":[{"c":"hot","t":"4회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 9번 · 10점","127회 4교시 2번 · 25점","133회 3교시 3번 · 25점","136회 3교시 5번 · 25점"],"q":["<b>118회(2019) 1-9<\/b> 경사시험의 목적과 원리","<b>127회(2022) 4-2<\/b> 경사시험의 준비 및 실시과정","<b>133회(2024) 3-3<\/b> 경사시험의 목적과 원리","<b>136회(2025) 3-5<\/b> 경사시험의 목적, 무게중심 산출과정, 복원성 불만족 시 해결방안"],"k":"경사시험은 준공 직후 경하상태 선박에 알려진 무게를 횡방향으로 옮겨 생긴 경사각을 재서 GM을 구하고, 이로부터 경하중량의 KG를 실측으로 확정하는 시험이다. 모든 적재상태 복원성 계산의 출발점이 된다.","x":"\n<p class=\"key\">경사시험은 준공 직후 경하상태 선박에 알려진 무게를 횡방향으로 옮겨 생긴 경사각을 재서 GM을 구하고, 이로부터 경하중량의 KG를 실측으로 확정하는 시험이다. 모든 적재상태 복원성 계산의 출발점이 된다.<\/p>\n<h4>목적<\/h4>\n<ul>\n<li>경하중량(lightship weight)과 그 무게중심(LCG, KG)을 실측으로 확정한다. 설계 추정 KG와의 차이를 확인한다.<\/li>\n<li>SOLAS II-1/5에 따라 모든 여객선과 L ≥ 24 m 화물선은 완성 후 경사시험이 필요하다. 동형선(sister ship)은 경하중량 조사(lightweight survey)로 대신할 수 있으나, 기준선 대비 경하배수량 편차가 2%를 넘거나 LCG 편차가 0.5% L을 넘으면 경사시험을 다시 한다.<\/li>\n<li>확정된 경하 데이터로 적재지침서(Trim &amp; Stability Booklet), 손상복원성 계산서, 적하지침기기를 최종 승인받는다.<\/li>\n<\/ul>\n<h4>원리<\/h4>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 220\" role=\"img\" aria-label=\"경사시험 원리\">\n<path d=\"M70 70 L350 70 L350 160 Q350 180 330 180 L90 180 Q70 180 70 160 Z\" class=\"fw\"/>\n<rect x=\"95\" y=\"52\" width=\"34\" height=\"18\" class=\"fr\"/><text x=\"100\" y=\"47\" class=\"t2\">w<\/text>\n<rect x=\"290\" y=\"52\" width=\"34\" height=\"18\" class=\"fa\" style=\"stroke-dasharray:3 2\"/><text x=\"292\" y=\"47\" class=\"t2\">이동 후<\/text>\n<path d=\"M130 40 L288 40\" class=\"lr\"/><text x=\"190\" y=\"34\" class=\"tr\">d<\/text>\n<line x1=\"210\" y1=\"85\" x2=\"210\" y2=\"160\" class=\"ln\"/><line x1=\"210\" y1=\"85\" x2=\"226\" y2=\"158\" class=\"ln2\"/>\n<path d=\"M200 160 L240 160\" class=\"ln\"/><text x=\"228\" y=\"174\" class=\"t2\">a (편위)<\/text>\n<text x=\"168\" y=\"120\" class=\"t2\">추 길이 ℓ<\/text>\n<line x1=\"30\" y1=\"140\" x2=\"390\" y2=\"140\" class=\"lg\"/><text x=\"362\" y=\"134\" class=\"t2\">WL<\/text>\n<\/svg><figcaption>무게 w를 거리 d만큼 옮기면 경사 모멘트 w·d가 복원 모멘트 Δ·GM·tanθ와 평형을 이룬다.<\/figcaption><\/figure>\n<div class=\"eq\"><div class=\"mj\">\\[w\\,d=\\Delta\\,\\mathrm{GM}\\tan\\theta\\ \\Rightarrow\\ \\mathrm{GM}=\\dfrac{w\\,d}{\\Delta\\tan\\theta},\\qquad \\tan\\theta=\\dfrac{a}{\\ell}\\]<\/div><\/div>\n<div class=\"eq\"><div class=\"eql\">GG<sub>v<\/sub>: 시험 중 잔류액 자유표면 수정 → 이후 경하상태로 과잉중량(+)·부족중량(−) 가감<\/div><div class=\"mj\">\\[\\mathrm{KG}=\\mathrm{KM}-\\mathrm{GM}-GG_v\\]<\/div><\/div>\n<p>실제로는 무게를 8회(좌우 각 4회) 정도 옮기며 tanθ와 모멘트 w·d를 그래프로 그리고, 직선의 기울기로 GM을 구한다. 점들이 직선에서 벗어나면 계류줄 긴장, 액체 이동, 바람 같은 외란이 있었다는 뜻이므로 해당 측정을 반복한다.<\/p>\n<h4>준비 사항(IS Code Annex 1 지침)<\/h4>\n<ol>\n<li><b>선박 상태<\/b>: 가능한 한 완성 상태. 미탑재·과탑재 물품 목록(lightship check list)을 만들어 무게와 위치를 기록한다.<\/li>\n<li><b>탱크<\/b>: 비우거나 완전 만재(pressed up). 부분 적재 탱크는 최소화하고 액위를 측정해 자유표면을 보정한다. 빌지·잔유 제거.<\/li>\n<li><b>계류<\/b>: 계류줄은 느슨하게(선수미 한 줄씩 slack), 갱웨이·육상 전원 케이블 분리, 크레인 고정.<\/li>\n<li><b>인원<\/b>: 시험 요원 외 하선. 요원은 정해진 위치(대개 중심선)에 고정.<\/li>\n<li><b>환경<\/b>: 바람·조류·파도가 작을 것. 수심 충분(선저 접촉 없음). 해수 비중을 여러 곳에서 측정.<\/li>\n<li><b>흘수 계측<\/b>: 선수·중앙·선미 좌우 흘수와 건현을 측정해 배수량과 트림을 구한다. 초기 횡경사 0.5° 이내, 트림이 크면 트림 상태 정수력 자료를 쓴다.<\/li>\n<li><b>측정 장비<\/b>: 추(pendulum) 최소 2개(대형선 3개 권장), 추 끝 편위가 좌우 각 15 cm 이상 나오도록 길이 설정, 감쇠용 유조. 또는 승인된 전자 경사계 병용.<\/li>\n<li><b>시험 중량<\/b>: 좌우 각 1~4°의 경사를 낼 수 있는 고형 중량(검량된 블록), 위치와 이동 거리를 표시.<\/li>\n<\/ol>\n<h4>실시 과정<\/h4>\n<ol>\n<li>초기(0번) 위치에서 추 읽기 → 중량 이동(1→8번) → 각 단계마다 추 편위 기록.<\/li>\n<li>tanθ – 경사 모멘트 그래프 작성, 직선성 확인, 기울기로 GM 산출.<\/li>\n<li>시험 상태의 Δ, KM, 자유표면 보정으로 KG 계산.<\/li>\n<li>과잉·부족 중량을 가감해 경하중량과 KG, LCG 확정 → 선급 검사원 입회 보고서 승인.<\/li>\n<\/ol>\n<h4>복원성 불만족 시 해결방안<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>방안<\/th><th>비고<\/th><\/tr><\/thead><tbody>\n<tr><td>무게중심 낮추기<\/td><td>고정 밸러스트(permanent ballast) 이중저 탑재, 상부 장비 하향 이전, 상부구조 경량화(알루미늄)<\/td><td>재화중량 감소 trade-off<\/td><\/tr>\n<tr><td>BM 키우기<\/td><td>스폰슨·블리스터 부착으로 수선면 폭 증가<\/td><td>저항·선형 변경, 개조 공사 큼<\/td><\/tr>\n<tr><td>자유표면 축소<\/td><td>탱크 분할, 운항 시 탱크 관리<\/td><td>설계 단계에서 유리<\/td><\/tr>\n<tr><td>운항 제한<\/td><td>최대 KG·최소 GM 곡선 강화, 갑판 화물 단수 제한, 밸러스트 운용 지침<\/td><td>선주 상업성 저하, 협의 필요<\/td><\/tr>\n<tr><td>재계산<\/td><td>교차곡선에 선루·트렁크 부력 반영 재검토, 개구부 침수각(θ<sub>f<\/sub>) 상향(개구 위치 변경)<\/td><td>가장 저비용, 근거 필요<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>현장에서 경하 KG가 설계 추정보다 높게 나오는 주원인은 의장품·배관·케이블 중량의 과소 추정과 상부구조의 도장·보온재다. 그래서 설계 단계부터 KG 마진(통상 경하 KG에 수 % 또는 0.1~0.3 m)을 두고, 중량관리(weight control)를 공정 내내 추적한다. 시험 당일은 바람과 계류줄이 결과를 가장 많이 흔든다.<\/p><\/div>\n<div class=\"tip\"><p>원리 그림 + GM 식 + 준비(상태·탱크·계류·인원·환경·측정) + 결과 처리(직선성, 경하 보정) 순서로 쓴다. 136회처럼 \"불만족 시 해결방안\"을 묻는 경우 표로 대안을 비교하고 \"설계 마진 확보와 중량관리\"를 결론으로 둔다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 4회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-9<\/td><td>목적과 원리<\/td><td class=\"num\">10<\/td><td>GM 식과 그림<\/td><\/tr>\n<tr><td class=\"num\">127-4-2<\/td><td>준비 및 실시과정<\/td><td class=\"num\">25<\/td><td>준비 8항목, 실시 단계, 직선성 확인<\/td><\/tr>\n<tr><td class=\"num\">133-3-3<\/td><td>목적과 원리<\/td><td class=\"num\">25<\/td><td>원리 유도 + 경하 보정 + SOLAS 근거<\/td><\/tr>\n<tr><td class=\"num\">136-3-5<\/td><td>목적, KG 산출과정, 불만족 시 해결<\/td><td class=\"num\">25<\/td><td>수치 예제로 KG 산출, 대안 비교표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 118회형(목적과 원리)\">\n<h5>1. 목적<\/h5>\n<p>준공 선박의 경하중량과 무게중심(KG, LCG)을 실측으로 확정해 모든 적재상태 복원성 계산의 기준으로 삼음(SOLAS II-1/5).<\/p>\n<h5>2. 원리<\/h5>\n<p>중량 w를 횡방향 d만큼 이동 → 경사 모멘트 w·d = 복원 모멘트 Δ·GM·tanθ<\/p>\n<div class=\"calc\">GM = w·d / (Δ·tanθ),  tanθ = 추 편위 a / 추 길이 ℓ\nKG = KM − GM − (자유표면 수정)<\/div>\n<h5>3. 요점<\/h5>\n<ul><li>좌우 각 1~4° 경사, 8회 이동, tanθ–모멘트 직선의 기울기로 GM<\/li>\n<li>바람·계류줄·잔류 액체가 오차의 주원인<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 설계 KG 마진과 중량관리 결과를 확인하는 최종 검증이므로 시험 조건 관리가 결과 신뢰성을 좌우함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 3쪽 · 136회형(목적·KG 산출·불만족 대책)\">\n<h5>1. 목적<\/h5>\n<ul><li>경하중량·KG·LCG 실측 확정 → 적재지침서·손상복원성·적하지침기기 승인 근거<\/li>\n<li>SOLAS II-1/5: 여객선 및 L ≥ 24 m 화물선, 동형선은 경하중량 조사로 대체(편차 2%·LCG 0.5% L 초과 시 재시험)<\/li><\/ul>\n<h5>2. 원리<\/h5>\n<div class=\"calc\">w·d = Δ·GM·tanθ  →  GM = w·d / (Δ·tanθ)<\/div>\n<h5>3. 무게중심 산출과정(예제)<\/h5>\n<div class=\"calc\">시험 배수량 Δ = 12,000 t, 이동 중량 w = 40 t, 이동거리 d = 16 m\n추 길이 ℓ = 6.0 m, 평균 편위 a = 0.28 m → tanθ = 0.0467\nGM = 40×16 / (12,000×0.0467) = 1.143 m\nKM(정수력표) = 10.20 m → KG(유체) = 9.057 m\n잔류액 자유표면 수정 0.05 m → KG(고체) = 9.007 m\n경하 보정: 시험중량 −40 t(KG 22.0), 잔유 −150 t(KG 1.2), 미탑재품 +30 t(KG 25.0)\n경하중량 = 11,840 t,  경하 KG = Σ(W·KG) / ΣW = 9.103 m<\/div>\n<h5>4. 시험 조건 관리<\/h5>\n<p>탱크 비움·만재, 계류 이완, 인원 하선, 바람·조류 최소, 흘수 6점 계측, 추 2개 이상, tanθ–모멘트 직선성 확인.<\/p>\n<h5>5. 복원성 불만족 시 해결방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방안<\/th><th>효과<\/th><th>대가<\/th><\/tr><\/thead><tbody>\n<tr><td>고정 밸러스트 이중저 탑재<\/td><td>KG 하강<\/td><td>재화중량 감소<\/td><\/tr>\n<tr><td>상부 중량 하향·경량화<\/td><td>KG 하강<\/td><td>설계 변경<\/td><\/tr>\n<tr><td>스폰슨·블리스터<\/td><td>BM 증가(B³)<\/td><td>저항·개조비<\/td><\/tr>\n<tr><td>탱크 분할·운항 지침<\/td><td>자유표면 감소<\/td><td>운용 제약<\/td><\/tr>\n<tr><td>교차곡선 선루 부력 반영, 침수각 상향<\/td><td>GZ 범위 확대<\/td><td>근거 자료 필요<\/td><\/tr>\n<tr><td>최대 KG·최소 GM 곡선 조정<\/td><td>운항 제한으로 만족<\/td><td>상업성 저하<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>6. 결론<\/b>: 불만족은 대부분 의장·배관 중량 과소 추정에서 오므라, 설계 단계 KG 마진과 공정 내 중량관리가 근본 대책이며, 사후 대책은 재화중량·상업성 손실을 비교해 선주와 합의해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"lost-buoyancy","p":1,"n":"1.6","h":"부력손실법(Lost Buoyancy Method)과 부가중량법(Added Weight Method)","t":"부력손실법(Lost Buoyancy Method)과 부가중량법(Added Weight Method)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 3교시 3번 · 25점"],"q":["<b>118회(2019) 3-3<\/b> 부력손실법(Lost Buoyancy Method)과 부가중량법(Added Weight Method)"],"k":"손상으로 구획에 물이 들어온 상태를 계산하는 두 방법이다. 부력손실법은 침수 구획을 선체에서 떼어낸 것으로 보고(배수량·KG 불변), 부가중량법은 침수수를 실린 화물로 본다(배수량·KG 변화). 최종 흘수·트림·횡경사와 복원 모멘트는 같고 GM 값만 다르게 나온다.","x":"\n<p class=\"key\">손상으로 구획에 물이 들어온 상태를 계산하는 두 방법이다. 부력손실법은 침수 구획을 선체에서 떼어낸 것으로 보고(배수량·KG 불변), 부가중량법은 침수수를 실린 화물로 본다(배수량·KG 변화). 최종 흘수·트림·횡경사와 복원 모멘트는 같고 GM 값만 다르게 나온다.<\/p>\n<h4>두 방법의 비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>부력손실법 (constant displacement)<\/th><th>부가중량법<\/th><\/tr><\/thead><tbody>\n<tr><td>가정<\/td><td>침수 구획의 부력 상실. 손상 구획 수선면 a도 상실<\/td><td>침수수 w = ρ·v(·μ)를 중량으로 추가<\/td><\/tr>\n<tr><td>배수량<\/td><td>불변 (Δ)<\/td><td>증가 (Δ + w)<\/td><\/tr>\n<tr><td>KG<\/td><td>불변<\/td><td>침수수 무게중심 반영해 변화<\/td><\/tr>\n<tr><td>평행침하<\/td><td>δT = v/(A<sub>w<\/sub> − a)<\/td><td>반복계산(침수수량이 흘수에 따라 변함)<\/td><\/tr>\n<tr><td>BM<\/td><td>잔존 수선면 2차 모멘트로 재계산 (I − i − a·y²)/∇<\/td><td>원 수선면 사용, 침수수 자유표면을 GG<sub>v<\/sub>로 차감<\/td><\/tr>\n<tr><td>GM<\/td><td>GM<sub>LB<\/sub><\/td><td>GM<sub>AW<\/sub> (값이 다름)<\/td><\/tr>\n<tr><td>장점<\/td><td>배수량 고정으로 계산 간단, 최종 평형 판정에 적합<\/td><td>침수 중간단계, 부분 침수, 교차침수 진행 표현이 직관적<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">두 방법의 복원 모멘트는 같다<\/div><div class=\"mj\">\\[\\Delta\\,\\mathrm{GM}_{LB}=(\\Delta+w)\\,\\mathrm{GM}_{AW}\\]<\/div><\/div>\n<h4>투과율(permeability) μ<\/h4>\n<p>침수 체적은 구획 체적에 투과율을 곱한다. SOLAS II-1/7-3 대표값: 창고 0.60, 거주구 0.95, 기관구역 0.85, 공소 0.95, 액체 구획 0~0.95, 화물구역은 흘수별로 0.70~0.95.<\/p>\n<h4>적용<\/h4>\n<ul>\n<li>확률론적 손상복원성(SOLAS II-1 Part B-1)과 MARPOL·IBC·IGC 결정론적 계산은 상용 프로그램에서 주로 부력손실법으로 최종 평형을 구한다.<\/li>\n<li>침수 중간단계(intermediate stages), 교차침수 시간 평가, 부분 적재 탱크 손상 시 내용물 유출·해수 유입 같은 과정은 부가중량법으로 표현한다.<\/li>\n<\/ul>\n<div class=\"tip\"><p>\"결과는 같고 GM 정의만 다르다\"는 결론과 Δ·GM 등식 한 줄이 채점 포인트다. 두 방법의 용도 구분까지 쓰면 25점 답안이 된다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>손상 침수 상태 계산법. 부력손실법: 침수 구획을 선체에서 제외(Δ·KG 불변) / 부가중량법: 침수수를 중량으로 추가(Δ·KG 변화).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>부력손실법<\/th><th>부가중량법<\/th><\/tr><\/thead><tbody>\n<tr><td>Δ·KG<\/td><td>불변<\/td><td>증가·변화<\/td><\/tr>\n<tr><td>침하<\/td><td>δT = v/(A<sub>w<\/sub> − a)<\/td><td>반복계산<\/td><\/tr>\n<tr><td>BM<\/td><td>잔존 수선면으로 재계산<\/td><td>원 수선면, 침수수 자유표면 차감<\/td><\/tr>\n<tr><td>용도<\/td><td>최종 평형(규정 계산)<\/td><td>침수 중간단계·부분 침수<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"calc\">Δ·GM_LB = (Δ + w)·GM_AW  (복원 모멘트 동일)<\/div>\n<h5>2. 투과율<\/h5><p>창고 0.60, 거주구 0.95, 기관구역 0.85, 공소 0.95 등(SOLAS II-1/7-3).<\/p>\n<p class=\"concl\"><b>3. 결론<\/b>: 결과(흘수·트림·경사·복원 모멘트)는 같고 GM 정의만 다르다는 점이 핵심임.<\/p><\/div><\/section><\/details>"},{"id":"damage-stability","p":1,"n":"1.7","h":"손상복원성: 결정론적 방법과 확률론적 방법","t":"손상복원성: 결정론적 방법과 확률론적 방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 3교시 4번 · 25점"],"q":["<b>118회(2019) 3-4<\/b> 손상 시 복원성 검토방법(결정론적 방법과 확률론적 방법)"],"k":"결정론적 방법은 규정된 손상 범위를 가정하고 그 상태의 생존 기준 만족 여부를 본다(MARPOL 유조선, IBC, IGC, ICLL B-60/B-100). 확률론적 방법은 가능한 모든 손상 경우에 발생확률 p와 생존확률 s를 곱해 합한 달성지수 A가 요구지수 R 이상인지 본다(SOLAS II-1 Part B-1, 화물선·여객선).","x":"\n<p class=\"key\">결정론적 방법은 규정된 손상 범위를 가정하고 그 상태의 생존 기준 만족 여부를 본다(MARPOL 유조선, IBC, IGC, ICLL B-60/B-100). 확률론적 방법은 가능한 모든 손상 경우에 발생확률 p와 생존확률 s를 곱해 합한 달성지수 A가 요구지수 R 이상인지 본다(SOLAS II-1 Part B-1, 화물선·여객선).<\/p>\n<h4>결정론적 방법 (예: MARPOL Annex I Reg. 28)<\/h4>\n<ul>\n<li><b>가정 손상<\/b>: 선측 손상 길이 ⅓L<sup>⅔<\/sup> 또는 14.5 m 중 작은 값, 깊이 B/5 또는 11.5 m 중 작은 값, 높이는 상방 무제한. 선저 손상도 별도 범위로 가정.<\/li>\n<li><b>생존 기준<\/b>: 최종 수선이 진행침수 개구 하단보다 아래, 최종 횡경사 25° 이하(갑판 끝 미침수 시 30°), 평형점 이후 복원 범위 20° 이상, 그 범위 내 최대 GZ 0.1 m 이상, 면적 0.0175 m·rad 이상.<\/li>\n<li>장점: 명확하고 검증이 쉽다. 단점: 가정 손상 밖의 사고 위험을 평가하지 못하고, 구획배치 최적화 유인이 약하다.<\/li>\n<\/ul>\n<h4>확률론적 방법 (SOLAS II-1 Reg. 6~7)<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[A=\\sum p_i\\,s_i\\,v_i\\ \\ge\\ R,\\qquad A=0.4A_s+0.4A_p+0.2A_l\\]<\/div><span class=\"c\">p: 손상 구획 조합이 침수될 확률(손상 위치·길이 통계), s: 그 침수 상태에서 생존할 확률, v: 수평 구획(갑판) 위쪽이 침수되지 않을 확률. s·p·l은 최대 구획흘수, 부분흘수, 경하운항흘수<\/span><\/div>\n<div class=\"eq\"><div class=\"mj\">\\[s_{final}=K\\left[\\dfrac{GZ_{max}}{0.12}\\cdot\\dfrac{\\mathrm{Range}}{16}\\right]^{1/4}\\]<\/div><span class=\"c\">GZ<sub>max<\/sub>는 0.12 m, Range는 16°를 상한으로 한다. K는 평형 경사각이 화물선 25°(여객선 7°) 이하이면 1, 30°(여객선 15°) 이상이면 0.<\/span><\/div>\n<div class=\"eq\"><div class=\"eql\">화물선, L<sub>s<\/sub> &gt; 100 m<\/div><div class=\"mj\">\\[R=1-\\dfrac{128}{L_s+152}\\]<\/div><\/div>\n<ul>\n<li>각 흘수의 부분지수 A<sub>s<\/sub>, A<sub>p<\/sub>, A<sub>l<\/sub>은 화물선 0.5R, 여객선 0.9R 이상이어야 한다.<\/li>\n<li>여객선은 승선인원 N에 따른 R을 쓰고(2020 개정), 추가로 결정론적 소손상(minor damage) 요건이 있다.<\/li>\n<\/ul>\n<h4>비교와 설계 영향<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>결정론적<\/th><th>확률론적<\/th><\/tr><\/thead><tbody>\n<tr><td>철학<\/td><td>최악 가정 손상의 합격/불합격<\/td><td>전체 위험 수준의 통계적 확보<\/td><\/tr>\n<tr><td>설계 자유도<\/td><td>낮음(격벽 위치 규정적)<\/td><td>높음(격벽 배치를 A 최대화로 최적화)<\/td><\/tr>\n<tr><td>계산량<\/td><td>적음<\/td><td>많음(수백~수천 손상 조합)<\/td><\/tr>\n<tr><td>주 적용<\/td><td>유조선·케미컬·가스선, ICLL 건현 감소<\/td><td>건화물선·컨테이너선·여객선·로로선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>컨테이너선과 벌크선은 확률론 계산에서 A를 확보하려고 KG 한계(최대 허용 KG 곡선)를 만든다. 이 곡선이 적재지침서의 GM 요구치를 정하므로, 손상복원성은 화물 적재 능력과 직결된다. 공기관·통풍통 위치(진행침수점)가 s 값을 좌우하는 경우가 많다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 결정론적 방법<\/h5><p>규정 손상 범위 가정 → 생존 기준 확인(MARPOL Reg.28, IBC, IGC, ICLL B-60/100).<\/p><ul><li>선측 손상: 길이 ⅓L<sup>⅔<\/sup> 또는 14.5 m 중 작은 값, 폭 B/5 또는 11.5 m 중 작은 값<\/li><li>생존: 진행침수 개구 아래, 경사 ≤ 25°(30°), 범위 ≥ 20°, GZ ≥ 0.1 m, 면적 ≥ 0.0175 m·rad<\/li><\/ul>\n<h5>2. 확률론적 방법(SOLAS II-1 Part B-1)<\/h5><div class=\"calc\">A = Σ p·s·v ≥ R,  A = 0.4A_s + 0.4A_p + 0.2A_l\ns = K·[(GZmax/0.12)·(Range/16)]^¼\n화물선 R(L_s > 100 m) = 1 − 128/(L_s + 152)<\/div><p>부분지수 ≥ 0.5R(화물선)·0.9R(여객선).<\/p>\n<h5>3. 비교<\/h5><p>결정론: 명확·단순, 설계 자유도 낮음 / 확률론: 전체 위험 수준, 격벽 최적화 자유, 계산량 큼.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 확률론 계산이 KG 한계곡선을 정해 적재 능력과 직결되므로, 격벽·개구 위치를 초기에 A 지수로 최적화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"load-line-marks","p":1,"n":"1.8","h":"만재흘수선의 개념과 만재흘수선표(Load Line Mark)","t":"만재흘수선의 개념과 만재흘수선표(Load Line Mark)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 6번 · 25점"],"q":["<b>112회(2017) 2-6<\/b> 만재흘수선의 개념과 만재흘수선표 각 약어"],"k":"만재흘수선은 선박이 안전하게 항해할 수 있는 최대 흘수, 즉 최소 건현을 표시한 선이다. 국제만재흘수선협약(ICLL 1966/1988 의정서)에 따라 계절대역과 수역별 밀도에 맞춰 여러 선으로 표시한다.","x":"\n<p class=\"key\">만재흘수선은 선박이 안전하게 항해할 수 있는 최대 흘수, 즉 최소 건현을 표시한 선이다. 국제만재흘수선협약(ICLL 1966/1988 의정서)에 따라 계절대역과 수역별 밀도에 맞춰 여러 선으로 표시한다.<\/p>\n<h4>목적<\/h4>\n<p>건현(freeboard)은 예비부력을 확보해 파랑 중 갑판 침수, 선체강도 초과, 복원성 부족을 막는다. 선박안전법은 만재흘수선을 \"여객이나 화물을 승선하거나 싣고 안전하게 항해할 수 있는 최대한도를 나타내는 선\"으로 정의한다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 500 230\" role=\"img\" aria-label=\"만재흘수선 표지\">\n<line x1=\"40\" y1=\"30\" x2=\"140\" y2=\"30\" class=\"ln\" style=\"stroke-width:4\"/><text x=\"40\" y=\"22\" class=\"t2\">갑판선 300×25 mm<\/text>\n<circle cx=\"90\" cy=\"120\" r=\"34\" class=\"ln\" style=\"stroke-width:3\"/>\n<line x1=\"38\" y1=\"120\" x2=\"142\" y2=\"120\" class=\"ln\" style=\"stroke-width:3\"/>\n<text x=\"62\" y=\"112\" class=\"t1\">K<\/text><text x=\"108\" y=\"112\" class=\"t1\">R<\/text>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"200\" class=\"ln\" style=\"stroke-width:3\"/>\n<g class=\"t1\">\n<line x1=\"200\" y1=\"78\" x2=\"250\" y2=\"78\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"256\" y=\"82\">TF 열대 담수<\/text>\n<line x1=\"200\" y1=\"96\" x2=\"250\" y2=\"96\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"256\" y=\"100\">F 하기 담수<\/text>\n<line x1=\"150\" y1=\"104\" x2=\"200\" y2=\"104\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"160\" y=\"98\" class=\"t2\">T<\/text>\n<line x1=\"150\" y1=\"120\" x2=\"200\" y2=\"120\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"160\" y=\"114\" class=\"t2\">S<\/text>\n<line x1=\"150\" y1=\"136\" x2=\"200\" y2=\"136\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"160\" y=\"130\" class=\"t2\">W<\/text>\n<line x1=\"150\" y1=\"148\" x2=\"200\" y2=\"148\" class=\"ln\" style=\"stroke-width:3\"/><text x=\"154\" y=\"162\" class=\"t2\">WNA<\/text>\n<\/g>\n<text x=\"300\" y=\"130\" class=\"t2\">S: 하기 만재흘수(링 중심 높이)<\/text>\n<text x=\"300\" y=\"148\" class=\"t2\">T = S + 하기흘수/48<\/text>\n<text x=\"300\" y=\"166\" class=\"t2\">W = S − 하기흘수/48<\/text>\n<text x=\"300\" y=\"184\" class=\"t2\">WNA = W − 50 mm (L ≤ 100 m)<\/text>\n<text x=\"300\" y=\"202\" class=\"t2\">F = S + FWA, TF = T + FWA<\/text>\n<\/svg><figcaption>만재흘수선 표지. 링 외경 300 mm, 수평선 450 mm, 각 선 230×25 mm. 기호는 선체 우현·좌현 중앙에 표시한다.<\/figcaption><\/figure>\n<h4>약어<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>약어<\/th><th>의미<\/th><th>위치<\/th><\/tr><\/thead><tbody>\n<tr><td>S<\/td><td>Summer, 하기<\/td><td>링 중심선과 같은 높이(기준)<\/td><\/tr>\n<tr><td>W<\/td><td>Winter, 동기<\/td><td>S보다 하기흘수의 1/48 아래<\/td><\/tr>\n<tr><td>T<\/td><td>Tropical, 열대<\/td><td>S보다 하기흘수의 1/48 위<\/td><\/tr>\n<tr><td>F<\/td><td>Fresh water, 하기 담수<\/td><td>S보다 FWA 위<\/td><\/tr>\n<tr><td>TF<\/td><td>Tropical Fresh, 열대 담수<\/td><td>T보다 FWA 위<\/td><\/tr>\n<tr><td>WNA<\/td><td>Winter North Atlantic<\/td><td>W보다 50 mm 아래, L ≤ 100 m 선박만<\/td><\/tr>\n<tr><td>K R 등<\/td><td>건현 지정기관 약칭(한국선급 KR, DNV는 D N 또는 N V 등)<\/td><td>링 좌우<\/td><\/tr>\n<tr><td>L 접두(LS, LW …)<\/td><td>목재 만재흘수선(timber load line)<\/td><td>목재 갑판적 선박<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">Δ: 하기 만재흘수 배수량[t], TPC: 하기흘수의 매 cm 배수톤수[t/cm]<\/div><div class=\"mj\">\\[\\mathrm{FWA}\\ [\\mathrm{mm}]=\\dfrac{\\Delta}{40\\,\\mathrm{TPC}}\\]<\/div><\/div>\n<p>FWA는 해수(1.025)에서 담수(1.000)로 들어갈 때의 침하량이다. 비중 1.000~1.025 사이 기수에서는 비례 보간(DWA, dock water allowance)으로 추가 적재량을 정한다.<\/p>\n<div class=\"tip\"><p>표지 그림을 비율 맞춰 그리고(갑판선, 링, 수평선, 계절선) 각 선의 위치 규칙(1/48, FWA, 50 mm)을 쓰면 만점 구조다. 계절대역은 ICLL Annex II 해도에 따라 시기와 해역으로 정해진다는 점을 덧붙인다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 표지 그림 필수\">\n<h5>1. 개념<\/h5><p>안전 항해 가능 최대 흘수(최소 건현) 표시. 예비부력으로 갑판 침수·강도 초과·복원성 부족 방지(ICLL).<\/p>\n<h5>2. 표지(그림)<\/h5><p>갑판선 300×25 mm, 링 외경 300 mm·수평선 450 mm, 계절선 230×25 mm, 기관 약칭.<\/p>\n<div class=\"calc\">S: 링 중심 / T = S + 하기흘수/48 / W = S − 하기흘수/48\nWNA = W − 50 mm(L ≤ 100 m) / F = S + FWA / TF = T + FWA\nFWA = Δ/(40·TPC) mm<\/div>\n<h5>3. 약어<\/h5><p>S 하기, W 동기, T 열대, F 하기 담수, TF 열대 담수, WNA 동기 북대서양, KR 등 지정기관, L 접두 목재.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 계절대역은 ICLL Annex II 해도로 정해지며, 기수 항만은 DWA로 추가 적재량을 판단함.<\/p><\/div><\/section><\/details>"},{"id":"freeboard-types","p":1,"n":"1.9","h":"국제만재흘수선협약(ICLL)과 건현의 종류 (Type A, Type B, B-60, B-100)","t":"국제만재흘수선협약(ICLL)과 건현의 종류 (Type A, Type B, B-60, B-100)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 3교시 3번 · 25점","139회 1교시 7번 · 10점"],"q":["<b>115회(2018) 3-3<\/b> 국제만재흘수선협약과 본 협약에 규정된 건현의 종류","<b>139회(2026) 1-7<\/b> 국제만재흘수선협약의 Type A와 Type B"],"k":"ICLL은 선박을 Type A와 Type B로 나눠 서로 다른 건현표를 적용한다. Type A는 액체 산적화물 전용으로 갑판 개구가 작고 화물구역 투과율이 낮아 침수에 강하므로 더 작은 건현을 받는다. Type B는 그 밖의 선박이며, 손상 생존 능력을 입증하면 B-60, B-100으로 건현을 줄일 수 있다.","x":"\n<p class=\"key\">ICLL은 선박을 Type A와 Type B로 나눠 서로 다른 건현표를 적용한다. Type A는 액체 산적화물 전용으로 갑판 개구가 작고 화물구역 투과율이 낮아 침수에 강하므로 더 작은 건현을 받는다. Type B는 그 밖의 선박이며, 손상 생존 능력을 입증하면 B-60, B-100으로 건현을 줄일 수 있다.<\/p>\n<h4>협약의 구성<\/h4>\n<ul>\n<li>1966 ICLL과 1988 의정서. Annex I: 건현 산정 규칙(정의, 개구부 조건, 건현표, 수정), Annex II: 계절대역, Annex III: 증서.<\/li>\n<li>적용: 국제항해 선박 중 L ≥ 24 m(군함·어선·유람용 요트 등 제외).<\/li>\n<li>건현 조건 요건(conditions of assignment): 선체 강도, 개구부 폐쇄장치, 코밍 높이, 방수 배수구, 선원 보호, 선수 높이(Reg. 39) 등.<\/li>\n<\/ul>\n<h4>선형별 정의<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>조건<\/th><th>건현<\/th><\/tr><\/thead><tbody>\n<tr><td>Type A<\/td><td>액체 화물 산적 전용, 화물탱크 개구는 소형 수밀 강제 덮개, 노출갑판 고수밀성, 만재 시 화물구역 투과율 낮음. L &gt; 150 m이고 건현 감소를 받으면 1구획 침수 생존(투과율 0.95) 요구<\/td><td>Table A (가장 작음)<\/td><\/tr>\n<tr><td>Type B<\/td><td>Type A 이외(건화물선, 컨테이너선 등)<\/td><td>Table B<\/td><\/tr>\n<tr><td>B-60<\/td><td>L &gt; 100 m, 기관실을 제외한 어느 1구획 침수에도 Reg. 27 생존 기준 만족, 해치커버 등 추가 요건<\/td><td>Table B − 0.6 × (B − A 차이)<\/td><\/tr>\n<tr><td>B-100<\/td><td>인접 2구획 침수(기관실은 단독 1구획) 생존<\/td><td>Table B − 1.0 × (B − A 차이)<\/td><\/tr>\n<tr><td>증가 건현<\/td><td>해치커버가 규정 수밀성 미달 등<\/td><td>Table B보다 증가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>건현 산정 순서<\/h4>\n<ol>\n<li>표 건현(tabular freeboard): 건현 길이 L에 따라 Table A 또는 B에서 읽는다.<\/li>\n<li>수정: 블록계수 C<sub>b<\/sub> &gt; 0.68이면 × (C<sub>b<\/sub> + 0.68)/1.36, 깊이 D &gt; L/15이면 (D − L/15)·R 가산(R = L/0.48, L ≥ 120 m는 250), 선루·트렁크 공제, 현호(sheer) 수정.<\/li>\n<li>선수 높이 최소값(Reg. 39)과 최소 하기 건현 50 mm 확인.<\/li>\n<li>계절·담수 건현 산정 → 만재흘수선 표시.<\/li>\n<\/ol>\n<div class=\"pro\"><p>벌크선에서 B-60을 받으면 흘수를 수십 cm 깊게 할 수 있어 재화중량이 늘어난다. 대신 손상 시 생존 계산과 해치커버·공기관 위치 조건이 붙는다. 선주가 흘수 증가를 요구할 때 가장 먼저 보는 것이 이 건현 여유다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-3-3<\/td><td>ICLL과 건현의 종류<\/td><td class=\"num\">25<\/td><td>협약 구성, Type A·B·B-60·B-100, 산정 순서<\/td><\/tr>\n<tr><td class=\"num\">139-1-7<\/td><td>Type A와 Type B<\/td><td class=\"num\">10<\/td><td>정의 차이와 건현 차이 이유<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 139회형\">\n<h5>1. 정의<\/h5><ul><li><b>Type A<\/b>: 액체 화물 산적 전용, 화물탱크 개구가 작은 수밀 강제 덮개, 노출갑판 고수밀성, 만재 화물구역 투과율 낮음 → Table A(최소 건현)<\/li><li><b>Type B<\/b>: Type A 이외(건화물선·컨테이너선) → Table B<\/li><\/ul>\n<h5>2. 건현 차이의 이유<\/h5><p>Type A는 갑판 개구가 작고 화물이 공간을 채워 침수량이 적으므로 예비부력 요구가 작음. L &gt; 150 m에서 건현 감소를 받으면 1구획 침수 생존 요구.<\/p>\n<h5>3. Type B 감소<\/h5><p>B-60(1구획 침수 생존, B와 A 차의 60% 감소), B-100(인접 2구획, 100% 감소).<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 벌크선 B-60 적용은 흘수·재화중량 증가로 상업성이 크지만 손상 생존 계산과 해치커버 조건이 따라옴.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 115회형\">\n<h5>1. 개요<\/h5><p>ICLL(1966/1988 의정서)은 예비부력 확보를 위한 최소 건현과 건현 지정 조건을 정한 협약임(국제항해 L ≥ 24 m).<\/p>\n<h5>2. 협약 구성<\/h5><ul><li>Annex I: 정의, 지정 조건(개구 폐쇄·코밍 높이·선원 보호), 건현표·수정<\/li><li>Annex II: 계절대역 / Annex III: 증서<\/li><\/ul>\n<h5>3. 건현의 종류<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>조건<\/th><th>건현<\/th><\/tr><\/thead><tbody>\n<tr><td>Type A<\/td><td>액체 산적 전용, 소형 수밀 개구<\/td><td>Table A<\/td><\/tr>\n<tr><td>Type B<\/td><td>그 외<\/td><td>Table B<\/td><\/tr>\n<tr><td>B-60<\/td><td>L &gt; 100 m, 1구획 침수 생존<\/td><td>B − 0.6(B−A)<\/td><\/tr>\n<tr><td>B-100<\/td><td>인접 2구획 침수 생존<\/td><td>B − 1.0(B−A)<\/td><\/tr>\n<tr><td>증가 건현<\/td><td>해치커버 수밀성 미달 등<\/td><td>B보다 큼<\/td><\/tr>\n<tr><td>목재 건현<\/td><td>목재 갑판적<\/td><td>L 표시 별도<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 산정 순서<\/h5><p>표 건현 → C<sub>b<\/sub> 수정(&gt;0.68) → 깊이 수정(D &gt; L/15) → 선루·트렁크 공제 → 현호 수정 → 선수 높이(Reg.39)·최소 50 mm 확인 → 계절·담수 건현<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 건현은 강도·복원성·개구 폐쇄 조건과 묶인 안전 기준이므로, 흘수 증가 요구 시 건현 여유와 B-60 적용 가능성을 먼저 검토해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"freeboard-deck","p":1,"n":"1.10","h":"건현갑판(Freeboard Deck)과 건현깊이(Freeboard Depth)","t":"건현갑판(Freeboard Deck)과 건현깊이(Freeboard Depth)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 6번 · 10점"],"q":["<b>136회(2025) 1-6<\/b> 건현갑판(Freeboard Deck)과 건현깊이(Freeboard Depth)"],"k":"건현갑판은 건현을 재는 기준 갑판으로, 일반적으로 풍우와 해수에 노출된 최상층 전통갑판이며 노출부의 모든 개구에 영구 폐쇄장치가 있고 그 아래 선측 개구는 모두 영구 수밀 폐쇄장치를 갖춘 갑판이다. 건현깊이는 형깊이에 건현갑판 스트링거판 두께를 더한 값이다.","x":"\n<p class=\"key\">건현갑판은 건현을 재는 기준 갑판으로, 일반적으로 풍우와 해수에 노출된 최상층 전통갑판이며 노출부의 모든 개구에 영구 폐쇄장치가 있고 그 아래 선측 개구는 모두 영구 수밀 폐쇄장치를 갖춘 갑판이다. 건현깊이는 형깊이에 건현갑판 스트링거판 두께를 더한 값이다.<\/p>\n<h4>건현갑판 (ICLL Reg. 3(9))<\/h4>\n<ul>\n<li>원칙: 위 조건을 만족하는 최상층 완전갑판.<\/li>\n<li>불연속(단차) 갑판이면 노출부 최저선과 그 연장선을 건현갑판으로 본다.<\/li>\n<li>선주 선택으로 더 낮은 갑판을 건현갑판으로 지정할 수 있다. 이때 그 갑판은 선박 전장에 걸쳐 연속이고 선측까지 영구적이어야 하며, 그 위 공간은 건현 산정에서 선루로 취급할 수 있다.<\/li>\n<\/ul>\n<h4>건현깊이 (Reg. 3(5))<\/h4>\n<div class=\"eq\"><div class=\"eql\">t<sub>s<\/sub>: 노출 건현갑판 스트링거판 두께, t<sub>w<\/sub>: 노출갑판 목재 피복 평균 두께(피복이 있을 때만), S: 선루 합계 길이<\/div><div class=\"mj\">\\[D_F=D+t_s+\\dfrac{t_w\\,(L-S)}{L}\\]<\/div><\/div>\n<p>D는 선체 중앙 형깊이, L은 건현 길이다. 목재 피복이 없으면 마지막 항은 0이다. 건현은 갑판선 상단에서 해당 만재흘수선 상단까지의 수직거리다.<\/p>\n<h4>관계<\/h4>\n<ul>\n<li>건현깊이가 L/15보다 크면 깊이 수정으로 건현이 늘어난다(예비부력 비율 유지).<\/li>\n<li>건현갑판 위치는 개구부 코밍 높이, 공기관·통풍통 높이, 제1·제2위치 판정의 기준이 된다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 건현갑판<\/h5><p>노출부 개구 영구 폐쇄장치와 그 아래 선측 개구 수밀 폐쇄장치를 갖춘 최상층 완전갑판. 불연속이면 최저선 연장, 선주 선택으로 하부 갑판 지정 가능.<\/p>\n<h5>2. 건현깊이<\/h5><div class=\"calc\">D_F = D + t_s + t_w(L − S)/L  (t_s 스트링거판, t_w 목재 피복)<\/div>\n<p class=\"concl\"><b>3. 의견<\/b>: 코밍·공기관 높이와 제1·2위치 판정의 기준 갑판임.<\/p><\/div><\/section><\/details>"},{"id":"positions","p":1,"n":"1.11","h":"노출갑판의 위치: 제1위치(Position 1)와 제2위치(Position 2)","t":"노출갑판의 위치: 제1위치(Position 1)와 제2위치(Position 2)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 3번 · 10점"],"q":["<b>127회(2022) 1-3<\/b> 노출갑판의 위치(제1위치 &amp; 제2위치)"],"k":"ICLL Reg. 13은 노출갑판을 파랑 노출 정도에 따라 두 위치로 나누고, 위치마다 해치코밍·문턱·통풍통·공기관 높이와 덮개 설계하중을 다르게 요구한다. 선수부와 건현갑판이 가장 가혹한 제1위치다.","x":"\n<p class=\"key\">ICLL Reg. 13은 노출갑판을 파랑 노출 정도에 따라 두 위치로 나누고, 위치마다 해치코밍·문턱·통풍통·공기관 높이와 덮개 설계하중을 다르게 요구한다. 선수부와 건현갑판이 가장 가혹한 제1위치다.<\/p>\n<h4>정의<\/h4>\n<ul>\n<li><b>제1위치<\/b>: 노출 건현갑판과 높인 선미루갑판(raised quarter deck) 위, 그리고 선수수선(FP)에서 0.25L 이내의 노출 선루갑판 위.<\/li>\n<li><b>제2위치<\/b>: FP에서 0.25L보다 뒤쪽의 노출 선루갑판으로 건현갑판보다 표준 선루높이 1층 이상 높은 곳, 그리고 0.25L 이내라도 표준 선루높이 2층 이상 높은 곳.<\/li>\n<\/ul>\n<h4>위치별 대표 요구<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th class=\"num\">제1위치<\/th><th class=\"num\">제2위치<\/th><\/tr><\/thead><tbody>\n<tr><td>해치코밍 높이<\/td><td class=\"num\">600 mm<\/td><td class=\"num\">450 mm<\/td><\/tr>\n<tr><td>통풍통 코밍 높이<\/td><td class=\"num\">900 mm<\/td><td class=\"num\">760 mm<\/td><\/tr>\n<tr><td>공기관 높이 (Reg. 20)<\/td><td class=\"num\">760 mm(건현갑판)<\/td><td class=\"num\">450 mm(선루갑판)<\/td><\/tr>\n<tr><td>선루 출입문 문턱<\/td><td colspan=\"2\" class=\"num\">380 mm<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>해치커버 설계하중도 위치와 길이에 따라 달라진다(IACS UR S21, 선수부 0.25L 이내는 green sea 하중 강화).<\/p>\n<div class=\"pro\"><p>통풍통 높이가 900 mm를 넘으면(제1위치 4.5 m, 제2위치 2.3 m 초과) 폐쇄장치를 생략할 수 있다. 선수부 갑판 기기(통풍통, 공기관)는 UR S27의 green sea 하중으로 강도·브래킷을 검토한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의(ICLL Reg.13)<\/h5><ul><li>제1위치: 노출 건현갑판·높인 선미루갑판, FP에서 0.25L 이내 노출 선루갑판<\/li><li>제2위치: 0.25L 뒤 표준 선루높이 1층 이상, 0.25L 이내 2층 이상 노출 선루갑판<\/li><\/ul>\n<div class=\"calc\">해치코밍 600 / 450 mm, 통풍통 900 / 760 mm\n공기관 760(건현갑판) / 450 mm(선루갑판), 문턱 380 mm<\/div>\n<p class=\"concl\"><b>2. 의견<\/b>: 선수부 0.25L 이내는 green sea 하중(UR S26·S27)으로 갑판 기기 강도를 별도 검토함.<\/p><\/div><\/section><\/details>"},{"id":"air-pipe","p":1,"n":"1.12","h":"공기관(Air Pipe) 최소높이와, 손상복원성을 위한 공기관 높이 변경이 평형수탱크 구조에 미치는 영향","t":"공기관(Air Pipe) 최소높이와, 손상복원성을 위한 공기관 높이 변경이 평형수탱크 구조에 미치는 영향","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 4교시 2번 · 25점"],"q":["<b>136회(2025) 4-2<\/b> ICLL 공기관 최소높이와, 손상복원성을 위한 공기관 높이 변경이 평형수탱크 구조보강에 미치는 영향"],"k":"ICLL Reg. 20은 공기관이 갑판 위로 건현갑판 760 mm, 선루갑판 450 mm 이상 돌출하고 영구 자동폐쇄장치를 갖추도록 한다. 손상복원성에서는 공기관 출구가 진행침수점이므로 높이를 올리는 경우가 많은데, 공기관 상단이 높아지면 탱크 설계 정수두가 커져 평형수탱크 경계 부재의 판 두께와 보강재 단면이 증가한다.","x":"\n<p class=\"key\">ICLL Reg. 20은 공기관이 갑판 위로 건현갑판 760 mm, 선루갑판 450 mm 이상 돌출하고 영구 자동폐쇄장치를 갖추도록 한다. 손상복원성에서는 공기관 출구가 진행침수점이므로 높이를 올리는 경우가 많은데, 공기관 상단이 높아지면 탱크 설계 정수두가 커져 평형수탱크 경계 부재의 판 두께와 보강재 단면이 증가한다.<\/p>\n<h4>1. 최소높이 기준<\/h4>\n<ul>\n<li>갑판에서 물이 들어갈 수 있는 지점까지: 건현갑판 760 mm, 선루갑판 450 mm(Reg. 20).<\/li>\n<li>이 높이가 작업에 지장을 주면 주관청은 폐쇄장치 등을 조건으로 낮은 높이를 허용할 수 있다.<\/li>\n<li>자동폐쇄 헤드(볼 플로트형 등)는 IACS UR P3 형식승인품. 선수부 0.25L 이내는 UR S27 green sea 하중으로 관 두께·브래킷 강도 검토.<\/li>\n<\/ul>\n<h4>2. 손상복원성과의 관계<\/h4>\n<ul>\n<li>MARPOL Reg. 28, ICLL Reg. 27, SOLAS II-1 등은 최종 평형수선이 진행침수가 일어날 수 있는 개구의 하단보다 아래여야 한다고 하고, 이 개구에 공기관을 포함한다. 자동폐쇄장치가 있어도 풍우밀 장치이므로 진행침수점으로 본다.<\/li>\n<li>확률론 계산에서는 공기관이 잠기는 각도가 GZ 범위(Range)를 자르므로 s 값이 떨어진다.<\/li>\n<li>대책은 출구 높이 상향, 중심선 쪽으로 이동(잠기는 경사각 증가), 상층 갑판으로 이설.<\/li>\n<\/ul>\n<h4>3. 높이 상향이 평형수탱크 구조에 미치는 영향<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[P_{static}=\\rho g\\,(z_{top}+h_{air}-z)\\]<\/div><span class=\"c\">CSR의 탱크 정적압력: z<sub>top<\/sub>은 탱크 정부, h<sub>air<\/sub>는 탱크 정부 위 공기관(또는 오버플로관) 높이. 공기관 상단이 올라가면 탱크 내 모든 점의 정수두가 같은 양만큼 커진다.<\/span><\/div>\n<ul>\n<li><b>판 두께<\/b>: t ∝ s·√p 이므로 압력 증가의 제곱근 비율로 증가.<\/li>\n<li><b>보강재<\/b>: 요구 단면계수 Z ∝ p·s·ℓ² 이므로 압력에 비례해 증가.<\/li>\n<li><b>탱크 정부·종격벽·횡격벽<\/b>: 정수두 증가 영향이 상대적으로 가장 크다(원래 정수두가 작은 탱크 상부 부재).<\/li>\n<li><b>시험수두<\/b>: UR S14의 수압시험 수두(오버플로 상단, 탱크 정부 + 2.4 m, PV 밸브 설정압 중 큰 값)도 오버플로 높이를 따라 상승할 수 있다.<\/li>\n<li><b>공기관 자체<\/b>: 길이가 늘어 갑판 관통부의 굽힘 모멘트와 진동이 커지므로 지지 브래킷·두께 보강.<\/li>\n<\/ul>\n<h4>4. 기술사 판단<\/h4>\n<p>공기관 상향은 손상복원성의 가장 값싼 대책처럼 보이지만, 탱크 구조 중량과 FE 재해석 비용을 부른다. 먼저 출구를 중심선 쪽으로 옮겨 잠기는 각도를 키우는 방안을 검토하고, 높이 상향이 불가피하면 탱크 정부 근처만 압력 상승분을 반영해 국부 보강하는 순서로 접근한다. 변경은 선급 승인 도면(탱크 시험 수두 포함)에 반영한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 최소높이(ICLL Reg.20)<\/h5><p>건현갑판 760 mm, 선루갑판 450 mm, 자동폐쇄 헤드(UR P3), 선수부 UR S27.<\/p>\n<h5>2. 손상복원성과의 관계<\/h5><p>공기관은 자동폐쇄장치가 있어도 진행침수점 → 최종 수선이 출구보다 아래여야 함, 확률론 Range 절단 → s 감소 → 출구 상향·중심선 이동·상층 이설.<\/p>\n<h5>3. 평형수탱크 구조 영향<\/h5><div class=\"calc\">P = ρg(z_top + h_air − z) → 공기관 상단 상승분만큼 전 수두 증가\n판 t ∝ √p,  보강재 Z ∝ p<\/div><ul><li>탱크 정부·상부 부재 영향 최대(원래 수두 작음)<\/li><li>시험수두(오버플로 상단) 상승 가능<\/li><li>공기관 자체 굽힘·진동 보강<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 먼저 출구를 중심선 쪽으로 옮겨 침수각을 키우고, 상향이 불가피하면 상부 부재 국부 보강으로 중량 증가를 최소화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"scantling-draft","p":1,"n":"1.13","h":"구조흘수(Scantling Draft)","t":"구조흘수(Scantling Draft)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 8번 · 10점"],"q":["<b>115회(2018) 1-8<\/b> 구조흘수(Scantling draft)"],"k":"구조흘수는 선체 구조 치수를 결정할 때 쓰는 최대 흘수로, 이 흘수에서 외부 수압·선체거더 하중을 계산해 부재를 설계한다. 하기 만재흘수 이상이어야 하며, 설계(서비스) 흘수보다 크게 잡아 선주가 흘수 여유를 갖도록 하는 것이 일반적이다.","x":"\n<p class=\"key\">구조흘수는 선체 구조 치수를 결정할 때 쓰는 최대 흘수로, 이 흘수에서 외부 수압·선체거더 하중을 계산해 부재를 설계한다. 하기 만재흘수 이상이어야 하며, 설계(서비스) 흘수보다 크게 잡아 선주가 흘수 여유를 갖도록 하는 것이 일반적이다.<\/p>\n<h4>흘수의 구분<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>흘수<\/th><th>정의<\/th><th>쓰임<\/th><\/tr><\/thead><tbody>\n<tr><td>설계흘수 T<sub>d<\/sub><\/td><td>속력·연비 보증의 기준 흘수<\/td><td>선형·추진 설계, 계약 속력<\/td><\/tr>\n<tr><td>하기 만재흘수 T<sub>S<\/sub><\/td><td>ICLL로 지정된 최대 허용 흘수<\/td><td>재화중량, 건현<\/td><\/tr>\n<tr><td>구조흘수 T<sub>sc<\/sub><\/td><td>강도 계산의 최대 흘수 (T<sub>sc<\/sub> ≥ T<sub>S<\/sub>)<\/td><td>외판·저판 수압, 선체거더 하중, 화물창 FE<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>CSR에서 구조흘수는 해수압(정수압 + 파랑동압)의 기준이며, 선체거더 파랑하중 공식의 C<sub>b<\/sub>도 구조흘수 기준이다.<\/li>\n<li>만재흘수선을 구조흘수보다 깊게 지정할 수는 없다. 구조흘수를 키우면 외판·이중저·늑골 치수와 강재중량이 증가한다.<\/li>\n<\/ul>\n<div class=\"pro\"><p>선주가 \"향후 흘수 증가 가능성\"을 원하면 처음부터 구조흘수를 하기흘수보다 0.3~0.5 m 크게 잡고 만재흘수선은 계약값으로 지정한다. 나중에 건현 여유만 있으면 재검토 없이 흘수를 늘릴 수 있다(다음 주제 참고).<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>구조 치수 결정에 쓰는 최대 흘수(T<sub>sc<\/sub> ≥ 하기 만재흘수).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>흘수<\/th><th>쓰임<\/th><\/tr><\/thead><tbody>\n<tr><td>설계흘수<\/td><td>속력·연비 보증<\/td><\/tr>\n<tr><td>하기 만재흘수<\/td><td>DWT·건현<\/td><\/tr>\n<tr><td>구조흘수<\/td><td>외판 수압, 선체거더 하중, FE<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 구조흘수를 하기흘수보다 0.3~0.5 m 크게 잡으면 향후 흘수 증가에 재검토 부담이 줄어듦.<\/p><\/div><\/section><\/details>"},{"id":"draft-increase","p":1,"n":"1.14","h":"인도 전 선주의 Scantling Draught(하기 만재흘수 포함) 증가 요구 시 검토사항","t":"인도 전 선주의 Scantling Draught(하기 만재흘수 포함) 증가 요구 시 검토사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 4교시 6번 · 25점"],"q":["<b>130회(2023) 4-6<\/b> 인도 전 선주의 Scantling draught 증가 요구 시 검토사항"],"k":"흘수 증가는 강도·건현·복원성·추진·의장·증서 전반을 건드리는 설계변경이다. 기술사는 영향 범위를 항목별로 판정하고(재계산 필요/불필요), 보강 물량과 공정·비용을 산출해 선주와 선급 승인 경로를 제시해야 한다.","x":"\n<p class=\"key\">흘수 증가는 강도·건현·복원성·추진·의장·증서 전반을 건드리는 설계변경이다. 기술사는 영향 범위를 항목별로 판정하고(재계산 필요/불필요), 보강 물량과 공정·비용을 산출해 선주와 선급 승인 경로를 제시해야 한다.<\/p>\n<h4>1. 선체 구조<\/h4>\n<ul>\n<li><b>국부 강도<\/b>: 외판·이중저·선측 늑골의 해수압 증가 → 판 두께, 보강재 단면계수 재검토. 하부 부재가 가장 민감.<\/li>\n<li><b>선체거더 강도<\/b>: 정수중 굽힘모멘트·전단력 허용값과 단면계수 재검토(C<sub>b<\/sub> 증가로 파랑하중 증가). 종강도 계산서, 화물창 FE(직접강도) 재해석.<\/li>\n<li><b>피로<\/b>: 흘수 증가로 선측 종늑골의 동압 변동 영향 범위가 바뀌므로 수선 부근 종늑골 연결부 피로수명 재평가.<\/li>\n<li><b>슬래밍·선수부<\/b>: 밸러스트 흘수가 그대로면 영향 적음. 만재 상태 선수 플레어 하중 재확인.<\/li>\n<\/ul>\n<h4>2. 건현·만재흘수선<\/h4>\n<ul>\n<li>ICLL 최소 건현과 선수 높이(Reg. 39) 만족 여부. 부족하면 B-60 적용 가능성(손상 생존 계산 필요) 검토.<\/li>\n<li>개구부 코밍·공기관 높이는 그대로이나 침수각 여유 감소.<\/li>\n<\/ul>\n<h4>3. 복원성<\/h4>\n<ul>\n<li>비손상: 새 만재 상태와 대표 적재상태 재계산.<\/li>\n<li>손상: 확률론 계산의 최대 구획흘수 d<sub>s<\/sub>가 바뀌어 d<sub>p<\/sub>, A 지수 전부 재계산. 결정론 적용 선종은 생존 기준 재확인. KG 한계곡선 갱신.<\/li>\n<li>적재지침서, 적하지침기기 데이터 갱신 및 재승인.<\/li>\n<\/ul>\n<h4>4. 추진·성능<\/h4>\n<ul>\n<li>같은 동력에서 속력 감소, 프로펠러 하중 증가 → 회전수 여유(light running margin), 캐비테이션 재검토.<\/li>\n<li>EEDI: 분모 capacity(DWT) 증가로 달성값은 유리해질 수 있으나, 시운전 속력-동력 곡선을 새 흘수에 맞춰 보정하고 재검증.<\/li>\n<li>타 면적 비율, 선회 성능(IMO 조종성 기준) 재확인.<\/li>\n<\/ul>\n<h4>5. 의장·기타<\/h4>\n<ul>\n<li>의장수 EN(Δ<sup>⅔<\/sup> 증가, 건현 감소에 따른 h 감소) 재계산 → 앵커·체인 등급 변화 여부.<\/li>\n<li>흘수표(draft mark), 해수 흡입구(sea chest) 위치, 선외 배출구, 도장 경계(boot-top) 범위.<\/li>\n<li>톤수(순톤수 산정식에 흘수 항 포함), 각종 증서 갱신.<\/li>\n<\/ul>\n<h4>6. 진행 절차<\/h4>\n<ol>\n<li>영향 매트릭스 작성(항목별 재계산 필요 여부, 소요 기간).<\/li>\n<li>구조 보강 물량 산정 → 블록 공정 단계별 반영 가능 시점 확인(탑재 후 보강은 비용 급증).<\/li>\n<li>선급 도면 재승인, 증서 재발급 일정.<\/li>\n<li>계약 변경: 가격·인도일·보증 재화중량 조정(Change Order).<\/li>\n<\/ol>\n<div class=\"pro\"><p>\"충분한 시간적 여유\"가 있다는 조건은 공정상 보강이 아직 가능하다는 뜻이다. 답안 결론에는 \"구조흘수에 이미 여유가 있으면 건현·복원성 재승인만으로 가능, 없으면 보강 물량과 공정 영향으로 판단\"이라는 분기 판단을 쓴다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 구조<\/h5><p>외판·이중저 수압 → 국부 치수, SWBM·Z·C<sub>b<\/sub> → 종강도, 화물창 FE, 수선부 종늑골 피로.<\/p>\n<h5>2. 건현<\/h5><p>ICLL 최소 건현·선수 높이, 부족 시 B-60 검토.<\/p>\n<h5>3. 복원성<\/h5><p>비손상 재계산, 확률론 d<sub>s<\/sub> 변경 → A 재계산, KG 한계곡선, 적재지침서·적하지침기기 재승인.<\/p>\n<h5>4. 추진<\/h5><p>속력 감소, 프로펠러 하중·캐비테이션, EEDI 재검증, 조종성.<\/p>\n<h5>5. 의장·기타<\/h5><p>의장수 재계산, 흘수표·씨체스트·boot-top, 톤수·증서.<\/p>\n<h5>6. 절차<\/h5><ol><li>영향 매트릭스<\/li><li>보강 물량·공정 시점<\/li><li>선급 재승인<\/li><li>Change Order(가격·인도일·보증)<\/li><\/ol>\n<p class=\"concl\"><b>7. 결론<\/b>: 구조흘수 여유가 있으면 건현·복원성 재승인만으로 가능, 없으면 보강 물량과 공정 영향으로 수용 여부를 판단함.<\/p><\/div><\/section><\/details>"},{"id":"loading-instrument","p":1,"n":"1.15","h":"적하지침기기(Loading Instrument / Loading Computer)","t":"적하지침기기(Loading Instrument / Loading Computer)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 5번 · 10점"],"q":["<b>127회(2022) 1-5<\/b> 적하지침기기(Loading Instrument)"],"k":"적하지침기기는 선박에 탑재된 승인 소프트웨어로, 적재상태별 정수중 전단력·굽힘모멘트와 복원성을 계산해 허용치 이내인지 판정한다. 적재지침서(loading manual)를 보완하는 장치이며, 대형선과 액체화물선에는 탑재가 의무다.","x":"\n<p class=\"key\">적하지침기기는 선박에 탑재된 승인 소프트웨어로, 적재상태별 정수중 전단력·굽힘모멘트와 복원성을 계산해 허용치 이내인지 판정한다. 적재지침서(loading manual)를 보완하는 장치이며, 대형선과 액체화물선에는 탑재가 의무다.<\/p>\n<h4>근거와 종류<\/h4>\n<ul>\n<li><b>IACS UR S1 / S1A<\/b>: Category I 선박(대형 산적선·유조선·컨테이너선 등)은 강도 계산용 적하지침기기 필수. 지정된 계산점에서 SF·BM을 허용값과 비교.<\/li>\n<li><b>IACS UR L5<\/b>: 복원성 계산 소프트웨어 형식. Type 1(비손상만), Type 2(비손상 + 한계 KG 곡선으로 손상 판정), Type 3(손상 상태 직접 계산).<\/li>\n<li>MARPOL Annex I Reg. 28.6, IBC, IGC: 유조선·케미컬선·가스선은 비손상과 손상 복원성을 모두 확인할 수 있는 복원성 계산기 탑재.<\/li>\n<\/ul>\n<h4>기능<\/h4>\n<ul>\n<li>중량 입력(화물·밸러스트·연료) → 배수량·흘수·트림·횡경사 계산.<\/li>\n<li>종강도: 각 단면의 SF·BM을 항해·항내 허용값과 비교(% 표시).<\/li>\n<li>복원성: GZ 곡선, IS Code 기준, 곡물 이동 모멘트, 손상 판정.<\/li>\n<li>벌크선: 화물창 국부 하중(hold mass curve), 이중저 허용 하중 확인.<\/li>\n<\/ul>\n<h4>승인과 유지<\/h4>\n<ul>\n<li>선급이 소프트웨어 형식승인과 선박별 데이터 승인을 하고, 시험 적재상태(test conditions)를 증서와 함께 탑재.<\/li>\n<li>연차검사마다 시험 적재상태 재현으로 정확도 확인(허용 오차 내).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>적재상태별 SF·BM과 복원성을 계산해 허용치를 판정하는 승인 탑재 소프트웨어.<\/p>\n<h5>2. 근거·종류<\/h5><p>IACS UR S1(Category I 강도용), UR L5 복원성 Type 1(비손상)·2(한계 KG)·3(손상 직접), MARPOL Reg.28.6 등.<\/p>\n<h5>3. 기능·관리<\/h5><p>흘수·트림, SF·BM %, GZ·IS 기준, 화물창 국부 하중 / 선급 형식·선박 승인, 연차검사 시험 적재상태 확인.<\/p><\/div><\/section><\/details>"},{"id":"flare","p":1,"n":"1.16","h":"Flare와 Tumblehome","t":"Flare와 Tumblehome","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 4번 · 10점"],"q":["<b>130회(2023) 1-4<\/b> Flare &amp; Tumblehome"],"k":"Flare는 수선 위 선측이 갑판으로 갈수록 바깥으로 벌어지는 형상, Tumblehome은 반대로 안쪽으로 오므라드는 형상이다. 둘 다 대각도 복원성, 예비부력, 갑판 면적, 파랑 하중에 영향을 준다.","x":"\n<p class=\"key\">Flare는 수선 위 선측이 갑판으로 갈수록 바깥으로 벌어지는 형상, Tumblehome은 반대로 안쪽으로 오므라드는 형상이다. 둘 다 대각도 복원성, 예비부력, 갑판 면적, 파랑 하중에 영향을 준다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Flare<\/th><th>Tumblehome<\/th><\/tr><\/thead><tbody>\n<tr><td>형상<\/td><td>선측이 위로 벌어짐(특히 선수부)<\/td><td>선측이 위로 오므라듦<\/td><\/tr>\n<tr><td>장점<\/td><td>예비부력·갑판 면적 증가, 선수 갑판 침수(green water)·물보라 감소, 대각도에서 수선 폭 증가로 GZ 증가<\/td><td>상부 중량 감소로 KG 저하, 레이더 반사면적 감소(스텔스 함정), 안벽 크레인·구조물과의 간섭 회피<\/td><\/tr>\n<tr><td>단점<\/td><td>선수 플레어 슬래밍 충격 하중(대형 컨테이너선), 국부 보강 필요<\/td><td>대각도 복원성 감소, 갑판 면적 감소, 파랑 중 횡동요 특성 불리<\/td><\/tr>\n<tr><td>적용<\/td><td>컨테이너선 선수, 어선, 쇄빙 이외 대부분 상선<\/td><td>과거 범선·전함, 현대 스텔스 구축함(DDG-1000)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>초대형 컨테이너선의 선수 플레어는 적재량(갑판 위 bay 폭)에 유리하지만, 플레어 각이 크면 bow flare slamming 압력이 커져 선수부 외판·늑골 보강과 휘핑(whipping)에 의한 선체거더 진동 하중이 증가한다. 선급 규칙은 플레어 각과 속력에 따른 슬래밍 압력을 별도로 요구한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Flare<\/th><th>Tumblehome<\/th><\/tr><\/thead><tbody>\n<tr><td>형상<\/td><td>위로 벌어짐<\/td><td>위로 오므라듦<\/td><\/tr>\n<tr><td>장점<\/td><td>예비부력·갑판 면적↑, green water↓, 대각도 GZ↑<\/td><td>KG↓, RCS↓, 구조물 간섭 회피<\/td><\/tr>\n<tr><td>단점<\/td><td>플레어 슬래밍·휘핑<\/td><td>대각도 복원성↓, 갑판 면적↓<\/td><\/tr>\n<tr><td>적용<\/td><td>컨테이너선 선수<\/td><td>스텔스 함정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 대형 컨테이너선 플레어는 적재량과 슬래밍 하중의 절충임.<\/p><\/div><\/section><\/details>"},{"id":"repose","p":1,"n":"1.17","h":"안식각(Angle of Repose)","t":"안식각(Angle of Repose)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 1번 · 10점"],"q":["<b>139회(2026) 1-1<\/b> repose angle"],"k":"안식각은 비점착성 산적화물을 쌓았을 때 원뿔 사면이 수평면과 이루는 최대 각도다. 화물 이동(shifting) 가능성과 트리밍(trimming) 요구를 결정하는 IMSBC Code의 핵심 물성이다.","x":"\n<p class=\"key\">안식각은 비점착성 산적화물을 쌓았을 때 원뿔 사면이 수평면과 이루는 최대 각도다. 화물 이동(shifting) 가능성과 트리밍(trimming) 요구를 결정하는 IMSBC Code의 핵심 물성이다.<\/p>\n<h4>의미와 측정<\/h4>\n<ul>\n<li>마찰과 입자 형상에 따라 정해지며, 작을수록 잘 흐른다(곡물 약 20~30°, 석탄·광석 30~40°대).<\/li>\n<li>측정: 경사상자법(tilting box, 입경 10 mm 이하), 선상 간이시험(shipboard test method).<\/li>\n<\/ul>\n<h4>IMSBC Code 요구<\/h4>\n<ul>\n<li>안식각 30° 이하인 비점착성 화물은 곡물에 준하는 규정으로 운송(화물 이동 모멘트 검토).<\/li>\n<li>30~35°: 화물창 내 표면 고르기(트리밍)로 경사 표면 높이차 제한.<\/li>\n<li>35° 초과: 사면이 안정되도록 트리밍.<\/li>\n<li>곡물은 SOLAS VI와 국제곡물코드: 곡물 이동에 의한 횡경사 12° 이하, 잔여 복원 면적 0.075 m·rad 이상 등.<\/li>\n<\/ul>\n<h4>설계와의 연결<\/h4>\n<p>벌크선 화물창 상부의 topside tank 경사판(약 30°)은 안식각 수준으로 두어 창 상부 빈 공간을 줄이고 화물 이동을 억제한다. 하부 hopper 경사(약 40~50°)는 하역 시 화물이 중앙으로 흘러내리게 한다(self-trimming).<\/p>\n<div class=\"warn\"><p>안식각은 액상화(liquefaction) 위험과 별개다. 니켈광·철광 분광처럼 수분이 TML(운송허용수분치)을 넘으면 안식각과 관계없이 액상화되어 전복할 수 있다(IMSBC Group A).<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>비점착성 산적화물 원뿔 사면과 수평면의 최대 각(곡물 약 20~30°, 석탄·광석 30~40°대). 경사상자법·선상시험.<\/p>\n<h5>2. IMSBC<\/h5><p>≤ 30°: 곡물 준용(이동 모멘트) / 30~35°: 트리밍 / &gt; 35°: 사면 안정 트리밍. 곡물: 경사 12° 이하, 잔여 면적 0.075 m·rad.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: topside tank 경사(약 30°)는 안식각 수준으로 둠. 액상화(TML 초과)는 안식각과 무관한 별도 위험임.<\/p><\/div><\/section><\/details>"},{"id":"re-bernoulli","p":2,"n":"2.1","h":"레이놀즈(Reynolds) 수와 베르누이(Bernoulli) 방정식","t":"레이놀즈(Reynolds) 수와 베르누이(Bernoulli) 방정식","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 5번 · 10점"],"q":["<b>121회(2020) 1-5<\/b> 레이놀즈(Reynolds) 수 및 베르누이(Bernoulli) 방정식"],"k":"레이놀즈 수 Re = VL/ν는 관성력과 점성력의 비로, 마찰저항과 경계층 상태(층류·난류)를 결정한다. 베르누이 방정식 p + ½ρV² + ρgz = const는 비점성·비압축 정상류에서 유선을 따라 에너지가 보존된다는 식으로, 선체 압력분포와 캐비테이션을 설명한다.","x":"\n<p class=\"key\">레이놀즈 수 Re = VL/ν는 관성력과 점성력의 비로, 마찰저항과 경계층 상태(층류·난류)를 결정한다. 베르누이 방정식 p + ½ρV² + ρgz = const는 비점성·비압축 정상류에서 유선을 따라 에너지가 보존된다는 식으로, 선체 압력분포와 캐비테이션을 설명한다.<\/p>\n<h4>레이놀즈 수<\/h4>\n<div class=\"eq\"><div class=\"eql\">해수 15 °C에서 ν ≈ 1.19 × 10⁻⁶ m²/s<\/div><div class=\"mj\">\\[Re=\\dfrac{V\\,L}{\\nu}\\]<\/div><\/div>\n<ul>\n<li>실선 300 m, 20 kn이면 Re ≈ 2.6 × 10⁹, 모형선(1/40)은 약 10⁷. 모형시험에서 Fn을 맞추면 Re는 맞출 수 없으므로 마찰저항은 별도 외삽한다(ITTC 1957 마찰선 C<sub>F<\/sub> = 0.075/(log₁₀Re − 2)²).<\/li>\n<li>평판 기준 천이 Re는 약 5 × 10⁵. 모형선은 선수부 층류 영역이 넓어 난류촉진장치(stud, trip wire)를 선수 5% 위치에 둔다.<\/li>\n<\/ul>\n<h4>베르누이 방정식<\/h4>\n<div class=\"eq\"><div class=\"eql\">같은 유선 위, 정상·비점성·비압축 흐름<\/div><div class=\"mj\">\\[p+\\tfrac12\\rho V^2+\\rho g z=\\mathrm{const.}\\]<\/div><\/div>\n<ul>\n<li>유속이 빨라지는 곳(선수 어깨부, 프로펠러 날개 흡입면)은 압력이 낮아진다. 압력이 증기압 아래로 떨어지면 캐비테이션.<\/li>\n<li>선수 정체점 압력 상승 → 선수파, 선미 압력 회복 실패 → 점성압력저항.<\/li>\n<li>피토관 선속계, 벤투리 유량계의 원리.<\/li>\n<\/ul>\n<div class=\"tip\"><p>두 식을 쓰고 각각 \"선박에서 어디에 쓰이는가\"(모형시험 상사, 캐비테이션)를 연결하면 10점 답안이 완성된다. Froude 수(Fn = V/√gL)와 대비해 \"Fn·Re 동시 상사 불가\"를 쓰면 가점.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 레이놀즈 수<\/h5><div class=\"calc\">Re = V·L/ν  (관성력/점성력, 해수 15 °C ν ≈ 1.19×10⁻⁶ m²/s)<\/div><p>마찰저항·경계층 상태 결정. 실선 약 10⁹, 모형 약 10⁷ → 모형시험에서 Fn과 Re 동시 상사 불가 → 마찰저항 별도 외삽(ITTC 1957).<\/p>\n<h5>2. 베르누이 방정식<\/h5><div class=\"calc\">p + ½ρV² + ρgz = 일정 (유선상, 정상·비점성·비압축)<\/div><p>유속 증가부 압력 감소 → 날개 흡입면 저압 → 캐비테이션, 선수 정체압, 피토 선속계.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: Re는 점성 상사, 베르누이는 압력분포 해석의 기초로 모형시험 외삽과 캐비테이션 판단에 쓰임.<\/p><\/div><\/section><\/details>"},{"id":"boundary-layer","p":2,"n":"2.2","h":"유체흐름의 경계층(Boundary Layer)","t":"유체흐름의 경계층(Boundary Layer)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 13번 · 10점"],"q":["<b>121회(2020) 1-13<\/b> 유체흐름의 경계층(Boundary layer)"],"k":"경계층은 점성 때문에 물체 표면(속도 0)에서 외부 유속까지 속도가 변하는 얇은 층이다. 선체 마찰저항, 선미 반류, 박리에 의한 점성압력저항이 모두 경계층에서 생긴다.","x":"\n<p class=\"key\">경계층은 점성 때문에 물체 표면(속도 0)에서 외부 유속까지 속도가 변하는 얇은 층이다. 선체 마찰저항, 선미 반류, 박리에 의한 점성압력저항이 모두 경계층에서 생긴다.<\/p>\n<h4>특성<\/h4>\n<ul>\n<li>두께 δ: 유속이 외부 유속의 99%가 되는 거리. 평판 층류 δ/x ≈ 5/√Re<sub>x<\/sub>, 난류 δ/x ≈ 0.37 Re<sub>x<\/sub><sup>−1/5<\/sup>. 대형선 선미에서는 1 m를 넘는다.<\/li>\n<li>층류 → 천이 → 난류. 난류는 벽면 전단응력이 커서 마찰저항이 크지만 박리에 강하다.<\/li>\n<li>역압력구배(선미에서 압력 회복) 구간에서 경계층이 두꺼워지고 박리하면 와류와 점성압력저항이 생긴다.<\/li>\n<\/ul>\n<h4>선박에서의 의미<\/h4>\n<ul>\n<li>마찰저항은 저속 비대선에서 전체 저항의 70~90%. 선체 거칠기(도막, 오손)가 경계층을 통해 저항을 키운다.<\/li>\n<li>선미 경계층이 프로펠러 유입 속도를 줄여 반류(wake)가 되고, 이것이 선체효율 η<sub>H<\/sub>를 1보다 크게 만든다.<\/li>\n<li>모형선은 Re가 작아 경계층이 상대적으로 두껍다. 그래서 모형 반류계수가 실선보다 크고, 축척 보정이 필요하다.<\/li>\n<li>공기윤활(ALS)은 경계층 하부에 공기층을 넣어 벽면 전단응력을 줄이는 기술이다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p
