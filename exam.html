>선박 적용 과제는 단가와 수명, 출력 밀도, 연료 저장(수소 체적), 부하 변동 대응(배터리 하이브리드 필요)이다. IMO는 연료전지 설비 잠정지침(MSC.1/Circ.1647)을 두고 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>수소(또는 수소 함유 연료)와 산소의 전기화학 반응으로 전기·열을 직접 생산(효율 약 45~60%).<\/p>\n<div class=\"calc\">연료극: H₂ → 2H⁺ + 2e⁻ / 공기극: ½O₂ + 2H⁺ + 2e⁻ → H₂O<\/div>\n<h5>2. 종류<\/h5><p>PEMFC(80 °C, 응답 빠름), HT-PEM(160 °C, 메탄올 개질), SOFC(600~1,000 °C, LNG·암모니아 내부 개질), MCFC.<\/p>\n<h5>3. 과제<\/h5><p>단가·수명, 출력 밀도, 수소 저장, 배터리 하이브리드 필요, IMO MSC.1/Circ.1647.<\/p><\/div><\/section><\/details>"},{"id":"smr","p":10,"n":"10.20","h":"소형모듈원자로(SMR, Small Modular Reactor)","t":"소형모듈원자로(SMR, Small Modular Reactor)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 1번 · 10점"],"q":["<b>136회(2025) 1-1<\/b> 소형모듈원자로(SMR)"],"k":"SMR은 전기출력 대략 300 MWe 이하의 원자로를 공장에서 모듈로 제작해 설치하는 원자력 기술이다. 선박에서는 추진 동력원이나 부유식 원자력 발전설비로 검토되며, 운항 중 온실가스가 없고 10년 이상 연료 교체 없이 운전할 수 있는 점이 강점이다.","x":"\n<p class=\"key\">SMR은 전기출력 대략 300 MWe 이하의 원자로를 공장에서 모듈로 제작해 설치하는 원자력 기술이다. 선박에서는 추진 동력원이나 부유식 원자력 발전설비로 검토되며, 운항 중 온실가스가 없고 10년 이상 연료 교체 없이 운전할 수 있는 점이 강점이다.<\/p>\n<h4>노형<\/h4>\n<ul>\n<li>가압경수로(PWR): 군함·러시아 쇄빙선 실적, 가장 성숙.<\/li>\n<li>용융염원자로(MSR): 액체 연료, 대기압 운전, 고유 안전성. 국내 조선소(삼성중공업 등)가 부유식 발전선·추진선 개념을 연구.<\/li>\n<li>고온가스로(HTGR), 납냉각로(LFR).<\/li>\n<\/ul>\n<h4>장점<\/h4>\n<p>무배출, 장기 무급유, 대출력(초대형 컨테이너선·쇄빙선), 운항 속도 제약 완화, 연료 가격 변동 영향 작음.<\/p>\n<h4>과제<\/h4>\n<ul>\n<li>규제: SOLAS VIII과 1981년 원자력 상선 안전코드(A.491(XII))가 낡아 IMO 개정 논의 중, 기국·항만국 승인.<\/li>\n<li>항만 입항 제한, 보안·핵비확산, 보험·배상 책임, 사회적 수용성.<\/li>\n<li>승무원 자격·교육, 사고 시 대응, 해체·사용후 연료 처리.<\/li>\n<li>선체 설계: 차폐 중량, 충돌·좌초 보호 구역, 원자로 구획 배치.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>전기출력 대략 300 MWe 이하, 공장 모듈 제작 원자로. 선박 추진·부유식 발전 적용.<\/p>\n<h5>2. 노형<\/h5><p>PWR(군함·쇄빙선 실적), MSR(액체 연료·대기압, 국내 조선소 연구), HTGR, LFR.<\/p>\n<h5>3. 장점·과제<\/h5><p>무배출·장기 무급유·대출력 / SOLAS VIII·원자력 상선 코드(A.491(XII)) 개정 필요, 항만 입항, 보안·배상, 수용성, 해체.<\/p><\/div><\/section><\/details>"},{"id":"eedi","p":11,"n":"11.1","h":"EEDI, SEEMP, EEOI와 EEDI 개선대책","t":"EEDI, SEEMP, EEOI와 EEDI 개선대책","c":3,"r":1,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 13번 · 10점","124회 1교시 4번 · 10점","133회 1교시 9번 · 10점"],"q":["<b>118회(2019) 1-13<\/b> EEDI, SEEMP 및 EEOI","<b>124회(2021) 1-4<\/b> EEDI 및 개선대책","<b>133회(2024) 1-9<\/b> EEDI"],"k":"EEDI는 신조선의 설계 단계 에너지효율 지수로, 운송작업 1단위(톤·마일)당 CO₂ 배출량[g/t·nm]이다. 선종·크기별 기준선 대비 단계적 감축률을 만족해야 한다. SEEMP는 모든 선박의 운항 효율 관리 계획이고, EEOI는 실제 화물·항해 기준의 자율 운항 지표다.","x":"\n<p class=\"key\">EEDI는 신조선의 설계 단계 에너지효율 지수로, 운송작업 1단위(톤·마일)당 CO₂ 배출량[g/t·nm]이다. 선종·크기별 기준선 대비 단계적 감축률을 만족해야 한다. SEEMP는 모든 선박의 운항 효율 관리 계획이고, EEOI는 실제 화물·항해 기준의 자율 운항 지표다.<\/p>\n<h4>EEDI 산식(요약)<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[\\mathrm{EEDI}=\\dfrac{\\sum P_{ME}\\,C_{F,ME}\\,SFC_{ME}+P_{AE}\\,C_{F,AE}\\,SFC_{AE}+(\\mathrm{PTI,\\ innovative\\ tech.})}{f_i\\,f_c\\,f_l\\cdot\\mathrm{Capacity}\\cdot f_w\\,V_{ref}\\,f_m}\\]<\/div><span class=\"c\">P<sub>ME<\/sub>: 주기 MCR의 75%(PTO 보정), P<sub>AE<\/sub>: 보조동력(MCR ≥ 10,000 kW면 0.025·MCR + 250 kW), C<sub>F<\/sub>: 연료 탄소환산계수, Capacity: 재화중량(컨테이너선은 DWT의 70%, 여객선은 GT), V<sub>ref<\/sub>: 하기흘수·P<sub>ME<\/sub>·평수 조건 속력, f: 보정계수(빙해, 크레인, 날씨 등)<\/span><\/div>\n<div class=\"eq\"><div class=\"eql\">요구 EEDI<\/div><div class=\"mj\">\\[\\mathrm{EEDI}_{req}=\\left(1-\\dfrac{X}{100}\\right)a\\cdot\\mathrm{Capacity}^{-c}\\]<\/div><\/div>\n<h4>감축 단계 X<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>기간<\/th><th class=\"num\">X<\/th><\/tr><\/thead><tbody>\n<tr><td>Phase 0<\/td><td>2013~2014<\/td><td class=\"num\">0%<\/td><\/tr>\n<tr><td>Phase 1<\/td><td>2015~2019<\/td><td class=\"num\">10%<\/td><\/tr>\n<tr><td>Phase 2<\/td><td>2020~2024(일부 선종 2022 조기 종료)<\/td><td class=\"num\">20%<\/td><\/tr>\n<tr><td>Phase 3<\/td><td>2025~ (컨테이너선·가스선·LNG선·일반화물선·크루즈선은 2022~)<\/td><td class=\"num\">30%, 컨테이너선은 크기별 30~50%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>SEEMP와 EEOI<\/h4>\n<ul>\n<li><b>SEEMP<\/b>(MARPOL VI Reg.26): Part I 선박별 효율 조치 계획, Part II 연료소비 자료 수집(IMO DCS, 5,000 GT 이상, 2019~), Part III CII 3개년 이행계획(2023~).<\/li>\n<li><b>EEOI<\/b>: Σ(연료 × C<sub>F<\/sub>) / Σ(실제 화물량 × 항해거리). 실제 적재율이 반영되는 운항 지표로 자율 사용(MEPC.1/Circ.684).<\/li>\n<\/ul>\n<h4>EEDI 개선대책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분모(운송능력) 증가<\/th><th>분자(CO₂) 감소<\/th><\/tr><\/thead><tbody>\n<tr><td>경량 구조(고장력강 최적화)로 DWT 증가, 주요치수 최적화로 화물 효율 증가<\/td><td>선형·구상선수 최적화, 저회전 대직경 프로펠러, ESD, 공기윤활, 풍력(f<sub>eff<\/sub>), 폐열회수, 주기관 디레이팅·낮은 SFC, LNG·메탄올(낮은 C<sub>F<\/sub>), PTO, 설계속력 하향<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>EEDI를 출력 축소로만 맞추면 악천후 최소 추진력(MEPC.1/Circ.850 지침) 문제가 생긴다. 설계 단계에서 출력 하향과 조종 안전성의 균형을 확인하는 것이 기술사가 짚어야 할 지점이다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-13<\/td><td>EEDI, SEEMP, EEOI<\/td><td>설계 지표·관리 계획·운항 지표의 구분<\/td><\/tr>\n<tr><td class=\"num\">124-1-4<\/td><td>EEDI 및 개선대책<\/td><td>분자·분모 관점 대책<\/td><\/tr>\n<tr><td class=\"num\">133-1-9<\/td><td>EEDI<\/td><td>식, Phase, 수치 예제<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 124·133회형\">\n<h5>1. 정의<\/h5>\n<p>EEDI: 신조선 설계 단계 에너지효율지수. 운송작업(t·nm)당 CO₂ 배출량[g/t·nm], MARPOL VI 강제.<\/p>\n<h5>2. 식과 기준<\/h5>\n<div class=\"calc\">EEDI = Σ(P·C_F·SFC) / (Capacity·V_ref·f)\n요구 EEDI = (1 − X/100) × 기준선(a·Capacity^−c)\nX: Phase 1 10% → Phase 2 20% → Phase 3 30%(컨테이너선 30~50%)<\/div>\n<h5>3. 예제(63,000 DWT 벌크선)<\/h5>\n<div class=\"calc\">MCR 7,500 kW → P_ME 5,625 kW, P_AE 375 kW, V_ref 14.0 kn\n달성 EEDI = 3.54,  기준선 4.94 → Phase 3 요구 3.46 → 미달\nMCR 6,500 kW 디레이팅, V_ref 13.6 kn → 3.16 → 만족<\/div>\n<h5>4. 개선대책<\/h5>\n<p>분모↑: 경량화로 DWT 증가 / 분자↓: 선형·ESD·프로펠러, 디레이팅, 폐열회수, LNG(C<sub>F<\/sub> 2.750), 풍력·공기윤활(혁신기술)<\/p>\n<p class=\"concl\"><b>5. 의견<\/b>: 출력 축소만으로 맞추면 악천후 최소 추진력이 부족해질 수 있어 조종 안전성을 함께 확인해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 118회형(EEDI·SEEMP·EEOI)\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>EEDI<\/th><th>SEEMP<\/th><th>EEOI<\/th><\/tr><\/thead><tbody>\n<tr><td>성격<\/td><td>설계 지수<\/td><td>운항 효율 관리 계획<\/td><td>운항 지표<\/td><\/tr>\n<tr><td>대상<\/td><td>신조선<\/td><td>모든 선박(400 GT 이상)<\/td><td>자율<\/td><\/tr>\n<tr><td>내용<\/td><td>설계 조건 CO₂/(DWT·V)<\/td><td>Part I 조치, II 연료자료(DCS), III CII 계획<\/td><td>실제 연료CO₂/(실제 화물·거리)<\/td><\/tr>\n<tr><td>강제성<\/td><td>강제(Phase)<\/td><td>강제(비치·이행)<\/td><td>권고<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: EEDI는 \"설계 성능\", CII·EEOI는 \"운항 성능\"이므로 둘을 함께 관리해야 실제 배출이 줄어듦.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"eexi","p":11,"n":"11.2","h":"운항선 에너지효율지수(EEXI)와 미달 선박의 만족 방안","t":"운항선 에너지효율지수(EEXI)와 미달 선박의 만족 방안","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 2교시 5번 · 25점"],"q":["<b>124회(2021) 2-5<\/b> EEXI와 미달 선박의 만족 방안"],"k":"EEXI는 EEDI 산식을 기존선에 적용한 지수로, 2023년 1월 1일부터 400 GT 이상 해당 선종의 모든 운항선이 첫 연차·중간·정기 IAPP 검사 시 만족해야 했다. 설계 변경 없이 미달이면 가장 흔한 대책은 주기관 출력 제한(EPL/ShaPoLi)이고, 그 밖에 ESD·프로펠러·연료 전환 등 기술 개선을 조합한다.","x":"\n<p class=\"key\">EEXI는 EEDI 산식을 기존선에 적용한 지수로, 2023년 1월 1일부터 400 GT 이상 해당 선종의 모든 운항선이 첫 연차·중간·정기 IAPP 검사 시 만족해야 했다. 설계 변경 없이 미달이면 가장 흔한 대책은 주기관 출력 제한(EPL/ShaPoLi)이고, 그 밖에 ESD·프로펠러·연료 전환 등 기술 개선을 조합한다.<\/p>\n<h4>내용<\/h4>\n<ul>\n<li>요구 EEXI = (1 − Y/100) × EEDI 기준선. Y는 선종·크기별(예: 벌크선·유조선 20만 DWT 이상 15%, 2만~20만 20%, 컨테이너선 20만 이상 50%에서 소형으로 갈수록 감소).<\/li>\n<li>달성 EEXI 계산: V<sub>ref<\/sub>는 모형시험·시운전 자료, 없으면 통계 근사식(V<sub>ref,app<\/sub>) 사용. EEXI 기술 파일 승인.<\/li>\n<li>EEDI 달성값이 이미 요구 EEXI 이하이면 그 값을 사용 가능.<\/li>\n<\/ul>\n<h4>미달 시 만족 방안<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방안<\/th><th>내용<\/th><th>장단점<\/th><\/tr><\/thead><tbody>\n<tr><td>기관 출력 제한(EPL)<\/td><td>기계식·전자식 출력 상한 설정, 비상 시 해제 가능(override, 기록·보고), MEPC.335(76) 지침<\/td><td>가장 저비용·빠름 / 최고 속력 감소, 악천후 대응력 감소<\/td><\/tr>\n<tr><td>축출력 제한(ShaPoLi)<\/td><td>축 토크미터 기반 출력 제한<\/td><td>정밀 관리 / 계측 장비 필요<\/td><\/tr>\n<tr><td>ESD 개조<\/td><td>덕트, PBCF, 타구 등<\/td><td>V<sub>ref<\/sub> 향상분 반영(시험 근거 필요)<\/td><\/tr>\n<tr><td>프로펠러 교체·선수 개조<\/td><td>저속 운항 최적 설계<\/td><td>도킹 비용, 효과 큼<\/td><\/tr>\n<tr><td>연료 전환<\/td><td>LNG 이중연료 개조<\/td><td>C<sub>F<\/sub> 감소 효과 큼 / 고비용<\/td><\/tr>\n<tr><td>혁신기술<\/td><td>로터 세일, 공기윤활, 폐열회수<\/td><td>f<sub>eff<\/sub> 반영<\/td><\/tr>\n<tr><td>기관 디레이팅·교체<\/td><td>정격 하향 재인증<\/td><td>NOx 기술파일 갱신<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 정의<\/h5><p>EEDI 산식을 기존선에 적용한 지수. 2023.1.1부터 400 GT 이상 해당 선종 운항선이 첫 IAPP 검사 시 만족.<\/p>\n<div class=\"calc\">요구 EEXI = (1 − Y/100) × EEDI 기준선\n(예: 벌크·유조선 20만 DWT 이상 15%, 2만~20만 20% / 컨테이너선 20만 이상 50%)<\/div>\n<h5>2. 계산<\/h5><p>V<sub>ref<\/sub>는 모형시험·시운전 자료, 없으면 근사식(V<sub>ref,app<\/sub>), EEXI 기술파일 승인. EEDI 달성값이 요구 EEXI 이하이면 그대로 사용.<\/p>\n<h5>3. 미달 시 만족 방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방안<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>EPL(기관 출력 제한)<\/td><td>최저비용·신속, 비상 해제 가능(기록), 최고 속력·악천후 대응력 감소<\/td><\/tr>\n<tr><td>ShaPoLi<\/td><td>축 토크미터 기반 정밀 제한<\/td><\/tr>\n<tr><td>ESD, 프로펠러·선수 개조<\/td><td>V<sub>ref<\/sub> 향상, 시험 근거<\/td><\/tr>\n<tr><td>LNG 전환<\/td><td>C<sub>F<\/sub> 감소 큼, 고비용<\/td><\/tr>\n<tr><td>혁신기술<\/td><td>로터 세일·공기윤활·WHR(f<sub>eff<\/sub>)<\/td><\/tr>\n<tr><td>디레이팅·교체<\/td><td>NOx 기술파일 갱신<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 대부분 EPL로 대응했으나 CII 강화로 실질 효율 개선이 다시 요구되므로, EPL은 과도기 대책으로 보고 ESD·연료 전환 계획을 병행해야 함.<\/p><\/div><\/section><\/details>"},{"id":"cii","p":11,"n":"11.3","h":"탄소집약도지표(CII)와 CII 등급 향상 방안","t":"탄소집약도지표(CII)와 CII 등급 향상 방안","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 1번 · 10점","139회 4교시 4번 · 25점"],"q":["<b>124회(2021) 1-1<\/b> 탄소집약도(CII, Carbon Intensity Indicator)","<b>139회(2026) 4-4<\/b> 선박의 CII 등급 향상을 위한 조치방안"],"k":"CII는 5,000 GT 이상 선박의 연간 실제 운항 CO₂ 배출을 운송능력(재화중량 또는 총톤수)과 항해거리로 나눈 운항 탄소집약도다. 2019년 기준선에 매년 강화되는 감축률 Z를 적용한 요구값 대비 A~E 등급을 매기며, D 3년 연속 또는 E 1회면 시정조치 계획을 SEEMP Part III에 반영해야 한다.","x":"\n<p class=\"key\">CII는 5,000 GT 이상 선박의 연간 실제 운항 CO₂ 배출을 운송능력(재화중량 또는 총톤수)과 항해거리로 나눈 운항 탄소집약도다. 2019년 기준선에 매년 강화되는 감축률 Z를 적용한 요구값 대비 A~E 등급을 매기며, D 3년 연속 또는 E 1회면 시정조치 계획을 SEEMP Part III에 반영해야 한다.<\/p>\n<h4>계산<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[\\mathrm{CII}_{att}=\\dfrac{\\sum FC_j\\,C_{F,j}}{\\mathrm{Capacity}\\cdot D_t},\\qquad \\mathrm{CII}_{req}=\\left(1-\\dfrac{Z}{100}\\right)\\mathrm{CII}_{ref}\\]<\/div><span class=\"c\">화물선은 AER(재화중량 기준), 크루즈·로로여객선은 GT 기준. 등급 경계는 요구값 주변의 d₁~d₄ 벡터로 정한다.<\/span><\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>연도<\/th><th class=\"num\">2023<\/th><th class=\"num\">2024<\/th><th class=\"num\">2025<\/th><th class=\"num\">2026<\/th><th class=\"num\">2027<\/th><th class=\"num\">2028<\/th><th class=\"num\">2029<\/th><th class=\"num\">2030<\/th><\/tr><\/thead><tbody>\n<tr><td>Z (2019 대비)<\/td><td class=\"num\">5%<\/td><td class=\"num\">7%<\/td><td class=\"num\">9%<\/td><td class=\"num\">11%<\/td><td class=\"num\">13.625%<\/td><td class=\"num\">16.25%<\/td><td class=\"num\">18.875%<\/td><td class=\"num\">21.5%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>2027~2030년 값은 MEPC 83(2025년 4월)에서 G3 지침 개정(MEPC.400(83))으로 확정되었다. 2030년 이후 값은 추후 결정한다.<\/p>\n<h4>등급 향상(탈탄소) 조치<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>조치<\/th><\/tr><\/thead><tbody>\n<tr><td>운항<\/td><td>감속 운항(연료 ∝ V² 수준으로 거리당 감소), 기상 항로, 적시 도착(JIT)으로 대기 감소, 트림 최적화, 오토파일럿 튜닝, 정박 중 발전 최소화·육상전원<\/td><\/tr>\n<tr><td>정비<\/td><td>선체 청소·프로펠러 연마, 저마찰 도료(실리콘 오염박리), 기관 연소 최적화<\/td><\/tr>\n<tr><td>기술<\/td><td>ESD, 공기윤활, 로터 세일, 폐열회수, PTO, 구상선수·프로펠러 개조<\/td><\/tr>\n<tr><td>연료<\/td><td>LNG·메탄올 이중연료, 바이오연료 혼합(C<sub>F<\/sub> 처리 지침 확인)<\/td><\/tr>\n<tr><td>관리<\/td><td>연료 계측 정확도, 데이터 기반 성능 모니터링, 선대 배치 최적화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>AER은 설계 재화중량을 쓰므로 실제 적재율을 높여도 등급이 좋아지지 않고, 항만 대기·단거리 항해가 많으면 불리해진다. 그래서 운항 측 조치(속력·대기 관리)가 기술 개조보다 먼저 효과를 낸다. IMO는 이런 문제를 반영한 CII 개정을 검토하고 있다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-1-1<\/td><td>탄소집약도(CII)<\/td><td class=\"num\">10<\/td><td>식, 등급, Z, 시정조치<\/td><\/tr>\n<tr><td class=\"num\">139-4-4<\/td><td>CII 등급 향상 조치방안<\/td><td class=\"num\">25<\/td><td>운항·정비·기술·연료·관리 5축 + AER 한계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 124회형\">\n<h5>1. 정의<\/h5><p>5,000 GT 이상 선박의 연간 운항 CO₂를 운송능력×항해거리로 나눈 지표(MARPOL VI, 2023~).<\/p>\n<div class=\"calc\">CII_att = Σ(FC × C_F) / (Capacity × Distance)\nCII_req = (1 − Z/100) × CII_ref(2019)\nZ: 2023 5% · 2024 7% · 2025 9% · 2026 11% · 2027 13.625% … 2030 21.5%<\/div>\n<h5>2. 등급·조치<\/h5><p>A~E 등급, D 3년 연속 또는 E 1회 → SEEMP Part III 시정조치 계획.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: 설계 지수 EEDI와 달리 운항 결과이므로 속력·대기 관리가 등급을 좌우함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 139회형\">\n<h5>1. 개요<\/h5><p>CII 등급은 매년 강화되는 Z(2030년 21.5%) 때문에 같은 운항을 해도 해마다 나빠지므로, 지속적 개선 계획이 필요함.<\/p>\n<h5>2. 조치방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>축<\/th><th>조치<\/th><th>효과 근거<\/th><\/tr><\/thead><tbody>\n<tr><td>운항<\/td><td>감속, 기상 항로, 적시 도착(JIT), 트림 최적화, 정박 중 발전 최소화·육상전원<\/td><td>거리당 연료 ∝ 약 V²<\/td><\/tr>\n<tr><td>정비<\/td><td>선체 청소·프로펠러 연마, 오염박리 도료<\/td><td>마찰저항 감소<\/td><\/tr>\n<tr><td>기술<\/td><td>ESD, 공기윤활, 로터 세일, WHR, PTO, 구상선수·프로펠러 개조<\/td><td>동력 감소<\/td><\/tr>\n<tr><td>연료<\/td><td>LNG·메탄올 이중연료, 바이오 혼합<\/td><td>C<sub>F<\/sub> 감소<\/td><\/tr>\n<tr><td>관리<\/td><td>연료 계측 정확도, 성능 모니터링, 선대 배치<\/td><td>데이터 기반 개선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 유의점<\/h5><ul><li>AER은 설계 DWT 기준 → 적재율 향상은 등급에 반영 안 됨<\/li><li>항만 대기·단거리 항해가 많으면 불리 → 운항 측 관리가 우선<\/li><li>감속은 운항 일정·선복 수요와 trade-off<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 단기는 운항 조치, 중기는 ESD·개조, 장기는 연료 전환으로 단계별 로드맵을 SEEMP Part III에 반영하는 것이 합리적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"cf","p":11,"n":"11.4","h":"연료계수(탄소환산계수, C<sub>F<\/sub>)","t":"연료계수(탄소환산계수, CF)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 2번 · 10점"],"q":["<b>124회(2021) 1-2<\/b> 연료계수"],"k":"CF는 연료 1톤을 태울 때 나오는 CO₂의 톤수로, 연료의 탄소 함량에 CO₂/C 분자량비(44/12 = 3.664)를 곱한 값이다. EEDI·EEXI·CII·IMO DCS 계산의 공통 계수다.","x":"\n<p class=\"key\">C<sub>F<\/sub>는 연료 1톤을 태울 때 나오는 CO₂의 톤수로, 연료의 탄소 함량에 CO₂/C 분자량비(44/12 = 3.664)를 곱한 값이다. EEDI·EEXI·CII·IMO DCS 계산의 공통 계수다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>연료<\/th><th class=\"num\">탄소 함량<\/th><th class=\"num\">C<sub>F<\/sub> [t-CO₂/t-연료]<\/th><\/tr><\/thead><tbody>\n<tr><td>디젤·가스오일(MGO)<\/td><td class=\"num\">0.8744<\/td><td class=\"num\">3.206<\/td><\/tr>\n<tr><td>경질연료유(LFO)<\/td><td class=\"num\">0.8594<\/td><td class=\"num\">3.151<\/td><\/tr>\n<tr><td>중질연료유(HFO)<\/td><td class=\"num\">0.8493<\/td><td class=\"num\">3.114<\/td><\/tr>\n<tr><td>LPG(프로판)<\/td><td class=\"num\">0.8182<\/td><td class=\"num\">3.000<\/td><\/tr>\n<tr><td>LPG(부탄)<\/td><td class=\"num\">0.8264<\/td><td class=\"num\">3.030<\/td><\/tr>\n<tr><td>LNG<\/td><td class=\"num\">0.7500<\/td><td class=\"num\">2.750<\/td><\/tr>\n<tr><td>메탄올<\/td><td class=\"num\">0.3750<\/td><td class=\"num\">1.375<\/td><\/tr>\n<tr><td>에탄올<\/td><td class=\"num\">0.5217<\/td><td class=\"num\">1.913<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>질량당 C<sub>F<\/sub>만 보면 메탄올이 매우 낮지만 발열량도 낮아(약 19.9 MJ/kg) 같은 에너지당 CO₂는 큰 차이가 없다. 그래서 탄소 저감 효과는 에너지 기준(g CO₂/MJ)과 전과정(WtW)으로 비교해야 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>연료 1 t 연소 시 CO₂ 톤수 = 탄소 함량 × 44/12(3.664). EEDI·EEXI·CII·DCS 공통 계수.<\/p>\n<div class=\"calc\">MGO 3.206 · LFO 3.151 · HFO 3.114 · LPG(프로판) 3.000\nLNG 2.750 · 메탄올 1.375 · 에탄올 1.913<\/div>\n<p class=\"concl\"><b>2. 의견<\/b>: 질량 기준 C<sub>F<\/sub>만 보면 메탄올이 낮지만 발열량도 낮아 에너지 기준·WtW로 비교해야 함.<\/p><\/div><\/section><\/details>"},{"id":"wtw","p":11,"n":"11.5","h":"Tank-to-Wake와 Well-to-Wake","t":"Tank-to-Wake와 Well-to-Wake","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 13번 · 10점"],"q":["<b>130회(2023) 1-13<\/b> Tank to Wake, Well to Wake"],"k":"Tank-to-Wake(TtW)는 선박 탱크의 연료를 선상에서 태우거나 변환할 때 나오는 배출만 보는 범위이고, Well-to-Wake(WtW)는 연료의 생산·가공·운송·벙커링(Well-to-Tank, WtT)까지 더한 전과정 배출이다. 무탄소 연료의 실제 효과는 WtW로만 판단할 수 있다.","x":"\n<p class=\"key\">Tank-to-Wake(TtW)는 선박 탱크의 연료를 선상에서 태우거나 변환할 때 나오는 배출만 보는 범위이고, Well-to-Wake(WtW)는 연료의 생산·가공·운송·벙커링(Well-to-Tank, WtT)까지 더한 전과정 배출이다. 무탄소 연료의 실제 효과는 WtW로만 판단할 수 있다.<\/p>\n<div class=\"eq\"><div class=\"eql\">WtT: 채굴·생산·액화·운송 / TtW: 선상 CO₂·메탄 슬립·N₂O — 단위 g CO₂e/MJ<\/div><div class=\"mj\">\\[\\mathrm{WtW}=\\mathrm{WtT}+\\mathrm{TtW}\\]<\/div><\/div>\n<ul>\n<li>수소·암모니아는 TtW CO₂가 0이지만, 천연가스 개질(그레이)로 만들면 WtT 배출이 커서 WtW로는 화석연료보다 나쁠 수 있다. 그린(재생전력 전기분해)·블루(CCS) 여부가 핵심.<\/li>\n<li>바이오연료는 연소 CO₂가 생물 기원이라 중립으로 보고, 재배·가공 배출과 간접 토지 이용 변화로 평가한다.<\/li>\n<li>LNG는 TtW CO₂ 감소분이 메탄 슬립과 상류 누출로 상쇄될 수 있다.<\/li>\n<li>제도: IMO LCA 지침(MEPC.376(80), 2023), EU FuelEU Maritime(WtW GHG 강도 기준). EEDI·CII는 현재 TtW CO₂ 기반이다. GWP100: CH₄ 약 28~30, N₂O 약 265~273.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><div class=\"calc\">WtW = WtT(채굴·생산·액화·운송·벙커링) + TtW(선상 연소: CO₂, 메탄 슬립, N₂O)  [g CO₂e/MJ]<\/div>\n<h5>2. 의미<\/h5><ul><li>그레이 수소·암모니아: TtW 0이지만 WtT 큼<\/li><li>바이오연료: 연소 CO₂ 생물 기원 → 중립, 재배·가공 배출 평가<\/li><li>LNG: 슬립·상류 누출이 감축 효과 상쇄<\/li><\/ul>\n<h5>3. 제도<\/h5><p>IMO LCA 지침(MEPC.376(80)), FuelEU(WtW), EEDI·CII는 TtW CO₂ 기반.<\/p><\/div><\/section><\/details>"},{"id":"eu-ets","p":11,"n":"11.6","h":"EU ETS(배출권거래제)의 해운 적용과 우리나라 해운업·조선업 영향","t":"EU ETS(배출권거래제)의 해운 적용과 우리나라 해운업·조선업 영향","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 2교시 1번 · 25점"],"q":["<b>130회(2023) 2-1<\/b> EU ETS와 우리나라 해운업·조선업에 미치는 영향"],"k":"EU ETS는 2024년부터 5,000 GT 이상 상선의 EU 관련 항해 배출에 배출권 제출 의무를 부과한다. EU 역내 항해와 EU 항만 정박은 100%, EU 출입 국제 항해는 50%가 대상이고, 제출 비율은 2024년 배출분 40%, 2025년 70%, 2026년부터 100%다. 탄소비용이 운임과 선박 가치에 반영되면서 저탄소 선박 수요가 커진다.","x":"\n<p class=\"key\">EU ETS는 2024년부터 5,000 GT 이상 상선의 EU 관련 항해 배출에 배출권 제출 의무를 부과한다. EU 역내 항해와 EU 항만 정박은 100%, EU 출입 국제 항해는 50%가 대상이고, 제출 비율은 2024년 배출분 40%, 2025년 70%, 2026년부터 100%다. 탄소비용이 운임과 선박 가치에 반영되면서 저탄소 선박 수요가 커진다.<\/p>\n<h4>주요 내용<\/h4>\n<ul>\n<li>대상: 5,000 GT 이상 화물·여객선(해양작업선은 2027년부터), 의무 주체는 선사(ISM DOC 보유자, 계약으로 비용 전가 가능).<\/li>\n<li>가스: 2024~2025 CO₂, 2026년부터 CH₄·N₂O 포함.<\/li>\n<li>근거 자료: EU MRV 검증 배출량.<\/li>\n<li>회피 방지: EU 인근 비EU 환적항(일정 조건)은 EU 항만으로 보지 않는다.<\/li>\n<li>함께 시행: FuelEU Maritime(2025~, 에너지당 GHG 강도 2025년 2%, 2030년 6%, 2050년 80% 감축), 2030년 주요 항만 육상전원 의무.<\/li>\n<\/ul>\n<h4>해운업 영향<\/h4>\n<ul>\n<li>유럽 항로 운항 국적 선사의 배출권 비용 증가(톤당 수십 유로 × 배출량) → 운임 할증(ETS surcharge), 원가 경쟁력 차이.<\/li>\n<li>고효율·이중연료 선박 우선 배치, 노후선 유럽 항로 퇴출, 용선 계약에 탄소비용 조항.<\/li>\n<li>배출권 관리·검증 행정 부담.<\/li>\n<\/ul>\n<h4>조선업 영향<\/h4>\n<ul>\n<li>LNG·메탄올·암모니아 이중연료 신조 발주 확대 → 고부가 친환경선에 강점이 있는 국내 조선소 수주 기회.<\/li>\n<li>운항선 개조(ESD, 풍력, 연료 전환) 시장 확대.<\/li>\n<li>설계 경쟁 축이 연비·탄소 성능(WtW)으로 이동, 대체연료 엔진·탱크 기자재 국산화 필요.<\/li>\n<li>대체연료 공급망·가격 불확실성은 발주 지연 요인.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>EU 배출권거래제를 2024년부터 5,000 GT 이상 상선에 적용. 역내 항해·정박 100%, 출입 국제 항해 50%.<\/p>\n<h5>2. 주요 내용<\/h5><ul><li>제출 비율: 2024 배출분 40% → 2025 70% → 2026 100%<\/li><li>가스: CO₂, 2026부터 CH₄·N₂O<\/li><li>의무 주체: 선사(DOC 보유자), 근거: EU MRV, 해양작업선 2027~<\/li><li>병행: FuelEU Maritime(2025~), 2030 육상전원<\/li><\/ul>\n<h5>3. 해운업 영향<\/h5><p>유럽 항로 배출권 비용 → 운임 할증, 고효율·이중연료선 배치, 노후선 퇴출, 용선 계약 탄소비용 조항, 행정 부담.<\/p>\n<h5>4. 조선업 영향<\/h5><p>이중연료 신조 발주 확대(국내 조선소 기회), 개조 시장 확대, 설계 경쟁 축이 탄소 성능으로 이동, 대체연료 기자재 국산화 필요.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 탄소 비용이 선박 가치와 운임에 내재화되면서 친환경선 경쟁력이 수주로 직결되므로, 국내 조선소는 WtW 성능과 연료 유연성으로 차별화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"eu-mrv","p":11,"n":"11.7","h":"EU MRV(Monitoring, Reporting, Verification)","t":"EU MRV(Monitoring, Reporting, Verification)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 1교시 10번 · 10점"],"q":["<b>133회(2024) 1-10<\/b> EU MRV"],"k":"EU MRV(규정 (EU) 2015/757)는 2018년부터 EU 항만을 기항하는 5,000 GT 이상 선박의 CO₂ 배출(2024년부터 CH₄·N₂O 포함)과 운항 자료를 감시·보고·검증하게 하는 제도다. EU ETS 배출권 제출의 기초 자료가 된다.","x":"\n<p class=\"key\">EU MRV(규정 (EU) 2015/757)는 2018년부터 EU 항만을 기항하는 5,000 GT 이상 선박의 CO₂ 배출(2024년부터 CH₄·N₂O 포함)과 운항 자료를 감시·보고·검증하게 하는 제도다. EU ETS 배출권 제출의 기초 자료가 된다.<\/p>\n<ul>\n<li><b>Monitoring<\/b>: 승인된 감시계획(monitoring plan)에 따라 항해별 연료 소비·배출·거리·화물·시간 기록. 계측 방법(벙커 통보서, 탱크 계측, 유량계, 배기 직접 계측).<\/li>\n<li><b>Reporting<\/b>: 연간 배출 보고서를 THETIS-MRV 시스템에 제출.<\/li>\n<li><b>Verification<\/b>: 인정된 검증기관이 검증 → 적합 문서(Document of Compliance)를 매년 6월 30일까지 선박에 비치.<\/li>\n<li>선박별 결과 공개(투명성), 2025년부터 400~5,000 GT 일반화물선·해양선도 MRV 대상.<\/li>\n<li>IMO DCS(2019~, 전 세계 5,000 GT 이상)와 유사하나 항해 단위 보고와 공개, 화물 자료가 다르다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>규정 (EU) 2015/757: 2018년부터 EU 기항 5,000 GT 이상 선박의 CO₂(2024~ CH₄·N₂O) 감시·보고·검증.<\/p>\n<h5>2. 절차<\/h5><p>감시계획 → 항해별 기록 → 연간 보고(THETIS-MRV) → 검증 → 적합 문서(6월 30일까지 비치), 결과 공개. 2025년 400~5,000 GT 일반화물선·해양선 확대.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: EU ETS 배출권 제출의 기초 자료이며, IMO DCS와 달리 항해 단위·공개 방식임.<\/p><\/div><\/section><\/details>"},{"id":"imo2020","p":11,"n":"11.8","h":"IMO 2020: 의미, 주요내용, 업계 대응방안","t":"IMO 2020: 의미, 주요내용, 업계 대응방안","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 4교시 2번 · 25점"],"q":["<b>121회(2020) 4-2<\/b> IMO 2020의 의미, 주요내용과 업계 대응방안"],"k":"IMO 2020은 2020년 1월 1일부터 배출규제해역(ECA) 밖 전 세계 해역에서 선박 연료유 황 함량 상한을 3.50%에서 0.50%(질량비)로 낮춘 MARPOL Annex VI Reg.14 규제다. 2020년 3월 1일부터는 스크러버가 없는 선박에 0.50% 초과 연료의 적재 자체가 금지되었다.","x":"\n<p class=\"key\">IMO 2020은 2020년 1월 1일부터 배출규제해역(ECA) 밖 전 세계 해역에서 선박 연료유 황 함량 상한을 3.50%에서 0.50%(질량비)로 낮춘 MARPOL Annex VI Reg.14 규제다. 2020년 3월 1일부터는 스크러버가 없는 선박에 0.50% 초과 연료의 적재 자체가 금지되었다.<\/p>\n<h4>주요 내용<\/h4>\n<ul>\n<li>전 해역 0.50%, ECA(북해·발트해, 북미, 미국 카리브해, 2025년 5월부터 지중해) 0.10%.<\/li>\n<li>동등 대안: 배기가스 세정장치(스크러버)로 동등 효과 확보 시 고유황유 사용 가능.<\/li>\n<li>시료 관리: 공급 시료(MARPOL sample), 사용 중 시료, 선상 시료 채취 지점 설치.<\/li>\n<li>공급 불가 시 FONAR(연료 미확보 보고) 절차.<\/li>\n<\/ul>\n<h4>업계 대응<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대응<\/th><th>내용<\/th><th>과제<\/th><\/tr><\/thead><tbody>\n<tr><td>저유황유(VLSFO, MGO) 전환<\/td><td>설비 변경 최소<\/td><td>연료비 상승, 혼합 안정성·호환성, 촉매 미립자, 탱크 세정<\/td><\/tr>\n<tr><td>스크러버 설치<\/td><td>개방형·폐쇄형·하이브리드 습식<\/td><td>설치비·공간, 세정수 배출 금지 항만 증가, 전력·유지보수<\/td><\/tr>\n<tr><td>LNG 연료 전환<\/td><td>황 거의 없음, NOx·CO₂ 동시 저감<\/td><td>탱크 공간, 벙커링 인프라, 메탄 슬립<\/td><\/tr>\n<tr><td>기타<\/td><td>바이오연료 혼합, 정유사 탈황 설비 투자<\/td><td>공급량<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>조선업은 스크러버 개조와 LNG 추진선 수요를 얻었고, 신조선은 연료 전환 대비 설계(fuel-ready)와 이중연료가 표준이 되는 계기가 되었다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 의미<\/h5><p>2020.1.1부터 ECA 밖 전 해역 연료 황 상한 3.50% → 0.50%(MARPOL VI Reg.14). 2020.3.1부터 스크러버 없는 선박의 고유황유 적재 금지.<\/p>\n<h5>2. 주요 내용<\/h5><p>ECA 0.10%(북해·발트해, 북미, 미국 카리브해, 2025.5 지중해), 동등 대안(스크러버), 시료 관리, FONAR.<\/p>\n<h5>3. 업계 대응<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대응<\/th><th>과제<\/th><\/tr><\/thead><tbody>\n<tr><td>VLSFO·MGO 전환<\/td><td>연료비, 혼합 안정성, 촉매 미립자<\/td><\/tr>\n<tr><td>스크러버<\/td><td>설치비·공간, 세정수 배출 금지 항만<\/td><\/tr>\n<tr><td>LNG 연료<\/td><td>탱크 공간, 벙커링, 메탄 슬립<\/td><\/tr>\n<tr><td>정유 투자·바이오 혼합<\/td><td>공급량<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: IMO 2020은 연료 전환 설계(fuel-ready)와 이중연료가 신조 표준이 되는 계기였으며, 이후 탄소 규제로 연료 선택의 무게가 이동함.<\/p><\/div><\/section><\/details>"},{"id":"bwm","p":11,"n":"11.9","h":"선박평형수관리협약(BWM Convention)","t":"선박평형수관리협약(BWM Convention)","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 8번 · 10점","124회 1교시 12번 · 10점"],"q":["<b>112회(2017) 1-8<\/b> BWM 협약(선박평형수관리협약)","<b>124회(2021) 1-12<\/b> BWM 협약"],"k":"BWM 협약은 선박평형수에 섞여 이동하는 수중 생물·병원체가 다른 해역 생태계를 교란하는 것을 막기 위한 협약이다. 2004년 채택, 2017년 9월 8일 발효되었고, 2024년 9월 8일까지 모든 대상 선박이 처리 기준(D-2)을 만족하는 평형수처리장치를 갖추도록 단계 적용되었다.","x":"\n<p class=\"key\">BWM 협약은 선박평형수에 섞여 이동하는 수중 생물·병원체가 다른 해역 생태계를 교란하는 것을 막기 위한 협약이다. 2004년 채택, 2017년 9월 8일 발효되었고, 2024년 9월 8일까지 모든 대상 선박이 처리 기준(D-2)을 만족하는 평형수처리장치를 갖추도록 단계 적용되었다.<\/p>\n<h4>기준<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>기준<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>D-1 교환 기준<\/td><td>체적 95% 이상 교환(펌핑 방식은 탱크 체적 3배), 가장 가까운 육지에서 200해리 이상·수심 200 m 이상(불가 시 50해리·200 m)<\/td><\/tr>\n<tr><td>D-2 성능 기준<\/td><td>50 μm 이상 생물 &lt; 10개/m³, 10~50 μm &lt; 10개/mL, 지표 미생물: 독성 콜레라균 &lt; 1 cfu/100 mL, 대장균 &lt; 250 cfu/100 mL, 장구균 &lt; 100 cfu/100 mL<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선박 요건<\/h4>\n<ul>\n<li>BWM 계획서, 평형수 기록부, 국제평형수관리증서(IBWMC, 400 GT 이상).<\/li>\n<li>BWMS 형식승인(BWMS Code, MEPC.300(72)), 설치 후 시운전 시험(commissioning test).<\/li>\n<\/ul>\n<h4>처리장치(BWMS)와 설계 고려<\/h4>\n<ul>\n<li>방식: 필터 + 자외선(UV), 전기분해(염소 생성 후 중화), 오존, 약품.<\/li>\n<li>설계: 처리 용량 ≥ 밸러스트 펌프 유량, 설치 공간·전력, 전기분해식은 수소 가스(위험구역·환기), 저수온·저염도·탁수 성능, UV 램프 투과율, 필터 역세척, 잔류 산화물(TRO) 감시, 운항선 개조 시 배관 경로(3D 스캔).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-1-8 · 124-1-12<\/td><td>BWM 협약<\/td><td>목적, D-1·D-2 수치, 발효·완료 시점, BWMS<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 목적<\/h5><p>평형수에 섞인 수중 생물·병원체의 해역 간 이동 방지. 2004 채택, 2017.9.8 발효, 2024.9.8까지 전 선박 D-2.<\/p>\n<h5>2. 기준<\/h5>\n<div class=\"calc\">D-1 교환: 체적 95%(펌핑 3배), 육지 200해리·수심 200 m 이상\nD-2 성능: ≥50 μm < 10개/m³, 10~50 μm < 10개/mL\n          콜레라균 < 1 cfu/100 mL, 대장균 < 250, 장구균 < 100 cfu/100 mL<\/div>\n<h5>3. 선박 요건<\/h5><p>BWM 계획서, 기록부, IBWM 증서, 형식승인 BWMS(필터+UV, 전기분해 등).<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 전기분해식은 수소 가스 위험구역, UV식은 저투과 해역 성능을 설계 단계에서 검토해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"ghg-ccs","p":11,"n":"11.10","h":"GHG 규제의 IMO·EU 동향과 선상 탄소포집(CCS)","t":"GHG 규제의 IMO·EU 동향과 선상 탄소포집(CCS)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 4교시 3번 · 25점"],"q":["<b>133회(2024) 4-3<\/b> GHG 규제 관련 IMO와 EU 동향, CCS"],"k":"IMO는 2023년 개정 GHG 전략에서 2050년 무렵 국제해운 순배출 0을 목표로 정했고, 단기 조치(EEXI·CII)에 이어 중기 조치로 연료 GHG 강도 기준과 가격 메커니즘을 합친 IMO Net-Zero Framework를 추진 중이다. EU는 MRV·ETS·FuelEU로 이미 지역 규제를 시행하고 있다. 선상 탄소포집은 배기에서 CO₂를 분리해 액화 저장 후 육상에 넘기는 기술이다.","x":"\n<p class=\"key\">IMO는 2023년 개정 GHG 전략에서 2050년 무렵 국제해운 순배출 0을 목표로 정했고, 단기 조치(EEXI·CII)에 이어 중기 조치로 연료 GHG 강도 기준과 가격 메커니즘을 합친 IMO Net-Zero Framework를 추진 중이다. EU는 MRV·ETS·FuelEU로 이미 지역 규제를 시행하고 있다. 선상 탄소포집은 배기에서 CO₂를 분리해 액화 저장 후 육상에 넘기는 기술이다.<\/p>\n<h4>IMO 동향<\/h4>\n<ul>\n<li><b>2023 개정 전략(MEPC 80)<\/b>: 2050년 무렵 순배출 0, 점검 목표는 2008년 대비 2030년 총배출 20%(목표 30%) 감축, 2040년 70%(목표 80%) 감축, 2030년 탄소집약도 40% 개선, 무·저탄소 연료 비중 5%(목표 10%).<\/li>\n<li><b>단기 조치<\/b>: EEXI·CII·SEEMP Part III(2023~).<\/li>\n<li><b>중기 조치<\/b>: IMO Net-Zero Framework(MARPOL Annex VI 개정: 선박 연료 GHG 강도(GFI) 단계 감축 기준 + 초과 배출에 대한 비용 납부·우수선 보상)가 MEPC 83(2025.4)에서 승인됐다. 2025년 10월 특별회기에서 채택이 1년 연기되었고, 2026년 4월 MEPC 84 협상을 거쳐 2026년 12월 특별회기 재개가 예정되어 있다. 채택 후 발효까지 약 16개월이 걸리므로 적용 시점은 유동적이다.<\/li>\n<li>LCA 지침(WtW), 메탄 슬립·선상 탄소포집 규정 마련 논의.<\/li>\n<\/ul>\n<h4>EU 동향<\/h4>\n<ul>\n<li>EU MRV(2018~), EU ETS 해운(2024~, 2026년 100%), FuelEU Maritime(2025~, 에너지당 GHG 강도 감축 2025 2% → 2030 6% → 2035 14.5% → 2040 31% → 2045 62% → 2050 80%, 기준 91.16 g CO₂e/MJ).<\/li>\n<\/ul>\n<h4>선상 탄소포집(OCCS)<\/h4>\n<ul>\n<li><b>방식<\/b>: 아민 흡수(연소 후 포집, 가장 성숙), 분리막, 극저온 분리, 칼슘 루핑.<\/li>\n<li><b>구성<\/b>: 배기 전처리(냉각, SOx 제거) → 흡수탑 → 재생탑(열 필요) → CO₂ 압축·액화 → LCO₂ 탱크 저장 → 항만 양하.<\/li>\n<li><b>과제<\/b>: 재생 열에너지(배기 폐열 활용), 흡수탑·탱크 공간과 중량(화물 손실), 포집률과 비용, 하역 인프라, 규제상 감축 인정 방식(IMO 논의 중).<\/li>\n<li>육상 CCS 가치사슬의 LCO₂ 운반선 수요와 연결된다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. IMO 동향<\/h5><ul><li>2023 개정 전략: 2050년 무렵 순배출 0, 2030 총배출 20%(목표 30%)·2040 70%(목표 80%) 감축(2008 대비), 무·저탄소 연료 5~10%<\/li><li>단기: EEXI·CII·SEEMP III / 중기: Net-Zero Framework(MEPC 83 승인, 채택 연기, 2026.12 재논의)<\/li><\/ul>\n<h5>2. EU 동향<\/h5><p>MRV(2018), ETS 해운(2024, 2026 100%), FuelEU(2025, 2050 80% 감축).<\/p>\n<h5>3. 선상 탄소포집(CCS)<\/h5><ul><li>방식: 아민 흡수(성숙), 분리막, 극저온<\/li><li>흐름: 배기 전처리 → 흡수탑 → 재생탑(열) → 압축·액화 → LCO₂ 탱크 → 항만 양하<\/li><li>과제: 재생 열(폐열 활용), 공간·중량(화물 손실), 포집률·비용, 하역 인프라, 감축 인정 규정<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 규제는 TtW에서 WtW로, 지수에서 가격으로 강화되는 중이며, CCS는 기존 연료 선대의 과도기 수단이자 LCO₂ 운반선 수요와 연결됨.<\/p><\/div><\/section><\/details>"},{"id":"hkc","p":11,"n":"11.11","h":"홍콩협약(HKC): 건조부터 폐선까지의 조치사항","t":"홍콩협약(HKC): 건조부터 폐선까지의 조치사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 2번 · 25점"],"q":["<b>139회(2026) 3-2<\/b> 2025년 6월 26일 발효된 Hong Kong Convention에 따라 건조 시부터 폐선 시까지 조치사항"],"k":"선박재활용 홍콩협약은 2009년 채택되어 2025년 6월 26일 발효되었다. 500 GT 이상 국제항해 선박은 건조 시 유해물질 목록(IHM Part I)을 만들어 증서를 받고, 운항 중 목록을 갱신하며, 폐선 시 승인된 재활용 시설에서 선박재활용계획에 따라 해체해야 한다.","x":"\n<p class=\"key\">선박재활용 홍콩협약은 2009년 채택되어 2025년 6월 26일 발효되었다. 500 GT 이상 국제항해 선박은 건조 시 유해물질 목록(IHM Part I)을 만들어 증서를 받고, 운항 중 목록을 갱신하며, 폐선 시 승인된 재활용 시설에서 선박재활용계획에 따라 해체해야 한다.<\/p>\n<h4>건조 단계(조선소)<\/h4>\n<ul>\n<li>금지 물질(석면, 오존층 파괴 물질, PCB, 방오 물질 TBT·사이부트린 등) 미사용 설계와 구매.<\/li>\n<li>기자재 공급사의 물질 신고서(MD)와 공급자 적합 선언서(SDoC) 수집.<\/li>\n<li>IHM Part I(구조·설비 내 유해물질 위치·양) 작성 → 최초 검사 → 국제유해물질목록증서(ICIHM) 발급.<\/li>\n<\/ul>\n<h4>운항 단계(선주)<\/h4>\n<ul>\n<li>신규 설비 설치·개조 시 IHM 갱신(MD·SDoC 확보), 지정 담당자 관리.<\/li>\n<li>정기 갱신 검사(최대 5년), 금지 물질 신규 설치 금지.<\/li>\n<li>기존선은 발효 후 5년 이내(2030년 6월 26일까지) 또는 그 전에 재활용하면 그 전까지 IHM Part I 확보.<\/li>\n<\/ul>\n<h4>폐선 단계<\/h4>\n<ul>\n<li>IHM Part II(운항 폐기물), Part III(저장품) 작성.<\/li>\n<li>승인된 재활용 시설 선정 → 시설이 선박재활용계획(SRP) 작성 → 최종 검사 → 재활용 준비 증서(IRRC) 발급.<\/li>\n<li>잔류 화물·연료 최소화, 가스프리 준비, 기국 통보 후 재활용.<\/li>\n<\/ul>\n<p>EU 기국 선박과 EU 항만 기항 선박은 EU 선박재활용규정(EU SRR)도 적용되어, EU 승인 시설 목록과 확대된 IHM 물질 목록을 따라야 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>선박재활용 홍콩협약(2009 채택, 2025.6.26 발효): 500 GT 이상 국제항해선의 유해물질 관리와 안전·친환경 해체.<\/p>\n<h5>2. 건조 단계(조선소)<\/h5><ul><li>금지 물질(석면, ODS, PCB, TBT·사이부트린) 미사용 설계·구매<\/li><li>공급사 MD·SDoC 수집<\/li><li>IHM Part I 작성 → 최초 검사 → ICIHM 발급<\/li><\/ul>\n<h5>3. 운항 단계(선주)<\/h5><ul><li>설비 변경 시 IHM 갱신, 담당자 지정<\/li><li>갱신 검사(최대 5년)<\/li><li>기존선: 2030.6.26까지 IHM Part I<\/li><\/ul>\n<h5>4. 폐선 단계<\/h5><ul><li>IHM Part II(운항 폐기물)·III(저장품)<\/li><li>승인 시설 선정 → 시설이 SRP 작성 → 최종 검사 → IRRC 발급<\/li><li>잔류물 최소화·가스프리, 기국 통보<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 조선소의 핵심 의무는 IHM Part I의 정확성이며, 기자재 공급망 전체의 물질 신고 관리 체계가 필요함. EU 선박은 EU SRR도 적용됨.<\/p><\/div><\/section><\/details>"},{"id":"green-ship-act","p":11,"n":"11.12","h":"친환경선박법상 환경친화적 선박의 5가지 기준","t":"친환경선박법상 환경친화적 선박의 5가지 기준","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 6번 · 25점"],"q":["<b>127회(2022) 3-6<\/b> 친환경선박법상 환경친화적 선박에 해당하는 5가지 기준"],"k":"「환경친화적 선박의 개발 및 보급 촉진에 관한 법률」(친환경선박법, 2020년 시행) 제2조제3호는 환경친화적 선박을 다음 다섯 가지 중 하나에 해당하는 선박으로 정의한다.","x":"\n<p class=\"key\">「환경친화적 선박의 개발 및 보급 촉진에 관한 법률」(친환경선박법, 2020년 시행) 제2조제3호는 환경친화적 선박을 다음 다섯 가지 중 하나에 해당하는 선박으로 정의한다.<\/p>\n<ol>\n<li><b>가.<\/b> 해양오염을 저감하는 기술을 적용하거나 선박에너지효율을 높일 수 있는 기술을 사용하여 설계된 선박으로서 산업통상부와 해양수산부의 공동부령으로 정하는 기준에 적합한 선박<\/li>\n<li><b>나.<\/b> 액화천연가스 등 공동부령으로 정하는 환경친화적인 에너지를 동력원으로 사용하는 선박<\/li>\n<li><b>다.<\/b> 전기 공급원으로부터 충전받은 전기에너지를 동력원으로 사용하는 전기추진선박<\/li>\n<li><b>라.<\/b> 휘발유·경유·액화석유가스·천연가스 또는 공동부령으로 정하는 연료와 전기에너지(충전 전기 포함)를 조합하여 동력원으로 사용하는 하이브리드선박<\/li>\n<li><b>마.<\/b> 수소 등을 사용하여 발생시킨 전기에너지를 동력원으로 사용하는 연료전지추진선박<\/li>\n<\/ol>\n<h4>관련 내용<\/h4>\n<ul>\n<li>\"선박에너지효율\"은 화물운송과 관련해 사용한 에너지량을 이산화탄소 발생비율로 나타낸 것(제2조제2호).<\/li>\n<li>공동부령이 정하는 친환경 에너지에는 LNG·CNG·LPG·메탄올·수소·암모니아 등이 포함된다.<\/li>\n<li>산업통상부·해양수산부가 5년마다 기본계획을 공동 수립(제3조), 공공선박 친환경 전환, 보조금·세제 지원, 기술개발 지원의 근거.<\/li>\n<\/ul>\n<div class=\"tip\"><p>127회 출제 당시에는 \"산업통상자원부\"였고, 2025년 정부조직 개편으로 \"산업통상부\"로 바뀌었다. 답안에는 현행 명칭을 쓰되 내용(5가지)은 같다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 근거<\/h5><p>「환경친화적 선박의 개발 및 보급 촉진에 관한 법률」(2020 시행) 제2조제3호.<\/p>\n<h5>2. 5가지 기준<\/h5><ol><li>해양오염 저감 기술 또는 선박에너지효율 향상 기술로 설계되어 공동부령 기준에 적합한 선박<\/li><li>LNG 등 공동부령으로 정하는 환경친화적 에너지를 동력원으로 쓰는 선박<\/li><li>충전 전기에너지를 동력원으로 쓰는 전기추진선박<\/li><li>휘발유·경유·LPG·천연가스 등과 전기에너지를 조합한 하이브리드선박<\/li><li>수소 등으로 발생시킨 전기에너지를 쓰는 연료전지추진선박<\/li><\/ol>\n<h5>3. 관련<\/h5><p>\"선박에너지효율\": 화물운송 사용 에너지를 CO₂ 발생비율로 나타낸 것. 친환경 에너지에 LNG·CNG·LPG·메탄올·수소·암모니아. 산업통상부·해양수산부 5년 기본계획, 공공선박 전환·지원 근거.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 국내 친환경선 보급의 법적 기반이며, 현행 부처명(산업통상부)으로 쓰는 것이 정확함.<\/p><\/div><\/section><\/details>"},{"id":"solas-marpol","p":12,"n":"12.1","h":"SOLAS와 MARPOL의 목적·규제성격 비교와 선박설계에 미치는 영향","t":"SOLAS와 MARPOL의 목적·규제성격 비교와 선박설계에 미치는 영향","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 5번 · 25점"],"q":["<b>139회(2026) 3-5<\/b> SOLAS와 MARPOL의 목적·규제성격 비교와 선박설계에 미치는 영향"],"k":"SOLAS는 인명과 선박의 안전을, MARPOL은 해양·대기 환경 보호를 목적으로 한다. SOLAS는 구조·설비의 안전 성능을 규정하고, MARPOL은 배출 기준과 오염 방지 구조·설비·운항 제한을 규정한다. 두 협약 모두 선박의 구획·탱크 배치·기관 선택을 근본적으로 결정한다.","x":"\n<p class=\"key\">SOLAS는 인명과 선박의 안전을, MARPOL은 해양·대기 환경 보호를 목적으로 한다. SOLAS는 구조·설비의 안전 성능을 규정하고, MARPOL은 배출 기준과 오염 방지 구조·설비·운항 제한을 규정한다. 두 협약 모두 선박의 구획·탱크 배치·기관 선택을 근본적으로 결정한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>SOLAS 1974<\/th><th>MARPOL 73/78<\/th><\/tr><\/thead><tbody>\n<tr><td>목적<\/td><td>인명 안전, 선박 안전<\/td><td>선박 기인 해양·대기 오염 방지<\/td><\/tr>\n<tr><td>구성<\/td><td>II-1 구조·구획·복원성·기관·전기, II-2 방화, III 구명설비, IV 무선, V 항해안전, VI 화물, VII 위험물(IGC·IBC), IX ISM, XI-1·2 특별조치·ISPS, XII 산적화물선, XIV 극지, XV 산업인력<\/td><td>Annex I 기름, II 유해액체물질, III 포장 유해물질, IV 하수, V 폐기물, VI 대기오염·에너지효율<\/td><\/tr>\n<tr><td>규제 성격<\/td><td>구조·설비 안전 기준(처방식 + 목표기반 GBS), 증서·검사<\/td><td>배출 기준(ppm, 황 함량, NOx Tier, CO₂ 지수), 오염방지 구조·설비, 기록부, 운항 규제(특별해역·ECA)<\/td><\/tr>\n<tr><td>대상 위험<\/td><td>침몰·화재·충돌·좌초에 따른 인명 피해<\/td><td>유출·배출에 따른 환경 피해<\/td><\/tr>\n<tr><td>개정 방식<\/td><td colspan=\"2\">묵시적 수락(tacit acceptance)으로 빠르게 개정·발효, 기국 검사와 항만국 통제(PSC)로 집행<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선박설계에 미치는 영향<\/h4>\n<div class=\"grid2\">\n<div class=\"box\"><h5>SOLAS<\/h5><ul><li>수밀 구획·손상복원성(확률론) → 격벽 배치, KG 한계<\/li><li>방화 구조(A·B·C급), 주수직구역, 탈출로<\/li><li>구명설비 배치, 선교 시야, 조타기·비상전원<\/li><li>벌크선 이중선측·침수 경보, 영구접근설비(PMA), PSPC<\/li><\/ul><\/div>\n<div class=\"box\"><h5>MARPOL<\/h5><ul><li>유조선 이중선체(Annex I Reg.19), 분리 밸러스트, 연료탱크 보호 위치(Reg.12A)<\/li><li>유수분리기 15 ppm, 슬러지 탱크, 하수처리장치, 폐기물 관리<\/li><li>NOx Tier III(SCR·EGR), 황 0.50%(스크러버·LNG)<\/li><li>EEDI·EEXI·CII → 선형·기관·연료 선택<\/li><\/ul><\/div>\n<\/div>\n<p>결론적으로 SOLAS는 \"선박이 사고에서 살아남는 능력\", MARPOL은 \"선박이 환경에 주는 부담\"을 설계에 넣게 한다. 최근에는 MARPOL Annex VI의 탄소 규제가 선형·추진계 결정의 최상위 제약이 되었다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 목적<\/h5><p>SOLAS: 인명·선박 안전 / MARPOL: 선박 기인 해양·대기 오염 방지<\/p>\n<h5>2. 규제 성격 비교<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>SOLAS<\/th><th>MARPOL<\/th><\/tr><\/thead><tbody>\n<tr><td>대상 위험<\/td><td>침몰·화재·충돌<\/td><td>유출·배출<\/td><\/tr>\n<tr><td>방식<\/td><td>구조·설비 안전 기준(처방식 + GBS)<\/td><td>배출 기준 + 방지 구조·설비 + 운항 제한<\/td><\/tr>\n<tr><td>구성<\/td><td>II-1 구조·복원성, II-2 방화, III 구명, V 항해, IX ISM, XI-2 ISPS 등<\/td><td>Annex I 기름 ~ VI 대기·에너지효율<\/td><\/tr>\n<tr><td>집행<\/td><td colspan=\"2\">기국 검사·증서, PSC, 묵시적 수락 개정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 선박설계 영향<\/h5><ul><li>SOLAS: 구획·손상복원성(격벽 배치·KG 한계), 방화 구조·탈출로, 구명설비 배치, 선교 시야, 조타·비상전원<\/li><li>MARPOL: 유조선 이중선체, 연료탱크 보호 위치, 유수분리기·하수처리, NOx Tier III(SCR·EGR), 황 0.50%(스크러버·LNG), EEDI·CII(선형·기관·연료)<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: SOLAS는 \"사고에서 살아남는 능력\", MARPOL은 \"환경 부담\"을 설계에 넣게 하며, 최근에는 MARPOL VI 탄소 규제가 선형·추진계의 최상위 제약이 됨.<\/p><\/div><\/section><\/details>"},{"id":"visibility","p":12,"n":"12.2","h":"SOLAS에 규정된 선교 시야(Visibility, SOLAS V/22)","t":"SOLAS에 규정된 선교 시야(Visibility, SOLAS V/22)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 7번 · 10점"],"q":["<b>115회(2018) 1-7<\/b> SOLAS에 규정된 Visibility"],"k":"SOLAS V/22는 선교 조선 위치에서 선수 전방의 해면을 일정 거리 이내까지 볼 수 있어야 하고, 화물·구조물로 인한 사각과 수평 시야 범위를 제한한다. 갑판 화물(컨테이너) 적재 높이와 상부구조 위치를 결정하는 핵심 설계 제약이다.","x":"\n<p class=\"key\">SOLAS V/22는 선교 조선 위치에서 선수 전방의 해면을 일정 거리 이내까지 볼 수 있어야 하고, 화물·구조물로 인한 사각과 수평 시야 범위를 제한한다. 갑판 화물(컨테이너) 적재 높이와 상부구조 위치를 결정하는 핵심 설계 제약이다.<\/p>\n<h4>주요 요건(길이 55 m 이상)<\/h4>\n<ul>\n<li>조선 위치에서 선수 전방 해면이 보이지 않는 거리: 2L 또는 500 m 중 작은 값 이하(선수 좌우 10° 범위, 모든 흘수·트림·갑판 화물 조건).<\/li>\n<li>정횡 전방의 사각: 개별 10° 이하, 합계 20° 이하, 사각 사이 맑은 구간 5° 이상(선수 전방 범위 내 개별 사각은 5° 이하).<\/li>\n<li>수평 시야: 조선 위치에서 225° 이상(정선수에서 좌우 정횡 후방 22.5°까지), 선교 날개에서 225° 이상, 주 조타 위치에서 정선수 좌우 60° 이상.<\/li>\n<li>선교 날개에서 선측이 보여야 함.<\/li>\n<li>전면 창: 하단은 가능한 한 낮게, 상단은 눈높이 1,800 mm에서 심한 종동요 중에도 수평선이 보이게, 창틀 최소화(작업 위치 정면 금지), 수직에서 10~25° 경사, 편광·착색 유리 금지, 와이퍼·제빙·서리 제거로 최소 2개 창은 항상 맑게.<\/li>\n<\/ul>\n<div class=\"pro\"><p>컨테이너선은 시야 요건이 갑판 적재 단수를 결정한다. 그래서 상부구조를 선수 쪽으로 옮긴 2-아일랜드 배치(거주구 전방, 기관실 후방)가 대형선에서 일반화되었다. 로터 세일·LNG 탱크·스크러버 같은 갑판 설비 추가 시에도 시야 재검토가 필요하다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 근거<\/h5><p>SOLAS V/22(길이 55 m 이상): 선교 조선 위치 시야 요건.<\/p>\n<h5>2. 요건<\/h5><ul><li>선수 전방 해면 사각: 2L 또는 500 m 중 작은 값 이하(좌우 10°)<\/li><li>정횡 전방 사각: 개별 10° 이하, 합계 20° 이하, 사이 5° 이상<\/li><li>수평 시야: 조선 위치 225°, 선교 날개 225°, 주 조타 위치 좌우 60°<\/li><li>전면 창: 10~25° 경사, 편광·착색 금지, 최소 2개 창 항상 맑게<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 컨테이너선 갑판 적재 단수를 제한하는 핵심 요건으로, 대형선은 거주구 전방 배치로 대응함.<\/p><\/div><\/section><\/details>"},{"id":"lsa","p":12,"n":"12.3","h":"SOLAS 구명설비: 화물선의 구명정·구명뗏목·구조정 비치수량과 조건","t":"SOLAS 구명설비: 화물선의 구명정·구명뗏목·구조정 비치수량과 조건","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 3교시 1번 · 25점"],"q":["<b>118회(2019) 3-1<\/b> SOLAS 구명설비규정에서 화물선 구명정·구명뗏목·구조정의 비치수량과 조건"],"k":"화물선은 양현 각각 전원(100%)을 태울 수 있는 전폐형 구명정 또는 선미의 자유낙하식 구명정(100%)을 갖추고, 여기에 구명뗏목을 추가로 갖춘다. 구조정은 1척 이상이며, 모든 생존정은 퇴선 신호 후 10분 이내에 정원 승선 상태로 진수할 수 있어야 한다(SOLAS III/31).","x":"\n<p class=\"key\">화물선은 양현 각각 전원(100%)을 태울 수 있는 전폐형 구명정 또는 선미의 자유낙하식 구명정(100%)을 갖추고, 여기에 구명뗏목을 추가로 갖춘다. 구조정은 1척 이상이며, 모든 생존정은 퇴선 신호 후 10분 이내에 정원 승선 상태로 진수할 수 있어야 한다(SOLAS III/31).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구성<\/th><th>비치 수량<\/th><th>조건<\/th><\/tr><\/thead><tbody>\n<tr><td>방식 1: 양현 전폐형 구명정<\/td><td>각 현 100%<\/td><td>+ 구명뗏목 100%(한쪽 갑판에서 현측 간 이동 쉬우면 100%, 아니면 각 현 100%)<\/td><\/tr>\n<tr><td>방식 2: 자유낙하식 구명정<\/td><td>선미 100%<\/td><td>+ 각 현 구명뗏목 100%, 최소 한쪽은 진수장치(davit) 부착<\/td><\/tr>\n<tr><td>85 m 미만(유조선 등 제외)<\/td><td>구명뗏목만으로 각 현 100%(또는 조건부 150%)<\/td><td>-<\/td><\/tr>\n<tr><td>구조정<\/td><td>1척 이상<\/td><td>구명정이 구조정 요건을 만족하면 겸용 가능<\/td><\/tr>\n<tr><td>유조선·케미컬·가스선<\/td><td>내화 구명정(물분무), 독성 화물선은 자급 공기 공급식<\/td><td>-<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>공통 조건<\/h4>\n<ul>\n<li>진수: 트림 10°, 횡경사 20°에서도 진수 가능, 최소 운항 흘수에서 수면까지 내릴 수 있어야.<\/li>\n<li>배치: 거주구·기관실 가까이, 프로펠러와 선체 돌출부(선미 오버행)에서 떨어지게, 승정 장소 조명.<\/li>\n<li>개인 구명설비: 구명조끼(전원 + 당직 장소 추가), 이머전 수트(전원), 구명부환(선장에 따른 수량), 신호 장비(EPIRB, SART·AIS-SART, 휴대 VHF, 조난 신호).<\/li>\n<li>구명정 훅: 부하 상태 이탈 장치(on-load release) 개정 기준(MSC.320(89)) 적합.<\/li>\n<li>점검·훈련: 주간·월간 점검, 매월 퇴선 훈련, 3개월마다 구명정 진수.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 근거<\/h5><p>SOLAS III/31(화물선 구명설비), LSA Code(성능)<\/p>\n<h5>2. 비치수량<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구성<\/th><th>수량·조건<\/th><\/tr><\/thead><tbody>\n<tr><td>방식 1<\/td><td>양현 전폐형 구명정 각 100% + 구명뗏목 100%(이동 쉬우면) 또는 각 현 100%<\/td><\/tr>\n<tr><td>방식 2<\/td><td>선미 자유낙하 구명정 100% + 각 현 구명뗏목 100%(한쪽 진수장치)<\/td><\/tr>\n<tr><td>85 m 미만(유조선 등 제외)<\/td><td>구명뗏목만 각 현 100%(조건부 150%)<\/td><\/tr>\n<tr><td>구조정<\/td><td>1척 이상(구명정 겸용 가능)<\/td><\/tr>\n<tr><td>유조선·가스선<\/td><td>내화 구명정, 독성 화물선은 자급 공기<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 조건<\/h5><ul><li>퇴선 신호 후 10분 이내 정원 진수, 트림 10°·횡경사 20°에서 진수<\/li><li>거주구·기관실 근접, 프로펠러·오버행 이격, 승정 장소 조명<\/li><li>개인 장비: 구명조끼, 이머전 수트, 구명부환, EPIRB·SART·VHF<\/li><li>부하 이탈 훅(MSC.320(89)), 정기 점검·훈련<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 자유낙하 구명정은 진수 신뢰성이 높아 대형 화물선 표준이 되었으며, 선미 낙하 해역과 계류 설비 간섭을 배치 단계에서 해결해야 함.<\/p><\/div><\/section><\/details>"},{"id":"escape-lsa","p":12,"n":"12.4","h":"구명정 진수장치와 대피로(Escape Route) 설계의 SOLAS 안전요건과 실무 배치 유의사항","t":"구명정 진수장치와 대피로(Escape Route) 설계의 SOLAS 안전요건과 실무 배치 유의사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 4교시 2번 · 25점"],"q":["<b>139회(2026) 4-2<\/b> 구명정 진수장치와 대피로 설계 시 SOLAS 안전요건과 실무 배치 유의사항"],"k":"대피로는 모든 거주·작업 구역에서 화재·침수 시에도 소집 장소와 승정 장소로 갈 수 있게 하는 두 개 이상의 독립 경로이고, 진수장치는 정원 승선 구명정을 경사 상태에서도 안전하게 내리는 장치다. 둘을 하나의 흐름(구역 → 대피로 → 소집 → 승정 → 진수)으로 설계하는 것이 실무의 핵심이다.","x":"\n<p class=\"key\">대피로는 모든 거주·작업 구역에서 화재·침수 시에도 소집 장소와 승정 장소로 갈 수 있게 하는 두 개 이상의 독립 경로이고, 진수장치는 정원 승선 구명정을 경사 상태에서도 안전하게 내리는 장치다. 둘을 하나의 흐름(구역 → 대피로 → 소집 → 승정 → 진수)으로 설계하는 것이 실무의 핵심이다.<\/p>\n<h4>대피로 요건(SOLAS II-2/13 등)<\/h4>\n<ul>\n<li>거주구 각 구획에서 서로 떨어진 두 개 이상의 탈출 수단, 막힌 복도 길이 제한(화물선 7 m).<\/li>\n<li>A류 기관구역: 두 개의 탈출 수단, 그중 하나는 방화 보호된 연속 피난 통로(하부에서 갑판까지 방화 구획).<\/li>\n<li>계단·문 폭, 방화문 자동 폐쇄, 탈출 경로 표지·저위치 조명(여객선), 비상탈출용 호흡구(EEBD) 배치.<\/li>\n<li>엘리베이터는 탈출 수단으로 보지 않음.<\/li>\n<\/ul>\n<h4>진수장치 요건(SOLAS III, LSA Code)<\/h4>\n<ul>\n<li>대빗(중력식)과 윈치·브레이크, 부하 상태 이탈 훅, 정원·장비 탑재 하중의 안전율, 정전 시 중력 강하, 갑판에서 원격 강하 조작.<\/li>\n<li>자유낙하식: 진수대 각도, 인증 낙하 높이 이하, 모의 진수 장치, 2차 진수 수단.<\/li>\n<li>트림 10°, 횡경사 20°에서 진수, 최소 흘수에서 수면 도달, 진수 경로상 선측 돌출 회피.<\/li>\n<\/ul>\n<h4>실무 배치 유의사항<\/h4>\n<ol>\n<li>구명정은 프로펠러·선미 오버행에서 떨어진 선체 평행부 측면, 선측 돌출물(빌지킬, 스러스터 개구, 배출구) 위치 확인.<\/li>\n<li>승정 갑판은 거주구에서 직접 이어지고 조명·미끄럼 방지, 비계 없이 정비 접근.<\/li>\n<li>소집 장소는 승정 장소 인근, 인원 1인당 면적 확보, 기상 노출 최소화.<\/li>\n<li>연돌 배기열·스크러버 배출, LNG 탱크 위험구역, 컨테이너·크레인과 간섭 검토.<\/li>\n<li>자유낙하 구명정은 선미 후방 낙하 해역 확보, 계류 장비와 분리.<\/li>\n<li>대피로와 방화 구획 경계, 통로 폭을 3D 모델에서 동선 시뮬레이션으로 확인(여객선은 대피 해석 MSC.1/Circ.1533).<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>구역 → 대피로 → 소집 → 승정 → 진수를 하나의 흐름으로 설계해야 함.<\/p>\n<h5>2. 대피로 요건(SOLAS II-2/13)<\/h5><ul><li>거주구 각 구획 2개 이상 독립 탈출 수단, 막힌 복도 화물선 7 m 이하<\/li><li>A류 기관구역 2개 탈출 수단(하나는 방화 보호 연속 통로)<\/li><li>방화문 자동 폐쇄, 표지·조명, EEBD 배치, 엘리베이터 제외<\/li><\/ul>\n<h5>3. 진수장치 요건<\/h5><ul><li>대빗·윈치·브레이크, 부하 이탈 훅, 중력 강하·원격 강하<\/li><li>자유낙하: 진수대 각도, 인증 낙하 높이, 모의 진수, 2차 진수 수단<\/li><li>트림 10°·횡경사 20°, 최소 흘수 수면 도달<\/li><\/ul>\n<h5>4. 실무 배치 유의<\/h5><ol><li>프로펠러·오버행 이격, 선측 돌출물 확인<\/li><li>승정 갑판 직접 연결·조명·미끄럼 방지<\/li><li>소집 장소 근접·면적 확보<\/li><li>배기열·스크러버·LNG 위험구역·크레인 간섭<\/li><li>자유낙하 후방 해역, 계류 장비 분리<\/li><li>3D 동선 시뮬레이션(여객선 대피 해석)<\/li><\/ol>\n<p class=\"concl\"><b>5. 결론<\/b>: 대체연료 탱크와 갑판 설비가 늘면서 위험구역·간섭 검토가 진수 배치의 새 제약이 되고 있음.<\/p><\/div><\/section><\/details>"},{"id":"fire-systems","p":12,"n":"12.5","h":"선박 화재의 원인, 화재탐지장치·소화장치의 종류와 소방설비","t":"선박 화재의 원인, 화재탐지장치·소화장치의 종류와 소방설비","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 5번 · 25점","133회 2교시 2번 · 25점"],"q":["<b>121회(2020) 2-5<\/b> 선박 화재의 일반적 원인, 화재탐지장치·소화장치의 종류 및 소방설비","<b>133회(2024) 2-2<\/b> 선박 화재 감지시스템"],"k":"기관실 화재의 대부분은 연료유·윤활유가 고온 표면(약 220 °C 이상)에 떨어져 발화하는 것이다. 화재 안전은 예방(누설 차단, 고온부 보온), 탐지(연기·열·불꽃), 소화(고정식·이동식), 확산 방지(방화 구조)의 네 단계로 설계한다.","x":"\n<p class=\"key\">기관실 화재의 대부분은 연료유·윤활유가 고온 표면(약 220 °C 이상)에 떨어져 발화하는 것이다. 화재 안전은 예방(누설 차단, 고온부 보온), 탐지(연기·열·불꽃), 소화(고정식·이동식), 확산 방지(방화 구조)의 네 단계로 설계한다.<\/p>\n<h4>일반적 원인<\/h4>\n<ul>\n<li>연료·윤활유 누설과 고온 표면(배기관, 과급기), 고압 연료관 파손.<\/li>\n<li>전기 단락·과부하, 배터리(리튬) 열폭주, 전기차 화재.<\/li>\n<li>화기작업(용접·절단), 조리실 기름, 흡연, 기름 걸레 자연발화.<\/li>\n<li>배기가스 이코노마이저 매연 화재, 청정기실, 자연발열 화물(석탄, 어분).<\/li>\n<\/ul>\n<h4>화재탐지장치(FSS Code 9장)<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>원리<\/th><th>설치 장소<\/th><\/tr><\/thead><tbody>\n<tr><td>연기 탐지기(광전식)<\/td><td>연기 입자의 빛 산란<\/td><td>거주구, 복도·계단, 제어실<\/td><\/tr>\n<tr><td>열 탐지기(정온식·차동식)<\/td><td>온도 또는 온도 상승률<\/td><td>조리실, 세탁실, 작업장<\/td><\/tr>\n<tr><td>불꽃 탐지기(UV·IR)<\/td><td>불꽃 방사<\/td><td>기관 주변, 보일러, 청정기<\/td><\/tr>\n<tr><td>흡입식 연기 탐지<\/td><td>배관으로 공기를 흡입해 분석<\/td><td>화물창(CO₂ 배관과 겸용)<\/td><\/tr>\n<tr><td>수동 발신기, 가스 탐지기, 영상 감시<\/td><td>-<\/td><td>탈출로, 위험구역, 로로 구역<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>소화장치<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>용도<\/th><\/tr><\/thead><tbody>\n<tr><td>고정식 CO₂(고압 용기·저압 탱크)<\/td><td>기관실·화물창 전역 방출(인원 대피 확인 후)<\/td><\/tr>\n<tr><td>고정식 수계(물분무, 국소 미분무)<\/td><td>기관실 고위험 장비 국소 방어(2,000 GT 이상 A류 기관구역), 로로 구역 드렌처<\/td><\/tr>\n<tr><td>고팽창 포말<\/td><td>기관실 전역(내부 공기 이용 방식)<\/td><\/tr>\n<tr><td>갑판 포말<\/td><td>유조선 화물 갑판<\/td><\/tr>\n<tr><td>스프링클러<\/td><td>여객선 거주구, IIC 방식 화물선<\/td><\/tr>\n<tr><td>건조 분말<\/td><td>가스운반선 화물 갑판·매니폴드<\/td><\/tr>\n<tr><td>소화 주관·소화전·호스, 소화 펌프(주·비상)<\/td><td>전 선박 기본<\/td><\/tr>\n<tr><td>휴대식·이동식 소화기, 소방원 장구, EEBD<\/td><td>초기 소화·대응<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>소방설비 전체 구성<\/h4>\n<p>탐지·경보, 소화, 구조적 방화(A·B·C급 구획, 방화문·댐퍼, 불연재), 비상 차단(연료 원격 차단 밸브, 환기 정지), 화재 제어도(fire control plan), 훈련으로 이루어진다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">121-2-5<\/td><td>화재 원인, 탐지·소화장치, 소방설비<\/td><td>예방-탐지-소화-확산방지 4단계<\/td><\/tr>\n<tr><td class=\"num\">133-2-2<\/td><td>화재 감지시스템<\/td><td>탐지기 종류·설치 장소·시스템 구성<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 121회형\">\n<h5>1. 화재 원인<\/h5><p>연료·윤활유가 고온 표면(약 220 °C 이상)에 접촉(기관실 화재 대부분), 전기 단락, 리튬 배터리 열폭주, 화기작업, 조리실, 자연발화, 이코노마이저 매연 화재.<\/p>\n<h5>2. 탐지장치<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>설치<\/th><\/tr><\/thead><tbody>\n<tr><td>연기(광전식)<\/td><td>거주구·복도·계단·제어실<\/td><\/tr>\n<tr><td>열(정온·차동)<\/td><td>조리실·세탁실·작업장<\/td><\/tr>\n<tr><td>불꽃(UV·IR)<\/td><td>기관·보일러·청정기 주변<\/td><\/tr>\n<tr><td>흡입식 연기<\/td><td>화물창<\/td><\/tr>\n<tr><td>수동 발신기·가스 탐지·영상<\/td><td>탈출로·위험구역·로로<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 소화장치<\/h5><p>고정식 CO₂(기관실·화물창), 국소 수계(미분무, 2,000 GT 이상 A류 기관구역), 고팽창 포말, 갑판 포말(유조선), 스프링클러, 건조 분말(가스선), 소화 주관·펌프, 휴대식 소화기.<\/p>\n<h5>4. 소방설비 체계<\/h5><p>예방(이중 연료관, 고온부 보온) → 탐지·경보 → 소화 → 구조적 방화(A·B·C급, 방화문·댐퍼) → 비상 차단(연료·환기) → 화재 제어도·훈련.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 기관실 화재는 누설 연료와 고온 표면의 만남이므로 이중 연료관·보온·누설 감지 같은 예방 설계가 가장 효과적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"fire-methods","p":12,"n":"12.6","h":"SOLAS 거주구 방화대책 방법 IC, IIC, IIIC","t":"SOLAS 거주구 방화대책 방법 IC, IIC, IIIC","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 4교시 1번 · 25점"],"q":["<b>136회(2025) 4-1<\/b> SOLAS 거주구 방화대책 방법 IC, IIC, IIIC"],"k":"SOLAS II-2/9는 화물선 거주·업무구역의 방화 방법을 세 가지 중 하나로 선택하게 한다. IC는 구조(불연 구획)로, IIC는 자동 스프링클러로, IIIC는 고정식 화재탐지와 구획 면적 제한으로 화재를 관리한다.","x":"\n<p class=\"key\">SOLAS II-2/9는 화물선 거주·업무구역의 방화 방법을 세 가지 중 하나로 선택하게 한다. IC는 구조(불연 구획)로, IIC는 자동 스프링클러로, IIIC는 고정식 화재탐지와 구획 면적 제한으로 화재를 관리한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>내용<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>IC<\/td><td>모든 내부 구획 격벽을 불연성 B급 또는 C급으로 구성. 일반적으로 자동 스프링클러·화재탐지 설비 없이(단, 복도·계단·탈출로의 연기 탐지는 필수)<\/td><td>구조적 방화에 의존, 설비 단순, 화물선에서 가장 일반적<\/td><\/tr>\n<tr><td>IIC<\/td><td>화재 발생 가능 모든 구역에 자동 스프링클러·화재탐지·경보 설비. 내부 격벽 형식 제한은 일반적으로 없음<\/td><td>내장재 선택 자유, 설비비·유지 증가<\/td><\/tr>\n<tr><td>IIIC<\/td><td>화재 발생 가능 구역에 고정식 화재탐지·경보 설비. 내부 격벽 형식 제한은 일반적으로 없으나, A급 또는 B급으로 둘러싸인 거주구역 1개의 면적이 50 m²를 넘지 않을 것<\/td><td>탐지 + 구획 면적 제한<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>어느 방법이든 주요 경계(기관구역·조리실과 거주구 사이)는 A-60 등 별도 방화 등급을 적용하고, 내장재는 저화염 확산·불연 재료(FTP Code 시험)를 쓴다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 근거<\/h5><p>SOLAS II-2/9: 화물선 거주·업무구역 방화 방법 3가지 중 선택.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방법<\/th><th>내용<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>IC<\/td><td>모든 내부 구획을 불연성 B·C급으로, 일반적으로 스프링클러·탐지 없음(복도·계단 연기 탐지는 필수)<\/td><td>구조적 방화, 화물선에서 가장 일반적<\/td><\/tr>\n<tr><td>IIC<\/td><td>화재 가능 모든 구역 자동 스프링클러 + 탐지·경보, 격벽 형식 제한 일반적으로 없음<\/td><td>내장재 자유, 설비비↑<\/td><\/tr>\n<tr><td>IIIC<\/td><td>화재 가능 구역 고정식 탐지·경보, A·B급 둘러싸인 거주구역 1개 50 m² 이하<\/td><td>탐지 + 면적 제한<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 공통<\/h5><p>주요 경계(기관구역·조리실–거주구) A-60 등 별도 등급, 저화염 확산·불연 재료(FTP Code).<\/p>\n<p class=\"concl\"><b>3. 결론<\/b>: 방법 선택은 내장 설계 자유도와 설비비의 절충이며, 선주 사양과 기국 요구를 초기에 확정해야 함.<\/p><\/div><\/section><\/details>"},{"id":"ev-carrier-fire","p":12,"n":"12.7","h":"국내법상 전기자동차 운송선박에 비치하여야 하는 소방설비","t":"국내법상 전기자동차 운송선박에 비치하여야 하는 소방설비","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 2교시 1번 · 25점"],"q":["<b>139회(2026) 2-1<\/b> 국내법에 따라 전기자동차 운송선박에 비치하여야 하는 소방설비"],"k":"해양수산부 고시 「선박소방설비기준」 제97조는 전기자동차를 운송하는 카페리선박(자동차운반선 포함)에 상방향·측면·내부 물분사장치 중 1조, 질식소화덮개 1개, 소방원장구 2조를 갖추도록 한다. 장치 성능은 별표 14에 적합해야 하고, 선종별로 2026~2028년 사이 검사 시점부터 적용된다.","x":"\n<p class=\"key\">해양수산부 고시 「선박소방설비기준」 제97조는 전기자동차를 운송하는 카페리선박(자동차운반선 포함)에 상방향·측면·내부 물분사장치 중 1조, 질식소화덮개 1개, 소방원장구 2조를 갖추도록 한다. 장치 성능은 별표 14에 적합해야 하고, 선종별로 2026~2028년 사이 검사 시점부터 적용된다.<\/p>\n<h4>제97조 요건<\/h4>\n<ol>\n<li>상방향 물 분사 장치 1조, 측면 물 분사 장치 1조, 내부 물 분사 장치 1조 중 어느 하나의 설비<\/li>\n<li>질식소화덮개 1개<\/li>\n<li>소방원장구 2조(제56조·제72조 등으로 이미 비치한 소방원장구도 인정)<\/li>\n<\/ol>\n<ul>\n<li>제1호·제2호 설비는 별표 14(전기자동차 운송선박의 소방설비 성능 요건)에 적합한 제품이어야 한다.<\/li>\n<li>격벽으로 구분된 구역 간 이동이 현저히 곤란하면 구역별로 추가 비치.<\/li>\n<li>면제: 최고속력 기준 항해시간 30분 미만의 평수구역 이하 항해 선박은 전부, 최대승선인원 중 선원 2명 이하 선박은 질식소화덮개, 소화펌프 비치 의무가 없는 선박은 물분사장치.<\/li>\n<\/ul>\n<h4>적용 시기(2025.9.5. 개정 부칙)<\/h4>\n<ul>\n<li>카페리여객선: 2026년 4월 1일 이후 최초 정기·중간검사부터.<\/li>\n<li>국내항해 카페리선박(여객선 외): 2027년 1월 1일 이후.<\/li>\n<li>국제항해 카페리선박(여객선 외, 자동차운반선 포함): 2028년 1월 1일 이후.<\/li>\n<\/ul>\n<h4>배경과 기술적 의미<\/h4>\n<p>리튬이온 배터리 화재는 열폭주로 산소 없이도 재발화하고 독성 가스를 내므로, 일반 소화로 진압이 어렵다. 질식소화덮개로 산소와 확산을 차단하고, 하부·측면·내부 물분사로 배터리 팩을 직접 냉각하는 전략이다. 국제적으로는 IMO 대체연료 차량 로로 구역 지침(MSC.1/Circ.1615)과 로로 구역 화재안전 SOLAS 개정 논의가 진행 중이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 근거<\/h5><p>해양수산부 고시 「선박소방설비기준」 제97조(전기자동차 운송선박의 소방설비).<\/p>\n<h5>2. 비치 설비(카페리선박, 자동차운반선 포함)<\/h5><ol><li>상방향·측면·내부 물 분사 장치 중 1조<\/li><li>질식소화덮개 1개<\/li><li>소방원장구 2조(기존 비치분 인정)<\/li><\/ol><p>제1·2호는 별표 14 성능 요건 적합, 구역 간 이동 곤란 시 구역별 추가.<\/p>\n<h5>3. 면제<\/h5><ul><li>항해시간 30분 미만 평수구역 이하: 전부<\/li><li>선원 2명 이하: 질식소화덮개<\/li><li>소화펌프 의무 없는 선박: 물분사장치<\/li><\/ul>\n<h5>4. 적용 시기(2025.9.5 개정 부칙)<\/h5><p>카페리여객선 2026.4.1 / 국내항해 카페리 2027.1.1 / 국제항해 카페리 2028.1.1 이후 최초 정기·중간검사<\/p>\n<h5>5. 기술적 의미<\/h5><p>리튬 배터리 열폭주는 산소 없이 재발화·독성 가스 → 덮개로 차단·확산 방지 + 하부·내부 냉각. 국제적으로 MSC.1/Circ.1615 지침과 로로 구역 SOLAS 개정 논의.<\/p>\n<p class=\"concl\"><b>6. 결론<\/b>: 이동식 장비 비치는 최소 요건이며, 신조선은 조기 탐지(영상·열화상)와 구역 분리 설계를 함께 검토해야 함.<\/p><\/div><\/section><\/details>"},{"id":"nav-lights","p":12,"n":"12.8","h":"항해등(Navigation Lights)의 종류, 사용시점, 색상과 배치","t":"항해등(Navigation Lights)의 종류, 사용시점, 색상과 배치","c":3,"r":2,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 3교시 2번 · 25점","133회 3교시 1번 · 25점","139회 1교시 9번 · 10점"],"q":["<b>118회(2019) 3-2<\/b> COLREG 항해등의 종류와 사용시점 및 색상","<b>133회(2024) 3-1<\/b> COLREG 항해등의 종류와 사용시점 및 색상","<b>139회(2026) 1-9<\/b> 항해등(navigation light)의 종류 및 배치"],"k":"COLREG는 일몰부터 일출까지와 제한된 시계에서 항해등을 켜도록 하며, 등의 색과 수평 사광 범위로 선박의 종류·크기·상태와 진행 방향을 알린다. 동력선의 기본은 마스트등(백), 현등(우현 녹·좌현 홍), 선미등(백)이다.","x":"\n<p class=\"key\">COLREG는 일몰부터 일출까지와 제한된 시계에서 항해등을 켜도록 하며, 등의 색과 수평 사광 범위로 선박의 종류·크기·상태와 진행 방향을 알린다. 동력선의 기본은 마스트등(백), 현등(우현 녹·좌현 홍), 선미등(백)이다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"항해등 사광 범위\">\n<path d=\"M210 130 L210 20 A110 110 0 0 1 311 172 Z\" style=\"fill:var(--green-bg);stroke:var(--green)\"/>\n<path d=\"M210 130 L210 20 A110 110 0 0 0 109 172 Z\" style=\"fill:var(--red-bg);stroke:var(--red)\"/>\n<path d=\"M210 130 L311 172 A110 110 0 0 1 109 172 Z\" style=\"fill:var(--sheet);stroke:var(--muted)\"/>\n<path d=\"M190 110 L210 60 L230 110 L230 200 L190 200 Z\" class=\"fw\"/>\n<text x=\"250\" y=\"70\" class=\"t1\" style=\"fill:var(--green)\">우현등 녹 112.5°<\/text><text x=\"104\" y=\"70\" class=\"t1\" style=\"fill:var(--red)\">좌현등 홍 112.5°<\/text>\n<text x=\"168\" y=\"228\" class=\"t1\">선미등 백 135°<\/text><text x=\"236\" y=\"120\" class=\"t2\">마스트등 백 225°<\/text>\n<\/svg><figcaption>현등은 정선수에서 정횡 후방 22.5°까지, 선미등은 나머지 135°를 비춘다. 마스트등은 현등 두 개를 합친 225°.<\/figcaption><\/figure>\n<h4>등의 종류<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등<\/th><th>색<\/th><th>사광 범위<\/th><th>최소 가시거리(L ≥ 50 m)<\/th><\/tr><\/thead><tbody>\n<tr><td>마스트등<\/td><td>백<\/td><td>225°<\/td><td class=\"num\">6해리<\/td><\/tr>\n<tr><td>현등<\/td><td>우현 녹, 좌현 홍<\/td><td>각 112.5°<\/td><td class=\"num\">3해리<\/td><\/tr>\n<tr><td>선미등<\/td><td>백<\/td><td>135°<\/td><td class=\"num\">3해리<\/td><\/tr>\n<tr><td>예선등<\/td><td>황<\/td><td>135°<\/td><td class=\"num\">3해리<\/td><\/tr>\n<tr><td>전주등<\/td><td>백·홍·녹 등<\/td><td>360°<\/td><td class=\"num\">3해리<\/td><\/tr>\n<tr><td>섬광등<\/td><td>-<\/td><td>360°, 분당 120회 이상<\/td><td>-<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>상태 표시 예<\/h4>\n<ul>\n<li>정박: 앞쪽 전주 백등 + 뒤쪽 낮은 전주 백등(50 m 이상).<\/li>\n<li>조종불능선: 수직 전주 홍등 2개. 조종제한선: 홍-백-홍. 흘수 제약선: 홍등 3개.<\/li>\n<li>좌초: 정박등 + 홍등 2개. 도선선: 백 위 홍. 트롤 어선: 녹 위 백.<\/li>\n<\/ul>\n<h4>배치(COLREG Annex I)<\/h4>\n<ul>\n<li>길이 50 m 이상 동력선: 마스트등 2개, 뒤쪽 등이 앞쪽보다 4.5 m 이상 높게, 수평 간격은 선장의 절반 이상(100 m 초과 불필요).<\/li>\n<li>앞 마스트등 높이: 선체 위 6 m 이상(폭이 더 크면 폭 이상, 12 m 초과 불필요).<\/li>\n<li>현등은 앞 마스트등 높이의 3/4 이하, 안쪽 차광판으로 반대 현 방향 차단.<\/li>\n<li>마스트·크레인·컨테이너가 사광 범위를 가리지 않게 배치, 주·예비 등과 비상 전원, 등 고장 경보(항해등 제어반).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-3-2 · 133-3-1<\/td><td>항해등 종류, 사용시점, 색상<\/td><td class=\"num\">25<\/td><td>등 종류 표 + 사광 범위 그림 + 상태 표시등<\/td><\/tr>\n<tr><td class=\"num\">139-1-9<\/td><td>항해등 종류 및 배치<\/td><td class=\"num\">10<\/td><td>Annex I 높이·간격 규정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5>\n<p>COLREG는 항해등의 색·사광 범위·조합으로 선박의 종류·크기·상태·진행 방향을 알려 충돌을 예방함.<\/p>\n<h5>2. 사용 시점<\/h5>\n<p>일몰부터 일출까지, 제한된 시계에서는 주간에도 점등. 형상물은 주간에 사용.<\/p>\n<h5>3. 등의 종류와 색상<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등<\/th><th>색<\/th><th>사광 범위<\/th><th>가시거리(50 m 이상)<\/th><\/tr><\/thead><tbody>\n<tr><td>마스트등<\/td><td>백<\/td><td>225°<\/td><td>6해리<\/td><\/tr>\n<tr><td>현등<\/td><td>우 녹 / 좌 홍<\/td><td>각 112.5°<\/td><td>3해리<\/td><\/tr>\n<tr><td>선미등<\/td><td>백<\/td><td>135°<\/td><td>3해리<\/td><\/tr>\n<tr><td>예선등<\/td><td>황<\/td><td>135°<\/td><td>3해리<\/td><\/tr>\n<tr><td>전주등<\/td><td>백·홍·녹<\/td><td>360°<\/td><td>3해리<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 상태별 표시<\/h5>\n<ul><li>조종불능선: 홍 전주등 2개(수직) / 조종제한선: 홍-백-홍 / 흘수제약선: 홍 3개<\/li>\n<li>정박: 앞 백 전주등 + 뒤 낮은 백 전주등 / 좌초: 정박등 + 홍 2개<\/li>\n<li>도선선: 백 위 홍 / 트롤 어선: 녹 위 백 / 예인: 마스트등 2~3개 수직 + 예선등<\/li><\/ul>\n<h5>5. 배치(Annex I)<\/h5>\n<ul><li>50 m 이상: 마스트등 2개, 뒤 등이 4.5 m 이상 높게, 수평 간격 L/2 이상(100 m 초과 불요)<\/li>\n<li>앞 마스트등: 선체 위 6 m 이상(폭이 크면 폭, 12 m 초과 불요), 현등은 앞 마스트등 높이 3/4 이하, 안쪽 차광판<\/li>\n<li>마스트·크레인·컨테이너에 가리지 않게, 주·예비 등, 비상 전원, 고장 경보<\/li><\/ul>\n<p class=\"concl\"><b>6. 결론<\/b>: 대형 컨테이너선은 갑판 적재 높이와 상부구조 배치가 등 시야를 가리기 쉬우므로, 일반배치 단계에서 사광 범위 간섭을 3D로 검토해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 139회형(종류 및 배치)\">\n<h5>1. 종류<\/h5>\n<p>마스트등(백 225°), 현등(녹·홍 각 112.5°), 선미등(백 135°), 예선등(황 135°), 전주등(360°)<\/p>\n<h5>2. 배치<\/h5>\n<ul><li>마스트등 2개(50 m 이상), 뒤 등 4.5 m 이상 높게, 간격 L/2 이상<\/li><li>앞 마스트등 선체 위 6 m 이상, 현등은 그 높이의 3/4 이하·차광판<\/li><li>사광 범위가 구조물에 가리지 않게, 비상 전원·고장 경보<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 등 배치는 선교 시야(SOLAS V/22)·안테나 배치와 함께 마스트 설계 초기에 확정해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"nuc","p":12,"n":"12.9","h":"조종불능선(Vessel Not Under Command)","t":"조종불능선(Vessel Not Under Command)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 11번 · 10점"],"q":["<b>127회(2022) 1-11<\/b> 조종불능선"],"k":"조종불능선은 예외적인 사정(기관 고장, 조타 고장 등)으로 COLREG가 요구하는 조종을 할 수 없어 다른 선박의 진로를 피할 수 없는 선박이다(COLREG 제3조). 다른 선박들이 조종불능선의 진로를 피할 의무를 진다.","x":"\n<p class=\"key\">조종불능선은 예외적인 사정(기관 고장, 조타 고장 등)으로 COLREG가 요구하는 조종을 할 수 없어 다른 선박의 진로를 피할 수 없는 선박이다(COLREG 제3조). 다른 선박들이 조종불능선의 진로를 피할 의무를 진다.<\/p>\n<ul>\n<li><b>등화<\/b>(제27조): 가장 잘 보이는 곳에 수직으로 전주 홍등 2개. 대수속력이 있으면 현등과 선미등을 추가.<\/li>\n<li><b>형상물<\/b>(주간): 수직으로 구형 2개.<\/li>\n<li><b>음향신호<\/b>(제35조, 제한된 시계): 2분을 넘지 않는 간격으로 장음 1회 + 단음 2회.<\/li>\n<li><b>항법<\/b>(제18조): 동력선·범선·어로 중인 선박은 조종불능선의 진로를 피한다.<\/li>\n<li><b>구분<\/b>: 조종제한선(작업 성질상 조종 제한, 예: 준설·케이블 부설), 흘수제약선(흘수 때문에 침로 이탈 제한)과 다르다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>예외적 사정(기관·조타 고장)으로 규칙상 조종을 할 수 없어 다른 선박의 진로를 피할 수 없는 선박(COLREG 제3조).<\/p>\n<h5>2. 표시<\/h5><ul><li>등화: 전주 홍등 2개 수직(+대수속력 시 현등·선미등)<\/li><li>형상물: 구형 2개 수직<\/li><li>음향: 장음 1 + 단음 2, 2분 이내 간격<\/li><\/ul>\n<h5>3. 항법<\/h5><p>동력선·범선·어로선이 진로를 피함(제18조). 조종제한선·흘수제약선과 구분.<\/p><\/div><\/section><\/details>"},{"id":"mlc","p":12,"n":"12.10","h":"MLC 2006(해사노동협약)","t":"MLC 2006(해사노동협약)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 7번 · 10점"],"q":["<b>112회(2017) 1-7<\/b> MLC 2006(해사노동협약)"],"k":"MLC 2006은 선원의 근로·생활 조건 최저 기준을 하나로 통합한 ILO 협약으로, \"선원 권리장전\"이라 불린다. 2013년 8월 20일 발효되었고, 500 GT 이상 국제항해 선박은 해사노동증서와 해사노동준수선언서(DMLC)를 비치하고 항만국 통제를 받는다.","x":"\n<p class=\"key\">MLC 2006은 선원의 근로·생활 조건 최저 기준을 하나로 통합한 ILO 협약으로, \"선원 권리장전\"이라 불린다. 2013년 8월 20일 발효되었고, 500 GT 이상 국제항해 선박은 해사노동증서와 해사노동준수선언서(DMLC)를 비치하고 항만국 통제를 받는다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>편(Title)<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>1 승선 최저 요건<\/td><td>최저 연령 16세, 건강증명서, 훈련·자격, 선원 모집·배치<\/td><\/tr>\n<tr><td>2 고용 조건<\/td><td>근로계약, 임금, 근로·휴식시간(휴식 24시간 중 10시간·7일 중 77시간 이상, 또는 근로 24시간 14시간·7일 72시간 이하), 휴가, 송환, 정원<\/td><\/tr>\n<tr><td>3 거주·오락·식량<\/td><td>침실 면적·천장 높이, 소음·진동, 조명·환기·난방, 위생, 병실, 오락시설, 급식<\/td><\/tr>\n<tr><td>4 건강·복지·사회보장<\/td><td>선내외 의료, 선주 책임, 산업안전·사고 예방, 육상 복지<\/td><\/tr>\n<tr><td>5 이행·집행<\/td><td>기국 검사·증서, 선내 고충 처리, 항만국 통제<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>조선 설계 영향(Title 3)<\/h4>\n<ul>\n<li>1인실 침실 바닥 면적: 3,000 GT 미만 4.5 m², 3,000~10,000 GT 5.5 m², 10,000 GT 이상 7 m²(일반 선원 기준, 사관은 더 넓음).<\/li>\n<li>천장 높이 203 cm 이상, 거주구는 화물·기관구역과 분리, 소음·진동 기준(IMO 소음 코드와 연계).<\/li>\n<li>병실(15인 이상·3일 이상 항해), 세면·화장실 비율, 오락실, 조리실 설계.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선원 근로·생활 최저 기준 통합 ILO 협약, 2013.8.20 발효. 500 GT 이상 국제항해선은 해사노동증서·DMLC 비치.<\/p>\n<h5>2. 구성<\/h5><p>Title 1 승선 요건(16세, 건강증명) / 2 고용(휴식 24시간 10시간·7일 77시간 이상) / 3 거주·급식 / 4 보건·복지 / 5 이행·PSC<\/p>\n<h5>3. 설계 영향<\/h5><p>침실 면적(3,000 GT 미만 4.5, 3,000~10,000 GT 5.5, 10,000 GT 이상 7 m²), 천장 203 cm, 병실, 소음·진동.<\/p><\/div><\/section><\/details>"},{"id":"isps","p":12,"n":"12.11","h":"ISPS Code(선박 및 항만시설 보안 규칙)","t":"ISPS Code(선박 및 항만시설 보안 규칙)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 11번 · 10점"],"q":["<b>118회(2019) 1-11<\/b> ISPS Code"],"k":"ISPS Code는 2001년 9·11 테러 후 SOLAS XI-2로 도입되어 2004년 7월 1일 발효된 보안 규정이다. 선박과 항만시설이 보안 평가를 하고 보안계획을 세워 보안 등급(1·2·3)에 따라 출입 통제와 감시를 시행하게 한다.","x":"\n<p class=\"key\">ISPS Code는 2001년 9·11 테러 후 SOLAS XI-2로 도입되어 2004년 7월 1일 발효된 보안 규정이다. 선박과 항만시설이 보안 평가를 하고 보안계획을 세워 보안 등급(1·2·3)에 따라 출입 통제와 감시를 시행하게 한다.<\/p>\n<ul>\n<li><b>대상<\/b>: 500 GT 이상 국제항해 화물선, 모든 국제항해 여객선, 이동식 해양구조물, 이들을 받는 항만시설.<\/li>\n<li><b>구성<\/b>: Part A 강제, Part B 권고 지침.<\/li>\n<li><b>선박 측<\/b>: 선박 보안 평가(SSA) → 선박 보안 계획(SSP) 승인 → 선박 보안 책임자(SSO), 회사 보안 책임자(CSO) 지정 → 국제선박보안증서(ISSC, 5년, 중간 심사).<\/li>\n<li><b>보안 등급<\/b>: 1(평상), 2(위험 증가), 3(위험 임박). 등급별 출입 통제·제한구역·화물 검색 강화.<\/li>\n<li><b>설비<\/b>: 선박보안경보장치(SSAS, 은밀 발신), AIS, 연속이력기록(CSR), 출입 통제 장비.<\/li>\n<li><b>훈련<\/b>: 3개월마다 보안 훈련, 연 1회 연습.<\/li>\n<li>항만시설: 항만시설 보안 평가·계획, 항만시설 보안 책임자(PFSO), 선박-항만 보안 선언(DoS).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>SOLAS XI-2 선박·항만시설 보안 규칙, 2004.7.1 발효(9·11 이후).<\/p>\n<h5>2. 내용<\/h5><ul><li>대상: 500 GT 이상 국제항해 화물선, 여객선, 이동식 해양구조물, 항만시설<\/li><li>SSA → SSP 승인 → SSO·CSO 지정 → ISSC(5년)<\/li><li>보안 등급 1·2·3, SSAS, 3개월 훈련·연 1회 연습<\/li><\/ul><\/div><\/section><\/details>"},{"id":"ism","p":12,"n":"12.12","h":"ISM Code와 ISO 9001","t":"ISM Code와 ISO 9001","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 4번 · 10점"],"q":["<b>121회(2020) 1-4<\/b> ISM Code와 ISO 9001"],"k":"ISM Code는 선박의 안전 운항과 오염 방지를 위한 안전관리체제(SMS)를 회사와 선박에 강제하는 국제 규정(SOLAS IX)이고, ISO 9001은 고객 만족과 지속적 개선을 위한 품질경영시스템의 자율 국제표준이다. 둘 다 PDCA 구조와 문서화·내부심사·경영검토를 공유하지만 목적·강제성·심사 주체가 다르다.","x":"\n<p class=\"key\">ISM Code는 선박의 안전 운항과 오염 방지를 위한 안전관리체제(SMS)를 회사와 선박에 강제하는 국제 규정(SOLAS IX)이고, ISO 9001은 고객 만족과 지속적 개선을 위한 품질경영시스템의 자율 국제표준이다. 둘 다 PDCA 구조와 문서화·내부심사·경영검토를 공유하지만 목적·강제성·심사 주체가 다르다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>ISM Code<\/th><th>ISO 9001<\/th><\/tr><\/thead><tbody>\n<tr><td>목적<\/td><td>해상 안전, 인명·환경 피해 방지<\/td><td>품질(고객 요구 만족), 지속적 개선<\/td><\/tr>\n<tr><td>강제성<\/td><td>강제(SOLAS IX, 1998·2002 단계 적용)<\/td><td>자율<\/td><\/tr>\n<tr><td>대상<\/td><td>선사(회사)와 선박<\/td><td>모든 산업 조직<\/td><\/tr>\n<tr><td>핵심 요소<\/td><td>안전·환경 정책, 책임과 권한, 지정자(DPA), 선장 권한, 인력·훈련, 선상 운항 절차, 비상 대비, 부적합·사고 보고, 정비, 문서 관리, 내부심사<\/td><td>조직 상황, 리더십, 위험 기반 사고, 프로세스 접근, 지원, 운용, 성과 평가, 개선<\/td><\/tr>\n<tr><td>인증<\/td><td>회사 적합서류(DOC), 선박 안전관리증서(SMC), 5년 유효, 기국 또는 대행 선급 심사<\/td><td>인증기관 심사, 3년 유효<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>국내 연안 선박에는 해상교통안전법의 안전관리체제(국내형 ISM)가 적용된다. 조선소는 ISO 9001(품질)과 ISO 45001(안전보건), ISO 14001(환경)을 함께 운영한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>ISM Code<\/th><th>ISO 9001<\/th><\/tr><\/thead><tbody>\n<tr><td>목적<\/td><td>안전 운항·오염 방지<\/td><td>품질·고객 만족<\/td><\/tr>\n<tr><td>강제성<\/td><td>강제(SOLAS IX)<\/td><td>자율<\/td><\/tr>\n<tr><td>대상<\/td><td>선사·선박<\/td><td>모든 조직<\/td><\/tr>\n<tr><td>핵심<\/td><td>SMS, DPA, 선장 권한, 비상 대비, 정비<\/td><td>프로세스 접근, 위험 기반, 개선<\/td><\/tr>\n<tr><td>인증<\/td><td>DOC·SMC 5년, 기국·RO<\/td><td>인증기관 3년<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 둘 다 PDCA·내부심사 구조를 공유하나 ISM은 안전, ISO는 품질이 목적임.<\/p><\/div><\/section><\/details>"},{"id":"imsas","p":12,"n":"12.13","h":"IMSAS(IMO 회원국 감사제도)","t":"IMSAS(IMO 회원국 감사제도)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 3번 · 10점"],"q":["<b>121회(2020) 1-3<\/b> IMSAS"],"k":"IMSAS는 IMO 회원국이 기국·항만국·연안국으로서 IMO 협약을 제대로 이행하고 있는지 IMO가 감사하는 제도다. 2006년 자율 감사(VIMSAS)로 시작해 2016년 1월 1일부터 강제화되었다.","x":"\n<p class=\"key\">IMSAS는 IMO 회원국이 기국·항만국·연안국으로서 IMO 협약을 제대로 이행하고 있는지 IMO가 감사하는 제도다. 2006년 자율 감사(VIMSAS)로 시작해 2016년 1월 1일부터 강제화되었다.<\/p>\n<ul>\n<li><b>근거<\/b>: IMO 협약 이행 규칙(III Code, A.1070(28)). 감사 대상 협약은 SOLAS, MARPOL, STCW, 만재흘수선, 톤수, COLREG.<\/li>\n<li><b>주기<\/b>: 대략 7년 주기로 전 회원국 감사.<\/li>\n<li><b>내용<\/b>: 법령 반영, 행정 조직, 선급 등 대행기관(RO) 관리, 검사·증서 발급, 해양사고 조사, 항만국 통제 이행.<\/li>\n<li><b>결과<\/b>: 발견사항(findings)과 시정조치 계획, 후속 감사, 요약 보고서 공유(GISIS).<\/li>\n<li><b>의의<\/b>: 기국의 이행 수준을 높여 저기준선 방지. 선급(RO)은 RO Code를 통해 기국의 감독을 받는다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>IMO 회원국 감사제도: 기국·항만국·연안국 협약 이행 감사, 2006 자율(VIMSAS) → 2016.1.1 강제.<\/p>\n<h5>2. 내용<\/h5><ul><li>근거: III Code(A.1070(28)), 대상 협약 SOLAS·MARPOL·STCW·LL·톤수·COLREG<\/li><li>대략 7년 주기, 법령·조직·RO 관리·검사·사고조사·PSC 점검<\/li><li>발견사항 → 시정조치 → 후속 감사<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 기국 이행 수준을 높여 선급(RO)에 대한 기국 감독도 강화됨.<\/p><\/div><\/section><\/details>"},{"id":"iacs","p":12,"n":"12.14","h":"국제선급연합회(IACS)","t":"국제선급연합회(IACS)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 12번 · 10점","133회 1교시 6번 · 10점"],"q":["<b>118회(2019) 1-12<\/b> IACS","<b>133회(2024) 1-6<\/b> 국제선급협회(IACS)"],"k":"IACS(International Association of Classification Societies)는 1968년 설립된 주요 선급협회의 국제 연합체로, 공통 기술 기준(UR, UI, Rec, CSR)을 만들어 회원 선급 규칙에 반영하고 IMO에 비정부 자문기관으로 참여한다. 2026년 현재 12개 선급이 회원이다.","x":"\n<p class=\"key\">IACS(International Association of Classification Societies)는 1968년 설립된 주요 선급협회의 국제 연합체로, 공통 기술 기준(UR, UI, Rec, CSR)을 만들어 회원 선급 규칙에 반영하고 IMO에 비정부 자문기관으로 참여한다. 2026년 현재 12개 선급이 회원이다.<\/p>\n<ul>\n<li><b>회원<\/b>: ABS, BV, CCS, CRS, DNV, IRS, KR(한국선급), LR, ClassNK, PRS, RINA, TL.<\/li>\n<li><b>기술 문서<\/b>:\n<ul><li>UR(Unified Requirements): 회원 선급이 규칙에 반드시 반영하는 통일 요건(예: S11 종강도, S14 탱크 시험, S33 취성균열 정지, A1 의장수, M68 축계 비틀림).<\/li>\n<li>UI(Unified Interpretations): IMO 협약 조항의 통일 해석.<\/li>\n<li>Rec(Recommendations): 권고(예: Rec. 47 조선 품질 표준).<\/li>\n<li>PR(Procedural Requirements): 선급 이전·이중 선급 등 절차.<\/li>\n<li>CSR: 벌크선·유조선 공통구조규칙(2015 통합).<\/li><\/ul><\/li>\n<li><b>품질<\/b>: 회원 품질시스템 인증(QSCS) 감사.<\/li>\n<li><b>역할<\/b>: 선급 간 기준 일관성, IMO 규정 개발 지원(목표기반 표준 GBS 검증 등), 업계 기술 리더십.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-12 · 133-1-6<\/td><td>IACS<\/td><td>설립·회원·UR/UI/Rec/CSR·IMO 역할<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>국제선급연합회: 1968년 설립된 주요 선급의 연합체(현재 12개, 한국선급 포함), IMO 비정부 자문기관.<\/p>\n<h5>2. 기술 문서<\/h5><ul><li>UR: 회원 필수 반영 통일 요건(S11 종강도, S14 탱크시험, S33 취성균열, A1 의장수)<\/li><li>UI: IMO 협약 통일 해석 / Rec: 권고(Rec.47 품질 표준) / PR: 절차<\/li><li>CSR: 벌크선·유조선 공통구조규칙(2015 통합)<\/li><\/ul>\n<h5>3. 역할<\/h5><p>선급 간 기준 일관성, 품질시스템 인증(QSCS), IMO 규정 개발 지원.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: UR은 선급 규칙에 바로 반영되므로 설계자는 개정 동향(사이버 E26/E27 등)을 추적해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"msc-subcommittees","p":12,"n":"12.15","h":"해사안전위원회(MSC)의 하위 전문위원회","t":"해사안전위원회(MSC)의 하위 전문위원회","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 2교시 3번 · 25점"],"q":["<b>133회(2024) 2-3<\/b> MSC의 하위 전문위원회"],"k":"IMO는 2014년 하위위원회를 7개로 재편했다. 대부분 MSC에 보고하며, PPR은 주로 MEPC에, III는 MSC와 MEPC 모두에 보고한다.","x":"\n<p class=\"key\">IMO는 2014년 하위위원회를 7개로 재편했다. 대부분 MSC에 보고하며, PPR은 주로 MEPC에, III는 MSC와 MEPC 모두에 보고한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>약칭<\/th><th>명칭<\/th><th>주요 업무<\/th><\/tr><\/thead><tbody>\n<tr><td>HTW<\/td><td>Human Element, Training and Watchkeeping<\/td><td>STCW, 선원 훈련·당직, 인적 요소<\/td><\/tr>\n<tr><td>III<\/td><td>Implementation of IMO Instruments<\/td><td>협약 이행, 기국·항만국 통제, 사고 분석, IMSAS<\/td><\/tr>\n<tr><td>NCSR<\/td><td>Navigation, Communications and Search and Rescue<\/td><td>항해 장비, 선박 통항, GMDSS, 수색구조, e-navigation<\/td><\/tr>\n<tr><td>PPR<\/td><td>Pollution Prevention and Response<\/td><td>MARPOL 기술 기준, 유해물질, 블랙카본, 오염 대응<\/td><\/tr>\n<tr><td>SDC<\/td><td>Ship Design and Construction<\/td><td>복원성(2세대), 구획, 구조, 만재흘수선, 극지 코드, GBS<\/td><\/tr>\n<tr><td>SSE<\/td><td>Ship Systems and Equipment<\/td><td>구명설비, 방화설비, 기관·전기 설비<\/td><\/tr>\n<tr><td>CCC<\/td><td>Carriage of Cargoes and Containers<\/td><td>IMDG, IMSBC, IGC, IGF(대체연료), 컨테이너 안전<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>조선 설계자에게는 SDC(구조·복원성), CCC(가스·대체연료), SSE(안전설비)의 결정이 가장 직접적이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>IMO는 2014년 하위위원회를 7개로 재편, 대부분 MSC에 보고(PPR은 주로 MEPC, III는 양쪽).<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>약칭<\/th><th>업무<\/th><\/tr><\/thead><tbody>\n<tr><td>HTW<\/td><td>STCW, 훈련·당직, 인적 요소<\/td><\/tr>\n<tr><td>III<\/td><td>협약 이행, PSC, 사고 분석, IMSAS<\/td><\/tr>\n<tr><td>NCSR<\/td><td>항해장비, 통항, GMDSS, 수색구조<\/td><\/tr>\n<tr><td>PPR<\/td><td>MARPOL 기술 기준, 블랙카본<\/td><\/tr>\n<tr><td>SDC<\/td><td>복원성(2세대), 구획, 구조, 만재흘수선, 극지<\/td><\/tr>\n<tr><td>SSE<\/td><td>구명·방화·기관·전기 설비<\/td><\/tr>\n<tr><td>CCC<\/td><td>IMDG, IMSBC, IGC, IGF(대체연료), 컨테이너<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>2. 결론<\/b>: 조선 설계에는 SDC(구조·복원성), CCC(가스·대체연료), SSE(안전설비)의 결정이 가장 직접적이므로 회의 결과를 추적해야 함.<\/p><\/div><\/section><\/details>"},{"id":"dual-class","p":12,"n":"12.16","h":"Dual Class Vessel과 Double Class Vessel","t":"Dual Class Vessel과 Double Class Vessel","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 3번 · 10점"],"q":["<b>139회(2026) 1-3<\/b> dual class vessel, double class vessel"],"k":"두 개의 선급에서 동시에 선급을 받는 선박이다. 일반적으로 Dual class는 두 선급이 협력 약정으로 업무를 나눠 서로의 도면 승인·검사를 인정하는 방식이고, Double class는 두 선급이 각자 독립적으로 도면 승인과 검사를 모두 수행하는 방식이다.","x":"\n<p class=\"key\">두 개의 선급에서 동시에 선급을 받는 선박이다. 일반적으로 Dual class는 두 선급이 협력 약정으로 업무를 나눠 서로의 도면 승인·검사를 인정하는 방식이고, Double class는 두 선급이 각자 독립적으로 도면 승인과 검사를 모두 수행하는 방식이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Dual class<\/th><th>Double class<\/th><\/tr><\/thead><tbody>\n<tr><td>업무 수행<\/td><td>협력 약정, 한 선급이 다른 선급을 대신해 일부 업무 수행, 결과 상호 인정<\/td><td>각 선급이 독립적으로 전부 수행<\/td><\/tr>\n<tr><td>적용 규칙<\/td><td>두 선급 규칙 중 엄격한 쪽을 만족하도록 조율<\/td><td>각 선급 규칙을 각각 만족<\/td><\/tr>\n<tr><td>비용·일정<\/td><td>중복 감소<\/td><td>중복 승인·검사로 비용·시간 증가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>선택하는 이유<\/h4>\n<ul>\n<li>선주 정책, 금융기관·용선주 요구, 특정 기국의 국적 선급 요구(예: 중국·한국 선주가 자국 선급 병행).<\/li>\n<li>매각·재용선 대비 범용성, 기술 검증 이중화.<\/li>\n<\/ul>\n<p>설계 측면에서는 두 선급 규칙의 차이(하중, 허용응력, 피로 기준)를 초기에 비교해 더 엄격한 요건으로 설계해야 재작업을 막는다. 선급 간 이관과 이중 선급 절차는 IACS PR로 규정된다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><ul><li>Dual class: 두 선급이 협력 약정으로 업무를 나누고 결과 상호 인정<\/li><li>Double class: 두 선급이 각자 독립적으로 도면 승인·검사 전부 수행<\/li><\/ul>\n<h5>2. 비교<\/h5><p>Dual은 중복 감소·비용 절감, Double은 중복 승인·검사로 비용·시간 증가. 적용 규칙은 두 선급 중 엄격한 쪽.<\/p>\n<h5>3. 이유<\/h5><p>선주 정책, 금융·용선주 요구, 기국 국적 선급 요구, 매각 대비.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 설계 초기 두 규칙 차이를 비교해 엄격한 요건으로 설계해야 재작업을 막음.<\/p><\/div><\/section><\/details>"},{"id":"korean-safety-law","p":12,"n":"12.17","h":"국내 선박관련 법규 중 안전 관련 법규명과 주요내용","t":"국내 선박관련 법규 중 안전 관련 법규명과 주요내용","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 2교시 3번 · 25점"],"q":["<b>118회(2019) 2-3<\/b> 국내 선박관련 법규 중 안전에 관련된 법규명과 주요내용"],"k":"국내 선박 안전 법체계는 선박의 구조·설비(선박안전법), 운항·교통(해사안전기본법·해상교통안전법·선박입출항법), 사람(선원법·선박직원법), 환경(해양환경관리법), 사업(해운법)으로 나뉜다. 2024년 1월 해사안전법이 기본법과 해상교통안전법으로 분법되었다.","x":"\n<p class=\"key\">국내 선박 안전 법체계는 선박의 구조·설비(선박안전법), 운항·교통(해사안전기본법·해상교통안전법·선박입출항법), 사람(선원법·선박직원법), 환경(해양환경관리법), 사업(해운법)으로 나뉜다. 2024년 1월 해사안전법이 기본법과 해상교통안전법으로 분법되었다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>법규<\/th><th>주요내용<\/th><\/tr><\/thead><tbody>\n<tr><td>선박안전법<\/td><td>선박 검사(건조·정기·중간·임시), 선박시설 기준(선체·기관·구명·소방 등), 만재흘수선, 복원성, 위험물 운송, 형식승인. 하위 고시: 강선의 구조기준, 선박구명설비기준, 선박소방설비기준, 전기추진선박기준 등<\/td><\/tr>\n<tr><td>해사안전기본법<\/td><td>해사안전관리 기본계획, 해사 사이버안전, 해사안전산업 진흥<\/td><\/tr>\n<tr><td>해상교통안전법<\/td><td>보호수역·교통안전특정해역·시운전금지해역, 항법(COLREG 국내화), 안전관리체제(국내 ISM), 음주 운항 금지, 출항 통제<\/td><\/tr>\n<tr><td>선박의 입항 및 출항 등에 관한 법률<\/td><td>무역항 내 항법, 정박·계류, 위험물 하역<\/td><\/tr>\n<tr><td>선원법<\/td><td>선원 근로조건, 거주 설비, 선내 안전·보건(MLC 국내화)<\/td><\/tr>\n<tr><td>선박직원법<\/td><td>해기사 면허, 승무 정원, 자동화선박<\/td><\/tr>\n<tr><td>해양환경관리법<\/td><td>MARPOL 국내화: 오염물질 배출 규제, 방지설비, 대기오염<\/td><\/tr>\n<tr><td>해운법<\/td><td>여객선 운항관리(운항관리규정, 운항관리자), 사업 면허<\/td><\/tr>\n<tr><td>어선법, 수상레저안전법, 유선 및 도선 사업법<\/td><td>어선·레저기구·유도선 안전<\/td><\/tr>\n<tr><td>해양사고의 조사 및 심판에 관한 법률<\/td><td>사고 원인 조사, 징계 재결<\/td><\/tr>\n<tr><td>산업안전보건법, 중대재해처벌법<\/td><td>조선소 작업 안전(밀폐공간, 고소, 화기), 경영책임자 의무<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>국내 선박 안전 법체계: 구조·설비(선박안전법), 운항·교통(해사안전기본법·해상교통안전법·선박입출항법), 사람(선원법·선박직원법), 환경(해양환경관리법), 사업(해운법). 2024.1 해사안전법 분법.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>법규<\/th><th>주요내용<\/th><\/tr><\/thead><tbody>\n<tr><td>선박안전법<\/td><td>선박 검사, 선박시설 기준(하위 고시), 만재흘수선, 복원성, 위험물<\/td><\/tr>\n<tr><td>해사안전기본법<\/td><td>해사안전관리 기본계획, 사이버안전<\/td><\/tr>\n<tr><td>해상교통안전법<\/td><td>보호·시운전금지 해역, 항법, 국내 ISM, 음주 운항 금지<\/td><\/tr>\n<tr><td>선박입출항법<\/td><td>무역항 항법·정박·위험물 하역<\/td><\/tr>\n<tr><td>선원법<\/td><td>근로조건·거주설비(MLC 국내화)<\/td><\/tr>\n<tr><td>선박직원법<\/td><td>해기사 면허·승무 정원·자동화선박<\/td><\/tr>\n<tr><td>해양환경관리법<\/td><td>MARPOL 국내화<\/td><\/tr>\n<tr><td>해운법<\/td><td>여객선 운항관리<\/td><\/tr>\n<tr><td>해양사고심판법<\/td><td>원인 조사·징계<\/td><\/tr>\n<tr><td>산업안전보건법·중대재해처벌법<\/td><td>조선소 작업 안전<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>2. 결론<\/b>: 조선 실무와 직결되는 것은 선박안전법(설계 기준)과 산업안전보건법·중대재해처벌법(건조 안전)임.<\/p><\/div><\/section><\/details>"},{"id":"ship-safety-act","p":12,"n":"12.18","h":"선박안전법상 선박시설의 의미와 시행규칙의 \"해양수산부령으로 정하는 것\"","t":"선박안전법상 선박시설의 의미와 시행규칙의 \"해양수산부령으로 정하는 것\"","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 2교시 5번 · 25점"],"q":["<b>127회(2022) 2-5<\/b> 선박안전법상 선박시설의 의미와 시행규칙의 &quot;해양수산부령이 정하는 것&quot;"],"k":"선박안전법 제2조는 \"선박시설\"을 선체·기관·돛대·배수설비 등 선박에 설치되어 있거나 설치될 각종 설비로서 해양수산부령으로 정하는 것이라고 정의한다. 시행규칙 제4조가 그 범위를 다음과 같이 열거한다(2026년 현행, 20개 호와 19의2호).","x":"\n<p class=\"key\">선박안전법 제2조는 \"선박시설\"을 선체·기관·돛대·배수설비 등 선박에 설치되어 있거나 설치될 각종 설비로서 해양수산부령으로 정하는 것이라고 정의한다. 시행규칙 제4조가 그 범위를 다음과 같이 열거한다(2026년 현행, 20개 호와 19의2호).<\/p>\n<h4>선박안전법 시행규칙 제4조의 선박시설<\/h4>\n<ol>\n<li>선체<\/li>\n<li>기관<\/li>\n<li>돛대<\/li>\n<li>배수설비<\/li>\n<li>조타설비<\/li>\n<li>계선설비: 배를 항구 등에 매어 두기 위한 설비<\/li>\n<li>양묘설비: 닻을 감아올리기 위한 설비<\/li>\n<li>구명설비<\/li>\n<li>소방설비<\/li>\n<li>거주설비<\/li>\n<li>위생설비<\/li>\n<li>항해설비<\/li>\n<li>적부설비: 위험물이나 그 밖의 산적화물을 실은 선박과 운송물의 안전을 위하여 운송물을 계획적으로 선박 내에 배치하기 위한 설비<\/li>\n<li>하역이나 그 밖의 작업설비<\/li>\n<li>전기설비<\/li>\n<li>원자력설비<\/li>\n<li>컨테이너설비<\/li>\n<li>승강설비<\/li>\n<li>냉동·냉장 및 수산물처리가공설비<\/li>\n<\/ol>\n<p>19의2. 「항만법 시행령」 제42조에 따른 항만건설장비, 20. 선박의 종류·기능에 따라 설치되는 특수한 설비로서 해양수산부장관이 인정하는 설비<\/p>\n<h4>관련 정의(선박안전법 제2조)<\/h4>\n<ul>\n<li>\"기관\": 원동기·동력전달장치·보일러·압력용기·보조기관 등의 설비와 이들의 제어장치로 구성되는 것.<\/li>\n<li>선박시설은 같은 법 제26조에 따라 해양수산부장관이 고시하는 선박시설기준(구조·설비 기준)에 적합해야 하며 검사 대상이 된다.<\/li>\n<\/ul>\n<div class=\"tip\"><p>문제는 \"15가지\"를 물었지만 현행 조문은 더 많다. 답안에는 현행 목록을 쓰고 \"개정으로 항목이 추가됨\"을 한 줄 덧붙이면 정확성과 최신성을 동시에 보여줄 수 있다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 의미(선박안전법 제2조)<\/h5><p>선박시설: 선체·기관·돛대·배수설비 등 선박에 설치되어 있거나 설치될 각종 설비로서 해양수산부령으로 정하는 것.<\/p>\n<h5>2. 시행규칙 제4조 목록<\/h5><p>① 선체 ② 기관 ③ 돛대 ④ 배수설비 ⑤ 조타설비 ⑥ 계선설비 ⑦ 양묘설비 ⑧ 구명설비 ⑨ 소방설비 ⑩ 거주설비 ⑪ 위생설비 ⑫ 항해설비 ⑬ 적부설비 ⑭ 하역이나 그 밖의 작업설비 ⑮ 전기설비 ⑯ 원자력설비 ⑰ 컨테이너설비 ⑱ 승강설비 ⑲ 냉동·냉장 및 수산물처리가공설비 (19의2) 항만건설장비 ⑳ 장관이 인정하는 특수 설비<\/p>\n<h5>3. 관련<\/h5><p>\"기관\" 정의(원동기·동력전달장치·보일러·압력용기·보조기관 + 제어장치), 제26조 선박시설기준 적합·검사 대상.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 문제의 \"15가지\"는 과거 조문 기준이며, 현행 목록과 개정 사실을 함께 쓰면 정확성과 최신성을 보여줌.<\/p><\/div><\/section><\/details>"},{"id":"seaworthiness","p":12,"n":"12.19","h":"선박안전법상 감항성(Seaworthiness)의 정의","t":"선박안전법상 감항성(Seaworthiness)의 정의","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 3번 · 10점"],"q":["<b>136회(2025) 1-3<\/b> 선박안전법상 감항성의 정의"],"k":"선박안전법 제2조제6호: \"감항성\"이란 선박이 자체의 안정성을 확보하기 위하여 갖추어야 하는 능력으로서 일정한 기상이나 항해조건에서 안전하게 항해할 수 있는 성능을 말한다.","x":"\n<p class=\"key\">선박안전법 제2조제6호: \"감항성\"이란 선박이 자체의 안정성을 확보하기 위하여 갖추어야 하는 능력으로서 일정한 기상이나 항해조건에서 안전하게 항해할 수 있는 성능을 말한다.<\/p>\n<h4>구성 요소(기술적 해석)<\/h4>\n<ul>\n<li>선체 강도와 수밀성, 복원성(비손상·손상), 만재흘수선 준수.<\/li>\n<li>추진·조타·전력 등 기관 설비의 신뢰성.<\/li>\n<li>구명·소방·항해·무선 설비의 적합성.<\/li>\n<li>항해 조건(항행구역, 계절, 적재 상태)에 맞는 상태 유지.<\/li>\n<\/ul>\n<h4>관련 개념<\/h4>\n<ul>\n<li>같은 조 정의: \"복원성\"은 수면에 평형상태로 떠 있는 선박이 파도·바람 등 외력에 의하여 기울어졌을 때 원래의 평형상태로 되돌아오려는 성질, \"만재흘수선\"은 안전하게 항해할 수 있는 적재한도의 흘수선.<\/li>\n<li>상법상 운송인의 감항능력 주의의무(상법 제794조): 발항 당시 선박의 항해 안전성, 선원·의장·필요품 보급, 화물을 실을 장소의 적합성을 갖출 의무. 감항성 결여는 운송인 면책을 배제하는 근거가 된다.<\/li>\n<li>선박안전법의 검사·증서 제도는 감항성을 행정적으로 확인하는 수단이다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의(선박안전법 제2조제6호)<\/h5><p>선박이 자체의 안정성을 확보하기 위하여 갖추어야 하는 능력으로서 일정한 기상이나 항해조건에서 안전하게 항해할 수 있는 성능.<\/p>\n<h5>2. 구성 요소<\/h5><p>선체 강도·수밀성, 복원성, 만재흘수선 준수, 기관 신뢰성, 구명·소방·항해 설비, 항해 조건 적합.<\/p>\n<h5>3. 관련<\/h5><p>상법 제794조 운송인 감항능력 주의의무(선박 안전, 선원·의장·보급, 화물 적재 장소 적합).<\/p><\/div><\/section><\/details>"},{"id":"automated-ship-law","p":12,"n":"12.20","h":"선박직원법상 자동화선박의 정의와 종별 설비기준","t":"선박직원법상 자동화선박의 정의와 종별 설비기준","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 1번 · 25점"],"q":["<b>121회(2020) 2-1<\/b> 선박직원법상 자동화선박의 정의와 3가지 종별 설비기준"],"k":"선박직원법 제2조제5호는 \"자동화선박\"을 대통령령으로 정하는 자동운항설비를 갖춘 선박으로 정의한다. 시행령 제3조의2는 그 설비를 자동화선박의 종류(제1종·제2종·제3종)에 따라 별표 1로 정하고, 선박소유자가 지방해양수산청장에게 인정을 신청해 종류별 인정서를 받도록 한다.","x":"\n<p class=\"key\">선박직원법 제2조제5호는 \"자동화선박\"을 대통령령으로 정하는 자동운항설비를 갖춘 선박으로 정의한다. 시행령 제3조의2는 그 설비를 자동화선박의 종류(제1종·제2종·제3종)에 따라 별표 1로 정하고, 선박소유자가 지방해양수산청장에게 인정을 신청해 종류별 인정서를 받도록 한다.<\/p>\n<h4>법령 구조<\/h4>\n<ul>\n<li><b>정의<\/b>: 법 제2조제5호 — 대통령령으로 정하는 자동운항설비를 갖춘 선박.<\/li>\n<li><b>설비<\/b>: 시행령 제3조의2① — 자동화선박의 종류에 따른 별표 1의 설비.<\/li>\n<li><b>인정<\/b>: 설비를 갖추거나 변경한 때 지방해양수산청장에게 인정 신청(②), 확인 후 종류별 인정서 교부(③), 기준 미달 시 인정서 반납(④).<\/li>\n<li><b>승무기준<\/b>: 시행령 제22조 — 자동화선박이라도 취업규칙에 정박 중 육상지원체제와 운항사 확보 사항이 명시되지 않으면 일반 승무기준 적용.<\/li>\n<li><b>운항사<\/b>: 항해·기관 직무를 함께 수행하는 해기사(운항장·운항사 면허).<\/li>\n<\/ul>\n<h4>종별 설비기준(별표 1)의 구조<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종별<\/th><th>설비 개념<\/th><\/tr><\/thead><tbody>\n<tr><td>제1종<\/td><td>기관구역 무인화를 중심으로 한 자동화: 주기관 원격 조종, 기관 상태 집중 감시·경보, 발전기 자동 기동·병렬, 화재 탐지 등<\/td><\/tr>\n<tr><td>
