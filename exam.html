num\">10<\/td><td>누설시험 목적, 0.20 → 0.15 bar, 비눗물, U자관<\/td><\/tr>\n<tr><td class=\"num\">130-1-9<\/td><td>수기압 테스트<\/td><td class=\"num\">10<\/td><td>구조시험의 한 방법, 물 + 공기압으로 시험수두 재현<\/td><\/tr>\n<tr><td class=\"num\">133-1-11<\/td><td>Hose test<\/td><td class=\"num\">10<\/td><td>개구 폐쇄장치, 노즐 12 mm·2 bar·1.5 m<\/td><\/tr>\n<tr><td class=\"num\">133-2-6<\/td><td>Tank Air Test와 절차<\/td><td class=\"num\">25<\/td><td>시험 체계(구조·누설), 절차 단계, 안전<\/td><\/tr>\n<tr><td class=\"num\">139-1-8<\/td><td>선체의 누설시험(Leak Test)<\/td><td class=\"num\">10<\/td><td>누설시험 종류 표와 구조시험과의 구분<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 133회형(탱크 에어테스트와 절차)\">\n<h5>1. 개요<\/h5>\n<ul><li>탱크·수밀 경계 시험은 IACS UR S14에 따라 <b>구조시험<\/b>(설계수두 강도 확인: 수압·수기압)과 <b>누설시험<\/b>(용접 경계 기밀 확인: 공기·필릿공기·진공상자 등)으로 구분됨<\/li>\n<li>탱크 에어테스트는 누설시험의 대표 방법이며, 강도 확인용이 아님<\/li><\/ul>\n<h5>2. 시험 체계<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>방법<\/th><th>목적<\/th><\/tr><\/thead><tbody>\n<tr><td>구조시험<\/td><td>수압, 수기압<\/td><td>구조가 시험수두를 견디는지(대표 탱크)<\/td><\/tr>\n<tr><td>누설시험<\/td><td>공기, 필릿 압축공기, 진공상자, 초음파, 침투<\/td><td>용접·관통부 기밀<\/td><\/tr>\n<tr><td>호스시험<\/td><td>노즐 12 mm 이상, 2 bar 이상, 1.5 m 이내<\/td><td>해치커버·수밀문 등 폐쇄장치<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 시험 시기·조건<\/h5>\n<ul><li>탱크 경계 구조·화기작업 완료 후(시험 후 용접 금지), 용접부 도장 전<\/li>\n<li>모든 개구 맹판 폐쇄, 압력계 + U자관 수주계(물), 과압 방지 장치 설치<\/li><\/ul>\n<h5>4. 시험 절차<\/h5>\n<ol><li>준비: 탱크 청소, 개구 폐쇄, 계측기 교정, 선급·선주 입회 일정<\/li>\n<li>가압: 서서히 0.20 bar까지 가압, 약 1시간 유지(온도·압력 안정)<\/li>\n<li>시험압: 0.15 bar로 낮추고 압력 유지 확인<\/li>\n<li>검사: 경계 용접선·관통부·맨홀 전체에 비눗물 도포, 기포 확인<\/li>\n<li>보수: 누설부 표시 → 감압 → 가우징·재용접 → 재시험<\/li>\n<li>종료: 서서히 감압, 기록(압력·시간·결과·입회자)<\/li><\/ol>\n<h5>5. 안전·품질 관리<\/h5>\n<ul><li>압축공기 에너지가 커서 과압 시 경계판 파열 위험 → U자관으로 압력 상시 확인, 시험 중 큰 평판 주위 접근 통제<\/li>\n<li>기온 변화에 의한 압력 변동 보정, 계측기 교정 기록<\/li>\n<li>탑재 전 블록 단계 선행 누설시험(필릿 공기시험)으로 탑재 후 시험 부담 경감<\/li><\/ul>\n<p class=\"concl\"><b>6. 결론<\/b>: 에어테스트는 낮은 압력으로 기밀만 확인하는 시험이므로 구조시험과 혼동하지 말아야 하며, 선행 누설시험과 시험 계획(ITP) 관리로 공정 지연을 줄이는 것이 실무 핵심임.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 130회형(수기압 테스트)\">\n<h5>1. 정의<\/h5>\n<p>수기압시험: 탱크를 일부 물로 채우고 상부 공기층에 압력을 더해, 탱크 정부 기준 설계 시험수두와 같은 압력을 재현하는 <b>구조시험<\/b> 방법임(IACS UR S14).<\/p>\n<h5>2. 원리·방법<\/h5>\n<p>시험수두 = 수위에 의한 정수압 + 상부 공기압. 탱크 정부까지 물을 채우지 않고도 정부 경계에 요구 압력을 가함. 공기압 부분은 U자관·압력계로 관리.<\/p>\n<h5>3. 장점·주의<\/h5>\n<ul><li>장점: 물 사용량·주배수 시간 감소, 대형 탱크 시험 기간 단축<\/li>\n<li>주의: 공기압에 의한 과압 위험(안전장치), 하부는 실제 수두와 압력 분포가 달라질 수 있어 승인된 절차로 수행<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 공정 단축 효과가 크지만 구조시험이므로 선급 승인 절차와 압력 관리가 필수임.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 133회형(Hose test)\">\n<h5>1. 정의<\/h5>\n<p>호스시험: 수압·공기 시험을 할 수 없는 수밀·풍우밀 폐쇄장치(해치커버, 수밀문, 창, 관통부)에 물줄기를 뿌려 기밀을 확인하는 시험임.<\/p>\n<h5>2. 조건(UR S14)<\/h5>\n<ul><li>노즐 지름 12 mm 이상, 노즐 압력 2 bar 이상, 노즐-시험면 거리 1.5 m 이내<\/li>\n<li>반대쪽에서 누수 확인, 가스켓·압착 바 접촉 상태 점검<\/li><\/ul>\n<h5>3. 대체·주의<\/h5>\n<p>초음파 누설시험으로 대체 가능(형식 승인 장비). 도장 전, 폐쇄장치 조정 완료 후 실시.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: 해치커버 누수는 화물 손상 클레임으로 직결되므로 압착량(compression) 계측과 함께 관리해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"anchor-mockup","p":7,"n":"7.5","h":"앵커 목업시험(Anchor Mock-up Test)의 필요성","t":"앵커 목업시험(Anchor Mock-up Test)의 필요성","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 10번 · 10점","136회 1교시 7번 · 10점"],"q":["<b>121회(2020) 1-10<\/b> Anchor Mock-up test","<b>136회(2025) 1-7<\/b> 앵커 목업시험(Anchor Mock-up Test)의 필요성"],"k":"앵커 목업시험은 실물 크기 모형(또는 실제 블록)에서 앵커를 호스파이프와 앵커 포켓으로 끌어올려 제대로 안착하는지, 투하 시 선체와 간섭이 없는지 확인하는 시험이다. 시운전에서 문제가 발견되면 외판·호스파이프 개조가 필요하므로, 블록 탑재 전에 형상을 검증한다.","x":"\n<p class=\"key\">앵커 목업시험은 실물 크기 모형(또는 실제 블록)에서 앵커를 호스파이프와 앵커 포켓으로 끌어올려 제대로 안착하는지, 투하 시 선체와 간섭이 없는지 확인하는 시험이다. 시운전에서 문제가 발견되면 외판·호스파이프 개조가 필요하므로, 블록 탑재 전에 형상을 검증한다.<\/p>\n<h4>필요성<\/h4>\n<ul>\n<li>앵커는 제작사별 형상이 다르고, 호스파이프·포켓은 3D 곡면 외판에 설치되어 계산만으로 안착 거동을 확신하기 어렵다.<\/li>\n<li>확인 항목: 앵커 생크가 호스파이프에 걸리지 않고 들어가는지, 플루크가 포켓·외판에 밀착되는지(덜컹거림·소음), 앵커가 뒤집혀 걸리지 않는지(회전 방향).<\/li>\n<li>투하 경로가 구상선수와 간섭하지 않는지, 체인이 체인스토퍼·양묘기로 정확히 유도되는지.<\/li>\n<li>외판 도장·구조 손상 방지(앵커 충돌부 보강판 위치 결정).<\/li>\n<li>시운전 단계 개조는 외판 절단·재용접·재도장으로 공기와 비용 손실이 크다.<\/li>\n<\/ul>\n<h4>방법<\/h4>\n<p>나무·강재 목업이나 실제 선수 블록에서 앵커를 반복 인양·투하하며 관찰. 최근은 3D 운동 시뮬레이션으로 사전 검토하고 실물 시험으로 확인한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">121-1-10 · 136-1-7<\/td><td>Anchor mock-up test (필요성)<\/td><td>확인 항목과 시기(블록 탑재 전)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>실물 크기 목업 또는 실제 선수 블록에서 앵커를 호스파이프·포켓으로 인양·투하해 안착과 간섭을 확인하는 시험.<\/p>\n<h5>2. 필요성<\/h5><ul><li>3D 곡면 외판의 앵커 안착 거동은 계산만으로 확신 어려움<\/li><li>확인: 생크 통과, 플루크 밀착(덜컹거림·소음), 뒤집힘, 구상선수 간섭, 체인 유도<\/li><li>외판 손상 방지 보강판 위치 결정<\/li><li>시운전 단계 개조는 외판 절단·재도장으로 공기·비용 손실<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 3D 운동 시뮬레이션으로 사전 검토하고 블록 탑재 전 실물로 확인하는 2단계가 효율적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"windlass-test","p":7,"n":"7.6","h":"앵커 제동시험(Anchor Stopping Test)과 양묘기 시험","t":"앵커 제동시험(Anchor Stopping Test)과 양묘기 시험","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 9번 · 10점"],"q":["<b>124회(2021) 1-9<\/b> 앵커 제동시험(Anchor Stopping Test)"],"k":"앵커 제동시험은 시운전에서 앵커를 자유낙하로 투하하다가 양묘기 브레이크로 정해진 길이에서 체인을 세워, 브레이크 제동 능력과 체인 계통의 안전을 확인하는 시험이다. 양묘 속도 시험과 함께 좌·우 앵커 각각 실시한다.","x":"\n<p class=\"key\">앵커 제동시험은 시운전에서 앵커를 자유낙하로 투하하다가 양묘기 브레이크로 정해진 길이에서 체인을 세워, 브레이크 제동 능력과 체인 계통의 안전을 확인하는 시험이다. 양묘 속도 시험과 함께 좌·우 앵커 각각 실시한다.<\/p>\n<h4>시험 절차<\/h4>\n<ol>\n<li>정지 또는 극저속 상태, 충분한 수심 확인.<\/li>\n<li>앵커를 수면 근처까지 내린 뒤 브레이크를 풀어 자유 투하.<\/li>\n<li>지정 길이(체인 몇 섀클)에서 브레이크를 걸어 정지 → 정지 거리, 미끄러짐, 이상 소음·발열 확인.<\/li>\n<li>양묘: 지정 수심에서 감아올리며 평균 속도와 전동기 전류·유압 측정. IACS UR A3 기준으로 82.5 m에서 27.5 m까지 평균 9 m/min 이상.<\/li>\n<li>앵커 안착, 체인스토퍼 체결 확인.<\/li>\n<\/ol>\n<h4>관련 강도 기준(IACS UR A3)<\/h4>\n<ul>\n<li>양묘기 브레이크: 체인 파단하중의 45%를 영구변형 없이 유지.<\/li>\n<li>체인스토퍼: 체인 파단하중의 80%를 유지.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>시운전에서 앵커를 자유 투하하다 양묘기 브레이크로 지정 길이에 정지시켜 제동 능력을 확인하는 시험.<\/p>\n<h5>2. 절차<\/h5><p>앵커 수면 근처 → 자유 투하 → 지정 섀클에서 제동 → 미끄러짐·소음·발열 확인 → 양묘 속도·전류 계측 → 좌우 각각.<\/p>\n<div class=\"calc\">UR A3: 양묘 평균 9 m/min 이상(82.5 → 27.5 m)\n브레이크 파단하중 45% 유지, 체인스토퍼 80%<\/div><\/div><\/section><\/details>"},{"id":"steering-test","p":7,"n":"7.7","h":"조타기 시험(Steering Gear Test)","t":"조타기 시험(Steering Gear Test)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 1교시 12번 · 10점"],"q":["<b>133회(2024) 1-12<\/b> Steering gear test"],"k":"조타기 시험은 SOLAS II-1/29의 성능 요건(주조타장치: 최대 흘수·최대 속력에서 한쪽 35°에서 반대쪽 30°까지 28초 이내)과 보조·비상 조타, 제어 전환, 경보 기능을 해상에서 확인하는 시험이다.","x":"\n<p class=\"key\">조타기 시험은 SOLAS II-1/29의 성능 요건(주조타장치: 최대 흘수·최대 속력에서 한쪽 35°에서 반대쪽 30°까지 28초 이내)과 보조·비상 조타, 제어 전환, 경보 기능을 해상에서 확인하는 시험이다.<\/p>\n<h4>시험 항목<\/h4>\n<ol>\n<li><b>주조타장치<\/b>: 최대 속력에서 35°(좌) → 30°(우), 35°(우) → 30°(좌) 소요시간 계측. 동력 장치(펌프) 1대 단독, 2대 병렬 각각.<\/li>\n<li><b>보조조타장치<\/b>: 최대 흘수에서 최대 속력의 절반 또는 7 kn 중 큰 속력으로 15° → 15°를 60초 이내.<\/li>\n<li><b>비상 조타<\/b>: 조타기실 현장 조작, 선교와의 통신 장치 확인.<\/li>\n<li><b>제어 계통<\/b>: 선교 원격 제어 2계통 전환, 자동조타(오토파일럿) 연동.<\/li>\n<li><b>경보<\/b>: 전원 상실, 위상 결손·과부하, 작동유 저유위, 유압 잠김(hydraulic lock) 경보.<\/li>\n<li><b>전원<\/b>: 비상전원으로 조타 가능 여부(대형선은 독립 비상 전원 요구).<\/li>\n<li><b>타각 지시기<\/b>: 실제 타각과 지시값 일치.<\/li>\n<\/ol>\n<p>시운전을 최대 흘수로 못 하면 타가 완전히 잠긴 흘수에서 시험하고 최대 흘수 성능은 계산으로 입증한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 기준(SOLAS II-1/29)<\/h5><p>주조타: 최대 흘수·최대 속력에서 35°→반대 30° 28초 이내 / 보조: 최대 속력 절반 또는 7 kn에서 15°→15° 60초 이내.<\/p>\n<h5>2. 시험 항목<\/h5><p>펌프 단독·병렬 시간 계측, 비상 조타(현장 조작·통신), 제어 계통 전환, 경보(전원 상실·저유위·유압 잠김), 비상 전원, 타각 지시기 일치.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: 최대 흘수 시험이 어려우면 타 완전 잠김 흘수 시험 + 계산으로 입증함.<\/p><\/div><\/section><\/details>"},{"id":"dead-ship","p":7,"n":"7.8","h":"Dead Ship 상태와 Dead Ship Recovery Test","t":"Dead Ship 상태와 Dead Ship Recovery Test","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 6번 · 10점","130회 1교시 10번 · 10점"],"q":["<b>124회(2021) 1-6<\/b> Dead Ship 상태","<b>130회(2023) 1-10<\/b> Dead ship recovery test"],"k":"Dead ship 상태는 주추진 장치·보일러·보조기관이 전원과 저장 에너지(시동 공기 등) 없이 모두 정지해 자력으로 기동할 수 없는 상태다. SOLAS는 외부 도움 없이 이 상태에서 기관을 다시 가동할 수단을 요구하며, Dead ship recovery test는 이를 시운전에서 실증한다.","x":"\n<p class=\"key\">Dead ship 상태는 주추진 장치·보일러·보조기관이 전원과 저장 에너지(시동 공기 등) 없이 모두 정지해 자력으로 기동할 수 없는 상태다. SOLAS는 외부 도움 없이 이 상태에서 기관을 다시 가동할 수단을 요구하며, Dead ship recovery test는 이를 시운전에서 실증한다.<\/p>\n<h4>근거<\/h4>\n<ul>\n<li>SOLAS II-1/26: 외부 지원 없이 dead ship 상태로부터 기관을 가동할 수 있는 수단.<\/li>\n<li>비상발전기는 dead ship 상태에서 자체 시동(축압기, 독립 배터리, 수동 시동).<\/li>\n<li>선급은 추진 회복까지의 시간을 규정(일반적으로 30분 이내 추진 회복을 요구하는 예가 많다).<\/li>\n<\/ul>\n<h4>복구 시험 순서(예)<\/h4>\n<ol>\n<li>주발전기·주기관 정지, 시동공기 저장조 압력 해제(또는 사용 불가 가정) → dead ship 재현.<\/li>\n<li>비상발전기 시동 → 비상배전반 급전.<\/li>\n<li>비상 공기압축기(또는 비상 동력)로 시동 공기 충전, 발전기관 시동.<\/li>\n<li>주배전반 급전, 보조 펌프(연료·냉각·윤활) 기동.<\/li>\n<li>주기관 예열·시동 → 추진 회복, 소요시간 기록.<\/li>\n<\/ol>\n<p>Blackout recovery(정전 시 예비 발전기 자동 기동, 대개 45초 이내 급전)와 구별해 쓴다. Blackout은 저장 에너지가 남아 있는 정전이고, dead ship은 그마저 없는 상태다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-1-6<\/td><td>Dead ship 상태<\/td><td>정의, SOLAS 근거, blackout과 구분<\/td><\/tr>\n<tr><td class=\"num\">130-1-10<\/td><td>Dead ship recovery test<\/td><td>복구 순서<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 130회형\">\n<h5>1. 정의<\/h5><p>Dead ship: 주추진·보일러·보기가 전원과 저장 에너지(시동공기 등) 없이 모두 정지한 상태. SOLAS II-1/26은 외부 도움 없이 기관을 가동할 수단을 요구.<\/p>\n<h5>2. 복구 시험 순서<\/h5><ol><li>주발전기·주기 정지, 시동공기 사용 불가 가정<\/li><li>비상발전기 자체 시동 → 비상배전반<\/li><li>비상 공기압축기로 시동공기 충전 → 발전기관 시동<\/li><li>주배전반 급전 → 연료·냉각·윤활 펌프<\/li><li>주기 시동 → 추진 회복, 시간 기록<\/li><\/ol>\n<p class=\"concl\"><b>3. 의견<\/b>: 저장 에너지가 남은 blackout(예비 발전기 45초 내 자동 급전)과 구분해 써야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"gas-trial","p":7,"n":"7.9","h":"LNG선의 가스시운전(Gas Trial)","t":"LNG선의 가스시운전(Gas Trial)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 2교시 4번 · 25점"],"q":["<b>133회(2024) 2-4<\/b> LNG선의 가스시운전(Gas trial)"],"k":"가스시운전은 일반 해상시운전 후 LNG 터미널에서 실제 LNG를 실어 화물창 냉각과 화물·연료 가스 계통의 성능을 확인하는 시험이다. 건조 단계에서 상온으로는 확인할 수 없는 극저온 상태의 단열 성능, 증발가스(BOG) 처리, 화물 하역 능력, 비상차단을 검증한다.","x":"\n<p class=\"key\">가스시운전은 일반 해상시운전 후 LNG 터미널에서 실제 LNG를 실어 화물창 냉각과 화물·연료 가스 계통의 성능을 확인하는 시험이다. 건조 단계에서 상온으로는 확인할 수 없는 극저온 상태의 단열 성능, 증발가스(BOG) 처리, 화물 하역 능력, 비상차단을 검증한다.<\/p>\n<h4>절차<\/h4>\n<ol>\n<li><b>건조(drying)<\/b>: 건조 공기로 화물창 수분 제거(이슬점 관리, 얼음·하이드레이트 방지).<\/li>\n<li><b>불활성화(inerting)<\/b>: 불활성가스(이슬점 약 −40 °C 이하)로 산소 농도를 낮춘다.<\/li>\n<li><b>가스 치환(gassing-up)<\/b>: LNG 증기로 불활성가스를 치환(CO₂가 얼지 않도록).<\/li>\n<li><b>냉각(cool-down)<\/b>: 스프레이 라인으로 LNG를 분사해 화물창을 목표 온도까지 서서히 냉각(열응력 관리).<\/li>\n<li><b>적하(loading)<\/b>: 시험에 필요한 양 적재.<\/li>\n<li><b>시험<\/b>: 화물펌프·스프레이펌프, 기화기, 압축기, 재액화 장치, GCU, 연료가스 공급(이중연료 기관 가스 모드), 화물 계량(CTS) 교정, 액위·온도 센서, ESD(선박-육상 연결), 가스 탐지, 단열공간 질소 압력 제어, 냉점(cold spot) 열화상 점검, 증발률(BOR) 확인.<\/li>\n<li><b>양하·가열(warm-up)·불활성화·환기<\/b>: 인도 조건에 맞춰 처리(가스 상태 인도 또는 가스프리).<\/li>\n<\/ol>\n<h4>주요 확인점<\/h4>\n<ul>\n<li>선체 냉점: 단열 결함 시 내각(inner hull)에 결빙 → 저온 취성 위험.<\/li>\n<li>BOR 보증값(예: 0.085 %/day 수준)과 연료 사용 BOG 균형.<\/li>\n<li>극저온 배관 수축·지지 거동, 밸브 누설.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 정의<\/h5><p>일반 해상시운전 후 LNG 터미널에서 실제 LNG를 실어 화물창 냉각과 화물·연료가스 계통 성능을 확인하는 시험.<\/p>\n<h5>2. 절차<\/h5><ol><li>건조(이슬점 관리)<\/li><li>불활성화(산소 저감)<\/li><li>가스 치환(LNG 증기로 불활성가스 대체)<\/li><li>냉각(스프레이로 서서히, 열응력 관리)<\/li><li>적하 → 시험<\/li><li>양하·가열·불활성화·환기(인도 조건)<\/li><\/ol>\n<h5>3. 시험 항목<\/h5><p>화물·스프레이 펌프, 기화기, 압축기, 재액화, GCU, 이중연료 기관 가스 모드, CTS 교정, 액위·온도, ESD, 가스 탐지, 단열공간 질소 압력, 냉점 열화상, BOR.<\/p>\n<h5>4. 주요 확인점<\/h5><ul><li>냉점: 단열 결함 시 내각 결빙 → 취성 위험<\/li><li>BOR 보증값(예: 0.085%/day 수준)과 BOG 균형<\/li><li>배관 수축·지지, 밸브 누설<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 상온 시운전으로 확인할 수 없는 극저온 성능의 최종 검증이므로 냉점 감시와 BOR 확인이 가장 중요함.<\/p><\/div><\/section><\/details>"},{"id":"guarantee-docking","p":7,"n":"7.10","h":"보증입거(Guarantee Docking)","t":"보증입거(Guarantee Docking)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 11번 · 10점"],"q":["<b>136회(2025) 1-11<\/b> 보증입거(Guarantee Docking)"],"k":"보증입거는 인도 후 보증기간(대개 12개월)이 끝나기 전에 선박을 도크에 넣어 수선 아래 선체·프로펠러·타·씨체스트·도장 상태를 점검하고, 건조자 책임 결함을 조선소 비용으로 수리하는 절차다. 계약서의 보증 조항에 근거한다.","x":"\n<p class=\"key\">보증입거는 인도 후 보증기간(대개 12개월)이 끝나기 전에 선박을 도크에 넣어 수선 아래 선체·프로펠러·타·씨체스트·도장 상태를 점검하고, 건조자 책임 결함을 조선소 비용으로 수리하는 절차다. 계약서의 보증 조항에 근거한다.<\/p>\n<h4>점검 항목<\/h4>\n<ul>\n<li>수선 아래 도장(방오 성능, 박리), 아연 양극 소모, ICCP 양극.<\/li>\n<li>프로펠러(캐비테이션 침식), 타·핀틀 간극, 선미관 씰.<\/li>\n<li>씨체스트, 선외 밸브, 빌지킬, 흘수표.<\/li>\n<li>보증 기간 중 접수된 클레임 항목 일괄 수리.<\/li>\n<\/ul>\n<h4>실무<\/h4>\n<ul>\n<li>계약에 따라 입거 대신 잠수부 수중 검사(UWILD)로 대체하기도 한다.<\/li>\n<li>입거 비용·선박 휴선 손실 부담 주체, 수리 장소(건조 조선소 또는 제3 조선소)를 계약에서 정한다.<\/li>\n<li>보증 클레임은 원인(설계·제작 결함 대 운항 손상) 판정이 핵심이며, 반복 결함은 후속선 설계에 반영한다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>보증기간(대개 12개월) 종료 전 입거해 수선 아래 선체를 점검하고 건조자 책임 결함을 조선소 비용으로 수리하는 절차.<\/p>\n<h5>2. 점검<\/h5><p>도장·방오, 아연 양극·ICCP, 프로펠러 침식, 타·핀틀, 선미관 씰, 씨체스트, 클레임 항목.<\/p>\n<h5>3. 실무<\/h5><p>수중검사 대체 가능, 비용·휴선 손실 부담·수리 장소는 계약으로 정함, 원인 판정(제작 결함 vs 운항 손상)이 핵심.<\/p><\/div><\/section><\/details>"},{"id":"construction-monitoring","p":7,"n":"7.11","h":"CM(Construction Monitoring)","t":"CM(Construction Monitoring)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 12번 · 10점"],"q":["<b>121회(2020) 1-12<\/b> CM(Construction Monitoring)"],"k":"CM은 설계 단계 구조해석(FE·피로)에서 찾은 핵심 부위(critical area)를 목록으로 만들고, 그 부위의 정렬 공차·용접 형상·검사 범위를 선급과 합의해 건조 중 집중 관리하는 건조 감시 체계다. 설계 가정이 실제 건조 품질로 구현되도록 연결하는 장치다.","x":"\n<p class=\"key\">CM은 설계 단계 구조해석(FE·피로)에서 찾은 핵심 부위(critical area)를 목록으로 만들고, 그 부위의 정렬 공차·용접 형상·검사 범위를 선급과 합의해 건조 중 집중 관리하는 건조 감시 체계다. 설계 가정이 실제 건조 품질로 구현되도록 연결하는 장치다.<\/p>\n<h4>배경<\/h4>\n<ul>\n<li>CSR과 IACS UR Z23(신조선 선체 검사)은 설계-건조 정보의 연결과 검사 계획을 요구한다.<\/li>\n<li>피로 수명은 정렬 오차와 용접 토우 형상에 매우 민감해서, 해석 가정(완벽한 정렬, 표준 형상)이 지켜지지 않으면 수명이 크게 준다.<\/li>\n<\/ul>\n<h4>내용<\/h4>\n<ol>\n<li>핵심 부위 선정: 응력 이용률이 높거나 피로 수명이 짧은 상세(호퍼 너클, 하부 스툴, 해치 코너, 브래킷 토우 등).<\/li>\n<li>CM 계획서: 부위별 정렬 공차(예: 십자 이음 어긋남), 용접 사양(완전용입, 토우 그라인딩), NDT 방법·범위.<\/li>\n<li>건조 중 검사·기록, 부적합 시 보수 절차.<\/li>\n<li>인도 시 선박 건조 파일(SCF, 목표기반 표준 GBS의 SOLAS II-1/3-10)과 운항 중 검사 계획에 반영.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>설계 해석(FE·피로)에서 찾은 핵심 부위를 목록화해 정렬 공차·용접 형상·NDT 범위를 선급과 합의하고 건조 중 집중 관리하는 체계.<\/p>\n<h5>2. 내용<\/h5><p>핵심 부위 선정(호퍼 너클, 하부 스툴, 해치 코너, 브래킷 토우) → CM 계획서 → 검사·기록 → SCF(GBS)·운항 검사 계획 반영. 근거: CSR, IACS UR Z23.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: 피로 수명은 정렬·토우 형상에 민감하므로 설계 가정을 건조 품질로 연결하는 장치임.<\/p><\/div><\/section><\/details>"},{"id":"ice-vs-ece","p":8,"n":"8.1","h":"외연기관 대비 내연기관의 장·단점","t":"외연기관 대비 내연기관의 장·단점","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 1번 · 10점"],"q":["<b>118회(2019) 1-1<\/b> 외연기관 대비 내연기관의 장·단점"],"k":"내연기관은 실린더 안에서 연료를 태워 그 가스로 직접 일을 하고(디젤, 가스엔진, 가스터빈), 외연기관은 보일러 같은 외부에서 연소한 열로 작동유체(증기)를 만들어 일을 한다(증기터빈). 선박에서는 열효율이 높은 저속 2행정 디젤이 주류이고, 증기터빈은 LNG선 BOG 연소용에서도 이중연료 엔진에 자리를 내줬다.","x":"\n<p class=\"key\">내연기관은 실린더 안에서 연료를 태워 그 가스로 직접 일을 하고(디젤, 가스엔진, 가스터빈), 외연기관은 보일러 같은 외부에서 연소한 열로 작동유체(증기)를 만들어 일을 한다(증기터빈). 선박에서는 열효율이 높은 저속 2행정 디젤이 주류이고, 증기터빈은 LNG선 BOG 연소용에서도 이중연료 엔진에 자리를 내줬다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내연기관(디젤)<\/th><th>외연기관(증기터빈)<\/th><\/tr><\/thead><tbody>\n<tr><td>열효율<\/td><td>높음(대형 2행정 약 50% 이상)<\/td><td>낮음(약 30% 수준)<\/td><\/tr>\n<tr><td>연료<\/td><td>액체·가스 연료, 연료 품질 관리 필요<\/td><td>연료 제약 적음(중유, 석탄, BOG)<\/td><\/tr>\n<tr><td>크기·중량<\/td><td>단위 출력당 작고 가벼움, 보일러·복수기 불필요<\/td><td>보일러·복수기·급수계로 공간 큼<\/td><\/tr>\n<tr><td>시동·부하 응답<\/td><td>빠름<\/td><td>느림(보일러 기동)<\/td><\/tr>\n<tr><td>진동·소음<\/td><td>왕복 운동으로 큼<\/td><td>회전 운동으로 작음<\/td><\/tr>\n<tr><td>배출<\/td><td>NOx 많음<\/td><td>NOx 적음<\/td><\/tr>\n<tr><td>정비<\/td><td>부품 많고 정비 주기 짧음<\/td><td>정비 적음, 단 보일러 수처리<\/td><\/tr>\n<tr><td>적용<\/td><td>대부분 상선 주기·발전기<\/td><td>과거 LNG선·고속 대형선, 원자력선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>내연기관: 실린더 안 연소가스로 직접 일(디젤·가스엔진·가스터빈) / 외연기관: 외부 연소열로 작동유체(증기)를 만들어 일(증기터빈).<\/p>\n<h5>2. 내연기관의 장단점(외연기관 대비)<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>열효율 높음(대형 2행정 약 50% 이상)<\/td><td>왕복운동 진동·소음 큼<\/td><\/tr>\n<tr><td>보일러·복수기 불필요 → 소형·경량<\/td><td>NOx 배출 많음<\/td><\/tr>\n<tr><td>시동·부하 응답 빠름<\/td><td>부품 많고 정비 주기 짧음<\/td><\/tr>\n<tr><td>연료소비 적음<\/td><td>연료 품질 관리 필요<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>3. 의견<\/b>: 효율 우위로 상선 주기는 디젤이 표준이며, LNG선도 증기터빈에서 이중연료 기관으로 전환됨.<\/p><\/div><\/section><\/details>"},{"id":"two-four-stroke","p":8,"n":"8.2","h":"2행정기관과 4행정기관의 장단점","t":"2행정기관과 4행정기관의 장단점","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 8번 · 10점"],"q":["<b>136회(2025) 1-8<\/b> 2행정기관과 4행정기관의 장단점"],"k":"2행정기관은 크랭크축 1회전마다, 4행정기관은 2회전마다 한 번 폭발한다. 선박 주기관은 저속(대략 60~100 rpm) 2행정 크로스헤드 기관이 프로펠러를 직결 구동해 효율이 가장 높고, 발전기와 중소형 추진은 중·고속 4행정 트렁크 피스톤 기관이 쓴다.","x":"\n<p class=\"key\">2행정기관은 크랭크축 1회전마다, 4행정기관은 2회전마다 한 번 폭발한다. 선박 주기관은 저속(대략 60~100 rpm) 2행정 크로스헤드 기관이 프로펠러를 직결 구동해 효율이 가장 높고, 발전기와 중소형 추진은 중·고속 4행정 트렁크 피스톤 기관이 쓴다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>2행정(저속)<\/th><th>4행정(중·고속)<\/th><\/tr><\/thead><tbody>\n<tr><td>사이클<\/td><td>소기·압축·폭발·배기를 1회전에, 단류소기(배기밸브)<\/td><td>흡기·압축·폭발·배기 각 행정<\/td><\/tr>\n<tr><td>회전수<\/td><td>60~120 rpm, 프로펠러 직결<\/td><td>400~1,000 rpm 이상, 감속기 필요<\/td><\/tr>\n<tr><td>열효율·연료<\/td><td>최고 효율, 저질 중유 연소에 유리<\/td><td>약간 낮음<\/td><\/tr>\n<tr><td>출력 밀도<\/td><td>단위 중량당 낮음(크고 무거움)<\/td><td>높음(작고 가벼움)<\/td><\/tr>\n<tr><td>높이<\/td><td>매우 높음(피스톤 인출 크레인 높이)<\/td><td>낮음 → 낮은 기관실, 로로선·여객선<\/td><\/tr>\n<tr><td>구조<\/td><td>크로스헤드로 실린더와 크랭크실 분리, 실린더유 별도<\/td><td>트렁크 피스톤, 시스템유 공용<\/td><\/tr>\n<tr><td>운용<\/td><td>역전·저부하 운전 제약, 정비 공수 적음<\/td><td>다수 기관 조합(디젤-전기), 부하 대응 유연<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>2행정: 크랭크 1회전에 1사이클(소기·압축·폭발·배기) / 4행정: 2회전에 1사이클.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>2행정(저속)<\/th><th>4행정(중·고속)<\/th><\/tr><\/thead><tbody>\n<tr><td>회전수<\/td><td>60~120 rpm, 프로펠러 직결<\/td><td>400~1,000 rpm 이상, 감속기<\/td><\/tr>\n<tr><td>효율·연료<\/td><td>최고 효율, 중유 연소 유리<\/td><td>약간 낮음<\/td><\/tr>\n<tr><td>크기<\/td><td>크고 무겁고 높음<\/td><td>소형·경량·낮음<\/td><\/tr>\n<tr><td>구조<\/td><td>크로스헤드, 실린더유 별도<\/td><td>트렁크 피스톤<\/td><\/tr>\n<tr><td>적용<\/td><td>대형 상선 주기<\/td><td>발전기, 디젤-전기, 로로·여객선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 주기는 효율의 2행정, 발전과 높이 제약 선박은 4행정이 합리적임.<\/p><\/div><\/section><\/details>"},{"id":"diesel-cycle","p":8,"n":"8.3","h":"디젤 사이클(Diesel Cycle)","t":"디젤 사이클(Diesel Cycle)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 8번 · 10점"],"q":["<b>127회(2022) 1-8<\/b> 디젤 사이클(Diesel cycle)"],"k":"디젤 사이클은 압축착화기관의 이상 사이클로, 단열압축 → 정압가열 → 단열팽창 → 정적방열의 네 과정으로 이루어진다. 열효율은 압축비가 클수록, 단절비(정압 가열 구간)가 작을수록 높다.","x":"\n<p class=\"key\">디젤 사이클은 압축착화기관의 이상 사이클로, 단열압축 → 정압가열 → 단열팽창 → 정적방열의 네 과정으로 이루어진다. 열효율은 압축비가 클수록, 단절비(정압 가열 구간)가 작을수록 높다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 220\" role=\"img\" aria-label=\"디젤 사이클 P-v 선도\">\n<line x1=\"50\" y1=\"190\" x2=\"400\" y2=\"190\" class=\"ln\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"20\" class=\"ln\"/>\n<path d=\"M90 40 L150 40\" class=\"lr\"/><path d=\"M150 40 C 200 90, 280 130, 360 140\" class=\"ln2\"/><path d=\"M360 140 L360 175\" class=\"lg\" style=\"stroke:var(--ink);stroke-dasharray:none\"/><path d=\"M360 175 C 260 172, 160 150, 90 40\" class=\"ln2\"/>\n<circle cx=\"90\" cy=\"40\" r=\"3\" class=\"dot\"/><circle cx=\"150\" cy=\"40\" r=\"3\" class=\"dot\"/><circle cx=\"360\" cy=\"140\" r=\"3\" class=\"dot\"/><circle cx=\"360\" cy=\"175\" r=\"3\" class=\"dot\"/>\n<text x=\"78\" y=\"34\" class=\"t1\">2<\/text><text x=\"152\" y=\"34\" class=\"t1\">3<\/text><text x=\"366\" y=\"138\" class=\"t1\">4<\/text><text x=\"366\" y=\"180\" class=\"t1\">1<\/text>\n<text x=\"104\" y=\"30\" class=\"tr\">Q<tspan font-size=\"9\">in<\/tspan> 정압<\/text><text x=\"370\" y=\"160\" class=\"t2\">Q<tspan font-size=\"9\">out<\/tspan> 정적<\/text>\n<text x=\"380\" y=\"206\" class=\"t2\">v<\/text><text x=\"34\" y=\"28\" class=\"t2\">P<\/text>\n<\/svg><\/figure>\n<div class=\"eq\"><div class=\"eql\">r: 압축비 v<sub>1<\/sub>/v<sub>2<\/sub>, ρ: 단절비 v<sub>3<\/sub>/v<sub>2<\/sub><\/div><div class=\"mj\">\\[\\eta_D=1-\\dfrac{1}{r^{\\,k-1}}\\cdot\\dfrac{\\rho^k-1}{k(\\rho-1)}\\]<\/div><\/div>\n<ul>\n<li>같은 압축비에서는 오토 사이클(정적가열)이 더 효율적이지만, 디젤은 노킹 제약이 없어 압축비를 훨씬 높일 수 있으므로(15~20 이상) 실제 효율이 더 높다.<\/li>\n<li>실제 고속 디젤은 정적·정압 가열이 섞인 사바테(복합) 사이클에 가깝다. 대형 저속기관은 최고압력을 제한하면서 정압 연소 구간을 길게 쓴다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>압축착화기관의 이상 사이클: 1→2 단열압축, 2→3 정압가열, 3→4 단열팽창, 4→1 정적방열.<\/p>\n<h5>2. P-v 선도<\/h5><p>(답안에 P-v 선도를 그림: 정압 가열 수평선 2→3, 정적 방열 수직선 4→1)<\/p>\n<div class=\"calc\">η = 1 − (1/r^(k−1)) · (ρ^k − 1) / [k(ρ − 1)]\nr: 압축비, ρ: 단절비<\/div>\n<h5>3. 특징<\/h5><ul><li>압축비↑·단절비↓ → 효율↑<\/li><li>같은 압축비면 오토 사이클이 효율 높으나, 디젤은 노킹 제약이 없어 고압축비(15~20 이상)로 실효율 높음<\/li><li>실제 기관은 사바테(복합) 사이클에 가까움<\/li><\/ul><\/div><\/section><\/details>"},{"id":"diesel-knocking","p":8,"n":"8.4","h":"디젤기관의 노킹(Knocking) 원인과 대책","t":"디젤기관의 노킹(Knocking) 원인과 대책","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 9번 · 10점"],"q":["<b>112회(2017) 1-9<\/b> 디젤(Diesel) 기관의 노킹(Knocking) 원인과 대책"],"k":"디젤 노킹은 착화지연 기간이 길어 그동안 분사된 연료가 한꺼번에 연소하면서 압력이 급상승(dp/dθ 과대)해 충격음과 진동을 내는 현상이다. 착화를 빠르게 하는 것(높은 압축온도, 착화성 좋은 연료, 좋은 무화)이 대책이며, 이는 가솔린 노킹 대책과 반대 방향이다.","x":"\n<p class=\"key\">디젤 노킹은 착화지연 기간이 길어 그동안 분사된 연료가 한꺼번에 연소하면서 압력이 급상승(dp/dθ 과대)해 충격음과 진동을 내는 현상이다. 착화를 빠르게 하는 것(높은 압축온도, 착화성 좋은 연료, 좋은 무화)이 대책이며, 이는 가솔린 노킹 대책과 반대 방향이다.<\/p>\n<h4>원인<\/h4>\n<ul>\n<li>연료 착화성 불량: 세탄가 낮음, 중유의 CCAI 높음(착화성 지표).<\/li>\n<li>압축온도 부족: 저압축비, 냉간 시동, 흡기온도 낮음, 압축 누설(링·밸브).<\/li>\n<li>분사 불량: 분사압 저하, 노즐 마모·막힘으로 무화 불량, 분사시기 과진각.<\/li>\n<li>저부하 장시간 운전, 연료 점도 부적정(가열 부족).<\/li>\n<\/ul>\n<h4>대책<\/h4>\n<ul>\n<li>착화성 좋은 연료, 연료 가열로 분사 점도 확보.<\/li>\n<li>분사시기 조정, 파일럿(예비) 분사, 분사압 유지(노즐·펌프 정비).<\/li>\n<li>냉각수·흡기 온도 관리, 시동 전 예열, 압축압 점검.<\/li>\n<li>전자제어 기관은 분사율 형성(rate shaping)으로 초기 연소 억제.<\/li>\n<\/ul>\n<h4>영향<\/h4>\n<p>피스톤·링·베어링 과부하, 실린더 라이너 손상, 소음 증가, 효율 저하.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>착화지연 중 누적된 연료가 한꺼번에 연소해 압력이 급상승(dp/dθ 과대)하며 충격음·진동을 내는 현상.<\/p>\n<h5>2. 원인<\/h5><ul><li>연료 착화성 불량(세탄가 낮음, 중유 CCAI 높음)<\/li><li>압축온도 부족(냉간 시동, 저흡기온도, 압축 누설)<\/li><li>분사 불량(분사압 저하, 노즐 마모, 과진각)<\/li><\/ul>\n<h5>3. 대책<\/h5><ul><li>착화성 좋은 연료, 분사 점도 확보(가열)<\/li><li>분사시기 조정, 파일럿 분사, 분사압 유지<\/li><li>예열·흡기온도·압축압 관리<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 착화를 빠르게 하는 방향이 대책으로, 가솔린 노킹 대책과 반대임.<\/p><\/div><\/section><\/details>"},{"id":"derating","p":8,"n":"8.5","h":"기관의 디레이팅(Derating)","t":"기관의 디레이팅(Derating)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 4번 · 10점"],"q":["<b>112회(2017) 1-4<\/b> 기관의 디레이팅(Derating)"],"k":"디레이팅은 기관을 공칭 최대출력(L1)보다 낮은 출력·회전수 점을 MCR로 정해 운전하는 것이다. 같은 최고 연소압을 유지하면서 평균유효압을 낮추므로 연료소비율이 개선되고 열부하가 줄어 수명이 늘어난다. EEXI 대응의 기관 출력 제한(EPL)도 넓은 의미의 디레이팅이다.","x":"\n<p class=\"key\">디레이팅은 기관을 공칭 최대출력(L1)보다 낮은 출력·회전수 점을 MCR로 정해 운전하는 것이다. 같은 최고 연소압을 유지하면서 평균유효압을 낮추므로 연료소비율이 개선되고 열부하가 줄어 수명이 늘어난다. EEXI 대응의 기관 출력 제한(EPL)도 넓은 의미의 디레이팅이다.<\/p>\n<h4>원리<\/h4>\n<ul>\n<li>기관 배치선도(layout diagram)의 L1~L4 범위 안에서 정격점을 선정. 정격점을 낮추면(L2·L3·L4 방향) 압축압·최고압 비율을 유리하게 조정해 SFOC 감소.<\/li>\n<li>더 큰 기관(실린더 수 증가 또는 대구경)을 낮춘 정격으로 써서 효율 확보 → 초기비 증가와 연비 절감의 trade-off.<\/li>\n<\/ul>\n<h4>목적과 적용<\/h4>\n<ul>\n<li>연료비 절감(대략 수 % 수준 SFOC 개선), 열부하 감소로 정비 주기 연장.<\/li>\n<li>저속 운항 최적화(과급기 일부 차단, 저부하 튜닝).<\/li>\n<li>EEDI·EEXI 달성값 개선(기준 출력 감소).<\/li>\n<li>개조: 과급기 재매칭, 연료 분사·밸브 타이밍 변경, 선급·제작사 승인(NOx 기술 파일 갱신).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>기관을 공칭 최대출력(L1)보다 낮은 출력·회전수 점을 MCR로 정해 운전하는 것.<\/p>\n<h5>2. 원리<\/h5><p>배치선도 L1~L4 범위에서 정격을 낮추면 최고 연소압 대비 평균유효압이 낮아져 SFOC 개선, 열부하 감소.<\/p>\n<h5>3. 목적·적용<\/h5><ul><li>연료비 절감, 정비 주기 연장<\/li><li>큰 기관을 낮은 정격으로(초기비 vs 연비)<\/li><li>EEDI·EEXI 대응(출력 제한 EPL도 같은 맥락)<\/li><li>개조 시 과급기 재매칭, NOx 기술파일 갱신<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 출력을 낮추면 악천후 최소 추진력 확인이 필요함.<\/p><\/div><\/section><\/details>"},{"id":"tc-surging","p":8,"n":"8.6","h":"터보차저(Turbocharger) 서징 현상, 발생원인, 방지대책","t":"터보차저(Turbocharger) 서징 현상, 발생원인, 방지대책","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 3교시 6번 · 25점"],"q":["<b>121회(2020) 3-6<\/b> 터보차저 서징(surging) 현상과 발생원인, 방지대책"],"k":"서징은 과급기 압축기가 낮은 유량에서 높은 압력비를 요구받아 서지선을 넘을 때 유동이 역류·재흡입을 반복하는 불안정 현상이다. 큰 소음(폭음·울음), 소기압 변동, 날개 손상을 일으킨다. 원인은 압축기 출구 저항 증가나 유량 급감이고, 대책은 오염 관리와 급격한 부하 변동 회피, 적정 매칭이다.","x":"\n<p class=\"key\">서징은 과급기 압축기가 낮은 유량에서 높은 압력비를 요구받아 서지선을 넘을 때 유동이 역류·재흡입을 반복하는 불안정 현상이다. 큰 소음(폭음·울음), 소기압 변동, 날개 손상을 일으킨다. 원인은 압축기 출구 저항 증가나 유량 급감이고, 대책은 오염 관리와 급격한 부하 변동 회피, 적정 매칭이다.<\/p>\n<h4>발생원인<\/h4>\n<ul>\n<li>공기 쪽 저항 증가: 소기 공기냉각기 오염, 공기 필터 막힘, 소기구 막힘.<\/li>\n<li>배기 쪽 문제: 터빈 노즐링·블레이드 오염(카본), 배기밸브 누설·고착.<\/li>\n<li>급격한 부하 변화: 비상 정지, 프로펠러 공회전(황천 시 프로펠러 노출), 급감속.<\/li>\n<li>실린더 간 부하 불균형, 실화, 소기실 화재.<\/li>\n<li>과급기 매칭 부적정(서지 여유 부족), 저속 운항 시 과급기 다수 운전.<\/li>\n<\/ul>\n<h4>방지대책<\/h4>\n<ul>\n<li>정기 세정: 압축기 수세, 터빈 건식·습식 세정.<\/li>\n<li>공기냉각기·필터 차압 관리, 배기밸브 정비.<\/li>\n<li>완만한 부하 조정, 황천 시 회전수 제한·거버너 설정.<\/li>\n<li>설계: 서지 여유 확보 매칭, 저부하 운전 시 과급기 차단(cut-out) 또는 가변 노즐(VTA).<\/li>\n<li>실린더 출력 균형(지압 계측).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>과급기 압축기가 낮은 유량에서 높은 압력비를 요구받아 서지선을 넘을 때 역류·재흡입이 반복되는 불안정 현상. 폭음·소기압 변동·날개 손상.<\/p>\n<h5>2. 발생 원리<\/h5><p>압축기 특성 선도에서 운전점이 서지선 좌측(저유량·고압력비)으로 이동하면 유동 박리 → 역류.<\/p>\n<h5>3. 발생원인<\/h5><ol><li>공기 쪽 저항: 소기 공기냉각기·필터 오염<\/li><li>배기 쪽: 터빈 노즐링 카본, 배기밸브 누설<\/li><li>급격한 부하 변화: 비상정지, 황천 프로펠러 공회전<\/li><li>실린더 불균형·실화, 소기실 화재<\/li><li>매칭 부적정, 저부하 과급기 다수 운전<\/li><\/ol>\n<h5>4. 방지대책<\/h5><ul><li>정기 세정(압축기 수세, 터빈 건·습식)<\/li><li>냉각기·필터 차압 관리, 배기밸브 정비<\/li><li>완만한 부하 조정, 황천 시 회전수 제한<\/li><li>서지 여유 있는 매칭, 저부하 과급기 차단·가변 노즐<\/li><li>실린더 출력 균형<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 서징은 대부분 오염과 급격한 부하 변화에서 오므로 정기 세정과 운전 관리가 1차 대책이며, 저속 운항 선박은 설계 단계 매칭 재검토가 필요함.<\/p><\/div><\/section><\/details>"},{"id":"turning-gear","p":8,"n":"8.7","h":"선박용 디젤엔진 터닝휠(Turning Wheel)의 기능","t":"선박용 디젤엔진 터닝휠(Turning Wheel)의 기능","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 1교시 3번 · 10점"],"q":["<b>133회(2024) 1-3<\/b> 선박용 디젤엔진 터닝휠(Turning Wheel)의 기능"],"k":"터닝휠은 크랭크축 끝의 대형 원판으로, 플라이휠 역할(회전 변동 완화)과 터닝기어가 맞물리는 기어 림 역할, 크랭크 각도 눈금판 역할을 한다.","x":"\n<p class=\"key\">터닝휠은 크랭크축 끝의 대형 원판으로, 플라이휠 역할(회전 변동 완화)과 터닝기어가 맞물리는 기어 림 역할, 크랭크 각도 눈금판 역할을 한다.<\/p>\n<ul>\n<li><b>플라이휠 관성<\/b>: 폭발 행정 사이의 토크 변동을 흡수해 회전 속도 변동을 줄인다. 관성 크기는 축계 비틀림진동 고유진동수에도 영향을 준다(튜닝 수단).<\/li>\n<li><b>터닝(턴닝) 기어 연결<\/b>: 전동기+웜기어인 터닝기어가 휠의 치차에 물려 기관을 아주 천천히 돌린다. 정비 시 피스톤 위치 맞춤, 시동 전 지시밸브를 열고 돌려 실린더 내 물·연료 유무 확인, 정지 후 냉각 중 회전으로 국부 변형 방지.<\/li>\n<li><b>각도 표시<\/b>: 원주 눈금으로 상사점(TDC)과 분사·밸브 시기 확인·조정.<\/li>\n<li><b>안전 연동<\/b>: 터닝기어가 물린 상태에서는 시동 공기 차단(인터록)으로 기동이 불가능하다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>크랭크축 끝의 대형 원판(플라이휠)으로 터닝기어가 맞물리는 기어 림과 각도 눈금을 가짐.<\/p>\n<h5>2. 기능<\/h5><ol><li>관성으로 토크·회전 변동 완화(비틀림진동 튜닝에도 영향)<\/li><li>터닝기어로 저속 회전: 정비 시 위치 맞춤, 시동 전 실린더 내 물·연료 확인, 정지 후 냉각 회전<\/li><li>상사점·분사·밸브 시기 확인<\/li><li>안전 연동: 터닝기어 체결 시 기동 차단<\/li><\/ol><\/div><\/section><\/details>"},{"id":"exhaust-emissions","p":8,"n":"8.8","h":"압축착화기관의 배기가스 성분과 저감대책, 고압연료분사의 효과","t":"압축착화기관의 배기가스 성분과 저감대책, 고압연료분사의 효과","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 2번 · 25점"],"q":["<b>112회(2017) 4-2<\/b> 압축착화기관의 배기가스 성분과 저감대책 중 고압연료분사펌프의 사용"],"k":"디젤 배기의 대부분은 N₂, O₂, CO₂, H₂O이고, 규제 대상 유해 성분은 NOx, SOx, 입자상물질(PM, 매연), CO, 미연 탄화수소(HC), 블랙카본이다. 고압연료분사는 무화와 혼합을 개선해 PM·CO·HC와 연료소비를 줄이지만, 연소온도가 올라 NOx가 늘 수 있어 분사시기·분사율 제어와 함께 써야 한다.","x":"\n<p class=\"key\">디젤 배기의 대부분은 N₂, O₂, CO₂, H₂O이고, 규제 대상 유해 성분은 NOx, SOx, 입자상물질(PM, 매연), CO, 미연 탄화수소(HC), 블랙카본이다. 고압연료분사는 무화와 혼합을 개선해 PM·CO·HC와 연료소비를 줄이지만, 연소온도가 올라 NOx가 늘 수 있어 분사시기·분사율 제어와 함께 써야 한다.<\/p>\n<h4>성분과 생성 원인<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>성분<\/th><th>원인<\/th><th>규제·대책<\/th><\/tr><\/thead><tbody>\n<tr><td>NOx<\/td><td>고온 연소에서 공기 중 N₂ 산화(열적 NOx)<\/td><td>MARPOL VI Reg.13 Tier II/III. 밀러 사이클, EGR, 물 분사·유화연료, 분사 지연, SCR(요소수)<\/td><\/tr>\n<tr><td>SOx<\/td><td>연료 중 황 산화<\/td><td>Reg.14 황 함량 0.50%(전 해역), ECA 0.10%. 저유황유, 스크러버, LNG<\/td><\/tr>\n<tr><td>PM·매연<\/td><td>불완전 연소, 연료 회분·황산염<\/td><td>고압 분사, 연소 개선, 스크러버<\/td><\/tr>\n<tr><td>CO·HC<\/td><td>국부 산소 부족, 저부하<\/td><td>분사·과급 최적화<\/td><\/tr>\n<tr><td>CO₂<\/td><td>탄소 연소(연료에 비례)<\/td><td>효율 향상, 저탄소 연료(EEDI·CII)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>고압연료분사(커먼레일·전자제어 분사)<\/h4>\n<ul>\n<li>분사압 1,000~2,000 bar 수준 → 미세 무화, 공기와 빠른 혼합 → 완전 연소로 PM·CO·HC 감소, SFOC 개선.<\/li>\n<li>부작용: 빠르고 고온의 연소로 NOx 증가 경향 → 분사시기 지연, 다단 분사, 분사율 형성으로 trade-off 최적화.<\/li>\n<li>전자제어 기관(ME, X 계열)은 부하별로 분사압·시기를 자유롭게 바꿔 저부하 매연 감소와 연비를 동시에 얻는다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 배기가스 성분<\/h5><p>주성분 N₂·O₂·CO₂·H₂O / 유해 성분 NOx, SOx, PM(매연), CO, HC, 블랙카본.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>성분<\/th><th>원인<\/th><th>저감<\/th><\/tr><\/thead><tbody>\n<tr><td>NOx<\/td><td>고온 연소<\/td><td>Tier III: 밀러 사이클, EGR, SCR<\/td><\/tr>\n<tr><td>SOx<\/td><td>연료 황<\/td><td>0.50%/ECA 0.10%, 스크러버, LNG<\/td><\/tr>\n<tr><td>PM<\/td><td>불완전 연소<\/td><td>고압 분사, 스크러버<\/td><\/tr>\n<tr><td>CO·HC<\/td><td>국부 산소 부족<\/td><td>분사·과급 최적화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 고압연료분사펌프(커먼레일)<\/h5><ul><li>분사압 1,000~2,000 bar 수준 → 미세 무화·빠른 혼합 → PM·CO·HC 감소, SFOC 개선<\/li><li>부작용: 연소온도 상승으로 NOx 증가 경향 → 분사시기 지연·다단 분사·분사율 형성으로 절충<\/li><li>전자제어 기관은 부하별 분사압·시기 최적화(저부하 매연 감소)<\/li><\/ul>\n<p class=\"concl\"><b>3. 결론<\/b>: 고압 분사는 PM·연비에 유리하지만 NOx와 상충하므로 전자제어와 후처리(SCR·EGR)를 함께 써야 Tier III를 만족함.<\/p><\/div><\/section><\/details>"},{"id":"df-engines","p":8,"n":"8.9","h":"이중연료(Dual Fuel) 4행정기관","t":"이중연료(Dual Fuel) 4행정기관","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 7번 · 10점"],"q":["<b>130회(2023) 1-7<\/b> 이중연료 4행정기관"],"k":"이중연료 4행정기관은 가스 모드에서 저압 천연가스를 흡기에 섞어 희박 예혼합 오토 사이클로 운전하고, 소량의 파일럿 디젤로 점화한다. 연료유 모드로 언제든 전환할 수 있다. 가스 모드에서 후처리 없이 NOx Tier III를 만족하지만 메탄 슬립과 노킹 한계가 과제다.","x":"\n<p class=\"key\">이중연료 4행정기관은 가스 모드에서 저압 천연가스를 흡기에 섞어 희박 예혼합 오토 사이클로 운전하고, 소량의 파일럿 디젤로 점화한다. 연료유 모드로 언제든 전환할 수 있다. 가스 모드에서 후처리 없이 NOx Tier III를 만족하지만 메탄 슬립과 노킹 한계가 과제다.<\/p>\n<h4>작동<\/h4>\n<ul>\n<li>가스 공급압 약 5~6 bar 수준, 흡기 포트에서 가스 분사 → 압축 → 파일럿 연료(에너지 약 1% 수준) 분사로 착화.<\/li>\n<li>공기 과잉률이 커서 연소온도 낮음 → NOx 매우 적음.<\/li>\n<li>노킹(과농)과 실화(과희박) 사이 운전창이 좁아 실린더별 공연비 제어, 메탄가(MN)에 따라 출력 제한.<\/li>\n<li>디젤 모드 전환: 가스 공급 이상 시 자동 전환(운전 연속성).<\/li>\n<\/ul>\n<h4>장단점<\/h4>\n<div class=\"grid2\"><div class=\"box\"><h5>장점<\/h5><ul><li>Tier III 무후처리, SOx·PM 거의 없음<\/li><li>연료 유연성<\/li><li>디젤-전기 추진(DFDE)으로 LNG선 BOG 활용<\/li><\/ul><\/div>\n<div class=\"box\"><h5>단점<\/h5><ul><li>메탄 슬립(GHG 영향)<\/li><li>저부하 효율 저하, 부하 응답 느림<\/li><li>가스 공급계·안전설비(IGF) 비용<\/li><\/ul><\/div><\/div>\n<p>2행정 대비: 저압 오토 방식(X-DF)과 고압 디젤 방식(ME-GI, 약 300 bar 가스 직접 분사)이 있다. 고압 방식은 메탄 슬립이 매우 적지만 NOx 후처리(EGR·SCR)가 필요하다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>가스 모드는 저압 천연가스를 흡기에 혼합한 희박 예혼합 오토 사이클 + 파일럿 디젤 점화, 연료유 모드로 전환 가능한 4행정 기관.<\/p>\n<h5>2. 특징<\/h5><ul><li>가스 공급압 약 5~6 bar, 파일럿 연료 에너지 약 1%<\/li><li>희박 연소 → NOx Tier III 무후처리, SOx·PM 거의 없음<\/li><li>노킹(과농)·실화(과희박) 사이 운전창, 메탄가 의존<\/li><\/ul>\n<h5>3. 과제<\/h5><p>메탄 슬립, 저부하 효율 저하·부하 응답, IGF 안전설비. DFDE LNG선·페리·크루즈에 적용.<\/p><\/div><\/section><\/details>"},{"id":"me-selection","p":8,"n":"8.10","h":"최적 주기관(M/E) 선정 시 고려사항","t":"최적 주기관(M/E) 선정 시 고려사항","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 4교시 1번 · 25점","133회 4교시 5번 · 25점"],"q":["<b>124회(2021) 4-1<\/b> 최적의 주기관(M/E) 선정 고려사항","<b>133회(2024) 4-5<\/b> 주기관 선정 시 고려사항"],"k":"주기관은 필요 출력과 프로펠러 최적 회전수에 맞는 기종·실린더 수·정격점을 고르는 것에서 시작해, 연료·배출 규제(EEDI/CII, Tier III, 대체연료 준비), 경제성(초기비·연비·정비비), 배치·진동, 신뢰성과 서비스망까지 평가해 결정한다.","x":"\n<p class=\"key\">주기관은 필요 출력과 프로펠러 최적 회전수에 맞는 기종·실린더 수·정격점을 고르는 것에서 시작해, 연료·배출 규제(EEDI/CII, Tier III, 대체연료 준비), 경제성(초기비·연비·정비비), 배치·진동, 신뢰성과 서비스망까지 평가해 결정한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>고려사항<\/th><\/tr><\/thead><tbody>\n<tr><td>성능<\/td><td>소요 동력(해상여유·기관여유 포함한 MCR), 프로펠러 효율이 최대가 되는 저회전·대직경과의 매칭, 배치선도 내 정격점(디레이팅 여부)<\/td><\/tr>\n<tr><td>연비<\/td><td>SFOC(전 부하 대역), 저부하·저속 운항 튜닝, 폐열회수·축발전기 결합<\/td><\/tr>\n<tr><td>연료·규제<\/td><td>중유/저유황유/LNG/메탄올/암모니아 이중연료 또는 전환 준비(fuel-ready), NOx Tier III 대응(EGR, SCR), EEDI·EEXI·CII 달성<\/td><\/tr>\n<tr><td>배치<\/td><td>기관 길이·높이·중량(기관실 길이, 피스톤 인출 크레인 높이), 축계 길이<\/td><\/tr>\n<tr><td>진동<\/td><td>외부 불평형 모멘트(1·2차), 가이드력 모멘트, 비틀림진동(실린더 수와 BSR)<\/td><\/tr>\n<tr><td>경제성<\/td><td>구입비, 설치비, 수명 주기 연료·정비 비용(NPV), 잔존가치<\/td><\/tr>\n<tr><td>신뢰성·지원<\/td><td>실적, 부품 조달·서비스 네트워크, 선주 선대 표준화, 승무원 숙련<\/td><\/tr>\n<tr><td>계약<\/td><td>납기, 선주 지정 메이커, 국산화(기자재 공급망)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-4-1 · 133-4-5<\/td><td>최적 주기관 선정 고려사항<\/td><td>성능·연비·규제·배치·진동·경제성·신뢰성 7축<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>주기관 선정은 소요 출력과 프로펠러 최적 회전수에서 출발해 연료·규제·배치·경제성을 종합 평가하는 과정임.<\/p>\n<h5>2. 선정 절차<\/h5><ol><li>소요 출력: 속력-동력 곡선 + 해상여유 15% + 기관여유 10~15% → MCR<\/li><li>회전수: 저회전·대직경 프로펠러 효율 → 기관 배치선도(L1~L4) 정격점<\/li><li>기종·실린더 수 후보 → 아래 항목 평가<\/li><\/ol>\n<h5>3. 고려사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>연비<\/td><td>전 부하 SFOC, 저부하 튜닝, WHR·PTO 결합<\/td><\/tr>\n<tr><td>연료·규제<\/td><td>이중연료(LNG·메탄올·암모니아)·fuel-ready, Tier III(EGR·SCR), EEDI·CII<\/td><\/tr>\n<tr><td>배치<\/td><td>길이·높이·중량, 피스톤 인출 크레인<\/td><\/tr>\n<tr><td>진동<\/td><td>1·2차 불평형 모멘트, 가이드력, 비틀림진동 BSR<\/td><\/tr>\n<tr><td>경제성<\/td><td>구입·설치비, 수명주기 연료·정비비(NPV)<\/td><\/tr>\n<tr><td>신뢰성·지원<\/td><td>실적, 서비스망, 선대 표준화, 납기<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 탄소 규제 시대의 주기관 선정은 \"현재 연료의 최적\"보다 \"수명 중 연료 전환 가능성\"이 핵심 기준이 되어야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"engine-energy-saving","p":8,"n":"8.11","h":"주기(主機) 및 보기(補機)에 적용할 수 있는 Energy Saving 방법","t":"주기(主機) 및 보기(補機)에 적용할 수 있는 Energy Saving 방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 3번 · 25점"],"q":["<b>127회(2022) 3-3<\/b> 주기 및 보기에 적용할 수 있는 energy saving 방법"],"k":"에너지 절감은 연료가 일로 바뀌는 효율(주기), 전력 생산 효율(발전), 전력 소비(보기), 버려지는 열의 회수(폐열)라는 네 지점에서 찾는다.","x":"\n<p class=\"key\">에너지 절감은 연료가 일로 바뀌는 효율(주기), 전력 생산 효율(발전), 전력 소비(보기), 버려지는 열의 회수(폐열)라는 네 지점에서 찾는다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>방법<\/th><th>원리<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"4\">주기<\/td><td>디레이팅, 저부하 튜닝(배기 바이패스, 과급기 차단, 가변 과급)<\/td><td>운항 부하 대역에서 SFOC 최소화<\/td><\/tr>\n<tr><td>전자제어 기관, 연소 최적화(지압 계측)<\/td><td>분사·밸브 타이밍 최적<\/td><\/tr>\n<tr><td>실린더유 주유량 최적화<\/td><td>윤활유 비용·배출<\/td><\/tr>\n<tr><td>저속 운항, 기상 항로, 트림 최적화<\/td><td>운항 동력 감소(P ∝ V³)<\/td><\/tr>\n<tr><td rowspan=\"2\">발전<\/td><td>축발전기(PTO)<\/td><td>주기의 낮은 SFOC로 발전, 발전기관 정지<\/td><\/tr>\n<tr><td>전력관리(PMS) 최적, 배터리 하이브리드<\/td><td>발전기 최적 부하율 운전, 피크 저감·예비전력 대체<\/td><\/tr>\n<tr><td rowspan=\"3\">보기<\/td><td>해수·청수 냉각 펌프, 기관실 팬에 인버터(VFD)<\/td><td>상사법칙 P ∝ n³: 회전수 20% 감소로 동력 약 50% 감소<\/td><\/tr>\n<tr><td>LED 조명, 고효율 공조, 압축기 제어<\/td><td>전력 소비 감소<\/td><\/tr>\n<tr><td>배관·탱크 보온, 연료 가열 최적화<\/td><td>증기 소비 감소<\/td><\/tr>\n<tr><td rowspan=\"2\">폐열<\/td><td>배기 이코노마이저, 터빈 발전(WHRS)<\/td><td>배기열 → 증기·전력<\/td><\/tr>\n<tr><td>재킷 청수열로 조수기 운전<\/td><td>냉각수 열 → 청수 생산<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>절감 지점은 연료→일 효율(주기), 발전 효율, 전력 소비(보기), 폐열 회수의 넷임.<\/p>\n<h5>2. 주기<\/h5><ul><li>디레이팅, 저부하 튜닝(배기 바이패스, 과급기 차단, 가변 과급)<\/li><li>전자제어 연소 최적화, 실린더유 최적화<\/li><li>감속 운항·기상 항로·트림 최적화(P ∝ V³)<\/li><\/ul>\n<h5>3. 발전<\/h5><ul><li>축발전기(PTO): 주기 낮은 SFOC로 발전<\/li><li>PMS 최적 부하율, 배터리 피크 저감<\/li><\/ul>\n<h5>4. 보기<\/h5><div class=\"calc\">인버터(VFD) 펌프·팬: P ∝ n³ → 회전수 20% 감소 시 동력 약 49% 감소<\/div>\n<ul><li>LED 조명, 고효율 공조, 압축기 제어, 보온<\/li><\/ul>\n<h5>5. 폐열<\/h5><ul><li>배기 이코노마이저·WHRS 발전, 재킷수열 조수기<\/li><\/ul>\n<p class=\"concl\"><b>6. 결론<\/b>: 보기 인버터화처럼 투자비가 작은 조치부터 적용하고, WHRS·PTO는 운항 프로파일로 경제성을 판단함.<\/p><\/div><\/section><\/details>"},{"id":"whrs","p":8,"n":"8.12","h":"폐열회수시스템(WHRS)과 미설치 선박과의 연료소비량 비교","t":"폐열회수시스템(WHRS)과 미설치 선박과의 연료소비량 비교","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 3교시 6번 · 25점","130회 3교시 4번 · 25점"],"q":["<b>118회(2019) 3-6<\/b> 동력장치의 폐열회수시스템(WHRS)","<b>130회(2023) 3-4<\/b> 선박용 폐열회수시스템과 미설치 시 연료소비량 비교"],"k":"대형 2행정 디젤은 연료 에너지의 약 절반만 축 일로 바꾸고 나머지는 배기(약 25%), 소기 공기 냉각, 재킷 냉각수, 윤활유로 버린다. WHRS는 배기열로 증기를 만들어 증기터빈 발전기를 돌리고, 배기 일부로 파워터빈을 돌려 전력을 만든다. 남는 전력은 축 모터(PTI)로 추진에 보태 연료를 줄인다.","x":"\n<p class=\"key\">대형 2행정 디젤은 연료 에너지의 약 절반만 축 일로 바꾸고 나머지는 배기(약 25%), 소기 공기 냉각, 재킷 냉각수, 윤활유로 버린다. WHRS는 배기열로 증기를 만들어 증기터빈 발전기를 돌리고, 배기 일부로 파워터빈을 돌려 전력을 만든다. 남는 전력은 축 모터(PTI)로 추진에 보태 연료를 줄인다.<\/p>\n<h4>구성<\/h4>\n<ul>\n<li>배기가스 이코노마이저(EGE, 이중압): 증기 생산.<\/li>\n<li>증기터빈 발전기(STG), 배기가스 파워터빈(PT, 과급기 바이패스 배기 이용).<\/li>\n<li>축발전기/모터(PTO/PTI)로 잉여 전력 추진 회수.<\/li>\n<li>대안: ORC(유기 랭킨 사이클)로 저온 열원(재킷수·소기열) 회수.<\/li>\n<\/ul>\n<h4>연료소비 비교 (예시 계산, 가정 명시)<\/h4>\n<p>가정: 주기 출력 50 MW, SFOC 165 g/kWh. 선내 전력 2 MW는 발전기관(SFOC 200 g/kWh)이 공급. WHRS는 3.5 MW 전력 생산, 선내 2 MW 충당 후 1.5 MW를 PTI로 추진에 투입. WHRS용 배기 조건 변경으로 주기 SFOC 1.5% 증가.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th class=\"num\">WHRS 없음<\/th><th class=\"num\">WHRS 있음<\/th><\/tr><\/thead><tbody>\n<tr><td>주기 출력<\/td><td class=\"num\">50.0 MW<\/td><td class=\"num\">48.5 MW (+PTI 1.5 MW)<\/td><\/tr>\n<tr><td>주기 연료<\/td><td class=\"num\">8.250 t/h<\/td><td class=\"num\">48.5 × 167.5 = 8.123 t/h<\/td><\/tr>\n<tr><td>발전기관 연료<\/td><td class=\"num\">0.400 t/h<\/td><td class=\"num\">0 (정지)<\/td><\/tr>\n<tr><td>합계<\/td><td class=\"num\">8.650 t/h<\/td><td class=\"num\">8.123 t/h<\/td><\/tr>\n<tr><td>절감<\/td><td colspan=\"2\" class=\"num\">0.53 t/h ≈ 6.1%, 연 6,000시간 운항 시 약 3,200 t 연료, CO₂ 약 9,900 t<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>실제 절감률은 주기 출력이 클수록(배기 열량), 운항 부하가 높을수록 크다(대략 5~10%). 저속 운항이 길면 배기 온도·유량이 줄어 효과가 감소하므로 운항 프로파일로 경제성(설치비 대비 회수기간)을 평가한다. EEDI에서는 폐열 회수 전력을 혁신기술 감소분으로 반영할 수 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-3-6<\/td><td>동력장치 WHRS<\/td><td>열수지·구성·원리<\/td><\/tr>\n<tr><td class=\"num\">130-3-4<\/td><td>WHRS와 미설치 시 연료소비 비교<\/td><td>가정을 밝힌 수치 비교<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 130회형\">\n<h5>1. 개요<\/h5><p>대형 2행정 디젤은 연료 에너지의 약 절반만 축 일로 바꾸고 배기(약 25%)·소기냉각·재킷수로 버림. WHRS는 배기열로 증기·전력을 만들어 연료를 줄임.<\/p>\n<h5>2. 구성<\/h5><p>배기 이코노마이저(이중압) → 증기터빈 발전기, 배기 파워터빈 → 축 모터(PTI)로 잉여 전력 추진 회수. 저온 열원은 ORC.<\/p>\n<h5>3. 연료소비 비교(가정)<\/h5>\n<div class=\"calc\">주기 50 MW, SFOC 165 g/kWh / 선내 전력 2 MW(발전기 200 g/kWh)\nWHRS 3.5 MW 발전 → 선내 2 MW + PTI 1.5 MW, 주기 SFOC +1.5%\n미설치: 8.250 + 0.400 = 8.650 t/h\n설치  : 48.5 MW × 167.5 = 8.123 t/h (발전기 정지)\n절감  : 0.53 t/h ≈ 6.1%, 연 6,000 h → 약 3,200 t, CO₂ 약 9,900 t<\/div>\n<h5>4. 경제성 판단<\/h5><ul><li>주기 출력·운항 부하가 클수록 유리, 저속 운항 시 효과 감소<\/li><li>설치비·공간·정비 대비 회수기간, EEDI 혁신기술 반영<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 대형 고출력선에서 5~10% 절감이 가능하나 운항 프로파일 의존도가 커서 저속 운항 비중을 반영한 경제성 평가가 필수임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"shaft-gen","p":8,"n":"8.13","h":"샤프트 제너레이터 시스템과 하이브리드의 PTO·PTI·PTH 모드","t":"샤프트 제너레이터 시스템과 하이브리드의 PTO·PTI·PTH 모드","c":2,"r":2,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 4교시 1번 · 25점","139회 1교시 4번 · 10점"],"q":["<b>130회(2023) 4-1<\/b> 하이브리드 시스템의 PTI, PTO, PTH 모드","<b>139회(2026) 1-4<\/b> 샤프트 제너레이터(shaft generator) 시스템의 개념과 장점"],"k":"샤프트 제너레이터는 주기관 축 동력으로 발전하는 장치다. 주파수 변환기를 두면 주기관 회전수가 바뀌어도 일정 주파수 전력을 낼 수 있고, 같은 기계를 전동기로 쓰면 PTI(추진 보조)와 PTH(주기 고장 시 귀항 추진)까지 하는 하이브리드 시스템이 된다.","x":"\n<p class=\"key\">샤프트 제너레이터는 주기관 축 동력으로 발전하는 장치다. 주파수 변환기를 두면 주기관 회전수가 바뀌어도 일정 주파수 전력을 낼 수 있고, 같은 기계를 전동기로 쓰면 PTI(추진 보조)와 PTH(주기 고장 시 귀항 추진)까지 하는 하이브리드 시스템이 된다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"PTO PTI PTH 구성\">\n<rect x=\"10\" y=\"50\" width=\"90\" height=\"50\" rx=\"4\" class=\"fa\"/><text x=\"55\" y=\"80\" text-anchor=\"middle\" class=\"t1\">주기관<\/text>\n<line x1=\"100\" y1=\"75\" x2=\"420\" y2=\"75\" class=\"ln\" style=\"stroke-width:3\"/>\n<rect x=\"160\" y=\"55\" width=\"80\" height=\"40\" rx=\"4\" class=\"fr\"/><text x=\"200\" y=\"80\" text-anchor=\"middle\" class=\"t1\">축발전/모터<\/text>\n<circle cx=\"430\" cy=\"75\" r=\"20\" class=\"fw\"/><text x=\"430\" y=\"80\" text-anchor=\"middle\" class=\"t2\">프로펠러<\/text>\n<rect x=\"160\" y=\"112\" width=\"80\" height=\"30\" rx=\"4\" class=\"fw\"/><text x=\"200\" y=\"131\" text-anchor=\"middle\" class=\"t2\">주파수변환기<\/text>\n<line x1=\"200\" y1=\"95\" x2=\"200\" y2=\"112\" class=\"ln\"/>\n<rect x=\"290\" y=\"112\" width=\"120\" height=\"30\" rx=\"4\" class=\"fw\"/><text x=\"350\" y=\"131\" text-anchor=\"middle\" class=\"t2\">주배전반 · 발전기관<\/text>\n<line x1=\"240\" y1=\"127\" x2=\"290\" y2=\"127\" class=\"ln\"/>\n<text x=\"120\" y=\"40\" class=\"tn\">PTO: 축 → 전력<\/text><text x=\"250\" y=\"40\" class=\"tr\">PTI·PTH: 전력 → 축<\/text>\n<\/svg><\/figure>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>모드<\/th><th>동력 흐름<\/th><th>목적<\/th><\/tr><\/thead><tbody>\n<tr><td>PTO (Power Take Off)<\/td><td>주기관 → 축발전기 → 선내 전력<\/td><td>주기관의 낮은 SFOC·저가 연료로 발전, 발전기관 정지<\/td><\/tr>\n<tr><td>PTI (Power Take In)<\/td><td>발전기관·WHRS·배터리 전력 → 축 모터 → 추진<\/td><td>추진 보조(부스트), 폐열 전력 회수<\/td><\/tr>\n<tr><td>PTH (Power Take Home)<\/td><td>발전기관 전력 → 축 모터 → 프로펠러 (주기관 분리)<\/td><td>주기관 고장 시 저속 귀항, 항구 내 저소음·저배출 전기 추진<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>장점<\/h4>\n<ul>\n<li>연료 절감: 주기 SFOC(대략 165~175 g/kWh)가 발전기관(대략 190~210 g/kWh)보다 낮다.<\/li>\n<li>발전기관 운전시간·정비비 감소, 소음·진동 감소.<\/li>\n<li>추진 이중화(PTH)로 안전성 향상, EEDI 산식에서 보조동력 항 유리.<\/li>\n<\/ul>\n<h4>설계 고려사항<\/h4>\n<p>주파수 변환기 효율·비용, 주기관 출력 여유(PTO 부하 포함), 축계 비틀림진동, 클러치(PTH 시 주기 분리), 정전 시 전환 로직, 저부하 시 주기 운전 제약.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">130-4-1<\/td><td>PTI, PTO, PTH 모드<\/td><td class=\"num\">25<\/td><td>동력 흐름 그림, 모드별 목적<\/td><\/tr>\n<tr><td class=\"num\">139-1-4<\/td><td>샤프트 제너레이터 개념과 장점<\/td><td class=\"num\">10<\/td><td>SFOC 차이로 절감 근거<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 139회형\">\n<h5>1. 개념<\/h5><p>주기관 축 동력으로 발전하는 발전기. 주파수 변환기로 주기 회전수가 변해도 일정 주파수 공급.<\/p>\n<h5>2. 장점<\/h5><ul><li>연료 절감: 주기 SFOC(약 165~175 g/kWh) &lt; 발전기관(약 190~210 g/kWh)<\/li><li>발전기관 운전시간·정비비 감소, 소음 감소<\/li><li>모터로 쓰면 PTI(추진 보조)·PTH(비상 귀항)<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 주기 출력 여유와 비틀림진동, 정전 전환 논리를 함께 검토해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 130회형\">\n<h5>1. 개요<\/h5><p>축발전기/모터를 주기관 축에 두고 동력 흐름 방향을 바꾸어 세 모드로 운전하는 하이브리드 시스템.<\/p>\n<h5>2. 모드<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>모드<\/th><th>동력 흐름<\/th><th>목적<\/th><\/tr><\/thead><tbody>\n<tr><td>PTO<\/td><td>주기 → 축발전기 → 선내 전력<\/td><td>발전기관 정지, 연료 절감<\/td><\/tr>\n<tr><td>PTI<\/td><td>발전기·WHRS·배터리 → 축 모터 → 추진<\/td><td>부스트, 폐열 전력 회수<\/td><\/tr>\n<tr><td>PTH<\/td><td>발전기 → 축 모터 → 프로펠러(주기 분리)<\/td><td>주기 고장 시 귀항, 항내 저배출<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 설계 고려<\/h5><p>주파수 변환기 효율·비용, 클러치(PTH), 주기 출력 여유, 비틀림진동, 정전 시 전환 논리, EEDI 보조동력 항 반영.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 저비용 연료 절감(PTO)과 추진 이중화(PTH)를 함께 얻는 수단으로, 대체연료·배터리와 결합할수록 가치가 커짐.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"electric-propulsion","p":8,"n":"8.14","h":"전기추진설비, 그리고 복합(하이브리드)추진과 전기추진의 특징","t":"전기추진설비, 그리고 복합(하이브리드)추진과 전기추진의 특징","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 13번 · 10점","136회 2교시 3번 · 25점"],"q":["<b>127회(2022) 1-13<\/b> 전기추진설비","<b>136회(2025) 2-3<\/b> 복합추진방식과 전기추진방식의 특징"],"k":"전기추진은 발전기관이 만든 전력으로 추진 전동기를 돌려 프로펠러를 구동한다. 기계적 연결이 없어 배치가 자유롭고 부하에 맞춰 발전기 대수를 조절할 수 있지만, 변환 손실(대략 8~10%)이 있다. 하이브리드는 기계식 직결 추진에 전기 계통(축발전/모터, 배터리)을 더해 운항 모드별로 가장 효율적인 경로를 고른다.","x":"\n<p class=\"key\">전기추진은 발전기관이 만든 전력으로 추진 전동기를 돌려 프로펠러를 구동한다. 기계적 연결이 없어 배치가 자유롭고 부하에 맞춰 발전기 대수를 조절할 수 있지만, 변환 손실(대략 8~10%)이 있다. 하이브리드는 기계식 직결 추진에 전기 계통(축발전/모터, 배터리)을 더해 운항 모드별로 가장 효율적인 경로를 고른다.<\/p>\n<h4>전기추진설비 구성<\/h4>\n<ul>\n<li>발전원: 디젤·이중연료 발전기관, 배터리, 연료전지.<\/li>\n<li>주배전반(대형선 6.6~11 kV 고압), 변압기, 주파수 변환기(VFD, PWM 인버터).<\/li>\n<li>추진 전동기(유도, 동기, 영구자석), 프로펠러·포드·전방위 추진기.<\/li>\n<li>전력·에너지 관리 시스템(PMS/EMS): 부하 분배, 블랙아웃 방지.<\/li>\n<\/ul>\n<h4>비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>전기추진<\/th><th>복합(하이브리드)추진<\/th><\/tr><\/thead><tbody>\n<tr><td>구성<\/td><td>발전 → 전력 → 전동기 → 프로펠러<\/td><td>주기관 직결 + 축발전/모터 + (배터리)<\/td><\/tr>\n<tr><td>효율<\/td><td>설계점 효율 낮음(변환 손실), 부하 변동 큰 선박에서 유리<\/td><td>고속 직결 효율 유지, 저부하는 전기 모드<\/td><\/tr>\n<tr><td>배치<\/td><td>기관을 자유 배치, 기관실 축소·화물 공간 증가<\/td><td>주기관 위치 고정<\/td><\/tr>\n<tr><td>이중화<\/td><td>다수 발전기 → DP, 높은 신뢰성<\/td><td>PTH로 비상 추진<\/td><\/tr>\n<tr><td>소음·진동<\/td><td>매우 낮음<\/td><td>전기 모드 시 낮음<\/td><\/tr>\n<tr><td>적용<\/td><td>크루즈, 쇄빙선, OSV·DP선, DFDE LNG선, 연안 배터리 페리<\/td><td>예인선, 페리, 해양조사선, 대형선 PTO/PTI<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">127-1-13<\/td><td>전기추진설비<\/td><td class=\"num\">10<\/td><td>구성 블록도<\/td><\/tr>\n<tr><td class=\"num\">136-2-3<\/td><td>복합추진과 전기추진 특징<\/td><td class=\"num\">25<\/td><td>비교표, 적용 선종<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 136회형\">\n<h5>1. 개요<\/h5><p>전기추진은 발전 → 전력 → 전동기 → 프로펠러, 복합(하이브리드)추진은 기계식 직결에 축발전/모터·배터리를 더한 방식임.<\/p>\n<h5>2. 전기추진 구성<\/h5><p>발전기관(디젤·DF)·배터리·연료전지 → 주배전반(6.6~11 kV) → 변압기 → 주파수 변환기 → 추진 전동기 → 프로펠러·포드, PMS/EMS<\/p>\n<h5>3. 비교<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>전기추진<\/th><th>복합추진<\/th><\/tr><\/thead><tbody>\n<tr><td>효율<\/td><td>변환 손실 약 8~10%, 부하 변동 큰 선박에 유리<\/td><td>고속 직결 효율, 저부하 전기 모드<\/td><\/tr>\n<tr><td>배치<\/td><td>기관 자유 배치<\/td><td>주기 위치 고정<\/td><\/tr>\n<tr><td>이중화<\/td><td>다수 발전기, DP<\/td><td>PTH 비상 추진<\/td><\/tr>\n<tr><td>소음·진동<\/td><td>매우 낮음<\/td><td>전기 모드 시 낮음<\/td><\/tr>\n<tr><td>적용<\/td><td>크루즈, 쇄빙, OSV, DFDE LNG선, 연안 배터리선<\/td><td>예인선, 페리, 대형선 PTO/PTI<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 운항 부하가 일정한 원양 화물선은 직결이, 부하 변동·이중화·저소음이 중요한 선박은 전기·하이브리드가 경제적이며, 배터리와 대체연료 확대로 하이브리드 비중이 커질 것임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"eprop-rules","p":8,"n":"8.15","h":"전기추진선박기준: 조종장소 경보 10가지와 배터리 배치·요건","t":"전기추진선박기준: 조종장소 경보 10가지와 배터리 배치·요건","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 4교시 5번 · 25점","130회 4교시 5번 · 25점"],"q":["<b>127회(2022) 4-5<\/b> 전기추진선박기준상 조종장소 경보장치를 설치해야 하는 경우 10가지","<b>130회(2023) 4-5<\/b> 전기추진선박기준에 따른 배터리 배치 및 요건"],"k":"해양수산부 고시 「전기추진 선박기준」(2025.5.29. 개정, 제2025-92호)은 리튬이온 배터리 추진선의 설비 요건을 정한다. 제13조는 선박을 조종하는 장소에서 보고 들을 수 있는 경보 10가지를, 제6조·제7조·제15조 등은 배터리실과 배터리 배치·소방 요건을 규정한다.","x":"\n<p class=\"key\">해양수산부 고시 「전기추진 선박기준」(2025.5.29. 개정, 제2025-92호)은 리튬이온 배터리 추진선의 설비 요건을 정한다. 제13조는 선박을 조종하는 장소에서 보고 들을 수 있는 경보 10가지를, 제6조·제7조·제15조 등은 배터리실과 배터리 배치·소방 요건을 규정한다.<\/p>\n<h4>제13조 전기추진설비 경보 (조종 장소에서 시청각 경보)<\/h4>\n<ol>\n<li>배터리의 사용이 불가한 경우<\/li>\n<li>배터리와 관련한 비상차단장치가 작동한 경우<\/li>\n<li>배터리의 온도가 과도하게 상승한 경우<\/li>\n<li>추진용 전동기에 최대로 허용된 전류와 토크 및 속도 등을 초과한 경우<\/li>\n<li>배터리 셀 간의 전압 불균형<\/li>\n<li>충전·방전의 실패<\/li>\n<li>환기 시스템의 고장<\/li>\n<li>냉각 시스템의 고장(해당되는 경우)<\/li>\n<li>에너지관리시스템, 전력변환장치, 배터리관리시스템 및 추진용 전동기의 고장<\/li>\n<li>잘못된 설정 값의 입력(해당되는 경우)<\/li>\n<\/ol>\n<p>경보는 성능에 지장을 받기 전에 작동해야 하며 배터리관리시스템(BMS)에 통합할 수 있다(제13조②).<\/p>\n<h4>배터리 배치와 요건<\/h4>\n<ul>\n<li><b>배터리실(제6조)<\/b>: 환기시스템 설치(제17조), <b>충돌격벽 전방 설치 금지<\/b>, 위험성평가 결과 가연성·폭발성 가스 발생 가능 시 배터리 외 전기설비는 방폭형.<\/li>\n<li><b>배치 세부(제7조)<\/b>: 배터리의 배치 및 요건은 고시 별표 1에 따른다.<\/li>\n<li><b>계통(제5조)<\/b>: 배터리부터 추진 전동기까지 2개 이상 계통으로 구성해 한 계통 고장 시에도 추진 유지(평수구역 여객선 등 예외). 단일 고장에도 조타·배수·소방·항해·무선·구명설비 정지 금지. 22.5° 동적 경사에서 작동.<\/li>\n<li><b>보호(제11조·제14조)<\/b>: 과전류·과전압·저전압·과열·절연파괴·전압 불균형·충전불가 시 독립 비상차단. 폐위 구역 IP44, 그 밖 IP55 이상.<\/li>\n<li><b>감시(제8조·제10조)<\/b>: EMS가 BMS 상위 제어기, 셀 전압·온도, 팩 전류, 가용 에너지, 배터리실 온도·환기·냉각 상태를 조종 장소에서 확인.<\/li>\n<li><b>소화·방화(제15조)<\/b>: 배터리실은 기관구역으로 취급, 연기탐지기(오작동 우려 시 열탐지기), 위험성평가로 소화재를 정한 고정식 소화장치, 필요 시 냉각용 물분사 추가, 5 kg 이상 휴대식 소화기 2개, 화재 감지 시 배터리 자동 정지(fail-safe).<\/li>\n<li><b>냉각(제16조)<\/b>: 강제 수냉 등으로 냉각, 냉각 고장 시에도 과열 방지.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">127-4-5<\/td><td>조종장소 경보 10가지<\/td><td>제13조 10개 정확히<\/td><\/tr>\n<tr><td class=\"num\">130-4-5<\/td><td>배터리 배치 및 요건<\/td><td>제5·6·11·14·15조 요지<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 127회형(경보 10가지)\">\n<h5>1. 근거<\/h5><p>해양수산부 고시 「전기추진 선박기준」 제13조: 선박을 조종하는 장소에서 보고 들을 수 있는 경보장치 설치.<\/p>\n<h5>2. 경보 10가지<\/h5><ol><li>배터리 사용 불가<\/li><li>배터리 관련 비상차단장치 작동<\/li><li>배터리 온도 과도 상승<\/li><li>추진 전동기 최대 허용 전류·토크·속도 초과<\/li><li>배터리 셀 간 전압 불균형<\/li><li>충전·방전 실패<\/li><li>환기 시스템 고장<\/li><li>냉각 시스템 고장(해당 시)<\/li><li>EMS·전력변환장치·BMS·추진 전동기 고장<\/li><li>잘못된 설정값 입력(해당 시)<\/li><\/ol>\n<h5>3. 관련 요건<\/h5><ul><li>경보는 성능 지장 전에 작동, BMS 통합 가능<\/li><li>비상차단(제11조): 과전류·과전압·저전압·과열·절연파괴·전압 불균형·충전 불가<\/li><li>배터리실(제6조): 환기, 충돌격벽 전방 금지, 가스 위험 시 방폭 / 소화(제15조): 기관구역 취급, 연기탐지, 고정식 소화<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 리튬 배터리 위험은 열폭주이므로 경보는 \"온도·전압 불균형·냉각·환기\"를 조기에 잡는 데 초점이 있음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"stern-tube","p":8,"n":"8.16","h":"선미관(Stern Tube)의 용도, 종류와 특성, 배치도 각부 명칭","t":"선미관(Stern Tube)의 용도, 종류와 특성, 배치도 각부 명칭","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 4교시 1번 · 25점","136회 4교시 5번 · 25점"],"q":["<b>118회(2019) 4-1<\/b> 선미관 배치도 ①~⑨ 각 부분의 명칭","<b>136회(2025) 4-5<\/b> 선미관(Stern Tube)의 용도 및 종류와 특성"],"k":"선미관은 프로펠러축이 선체를 관통하는 곳에 설치되어 축을 지지하는 베어링을 품고, 해수가 선내로 들어오거나 윤활유가 바다로 새는 것을 막는 장치다. 윤활 방식에 따라 유윤활식과 수윤활식으로 나뉜다.","x":"\n<p class=\"key\">선미관은 프로펠러축이 선체를 관통하는 곳에 설치되어 축을 지지하는 베어링을 품고, 해수가 선내로 들어오거나 윤활유가 바다로 새는 것을 막는 장치다. 윤활 방식에 따라 유윤활식과 수윤활식으로 나뉜다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 520 190\" role=\"img\" aria-label=\"선미관 배치도\">\n<path d=\"M60 40 L60 150\" class=\"ln\" style=\"stroke-width:3\"/>\n<rect x=\"100\" y=\"70\" width=\"300\" height=\"40\" class=\"fw\"/>\n<line x1=\"20\" y1=\"90\" x2=\"500\" y2=\"90\" class=\"ln2\" style=\"stroke-width:5\"/>\n<path d=\"M30 50 L48 90 L30 130\" class=\"fa\"/>\n<rect x=\"104\" y=\"74\" width=\"70\" height=\"32\" class=\"fr\"/><rect x=\"330\" y=\"74\" width=\"60\" height=\"32\" class=\"fr\"/>\n<rect x=\"84\" y=\"78\" width=\"16\" height=\"24\" class=\"fa\"/><rect x=\"400\" y=\"78\" width=\"16\" height=\"24\" class=\"fa\"/>\n<rect x=\"250\" y=\"20\" width=\"50\" height=\"22\" class=\"fw\"/><line x1=\"275\" y1=\"42\" x2=\"275\" y2=\"70\" class=\"ln\"/>\n<line x1=\"440\" y1=\"60\" x2=\"440\" y2=\"120\" class=\"ln\" style=\"stroke-width:3\"/>\n<g class=\"t2\">\n<text x=\"22\" y=\"160\">① 프로펠러<\/text><text x=\"60\" y=\"30\">② 선미재·보스<\/text><text x=\"76\" y=\"125\">③ 선미 씰(aft seal)<\/text>\n<text x=\"112\" y=\"66\">④ 선미 베어링<\/text><text x=\"200\" y=\"125\">⑤ 선미관<\/text><text x=\"330\" y=\"66\">⑥ 선수측 베어링<\/text>\n<text x=\"380\" y=\"140\">⑦ 선수 씰(fwd seal)<\/text><text x=\"242\" y=\"14\">⑧ 윤활유 중력탱크<\/text><text x=\"446\" y=\"56\">⑨ 선미 격벽<\/text>\n<\/g>\n<\/svg><figcaption>유윤활식 선미관의 일반 구성. 실제 문제 도면의 번호 순서에 맞춰 명칭을 붙인다.<\/figcaption><\/figure>\n<h4>용도<\/h4>\n<ul>\n<li>프로펠러축 지지(특히 프로펠러 중량과 유체력이 걸리는 선미 베어링).<\/li>\n<li>해수 유입 방지와 윤활유 유출 방지(씰).<\/li>\n<li>선미 격벽과 함께 선미관을 수밀 구역으로 감싼다(SOLAS: 선미관은 수밀 구획 내).<\/li>\n<\/ul>\n<h4>종류와 특성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>베어링<\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>유윤활식<\/td><td>화이트메탈, 윤활유 + 립씰(선미·선수)<\/td><td>마찰 작음, 고하중 대형선 표준, 베어링 수명 김<\/td><td>유류 유출 위험 → 환경 허용 윤활유(EAL, 미국 VGP), 에어씰(air seal) 보완<\/td><\/tr>\n<tr><td>수윤활식(개방형)<\/td><td>고무·합성수지(폴리머) 베어링, 해수 윤활<\/td><td>오일 유출 없음, 구조 단순<\/td><td>마모(모래), 축 슬리브 부식, 대형선 하중 한계<\/td><\/tr>\n<tr><td>수윤활식(폐쇄형)<\/td><td>청정수 순환<\/td><td>마모 감소, 무오염<\/td><td>순환계 추가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>선미 베어링은 축 처짐으로 뒤쪽 끝에 하중이 몰리므로 경사 보링(slope boring)과 축계 정렬 계산으로 접촉을 고르게 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-4-1<\/td><td>선미관 배치도 ①~⑨ 명칭<\/td><td>도면 번호 순서대로 명칭 + 기능 한 줄<\/td><\/tr>\n<tr><td class=\"num\">136-4-5<\/td><td>용도 및 종류와 특성<\/td><td>유윤활·수윤활 비교, 정렬<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 136회형\">\n<h5>1. 용도<\/h5><ul><li>프로펠러축 지지(선미 베어링에 최대 하중)<\/li><li>해수 유입·윤활유 유출 방지(씰)<\/li><li>선미 격벽과 함께 수밀 구역 구성<\/li><\/ul>\n<h5>2. 구성(배치도 명칭 문제 대비)<\/h5><p>프로펠러 – 선미재·보스 – 선미 씰 – 선미 베어링 – 선미관 – 선수측 베어링 – 선수 씰 – 윤활유 중력탱크 – 선미 격벽 (도면 번호 순으로 각 기능을 한 줄씩)<\/p>\n<h5>3. 종류와 특성<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>종류<\/th><th>특성<\/th><th>과제<\/th><\/tr><\/thead><tbody>\n<tr><td>유윤활<\/td><td>화이트메탈, 립씰, 대형선 표준<\/td><td>유출 → EAL(미국 VGP), 에어씰<\/td><\/tr>\n<tr><td>수윤활 개방형<\/td><td>고무·폴리머, 해수, 무오염<\/td><td>마모, 슬리브 부식<\/td><\/tr>\n<tr><td>수윤활 폐쇄형<\/td><td>청정수 순환<\/td><td>계통 추가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 설계 유의<\/h5><p>축 처짐으로 선미 베어링 후단 하중 집중 → 경사 보링, 축계 정렬 계산(냉·열간, 만재·밸러스트), 베어링 온도 감시.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 대형선 선미 베어링 손상의 주원인은 정렬 불량이므로, 선체 변형까지 고려한 정렬 계산과 잭업 검증이 핵심임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"shaft-bearings","p":8,"n":"8.17","h":"선박 추진축계 베어링의 종류별 용도와 특징","t":"선박 추진축계 베어링의 종류별 용도와 특징","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 5번 · 10점"],"q":["<b>139회(2026) 1-5<\/b> 선박 추진축계 베어링의 종류별 용도 및 특징"],"k":"추진축계 베어링은 축 중량과 프로펠러 하중을 받는 반경 방향 베어링(선미관 베어링, 중간축 베어링, 기관 메인 베어링)과 프로펠러 추력을 선체로 전달하는 추력 베어링으로 나뉜다. 모든 베어링 하중은 축계 정렬로 결정되므로 정렬 계산과 시공 관리가 핵심이다.","x":"\n<p class=\"key\">추진축계 베어링은 축 중량과 프로펠러 하중을 받는 반경 방향 베어링(선미관 베어링, 중간축 베어링, 기관 메인 베어링)과 프로펠러 추력을 선체로 전달하는 추력 베어링으로 나뉜다. 모든 베어링 하중은 축계 정렬로 결정되므로 정렬 계산과 시공 관리가 핵심이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>베어링<\/th><th>용도<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>선미관 선미 베어링<\/td><td>프로펠러 중량·유체력 지지<\/td><td>최대 하중, 화이트메탈 또는 폴리머, 경사 보링, 온도 감시<\/td><\/tr>\n<tr><td>선미관 선수 베어링<\/td><td>축 지지<\/td><td>하중 작음, 정렬 민감(무부하 위험)<\/td><\/tr>\n<tr><td>중간축 베어링<\/td><td>중간축 중량 지지<\/td><td>유욕·자기윤활 평베어링, 높이 조정으로 정렬, 하중 계측(잭업)<\/td><\/tr>\n<tr><td>추력 베어링<\/td><td>프로펠러 추력을 선체 기초로 전달<\/td><td>미첼(Michell) 경사 패드형, 저속 2행정은 기관에 내장<\/td><\/tr>\n<tr><td>기관 메인 베어링<\/td><td>크랭크축 지지<\/td><td>마지막 메인 베어링 하중이 축계 정렬로 크게 변함<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>축계 정렬<\/h4>\n<p>정렬 계산으로 냉간·열간, 만재·밸러스트(선체 처짐 변화) 상태의 베어링 반력이 모두 허용 범위 안에 들도록 각 베어링 높이를 정한다. 시공 후 잭업 시험으로 반력을 확인한다. 대형 컨테이너선·VLCC는 선체 변형이 커서 정렬 문제가 선미 베어링 손상의 주원인이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>베어링<\/th><th>용도<\/th><th>특징<\/th><\/tr><\/thead><tbody>\n<tr><td>선미관 선미 베어링<\/td><td>프로펠러 중량·유체력<\/td><td>최대 하중, 경사 보링<\/td><\/tr>\n<tr><td>선미관 선수 베어링<\/td><td>축 지지<\/td><td>무부하 위험<\/td><\/tr>\n<tr><td>중간축 베어링<\/td><td>중간축 지지<\/td><td>높이 조정, 잭업 계측<\/td><\/tr>\n<tr><td>추력 베어링<\/td><td>추력 → 선체 전달<\/td><td>미첼형, 2행정은 내장<\/td><\/tr>\n<tr><td>메인 베어링<\/td><td>크랭크축<\/td><td>정렬로 하중 변화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 모든 반력은 축계 정렬로 정해지므로 냉·열간, 만재·밸러스트 상태를 모두 검토해야 함.<\/p><\/div><\/section><\/details>"},{"id":"engine-room","p":8,"n":"8.18","h":"일반상선 기관실 구획길이 결정방법과 기관실 구획배치 시 고려사항","t":"일반상선 기관실 구획길이 결정방법과 기관실 구획배치 시 고려사항","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 4교시 3번 · 25점","130회 2교시 6번 · 25점"],"q":["<b>127회(2022) 4-3<\/b> 일반상선의 기관실 구획길이 결정방법","<b>130회(2023) 2-6<\/b> 화물선 기관실 구획배치 시 고려사항"],"k":"기관실 길이는 화물 공간을 잠식하므로 짧을수록 좋지만, 주기관·보기·축계·정비 공간과 규정 요건을 담아야 한다. 실적선 통계로 초기값을 잡고, 주기관 길이와 축계 위치에서 출발해 보기 배치를 반복 검토해 최소 길이를 확정한다.","x":"\n<p class=\"key\">기관실 길이는 화물 공간을 잠식하므로 짧을수록 좋지만, 주기관·보기·축계·정비 공간과 규정 요건을 담아야 한다. 실적선 통계로 초기값을 잡고, 주기관 길이와 축계 위치에서 출발해 보기 배치를 반복 검토해 최소 길이를 확정한다.<\/p>\n<h4>기관실 길이 결정 방법<\/h4>\n<ol>\n<li><b>초기 추정<\/b>: 실적선의 기관실 길이/L<sub>BP<\/sub> 비, 주기관 형식·출력 기준 통계.<\/li>\n<li><b>선미 경계<\/b>: 프로펠러 위치·선미 형상 → 선미관 길이 → 선미 격벽(aft peak bulkhead) 위치.<\/li>\n<li><b>주기관 배치<\/b>: 축 중심선에 맞춰 주기관 위치(선미 쪽으로 최대한), 기관 길이 + 선수측 정비 공간.<\/li>\n<li><b>보기 배치<\/b>: 발전기관, 청정기, 보일러, 펌프, 냉각기, 공기압축기, 탱크(연료·윤활·슬러지)를 층별 배치해 필요한 길이 확인.<\/li>\n<li><b>전방 격벽 확정<\/b>: 화물창 격벽과 정렬, 늑골 간격 정수배.<\/li>\n<li><b>검증<\/b>: 트림·종강도(기관실 중량 위치), 손상복원성(구획 길이), 연료탱크 보호 위치(MARPOL Reg.12A), 화물 용량.<\/li>\n<\/ol>\n<h4>구획배치 시 고려사항<\/h4>\n<ul>\n<li><b>정비<\/b>: 피스톤 인출 높이(기관실 크레인), 부품 반출 경로, 열교환기 튜브 인출 공간.<\/li>\n<li><b>안전<\/b>: 두 개의 탈출로(SOLAS II-2/13), A류 기관구역 방화, 청정기실 분리, 고온부 차폐, 연료 누설 방지(이중관).<\/li>\n<li><b>환기<\/b>: 연소용 공기와 냉각 환기량(ISO 8861), 흡·배기 위치.<\/li>\n<li><b>계통<\/b>: 해수 흡입구(고·저 씨체스트), 배관 경로 최소화, 케이블 경로, 기관제어실 위치(소음·시야).<\/li>\n<li><b>탱크<\/b>: 연료 서비스·세틀링 탱크 위치, 오버플로·드레인, 이중저 탱크 높이.<\/li>\n<li><b>규정 설비<\/b>: 비상발전기는 기관실 밖 격벽갑판 위, 조타기실, 비상 소화펌프 분리 배치.<\/li>\n<li><b>친환경 설비<\/b>: 스크러버·SCR·BWTS·LNG 연료준비실 공간, 향후 연료 전환 대비 공간.<\/li>\n<li><b>소음·진동, 중량 분포<\/b>: 거주구와의 관계, 트림 영향.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">127-4-3<\/td><td>기관실 구획길이 결정방법<\/td><td>절차(통계 → 선미 경계 → 주기 → 보기 → 검증)<\/td><\/tr>\n<tr><td class=\"num\">130-2-6<\/td><td>기관실 구획배치 시 고려사항<\/td><td>정비·안전·환기·계통·탱크·규정 설비<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 127회형\">\n<h5>1. 개요<\/h5><p>기관실이 길면 화물 공간이 줄므로, 필요한 기기·정비 공간·규정 요건을 담는 최소 길이를 찾는 것이 목표임.<\/p>\n<h5>2. 결정 방법<\/h5><ol><li>초기 추정: 실적선 기관실 길이/L<sub>BP<\/sub>, 기관 형식·출력 통계<\/li><li>선미 경계: 프로펠러 위치 → 선미관 길이 → 선미 격벽<\/li><li>주기관: 축 중심선 정렬, 가능한 한 선미 쪽, 기관 길이 + 정비 공간<\/li><li>보기: 발전기·청정기·보일러·펌프·탱크 층별 배치로 필요 길이<\/li><li>전방 격벽: 늑골 간격 정수배, 화물창 격벽 정렬<\/li><li>검증: 트림·종강도, 손상복원성, 연료탱크 보호 위치(MARPOL Reg.12A), 화물 용량<\/li><\/ol>\n<h5>3. 배치 고려사항(130회 대비 요약)<\/h5><p>정비(피스톤 인출 높이·반출 경로), 안전(탈출로 2개, 청정기실 분리, 고온부 차폐), 환기(ISO 8861), 해수 흡입구, 비상발전기 기관실 밖, 스크러버·SCR·BWTS·LNG 연료준비실 공간.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 기관실 길이 1 m 단축은 수명 기간 화물 수익으로 이어지므로, 3D 배치 반복 검토로 최소화하되 정비성은 희생하지 않아야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"central-cooling","p":8,"n":"8.19","h":"중앙청수냉각시스템(Central Fresh Water Cooling System) 설계방법","t":"중앙청수냉각시스템(Central Fresh Water Cooling System) 설계방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 4교시 4번 · 25점"],"q":["<b>127회(2022) 4-4<\/b> 중앙청수냉각시스템 설계방법"],"k":"중앙청수냉각은 해수를 중앙냉각기(판형 열교환기)에만 보내고, 기관실의 모든 냉각 수요는 청수 회로로 처리하는 방식이다. 해수 배관을 최소화해 부식·오손 정비를 줄인다. 설계는 열부하 산정 → 온도 수준 설정 → 펌프·냉각기 용량과 이중화 → 제어·팽창탱크 순으로 한다.","x":"\n<p class=\"key\">중앙청수냉각은 해수를 중앙냉각기(판형 열교환기)에만 보내고, 기관실의 모든 냉각 수요는 청수 회로로 처리하는 방식이다. 해수 배관을 최소화해 부식·오손 정비를 줄인다. 설계는 열부하 산정 → 온도 수준 설정 → 펌프·냉각기 용량과 이중화 → 제어·팽창탱크 순으로 한다.<\/p>\n<h4>계통 구성<\/h4>\n<ul>\n<li>해수 회로: 씨체스트 → 해수 펌프 → 중앙냉각기(티타늄 판) → 선외.<\/li>\n<li>저온(LT) 청수 회로: 공급 약 36 °C. 공기냉각기, 윤활유 냉각기, 발전기관, 공기압축기, 공조 응축기 등.<\/li>\n<li>고온(HT) 청수 회로: 재킷 냉각 약 80~90 °C, 3방향 온도조절밸브로 LT와 혼합. 조수기 열원.<\/li>\n<\/ul>\n<h4>설계 절차<\/h4>\n<ol>\n<li><b>열부하 산정<\/b>: 기관 제작사 열수지, 보기 열부하를 설계 조건(열대 해수 32 °C, 기관실 공기 45 °C 수준)에서 합산.<\/li>\n<li><b>온도·유량 결정<\/b>: 각 소비처 입출구 온도로 유량 산정(Q = ṁ·c<sub>p<\/sub>·ΔT).<\/li>\n<li><b>펌프<\/b>: 해수·LT·HT 펌프 용량(여유 포함), 양정은 배관 압력손실 계산. 2 × 100% 또는 3 × 50% 이중화.<\/li>\n<li><b>중앙냉각기<\/b>: 2 × 100%(또는 3 × 50%), 오손계수 여유, 티타늄 판.<\/li>\n<li><b>제어<\/b>: LT 온도 제어 3방향 밸브, 해수 펌프 인버터(해수 온도 낮으면 유량 감소).<\/li>\n<li><b>팽창탱크<\/b>: 회로 최고점 위에 두어 정압 확보, 기포 제거, 보충수·수처리 약품 투입.<\/li>\n<li><b>재료<\/b>: 해수관 Cu-Ni·GRP·라이닝 강관, 청수관 강관. 씨체스트 MGPS.<\/li>\n<\/ol>\n<h4>장단점<\/h4>\n<p>장점: 해수계 부식·오손 축소, 열교환기 정비 집중, 온도 제어 안정. 단점: 열교환 단계 추가로 LT 온도가 해수보다 높고 초기비 증가.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>해수는 중앙냉각기에만 보내고 기관실 냉각 수요는 청수(LT·HT) 회로로 처리하는 방식. 해수 배관 최소화로 부식·오손 정비 감소.<\/p>\n<h5>2. 계통<\/h5><div class=\"calc\">해수: 씨체스트 → 해수펌프 → 중앙냉각기(Ti 판형) → 선외\nLT(약 36 °C): 공기냉각기·윤활유냉각기·발전기·압축기·공조\nHT(약 80~90 °C): 재킷 냉각, 3방향 밸브로 LT 혼합, 조수기 열원<\/div>\n<h5>3. 설계 절차<\/h5><ol><li>열부하: 제작사 열수지, 설계 조건(해수 32 °C, 기관실 45 °C)<\/li><li>유량: Q = ṁ·c<sub>p<\/sub>·ΔT<\/li><li>펌프: 용량(여유), 양정(압력손실), 2×100% 또는 3×50%<\/li><li>중앙냉각기: 2×100%, 오손계수 여유<\/li><li>제어: 3방향 온도조절밸브, 해수펌프 인버터<\/li><li>팽창탱크: 최고점 위, 정압·기포 제거·수처리<\/li><li>재료: 해수관 Cu-Ni·GRP, MGPS<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 해수 온도 변화가 큰 항로에서는 해수펌프 인버터 제어로 큰 전력 절감이 가능하므로 설계 단계에서 함께 반영해야 함.<\/p><\/div><\/section><\/details>"},{"id":"aux-boiler","p":8,"n":"8.20","h":"105,000 DWT 유조선 보조보일러 용량 결정방법","t":"105,000 DWT 유조선 보조보일러 용량 결정방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 4번 · 25점"],"q":["<b>127회(2022) 3-4<\/b> 105,000 DWT Tanker 보조보일러 용량 결정방법"],"k":"보조보일러 용량은 운항 모드별 증기 수요를 합산해 가장 큰 모드를 기준으로 정한다. 증기터빈 구동 화물펌프를 쓰는 유조선은 양하(discharging) 모드가 결정 조건이며, 같은 시간대의 화물 가열·불활성가스(IGS)·연료 가열 수요를 동시계수와 함께 더한다.","x":"\n<p class=\"key\">보조보일러 용량은 운항 모드별 증기 수요를 합산해 가장 큰 모드를 기준으로 정한다. 증기터빈 구동 화물펌프를 쓰는 유조선은 양하(discharging) 모드가 결정 조건이며, 같은 시간대의 화물 가열·불활성가스(IGS)·연료 가열 수요를 동시계수와 함께 더한다.<\/p>\n<h4>증기 소비처<\/h4>\n<ul>\n<li>화물펌프 터빈(3대) — 최대 소비처.<\/li>\n<li>밸러스트 펌프 터빈(증기 구동인 경우), 탱크세정 펌프·세정수 가열.<\/li>\n<li>화물 가열(고점도 원유 온도 유지): 탱크 경계 열손실(해수·외기 온도, 열관류율) 기반 계산.<\/li>\n<li>연료유 가열(저장·세틀링·서비스 탱크, 청정기 히터), 윤활유 가열.<\/li>\n<li>거주구 난방·조리·온수, 기관실 기타.<\/li>\n<li>보일러 배기가스는 IGS 공급원(SOLAS: IGS 용량 ≥ 화물펌프 최대 양하율의 125%).<\/li>\n<\/ul>\n<h4>결정 절차<\/h4>\n<ol>\n<li>모드 정의: 항해, 항해 중 화물 가열, 양하(+가열+IGS), 탱크 세정, 정박.<\/li>\n<li>모드별 소비처 증기량 × 동시계수 합산.<\/li>\n<li>항해 중은 배기가스 이코노마이저 증기를 차감.<\/li>\n<li>최대 모드 수요 + 여유(대략 10~20%) → 보일러 대수·용량(대개 2기 구성, 1기 고장 시 필수 수요 확보).<\/li>\n<li>증기압(포화 약 16~18 bar), 급수·복수기(터빈 배기 진공 복수기), 연소 연료·배출(Tier, SOx) 검토.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>보일러 용량은 운항 모드별 증기 수요의 최대값으로 정하며, 증기 터빈 화물펌프 유조선은 양하 모드가 결정 조건임.<\/p>\n<h5>2. 증기 소비처<\/h5><ul><li>화물펌프 터빈(3대) — 최대<\/li><li>밸러스트·탱크세정 펌프, 세정수 가열<\/li><li>화물 가열(탱크 경계 열손실 계산)<\/li><li>연료유·윤활유 가열, 거주구 난방<\/li><li>보일러 배기 = IGS 공급원(IGS 용량 ≥ 화물펌프 최대 양하율의 125%)<\/li><\/ul>\n<h5>3. 결정 절차<\/h5><ol><li>모드: 항해, 항해 중 가열, 양하(+가열+IGS), 탱크세정, 정박<\/li><li>모드별 소비량 × 동시계수 합산<\/li><li>항해 중 이코노마이저 증기 차감<\/li><li>최대 모드 + 여유(10~20%) → 대수·용량(대개 2기, 1기 고장 시 필수 수요)<\/li><li>증기압·급수·복수기·배출 검토<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 양하 시간이 보일러 용량을 정하므로, 전동 딥웰 펌프 채택 여부가 보일러 크기를 크게 바꾸는 설계 분기점임.<\/p><\/div><\/section><\/details>"},{"id":"carryover","p":8,"n":"8.21","h":"보일러의 캐리오버(Carry Over) 현상","t":"보일러의 캐리오버(Carry Over) 현상","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 8번 · 10점"],"q":["<b>121회(2020) 1-8<\/b> 보일러의 캐리오버(carry over) 현상"],"k":"캐리오버는 보일러 수가 물방울이나 거품 형태로 증기에 섞여 나가는 현상이다. 물에 녹아 있던 고형분이 과열기·터빈·증기 배관에 쌓이고, 수격(water hammer)과 부식을 일으킨다.","x":"\n<p class=\"key\">캐리오버는 보일러 수가 물방울이나 거품 형태로 증기에 섞여 나가는 현상이다. 물에 녹아 있던 고형분이 과열기·터빈·증기 배관에 쌓이고, 수격(water hammer)과 부식을 일으킨다.<\/p>\n<ul>\n<li><b>원인<\/b>: 고수위, 보일러수 고농도(TDS·알칼리도 과대)에 의한 포밍, 유분 혼입, 급격한 부하 증가(압력 강하로 수위 팽창, swelling), 기수분리기 불량.<\/li>\n<li><b>영향<\/b>: 과열기 관 과열·파열, 터빈 날개 스케일·침식, 배관 수격, 증기 품질 저하.<\/li>\n<li><b>대책<\/b>: 적정 수위 유지와 제어, 표면·저부 분출(blowdown)로 농도 관리, 급수 처리(약품, TDS 한도), 기름 혼입 방지(관찰 탱크), 급격한 부하 변동 회피, 기수분리기 정비.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>보일러수가 물방울·거품으로 증기에 섞여 나가는 현상.<\/p>\n<h5>2. 원인<\/h5><p>고수위, 보일러수 고농도(TDS·알칼리도)에 의한 포밍, 유분 혼입, 급격한 부하 증가(swelling), 기수분리기 불량.<\/p>\n<h5>3. 영향<\/h5><p>과열기·터빈 스케일·침식, 수격, 증기 품질 저하.<\/p>\n<h5>4. 대책<\/h5><p>수위 제어, 표면·저부 분출, 급수 처리, 유분 혼입 방지, 부하 변동 완화, 기수분리기 정비.<\/p><\/div><\/section><\/details>"},{"id":"soot-blower","p":8,"n":"8.22","h":"수트블로워(Soot Blower)의 목적","t":"수트블로워(Soot Blower)의 목적","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 1교시 9번 · 10점"],"q":["<b>136회(2025) 1-9<\/b> 수트블로워(Soot Blower)의 목적"],"k":"수트블로워는 보일러와 배기가스 이코노마이저 전열관 외면(가스 측)에 쌓인 매연을 증기·압축공기 분사로 불어내는 장치다. 전열 효율을 유지하고 배압 상승과 매연 화재를 막는다.","x":"\n<p class=\"key\">수트블로워는 보일러와 배기가스 이코노마이저 전열관 외면(가스 측)에 쌓인 매연을 증기·압축공기 분사로 불어내는 장치다. 전열 효율을 유지하고 배압 상승과 매연 화재를 막는다.<\/p>\n<ul>\n<li><b>전열 유지<\/b>: 매연층은 단열재 역할을 해 증기 생산 감소, 배기온도 상승.<\/li>\n<li><b>배압 관리<\/b>: 가스 측 압력손실 증가는 주기관 배압과 과급기 효율을 떨어뜨린다.<\/li>\n<li><b>화재 방지<\/b>: 저부하(저속 운항)에서 기름기 많은 매연이 쌓여 이코노마이저 매연 화재·관 소손 사고 위험.<\/li>\n<li><b>부식 방지<\/b>: 황 성분 매연이 습기와 만나 산성 부식.<\/li>\n<li>방식: 회전식, 인출식 랜스, 음파식(sonic horn), 정지 중 수세. 고부하·정상 가스 유량에서 정기 실시.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>보일러·배기 이코노마이저 전열관 가스 측 매연을 증기·압축공기로 불어내는 장치.<\/p>\n<h5>2. 목적<\/h5><ol><li>전열 효율 유지(매연 단열 → 증기 감소·배기온도 상승)<\/li><li>배압 관리(주기 배압·과급기 효율)<\/li><li>매연 화재 방지(저속 운항 시 이코노마이저 화재)<\/li><li>산성 부식 방지<\/li><\/ol>\n<p class=\"concl\"><b>3. 의견<\/b>: 고부하에서 정기 실시하고, 저속 운항 비중이 크면 주기를 늘려야 함.<\/p><\/div><\/section><\/details>"},{"id":"refrigeration","p":8,"n":"8.23","h":"프레온 냉매 냉동기의 냉동사이클과 T-s 선도","t":"프레온 냉매 냉동기의 냉동사이클과 T-s 선도","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 4교시 6번 · 25점"],"q":["<b>121회(2020) 4-6<\/b> 프레온 냉동기의 냉동사이클과 T-s 선도"],"k":"증기압축 냉동사이클은 압축(1→2), 응축(2→3), 팽창(3→4, 교축), 증발(4→1)의 네 과정으로 저온부의 열을 고온부로 퍼낸다. 성적계수 COP = (h₁ − h₄)/(h₂ − h₁)이다.","x":"\n<p class=\"key\">증기압축 냉동사이클은 압축(1→2), 응축(2→3), 팽창(3→4, 교축), 증발(4→1)의 네 과정으로 저온부의 열을 고온부로 퍼낸다. 성적계수 COP = (h₁ − h₄)/(h₂ − h₁)이다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 240\" role=\"img\" aria-label=\"냉동사이클 T-s 선도\">\n<line x1=\"50\" y1=\"210\" x2=\"400\" y2=\"210\" class=\"ln\"/><line x1=\"50\" y1=\"210\" x2=\"50\" y2=\"20\" class=\"ln\"/>\n<path d=\"M90 205 C 130 60, 250 40, 330 205\" class=\"lg\" style=\"stroke:var(--muted);stroke-dasharray:none\"/>\n<path d=\"M140 160 L292 160\" class=\"ln2\"/><path d=\"M292 160 L300 70\" class=\"lr\"/><path d=\"M300 70 C 270 74, 250 82, 236 86 L130 86\" class=\"lr\"/><path d=\"M130 86 L150 160\" class=\"lg\" style=\"stroke:var(--ink)\"/>\n<circle cx=\"292\" cy=\"160\" r=\"3\" class=\"dot\"/><circle cx=\"300\" cy=\"70\" r=\"3\" class=\"dot\"/><circle cx=\"130\" cy=\"86\" r=\"3\" class=\"dot\"/><circle cx=\"148\" cy=\"160\" r=\"3\" class=\"dot\"/>\n<text x=\"296\" y=\"176\" class=\"t1\">1<\/text><text x=\"304\" y=\"66\" class=\"t1\">2<\/text><text x=\"116\" y=\"84\" class=\"t1\">3<\/text><text x=\"136\" y=\"176\" class=\"t1\">4<\/text>\n<text x=\"190\" y=\"152\" class=\"tn\">증발(흡열)<\/text><text x=\"170\" y=\"80\" class=\"tr\">응축(방열)<\/text><text x=\"304\" y=\"120\" class=\"t2\">압축<\/text><text x=\"78\" y=\"128\" class=\"t2\">팽창(교축)<\/text>\n<text x=\"380\" y=\"226\" class=\"t2\">s<\/text><text x=\"34\" y=\"28\" class=\"t2\">T<\/text><text x=\"180\" y=\"40\" class=\"t2\">포화선<\/text>\n<\/svg><\/figure>\n<ol>\n<li><b>1→2 압축<\/b>: 증발기에서 나온 포화(또는 약간 과열) 증기를 압축기로 단열 압축 → 고온·고압 과열증기.<\/li>\n<li><b>2→3 응축<\/b>: 응축기에서 정압 방열(과열 제거 → 응축), 해수·청수로 냉각, 고압 액체.<\/li>\n<li><b>3→4 팽창<\/b>: 팽창밸브에서 교축(등엔탈피), 압력·온도 강하, 일부 증발(습증기).<\/li>\n<li><b>4→1 증발<\/b>: 증발기에서 저압 정압 증발하며 냉장실·공기에서 열 흡수.<\/li>\n<\/ol>\n<p>선박 용도: 식료품 냉동고(약 −20 °C 육·어류, +2~4 °C 채소), 공조, 냉동 컨테이너. 냉매는 오존층 파괴 물질 사용이 MARPOL VI Reg.12로 금지되었고(HCFC 신규 설치 2020년부터 금지), 고GWP HFC도 대체(R449A, R1234ze, CO₂, NH₃) 추세다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>증기압축 냉동사이클은 냉매의 증발·응축으로 저온부 열을 고온부로 퍼냄.<\/p>\n<h5>2. 사이클(T-s 선도에 1~4 표시)<\/h5><ol><li>1→2 압축: 포화증기 단열 압축 → 고온·고압 과열증기<\/li><li>2→3 응축: 정압 방열(과열 제거 → 응축), 해수·청수 냉각<\/li><li>3→4 팽창: 팽창밸브 교축(등엔탈피), 습증기<\/li><li>4→1 증발: 저압 정압 증발, 냉장실 열 흡수<\/li><\/ol>\n<div class=\"calc\">COP = (h₁ − h₄) / (h₂ − h₁)<\/div>\n<h5>3. 선박 적용·냉매<\/h5><ul><li>식료품 냉동(−20 °C)·냉장(+2~4 °C), 공조, 냉동 컨테이너<\/li><li>MARPOL VI Reg.12: 오존층 파괴 물질 금지(HCFC 2020~), 저GWP 대체(R449A, CO₂, NH₃)<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: T-s 선도의 포화선과 네 과정을 정확히 그리고, 냉매 규제 동향을 결론에 연결하는 것이 득점 포인트임.<\/p><\/div><\/section><\/details>"},{"id":"critical-point","p":8,"n":"8.24","h":"임계압력, 임계온도, 임계점","t":"임계압력, 임계온도, 임계점","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 7번 · 10점"],"q":["<b>121회(2020) 1-7<\/b> 임계압력, 임계온도, 임계점"],"k":"임계점은 액체와 기체의 구분이 사라지는 상태점이다. 임계온도보다 높으면 압력을 아무리 높여도 액화되지 않고, 임계압력은 임계온도에서의 포화증기압이다. 선박의 가스 화물 저장 방식(냉각 또는 가압)이 이 값으로 정해진다.","x":"\n<p class=\"key\">임계점은 액체와 기체의 구분이 사라지는 상태점이다. 임계온도보다 높으면 압력을 아무리 높여도 액화되지 않고, 임계압력은 임계온도에서의 포화증기압이다. 선박의 가스 화물 저장 방식(냉각 또는 가압)이 이 값으로 정해진다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>물질<\/th><th class=\"num\">임계온도<\/th><th class=\"num\">임계압력<\/th><th>선박 저장 방식<\/th><\/tr><\/thead><tbody>\n<tr><td>물<\/td><td class=\"num\">374 °C<\/td><td class=\"num\">22.1 MPa<\/td><td>초임계 보일러<\/td><\/tr>\n<tr><td>메탄(LNG)<\/td><td class=\"num\">−82.6 °C<\/td><td class=\"num\">4.6 MPa<\/td><td>상온 가압 액화 불가 → −162 °C 냉각 저장<\/td><\/tr>\n<tr><td>프로판(LPG)<\/td><td class=\"num\">96.7 °C<\/td><td class=\"num\">4.25 MPa<\/td><td>상온 가압(Type C) 또는 냉각<\/td><\/tr>\n<tr><td>암모니아<\/td><td class=\"num\">132.4 °C<\/td><td class=\"num\">11.3 MPa<\/td><td>가압 또는 −33 °C 냉각<\/td><\/tr>\n<tr><td>CO₂<\/td><td class=\"num\">31.0 °C<\/td><td class=\"num\">7.38 MPa<\/td><td>임계온도 이하·삼중점(5.18 bar) 이상 압력에서 액체 운송<\/td><\/tr>\n<tr><td>수소<\/td><td class=\"num\">−240 °C<\/td><td class=\"num\">1.3 MPa<\/td><td>−253 °C 극저온 액화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>초임계 상태(임계점 초과)는 밀도는 액체에 가깝고 점도는 기체에 가까워, 발전 보일러 효율 향상과 CO₂ 파이프라인 수송에 이용된다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>임계점: 액체·기체 구분이 사라지는 상태점. 임계온도 이상에서는 가압만으로 액화 불가. 임계압력 = 임계온도의 포화증기압.<\/p>\n<div class=\"calc\">메탄 −82.6 °C/4.6 MPa → 상온 가압 액화 불가 → −162 °C 냉각 저장\n프로판 96.7 °C/4.25 MPa → 상온 가압 저장(Type C)\nCO₂ 31.0 °C/7.38 MPa → 임계온도 이하·삼중점 5.18 bar 이상에서 액체 운송<\/div>\n<p class=\"concl\"><b>2. 의견<\/b>: 임계온도가 가스 화물의 저장 방식(냉각 vs 가압)을 결정함.<\/p><\/div><\/section><\/details>"},{"id":"equipment-number","p":9,"n":"9.1","h":"의장수(Equipment Number): 산출식, 계산 목적, 계선·계류장치","t":"의장수(Equipment Number): 산출식, 계산 목적, 계선·계류장치","c":3,"r":1,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 3번 · 10점","121회 4교시 3번 · 25점","133회 1교시 1번 · 10점"],"q":["<b>112회(2017) 1-3<\/b> 선박의 의장수(Equipment Number)의 개념과 활용","<b>121회(2020) 4-3<\/b> 의장수 계산목적과 계선·계류장치","<b>133회(2024) 1-1<\/b> 의장수 산출식과 의장수"],"k":"의장수는 선박이 정박 중 받는 바람·조류 하중의 크기를 나타내는 지표로, IACS UR A1의 EN = Δ⅔ + 2·B·h + 0.1·A로 계산한다. EN으로 규칙 표에서 앵커 수·중량, 앵커 체인 지름·길이를 정한다.","x":"\n<p class=\"key\">의장수는 선박이 정박 중 받는 바람·조류 하중의 크기를 나타내는 지표로, IACS UR A1의 EN = Δ<sup>⅔<\/sup> + 2·B·h + 0.1·A로 계산한다. EN으로 규칙 표에서 앵커 수·중량, 앵커 체인 지름·길이를 정한다.<\/p>\n<h4>산출식 (IACS UR A1)<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[\\mathrm{EN}=\\Delta^{2/3}+2\\,B\\,h+0.1\\,A\\]<\/div><span class=\"c\">Δ: 하기 만재흘수선에서의 형배수량[t] (수중 투영면적 대용, 조류 하중), B: 형폭[m], h = a + Σh<sub>i<\/sub>: 하기 만재흘수선에서 최상층 선루 정부까지 유효 높이(a: 선체 중앙 건현, h<sub>i<\/sub>: 폭이 B/4를 넘는 각 층 갑판실 높이), A: 하기 만재흘수선 위 L 범위 측면 투영면적[m²](폭 B/4 초과 선루·갑판실 포함)<\/span><\/div>\n<ul>\n<li>Δ<sup>⅔<\/sup> 항: 수면 아래 면적 → 조류력.<\/li>\n<li>2·B·h 항: 정면 풍압 면적(선수 방향 바람). 2는 정면 형상계수 보정.<\/li>\n<li>0.1·A 항: 측면 풍압 면적(선수각 변동 시 측풍 성분).<\/li>\n<li>설계 기준 조건: 차폐 수역, 풍속 25 m/s, 조류 2.5 m/s, 체인 신출비(scope) 6~10. 파랑이 큰 외해 정박은 별도 고려.<\/li>\n<\/ul>\n<h4>계산 목적과 활용<\/h4>\n<ul>\n<li>EN 구간별 규칙 표에서: 선수 앵커 2개의 중량, 스터드 체인 총 길이와 지름(등급 U1·U2·U3별).<\/li>\n<li>예인·계류줄 권고(IACS Rec. 10, 최근 개정은 풍압 기반 설계 파단하중 MBL<sub>SD<\/sub> 방식으로 계류줄을 정한다).<\/li>\n<li>양묘기 용량, 체인 로커 용적, 호스파이프 크기 결정의 기준.<\/li>\n<li>선급 부호(장비 기호, 예: equipment letter)로 표시.<\/li>\n<\/ul>\n<h4>계선·계류장치<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장치<\/th><th>기능<\/th><\/tr><\/thead><tbody>\n<tr><td>앵커(스톡리스, 고파지력 HHP)<\/td><td>해저에 박혀 파지력 발생<\/td><\/tr>\n<tr><td>앵커 체인(스터드 링크)<\/td><td>앵커와 선체 연결, 자중이 현수선 형상으로 충격 흡수<\/td><\/tr>\n<tr><td>양묘기(windlass)<\/td><td>체인 휠로 체인 감기·풀기, 브레이크(체인 파단하중 45% 유지)<\/td><\/tr>\n<tr><td>체인 스토퍼<\/td><td>정박 중 체인 하중을 양묘기 대신 선체로 전달(파단하중 80% 유지)<\/td><\/tr>\n<tr><td>호스파이프·앵커 포켓·체인 로커·비터 엔드<\/td><td>체인 통로·수납, 체인 끝단 비상 해제<\/td><\/tr>\n<tr><td>계류 윈치(자동 장력), 캡스턴<\/td><td>계류줄 감기·장력 유지<\/td><\/tr>\n<tr><td>볼라드·비트, 페어리드·쵸크(파나마 쵸크), 롤러<\/td><td>계류줄 고정·유도<\/td><\/tr>\n<tr><td>계류줄(HMPE, 나일론, 와이어)<\/td><td>안벽 고정<\/td><\/tr>\n<tr><td>비상예인설비(ETA)<\/td><td>20,000 DWT 이상 유조선 등 SOLAS II-1/3-4<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>계류 설비의 선체 지지 구조는 IACS UR A2와 MSC.1/Circ.1175 개정 지침에 따라 설계하중(SWL)을 정하고 보강한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-1-3<\/td><td>개념과 활용<\/td><td class=\"num\">10<\/td><td>식의 각 항 의미, 결정되는 장비<\/td><\/tr>\n<tr><td class=\"num\">121-4-3<\/td><td>계산목적과 계선·계류장치<\/td><td class=\"num\">25<\/td><td>설계 조건, 장비 목록과 강도 기준<\/td><\/tr>\n<tr><td class=\"num\">133-1-1<\/td><td>산출식<\/td><td class=\"num\">10<\/td><td>식 + 수치 예제<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 133회형(산출식)\">\n<h5>1. 정의<\/h5>\n<p>의장수(EN): 정박 중 바람·조류 하중의 크기를 나타내는 지표로, 앵커·체인 규격 결정에 사용(IACS UR A1).<\/p>\n<h5>2. 산출식<\/h5>\n<div class=\"calc\">EN = Δ^(2/3) + 2·B·h + 0.1·A\nΔ^(2/3): 수면 아래 면적 대용 → 조류력\n2·B·h : 정면 풍압 면적(h = 건현 a + 폭 B/4 초과 갑판실 높이 합)\n0.1·A : 측면 풍압 면적(하기 만재흘수선 위 L 범위)<\/div>\n<h5>3. 예제(울트라막스급)<\/h5>\n<div class=\"calc\">Δ = 75,000 t → Δ^(2/3) = 1,778\nB = 32.26 m, h = 6.0 + 14.0 = 20.0 m → 2Bh = 1,290\nA = 225×6.0 + 25×14 = 1,700 m² → 0.1A = 170\nEN ≈ 3,239 → 규칙 표의 해당 구간에서 앵커 중량·체인 지름·길이 결정<\/div>\n<p class=\"concl\"><b>4. 의견<\/b>: 흘수·건현·갑판실 변경 시 EN 구간이 바뀌어 장비가 달라질 수 있으므로 설계 변경 때 재확인해야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 121회형(계산목적·계선계류장치)\">\n<h5>1. 개요<\/h5>\n<p>의장수는 정박 설비 규격을 정하는 기준값이며, 설계 기준 조건은 차폐 수역·풍속 25 m/s·조류 2.5 m/s·체인 신출비 6~10임.<\/p>\n<h5>2. 계산 목적<\/h5>\n<ol><li>선수 앵커 2개 중량, 스터드 체인 지름(U1~U3 등급)·총 길이 결정<\/li>\n<li>양묘기 용량, 체인 로커 용적, 호스파이프 크기 결정<\/li>\n<li>예인·계류줄 권고(IACS Rec.10)의 기준<\/li><\/ol>\n<h5>3. 산출식과 각 항<\/h5>\n<div class=\"calc\">EN = Δ^(2/3) + 2Bh + 0.1A  (각 항 의미는 10점 답안과 동일)<\/div>\n<h5>4. 계선·계류장치<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장치<\/th><th>기능·기준<\/th><\/tr><\/thead><tbody>\n<tr><td>앵커·체인<\/td><td>파지력, 체인 자중의 현수선 효과<\/td><\/tr>\n<tr><td>양묘기<\/td><td>브레이크: 체인 파단하중 45% 유지, 양묘 속도 평균 9 m/min 이상<\/td><\/tr>\n<tr><td>체인 스토퍼<\/td><td>체인 파단하중 80% 유지<\/td><\/tr>\n<tr><td>계류 윈치·볼라드·페어리드·쵸크<\/td><td>계류줄 장력 지지, 지지 구조는 UR A2·MSC.1/Circ.1175 SWL 기준<\/td><\/tr>\n<tr><td>호스파이프·앵커 포켓·체인 로커<\/td><td>앵커 안착(목업 시험), 체인 수납, 비터 엔드 비상 해제<\/td><\/tr>\n<tr><td>비상예인설비<\/td><td>20,000 DWT 이상 유조선 등(SOLAS II-1/3-4)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>5. 결론<\/b>: EN은 차폐 수역 조건 기준이므로 외해 정박이 잦은 선박은 별도 검토가 필요하며, 계류 설비 지지 구조는 선체 보강과 함께 설계해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"container-lashing","p":9,"n":"9.2","h":"컨테이너 고박장치: 로드식 고박 속구와 래싱 브리지(Lashing Bridge)","t":"컨테이너 고박장치: 로드식 고박 속구와 래싱 브리지(Lashing Bridge)","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 1번 · 25점","121회 1교시 9번 · 10점"],"q":["<b>112회(2017) 3-1<\/b> 폭로부 컨테이너 고박장치 중 로드(Rod)식 고박장치의 속구","<b>121회(2020) 1-9<\/b> Lashing bridge"],"k":"갑판 컨테이너는 하단을 소켓·트위스트록으로 고정하고 단과 단을 트위스트록으로 연결한 뒤, 래싱 로드와 턴버클로 대각 고박해 횡동요 관성력에 의한 래킹·전도·들림을 막는다. 래싱 브리지는 고박 지점을 위로 올려 상단 컨테이너까지 로드로 묶을 수 있게 하는 갑판 구조물이다.","x":"\n<p class=\"key\">갑판 컨테이너는 하단을 소켓·트위스트록으로 고정하고 단과 단을 트위스트록으로 연결한 뒤, 래싱 로드와 턴버클로 대각 고박해 횡동요 관성력에 의한 래킹·전도·들림을 막는다. 래싱 브리지는 고박 지점을 위로 올려 상단 컨테이너까지 로드로 묶을 수 있게 하는 갑판 구조물이다.<\/p>\n<h4>로드식 고박 속구<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>속구<\/th><th>기능<\/th><\/tr><\/thead><tbody>\n<tr><td>래싱 로드(장·단)<\/td><td>컨테이너 코너 캐스팅과 갑판(또는 래싱 브리지) 아이를 대각으로 연결<\/td><\/tr>
