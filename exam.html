d><td>좌굴·피로 별도 확인<\/td><\/tr>\n<tr><td>하중 감소<\/td><td>탱크·화물창 배치 변경, 밸러스트 배분<\/td><td>SWBM 감소<\/td><\/tr>\n<tr><td>하중 감소<\/td><td>격창 적재 제한 등 적재지침<\/td><td>상업성 저하<\/td><\/tr>\n<tr><td>전단<\/td><td>격벽 부근 선측외판·종격벽 국부 증후<\/td><td>τ 최대 위치<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 단면 보강은 중량을, 적재 제한은 상업성을 희생하므로, 기본설계 단계에서 형깊이와 탱크 배치로 해결하는 것이 가장 경제적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"effective-breadth","p":3,"n":"3.3","h":"판 유효폭(Effective Breadth)의 정의","t":"판 유효폭(Effective Breadth)의 정의","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 8번 · 10점"],"q":["<b>118회(2019) 1-8<\/b> 판 유효폭의 정의"],"k":"유효폭은 실제로는 폭 방향으로 불균일한 판의 응력분포를, 최대응력이 균일하게 작용한다고 볼 때 같은 힘을 내는 등가 폭이다. be = ∫σ dy / σmax. 보강재·거더의 단면계수를 계산할 때 붙은 판(attached plating)은 유효폭만큼만 포함한다.","x":"\n<p class=\"key\">유효폭은 실제로는 폭 방향으로 불균일한 판의 응력분포를, 최대응력이 균일하게 작용한다고 볼 때 같은 힘을 내는 등가 폭이다. b<sub>e<\/sub> = ∫σ dy / σ<sub>max<\/sub>. 보강재·거더의 단면계수를 계산할 때 붙은 판(attached plating)은 유효폭만큼만 포함한다.<\/p>\n<h4>두 가지 원인<\/h4>\n<ul>\n<li><b>전단지연(shear lag)에 의한 유효폭<\/b>: 넓은 플랜지가 면내 전단변형을 하므로 웨브에서 먼 곳의 응력이 작다. 지간이 짧을수록, 플랜지가 넓을수록 유효폭이 작다. 탄성 범위의 강도 계산(단면계수)에 쓴다.<\/li>\n<li><b>좌굴에 의한 유효폭(effective width)<\/b>: 압축판이 좌굴하면 가운데는 하중을 덜 받고 가장자리(보강재 쪽)가 하중을 받는다. 최종강도 계산에 쓴다.\n<div class=\"eq\"><div class=\"eql\">Faulkner 유효폭 (β ≥ 1)<\/div><div class=\"mj\">\\[\\dfrac{b_e}{b}=\\dfrac{2}{\\beta}-\\dfrac{1}{\\beta^2},\\qquad \\beta=\\dfrac{b}{t}\\sqrt{\\dfrac{\\sigma_Y}{E}}\\]<\/div><\/div><\/li>\n<\/ul>\n<h4>설계 적용<\/h4>\n<ul>\n<li>보강재 단면계수: 규칙상 붙은 판은 보강재 간격 s 이내, 주요지지부재는 지간 대 간격 비에 따라 유효폭 계수를 적용.<\/li>\n<li>FE 해석은 판 요소가 실제 응력분포를 계산하므로 유효폭을 별도로 가정하지 않는다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>불균일한 판 응력분포를 σ<sub>max<\/sub>가 균일하게 작용한다고 볼 때 같은 힘을 내는 등가 폭.<\/p>\n<div class=\"calc\">b_e = ∫σ dy / σ_max<\/div>\n<h5>2. 두 원인<\/h5><ul><li>전단지연 유효폭: 넓은 플랜지의 면내 전단변형, 지간 짧고 플랜지 넓을수록 작아짐 → 탄성 단면계수<\/li><li>좌굴 유효폭(Faulkner, β ≥ 1): b<sub>e<\/sub>/b = 2/β − 1/β², β = (b/t)√(σ<sub>Y<\/sub>/E) → 최종강도<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 규칙 계산의 붙은 판은 유효폭으로, FE는 판 요소가 실제 분포를 계산하므로 별도 가정이 없음.<\/p><\/div><\/section><\/details>"},{"id":"shear-lag","p":3,"n":"3.4","h":"전단지연(Shear Lag) 현상","t":"전단지연(Shear Lag) 현상","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 1교시 2번 · 10점"],"q":["<b>130회(2023) 1-2<\/b> 전단지연(Shear Lag) 현상"],"k":"전단지연은 굽힘을 받는 박판 상자형 보에서 넓은 플랜지(갑판·선저판)의 면내 전단변형 때문에 웨브(선측·종격벽)에서 먼 플랜지 부분의 축응력이 \"뒤처져\" 작아지는 현상이다. 단순 보 이론(평면 유지)의 균일 응력 가정이 깨지고 웨브 접합부 응력이 커진다.","x":"\n<p class=\"key\">전단지연은 굽힘을 받는 박판 상자형 보에서 넓은 플랜지(갑판·선저판)의 면내 전단변형 때문에 웨브(선측·종격벽)에서 먼 플랜지 부분의 축응력이 \"뒤처져\" 작아지는 현상이다. 단순 보 이론(평면 유지)의 균일 응력 가정이 깨지고 웨브 접합부 응력이 커진다.<\/p>\n<h4>메커니즘<\/h4>\n<ul>\n<li>굽힘 축하중은 웨브에서 전단응력으로 플랜지에 전달된다. 플랜지가 전단변형을 하면 웨브에서 멀수록 변형이 덜 전달되어 축응력이 줄어든다.<\/li>\n<li>결과적으로 응력분포는 웨브 쪽이 높고 중앙이 낮은 곡선이 된다(정의 전단지연). 하중점 근처나 단부에서는 반대 분포(부의 전단지연)도 생긴다.<\/li>\n<\/ul>\n<h4>선박에서 중요한 곳<\/h4>\n<ul>\n<li>넓은 갑판에 큰 개구가 있는 컨테이너선 갑판·해치코밍 모서리.<\/li>\n<li>격벽 근처(전단력이 큰 구간)의 갑판·선저.<\/li>\n<li>집중하중이 걸리는 이중저, 상부구조 단부(deckhouse end) 접합부.<\/li>\n<\/ul>\n<h4>설계 반영<\/h4>\n<ul>\n<li>유효폭 개념으로 단면계수 감소 반영.<\/li>\n<li>FE 해석으로 실제 응력분포 확인, 응력 피크부 상세 설계(해치 코너 반경, 인서트 판).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 응력분포 그림\">\n<h5>1. 정의<\/h5><p>박판 상자형 보 굽힘 시 넓은 플랜지의 면내 전단변형으로 웨브에서 먼 부분 축응력이 작아지는 현상 → 평면 유지 가정 붕괴, 웨브 접합부 응력↑.<\/p>\n<h5>2. 메커니즘<\/h5><p>축력은 웨브에서 전단으로 전달 → 멀수록 덜 전달. 정(+)의 전단지연(웨브 쪽 높음), 하중점·단부는 부(−)의 전단지연.<\/p>\n<h5>3. 중요 위치·대책<\/h5><p>컨테이너선 갑판·해치 코너, 격벽 근처 갑판·선저, 상부구조 단부 → 유효폭 반영, FE 확인, 코너 반경·인서트 판.<\/p><\/div><\/section><\/details>"},{"id":"racking","p":3,"n":"3.5","h":"래킹(Racking)","t":"래킹(Racking)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 5번 · 10점"],"q":["<b>115회(2018) 1-5<\/b> 래킹(Racking)"],"k":"래킹은 횡동요 가속도와 바람이 만드는 횡력 때문에 선체 횡단면이 평행사변형으로 찌그러지는 횡방향 전단 변형이다. 횡격벽이 적고 갑판이 많은 자동차운반선(PCTC)·로로선에서 결정적인 강도 문제다.","x":"\n<p class=\"key\">래킹은 횡동요 가속도와 바람이 만드는 횡력 때문에 선체 횡단면이 평행사변형으로 찌그러지는 횡방향 전단 변형이다. 횡격벽이 적고 갑판이 많은 자동차운반선(PCTC)·로로선에서 결정적인 강도 문제다.<\/p>\n<h4>원인<\/h4>\n<ul>\n<li>횡동요 시 상부 갑판·화물·구조물의 횡 관성력이 하부보다 크게 작용.<\/li>\n<li>기둥 없는 넓은 차량갑판, 횡격벽 간격이 길어 횡 강성이 웨브프레임과 기둥에 의존.<\/li>\n<\/ul>\n<h4>영향<\/h4>\n<ul>\n<li>갑판-선측 연결부(브래킷), 기둥 상하단, 갑판 거더 모서리에 응력집중과 피로 균열.<\/li>\n<li>과대 변형 시 갑판 처짐, 램프·문 기밀 문제.<\/li>\n<\/ul>\n<h4>대책<\/h4>\n<ul>\n<li>래킹 격벽(racking bulkhead)·부분 횡격벽, 강성 큰 기둥과 갑판 횡거더의 프레임 구조.<\/li>\n<li>갑판-선측 연결 브래킷 대형화, 모서리 응력집중 완화.<\/li>\n<li>3차원 전선 FE 해석으로 횡가속도 하중 조건 평가(선급 PCTC 규칙).<\/li>\n<\/ul>\n<p>컨테이너 자체에도 래킹 개념이 있다. ISO 1496 시험은 컨테이너 단부 프레임 래킹 하중 150 kN을 기준으로 하며, 래싱 계산에서 래킹력 한계를 확인한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 변형 그림\">\n<h5>1. 정의<\/h5><p>횡동요 가속도·풍압 횡력으로 횡단면이 평행사변형으로 찌그러지는 횡방향 전단 변형. 횡격벽이 적은 PCTC·RoRo에서 결정적.<\/p>\n<h5>2. 영향<\/h5><p>갑판-선측 브래킷, 기둥 상하단, 갑판 거더 모서리 응력집중·피로 균열, 램프·문 기밀 문제.<\/p>\n<h5>3. 대책<\/h5><p>래킹 격벽·부분 횡격벽, 강한 기둥-횡거더 프레임, 대형 브래킷, 전선 FE(횡가속도 하중).<\/p>\n<p class=\"concl\"><b>의견<\/b>: 컨테이너도 ISO 1496 단부 프레임 래킹 시험 150 kN 기준으로 래싱 계산에서 래킹력을 확인함.<\/p><\/div><\/section><\/details>"},{"id":"allowable-stress","p":3,"n":"3.6","h":"허용응력과 안전율","t":"허용응력과 안전율","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 13번 · 10점"],"q":["<b>112회(2017) 1-13<\/b> 허용응력과 안전율"],"k":"허용응력은 부재가 받을 수 있는 응력의 설계 한계로, 재료 기준강도(항복응력 등)를 안전율로 나눈 값이다. 안전율은 하중·재료·해석·제작·부식의 불확실성을 덮는 여유이며, 선박 규칙은 하중의 확률 수준과 부재 중요도에 따라 다른 허용응력을 준다.","x":"\n<p class=\"key\">허용응력은 부재가 받을 수 있는 응력의 설계 한계로, 재료 기준강도(항복응력 등)를 안전율로 나눈 값이다. 안전율은 하중·재료·해석·제작·부식의 불확실성을 덮는 여유이며, 선박 규칙은 하중의 확률 수준과 부재 중요도에 따라 다른 허용응력을 준다.<\/p>\n<div class=\"eq\"><div class=\"eql\">σ<sub>ref<\/sub>: 항복응력·인장강도·좌굴응력 등 파괴양식의 기준값<\/div><div class=\"mj\">\\[\\sigma_{allow}=\\dfrac{\\sigma_{ref}}{S.F.}\\]<\/div><\/div>\n<h4>안전율이 필요한 이유<\/h4>\n<ul>\n<li>하중 불확실성(극한 해상, 운항 오용), 재료 편차, 계산 모델 단순화, 용접 결함·잔류응력, 부식에 의한 두께 감소.<\/li>\n<li>파괴 결과의 심각도(인명·환경).<\/li>\n<\/ul>\n<h4>선박 규칙에서의 예<\/h4>\n<ul>\n<li>선체거더: σ ≤ 175/k N/mm²(UR S11), 전단 110/k.<\/li>\n<li>CSR FE: 조대 메시 von Mises 응력 이용률 λ<sub>y<\/sub> ≤ 0.8(정적, AC-S), 1.0(정적+동적, AC-SD). 미세 메시는 더 큰 허용치. 동적 하중은 이미 10⁻⁸ 극값이므로 여유를 작게 둔다.<\/li>\n<li>좌굴: 이용률 η ≤ 1.0, 피로: 누적손상 D ≤ 1(설계수명 25년 이상).<\/li>\n<\/ul>\n<h4>설계 방식<\/h4>\n<ul>\n<li><b>허용응력설계(WSD)<\/b>: 단일 안전율. 단순하지만 하중별 불확실성 차이를 반영 못함.<\/li>\n<li><b>하중저항계수설계(LRFD)<\/b>: 하중계수 γ<sub>S<\/sub>, γ<sub>W<\/sub>와 저항계수 γ<sub>R<\/sub>를 분리(CSR 최종강도). 신뢰성 기반으로 보정.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><div class=\"calc\">σ_allow = σ_ref / S.F.  (σ_ref: 항복·인장·좌굴 등 파괴양식 기준값)<\/div>\n<h5>2. 안전율 필요 이유<\/h5><p>하중·재료 편차, 모델 단순화, 용접 결함·잔류응력, 부식, 파괴 결과의 심각도.<\/p>\n<h5>3. 선박 규칙 예<\/h5><p>선체거더 175/k(UR S11), 전단 110/k N/mm² / CSR FE 조대 메시 λ<sub>y<\/sub> ≤ 0.8(AC-S)·1.0(AC-SD) / 좌굴 η ≤ 1.0 / 피로 D ≤ 1.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: WSD(단일 안전율)에서 LRFD(γ<sub>S<\/sub>·γ<sub>W<\/sub>·γ<sub>R<\/sub> 분리, CSR 최종강도)로 가는 추세임.<\/p><\/div><\/section><\/details>"},{"id":"ss-curve","p":3,"n":"3.7","h":"구조용 강재의 응력-변형률 선도(S-S Curve)","t":"구조용 강재의 응력-변형률 선도(S-S Curve)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 12번 · 10점"],"q":["<b>115회(2018) 1-12<\/b> 구조용 강재의 응력-변형률 선도(S-S curve)"],"k":"응력-변형률 선도는 인장시험에서 공칭응력과 공칭변형률의 관계로, 탄성계수·항복점·인장강도·연신율을 통해 강재의 강도와 연성을 보여준다. 연강은 뚜렷한 상·하항복점과 항복 수평부를 가진다.","x":"\n<p class=\"key\">응력-변형률 선도는 인장시험에서 공칭응력과 공칭변형률의 관계로, 탄성계수·항복점·인장강도·연신율을 통해 강재의 강도와 연성을 보여준다. 연강은 뚜렷한 상·하항복점과 항복 수평부를 가진다.<\/p>\n<figure class=\"fig\"><svg viewBox=\"0 0 440 230\" role=\"img\" aria-label=\"응력 변형률 선도\">\n<line x1=\"40\" y1=\"200\" x2=\"420\" y2=\"200\" class=\"ln\"/><line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"20\" class=\"ln\"/>\n<path d=\"M40 200 L70 92 L74 84 L78 96 L130 96 C 170 70, 230 46, 290 42 C 330 44, 360 60, 385 92\" class=\"ln2\"/>\n<circle cx=\"385\" cy=\"92\" r=\"3\" class=\"dot\"/>\n<text x=\"80\" y=\"80\" class=\"t2\">상항복점<\/text><text x=\"86\" y=\"112\" class=\"t2\">하항복점·항복 수평부(뤼더스대)<\/text>\n<text x=\"190\" y=\"54\" class=\"t2\">변형경화<\/text><text x=\"266\" y=\"34\" class=\"tr\">인장강도<\/text><text x=\"320\" y=\"72\" class=\"t2\">네킹<\/text><text x=\"390\" y=\"88\" class=\"t2\">파단<\/text>\n<text x=\"44\" y=\"150\" class=\"t2\">E<\/text><text x=\"400\" y=\"216\" class=\"t2\">ε<\/text><text x=\"20\" y=\"28\" class=\"t2\">σ<\/text>\n<\/svg><\/figure>\n<h4>구간별 의미<\/h4>\n<ol>\n<li><b>탄성 구간<\/b>: σ = Eε, E ≈ 206 GPa, 포아송비 0.3. 하중 제거 시 원상 복귀.<\/li>\n<li><b>항복<\/b>: 상항복점 후 응력이 떨어져 하항복점 근처에서 변형만 진행(뤼더스 띠). 규칙의 최소 항복응력 R<sub>eH<\/sub>은 상항복점 기준.<\/li>\n<li><b>변형경화<\/b>: 전위 증식으로 응력 다시 증가.<\/li>\n<li><b>인장강도(최대 하중점)<\/b> 이후 국부 수축(네킹) → 파단. 진응력은 계속 증가한다.<\/li>\n<li>항복점이 뚜렷하지 않은 재료(스테인리스, 알루미늄, 일부 TMCP 고강도강)는 0.2% 오프셋 내력을 쓴다.<\/li>\n<\/ol>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등급<\/th><th class=\"num\">R<sub>eH<\/sub> [MPa]<\/th><th class=\"num\">R<sub>m<\/sub> [MPa]<\/th><th class=\"num\">k<\/th><\/tr><\/thead><tbody>\n<tr><td>연강 A~E<\/td><td class=\"num\">235<\/td><td class=\"num\">400~520<\/td><td class=\"num\">1.00<\/td><\/tr>\n<tr><td>AH32~FH32<\/td><td class=\"num\">315<\/td><td class=\"num\">440~570<\/td><td class=\"num\">0.78<\/td><\/tr>\n<tr><td>AH36~FH36<\/td><td class=\"num\">355<\/td><td class=\"num\">490~630<\/td><td class=\"num\">0.72<\/td><\/tr>\n<tr><td>AH40~FH40<\/td><td class=\"num\">390<\/td><td class=\"num\">510~660<\/td><td class=\"num\">0.68<\/td><\/tr>\n<tr><td>EH47(컨테이너선 후판)<\/td><td class=\"num\">460<\/td><td class=\"num\">570~720<\/td><td class=\"num\">0.62<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>설계에서 쓰는 성질: 강도 계산은 항복응력, 좌굴은 E와 항복응력, 피로는 S-N 곡선(정적 강도와 거의 무관), 취성은 충격인성(샤르피)·CTOD.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 선도 그림 필수\">\n<p>(그림: 탄성 → 상항복점 → 하항복점·뤼더스 수평부 → 변형경화 → 인장강도 → 네킹 → 파단)<\/p>\n<ul><li>탄성: σ = Eε, E ≈ 206 GPa, ν = 0.3<\/li><li>항복: 규칙 R<sub>eH<\/sub>는 상항복점 기준, 불명확 재료는 0.2% 오프셋<\/li><li>인장강도 이후 네킹(공칭응력 감소, 진응력 증가)<\/li><\/ul>\n<div class=\"calc\">연강 235 / 400~520 MPa, k 1.00   AH32 315, k 0.78\nAH36 355 / 490~630, k 0.72      AH40 390, k 0.68<\/div>\n<p class=\"concl\"><b>의견<\/b>: 강도는 항복, 좌굴은 E·항복, 피로는 S-N(정적 강도와 거의 무관), 취성은 샤르피·CTOD로 평가함.<\/p><\/div><\/section><\/details>"},{"id":"failure-modes","p":3,"n":"3.8","h":"합리적인 구조안전성 평가를 위한 재료의 파괴양식 4가지","t":"합리적인 구조안전성 평가를 위한 재료의 파괴양식 4가지","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 4교시 4번 · 25점","124회 4교시 5번 · 25점"],"q":["<b>118회(2019) 4-4<\/b> 합리적인 구조안전성 평가를 위한 재료의 파괴양식 4가지와 현상","<b>124회(2021) 4-5<\/b> 선박구조재료의 파괴양식 4가지와 현상"],"k":"선체 구조의 대표 파괴양식은 항복(소성 붕괴), 좌굴, 피로, 취성파괴다. 각각 원인과 지배 물성이 달라서 평가 기준도 따로 둔다. 합리적인 구조 평가는 네 양식을 모두 별도로 확인하는 것이다.","x":"\n<p class=\"key\">선체 구조의 대표 파괴양식은 항복(소성 붕괴), 좌굴, 피로, 취성파괴다. 각각 원인과 지배 물성이 달라서 평가 기준도 따로 둔다. 합리적인 구조 평가는 네 양식을 모두 별도로 확인하는 것이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>양식<\/th><th>현상<\/th><th>지배 인자<\/th><th>평가 기준<\/th><\/tr><\/thead><tbody>\n<tr><td>항복·소성 붕괴<\/td><td>응력이 항복응력을 넘어 영구변형, 소성힌지 형성 후 붕괴<\/td><td>하중 크기, 항복응력<\/td><td>von Mises ≤ 허용응력, 최종강도(소성 붕괴 하중)<\/td><\/tr>\n<tr><td>좌굴<\/td><td>압축·전단을 받는 얇은 판·보강재가 면외로 휘며 강성 상실<\/td><td>세장비(b/t), E, 경계조건, 초기변형<\/td><td>임계좌굴응력 ≥ 작용응력 (Johnson–Ostenfeld 보정), 이용률 ≤ 1<\/td><\/tr>\n<tr><td>피로<\/td><td>반복하중으로 응력집중부에서 균열 발생·진전<\/td><td>응력 범위, 반복 수, 상세 형상, 용접 품질, 부식 환경<\/td><td>S-N 곡선 + Miner 누적손상 D ≤ 1<\/td><\/tr>\n<tr><td>취성파괴<\/td><td>저온·고변형속도·결함부에서 소성변형 없이 순간 파단<\/td><td>온도, 판두께, 인성, 결함 크기<\/td><td>재료 등급(샤르피), CTOD, 균열 정지(BCA) 설계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>보충 설명<\/h4>\n<ul>\n<li><b>좌굴<\/b>: σ<sub>E<\/sub> = k·π²E/[12(1−ν²)]·(t/b)². σ<sub>E<\/sub> &gt; σ<sub>Y<\/sub>/2이면 σ<sub>cr<\/sub> = σ<sub>Y<\/sub>(1 − σ<sub>Y<\/sub>/4σ<sub>E<\/sub>). 단순지지 장판 압축 k = 4.<\/li>\n<li><b>피로<\/b>: N·Δσ<sup>m<\/sup> = K, D = Σ n<sub>i<\/sub>/N<sub>i<\/sub>. 고장력강을 써서 판을 얇게 하면 응력 범위가 커져 피로가 결정 조건이 된다.<\/li>\n<li><b>취성파괴<\/b>: 1940년대 Liberty선 사고가 계기. 강재 연성-취성 천이온도보다 운항온도가 높도록 등급(A·B·D·E·F) 선정.<\/li>\n<\/ul>\n<p>그 밖에 부식(두께 감소로 위 네 양식을 촉진)과 크리프(고온, 선체에는 해당 적음)를 함께 언급할 수 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-4-4 · 124-4-5<\/td><td>재료의 파괴양식 4가지와 현상<\/td><td>항복·좌굴·피로·취성, 지배 인자와 평가 기준<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>합리적 구조안전성 평가는 파괴양식별로 다른 하중 수준·물성·기준을 적용하는 것이며, 대표 양식은 항복, 좌굴, 피로, 취성파괴임.<\/p>\n<h5>2. 파괴양식<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>양식<\/th><th>현상<\/th><th>지배 인자<\/th><th>평가<\/th><\/tr><\/thead><tbody>\n<tr><td>항복·소성붕괴<\/td><td>영구변형, 소성힌지<\/td><td>하중, σ<sub>Y<\/sub><\/td><td>von Mises ≤ 허용, 최종강도<\/td><\/tr>\n<tr><td>좌굴<\/td><td>압축·전단 판 면외 처짐, 강성 상실<\/td><td>b/t, E, 초기변형<\/td><td>σ<sub>cr<\/sub> ≥ σ (J–O 보정)<\/td><\/tr>\n<tr><td>피로<\/td><td>반복하중 → 응력집중부 균열<\/td><td>Δσ, 반복수, 상세, 용접<\/td><td>S-N + Miner, D ≤ 1<\/td><\/tr>\n<tr><td>취성파괴<\/td><td>저온·결함부 순간 파단<\/td><td>온도, 두께, 인성<\/td><td>강재 등급, CTOD, BCA<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"calc\">좌굴: σ_E = k·π²E/[12(1−ν²)]·(t/b)²,  σ_E > σ_Y/2 → σ_cr = σ_Y(1 − σ_Y/4σ_E)\n피로: N·Δσ^m = K,  D = Σ nᵢ/Nᵢ<\/div>\n<h5>3. 상호관계<\/h5><ul><li>부식 → 두께 감소로 네 양식 모두 촉진<\/li><li>고장력강 → 항복 여유 증가, 피로·좌굴은 불리<\/li><li>용접 잔류응력 → 좌굴강도 저하, 피로·취성 영향<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 한 양식만 만족하는 설계는 다른 양식에 취약해질 수 있으므로 네 양식을 모두 독립적으로 확인하는 것이 합리적 평가의 조건임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"buckling","p":3,"n":"3.9","h":"판의 좌굴과 선체 구조 좌굴 평가","t":"판의 좌굴과 선체 구조 좌굴 평가","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"판 좌굴은 면내 압축·전단 하중이 임계값에 도달해 판이 면외로 휘는 불안정 현상이다. 탄성 좌굴응력은 (t/b)²에 비례하므로 판을 얇게 하는 고장력강 설계일수록 좌굴이 결정 조건이 된다.","x":"\n<p class=\"key\">판 좌굴은 면내 압축·전단 하중이 임계값에 도달해 판이 면외로 휘는 불안정 현상이다. 탄성 좌굴응력은 (t/b)²에 비례하므로 판을 얇게 하는 고장력강 설계일수록 좌굴이 결정 조건이 된다.<\/p>\n<div class=\"eq\"><div class=\"eql\">단순지지 장판: 압축 k = 4, 전단 k ≈ 5.34 + 4(b/a)²<\/div><div class=\"mj\">\\[\\sigma_E=k\\,\\dfrac{\\pi^2E}{12(1-\\nu^2)}\\left(\\dfrac{t}{b}\\right)^2\\approx0.9\\,k\\,E\\left(\\dfrac{t}{b}\\right)^2\\]<\/div><\/div>\n<div class=\"eq\"><div class=\"eql\">Johnson–Ostenfeld 소성 보정 (σ<sub>E<\/sub> &gt; σ<sub>Y<\/sub>/2 일 때)<\/div><div class=\"mj\">\\[\\sigma_{cr}=\\sigma_Y\\left(1-\\dfrac{\\sigma_Y}{4\\,\\sigma_E}\\right)\\]<\/div><\/div>\n<h4>선체 좌굴의 양식<\/h4>\n<ul>\n<li>보강재 사이 판 좌굴(국부), 보강재의 휨·비틀림(tripping) 좌굴, 보강판 전체 좌굴, 웨브 전단 좌굴.<\/li>\n<li>초기 처짐과 용접 잔류응력이 좌굴강도를 낮춘다(설계는 초기 결함 포함 비선형 기반 공식).<\/li>\n<\/ul>\n<h4>규칙 평가<\/h4>\n<p>CSR은 선체거더 응력과 화물창 FE 응력으로 판넬별 좌굴 이용률을 계산한다(폐형식 공식, PULS 기반). 압축 갑판, 선저, 호퍼, 종격벽 상부와 주요지지부재 웨브가 주요 확인 위치다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 예상(고장력강 박판화)\">\n<h5>1. 정의<\/h5><p>면내 압축·전단이 임계값에 도달해 판이 면외로 휘는 불안정 현상.<\/p>\n<div class=\"calc\">σ_E = k·π²E/[12(1−ν²)]·(t/b)² ≈ 0.9kE(t/b)²   (압축 k = 4, 전단 k ≈ 5.34 + 4(b/a)²)\nσ_E > σ_Y/2 → σ_cr = σ_Y(1 − σ_Y/4σ_E)  (Johnson–Ostenfeld)<\/div>\n<h5>2. 양식<\/h5><p>판 국부 좌굴, 보강재 휨·tripping, 보강판 전체, 웨브 전단 좌굴. 초기 처짐·잔류응력이 강도 저하.<\/p>\n<p class=\"concl\"><b>3. 의견<\/b>: 고장력강으로 t를 줄이면 σ<sub>E<\/sub>가 (t/b)²로 떨어지므로, CSR 판넬 좌굴 이용률(PULS 기반)이 갑판·선저·호퍼에서 치수를 결정함.<\/p><\/div><\/section><\/details>"},{"id":"framing-systems","p":3,"n":"3.10","h":"늑골구조 형식: 횡늑골식·종늑골식·혼합식, 그리고 선체가 갖추어야 할 기본 조건","t":"늑골구조 형식: 횡늑골식·종늑골식·혼합식, 그리고 선체가 갖추어야 할 기본 조건","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 3교시 1번 · 25점","136회 2교시 2번 · 25점"],"q":["<b>121회(2020) 3-1<\/b> 선체의 기본 조건과 선체구조양식 중 혼합식 구조(combined system)","<b>136회(2025) 2-2<\/b> 종늑골식, 횡늑골식 및 혼합형식 구조"],"k":"횡늑골식은 촘촘한 횡늑골이 판을 받치고, 종늑골식은 촘촘한 종통 보강재가 판을 받치며 드문 횡웨브가 종늑골을 받친다. 혼합식은 종굽힘 응력이 큰 갑판·선저는 종늑골식, 선측은 횡늑골식으로 짠다. 선형이 길어질수록 종굽힘이 지배하므로 종늑골식이 유리하다.","x":"\n<p class=\"key\">횡늑골식은 촘촘한 횡늑골이 판을 받치고, 종늑골식은 촘촘한 종통 보강재가 판을 받치며 드문 횡웨브가 종늑골을 받친다. 혼합식은 종굽힘 응력이 큰 갑판·선저는 종늑골식, 선측은 횡늑골식으로 짠다. 선형이 길어질수록 종굽힘이 지배하므로 종늑골식이 유리하다.<\/p>\n<h4>선체가 갖추어야 할 기본 조건<\/h4>\n<ul>\n<li>수밀성·풍우밀성, 전역·국부 강도와 강성, 내구성(피로·부식), 화물·공간 효율, 경량·경제성, 생산성(용접량, 블록화), 검사·정비 접근성.<\/li>\n<\/ul>\n<h4>형식 비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>횡늑골식<\/th><th>종늑골식(Isherwood)<\/th><th>혼합식(combined)<\/th><\/tr><\/thead><tbody>\n<tr><td>구성<\/td><td>늑골·갑판보·늑판 간격 촘촘, 종방향은 거더 몇 개<\/td><td>종늑골·종보 촘촘, 횡웨브 3~5 m 간격<\/td><td>갑판·선저 종늑골, 선측 횡늑골<\/td><\/tr>\n<tr><td>종강도<\/td><td>종통 부재 적어 불리<\/td><td>종늑골이 단면계수에 기여, 압축 좌굴에 강함<\/td><td>갑판·선저(최대 응력부)에서 유리<\/td><\/tr>\n<tr><td>횡강도·국부<\/td><td>횡하중·수압에 강함<\/td><td>횡웨브가 크고 깊어짐<\/td><td>선측 수압·충격에 횡늑골 유리<\/td><\/tr>\n<tr><td>중량<\/td><td>대형선에서 무거움<\/td><td>대형선에서 가벼움<\/td><td>중간<\/td><\/tr>\n<tr><td>공간·화물<\/td><td>늑골 깊이 작아 내부 공간 유리<\/td><td>웨브가 화물창을 잠식(건화물 불리)<\/td><td>건화물선 화물창 측면 평활<\/td><\/tr>\n<tr><td>생산<\/td><td>단순, 곡부 가공 쉬움<\/td><td>종늑골 연속 관통(슬롯) 공수<\/td><td>-<\/td><\/tr>\n<tr><td>적용<\/td><td>소형선, 선수미 단부, 쇄빙부 선측<\/td><td>유조선, 컨테이너선, 대형선 갑판·선저<\/td><td>단일선측 벌크선, 일반화물선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"pro\"><p>종늑골식의 약점은 종늑골이 횡웨브를 관통하는 슬롯과 연결부의 피로다. 선측 수선 부근 종늑골 연결부는 동압 변동이 커서 피로 균열의 대표 위치이며, 소프트 토우 브래킷·칼라 판으로 응력집중을 줄인다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">121-3-1<\/td><td>선체 기본 조건과 혼합식 구조<\/td><td>기본 조건 나열 + 혼합식 이유<\/td><\/tr>\n<tr><td class=\"num\">136-2-2<\/td><td>종·횡·혼합 늑골 구조<\/td><td>세 방식 비교표와 단면 스케치<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 선체가 갖추어야 할 기본 조건<\/h5><p>수밀·풍우밀성, 전역·국부 강도와 강성, 내구성(피로·부식), 공간 효율, 경량·경제성, 생산성, 검사 접근성<\/p>\n<h5>2. 구조 방식<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>횡늑골식<\/th><th>종늑골식<\/th><th>혼합식<\/th><\/tr><\/thead><tbody>\n<tr><td>구성<\/td><td>촘촘한 늑골·보·늑판<\/td><td>촘촘한 종늑골 + 3~5 m 간격 횡웨브<\/td><td>갑판·선저 종늑골, 선측 횡늑골<\/td><\/tr>\n<tr><td>종강도<\/td><td>불리<\/td><td>유리(단면계수·좌굴)<\/td><td>최대 응력부(갑판·선저) 유리<\/td><\/tr>\n<tr><td>횡강도·국부<\/td><td>유리<\/td><td>웨브 대형화<\/td><td>선측 수압·충격 유리<\/td><\/tr>\n<tr><td>중량<\/td><td>대형선 불리<\/td><td>대형선 유리<\/td><td>중간<\/td><\/tr>\n<tr><td>공간<\/td><td>내부 평활<\/td><td>웨브가 화물창 잠식<\/td><td>건화물창 측면 평활<\/td><\/tr>\n<tr><td>적용<\/td><td>소형선·선수미<\/td><td>유조선·컨테이너선<\/td><td>단일선측 벌크선·일반화물선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 혼합식을 쓰는 이유<\/h5><ul><li>종굽힘 응력은 중립축에서 먼 갑판·선저에 집중 → 그곳만 종늑골로<\/li><li>선측은 화물 접촉·하역 충격·수압 → 횡늑골로 평활·강인<\/li><\/ul>\n<h5>4. 설계 유의<\/h5><p>종늑골 슬롯·연결부 피로(선측 수선부), 방식 전환부(선수미) 구조 연속성, 늑골 간격과 판 두께 최적화.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 선장이 길수록 종굽힘이 지배하므로 종늑골식이 기본이며, 혼합식은 강도 효율과 화물창 실용성을 절충한 해법임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"keel","p":3,"n":"3.11","h":"용골(Keel)","t":"용골(Keel)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 1번 · 10점"],"q":["<b>121회(2020) 1-1<\/b> 용골(keel)"],"k":"용골은 선체 중심선 선저를 따라 선수에서 선미까지 이어지는 종통 강력 부재로, 선체의 등뼈 역할을 하며 종강도·도킹 하중·좌초 하중을 받는다. 현대 강선은 평판용골(flat plate keel)과 그 위의 중심선 거더(center girder)로 구성된다.","x":"\n<p class=\"key\">용골은 선체 중심선 선저를 따라 선수에서 선미까지 이어지는 종통 강력 부재로, 선체의 등뼈 역할을 하며 종강도·도킹 하중·좌초 하중을 받는다. 현대 강선은 평판용골(flat plate keel)과 그 위의 중심선 거더(center girder)로 구성된다.<\/p>\n<h4>종류<\/h4>\n<ul>\n<li><b>평판용골(flat plate keel)<\/b>: 선저 중심선의 두꺼운 외판 띠. 선저외판보다 두껍고 폭이 넓다. 대부분의 강선.<\/li>\n<li><b>방형용골(bar keel)<\/b>: 각재 형태로 선저 아래 돌출. 소형선·어선, 목선.<\/li>\n<li><b>덕트용골(duct keel)<\/b>: 이중저 중심선의 관통 통로(파이프 덕트). 배관을 화물창 밖으로 통과시켜 탱크 내 배관을 줄임. 컨테이너선·벌크선·유조선에 쓰임.<\/li>\n<li><b>도킹용골·빌지용골<\/b>: 도킹 반력 지지용 보조 용골, 횡동요 감쇠용 빌지킬(엄밀히는 용골이 아님).<\/li>\n<\/ul>\n<h4>기능<\/h4>\n<ul>\n<li>선체거더의 선저 플랜지 일부로 종강도 기여.<\/li>\n<li>도킹 시 중심선 블록 반력을 받아 중심선 거더·늑판으로 분산.<\/li>\n<li>좌초 시 국부 하중 지지, 선저 손상 보호.<\/li>\n<\/ul>\n<p>\"용골 거치(keel laying)\"는 첫 블록을 도크에 놓는 건조 이정표로, 협약 적용일(건조 시점 판단)의 기준이 된다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>중심선 선저를 선수미로 잇는 종통 강력 부재(등뼈). 현대선은 평판용골 + 중심선 거더.<\/p>\n<h5>2. 종류<\/h5><p>평판용골(선저외판보다 두껍고 넓음), 방형용골(소형선·어선), 덕트용골(이중저 배관 통로), 도킹용골. 빌지킬은 용골이 아님.<\/p>\n<h5>3. 기능<\/h5><p>선저 플랜지로 종강도 기여, 도킹 중심선 반력 → 거더·늑판 분산, 좌초 국부 하중.<\/p>\n<p class=\"concl\"><b>의견<\/b>: keel laying은 협약 적용(건조 시점)의 기준일임.<\/p><\/div><\/section><\/details>"},{"id":"bulkheads","p":3,"n":"3.12","h":"격벽의 기능과 효과, 위치에 따른 명칭과 역할 (수밀횡격벽 포함)","t":"격벽의 기능과 효과, 위치에 따른 명칭과 역할 (수밀횡격벽 포함)","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 2교시 1번 · 25점","118회 4교시 3번 · 25점"],"q":["<b>112회(2017) 2-1<\/b> 선박에 설치되는 수밀횡격벽의 설치 목적과 선급규칙에서 요구하는 사항","<b>118회(2019) 4-3<\/b> 격벽의 전반적인 기능과 효과, 위치에 따른 격벽의 명칭과 역할"],"k":"격벽은 선체 내부를 나누는 벽으로, 수밀 구획(침수 제한), 횡강도와 지지, 화재 차단, 화물·액체 분리 기능을 한다. 수밀횡격벽은 수와 위치가 SOLAS와 선급 규칙으로 정해지며, 특히 충돌격벽 위치와 개구 제한이 엄격하다.","x":"\n<p class=\"key\">격벽은 선체 내부를 나누는 벽으로, 수밀 구획(침수 제한), 횡강도와 지지, 화재 차단, 화물·액체 분리 기능을 한다. 수밀횡격벽은 수와 위치가 SOLAS와 선급 규칙으로 정해지며, 특히 충돌격벽 위치와 개구 제한이 엄격하다.<\/p>\n<h4>기능과 효과<\/h4>\n<ul>\n<li><b>수밀 구획<\/b>: 침수를 한 구획에 가두어 손상복원성과 부력 유지.<\/li>\n<li><b>구조<\/b>: 횡강도·비틀림 강성 제공, 갑판·선저 거더의 지지점, 래킹 저항.<\/li>\n<li><b>방화<\/b>: 화재 확산 차단(A-60 등 방화등급 격벽).<\/li>\n<li><b>분리<\/b>: 화물 종류 분리, 유류-청수 분리(코퍼댐), 오염 방지.<\/li>\n<li><b>기타<\/b>: 소음·진동 차단, 액체 동요 억제(제수격벽).<\/li>\n<\/ul>\n<h4>위치별 명칭과 역할<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>명칭<\/th><th>위치·역할<\/th><\/tr><\/thead><tbody>\n<tr><td>충돌격벽(collision bhd)<\/td><td>선수 끝 근처 최전방 수밀격벽. 충돌 시 선수부 침수를 차단. 건현갑판까지 수밀<\/td><\/tr>\n<tr><td>선미관 격벽(aft peak bhd)<\/td><td>선미 끝, 선미관을 수밀 구역으로 감싼다<\/td><\/tr>\n<tr><td>기관실 격벽<\/td><td>기관실 전후 경계, 방화·수밀<\/td><\/tr>\n<tr><td>화물창 격벽<\/td><td>화물창 구획, 벌크선은 파형 격벽+스툴<\/td><\/tr>\n<tr><td>종격벽<\/td><td>유조선 탱크 분할, 종강도·자유표면 감소<\/td><\/tr>\n<tr><td>제수격벽(wash bhd)<\/td><td>탱크 내 비수밀 격벽, 슬로싱 감소<\/td><\/tr>\n<tr><td>코퍼댐 격벽<\/td><td>두 격벽 사이 공간으로 이종 액체 분리<\/td><\/tr>\n<tr><td>방화격벽<\/td><td>거주구·기관구역 방화 등급 경계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>수밀횡격벽의 규칙 요구(대표)<\/h4>\n<ul>\n<li><b>개수<\/b>: 선급 규칙은 선장과 기관실 위치에 따라 최소 수밀횡격벽 수를 표로 준다(충돌격벽, 선미관 격벽, 기관실 전후 격벽 포함). 구획 배치는 손상복원성 계산으로 최종 확인.<\/li>\n<li><b>충돌격벽 위치<\/b>(SOLAS II-1/12, 화물선): FP에서 0.05L<sub>f<\/sub> 또는 10 m 중 작은 값 이상, 0.08L<sub>f<\/sub> 또는 0.05L<sub>f<\/sub> + 3 m 중 큰 값 이하. 구상선수는 기준점 보정.<\/li>\n<li><b>개구 제한<\/b>: 충돌격벽 건현갑판 아래에는 문·맨홀·환기 개구 금지, 관통 배관은 건현갑판 위에서 조작하는 나사 체결 밸브를 격벽 앞쪽에 설치한 1개 관만 허용.<\/li>\n<li><b>높이·강도<\/b>: 건현갑판(또는 격벽갑판)까지 수밀, 침수 수두로 판 두께·보강재 설계, 관통부 수밀 처리, 시험(UR S14).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-2-1<\/td><td>수밀횡격벽 설치 목적과 선급 요구사항<\/td><td>개수·충돌격벽 위치·개구 제한·강도·시험<\/td><\/tr>\n<tr><td class=\"num\">118-4-3<\/td><td>격벽 기능·효과, 위치별 명칭과 역할<\/td><td>기능 5가지 + 위치별 명칭 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 112회형(수밀횡격벽)\">\n<h5>1. 개요<\/h5><p>수밀횡격벽은 선체를 길이 방향으로 나누는 수밀 경계로, 침수 범위를 제한해 부력과 복원성을 지키고 횡강도를 제공함.<\/p>\n<h5>2. 설치 목적<\/h5>\n<ol><li>수밀 구획: 손상 시 침수를 한 구획에 가둠(손상복원성)<\/li><li>구조: 횡강도·비틀림 강성, 갑판·선저 거더 지지, 래킹 저항<\/li><li>방화: 화재 확산 차단(A급 경계)<\/li><li>분리: 화물·액체 구분, 기관실 격리<\/li><\/ol>\n<h5>3. 선급·SOLAS 요구사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>요구<\/th><\/tr><\/thead><tbody>\n<tr><td>최소 개수<\/td><td>선장·기관실 위치에 따른 규칙 표(충돌·선미관·기관실 전후 격벽 포함), 최종은 손상복원성으로 확인<\/td><\/tr>\n<tr><td>충돌격벽 위치<\/td><td>FP에서 0.05L<sub>f<\/sub> 또는 10 m 중 작은 값 이상, 0.08L<sub>f<\/sub> 또는 0.05L<sub>f<\/sub>+3 m 중 큰 값 이하(SOLAS II-1/12)<\/td><\/tr>\n<tr><td>높이<\/td><td>건현갑판(격벽갑판)까지 수밀<\/td><\/tr>\n<tr><td>개구 제한<\/td><td>충돌격벽 건현갑판 아래 문·맨홀 금지, 관통관 1개(갑판 위 조작 나사 체결 밸브)<\/td><\/tr>\n<tr><td>강도<\/td><td>침수 수두로 판 두께·보강재 단면 설계, 관통부 수밀 처리<\/td><\/tr>\n<tr><td>시험<\/td><td>UR S14 누설·구조 시험, 관통부 호스시험<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 설계 시 유의<\/h5><ul><li>격벽 위치는 화물창 길이·종강도(SWBM)·손상복원성 A 지수와 함께 최적화<\/li><li>파형격벽 적용 시 하부 스툴 연결부 피로·침수 강도(UR S18)<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 수밀횡격벽은 구조·안전·화물 배치를 동시에 결정하므로, 최소 개수 충족보다 손상복원성과 화물 효율의 균형점을 찾는 것이 설계 핵심임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"corrugated-bhd","p":3,"n":"3.13","h":"파형격벽(Corrugated Bulkhead)","t":"파형격벽(Corrugated Bulkhead)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 2번 · 25점"],"q":["<b>127회(2022) 3-2<\/b> 파형격벽(corrugated bulkhead)"],"k":"파형격벽은 판을 사다리꼴로 접어 판 자체가 보강재 역할을 하게 만든 격벽이다. 보강재가 없어 탱크 세정·도장이 쉽고 용접량이 적지만, 압축 플랜지 좌굴과 하부 스툴 연결부 피로가 설계 핵심이다.","x":"\n<p class=\"key\">파형격벽은 판을 사다리꼴로 접어 판 자체가 보강재 역할을 하게 만든 격벽이다. 보강재가 없어 탱크 세정·도장이 쉽고 용접량이 적지만, 압축 플랜지 좌굴과 하부 스툴 연결부 피로가 설계 핵심이다.<\/p>\n<h4>형식과 적용<\/h4>\n<ul>\n<li>수직 파형(벌크선 횡격벽, 유조선·케미컬선 횡격벽), 수평 파형(유조선 종격벽 일부).<\/li>\n<li>벌크선: 하부 스툴(lower stool)과 상부 스툴(upper stool) 사이에 설치해 지간을 줄이고 하중을 이중저·갑판으로 전달.<\/li>\n<\/ul>\n<h4>장단점<\/h4>\n<div class=\"grid2\"><div class=\"box\"><h5>장점<\/h5><ul><li>보강재 없음 → 세정·검사·도장 용이(케미컬선 필수급)<\/li><li>부재 수·용접량 감소, 생산성<\/li><li>잔류 화물 적음<\/li><\/ul><\/div>\n<div class=\"box\"><h5>단점<\/h5><ul><li>압축 플랜지 좌굴(유효폭 감소)<\/li><li>하단 연결부 응력집중·피로, 침수 시 강도(UR S18)<\/li><li>공간 점유(파형 깊이), 성형 공수<\/li><\/ul><\/div><\/div>\n<h4>설계 변수와 상세<\/h4>\n<ul>\n<li>파형 각도(대략 55° 이상), 플랜지 폭·웨브 폭·두께, 파형 깊이 → 단면계수와 좌굴.<\/li>\n<li>하부 스툴 상단판 두께와 셰더판(shedder plate)·거싯판(gusset plate)으로 하단 굽힘 모멘트 전달과 응력집중 완화.<\/li>\n<li>벌크선 UR S18: 인접 화물창 침수 시 화물+해수 압력으로 굽힘·전단 강도 확인, 압축 플랜지 유효폭 적용.<\/li>\n<li>용접: 파형 하단 플랜지와 스툴 상단판의 완전용입 또는 부분용입, 스툴 내부 다이어프램과 정렬.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 단면 그림\">\n<h5>1. 개요<\/h5><p>판을 사다리꼴로 접어 판 자체가 보강재 역할. 벌크선·유조선·케미컬선 횡격벽(수직 파형), 하부·상부 스툴 사이 설치.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody>\n<tr><td>보강재 없음 → 세정·검사·도장 용이<\/td><td>압축 플랜지 좌굴(유효폭 감소)<\/td><\/tr>\n<tr><td>부재 수·용접량 감소<\/td><td>하단 연결부 응력집중·피로<\/td><\/tr>\n<tr><td>잔류 화물 적음<\/td><td>파형 깊이만큼 공간, 성형 공수<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 설계 변수<\/h5><p>파형 각도(약 55° 이상), 플랜지·웨브 폭·두께, 깊이 → 단면계수·좌굴. 스툴 상단판 두께, 셰더판·거싯판으로 하단 모멘트 전달.<\/p>\n<h5>3. 규칙<\/h5><p>UR S18: 인접 화물창 침수 시 화물+해수 압력, 굽힘·전단, 압축 플랜지 유효폭.<\/p>\n<h5>4. 시공<\/h5><p>하단 플랜지-스툴 상단판 완전·부분용입, 스툴 다이어프램 정렬.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 하단 연결부(셰더·거싯·정렬)가 피로와 침수 강도를 좌우하는 핵심 상세임.<\/p><\/div><\/section><\/details>"},{"id":"cofferdam","p":3,"n":"3.14","h":"코퍼댐(Cofferdam), 그리고 공소(Void Space)와의 설계 차이","t":"코퍼댐(Cofferdam), 그리고 공소(Void Space)와의 설계 차이","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 10번 · 10점","139회 2교시 2번 · 25점"],"q":["<b>127회(2022) 1-10<\/b> 코퍼댐(cofferdam)","<b>139회(2026) 2-2<\/b> 공소(void space)와 코퍼댐(cofferdam)의 설계 시 차이점"],"k":"코퍼댐은 두 개의 강제 격벽(또는 갑판) 사이의 좁은 격리 공간으로, 서로 섞이면 안 되는 구획(유류와 청수, 화물유와 거주·기관구역 등)을 분리해 누설이 직접 다른 구획으로 가지 못하게 한다. 공소는 특정 용도 없이 남은 폐위 공간이다. 코퍼댐은 규칙상 \"분리 기능\"이 목적이고, 공소는 결과로 생긴 공간이라는 점이 설계 차이의 출발점이다.","x":"\n<p class=\"key\">코퍼댐은 두 개의 강제 격벽(또는 갑판) 사이의 좁은 격리 공간으로, 서로 섞이면 안 되는 구획(유류와 청수, 화물유와 거주·기관구역 등)을 분리해 누설이 직접 다른 구획으로 가지 못하게 한다. 공소는 특정 용도 없이 남은 폐위 공간이다. 코퍼댐은 규칙상 \"분리 기능\"이 목적이고, 공소는 결과로 생긴 공간이라는 점이 설계 차이의 출발점이다.<\/p>\n<h4>코퍼댐이 요구되는 예<\/h4>\n<ul>\n<li>연료유 탱크와 청수·식수 탱크 사이.<\/li>\n<li>유조선 화물탱크 구역과 기관실·거주구 사이(펌프실·밸러스트탱크로 대체 가능).<\/li>\n<li>가스선 화물구역과 다른 구역 사이, 윤활유와 다른 유류 사이.<\/li>\n<li>케미컬선 비상용 화물 간 격리(IBC).<\/li>\n<\/ul>\n<h4>설계 차이<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>코퍼댐<\/th><th>공소(void space)<\/th><\/tr><\/thead><tbody>\n<tr><td>목적<\/td><td>규칙이 요구하는 격리·누설 차단<\/td><td>배치상 남은 공간, 기능 요구 없음<\/td><\/tr>\n<tr><td>크기<\/td><td>검사·출입이 가능한 최소 폭(대략 600 mm 이상) 확보<\/td><td>형상 자유, 단 검사 접근은 필요<\/td><\/tr>\n<tr><td>출입·검사<\/td><td>맨홀, 사다리, 영구 검사 설비(PMA 대상 여부 확인)<\/td><td>맨홀·검사 접근<\/td><\/tr>\n<tr><td>통기·측심<\/td><td>공기관·측심관(누설 감지), 위험구역이면 환기·가스 탐지<\/td><td>공기관 필요한 경우 있음<\/td><\/tr>\n<tr><td>배수<\/td><td>빌지 흡입 또는 이동식 배수 수단<\/td><td>빌지 흡입 또는 배수 수단<\/td><\/tr>\n<tr><td>위험구역<\/td><td>화물구역 인접 코퍼댐은 위험구역(방폭 기기)<\/td><td>위치에 따라<\/td><\/tr>\n<tr><td>도장<\/td><td>내식 도장(밸러스트 겸용 시 PSPC)<\/td><td>벌크선 이중선측 공소 등은 PSPC 대상<\/td><\/tr>\n<tr><td>시험<\/td><td>인접 탱크 시험 시 경계 확인<\/td><td>구조 시험 대상 아닌 경우 많음(누설시험)<\/td><\/tr>\n<tr><td>손상복원성<\/td><td>침수 시 투과율 0.95<\/td><td>투과율 0.95<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">127-1-10<\/td><td>코퍼댐<\/td><td class=\"num\">10<\/td><td>정의·요구 위치·설비<\/td><\/tr>\n<tr><td class=\"num\">139-2-2<\/td><td>공소와 코퍼댐의 설계 시 차이점<\/td><td class=\"num\">25<\/td><td>목적·크기·출입·통기·위험구역·도장·시험 비교<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 139회형\">\n<h5>1. 정의<\/h5><ul><li>코퍼댐: 두 격벽 사이 격리 공간, 이종 액체·위험 구역 분리가 목적(규칙 요구)<\/li><li>공소: 용도 없이 남은 폐위 공간(배치 결과)<\/li><\/ul>\n<h5>2. 코퍼댐이 요구되는 예<\/h5><p>연료유–청수 탱크 사이, 유조선 화물구역–기관실·거주구 사이(펌프실·밸러스트탱크로 대체 가능), 가스선 화물구역 경계, 윤활유–타 유류 사이<\/p>\n<h5>3. 설계 차이<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>코퍼댐<\/th><th>공소<\/th><\/tr><\/thead><tbody>\n<tr><td>목적<\/td><td>격리·누설 차단<\/td><td>기능 없음<\/td><\/tr>\n<tr><td>폭<\/td><td>검사 가능한 최소 폭(대략 600 mm 이상)<\/td><td>형상 자유<\/td><\/tr>\n<tr><td>출입·검사<\/td><td>맨홀·사다리, PMA 대상 여부<\/td><td>맨홀<\/td><\/tr>\n<tr><td>통기·측심<\/td><td>공기관·측심관(누설 감지), 가스 탐지<\/td><td>필요 시 공기관<\/td><\/tr>\n<tr><td>배수<\/td><td>빌지 흡입 또는 이동식 배수<\/td><td>배수 수단<\/td><\/tr>\n<tr><td>위험구역<\/td><td>화물구역 인접 시 방폭<\/td><td>위치 따라<\/td><\/tr>\n<tr><td>도장<\/td><td>내식, 밸러스트 겸용 시 PSPC<\/td><td>벌크선 이중선측 공소는 PSPC<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 코퍼댐은 \"누설을 발견하고 가두는 공간\"이므로 감지(측심·가스)와 접근 설계가 본질이며, 공소는 부식·검사 사각지대가 되지 않도록 관리해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"csr-load-scenarios","p":3,"n":"3.15","h":"공통구조규칙(CSR)의 설계하중 시나리오","t":"공통구조규칙(CSR)의 설계하중 시나리오","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 4번 · 10점"],"q":["<b>127회(2022) 1-4<\/b> CSR에서 정하는 설계하중 시나리오"],"k":"IACS CSR(벌크선·유조선 통합 CSR-BC&OT)은 하중을 운항 상황별 \"설계하중 시나리오\"로 묶어, 시나리오마다 정적(S)·정적+동적(S+D) 하중 조합과 그에 맞는 허용 기준(AC-S, AC-SD 등)을 대응시킨다. 같은 구조라도 시나리오에 따라 다른 하중과 허용치로 평가한다.","x":"\n<p class=\"key\">IACS CSR(벌크선·유조선 통합 CSR-BC&amp;OT)은 하중을 운항 상황별 \"설계하중 시나리오\"로 묶어, 시나리오마다 정적(S)·정적+동적(S+D) 하중 조합과 그에 맞는 허용 기준(AC-S, AC-SD 등)을 대응시킨다. 같은 구조라도 시나리오에 따라 다른 하중과 허용치로 평가한다.<\/p>\n<h4>시나리오 구성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시나리오<\/th><th>하중 성분<\/th><th>대표 평가<\/th><\/tr><\/thead><tbody>\n<tr><td>항해(seagoing) 운항<\/td><td>S+D: 정수 하중 + 파랑 동적 하중(10⁻⁸)<\/td><td>판·보강재, 화물창 FE 항복·좌굴(AC-SD)<\/td><\/tr>\n<tr><td>항내·차폐수역 운항, 하역<\/td><td>S: 정적 하중(항내 허용 SWBM)<\/td><td>AC-S (동적 성분 없으므로 허용치 더 엄격)<\/td><\/tr>\n<tr><td>밸러스트 교환<\/td><td>S, S+D<\/td><td>탱크 정수두, 종강도<\/td><\/tr>\n<tr><td>탱크 시험<\/td><td>S: 시험수두<\/td><td>시험 압력 강도<\/td><\/tr>\n<tr><td>사고(침수)<\/td><td>A: 침수 화물창 압력<\/td><td>침수 시 격벽·이중저 강도, 잔류 선체거더 강도<\/td><\/tr>\n<tr><td>충격<\/td><td>I: 선저 슬래밍, 선수 충격<\/td><td>국부 소성 기준(AC-I)<\/td><\/tr>\n<tr><td>슬로싱<\/td><td>SL: 부분 적재 탱크 액체 충격<\/td><td>탱크 경계 판·보강재<\/td><\/tr>\n<tr><td>피로<\/td><td>F: 10⁻² 수준 하중, 적재상태 비율<\/td><td>누적 손상(설계수명 25년)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>요점<\/h4>\n<ul>\n<li>동적 하중은 등가설계파(EDW: HSM, HSA, FSM, BSR, BSP, OST, OSA)로 최대 응답을 만든다.<\/li>\n<li>AC-SD가 AC-S보다 허용치가 큰 이유는 동적 하중이 이미 극값이기 때문이다(예: FE 항복 이용률 1.0 대 0.8).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시나리오<\/th><th>하중<\/th><th>기준<\/th><\/tr><\/thead><tbody>\n<tr><td>항해<\/td><td>S+D(10⁻⁸)<\/td><td>AC-SD<\/td><\/tr>\n<tr><td>항내·하역<\/td><td>S<\/td><td>AC-S(더 엄격)<\/td><\/tr>\n<tr><td>밸러스트 교환<\/td><td>S, S+D<\/td><td>탱크·종강도<\/td><\/tr>\n<tr><td>탱크 시험<\/td><td>S<\/td><td>시험수두<\/td><\/tr>\n<tr><td>침수<\/td><td>A<\/td><td>격벽·잔류강도<\/td><\/tr>\n<tr><td>충격·슬로싱<\/td><td>I, SL<\/td><td>국부 소성<\/td><\/tr>\n<tr><td>피로<\/td><td>F(10⁻²)<\/td><td>D ≤ 1, 25년<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>요점<\/b>: 동적 하중은 EDW(HSM·HSA·FSM·BSR·BSP·OST·OSA)로 생성. AC-SD가 큰 이유는 동적 하중이 이미 극값이기 때문(FE 1.0 대 0.8).<\/p><\/div><\/section><\/details>"},{"id":"csr-fe","p":3,"n":"3.16","h":"CSR 화물창 유한요소 해석의 위치별 화물창 구역 정의","t":"CSR 화물창 유한요소 해석의 위치별 화물창 구역 정의","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 2교시 5번 · 25점"],"q":["<b>130회(2023) 2-5<\/b> CSR에 따른 화물창 유한요소 구조해석의 위치별 화물창 구역 정의 기준"],"k":"CSR은 화물창 구역을 길이 방향 위치에 따라 중앙부(midship), 선수부(forward), 선미부(aft) 화물창 구역으로 나누고, 각 구역에서 대표 화물창을 중심으로 한 3창(또는 3탱크) 길이 모델로 FE 해석을 한다. 평가는 모델 가운데 창과 그 경계 격벽에서 한다.","x":"\n<p class=\"key\">CSR은 화물창 구역을 길이 방향 위치에 따라 중앙부(midship), 선수부(forward), 선미부(aft) 화물창 구역으로 나누고, 각 구역에서 대표 화물창을 중심으로 한 3창(또는 3탱크) 길이 모델로 FE 해석을 한다. 평가는 모델 가운데 창과 그 경계 격벽에서 한다.<\/p>\n<h4>구역 정의<\/h4>\n<ul>\n<li><b>중앙부 화물창 구역<\/b>: 화물창(탱크) 길이 중심이 선체 중앙 부근(대략 0.3L~0.7L)에 있는 화물창들. 형상이 같은 화물창이 반복되므로 대표 1개(형상이 다르면 각각) 모델.<\/li>\n<li><b>선수부 화물창 구역<\/b>: 중앙부 구역 앞쪽 화물창들. 최전방 화물창은 선형 변화(곡형 선측, 좁아지는 이중저)로 별도 모델.<\/li>\n<li><b>선미부 화물창 구역<\/b>: 중앙부 뒤쪽, 최후방 화물창(기관실 격벽 인접) 별도 모델.<\/li>\n<\/ul>\n<h4>모델과 평가<\/h4>\n<ul>\n<li>길이: 평가 대상 창 + 앞뒤 각 1창(½+1+½ 또는 1+1+1 구성), 선체 전폭(대칭이면 반폭 불가, 비대칭 하중 고려해 전폭).<\/li>\n<li>경계조건: 모델 양단 독립점·스프링, 선체거더 목표 굽힘·전단을 맞추는 단부 모멘트·전단 보정.<\/li>\n<li>메시: 조대 메시는 보강재 간격(s×s) 1요소, 응력집중부는 50×50 mm(t×t) 미세 메시.<\/li>\n<li>하중조건: 적재 패턴(만재, 격창, 밸러스트, 항내, 침수) × EDW 동적 하중.<\/li>\n<li>판정: 항복(조대·미세 메시 허용 이용률), 좌굴 이용률.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 구역 그림\">\n<h5>1. 구역 정의<\/h5><ul><li>중앙부: 창 길이 중심이 약 0.3L~0.7L, 반복 형상 → 대표 1개<\/li><li>선수부: 중앙부 앞, 최전방 창은 선형 변화로 별도 모델<\/li><li>선미부: 중앙부 뒤, 기관실 인접 최후방 창 별도<\/li><\/ul>\n<h5>2. 모델<\/h5><p>평가 창 + 앞뒤 각 1창(½+1+½ 또는 1+1+1), 전폭. 양단 독립점·스프링, 목표 굽힘·전단 맞춤 단부 보정.<\/p>\n<h5>3. 메시·하중·판정<\/h5><p>조대 메시 s×s, 응력집중부 50×50(t×t) 미세 메시. 적재 패턴(만재·격창·밸러스트·항내·침수) × EDW. 항복 이용률(조대·미세)·좌굴.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 평가는 중앙 창과 경계 격벽에서만 하며, 선수미 창은 형상 변화 때문에 별도 모델이 필수임.<\/p><\/div><\/section><\/details>"},{"id":"hts","p":3,"n":"3.17","h":"고장력강(High Tensile Steel)의 특성, 사용 시 유의사항, 대형 컨테이너선 DH/EH강 적용","t":"고장력강(High Tensile Steel)의 특성, 사용 시 유의사항, 대형 컨테이너선 DH/EH강 적용","c":3,"r":0,"b":[{"c":"hot","t":"3회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 2번 · 25점","115회 1교시 10번 · 10점","121회 3교시 3번 · 25점"],"q":["<b>112회(2017) 3-2<\/b> 고강도강(고장력강) 사용 시 유의사항","<b>115회(2018) 1-10<\/b> 고장력강(High tensile strength steel)","<b>121회(2020) 3-3<\/b> 14,000 TEU 컨테이너선 DH/EH 강재 사용부위와 특성, 용접·구조 관리점"],"k":"고장력강은 항복응력 315~460 MPa급 강재로, 판 두께를 줄여 강재중량을 줄인다. 그러나 탄성계수와 피로강도는 연강과 거의 같으므로 판을 얇게 할수록 좌굴·피로·처짐이 결정 조건이 되고, 후판은 용접 열영향부 인성과 취성균열 정지 성능을 관리해야 한다.","x":"\n<p class=\"key\">고장력강은 항복응력 315~460 MPa급 강재로, 판 두께를 줄여 강재중량을 줄인다. 그러나 탄성계수와 피로강도는 연강과 거의 같으므로 판을 얇게 할수록 좌굴·피로·처짐이 결정 조건이 되고, 후판은 용접 열영향부 인성과 취성균열 정지 성능을 관리해야 한다.<\/p>\n<h4>등급 체계<\/h4>\n<ul>\n<li>강도: 32(315 MPa), 36(355), 40(390), 47(460). 재료계수 k = 0.78, 0.72, 0.68, 0.62.<\/li>\n<li>인성 등급: AH(0 °C), DH(−20 °C), EH(−40 °C), FH(−60 °C) 샤르피 시험 온도.<\/li>\n<li>제조: TMCP(제어압연·가속냉각)로 낮은 탄소당량에서 강도 확보 → 용접성 양호. 대입열 용접용 강재(HAZ 인성 보증)도 있다.<\/li>\n<li>사용 위치별 재료 등급: IACS UR S6이 부재 등급(Class I·II·III)과 두께로 강재 등급을 정한다. 예: 0.4L 중앙부 현측후판·갑판 스트링거판은 Class III, L &gt; 250 m이면 E/EH 이상, 빌지 외판은 D/DH 이상.<\/li>\n<\/ul>\n<h4>사용 시 유의사항<\/h4>\n<ol>\n<li><b>좌굴<\/b>: 두께 감소로 σ<sub>cr<\/sub> ∝ (t/b)² 감소 → 보강재 간격 축소 또는 두께 하한.<\/li>\n<li><b>피로<\/b>: 피로강도는 항복응력과 거의 무관 → 허용응력 증가만큼 응력 범위가 커져 수명 감소. 상세 설계(소프트 토우, 그라인딩) 강화.<\/li>\n<li><b>강성·처짐<\/b>: E 동일 → 처짐·진동 고유진동수 저하.<\/li>\n<li><b>부식<\/b>: 부식 공제 두께는 같으므로 얇은 판일수록 상대 손실 큼.<\/li>\n<li><b>용접<\/b>: 저수소계 용접재료, 예열(두께·탄소당량에 따라), 입열 관리(HAZ 연화·인성 저하), 용접재료 강도 매칭.<\/li>\n<li><b>가공·관리<\/b>: 가스절단·선상가열 온도 제한(TMCP 강은 고온 가열 시 강도 저하 → 가열 온도 상한 준수), 강재 식별 표시와 추적(오시공 방지).<\/li>\n<\/ol>\n<h4>14,000 TEU급 컨테이너선의 DH/EH 강재 적용<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>부위<\/th><th>강재·특성<\/th><th>관리점<\/th><\/tr><\/thead><tbody>\n<tr><td>해치코밍 상판·측판, 상갑판, 현측후판<\/td><td>EH40/EH47, 두께 50~100 mm, 취성균열 정지(BCA)강<\/td><td>대개구 단면으로 갑판부 응력이 커서 고강도 후판 필수<\/td><\/tr>\n<tr><td>빌지 외판, 선저 일부<\/td><td>DH36/EH36<\/td><td>UR S6 등급<\/td><\/tr>\n<tr><td>종격벽 상부, 상부 박스 거더<\/td><td>DH/EH36~40<\/td><td>비틀림·뒤틀림 응력<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>용접<\/b>: 블록 이음의 극후판은 일렉트로가스용접(EGW) 같은 대입열 1패스 용접을 쓴다. HAZ 인성 저하를 막기 위해 대입열 대응 강재와 용접재료, CTOD 시험으로 품질 확인. 수소 균열 방지 예열.<\/li>\n<li><b>구조<\/b>: IACS UR S33(취성균열 정지 대책, 두께 50 mm 초과)과 W31(YP47강) — 블록 이음 100% UT, 갑판·코밍 BCA강 적용, 블록 이음 엇갈림 배치, 균열 정지 구멍·인서트 등으로 균열이 한 부재에서 전체로 진전하지 않게 설계.<\/li>\n<li><b>피로<\/b>: 해치 코너, 코밍 단부(deckhouse 전단부) 상세의 미세 메시 피로 평가.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 3회 출제<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>배점<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">115-1-10<\/td><td>고장력강<\/td><td class=\"num\">10<\/td><td>등급 체계, k, 장단점<\/td><\/tr>\n<tr><td class=\"num\">112-3-2<\/td><td>고장력강 사용 시 유의사항<\/td><td class=\"num\">25<\/td><td>좌굴·피로·처짐을 수치로<\/td><\/tr>\n<tr><td class=\"num\">121-3-3<\/td><td>14,000 TEU DH/EH 사용 부위·특성·용접 관리점<\/td><td class=\"num\">25<\/td><td>해치코밍·상갑판 후판, EGW, UR S33<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 115회형\">\n<h5>1. 정의<\/h5>\n<p>고장력강: 항복응력 315 MPa(32급) 이상의 선체 구조용강. 판 두께를 줄여 강재중량 감소.<\/p>\n<h5>2. 등급<\/h5>\n<div class=\"calc\">강도: 32(315 MPa, k=0.78) · 36(355, 0.72) · 40(390, 0.68) · 47(460, 0.62)\n인성: AH(0 °C) · DH(−20 °C) · EH(−40 °C) · FH(−60 °C) 샤르피 시험온도<\/div>\n<h5>3. 특징<\/h5>\n<ul><li>TMCP로 낮은 탄소당량 → 용접성 양호<\/li><li>탄성계수·피로강도는 연강과 동일 → 좌굴·피로·처짐 불리<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 중량 절감만 보고 적용하면 피로 수명이 줄어드므로 상세 설계 강화가 함께 필요함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 112회형(사용 시 유의사항)\">\n<h5>1. 개요<\/h5>\n<p>고장력강은 허용응력을 키워 판 두께를 줄이지만, 강도 이외의 파괴양식(좌굴·피로)과 강성은 개선되지 않으므로 이를 보완하는 설계·시공 관리가 필요함.<\/p>\n<h5>2. 정량적 영향(AH36으로 전면 대체, 규칙 한계까지 감후 가정)<\/h5>\n<div class=\"calc\">요구 판두께 t ∝ √k → 0.85배 (15% 감소)\n작용 응력 ∝ 1/k → 1.39배\n피로 수명 ∝ Δσ^(−3) → 0.72³ = 0.37배\n탄성 좌굴응력 σ_E ∝ t² → 약 0.72배<\/div>\n<h5>3. 유의사항<\/h5>\n<ol><li><b>좌굴<\/b>: 압축 갑판·선저·종격벽 판 → 보강재 간격 축소, 최소 두께<\/li>\n<li><b>피로<\/b>: 응력 범위 증가 → 소프트 토우, 그라인딩, 상세 개선, 피로 해석 범위 확대<\/li>\n<li><b>강성·진동<\/b>: E 동일 → 처짐 증가, 고유진동수 저하 검토<\/li>\n<li><b>부식<\/b>: 부식 공제 두께 동일 → 얇은 판일수록 상대 손실 증가<\/li>\n<li><b>용접<\/b>: 저수소 용접재료, 예열(탄소당량·두께), 입열 상한(HAZ 인성), 강도 매칭<\/li>\n<li><b>가공<\/b>: 선상가열 온도 상한(TMCP 강도 저하), 냉간 가공 변형률<\/li>\n<li><b>관리<\/b>: 강재 식별·추적(오시공 방지), 등급별 표시<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 고장력강 적용은 \"강도는 얻고 피로·좌굴·강성은 잃는다\"는 trade-off로 판단해야 하며, 고응력 피로 상세부는 오히려 연강·두께 유지가 유리할 수 있음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"wrong-material","p":3,"n":"3.18","h":"외판 재질 HT36 자리에 HT32가 잘못 시공된 경우의 조치","t":"외판 재질 HT36 자리에 HT32가 잘못 시공된 경우의 조치","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 1번 · 25점"],"q":["<b>127회(2022) 3-1<\/b> 외판 재질 HT36이 HT32로 잘못 시공된 경우의 조치방법"],"k":"먼저 부적합(NCR)으로 등록하고 범위를 추적한 뒤, HT32 재질로 해당 부재의 강도를 재평가한다. 재평가로 규칙과 선주 사양을 만족하면 선급·선주 승인을 받아 수용(도면 변경)할 수 있고, 만족하지 못하면 해당 판을 절단 교체하는 것이 원칙이다. 덧판(doubler)으로 때우는 것은 1차 강력 부재에서는 받아들여지지 않는다.","x":"\n<p class=\"key\">먼저 부적합(NCR)으로 등록하고 범위를 추적한 뒤, HT32 재질로 해당 부재의 강도를 재평가한다. 재평가로 규칙과 선주 사양을 만족하면 선급·선주 승인을 받아 수용(도면 변경)할 수 있고, 만족하지 못하면 해당 판을 절단 교체하는 것이 원칙이다. 덧판(doubler)으로 때우는 것은 1차 강력 부재에서는 받아들여지지 않는다.<\/p>\n<h4>1. 사실 확인과 범위 추적<\/h4>\n<ul>\n<li>강재 표시(heat no., 등급 각인), 밀 시트(mill certificate), 절단 계획(nesting) 기록으로 오시공 판 확인.<\/li>\n<li>같은 강재 로트·같은 네스팅 판이 다른 위치에 쓰였는지 전수 추적. 반대로 HT36 판이 HT32 위치에 간 경우(대체 오류)도 함께 확인.<\/li>\n<li>인성 등급(AH/DH/EH) 일치 여부 확인(예: DH36 → DH32이면 인성은 같고 강도만 낮음).<\/li>\n<\/ul>\n<h4>2. 강도 영향 평가<\/h4>\n<div class=\"eq\"><div class=\"eql\">선체거더 허용응력 175/k: 243 → 224 MPa (약 8% 감소)<\/div><div class=\"mj\">\\[k_{HT36}=0.72\\ \\longrightarrow\\ k_{HT32}=0.78\\]<\/div><\/div>\n<ul>\n<li><b>국부 강도<\/b>: 요구 판두께 t ∝ √k 이므로 약 4% 증가 필요, 보강재 단면계수 Z ∝ k 로 약 8% 증가 필요. 원 설계 여유와 비교.<\/li>\n<li><b>선체거더<\/b>: 해당 판이 갑판·선저처럼 중립축에서 멀면 종강도 허용응력 감소 영향 확인. 정수중 굽힘모멘트 허용값 재산정.<\/li>\n<li><b>좌굴<\/b>: 탄성좌굴은 E에만 의존하나 항복 근처 보정에서 σ<sub>Y<\/sub>가 낮아 임계응력 약간 감소.<\/li>\n<li><b>FE·피로<\/b>: 화물창 FE 항복 이용률 재계산, 피로는 S-N 동일하므로 영향 작음.<\/li>\n<\/ul>\n<h4>3. 대안 결정<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대안<\/th><th>조건<\/th><th>비고<\/th><\/tr><\/thead><tbody>\n<tr><td>재평가 후 수용(concession)<\/td><td>실제 응력 여유가 충분, 규칙 만족<\/td><td>선급 승인, 선주 동의, 도면·재료 기록 수정<\/td><\/tr>\n<tr><td>판 교체(cut-out &amp; insert)<\/td><td>여유 부족 또는 선주 거부<\/td><td>교체 범위·용접 절차(WPS), 인접부 변형 관리, NDT<\/td><\/tr>\n<tr><td>두께 증가 판으로 교체<\/td><td>HT32를 써야 하는 공급 제약 시<\/td><td>보강재·인접판 두께 차 테이퍼, 중량 증가<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>4. 재발 방지<\/h4>\n<ul>\n<li>원인 분석(입고 식별, 절단장 혼입, 표시 누락), 강재 바코드·RFID 추적, 탑재 전 재질 확인 체크리스트, 등급별 색 표시.<\/li>\n<li>품질 기록과 선급 보고, 유사 공정 수평 전개.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 사실 확인·범위<\/h5><p>NCR 등록. heat no.·등급 각인·밀 시트·네스팅으로 확인, 동일 로트 전수 추적, 역오류(HT36이 HT32 위치에 쓰임) 확인, 인성 등급 일치 확인.<\/p>\n<h5>2. 강도 평가<\/h5><div class=\"calc\">k: 0.72 → 0.78,  175/k: 243 → 224 MPa (약 8%↓)\n판 t ∝ √k → 약 4%↑ 필요,  보강재 Z ∝ k → 약 8%↑ 필요<\/div><p>종강도(중립축에서 먼 판), 좌굴(J-O 보정에서 σ<sub>Y<\/sub> 영향), FE 항복 재계산, 피로 영향 작음.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대안<\/th><th>조건<\/th><\/tr><\/thead><tbody>\n<tr><td>재평가 후 수용(concession)<\/td><td>여유 충분, 선급·선주 승인, 도면 수정<\/td><\/tr>\n<tr><td>판 교체(cut-out &amp; insert)<\/td><td>여유 부족·선주 거부, WPS·NDT<\/td><\/tr>\n<tr><td>두께 증가 판 교체<\/td><td>공급 제약, 테이퍼, 중량↑<\/td><\/tr>\n<\/tbody><\/table><\/div><p>1차 강력 부재 doubler 보수는 불가.<\/p>\n<h5>3. 재발 방지<\/h5><p>입고 식별, 바코드·RFID, 탑재 전 체크리스트, 등급 색 표시, 수평 전개.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 계산 여유가 있어도 선주 동의 없이는 수용할 수 없으므로, 근거 계산서와 교체 공정 영향을 함께 제시해야 함.<\/p><\/div><\/section><\/details>"},{"id":"hull-defects","p":3,"n":"3.19","h":"선체구조에 발생하는 대표적인 결함의 종류","t":"선체구조에 발생하는 대표적인 결함의 종류","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 2교시 1번 · 25점"],"q":["<b>127회(2022) 2-1<\/b> 선체구조에 발생하는 대표적인 결함의 종류"],"k":"선체 결함은 건조 중 생기는 제작 결함(용접 결함, 정렬 불량, 변형, 재료 오류)과 운항 중 생기는 손상(균열, 부식, 좌굴·변형, 도막 손상)으로 나뉜다. 운항 결함의 대부분은 제작 결함과 상세 설계의 응력집중에서 시작한다.","x":"\n<p class=\"key\">선체 결함은 건조 중 생기는 제작 결함(용접 결함, 정렬 불량, 변형, 재료 오류)과 운항 중 생기는 손상(균열, 부식, 좌굴·변형, 도막 손상)으로 나뉜다. 운항 결함의 대부분은 제작 결함과 상세 설계의 응력집중에서 시작한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>결함<\/th><th>대표 위치·원인<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"4\">제작<\/td><td>용접 결함(균열, 기공, 슬래그, 용입 불량, 언더컷)<\/td><td>입열·자세·청결 관리 미흡<\/td><\/tr>\n<tr><td>정렬 불량(misalignment)<\/td><td>격벽-거더 십자 이음, 블록 이음 단차 → 2차 굽힘응력<\/td><\/tr>\n<tr><td>용접 변형<\/td><td>얇은 판 외판 요철(hungry horse), 갑판 처짐<\/td><\/tr>\n<tr><td>재료 오류<\/td><td>강재 등급 오시공, 라미네이션<\/td><\/tr>\n<tr><td rowspan=\"4\">운항<\/td><td>피로 균열<\/td><td>해치 코너, 브래킷 토우, 선측 종늑골-횡웨브 연결부, 호퍼 너클, 하부 스툴, 슬롯, 빌지킬 끝단<\/td><\/tr>\n<tr><td>부식(전면, 피팅, 그루빙)<\/td><td>밸러스트탱크(도막 열화), 화물유 탱크 저판 피팅, 용접선 그루빙<\/td><\/tr>\n<tr><td>좌굴·변형<\/td><td>압축 갑판·종격벽, 하역 장비 충격(그랩), 접안 충격<\/td><\/tr>\n<tr><td>도막 손상<\/td><td>모서리·용접선 박리, 음극방식 부족<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>검사·평가는 IACS 강화검사(ESP) 체계, 두께 계측, 근접검사로 하고, 수리는 원인(응력집중, 부식 환경)을 제거하는 상세 개선과 함께 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>결함<\/th><th>위치·원인<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"4\">제작<\/td><td>용접 결함<\/td><td>균열·기공·슬래그·용입 불량·언더컷<\/td><\/tr>\n<tr><td>정렬 불량<\/td><td>십자 이음·블록 이음 단차 → 2차 굽힘<\/td><\/tr>\n<tr><td>용접 변형<\/td><td>박판 hungry horse, 갑판 처짐<\/td><\/tr>\n<tr><td>재료 오류<\/td><td>등급 오시공, 라미네이션<\/td><\/tr>\n<tr><td rowspan=\"4\">운항<\/td><td>피로 균열<\/td><td>해치 코너, 브래킷 토우, 종늑골-웨브, 호퍼 너클, 스툴, 슬롯<\/td><\/tr>\n<tr><td>부식<\/td><td>밸러스트탱크, 저판 피팅, 그루빙<\/td><\/tr>\n<tr><td>좌굴·변형<\/td><td>압축 갑판, 그랩·접안 충격<\/td><\/tr>\n<tr><td>도막 손상<\/td><td>모서리·용접선, 음극방식 부족<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>검사·수리<\/h5><p>ESP 강화검사, 두께 계측, 근접검사 → 응력집중·부식 환경 원인 제거 상세 개선.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 운항 결함 대부분은 제작 결함과 응력집중 상세에서 시작하므로 설계·건조 품질이 근본 대책임.<\/p><\/div><\/section><\/details>"},{"id":"clad","p":3,"n":"3.20","h":"클래드강(Clad Steel)의 사용목적, 제조방법, 특성, 용접 및 시공 주의사항","t":"클래드강(Clad Steel)의 사용목적, 제조방법, 특성, 용접 및 시공 주의사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 4번 · 25점"],"q":["<b>139회(2026) 3-4<\/b> Clad Steel의 사용목적, 제조방법, 특성, 용접 및 시공 시 주의사항"],"k":"클래드강은 탄소강 모재 위에 스테인리스강이나 니켈합금을 금속학적으로 접합한 복합 강판이다. 내식층은 부식을, 모재는 강도를 맡아 전체를 내식 합금으로 만드는 것보다 싸다. 용접은 모재와 내식층을 구분해 희석(dilution)을 관리하는 것이 핵심이다.","x":"\n<p class=\"key\">클래드강은 탄소강 모재 위에 스테인리스강이나 니켈합금을 금속학적으로 접합한 복합 강판이다. 내식층은 부식을, 모재는 강도를 맡아 전체를 내식 합금으로 만드는 것보다 싸다. 용접은 모재와 내식층을 구분해 희석(dilution)을 관리하는 것이 핵심이다.<\/p>\n<h4>사용 목적과 적용<\/h4>\n<ul>\n<li>케미컬 탱커 화물탱크, 배기가스 세정장치(스크러버) 내부, 해양플랜트 압력용기·배관, 해수 접촉 설비.<\/li>\n<li>내식 합금 사용량을 1/5~1/10로 줄여 원가 절감, 탄소강 수준의 강도·용접 구조성 유지.<\/li>\n<\/ul>\n<h4>제조 방법<\/h4>\n<ul>\n<li><b>압연 접합(hot roll bonding)<\/b>: 모재와 합금판을 진공 밀봉 조립 후 열간압연. 대면적·대량생산, 가장 일반적.<\/li>\n<li><b>폭발 접합(explosive bonding)<\/b>: 폭약 충격으로 접합, 물결 모양 경계. 이종 금속·후판.<\/li>\n<li><b>육성 용접(weld overlay)<\/b>: 모재에 내식 합금을 용접으로 입힘. 곡면·부분 적용.<\/li>\n<\/ul>\n<h4>특성<\/h4>\n<ul>\n<li>접합 전단강도 요구(예: ASTM A264 기준 이상), 초음파 탐상으로 접합률 확인.<\/li>\n<li>열팽창계수 차이(오스테나이트계가 큼) → 열변형·잔류응력.<\/li>\n<li>내식층 두께 2~4 mm 수준. 철 오염 시 녹 발생.<\/li>\n<\/ul>\n<h4>용접 순서와 주의<\/h4>\n<ol>\n<li><b>개선<\/b>: 내식층 쪽을 이음 가장자리에서 일부 제거(strip back)해 탄소강 용접 시 합금 희석을 방지.<\/li>\n<li><b>모재 용접<\/b>: 탄소강 용접재료로 모재 쪽부터 용접, 내식층까지 용입되지 않게.<\/li>\n<li><b>뒷면 가우징<\/b> 후 모재 이면 용접.<\/li>\n<li><b>버퍼층<\/b>: 고합금 용접재료(309L·309MoL)로 희석을 보상하는 중간층.<\/li>\n<li><b>내식층 용접<\/b>: 모재와 같은 계열(316L 등)로 최종층. 페라이트 함량 관리, 층간 온도 제한(예민화 방지).<\/li>\n<\/ol>\n<h4>시공 주의<\/h4>\n<ul>\n<li>스테인리스 전용 공구·작업장, 탄소강 분진·스패터 차단(철 오염).<\/li>\n<li>절단은 플라즈마 등, 표시는 염화물 없는 마커.<\/li>\n<li>용접 후 산세·부동태화(pickling &amp; passivation), PT 검사, 페라이트 측정.<\/li>\n<li>취급 시 내식면 보호 필름, 리프팅 자석 사용 제한.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 이음 그림\">\n<h5>1. 목적<\/h5><p>탄소강 모재(강도) + 스테인리스·Ni합금(내식). 케미컬 탱커, 스크러버, 해양 압력용기. 합금 사용량 1/5~1/10.<\/p>\n<h5>2. 제조<\/h5><p>압연 접합(가장 일반), 폭발 접합(물결 경계, 후판·이종), 육성 용접(곡면·부분).<\/p>\n<h5>3. 특성<\/h5><p>접합 전단강도(ASTM A264), UT 접합률, 열팽창계수 차 → 변형·잔류응력, 내식층 2~4 mm, 철 오염 녹.<\/p>\n<h5>4. 용접 순서<\/h5><ol><li>개선부 내식층 strip back<\/li><li>탄소강 재료로 모재 용접(내식층 미용입)<\/li><li>이면 가우징·모재 이면 용접<\/li><li>버퍼층 309L·309MoL(희석 보상)<\/li><li>최종층 316L 등, 페라이트·층간온도 관리(예민화 방지)<\/li><\/ol>\n<h5>5. 시공 주의<\/h5><p>전용 공구·작업장, 탄소강 분진·스패터 차단, 플라즈마 절단, 염화물 없는 마커, 산세·부동태화, PT, 자석 리프팅 제한.<\/p>\n<p class=\"concl\"><b>6. 결론<\/b>: 희석과 철 오염 관리가 품질의 전부이며, WPS 단계에서 층별 용접재료와 strip back 치수를 정해야 함.<\/p><\/div><\/section><\/details>"},{"id":"sdof","p":4,"n":"4.1","h":"1자유도 스프링-질량계(감쇠 없음)의 고유진동수 풀이","t":"1자유도 스프링-질량계(감쇠 없음)의 고유진동수 풀이","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 4교시 5번 · 25점"],"q":["<b>121회(2020) 4-5<\/b> 1자유도 스프링-질량계(c=0)의 고유진동수 풀이"],"k":"질량 M과 스프링 상수 k로 된 비감쇠 1자유도계의 운동방정식은 M·ẍ + k·x = 0이고, 해는 조화운동이다. 고유각진동수 ωn = √(k/M), 고유진동수 fn = (1/2π)·√(k/M), 주기 T = 2π√(M/k)다.","x":"\n<p class=\"key\">질량 M과 스프링 상수 k로 된 비감쇠 1자유도계의 운동방정식은 M·ẍ + k·x = 0이고, 해는 조화운동이다. 고유각진동수 ω<sub>n<\/sub> = √(k/M), 고유진동수 f<sub>n<\/sub> = (1/2π)·√(k/M), 주기 T = 2π√(M/k)다.<\/p>\n<h4>풀이 과정<\/h4>\n<ol>\n<li><b>자유물체도<\/b>: 평형 위치에서 x만큼 변위시키면 스프링 복원력 −kx가 질량에 작용한다(정적 처짐에 의한 중력과 스프링 초기력은 평형에서 상쇄).<\/li>\n<li><b>뉴턴 제2법칙<\/b>: ΣF = Mẍ ⇒ −kx = Mẍ ⇒ \\(M\\ddot{x}+kx=0\\).<\/li>\n<li><b>해 가정<\/b>: x(t) = A sin(ωt + φ) 를 대입하면 (−Mω² + k)A sin(ωt + φ) = 0.<\/li>\n<li><b>특성방정식<\/b>: A ≠ 0 이려면 k − Mω² = 0 ⇒ \\(\\omega_n=\\sqrt{k/M}\\) [rad/s].<\/li>\n<li><b>진동수·주기<\/b>: f<sub>n<\/sub> = ω<sub>n<\/sub>/2π [Hz], T<sub>n<\/sub> = 1/f<sub>n<\/sub>. 정적 처짐 δ<sub>st<\/sub> = Mg/k를 쓰면 f<sub>n<\/sub> = (1/2π)√(g/δ<sub>st<\/sub>).<\/li>\n<\/ol>\n<div class=\"eq\"><div class=\"eql\">에너지법으로 확인<\/div><div class=\"mj\">\\[\\tfrac12 M\\dot{x}_{max}^2=\\tfrac12 k\\,x_{max}^2,\\qquad \\dot{x}_{max}=\\omega\\,x_{max}\\ \\Rightarrow\\ \\omega^2=\\dfrac{k}{M}\\]<\/div><\/div>\n<h4>스프링 조합<\/h4>\n<div class=\"eq\"><div class=\"eql\">병렬 / 직렬<\/div><div class=\"mj\">\\[k_{eq}=k_1+k_2,\\qquad \\dfrac{1}{k_{eq}}=\\dfrac{1}{k_1}+\\dfrac{1}{k_2}\\]<\/div><\/div>\n<h4>수치 예<\/h4>\n<p>M = 2,000 kg, k = 8 × 10⁶ N/m 이면 ω<sub>n<\/sub> = √(4,000) = 63.2 rad/s, f<sub>n<\/sub> = 10.1 Hz, T = 0.099 s.<\/p>\n<h4>확장: 감쇠·강제진동<\/h4>\n<div class=\"eq\"><div class=\"eql\">감쇠 강제진동과 동적 확대계수<\/div><div class=\"mj\">\\[M\\ddot{x}+c\\dot{x}+kx=F_0\\sin\\omega t,\\quad \\zeta=\\dfrac{c}{2\\sqrt{kM}},\\quad \\dfrac{X}{X_{st}}=\\dfrac{1}{\\sqrt{(1-r^2)^2+(2\\zeta r)^2}},\\ \\ r=\\dfrac{\\omega}{\\omega_n}\\]<\/div><\/div>\n<p>r = 1 근처에서 공진이 일어나므로, 선박 설계에서는 기진 주파수(프로펠러 날개진동수 Z·n, 기관 차수)와 구조 고유진동수를 대략 ±20% 이상 떼어 놓는다(주파수 계획).<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 계산형\">\n<h5>1. 운동방정식<\/h5><p>평형에서 x 변위 → 복원력 −kx → Mẍ = −kx → Mẍ + kx = 0<\/p>\n<h5>2. 풀이<\/h5><div class=\"calc\">x = A·sin(ωt + φ) 대입 → (k − Mω²)·A = 0\nω_n = √(k/M) [rad/s],  f_n = ω_n/2π [Hz],  T = 2π√(M/k)\nf_n = (1/2π)·√(g/δ_st)  (δ_st = Mg/k)<\/div>\n<h5>3. 검증(에너지법)<\/h5><div class=\"calc\">½M·ẋ²max = ½k·x²max,  ẋmax = ω·xmax → ω² = k/M<\/div>\n<h5>4. 수치 예<\/h5><div class=\"calc\">M = 2,000 kg, k = 8×10⁶ N/m → ω_n = 63.2 rad/s, f_n = 10.1 Hz, T = 0.099 s<\/div>\n<h5>5. 확장<\/h5><p>병렬 k₁+k₂, 직렬 1/(1/k₁+1/k₂). 감쇠·강제: 확대계수 1/√[(1−r²)² + (2ζr)²], r = 1 공진.<\/p>\n<p class=\"concl\"><b>6. 결론<\/b>: 선박은 기진 주파수와 고유진동수를 ±20% 이상 떼는 주파수 계획으로 공진을 피함.<\/p><\/div><\/section><\/details>"},{"id":"vibration-sources","p":4,"n":"4.2","h":"선박 진동의 발생원인(주요 기진원과 기진력 성분)과 방진대책","t":"선박 진동의 발생원인(주요 기진원과 기진력 성분)과 방진대책","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 5번 · 25점","115회 2교시 1번 · 25점"],"q":["<b>112회(2017) 3-5<\/b> 선박 진동 발생원인과 방진대책","<b>115회(2018) 2-1<\/b> 선박의 주요 기진원과 기진력 성분에 따른 진동의 종류"],"k":"선박 진동의 주 기진원은 프로펠러(선체 표면 압력변동과 축계 베어링력)와 주기관(불평형 모멘트, 가이드력 모멘트, 토크 변동)이다. 진동은 기진력·전달경로·응답(공진)의 곱이므로, 대책도 기진원 저감, 공진 회피(주파수 계획), 전달 차단, 수감부 보강의 순서로 세운다.","x":"\n<p class=\"key\">선박 진동의 주 기진원은 프로펠러(선체 표면 압력변동과 축계 베어링력)와 주기관(불평형 모멘트, 가이드력 모멘트, 토크 변동)이다. 진동은 기진력·전달경로·응답(공진)의 곱이므로, 대책도 기진원 저감, 공진 회피(주파수 계획), 전달 차단, 수감부 보강의 순서로 세운다.<\/p>\n<h4>주요 기진원과 성분<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>기진원<\/th><th>기진력 성분<\/th><th>주파수<\/th><th>유발 진동<\/th><\/tr><\/thead><tbody>\n<tr><td rowspan=\"2\">프로펠러<\/td><td>선체 표면 압력변동(캐비테이션 체적 변동이 지배)<\/td><td>Z·n과 고조파<\/td><td>선미부·상부구조 국부 진동, 선체거더 진동<\/td><\/tr>\n<tr><td>축계 베어링력(비균일 반류 → 추력·토크·횡력 변동)<\/td><td>Z·n<\/td><td>축계 종·비틀림 진동, 선미 진동<\/td><\/tr>\n<tr><td rowspan=\"4\">주기관(저속 2행정)<\/td><td>1차·2차 외부 불평형 모멘트(M1V, M2V)<\/td><td>1·2 × rpm<\/td><td>선체거더 상하 진동(2절점)<\/td><\/tr>\n<tr><td>가이드력 모멘트(H형, X형)<\/td><td>실린더 수 차수<\/td><td>기관 횡진동, 기관실·상부구조<\/td><\/tr>\n<tr><td>가스압·관성 토크 변동<\/td><td>실린더 수 차수<\/td><td>축계 비틀림 진동<\/td><\/tr>\n<tr><td>추력 변동<\/td><td>-<\/td><td>축계 종진동 → 상부구조 전후 진동<\/td><\/tr>\n<tr><td>보기·장비<\/td><td>발전기관, 펌프, 압축기, 스러스터<\/td><td>회전수<\/td><td>국부 진동<\/td><\/tr>\n<tr><td>파랑<\/td><td>스프링잉(연속 공진), 휘핑(슬래밍 과도 응답)<\/td><td>선체거더 고유진동수<\/td><td>선체거더 진동, 피로<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>진동의 종류<\/h4>\n<ul>\n<li><b>전선(hull girder) 진동<\/b>: 상하·수평 굽힘(2절점, 3절점), 비틀림. 고유진동수는 대형선에서 1 Hz 안팎.<\/li>\n<li><b>국부 진동<\/b>: 상부구조 전후 진동, 판넬·보강재, 마스트, 배관.<\/li>\n<li><b>축계 진동<\/b>: 비틀림, 종(축방향), 횡(휘돌림).<\/li>\n<li>성격별로 강제진동(기진 주파수에서 응답)과 공진(고유진동수 일치)으로 구분.<\/li>\n<\/ul>\n<div class=\"eq\"><div class=\"eql\">선체거더 2절점 상하 고유진동수(Schlick 형), 단위 cpm<\/div><div class=\"mj\">\\[N=\\varphi\\sqrt{\\dfrac{I}{\\Delta\\,L^3}}\\]<\/div><\/div>\n<h4>방진대책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>기진원<\/td><td>프로펠러: 스큐·날개 끝 하중 경감·날개수 선정·선체 간격 확보·반류 균일화. 주기관: 2차 모멘트 보상기(전기식 밸런서), 가이드력 대응 상부 지지대(top bracing), 실린더 수·점화순서 선정<\/td><\/tr>\n<tr><td>공진 회피<\/td><td>설계 초기 주파수 계획: 상부구조·선미 구조 고유진동수를 기진 주파수와 ±20% 이상 이격, FE 진동 해석<\/td><\/tr>\n<tr><td>전달 차단<\/td><td>발전기관·펌프 탄성 마운트, 배관 탄성 지지, 거주구 분리 배치<\/td><\/tr>\n<tr><td>수감부<\/td><td>상부구조 지지 격벽 정렬, 기둥 추가, 판넬 보강<\/td><\/tr>\n<tr><td>운항<\/td><td>위험 회전수 영역(BSR) 신속 통과, 진동 계측 후 보완<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-3-5<\/td><td>진동 발생원인과 방진대책<\/td><td>원인 → 대책 4단계(기진원·공진·전달·수감)<\/td><\/tr>\n<tr><td class=\"num\">115-2-1<\/td><td>주요 기진원과 기진력 성분별 진동 종류<\/td><td>기진원별 주파수 성분 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>진동 = 기진력 × 전달 × 응답(공진 증폭). 주 기진원은 프로펠러와 주기관임.<\/p>\n<h5>2. 기진원과 성분<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>기진원<\/th><th>성분<\/th><th>주파수<\/th><th>진동<\/th><\/tr><\/thead><tbody>\n<tr><td>프로펠러<\/td><td>선체 압력변동, 베어링력<\/td><td>Z·n<\/td><td>선미·상부구조 국부, 축계<\/td><\/tr>\n<tr><td>주기관<\/td><td>1·2차 불평형 모멘트<\/td><td>1·2×rpm<\/td><td>선체거더 상하<\/td><\/tr>\n<tr><td>주기관<\/td><td>가이드력 모멘트<\/td><td>실린더 수 차수<\/td><td>기관 횡진동<\/td><\/tr>\n<tr><td>주기관<\/td><td>토크·추력 변동<\/td><td>실린더 수 차수<\/td><td>축계 비틀림·종진동<\/td><\/tr>\n<tr><td>파랑<\/td><td>스프링잉·휘핑<\/td><td>선체거더 고유<\/td><td>전선 진동, 피로<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 진동의 종류<\/h5><p>전선(상하·수평 굽힘, 비틀림), 국부(상부구조 전후, 판넬, 마스트), 축계(비틀림·종·횡)<\/p>\n<h5>4. 방진대책<\/h5><ol><li>기진원: 스큐·날개 끝 하중 경감·선체 간격, 2차 모멘트 보상기, 상부 지지대<\/li><li>공진 회피: 주파수 계획(±20% 이격), FE 진동해석<\/li><li>전달 차단: 탄성 마운트, 배관 탄성 지지<\/li><li>수감부: 상부구조 지지 격벽 정렬, 기둥, 보강<\/li><li>운항: BSR 신속 통과, 계측 후 보완<\/li><\/ol>\n<p class=\"concl\"><b>5. 결론<\/b>: 진동 문제는 시운전 후 해결 비용이 매우 크므로, 설계 초기 주파수 계획이 가장 경제적인 대책임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"vibration-effects","p":4,"n":"4.3","h":"선체진동이 선박에 미치는 영향","t":"선체진동이 선박에 미치는 영향","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 3교시 6번 · 25점"],"q":["<b>136회(2025) 3-6<\/b> 선체진동이 선박에 미치는 영향"],"k":"선체진동은 구조 피로 균열, 기기·계측장비 고장, 승조원 거주성과 작업능력 저하, 소음 증가를 일으킨다. 그래서 설계 단계에서 국제 기준(ISO 6954, ISO 20283-5)과 선급 쾌적성 표기 기준을 계약 사양으로 정하고 시운전에서 계측해 검증한다.","x":"\n<p class=\"key\">선체진동은 구조 피로 균열, 기기·계측장비 고장, 승조원 거주성과 작업능력 저하, 소음 증가를 일으킨다. 그래서 설계 단계에서 국제 기준(ISO 6954, ISO 20283-5)과 선급 쾌적성 표기 기준을 계약 사양으로 정하고 시운전에서 계측해 검증한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>영향 대상<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>구조<\/td><td>고주기 피로 균열(상부구조 단부, 선미 판넬, 배관 지지대, 마스트), 볼트 풀림, 용접부 손상<\/td><\/tr>\n<tr><td>기기<\/td><td>베어링·씰 마모, 전자·계측장비 오작동, 레이더 마스트 진동으로 항해장비 성능 저하, 축계·기어 손상<\/td><\/tr>\n<tr><td>사람<\/td><td>멀미·피로·수면 방해, 작업 정밀도 저하, 장기 노출 건강 영향(MLC 2006 거주 기준과 연계)<\/td><\/tr>\n<tr><td>소음<\/td><td>구조 전달 소음 증가(IMO 소음 코드 한도 초과 위험)<\/td><\/tr>\n<tr><td>화물<\/td><td>민감 화물 손상, 고박 장치 이완<\/td><\/tr>\n<tr><td>상업<\/td><td>인도 지연, 보증 클레임, 개조 비용, 선박 평판<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>평가 기준<\/h4>\n<ul>\n<li>ISO 6954:2000(1~80 Hz 주파수 가중 r.m.s. 속도): 승조원 거주구역 대략 4~6 mm/s, 작업구역 5~7 mm/s, 여객 2~4 mm/s 범위(하한 이하는 불만 없음, 상한 초과는 불만 예상).<\/li>\n<li>ISO 20283-5(2016)가 측정·평가 절차를 갱신했고, 선급 쾌적성 표기(DNV COMF-V 등)는 등급별 한도를 둔다.<\/li>\n<li>기기 진동: 국부 장비 제조사 허용치, 구조 진동은 응력 기준으로 피로 평가.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대상<\/th><th>영향<\/th><\/tr><\/thead><tbody>\n<tr><td>구조<\/td><td>고주기 피로 균열(상부구조 단부, 선미 판넬, 배관 지지), 볼트 풀림<\/td><\/tr>\n<tr><td>기기<\/td><td>베어링·씰 마모, 전자장비 오작동, 레이더 마스트 성능, 축계 손상<\/td><\/tr>\n<tr><td>사람<\/td><td>피로·수면 방해, 작업 정밀도, 건강(MLC 거주 기준)<\/td><\/tr>\n<tr><td>소음<\/td><td>구조 전달 소음 증가<\/td><\/tr>\n<tr><td>화물·상업<\/td><td>민감 화물 손상, 인도 지연·클레임<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>평가 기준<\/h5><p>ISO 6954:2000(거주 4~6, 작업 5~7, 여객 2~4 mm/s), ISO 20283-5(2016), 선급 COMF-V.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 진동 기준을 계약 사양으로 정하고 설계 단계 주파수 계획·FE 해석으로 사전 회피해야 함.<\/p><\/div><\/section><\/details>"},{"id":"torsional","p":4,"n":"4.4","h":"추진축계 비틀림진동의 원인, 영향, 댐퍼와 커플링 적용","t":"추진축계 비틀림진동의 원인, 영향, 댐퍼와 커플링 적용","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 4교시 5번 · 25점"],"q":["<b>139회(2026) 4-5<\/b> 추진축계 비틀림진동의 원인, 선체·기관 영향, 댐퍼 및 커플링 적용방안"],"k":"비틀림진동은 기관의 가스압·관성 토크와 프로펠러 토크 변동이 축계(크랭크축·중간축·프로펠러축)의 비틀림 고유진동수와 공진하면서 커진다. 축계 피로와 기어·커플링 손상을 일으키므로, 고유진동수 조정·댐퍼·탄성 커플링으로 줄이고 남는 공진 회전수 영역은 위험 회전수 영역(BSR)으로 지정해 빠르게 통과시킨다.","x":"\n<p class=\"key\">비틀림진동은 기관의 가스압·관성 토크와 프로펠러 토크 변동이 축계(크랭크축·중간축·프로펠러축)의 비틀림 고유진동수와 공진하면서 커진다. 축계 피로와 기어·커플링 손상을 일으키므로, 고유진동수 조정·댐퍼·탄성 커플링으로 줄이고 남는 공진 회전수 영역은 위험 회전수 영역(BSR)으로 지정해 빠르게 통과시킨다.<\/p>\n<h4>발생 원인<\/h4>\n<ul>\n<li><b>기관 기진<\/b>: 실린더별 가스압 토크와 왕복 질량 관성 토크의 조화성분. 2행정 기관은 회전수의 정수배 차수, 실린더 수 차수(주 임계 차수)가 크다.<\/li>\n<li><b>프로펠러 기진<\/b>: 비균일 반류 속 날개 통과로 날개수 차수(Z) 토크 변동.<\/li>\n<li><b>공진<\/b>: 기진 차수 × 회전수 = 축계 고유진동수(1절, 2절 모드)일 때.<\/li>\n<li>최근 장행정·저회전·실린더 수 감소(5~6기통) 기관은 1절 모드 공진이 상용 회전수 범위로 들어오기 쉽다. 저속 운항이 늘면서 BSR 통과가 운항 문제로 커졌다.<\/li>\n<\/ul>\n<h4>선체와 기관에 미치는 영향<\/h4>\n<ul>\n<li>크랭크축·중간축·프로펠러축의 부가 비틀림 응력 → 피로 파손. 선급은 연속 운전 허용응력 τ<sub>1<\/sub>과 과도 통과 허용응력 τ<sub>2<\/sub>를 둔다(IACS UR M68).<\/li>\n<li>감속기어 치면 해머링, 커플링·볼트 손상, 캠축·체인 구동 문제.<\/li>\n<li>축발전기 출력 전압·주파수 변동.<\/li>\n<li>종진동과의 연성으로 추력 변동 → 추력 베어링·선체(상부구조 전후 진동) 영향.<\/li>\n<\/ul>\n<h4>저감 대책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대책<\/th><th>원리<\/th><th>적용<\/th><\/tr><\/thead><tbody>\n<tr><td>점성 댐퍼(viscous damper)<\/td><td>케이싱 안 관성링과 실리콘 유체 전단으로 진동 에너지 소산<\/td><td>크랭크축 선단, 저속·중속 기관<\/td><\/tr>\n<tr><td>스프링 댐퍼(Geislinger 등)<\/td><td>판스프링 강성 + 오일 감쇠, 고유진동수 조정과 감쇠 동시<\/td><td>대형 2행정·중속 기관<\/td><\/tr>\n<tr><td>고탄성 커플링<\/td><td>고무 요소의 낮은 비틀림 강성으로 고유진동수를 운전 영역 아래로 낮추고 감쇠 추가<\/td><td>4행정 기관 + 감속기, 발전기 구동<\/td><\/tr>\n<tr><td>튜닝 휠·플라이휠<\/td><td>관성 추가로 고유진동수 이동<\/td><td>설계 초기<\/td><\/tr>\n<tr><td>축 지름 조정<\/td><td>강성 변경으로 고유진동수 이동(가는 축 = 낮은 고유진동수)<\/td><td>축계 설계<\/td><\/tr>\n<tr><td>점화순서·실린더 수·날개수 선정<\/td><td>기진 차수 성분 크기·위치 조정<\/td><td>기관·프로펠러 선정<\/td><\/tr>\n<tr><td>BSR 운용<\/td><td>위험 영역 신속 통과(규정 시간 내), 제어계 회피 로직<\/td><td>운항<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>절차: 설계 단계에서 비틀림진동 계산서(TVC)를 작성해 선급 승인 → 시운전에서 계측(토크·각속도)으로 검증 → BSR 표시와 운전 지침 확정.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 발생 원인<\/h5><p>기관 가스압·관성 토크 조화성분(2행정 실린더 수 차수 주임계), 프로펠러 날개수 차수 토크 변동 → 축계 고유진동수(1절·2절) 공진. 장행정·5~6기통 기관은 1절 공진이 상용 영역에 들어오기 쉬움.<\/p>\n<h5>2. 영향<\/h5><ul><li>크랭크축·중간축·프로펠러축 부가 응력 → 피로(UR M68 τ₁ 연속, τ₂ 과도)<\/li><li>기어 해머링, 커플링 손상, 축발전기 전압·주파수 변동<\/li><li>종진동 연성 → 추력 베어링·상부구조 전후 진동<\/li><\/ul>\n<h5>3. 저감<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>대책<\/th><th>원리<\/th><\/tr><\/thead><tbody>\n<tr><td>점성 댐퍼<\/td><td>관성링·실리콘 유체 전단 소산<\/td><\/tr>\n<tr><td>스프링 댐퍼<\/td><td>판스프링 강성 + 오일 감쇠<\/td><\/tr>\n<tr><td>고탄성 커플링<\/td><td>낮은 강성으로 고유진동수를 운전 영역 아래로, 감쇠<\/td><\/tr>\n<tr><td>튜닝 휠·축 지름<\/td><td>관성·강성으로 고유진동수 이동<\/td><\/tr>\n<tr><td>점화순서·실린더·날개수<\/td><td>기진 성분 조정<\/td><\/tr>\n<tr><td>BSR<\/td><td>신속 통과·제어 회피<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: TVC 계산 승인 → 시운전 계측 → BSR 확정 순으로 관리하며, 저속 운항 선박은 BSR이 운항 영역과 겹치지 않도록 설계해야 함.<\/p><\/div><\/section><\/details>"},{"id":"noise","p":4,"n":"4.5","h":"선박의 소음원, 소음기준, 방음대책 (일반배치상 고려사항 포함)","t":"선박의 소음원, 소음기준, 방음대책 (일반배치상 고려사항 포함)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 3번 · 25점","133회 3교시 5번 · 25점"],"q":["<b>124회(2021) 3-3<\/b> 선박 소음방지를 위해 일반배치상 고려사항","<b>133회(2024) 3-5<\/b> 선박의 소음원, 소음기준 및 방음대책"],"k":"선박 소음은 기관·발전기·프로펠러·배기·공조에서 공기 전달과 구조 전달 경로로 거주구에 들어온다. IMO 소음 코드(MSC.337(91))가 1,600 GT 이상 선박의 구역별 한도를 강제하며, 가장 싸고 효과적인 대책은 일반배치 단계에서 소음원과 거주구를 떨어뜨리는 것이다.","x":"\n<p class=\"key\">선박 소음은 기관·발전기·프로펠러·배기·공조에서 공기 전달과 구조 전달 경로로 거주구에 들어온다. IMO 소음 코드(MSC.337(91))가 1,600 GT 이상 선박의 구역별 한도를 강제하며, 가장 싸고 효과적인 대책은 일반배치 단계에서 소음원과 거주구를 떨어뜨리는 것이다.<\/p>\n<h4>소음원<\/h4>\n<ul>\n<li>주기관·발전기관(연소, 기계, 배기·흡기), 프로펠러(캐비테이션 압력변동), 보기류(펌프, 압축기, 분리기), 공조(팬, 덕트 기류, 디퓨저), 스러스터, 갑판기기(계류 윈치), 파랑 충격.<\/li>\n<li>전달: 공기 전달(벽·문 개구), 구조 전달(기관 진동 → 선체 → 거주구 판넬이 방사, 대부분의 거주구 소음).<\/li>\n<\/ul>\n<h4>소음 기준: IMO 소음 코드(SOLAS II-1/3-12로 강제, 2014년 7월 이후 계약선)<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구역<\/th><th class=\"num\">한도 dB(A) (1,600~10,000 GT)<\/th><th class=\"num\">10,000 GT 이상<\/th><\/tr><\/thead><tbody>\n<tr><td>기관구역(유인)<\/td><td class=\"num\">110<\/td><td class=\"num\">110<\/td><\/tr>\n<tr><td>기관 제어실<\/td><td class=\"num\">75<\/td><td class=\"num\">75<\/td><\/tr>\n<tr><td>작업장<\/td><td class=\"num\">85<\/td><td class=\"num\">85<\/td><\/tr>\n<tr><td>선교·해도실<\/td><td class=\"num\">65<\/td><td class=\"num\">65<\/td><\/tr>\n<tr><td>침실·병실<\/td><td class=\"num\">60<\/td><td class=\"num\">55<\/td><\/tr>\n<tr><td>식당·오락실<\/td><td class=\"num\">65<\/td><td class=\"num\">60<\/td><\/tr>\n<tr><td>사무실<\/td><td class=\"num\">65<\/td><td class=\"num\">60<\/td><\/tr>\n<tr><td>조리실<\/td><td class=\"num\">75<\/td><td class=\"num\">75<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>85 dB(A) 초과 구역은 청력 보호구 착용 표시, 침실 간 차음(공기음 차음지수 Rw 35 이상) 요구. 선급 쾌적성 표기(COMF-V, HAB)는 더 엄격한 한도를 둔다. 수중방사소음은 IMO 지침(MEPC.1/Circ.906/Rev.1, 2024 개정)이 권고 수준으로 다룬다(<a href=\"#/t/urn\">15장 참고<\/a>).<\/p>\n<h4>방음대책<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>대책<\/th><\/tr><\/thead><tbody>\n<tr><td>일반배치<\/td><td>거주구를 기관실·연돌 케이싱·프로펠러 상부에서 이격, 사이에 창고·공소·계단실 배치. 침실은 케이싱·발전기실 인접 금지. 선교는 굴뚝·배기관에서 떨어지게. 공조실·팬룸을 침실과 분리<\/td><\/tr>\n<tr><td>소음원<\/td><td>탄성 마운트(발전기관, 펌프), 배기 소음기, 저소음 프로펠러(캐비테이션 억제), 저속 덕트 설계, 기기 소음 사양 구매 조건<\/td><\/tr>\n<tr><td>전달 경로<\/td><td>부유식 바닥(floating floor), 감쇠재(damping tile), 흡음·차음 패널, 배관 탄성 지지, 케이싱과 거주구 구조 분리<\/td><\/tr>\n<tr><td>수감부<\/td><td>box-in-box 객실, 차음 문·창, 천장·벽 패널 탄성 지지<\/td><\/tr>\n<tr><td>검증<\/td><td>설계 단계 소음 예측(SEA 해석), 시운전 소음 계측 보고서<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">124-3-3<\/td><td>소음방지를 위한 일반배치 고려사항<\/td><td>배치 원칙을 중심으로<\/td><\/tr>\n<tr><td class=\"num\">133-3-5<\/td><td>소음원, 소음기준, 방음대책<\/td><td>IMO 소음 코드 수치 표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 133회형\">\n<h5>1. 소음원<\/h5><p>주기관·발전기관, 프로펠러 캐비테이션, 보기류, 공조 팬·덕트, 배기, 스러스터. 전달: 공기 전달 + 구조 전달(거주구 소음의 주원인).<\/p>\n<h5>2. 소음기준(IMO 소음 코드, SOLAS II-1/3-12)<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구역<\/th><th class=\"num\">1,600~10,000 GT<\/th><th class=\"num\">10,000 GT 이상<\/th><\/tr><\/thead><tbody>\n<tr><td>기관구역<\/td><td class=\"num\">110<\/td><td class=\"num\">110<\/td><\/tr>\n<tr><td>선교<\/td><td class=\"num\">65<\/td><td class=\"num\">65<\/td><\/tr>\n<tr><td>침실<\/td><td class=\"num\">60<\/td><td class=\"num\">55<\/td><\/tr>\n<tr><td>식당·사무실<\/td><td class=\"num\">65<\/td><td class=\"num\">60<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 방음대책<\/h5><ol><li>일반배치: 거주구를 기관실·연돌·프로펠러 상부에서 이격, 사이에 창고·공소, 침실은 케이싱 인접 금지<\/li><li>소음원: 탄성 마운트, 소음기, 저소음 프로펠러, 저속 덕트<\/li><li>전달 경로: 부유식 바닥, 감쇠재, 흡·차음 패널, 케이싱 구조 분리<\/li><li>수감부: box-in-box 객실, 차음 문<\/li><li>검증: 설계 단계 SEA 예측, 시운전 계측<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 소음은 일반배치 단계에서 대부분 결정되므로, 배치 원칙을 지키는 것이 사후 차음재보다 효과적이고 저렴함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"residual-stress","p":5,"n":"5.1","h":"용접에 의한 잔류응력","t":"용접에 의한 잔류응력","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 10번 · 10점"],"q":["<b>112회(2017) 1-10<\/b> 용접에 의한 잔류응력"],"k":"잔류응력은 용접부의 국부 가열·냉각 수축이 주위 모재에 구속되어 외력이 없어도 남는 내부 응력이다. 용접선 방향으로 용접부와 열영향부에는 항복응력 수준의 인장, 그 바깥 모재에는 이를 상쇄하는 압축이 생긴다.","x":"\n<p class=\"key\">잔류응력은 용접부의 국부 가열·냉각 수축이 주위 모재에 구속되어 외력이 없어도 남는 내부 응력이다. 용접선 방향으로 용접부와 열영향부에는 항복응력 수준의 인장, 그 바깥 모재에는 이를 상쇄하는 압축이 생긴다.<\/p>\n<h4>발생 원리<\/h4>\n<ol>\n<li>용접 중 용접부가 가열 팽창하려 하나 주위 냉간부에 구속되어 압축 소성변형.<\/li>\n<li>냉각 시 수축하려 하나 다시 구속 → 용접부에 인장 잔류응력, 모재에 압축.<\/li>\n<li>단면 내 힘의 평형: ∫σ<sub>res<\/sub> dA = 0.<\/li>\n<\/ol>\n<figure class=\"fig\"><svg viewBox=\"0 0 420 170\" role=\"img\" aria-label=\"맞대기 용접 잔류응력 분포\">\n<line x1=\"20\" y1=\"100\" x2=\"400\" y2=\"100\" class=\"ln\"/>\n<path d=\"M20 112 L150 116 C 175 118, 185 40, 210 32 C 235 40, 245 118, 270 116 L400 112\" class=\"lr\"/>\n<rect x=\"200\" y=\"96\" width=\"20\" height=\"8\" class=\"fr\"/>\n<text x=\"216\" y=\"26\" class=\"tr\">+σ<tspan font-size=\"9\">Y<\/tspan> (인장)<\/text><text x=\"40\" y=\"132\" class=\"t2\">압축 (모재)<\/text><text x=\"330\" y=\"132\" class=\"t2\">압축<\/text><text x=\"196\" y=\"122\" class=\"t2\">용접선<\/text>\n<\/svg><figcaption>용접선 방향 잔류응력의 폭 방향 분포(맞대기 용접).<\/figcaption><\/figure>\n<h4>영향<\/h4>\n<ul>\n<li><b>좌굴강도 저하<\/b>: 판 중앙부 압축 잔류응력이 외부 압축과 합쳐져 조기 좌굴.<\/li>\n<li><b>피로<\/b>: 인장 잔류응력이 평균응력을 높인다. 용접 이음 S-N 곡선은 이미 높은 잔류응력을 포함하므로 압축 하중 범위도 손상에 기여한다고 본다.<\/li>\n<li><b>취성파괴·응력부식균열<\/b>: 결함과 결합해 저응력 파괴의 원인.<\/li>\n<li><b>변형<\/b>: 기계가공·절단 시 응력 재분배로 변형.<\/li>\n<\/ul>\n<h4>완화 방법<\/h4>\n<ul>\n<li>용접 시공: 입열 관리, 대칭·후퇴법 순서, 예열·층간온도 관리, 구속 최소화.<\/li>\n<li>응력제거 열처리(PWHT): 탄소강 대략 580~620 °C 유지 후 서냉. 압력용기·LPG/LCO₂ Type C 탱크.<\/li>\n<li>기계적 방법: 피닝(해머·초음파 충격처리), 과하중 인장(수압시험의 과부하 효과), 진동 응력제거.<\/li>\n<li>저온 응력완화: 용접선 양측 국부 가열.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 분포 그림\">\n<h5>1. 정의·원리<\/h5><p>가열 팽창 구속 → 압축 소성, 냉각 수축 구속 → 용접부 인장(≈σ<sub>Y<\/sub>), 모재 압축. ∫σ<sub>res<\/sub>dA = 0.<\/p>\n<h5>2. 영향<\/h5><p>좌굴 조기화, 피로 평균응력↑(S-N에 포함, 압축 범위도 손상), 취성파괴·SCC, 가공 변형.<\/p>\n<h5>3. 완화<\/h5><p>입열·순서·예열·구속 관리, PWHT(탄소강 약 580~620 °C), 피닝·UIT, 과하중, 진동, 저온 응력완화.<\/p><\/div><\/section><\/details>"},{"id":"weld-distortion","p":5,"n":"5.2","h":"설계단계 및 시공단계에서의 용접변형 최소화 방안","t":"설계단계 및 시공단계에서의 용접변형 최소화 방안","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 2교시 5번 · 25점"],"q":["<b>115회(2018) 2-5<\/b> 설계단계 및 시공단계에서의 용접변형 최소화 방안"],"k":"용접변형은 용접 수축(횡수축, 종수축, 각변형, 굽힘, 좌굴변형)으로 생기며, 수축량은 용착금속량과 입열에 비례한다. 설계에서는 용접량과 비대칭을 줄이고, 시공에서는 순서·구속·역변형·입열을 관리하며, 남은 변형은 선상가열로 교정한다.","x":"\n<p class=\"key\">용접변형은 용접 수축(횡수축, 종수축, 각변형, 굽힘, 좌굴변형)으로 생기며, 수축량은 용착금속량과 입열에 비례한다. 설계에서는 용접량과 비대칭을 줄이고, 시공에서는 순서·구속·역변형·입열을 관리하며, 남은 변형은 선상가열로 교정한다.<\/p>\n<h4>변형의 종류<\/h4>\n<ul>\n<li>횡수축, 종수축(부재 단축), 각변형(필릿·맞대기 판이 꺾임), 종굽힘(T형 부재 휨), 좌굴변형(얇은 판의 압축 잔류응력으로 물결), 회전변형.<\/li>\n<\/ul>\n<h4>설계단계<\/h4>\n<ul>\n<li>용접량 최소화: 규칙 최소 필릿 각장 준수(과용접 금지), 개선 형상 최적화(양면 V, 좁은 개선), 큰 판·압연 형강 사용으로 이음 수 감소.<\/li>\n<li>대칭 배치: 중립축 기준 용접선 대칭, 편측 집중 회피.<\/li>\n<li>판 두께: 좌굴변형 임계 두께 이하의 얇은 판 회피(갑판·상부구조 판은 6~8 mm 이하일 때 주의).<\/li>\n<li>블록 분할: 변형이 큰 용접을 정반 하향 자세에서 할 수 있게 분할, 수축 여유(덧살) 반영.<\/li>\n<li>저입열 공정 지정: 레이저·하이브리드 용접, 소형 와이어 FCAW.<\/li>\n<\/ul>\n<h4>시공단계<\/h4>\n<ul>\n<li>용접 순서: 수축이 큰 맞대기 먼저, 필릿 나중. 중앙에서 바깥으로, 대칭으로(2인 동시), 후퇴법(backstep)·비석법(skip).<\/li>\n<li>구속: 지그, 스트롱백, 정반 고정. 구속이 지나치면 잔류응력·균열 증가하므로 균형.<\/li>\n<li>역변형(pre-setting): 예상 각변형만큼 반대로 꺾어 두고 용접.<\/li>\n<li>입열 관리: 전류·속도 관리, 다층 소입열, 자동화(일정한 조건).<\/li>\n<li>취부 정도: 틈새 과대는 용착량 증가 → 변형 증가. 취부 정도 관리가 가장 중요한 예방책.<\/li>\n<li>동시 양측 필릿(tandem twin fillet)으로 각변형 상쇄.<\/li>\n<\/ul>\n<h4>교정<\/h4>\n<p>선상가열(line heating)·점가열 후 수랭, 기계적 교정. 가열 온도는 강종·냉각 방식별 상한(IACS Rec. 47)을 지켜 TMCP 강의 강도·인성 저하를 막는다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 변형 종류<\/h5><p>횡·종수축, 각변형, 종굽힘, 좌굴변형, 회전변형. 수축량 ∝ 용착량·입열.<\/p>\n<h5>2. 설계단계<\/h5><ul><li>용접량 최소: 규칙 각장 준수, 개선 최적화, 큰 판·형강<\/li><li>중립축 대칭 배치<\/li><li>6~8 mm 이하 박판 주의<\/li><li>하향 자세 가능하게 블록 분할, 수축 덧살<\/li><li>저입열 공정 지정(레이저·하이브리드)<\/li><\/ul>\n<h5>3. 시공단계<\/h5><ul><li>순서: 맞대기 → 필릿, 중앙 → 바깥, 대칭 2인, 후퇴법·비석법<\/li><li>구속: 지그·스트롱백(과구속은 균열)<\/li><li>역변형(pre-setting), tandem twin fillet<\/li><li>입열 관리·자동화<\/li><li>취부 정도(틈새) 관리 — 가장 중요<\/li><\/ul>\n<h5>4. 교정<\/h5><p>선상가열·점가열 + 수랭, 기계적 교정. 온도 상한(IACS Rec.47)으로 TMCP 강 성질 보호.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 교정은 비용·성질 저하를 동반하므로 설계의 대칭·용접량 저감과 취부 정도 관리가 가장 경제적인 대책임.<\/p><\/div><\/section><\/details>"},{"id":"db-welding","p":5,"n":"5.3","h":"이중저 블록 제작 시 용접순서의 원칙, 잔류응력 완화와 변형 교정","t":"이중저 블록 제작 시 용접순서의 원칙, 잔류응력 완화와 변형 교정","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 4교시 4번 · 25점"],"q":["<b>121회(2020) 4-4<\/b> 이중저 블록 용접순서의 일반 원칙, 잔류응력 완화 및 용접변형 교정법"],"k":"선저외판과 내저판의 맞대기는 잠호용접으로 끝난 조건이므로, 남은 일은 거더·늑판의 조립 용접과 판넬 결합 필릿 용접이다. 원칙은 수축이 큰 용접 먼저, 중앙에서 바깥으로, 대칭으로, 그리고 블록 경계 이음은 탑재 맞춤을 위해 남겨두는 것이다.","x":"\n<p class=\"key\">선저외판과 내저판의 맞대기는 잠호용접으로 끝난 조건이므로, 남은 일은 거더·늑판의 조립 용접과 판넬 결합 필릿 용접이다. 원칙은 수축이 큰 용접 먼저, 중앙에서 바깥으로, 대칭으로, 그리고 블록 경계 이음은 탑재 맞춤을 위해 남겨두는 것이다.<\/p>\n<h4>조립 개요(역조립 예)<\/h4>\n<ol>\n<li>내저판 판넬(종늑골 부착 완료)을 정반에 뒤집어 놓는다.<\/li>\n<li>거더(중심선·측거더)와 늑판을 세워 격자(egg-box) 구성.<\/li>\n<li>격자 내부 용접 후 선저외판 판넬을 덮고 결합.<\/li>\n<li>블록을 바로 세워 외판 측 마무리.<\/li>\n<\/ol>\n<h4>용접순서 일반 원칙<\/h4>\n<ol>\n<li><b>맞대기 → 필릿<\/b>: 수축이 큰 부재 이음(거더·늑판 자체의 맞대기)을 먼저.<\/li>\n<li><b>수직 → 수평<\/b>: 거더-늑판 교차부 수직 필릿을 먼저, 판넬과의 수평 필릿을 나중에. 교차부 구속을 먼저 풀어 놓는다.<\/li>\n<li><b>중앙 → 바깥<\/b>: 블록 중앙부에서 선수미·선측 방향으로 진행해 수축이 자유단으로 빠지게.<\/li>\n<li><b>대칭·동시<\/b>: 중심선 거더 좌우를 2인 1조로 동시 용접, 같은 방향 진행.<\/li>\n<li><b>내부 → 외부<\/b>: 내저판 측 필릿을 완료한 뒤 선저외판 결합 필릿(이중저 내부 맨홀로 접근).<\/li>\n<li><b>블록 경계<\/b>: 인접 블록과 맞출 경계 끝단 일정 길이(대략 300 mm 내외)는 용접하지 않고 남겨 탑재 시 취부 조정.<\/li>\n<li>후퇴법·비석법으로 긴 필릿의 누적 수축 분산, 자동 캐리지 용접으로 입열 균일화.<\/li>\n<\/ol>\n<h4>잔류응력 완화<\/h4>\n<ul>\n<li>입열 최소화, 층간온도 관리, 구속 최소화(과도한 스트롱백 지양).<\/li>\n<li>대칭 용접으로 응력 분포 균형.<\/li>\n<li>필요 시 피닝, 국부 저온 응력완화. 선체 블록은 일반적으로 PWHT를 하지 않는다.<\/li>\n<\/ul>\n<h4>변형 교정<\/h4>\n<ul>\n<li>늑판 사이 외판 처짐(hungry horse): 종늑골 위치를 따라 선상가열 + 수랭.<\/li>\n<li>블록 비틀림·휨: 쐐기형(삼각) 가열, 블록 정도 계측(3D 측정) 후 교정.<\/li>\n<li>교정 후 정도 기준 확인(IACS Rec. 47 또는 조선소 표준), 가열부 도장 보수.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 조립 개요(역조립)<\/h5><p>내저판 판넬(종늑골 부착) 뒤집어 정반 → 거더·늑판 egg-box → 내부 용접 → 선저외판 판넬 결합 → 바로 세워 마무리.<\/p>\n<h5>2. 용접순서 원칙<\/h5><ol><li>맞대기 → 필릿(수축 큰 것 먼저)<\/li><li>수직 → 수평(교차부 먼저)<\/li><li>중앙 → 바깥(자유단으로 수축)<\/li><li>대칭·동시(중심선 거더 좌우 2인)<\/li><li>내부 → 외부(내저판 측 먼저)<\/li><li>블록 경계 약 300 mm 남김(탑재 취부)<\/li><\/ol>\n<h5>3. 잔류응력 완화<\/h5><p>입열 최소, 층간온도, 과구속 지양, 대칭, 필요 시 피닝·저온 응력완화. 선체 블록 PWHT 미적용.<\/p>\n<h5>4. 변형 교정<\/h5><p>늑판 사이 처짐: 종늑골 따라 선상가열 + 수랭 / 비틀림·휨: 삼각 가열, 3D 계측. 정도 기준 확인, 가열부 도장 보수.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 순서 원칙의 공통 목적은 수축을 구속되지 않은 자유단으로 빼는 것임.<\/p><\/div><\/section><\/details>"},{"id":"hungry-horse","p":5,"n":"5.4","h":"Suezmax 유조선 진수 20일 전, 종통부재 사이 외판 변형 과다 — 조립단계부터의 방지·해결방법","t":"Suezmax 유조선 진수 20일 전, 종통부재 사이 외판 변형 과다 — 조립단계부터의 방지·해결방법","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 4번 · 25점"],"q":["<b>121회(2020) 2-4<\/b> 158,000 DWT Suezmax 진수 20일 전 종통부재 사이 외판 변형 과다 — 조립단계부터 방지·해결방법"],"k":"종늑골 사이 외판이 오목하게 꺼지는 변형(hungry horse)은 종늑골 필릿 용접의 각변형과 얇은 판의 좌굴변형이 겹친 결과다. 진수 20일 전이라면 선상가열 교정과 선주 합의 기준으로 해결하고, 근본 대책은 조립단계부터 입열·순서·구속·취부 정도를 관리하는 것이다.","x":"\n<p class=\"key\">종늑골 사이 외판이 오목하게 꺼지는 변형(hungry horse)은 종늑골 필릿 용접의 각변형과 얇은 판의 좌굴변형이 겹친 결과다. 진수 20일 전이라면 선상가열 교정과 선주 합의 기준으로 해결하고, 근본 대책은 조립단계부터 입열·순서·구속·취부 정도를 관리하는 것이다.<\/p>\n<h4>원인 분석<\/h4>\n<ul>\n<li>종늑골 필릿 과용접(각장 과대)·과입열 → 각변형.<\/li>\n<li>판 두께 대비 넓은 늑골 간격, 용접 후 압축 잔류응력으로 좌굴형 처짐.<\/li>\n<li>틈새 과대 취부 → 용착량 증가.<\/li>\n<li>용접 순서 부적정(한쪽부터 진행), 구속 부족.<\/li>\n<li>블록 운반·뒤집기·탑재 시 지지 불량, 탑재 용접과 반복 선상가열 누적.<\/li>\n<\/ul>\n<h4>단계별 방지<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>방지책<\/th><\/tr><\/thead><tbody>\n<tr><td>판넬 조립<\/td><td>판계 맞대기 SAW 입열 관리, 판넬 평탄도 확인 후 다음 공정<\/td><\/tr>\n<tr><td>종늑골 부착<\/td><td>각장 게이지 관리(규칙 최소 + 여유 한정), 양측 동시 필릿(tandem), 역변형 지그, 취부 틈새 관리<\/td><\/tr>\n<tr><td>블록 조립<\/td><td>중앙→바깥·대칭 순서, 횡웨브 용접 시 구속, 스트롱백<\/td><\/tr>\n<tr><td>운반·탑재<\/td><td>블록 지지점 배치, 뒤집기 시 보강재, 탑재 이음 대칭 용접<\/td><\/tr>\n<tr><td>품질관리<\/td><td>단계별 평탄도 계측(레이저·직선자), 기준 초과 시 즉시 교정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>진수 20일 전 해결 방법<\/h4>\n<ol>\n<li>변형 범위·크기 계측 → 계약 품질 기준(IACS Rec. 47 또는 선주 승인 조선소 표준)과 비교해 교정 대상 확정, 선주·선급과 합의.<\/li>\n<li>선상가열 교정: 외판 외측에서 종늑골 위치를 따라 선가열 후 수랭(또는 점가열). 강종별 최고 가열온도 준수(온도 측정 크레용·접촉 온도계).<\/li>\n<li>내부 구조(종늑골·웨브) 손상 여부 확인, 가열 부위 도장 재시공(외판 방오 도장 일정 반영).<\/li>\n<li>공정: 진수 일정에 맞춘 교정 팀 투입, 도킹 상태에서 외판 작업 동선 확보.<\/li>\n<li>기록·재발 방지: 원인별 시정 조치, 후속선 공정 반영.<\/li>\n<\/ol>\n<div class=\"pro\"><p>외관 변형은 강도보다 선주 인식의 문제가 되는 경우가 많다. 다만 과도한 처짐은 좌굴강도와 도막 수명에 영향을 주므로, 기준 이내라도 판 처짐량과 강도 영향을 근거로 설명해 선주를 설득하는 것이 기술사의 역할이다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 원인<\/h5><p>종늑골 필릿 과용접·과입열 → 각변형, 넓은 간격 박판 압축 잔류응력 좌굴, 틈새 과대, 순서 부적정, 운반·탑재 지지 불량, 반복 가열.<\/p>\n<h5>2. 단계별 방지<\/h5><div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>방지책<\/th><\/tr><\/thead><tbody>\n<tr><td>판넬<\/td><td>SAW 입열 관리, 평탄도 확인<\/td><\/tr>\n<tr><td>종늑골<\/td><td>각장 게이지, tandem, 역변형 지그, 틈새<\/td><\/tr>\n<tr><td>블록<\/td><td>중앙→바깥·대칭, 스트롱백<\/td><\/tr>\n<tr><td>운반·탑재<\/td><td>지지점, 뒤집기 보강, 대칭 탑재 용접<\/td><\/tr>\n<tr><td>QC<\/td><td>단계별 계측, 초과 시 즉시 교정<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 진수 20일 전 해결<\/h5><ol><li>계측 → IACS Rec.47·선주 승인 기준 비교 → 대상 확정·합의<\/li><li>외측 종늑골 위치 선가열 + 수랭, 강종별 최고 온도 준수<\/li><li>내부 구조 확인, 도장 재시공(방오 일정)<\/li><li>교정 팀 집중 투입, 도킹 상태 동선<\/li><li>기록·후속선 반영<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 기준 이내 변형도 처짐량과 좌굴·도막 영향을 근거로 선주를 설득하는 것이 기술사의 역할임.<\/p><\/div><\/section><\/details>"},{"id":"welding-processes","p":5,"n":"5.5","h":"용접법의 특성과 장단점: SMAW, MIG/MAG, TIG, FCAW, SAW","t":"용접법의 특성과 장단점: SMAW, MIG/MAG, TIG, FCAW, SAW","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 11번 · 10점","136회 1교시 2번 · 10점"],"q":["<b>121회(2020) 1-11<\/b> FCAW, SAW","<b>136회(2025) 1-2<\/b> SMAW, MIG, TIG, FCAW, SAW 용접특성 및 장단점"],"k":"조선소 용접은 생산성과 품질의 균형으로 고른다. 판계 맞대기는 SAW, 블록 필릿과 전자세 작업은 FCAW, 배관과 비철은 TIG·MIG, 현장 보수와 특수 자세는 SMAW가 주력이다.","x":"\n<p class=\"key\">조선소 용접은 생산성과 품질의 균형으로 고른다. 판계 맞대기는 SAW, 블록 필릿과 전자세 작업은 FCAW, 배관과 비철은 TIG·MIG, 현장 보수와 특수 자세는 SMAW가 주력이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>용접법<\/th><th>원리<\/th><th>장점<\/th><th>단점<\/th><th>조선 적용<\/th><\/tr><\/thead><tbody>\n<tr><td>SMAW (피복아크)<\/td><td>피복제가 가스·슬래그로 보호<\/td><td>장비 단순, 전자세, 옥외·협소부<\/td><td>용착속도 낮음, 봉 교체, 저수소봉 건조 관리<\/td><td>보수, 가접, 협소부<\/td><\/tr>\n<tr><td>MIG/MAG (GMAW)<\/td><td>솔리드 와이어 + 보호가스(Ar=MIG, CO₂·혼합=MAG)<\/td><td>고능률, 연속 와이어<\/td><td>바람에 약함, 스패터(CO₂)<\/td><td>알루미늄(MIG), 박판<\/td><\/tr>\n<tr><td>TIG (GTAW)<\/td><td>비소모 텅스텐 전극, 불활성가스, 별도 용가재<\/td><td>최고 품질, 정밀, 스패터 없음<\/td><td>용착속도 매우 낮음, 숙련<\/td><td>배관 이면 비드, 스테인리스·비철, 박판<\/td><\/tr>\n<tr><td>FCAW<\/td><td>용제 충전 와이어 + CO₂ 보호<\/td><td>고용착, 전자세, 비드 양호, 슬래그가 비드 지지<\/td><td>슬래그 제거, 흄, 수소 관리<\/td><td>블록 필릿·맞대기의 주력(국내 조선소 대부분)<\/td><\/tr>\n<tr><td>SAW (잠호)<\/td><td>입상 용제 밑에서 아크<\/td><td>대전류·고용착, 깊은 용입, 스패터·아크광 없음<\/td><td>하향·수평 자세만, 장비 큼<\/td><td>판넬 라인 편면 맞대기(FCB, RF), 후판<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>그 밖에 EGW(일렉트로가스, 수직 후판 1패스), 레이저-아크 하이브리드(저변형 박판), 스터드 용접이 쓰인다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">121-1-11<\/td><td>FCAW, SAW<\/td><td>두 방법 비교, 조선 적용 위치<\/td><\/tr>\n<tr><td class=\"num\">136-1-2<\/td><td>SMAW, MIG, TIG, FCAW, SAW<\/td><td>5개를 한 표로<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 136회형\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>용접법<\/th><th>원리<\/th><th>장점<\/th><th>단점<\/th><th>조선 적용<\/th><\/tr><\/thead><tbody>\n<tr><td>SMAW<\/td><td>피복제 보호<\/td><td>장비 단순, 전자세<\/td><td>저능률<\/td><td>보수·협소부<\/td><\/tr>\n<tr><td>MIG<\/td><td>솔리드 와이어 + 불활성가스<\/td><td>고능률<\/td><td>바람 취약<\/td><td>알루미늄<\/td><\/tr>\n<tr><td>TIG<\/td><td>비소모 텅스텐 + 불활성가스<\/td><td>최고 품질<\/td><td>매우 느림<\/td><td>배관 이면, 비철<\/td><\/tr>\n<tr><td>FCAW<\/td><td>용제 충전 와이어 + CO₂<\/td><td>고용착, 전자세<\/td><td>슬래그·흄<\/td><td>블록 필릿 주력<\/td><\/tr>\n<tr><td>SAW<\/td><td>입상 용제 아래 아크<\/td><td>대전류·깊은 용입<\/td><td>하향·수평만<\/td><td>판넬 맞대기<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 판넬은 SAW, 블록은 FCAW, 비철·배관은 TIG/MIG로 공정을 분담해 생산성과 품질을 함께 확보함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"wps","p":5,"n":"5.6","h":"WPS(Welding Procedure Specification)와 PQR(Procedure Qualification Record)","t":"WPS(Welding Procedure Specification)와 PQR(Procedure Qualification Record)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 2번 · 10점"],"q":["<b>127회(2022) 1-2<\/b> WPS &amp; PQR"],"k":"WPS는 용접을 어떤 조건으로 할지 적은 작업 지시서이고, PQR은 그 조건으로 실제 시험 용접을 해서 기계적 성질이 요구를 만족함을 증명한 기록이다. PQR이 WPS의 근거이며, 필수변수가 바뀌면 새 PQR이 필요하다.","x":"\n<p class=\"key\">WPS는 용접을 어떤 조건으로 할지 적은 작업 지시서이고, PQR은 그 조건으로 실제 시험 용접을 해서 기계적 성질이 요구를 만족함을 증명한 기록이다. PQR이 WPS의 근거이며, 필수변수가 바뀌면 새 PQR이 필요하다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>WPS<\/th><th>PQR<\/th><\/tr><\/thead><tbody>\n<tr><td>성격<\/td><td>절차서(무엇을 어떻게)<\/td><td>시험 기록(실제로 이렇게 했고 결과가 이랬다)<\/td><\/tr>\n<tr><td>내용<\/td><td>용접법, 모재 등급·두께 범위, 개선 형상, 용접재료, 자세, 예열·층간온도, 전류·전압·속도·입열 범위, 가스, PWHT<\/td><td>실제 사용 변수값, 시험 결과(인장, 굽힘, 충격, 매크로, 경도, NDT)<\/td><\/tr>\n<tr><td>승인<\/td><td>선급 승인 후 현장 배포<\/td><td>선급 검사원 입회 시험<\/td><\/tr>\n<tr><td>사용자<\/td><td>용접사·감독자<\/td><td>용접 기술자·선급<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>절차<\/h4>\n<ol>\n<li>예비 WPS(pWPS) 작성.<\/li>\n<li>시험편 용접(입회) → NDT → 기계시험.<\/li>\n<li>합격 시 PQR 작성·승인 → 필수변수의 인정 범위 안에서 WPS 승인.<\/li>\n<li>용접사 자격(WPQ)은 별도로 인정.<\/li>\n<\/ol>\n<p>근거 기준: 선급 규칙(재료·용접 편), ISO 15614-1, AWS D1.1, ASME IX. 필수변수 예: 용접법, 모재 그룹, 두께 범위, 용접재료 등급, 예열 하한, 입열 상한, PWHT 유무.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>WPS<\/th><th>PQR<\/th><\/tr><\/thead><tbody>\n<tr><td>성격<\/td><td>용접 절차서<\/td><td>시험 기록(근거)<\/td><\/tr>\n<tr><td>내용<\/td><td>용접법, 모재·두께 범위, 개선, 재료, 자세, 예
