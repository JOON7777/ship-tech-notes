d><a href=\"#/t/imo-nzf\">IMO Net-Zero Framework와 FuelEU<\/a>, 선상 탄소포집(<a href=\"#/t/ghg-ccs\">OCCS<\/a>)<\/td><td>높음<\/td><\/tr>\n<tr><td>디지털·AI<\/td><td>VR(118), 역설계(130), MASS·사이버(127·139), 스마트야드(139)<\/td><td><a href=\"#/t/ai-design\">AI 기반 설계·생산<\/a>, <a href=\"#/t/shm\">선체 구조 모니터링과 디지털 트윈<\/a><\/td><td>높음<\/td><\/tr>\n<tr><td>해양환경<\/td><td>BWM(112·124), HKC(139)<\/td><td><a href=\"#/t/biofouling\">선체 생물오손 관리<\/a>, <a href=\"#/t/urn\">수중방사소음<\/a><\/td><td>중간<\/td><\/tr>\n<tr><td>극지·안전<\/td><td>SOLAS 시야·구명(115·139), 2세대 복원성 미출제<\/td><td><a href=\"#/t/polar\">극지 코드와 북극항로 선박<\/a>, <a href=\"#/t/is-code\">2세대 비손상 복원성<\/a><\/td><td>중간<\/td><\/tr>\n<tr><td>산업·경영<\/td><td>EPC·RG·Heavy-tail·LOI<\/td><td><a href=\"#/t/masga\">한미 조선협력(MASGA)과 함정 MRO<\/a><\/td><td>중간<\/td><\/tr>\n<tr><td>생산 현장<\/td><td>블록분할·기밀시험·NDT 매회<\/td><td>반복 주제가 다시 나올 가능성이 가장 높다 → PART 05·06·07 반복 주제 답안을 먼저 완성<\/td><td>매우 높음<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"tip\"><p>예상 주제는 \"정의 → 왜 지금 문제인가(규제·시장) → 기술적 과제 → 설계 대응 → 기술사 의견\" 순서로 쓰면 처음 보는 문장으로 나와도 대응할 수 있다. 시험 3개월 전에는 IMO MEPC 85(2026년 11~12월)와 Net-Zero Framework 특별회기 결과를 반드시 확인한다.<\/p><\/div>\n"},{"id":"ammonia-fuel","p":15,"n":"15.2","h":"암모니아 연료추진선의 안전설계 (IMO 잠정지침 MSC.1/Circ.1687)","t":"암모니아 연료추진선의 안전설계 (IMO 잠정지침 MSC.1/Circ.1687)","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"암모니아는 탄소가 없어 연소 시 CO₂를 내지 않는 연료지만, 독성이 강하고 연소성이 나쁘며 N₂O를 낼 수 있다. IMO는 2024년 12월 MSC 109에서 암모니아 연료 선박 안전 잠정지침(MSC.1/Circ.1687)을 승인했고, 설계의 핵심은 화재·폭발보다 \"독성 누출\"을 다루는 것이다.","x":"\n<p class=\"key\">암모니아는 탄소가 없어 연소 시 CO₂를 내지 않는 연료지만, 독성이 강하고 연소성이 나쁘며 N₂O를 낼 수 있다. IMO는 2024년 12월 MSC 109에서 암모니아 연료 선박 안전 잠정지침(MSC.1/Circ.1687)을 승인했고, 설계의 핵심은 화재·폭발보다 \"독성 누출\"을 다루는 것이다.<\/p>\n<h4>연료 특성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>값·특징<\/th><th>설계 영향<\/th><\/tr><\/thead><tbody>\n<tr><td>저장<\/td><td>대기압 −33 °C 냉각 또는 상온 가압(약 10 bar 이상)<\/td><td>Type A·B·C 탱크, 소형은 Type C 가압<\/td><\/tr>\n<tr><td>발열량<\/td><td>약 18.6 MJ/kg, 체적 에너지는 MGO의 약 1/3<\/td><td>탱크 체적 약 2.8~3배<\/td><\/tr>\n<tr><td>독성<\/td><td>수십 ppm에서 자극, 수백 ppm 이상 생명 위험<\/td><td>독성 구역, 2단계 가스 탐지(경보·차단), 누출 완화 설비<\/td><\/tr>\n<tr><td>연소성<\/td><td>착화 어렵고 화염 속도 느림, 가연범위 약 15~28%<\/td><td>파일럿 연료 필요, 미연 암모니아 슬립<\/td><\/tr>\n<tr><td>배출<\/td><td>NOx, N₂O(GWP 약 273), 암모니아 슬립<\/td><td>SCR, N₂O 저감 촉매, 배기 감시<\/td><\/tr>\n<tr><td>재료<\/td><td>구리·아연 합금 부식, 탄소강 응력부식균열(산소 혼입 시)<\/td><td>재료 선정, 산소 관리, 응력완화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>잠정지침의 주요 설계 요건(요지)<\/h4>\n<ul>\n<li><b>위험 기반 설계<\/b>: 위험성 평가(HAZID)로 누출 시나리오와 독성 영향 범위를 정의하고 배치에 반영.<\/li>\n<li><b>이중 방벽<\/b>: 기관구역·폐위 공간의 연료 배관은 이중관(환형 공간 기계환기·탐지), 연료준비실·탱크연결공간은 독성 구역으로 관리.<\/li>\n<li><b>누출 완화<\/b>: 안전밸브·퍼지 배출을 그대로 대기로 내지 않고 암모니아 누출 완화 설비(ARMS: 흡수·희석·처리)로 농도를 낮춘다. 벤트 출구는 거주구·흡기구에서 이격.<\/li>\n<li><b>탐지·경보<\/b>: 저농도 경보와 고농도 자동 차단의 2단계, 거주구 흡기 탐지 시 외기 차단.<\/li>\n<li><b>인원 보호<\/b>: 보호복·호흡구, 샤워·세안 설비, 안전 대피 장소(citadel 개념), 독성 구역 출입 통제.<\/li>\n<li><b>벙커링<\/b>: 증기 반송·퍼지, ESD, 벙커링 중 안전구역과 독성 영향 범위 관리.<\/li>\n<li>기관: 2행정(고압 직접 분사형)·4행정 엔진이 2024~2026년 상용화 단계. 파일럿 연료 비율, 시동·저부하 운전, 미연 암모니아 처리가 과제.<\/li>\n<\/ul>\n<h4>암모니아 운반선과의 관계<\/h4>\n<p>암모니아는 IGC Code의 화물(독성, 17장 특별요건)로 오래 운송되어 왔다. 탄소강 탱크의 응력부식균열 방지(물 함량 유지, 산소 관리, 강재 강도 제한·용접후열처리)가 화물창 설계의 고전적 요건이다. 대형 암모니아 운반선(VLAC)과 암모니아 연료 추진의 결합이 국내 조선소 수주 경쟁 분야다.<\/p>\n<div class=\"pro\"><p>LNG 연료 설계의 핵심이 \"폭발 방지\"였다면 암모니아는 \"사람이 마시지 않게\"가 핵심이다. 그래서 위험구역 개념에 독성 영향 거리를 더하고, 거주구·구명정·소집 장소의 위치까지 다시 검토해야 한다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>암모니아 연료의 특성과 선박 적용 시 문제점<\/td><td class=\"num\">10<\/td><td>특성 표 + 독성·N₂O·연소성 3대 과제<\/td><\/tr>\n<tr><td>암모니아 연료추진선 설계 시 안전 고려사항(IMO 잠정지침 포함)<\/td><td class=\"num\">25<\/td><td>독성 중심 위험 기반 설계, 배치·배관·누출 완화·탐지·인원 보호<\/td><\/tr>\n<tr><td>LNG·메탄올·암모니아 연료 비교<\/td><td class=\"num\">25<\/td><td>저장·에너지·배출·위험·규정 비교표 + 선종별 권고<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 특성과 문제점\">\n<h5>1. 정의<\/h5><p>암모니아(NH₃): 탄소가 없어 연소 시 CO₂를 내지 않는 무탄소 연료. 그린(재생 수소 기반) 암모니아일 때 전과정 탄소중립.<\/p>\n<h5>2. 특성<\/h5><div class=\"calc\">저장: −33 °C 냉각 또는 상온 가압(약 10 bar 이상)\n발열량 약 18.6 MJ/kg → 탱크 체적 MGO의 약 2.8~3배\n가연범위 약 15~28%, 착화 어려움(파일럿 연료 필요)<\/div>\n<h5>3. 문제점<\/h5><ul><li>독성: 수십 ppm 자극, 수백 ppm 이상 생명 위험<\/li><li>배출: NOx, N₂O(GWP 약 273), 미연 암모니아 슬립 → SCR·N₂O 촉매<\/li><li>재료: 구리·아연 합금 부식, 탄소강 응력부식균열<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 화재·폭발보다 독성 누출 관리가 설계의 중심이 되어야 함.<\/p>\n<\/div>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 안전 설계 고려사항\">\n<h5>1. 개요<\/h5><p>IMO는 2024년 12월 MSC 109에서 암모니아 연료 선박 안전 잠정지침(MSC.1/Circ.1687)을 승인함. LNG 설계가 \"폭발 방지\" 중심이라면 암모니아는 \"독성 노출 방지\"가 중심임.<\/p>\n<h5>2. 위험 기반 설계<\/h5><p>HAZID로 누출 시나리오·독성 영향 범위 정의 → 배치(거주구·흡기구·구명정·소집 장소와의 거리)에 반영.<\/p>\n<h5>3. 설계 고려사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>탱크<\/td><td>냉각식(Type A·B·C) 또는 가압식(Type C), 보호 위치, 탱크연결공간 독성 구역 관리<\/td><\/tr>\n<tr><td>배관<\/td><td>폐위 공간 이중관 + 환형 공간 환기·탐지, 연료준비실 격리<\/td><\/tr>\n<tr><td>누출 완화<\/td><td>안전밸브·퍼지 배출을 ARMS로 처리(흡수·희석), 벤트 출구 이격<\/td><\/tr>\n<tr><td>탐지·차단<\/td><td>저농도 경보 + 고농도 자동 차단 2단계, 거주구 흡기 탐지 시 외기 차단<\/td><\/tr>\n<tr><td>인원 보호<\/td><td>보호복·호흡구, 샤워·세안 설비, 안전 대피 공간, 출입 통제<\/td><\/tr>\n<tr><td>기관·배출<\/td><td>파일럿 연료, 시동·저부하 운전, SCR·N₂O 저감<\/td><\/tr>\n<tr><td>재료<\/td><td>구리·아연 합금 배제, 탄소강 응력부식균열 대비(산소 관리, 응력완화)<\/td><\/tr>\n<tr><td>벙커링<\/td><td>증기 반송·퍼지, ESD, 독성 영향 범위 안전구역<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 암모니아 연료선은 위험구역 개념에 독성 영향 거리를 더해 일반배치 단계부터 설계해야 하며, 대형 암모니아 운반선(VLAC)과 연계해 국내 조선소가 선점할 수 있는 분야임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"methanol-fuel","p":15,"n":"15.3","h":"메탄올 연료추진선 설계 고려사항 (IMO 잠정지침 MSC.1/Circ.1621)","t":"메탄올 연료추진선 설계 고려사항 (IMO 잠정지침 MSC.1/Circ.1621)","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"메탄올은 상온 액체라 기존 연료유와 비슷하게 선체 일체형 탱크에 저장할 수 있어 대체연료 중 가장 빨리 상용화됐다. 다만 인화점이 약 11~12 °C로 낮은 저인화점 연료이고 독성이 있으며 화염이 잘 보이지 않으므로, IGF Code 체계의 잠정지침(MSC.1/Circ.1621)에 따라 탱크 격리·불활성화·이중관·화재 탐지를 설계한다.","x":"\n<p class=\"key\">메탄올은 상온 액체라 기존 연료유와 비슷하게 선체 일체형 탱크에 저장할 수 있어 대체연료 중 가장 빨리 상용화됐다. 다만 인화점이 약 11~12 °C로 낮은 저인화점 연료이고 독성이 있으며 화염이 잘 보이지 않으므로, IGF Code 체계의 잠정지침(MSC.1/Circ.1621)에 따라 탱크 격리·불활성화·이중관·화재 탐지를 설계한다.<\/p>\n<h4>주요 설계 요건<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>요건·설계 포인트<\/th><\/tr><\/thead><tbody>\n<tr><td>탱크<\/td><td>선체 일체형 가능. 기관구역·거주구 등과는 보호 코퍼댐으로 분리(최저 수선 아래 외판, 다른 메탄올 탱크, 연료준비실과 접한 면 등은 예외)<\/td><\/tr>\n<tr><td>불활성화<\/td><td>탱크 기상부 질소 블랭킷, 벤트는 안전한 위치로<\/td><\/tr>\n<tr><td>배관<\/td><td>폐위 공간 통과 시 이중관 + 환형 공간 환기·누설 탐지, 연료준비실 위험구역<\/td><\/tr>\n<tr><td>화재<\/td><td>내알코올 포말, 낮에 보이지 않는 화염 → 적외선 불꽃 탐지·열화상 카메라<\/td><\/tr>\n<tr><td>독성·보건<\/td><td>증기·피부 노출 관리, 탐지기, 보호구<\/td><\/tr>\n<tr><td>탱크 용량<\/td><td>체적 에너지가 MGO의 약 43% → 같은 항속거리에 약 2.3배 탱크<\/td><\/tr>\n<tr><td>도장·재료<\/td><td>메탄올 호환 도장(징크 실리케이트 등), 알루미늄·일부 고분자 재료 주의<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>탄소 효과의 조건<\/h4>\n<p>화석 원료 메탄올은 WtW 기준으로 오히려 배출이 늘 수 있다. 바이오 메탄올이나 e-메탄올(재생 수소 + 포집 CO₂)일 때 탄소 감축이 성립하므로, 선주는 \"methanol-ready\"·이중연료로 짓고 연료 공급망을 확보하는 전략을 쓴다.<\/p>\n<div class=\"tip\"><p>LNG 연료와의 비교표(저장 온도, 탱크 형식, 위험 요소, 벙커링, 비용)를 한 장 그려 두면 메탄올·암모니아·LNG 중 무엇이 나와도 같은 틀로 쓸 수 있다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>메탄올 연료의 특성<\/td><td class=\"num\">10<\/td><td>저인화점·독성·불가시 화염·체적<\/td><\/tr>\n<tr><td>메탄올 추진선 연료탱크·연료계통 설계 고려사항<\/td><td class=\"num\">25<\/td><td>잠정지침(MSC.1/Circ.1621) 요건 표 + WtW 조건<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>메탄올은 상온 액체로 선체 일체형 탱크 저장이 가능해 대체연료 중 가장 빨리 상용화됨. 인화점 약 11~12 °C의 저인화점 연료로 IGF 체계 잠정지침(MSC.1/Circ.1621)을 적용함.<\/p>\n<h5>2. 연료 특성<\/h5><ul><li>저위발열량 약 19.9 MJ/kg → 같은 항속거리에 MGO의 약 2.3배 탱크<\/li><li>독성(증기·피부), 낮에 보이지 않는 화염, 물과 잘 섞임<\/li><\/ul>\n<h5>3. 설계 고려사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>요건·대책<\/th><\/tr><\/thead><tbody>\n<tr><td>탱크<\/td><td>일체형 가능, 기관구역·거주구 등과 보호 코퍼댐(최저 수선 아래 외판 등 예외)<\/td><\/tr>\n<tr><td>불활성화<\/td><td>탱크 기상부 질소 블랭킷, 벤트 안전 위치<\/td><\/tr>\n<tr><td>배관<\/td><td>폐위 공간 이중관 + 누설 탐지, 연료준비실 위험구역<\/td><\/tr>\n<tr><td>화재<\/td><td>내알코올 포말, 적외선 불꽃 탐지·열화상<\/td><\/tr>\n<tr><td>재료·도장<\/td><td>메탄올 호환 도장(징크 실리케이트 등), 일부 고분자·알루미늄 주의<\/td><\/tr>\n<tr><td>기관<\/td><td>2행정·4행정 메탄올 이중연료, 파일럿 연료<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 탄소 효과의 조건<\/h5><p>화석 메탄올은 WtW 배출이 오히려 늘 수 있음 → 바이오·e-메탄올 공급 확보가 전제, 선주는 methanol-ready·이중연료로 대응.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 메탄올은 설비 측면에서 가장 쉬운 대체연료지만 탱크 용적과 녹색 연료 공급망이 실제 효과를 좌우하므로, 연료 공급 계획과 함께 설계해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"lng-fgss","p":15,"n":"15.4","h":"LNG 연료공급시스템(FGSS)과 증발가스(BOG) 처리","t":"LNG 연료공급시스템(FGSS)과 증발가스(BOG) 처리","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"FGSS는 LNG 연료탱크의 액체를 기관이 요구하는 압력·온도의 기체 연료로 바꿔 공급하는 계통이다. 저압 기관(약 5~16 bar)은 가압·기화로, 고압 직접 분사 2행정 기관(약 300 bar)은 극저온 고압 펌프와 고압 기화기로 공급하며, 탱크에서 생기는 BOG는 연료로 쓰거나 재액화·연소한다.","x":"\n<p class=\"key\">FGSS는 LNG 연료탱크의 액체를 기관이 요구하는 압력·온도의 기체 연료로 바꿔 공급하는 계통이다. 저압 기관(약 5~16 bar)은 가압·기화로, 고압 직접 분사 2행정 기관(약 300 bar)은 극저온 고압 펌프와 고압 기화기로 공급하며, 탱크에서 생기는 BOG는 연료로 쓰거나 재액화·연소한다.<\/p>\n<h4>구성<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>저압 계통(오토 사이클 DF 기관)<\/th><th>고압 계통(디젤 사이클 가스 분사)<\/th><\/tr><\/thead><tbody>\n<tr><td>송출<\/td><td>탱크 가압(PBU) 또는 잠수식 저압 펌프<\/td><td>잠수식 펌프 → 왕복동 극저온 고압 펌프<\/td><\/tr>\n<tr><td>기화·가열<\/td><td>기화기(글리콜수·재킷수 열원) → 가열기<\/td><td>고압 기화기 → 가열기<\/td><\/tr>\n<tr><td>조절<\/td><td>가스밸브유닛(GVU): 압력 조절, 이중차단·배출(DBB)<\/td><td>고압 가스 제어·차단 블록<\/td><\/tr>\n<tr><td>BOG<\/td><td>탱크 압력 축적, 저압 압축기로 연료 공급<\/td><td>다단 압축기, 고압 가스를 이용한 부분 재액화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>설계 고려사항<\/h4>\n<ul>\n<li><b>안전<\/b>: IGF Code — 이중관과 환형 공간 환기(시간당 30회 수준), 연료준비실 위험구역, 주 가스밸브와 DBB, 가스 탐지·ESD.<\/li>\n<li><b>열원과 효율<\/b>: 기화 열을 기관 냉각수·폐열로 회수, 반대로 LNG 냉열을 냉동·공조에 활용.<\/li>\n<li><b>BOG 균형<\/b>: 정박·저부하 시 BOG가 소비량보다 많으면 압력 상승 → Type C 압력 축적 허용치, 재액화, 가스연소장치(GCU) 중 선택.<\/li>\n<li><b>연료 품질<\/b>: 메탄가(MN)에 따른 노킹 한계와 출력, 기화 후 온도 관리.<\/li>\n<li><b>이중화<\/b>: 펌프·기화기 예비, 디젤 모드 전환 논리.<\/li>\n<li><b>메탄 슬립<\/b>: 기관 선택(고압 직접 분사형은 슬립이 작다)과 운전 부하 관리.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>LNG 연료공급시스템(FGSS)<\/td><td class=\"num\">10<\/td><td>정의·저압/고압 구분<\/td><\/tr>\n<tr><td>저압·고압 이중연료 기관의 FGSS 구성과 BOG 처리 방안<\/td><td class=\"num\">25<\/td><td>계통 블록도 + 비교표 + 안전·BOG 균형<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>FGSS: LNG 탱크의 액체를 기관 요구 압력·온도의 기체로 바꿔 공급하는 계통. 저압 오토 기관(약 5~16 bar)과 고압 직접 분사 기관(약 300 bar)으로 구성이 다름.<\/p>\n<h5>2. 계통 구성<\/h5><div class=\"calc\">저압: 탱크 → (가압 PBU 또는 잠수 펌프) → 기화기 → 가열기 → GVU(DBB) → 기관\n고압: 탱크 → 잠수 펌프 → 극저온 고압 펌프 → 고압 기화기 → 가열기 → 고압 차단 블록 → 기관<\/div>\n<h5>3. 비교<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>저압<\/th><th>고압<\/th><\/tr><\/thead><tbody>\n<tr><td>설비<\/td><td>단순, 저비용<\/td><td>고압 펌프·배관, 고비용<\/td><\/tr>\n<tr><td>메탄 슬립<\/td><td>상대적으로 큼<\/td><td>매우 작음<\/td><\/tr>\n<tr><td>NOx<\/td><td>Tier III 무후처리<\/td><td>EGR·SCR 필요<\/td><\/tr>\n<tr><td>BOG<\/td><td>저압 압축기로 직접 연료화 쉬움<\/td><td>다단 압축 또는 부분 재액화<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>4. 설계 고려<\/h5><ul><li>안전(IGF): 이중관·환형 공간 환기, 연료준비실 위험구역, 주 가스밸브·DBB, ESD<\/li><li>BOG 균형: 정박·저부하 시 압력 상승 → Type C 축적, 재액화, GCU<\/li><li>열원: 재킷수·폐열로 기화, LNG 냉열 활용<\/li><li>연료 품질: 메탄가와 노킹, 이중화·디젤 모드 전환<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 저압은 설비·NOx, 고압은 메탄 슬립에서 유리하므로, 탄소 규제가 WtW로 강화될수록 고압 방식과 슬립 저감 기술의 비중이 커질 것임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"lh2-carrier","p":15,"n":"15.5","h":"액화수소 운반선 화물창 설계의 기술적 과제","t":"액화수소 운반선 화물창 설계의 기술적 과제","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"액화수소는 −253 °C로 LNG보다 약 90 °C 더 차갑고 밀도는 약 71 kg/m³로 LNG의 약 1/6이다. 그래서 단열 성능(증발률), 공기 액화 방지, 수소취화, 미세 누설이 핵심 과제다. IMO는 2016년 잠정 권고(MSC.420(97))를 2024년 5월 개정 권고(MSC.565(108))로 대체했고, 일본 Suiso Frontier호(1,250 m³ 진공단열 Type C)가 실증선이다.","x":"\n<p class=\"key\">액화수소는 −253 °C로 LNG보다 약 90 °C 더 차갑고 밀도는 약 71 kg/m³로 LNG의 약 1/6이다. 그래서 단열 성능(증발률), 공기 액화 방지, 수소취화, 미세 누설이 핵심 과제다. IMO는 2016년 잠정 권고(MSC.420(97))를 2024년 5월 개정 권고(MSC.565(108))로 대체했고, 일본 Suiso Frontier호(1,250 m³ 진공단열 Type C)가 실증선이다.<\/p>\n<h4>LNG와 비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>LNG<\/th><th>액화수소(LH₂)<\/th><\/tr><\/thead><tbody>\n<tr><td>비점<\/td><td class=\"num\">−162 °C<\/td><td class=\"num\">−253 °C<\/td><\/tr>\n<tr><td>액체 밀도<\/td><td class=\"num\">약 430~470 kg/m³<\/td><td class=\"num\">약 71 kg/m³<\/td><\/tr>\n<tr><td>체적 에너지 밀도<\/td><td class=\"num\">약 21 GJ/m³<\/td><td class=\"num\">약 8.5 GJ/m³<\/td><\/tr>\n<tr><td>가연 범위(공기 중)<\/td><td class=\"num\">약 5~15%<\/td><td class=\"num\">약 4~75%, 최소 점화에너지 매우 작음<\/td><\/tr>\n<tr><td>증발 잠열<\/td><td>상대적으로 큼<\/td><td>매우 작음 → 같은 열 유입에 증발 많음<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>설계 과제<\/h4>\n<ol>\n<li><b>단열<\/b>: 진공 단열(이중 쉘, 다층 단열재) 또는 고성능 폼 + 헬륨 퍼지. 대형화 시 진공 유지와 구조 지지(열교) 설계가 어렵다.<\/li>\n<li><b>공기 액화 방지<\/b>: 표면 온도가 공기 액화 온도(약 −190 °C) 아래면 공기가 응축하며 산소가 농축된 액체가 생겨 화재 위험 → 외부 노출면 온도 관리, 질소가 아닌 헬륨·진공 사용.<\/li>\n<li><b>재료<\/b>: 수소취화와 극저온 인성 → 오스테나이트계 스테인리스(316L 등), 알루미늄 합금. 페라이트계 강 회피.<\/li>\n<li><b>오쏘-파라 전환<\/b>: 액화 과정에서 파라 수소로 충분히 전환하지 않으면 저장 중 전환열로 증발 증가.<\/li>\n<li><b>BOG 활용<\/b>: 증발가스를 수소 기관·연료전지 연료로 사용, 압력 축적 설계.<\/li>\n<li><b>누설·화재<\/b>: 작은 분자로 누설 쉬움, 화염이 거의 보이지 않음 → 이중관·용접 이음, 수소 탐지, 상부 배기, 열화상 감지.<\/li>\n<li><b>슬로싱·하중<\/b>: 밀도가 낮아 액체 하중은 작지만 대용량 탱크의 열수축·지지 구조가 지배.<\/li>\n<\/ol>\n<p>국내 대형 조선소들은 대형 액화수소 운반선 화물창과 기본설계로 선급 기본승인(AiP)을 확보하며 기술을 준비하고 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>액화수소 운반선 화물창 설계 시 기술적 과제<\/td><td class=\"num\">25<\/td><td>LNG 대비 물성표 + 과제 6가지 + 규정<\/td><\/tr>\n<tr><td>LNG와 액화수소의 물성 및 운송 비교<\/td><td class=\"num\">10<\/td><td>비교표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>액화수소는 −253 °C, 밀도 약 71 kg/m³로 LNG보다 90 °C 차갑고 1/6 가벼움. IMO 개정 잠정 권고 MSC.565(108)(2024.5)이 기준이며, 실증선 Suiso Frontier는 1,250 m³ 진공단열 Type C임.<\/p>\n<h5>2. LNG와 비교<\/h5><div class=\"calc\">비점      LNG −162 °C   /  LH₂ −253 °C\n밀도      약 450 kg/m³  /  약 71 kg/m³\n체적에너지 약 21 GJ/m³   /  약 8.5 GJ/m³\n가연범위  약 5~15%     /  약 4~75%<\/div>\n<h5>3. 설계 과제<\/h5><ol><li>단열: 진공 이중 쉘·다층 단열, 대형화 시 진공 유지·열교 지지<\/li><li>공기 액화: 표면이 약 −190 °C 이하면 산소 농축 액체 생성 → 헬륨·진공, 외표면 온도 관리<\/li><li>재료: 수소취화·극저온 인성 → 오스테나이트 스테인리스, 알루미늄<\/li><li>오쏘-파라 전환열에 의한 증발 증가 → 액화 시 충분한 전환<\/li><li>BOG: 증발 잠열이 작아 증발량 큼 → 수소 기관·연료전지 연료화, 압력 축적<\/li><li>누설·화재: 작은 분자 누설, 불가시 화염 → 이중관·용접 이음, 수소 탐지, 열화상<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: LH₂ 운반선의 핵심은 대형 탱크의 단열과 구조 지지의 양립이며, LNG 화물창 기술 축적을 보유한 국내 조선소가 대형화 설계에서 경쟁 우위를 가질 수 있음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"imo-nzf","p":15,"n":"15.6","h":"IMO Net-Zero Framework와 EU FuelEU Maritime","t":"IMO Net-Zero Framework와 EU FuelEU Maritime","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"IMO Net-Zero Framework는 5,000 GT 이상 선박에 연간 연료 GHG 집약도(GFI, WtW 기준 g CO₂e/MJ) 감축 목표를 두 단계(기본 목표·직접 준수 목표)로 부과하고, 미달분은 비용을 내는 구조다. MEPC 83(2025년 4월)에서 승인되었으나 채택은 2025년 10월 특별회기에서 1년 연기되어 2026년 12월 재논의가 예정되어 있다. EU는 이미 FuelEU Maritime(2025~)으로 같은 방향의 규제를 시행 중이다.","x":"\n<p class=\"key\">IMO Net-Zero Framework는 5,000 GT 이상 선박에 연간 연료 GHG 집약도(GFI, WtW 기준 g CO₂e/MJ) 감축 목표를 두 단계(기본 목표·직접 준수 목표)로 부과하고, 미달분은 비용을 내는 구조다. MEPC 83(2025년 4월)에서 승인되었으나 채택은 2025년 10월 특별회기에서 1년 연기되어 2026년 12월 재논의가 예정되어 있다. EU는 이미 FuelEU Maritime(2025~)으로 같은 방향의 규제를 시행 중이다.<\/p>\n<h4>승인안의 구조<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용(승인안 기준)<\/th><\/tr><\/thead><tbody>\n<tr><td>대상<\/td><td>5,000 GT 이상 국제항해 선박, 2028년 적용 목표<\/td><\/tr>\n<tr><td>지표<\/td><td>연간 GFI(전과정 기준), 2008년 기준값 93.3 g CO₂e/MJ<\/td><\/tr>\n<tr><td>목표<\/td><td>2028년 기본 목표 4% 감축, 직접 준수 목표 17% 감축. 직접 준수 목표는 2030년 21%, 2035년 43%<\/td><\/tr>\n<tr><td>미달 시<\/td><td>기본 목표 미달분: Tier 2 구제단위 380달러/t CO₂e, 기본과 직접 준수 사이: Tier 1 구제단위 100달러/t CO₂e (2028~2030 초기 가격)<\/td><\/tr>\n<tr><td>초과 달성<\/td><td>잉여 단위(surplus unit) 발급·거래, 무·저배출 연료 사용 보상<\/td><\/tr>\n<tr><td>재원<\/td><td>IMO Net-Zero Fund로 보상·개도국 전환 지원<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>EU FuelEU Maritime(2025~)<\/h4>\n<ul>\n<li>EU 관련 항해 에너지의 GHG 집약도(WtW)를 기준 91.16 g CO₂e/MJ 대비 2025년 2%, 2030년 6%, 2035년 14.5%, 2040년 31%, 2045년 62%, 2050년 80% 감축.<\/li>\n<li>미달 시 벌금, 선대 내 초과 달성분 공동 산정(pooling), 2030년부터 컨테이너·여객선 육상전원 사용 의무.<\/li>\n<\/ul>\n<h4>선박 설계·조선업 영향<\/h4>\n<ul>\n<li>연료 GHG 집약도가 설계의 최상위 변수가 된다 → 이중연료(LNG·메탄올·암모니아), 바이오·e-연료 사용 대비, 효율 기술 병행.<\/li>\n<li>메탄 슬립, N₂O가 WtW에 반영되므로 기관 형식 선택이 달라진다.<\/li>\n<li>노후·저효율선의 비용 부담 증가 → 교체 발주 수요, 운항선 개조 수요.<\/li>\n<li>규제 불확실성(채택 지연)은 선주의 연료 선택을 늦추는 요인 → 조선소는 연료 전환 대비(fuel-ready) 설계로 대응.<\/li>\n<\/ul>\n<div class=\"warn\"><p>시험 시점에 채택 여부가 바뀌어 있을 수 있다. 답안에는 \"승인안 기준\"임을 밝히고 구조(두 단계 목표 + 가격 메커니즘 + 기금)를 중심으로 쓴다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>IMO Net-Zero Framework의 주요 내용과 조선·해운 영향<\/td><td class=\"num\">25<\/td><td>구조(2단계 목표 + 가격 + 기금) + 영향<\/td><\/tr>\n<tr><td>FuelEU Maritime<\/td><td class=\"num\">10<\/td><td>목표 연도별 수치, 벌금·풀링·OPS<\/td><\/tr>\n<tr><td>GFI(GHG Fuel Intensity)<\/td><td class=\"num\">10<\/td><td>정의·WtW·기준값<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 시험 시점 채택 여부 확인 후 작성\">\n<h5>1. 개요<\/h5><p>2023 개정 IMO GHG 전략(2050년 무렵 순배출 0)의 중기 조치로, 연료 GHG 집약도 규제와 가격 메커니즘을 결합한 MARPOL VI 개정안. MEPC 83(2025.4) 승인, 채택은 2025.10 특별회기에서 1년 연기(2026.12 재개 예정).<\/p>\n<h5>2. 주요 내용(승인안)<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>대상<\/td><td>5,000 GT 이상, 2028년 적용 목표<\/td><\/tr>\n<tr><td>지표<\/td><td>연간 GFI(WtW, g CO₂e/MJ), 2008 기준 93.3<\/td><\/tr>\n<tr><td>목표<\/td><td>2028년 기본 4%·직접 준수 17% 감축, 직접 준수 2030 21%·2035 43%<\/td><\/tr>\n<tr><td>미달<\/td><td>Tier 1 100달러, Tier 2 380달러/t CO₂e 구제단위(초기)<\/td><\/tr>\n<tr><td>보상<\/td><td>잉여 단위 거래, 무·저배출 연료 보상, Net-Zero Fund<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 영향<\/h5><ul><li>해운: 연료 선택이 비용을 직접 좌우, 노후선 비용 부담 증가, EU ETS·FuelEU와 이중 규제 조정 문제<\/li><li>조선: 이중연료·fuel-ready 발주 확대, 메탄 슬립·N₂O가 WtW에 반영되어 기관 선택 변화, 운항선 개조 수요<\/li><li>불확실성: 채택 지연 → 선주 연료 결정 지연<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 탄소 가격이 국제적으로 도입되면 설계 경쟁 축이 \"연비\"에서 \"연료 GHG 집약도\"로 이동하므로, 조선소는 다연료 대응 설계와 WtW 성능 입증 역량을 갖춰야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"ai-design","p":15,"n":"15.7","h":"AI 기반 선박 설계·생산 기술과 적용 시 고려사항","t":"AI 기반 선박 설계·생산 기술과 적용 시 고려사항","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"AI는 계산이 비싼 해석(CFD·FE)을 대리모델로 바꿔 설계 탐색을 빠르게 하고, 도면·규칙 검토와 생산 계획·품질 검사를 자동화한다. 다만 결과의 물리적 타당성과 책임은 여전히 엔지니어가 지므로, 검증 체계(데이터 품질, 설명 가능성, 물리 기반 확인)가 적용의 전제다.","x":"\n<p class=\"key\">AI는 계산이 비싼 해석(CFD·FE)을 대리모델로 바꿔 설계 탐색을 빠르게 하고, 도면·규칙 검토와 생산 계획·품질 검사를 자동화한다. 다만 결과의 물리적 타당성과 책임은 여전히 엔지니어가 지므로, 검증 체계(데이터 품질, 설명 가능성, 물리 기반 확인)가 적용의 전제다.<\/p>\n<h4>설계 분야<\/h4>\n<ul>\n<li><b>선형 최적화<\/b>: 파라메트릭 선형 + CFD 결과로 학습한 대리모델(가우시안 과정, 신경망) → 수천 개 후보를 빠르게 평가, 다흘수·다속력 최적화.<\/li>\n<li><b>구조<\/b>: FE 모델 자동 생성·메시, 규칙 판정 자동화, 브래킷·개구 형상의 위상 최적화, 피로 핫스팟 예측.<\/li>\n<li><b>배치·의장<\/b>: 배관 자동 경로, 간섭 검출, 생성형 설계로 기관실 배치 대안 제시.<\/li>\n<li><b>문서<\/b>: 대규모 언어모델로 규칙·사양 검색과 도면 검토 보조(사람의 최종 확인 필수).<\/li>\n<\/ul>\n<h4>생산·운항 분야<\/h4>\n<ul>\n<li>비전 AI 용접·도장 품질 검사, 블록 정도 계측 자동 판정.<\/li>\n<li>공정·물류 일정 최적화, 용접 로봇 자동 경로.<\/li>\n<li>운항 성능 감시, 기관 고장 예측, 자율운항 충돌 회피.<\/li>\n<\/ul>\n<h4>적용 시 고려사항<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>데이터<\/td><td>실적선·해석·계측 데이터의 품질과 표준화, 보유권·보안<\/td><\/tr>\n<tr><td>검증<\/td><td>학습 범위 밖(새 선형·새 연료) 외삽 위험 → 최종안은 CFD·FE·모형시험으로 확인<\/td><\/tr>\n<tr><td>설명 가능성<\/td><td>선급 승인·책임 소재를 위해 판단 근거 제시. 선급 지침(예: DNV-RP-0671 AI 시스템 보증)<\/td><\/tr>\n<tr><td>조직<\/td><td>엔지니어의 데이터·AI 역량, 기존 설계 프로세스와 통합<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>AI 기반 선박 설계·생산 기술과 적용 시 고려사항<\/td><td class=\"num\">25<\/td><td>설계·생산·운항 분야 사례 + 검증·책임<\/td><\/tr>\n<tr><td>대리모델(surrogate model)을 이용한 선형 최적화<\/td><td class=\"num\">10<\/td><td>원리·장점·한계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>AI는 비싼 해석을 대리모델로 대체해 설계 탐색을 빠르게 하고, 도면·규칙 검토와 생산 계획·검사를 자동화함. 결과의 물리적 타당성과 책임은 엔지니어에게 남음.<\/p>\n<h5>2. 적용 분야<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분야<\/th><th>적용<\/th><\/tr><\/thead><tbody>\n<tr><td>선형<\/td><td>CFD 학습 대리모델로 다흘수·다속력 최적화<\/td><\/tr>\n<tr><td>구조<\/td><td>FE 자동 모델링·규칙 판정, 위상 최적화, 피로 핫스팟 예측<\/td><\/tr>\n<tr><td>의장<\/td><td>배관 자동 경로, 간섭 검출, 기관실 배치 대안 생성<\/td><\/tr>\n<tr><td>문서<\/td><td>언어모델 기반 규칙·사양 검색, 도면 검토 보조<\/td><\/tr>\n<tr><td>생산<\/td><td>비전 용접·도장 검사, 공정·물류 최적화, 로봇 경로<\/td><\/tr>\n<tr><td>운항<\/td><td>성능 감시, 고장 예측, 자율운항 충돌 회피<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 적용 시 고려사항<\/h5><ol><li>데이터: 품질·표준화·보안, 실적선·계측 데이터 축적<\/li><li>검증: 학습 범위 밖 외삽 위험 → 최종안 CFD·FE·모형시험 확인<\/li><li>설명 가능성·책임: 선급 승인 근거, AI 시스템 보증 지침(DNV-RP-0671 등)<\/li><li>조직: 엔지니어 AI 역량, 기존 프로세스 통합<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: AI는 엔지니어를 대체하기보다 설계 대안 탐색과 반복 검토를 맡는 도구이며, 물리 기반 검증 체계 안에서 써야 신뢰성과 승인 가능성을 확보할 수 있음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"shm","p":15,"n":"15.8","h":"선체 구조 모니터링(Hull Monitoring)과 구조 디지털 트윈","t":"선체 구조 모니터링(Hull Monitoring)과 구조 디지털 트윈","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"선체 구조 모니터링은 갑판 장기 변형률계, 가속도계, 압력센서로 운항 중 실제 응력과 충격을 계측해 선장에게 실시간 경고를 주고 피로 손상을 누적 추정하는 시스템이다. 이를 FE 모델과 결합해 계측 하중으로 핫스팟 응력과 잔여 피로수명을 갱신하면 구조 디지털 트윈이 된다.","x":"\n<p class=\"key\">선체 구조 모니터링은 갑판 장기 변형률계, 가속도계, 압력센서로 운항 중 실제 응력과 충격을 계측해 선장에게 실시간 경고를 주고 피로 손상을 누적 추정하는 시스템이다. 이를 FE 모델과 결합해 계측 하중으로 핫스팟 응력과 잔여 피로수명을 갱신하면 구조 디지털 트윈이 된다.<\/p>\n<h4>구성<\/h4>\n<ul>\n<li>센서: 중앙부 갑판 장기 변형률계(종굽힘), 선수부 가속도계·압력계(슬래밍), 선박 운동센서, 필요 시 파고 레이더. 광섬유(FBG) 센서 확대.<\/li>\n<li>처리: 굽힘모멘트 환산, 휘핑·스프링잉 분리, 레인플로 계수 → S-N 곡선과 Miner 법칙으로 피로 손상 누적.<\/li>\n<li>표시: 허용치 대비 응력 비율, 슬래밍 경고, 속력·침로 변경 권고.<\/li>\n<li>규정·표기: IMO 권고(MSC/Circ.646, 산적화물선 선체응력 감시), 선급 부기(DNV HMON, LR ShipRight SEA(HSS) 등).<\/li>\n<\/ul>\n<h4>디지털 트윈으로 확장<\/h4>\n<ol>\n<li>설계 단계 전선 FE 모델과 핫스팟 목록(CM 대상 부위) 준비.<\/li>\n<li>계측 변형률로 실제 파랑 하중을 역추정(하중 식별).<\/li>\n<li>핫스팟 응력 이력 → 실제 운항 기반 누적 손상과 잔여수명 계산.<\/li>\n<li>위험 기반 검사(RBI): 손상이 큰 부위부터 검사·보수 계획.<\/li>\n<li>설계 피드백: 휘핑 기여, 실제 해역 하중으로 후속선 설계 하중 보정.<\/li>\n<\/ol>\n<div class=\"pro\"><p>대형 컨테이너선은 휘핑이 피로 손상에 상당히 기여하는 것으로 계측되고 있다. 설계 피로해석의 스펙트럼 방법과 계측 기반 손상을 비교하는 것은 구조 엔지니어가 가장 잘 쓸 수 있는 25점 답안 소재다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상 (구조 경력자 강추 주제)<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>선체 응력 감시 시스템(Hull Monitoring System)<\/td><td class=\"num\">10<\/td><td>구성·기능·규정<\/td><\/tr>\n<tr><td>디지털 트윈을 이용한 선체 구조 건전성 관리<\/td><td class=\"num\">25<\/td><td>계측 → 하중 식별 → 핫스팟 응력 → 잔여수명 → RBI 흐름<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>선체 구조 모니터링은 운항 중 응력·충격을 계측해 실시간 경고와 피로 손상 누적을 제공하고, FE 모델과 결합하면 실제 하중 기반 잔여수명을 갱신하는 구조 디지털 트윈이 됨.<\/p>\n<h5>2. 시스템 구성<\/h5><ul><li>센서: 중앙부 갑판 장기 변형률계, 선수 가속도·압력계, 운동센서, 광섬유(FBG)<\/li><li>처리: 굽힘모멘트 환산, 휘핑·스프링잉 분리, 레인플로 → S-N·Miner 누적 손상<\/li><li>표시: 허용치 대비 비율, 슬래밍 경고, 속력·침로 권고<\/li><li>근거: IMO MSC/Circ.646, 선급 부기(DNV HMON 등)<\/li><\/ul>\n<h5>3. 디지털 트윈 흐름<\/h5><div class=\"calc\">설계 FE·핫스팟 목록 → 계측 변형률 → 파랑 하중 역추정\n→ 핫스팟 응력 이력 → 실제 누적 손상 D(t) → 잔여 피로수명\n→ 위험 기반 검사(RBI) 계획 → 후속선 설계 하중 피드백<\/div>\n<h5>4. 효과와 과제<\/h5><ul><li>효과: 검사·수리 최적화, 운항 의사결정(황천 회피), 설계 보수성 검증<\/li><li>과제: 센서 신뢰성·교정, 데이터 통신, 하중 역추정 불확실성, 선급 인정 방법<\/li><\/ul>\n<p class=\"concl\"><b>5. 결론<\/b>: 대형 컨테이너선은 휘핑이 피로에 상당히 기여하는 것으로 계측되므로, 설계 스펙트럼 피로해석과 계측 손상을 비교·보정하는 체계가 구조 설계 신뢰도를 높이는 길임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"polar","p":15,"n":"15.9","h":"극지 코드(Polar Code)와 북극항로 운항 선박 설계","t":"극지 코드(Polar Code)와 북극항로 운항 선박 설계","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"극지 코드는 SOLAS XIV와 MARPOL 개정으로 2017년 1월 발효된 극지 해역 운항 선박의 안전·환경 요건이다. 선박을 얼음 조건에 따라 Category A·B·C로 나누고, 극지 운항 온도(PST)에 맞는 재료·설비 방한화, 얼음 하중 구조(IACS Polar Class), 운항 한계 평가(POLARIS)를 요구한다. 국내에서도 북극항로 개척이 정책 과제로 부상했다.","x":"\n<p class=\"key\">극지 코드는 SOLAS XIV와 MARPOL 개정으로 2017년 1월 발효된 극지 해역 운항 선박의 안전·환경 요건이다. 선박을 얼음 조건에 따라 Category A·B·C로 나누고, 극지 운항 온도(PST)에 맞는 재료·설비 방한화, 얼음 하중 구조(IACS Polar Class), 운항 한계 평가(POLARIS)를 요구한다. 국내에서도 북극항로 개척이 정책 과제로 부상했다.<\/p>\n<h4>주요 요건<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>선박 범주<\/td><td>Category A(최소 중간 두께 1년빙 이상), B(얇은 1년빙), C(개방수역 또는 그보다 약한 얼음)<\/td><\/tr>\n<tr><td>구조<\/td><td>IACS Polar Class PC1~PC7(UR I1~I3) 선수·선측 빙하중 보강, 프로펠러·축계 빙하중<\/td><\/tr>\n<tr><td>재료·방한<\/td><td>극지 운항 온도(PST)에 맞는 강재 등급(저온 인성), 갑판기기 히트트레이싱, 제빙, 공기관·통풍통 동결 방지<\/td><\/tr>\n<tr><td>복원성<\/td><td>착빙 하중(노출 갑판·측면 면적당 중량)을 고려한 복원성<\/td><\/tr>\n<tr><td>구명·생존<\/td><td>폐위형 구명정, 개인·집단 생존 키트, 장기 구조 대기 고려<\/td><\/tr>\n<tr><td>운항<\/td><td>극지선박증서, 극지 운항 매뉴얼(PWOM), POLARIS 운항 한계, 항해 계획<\/td><\/tr>\n<tr><td>환경<\/td><td>기름·유해물질 배출 금지 강화, 북극 해역 중유 사용·적재 금지(2024년 7월부터, 일부 예외 2029년까지)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>설계 포인트<\/h4>\n<ul>\n<li>쇄빙 선수 형상과 개빙 수역 내항성의 절충, 이중 작동(DAS: 선미로 쇄빙) 선형.<\/li>\n<li>포드 추진기 빙하중, 고출력 여유.<\/li>\n<li>국내 조선소는 야말 프로젝트 Arc7 쇄빙 LNG선 건조 실적이 있어 극지선 설계 역량을 보유하고 있다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>극지 코드(Polar Code)<\/td><td class=\"num\">10<\/td><td>발효·범주·주요 요건<\/td><\/tr>\n<tr><td>북극항로 운항 선박의 설계 고려사항<\/td><td class=\"num\">25<\/td><td>구조(PC)·재료(PST)·방한·복원성·구명·환경<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>극지 코드는 SOLAS XIV·MARPOL 개정으로 2017.1 발효된 극지 해역 안전·환경 요건이며, 국내에서도 북극항로 개척이 정책 과제로 부상함.<\/p>\n<h5>2. 선박 범주<\/h5><p>Category A(중간 두께 1년빙 이상), B(얇은 1년빙), C(개방수역 또는 약한 얼음)<\/p>\n<h5>3. 설계 고려사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>구조<\/td><td>IACS Polar Class PC1~PC7 선수·선측 빙하중, 프로펠러·축계 빙하중<\/td><\/tr>\n<tr><td>재료<\/td><td>극지 운항 온도(PST)에 맞는 저온 인성 강재 등급<\/td><\/tr>\n<tr><td>방한<\/td><td>갑판기기 히트트레이싱, 제빙, 공기관·통풍통 동결 방지<\/td><\/tr>\n<tr><td>복원성<\/td><td>착빙 하중 반영<\/td><\/tr>\n<tr><td>구명<\/td><td>폐위형 구명정, 생존 키트, 장기 구조 대기<\/td><\/tr>\n<tr><td>운항<\/td><td>극지선박증서, PWOM, POLARIS 운항 한계<\/td><\/tr>\n<tr><td>환경<\/td><td>배출 금지 강화, 북극 중유 사용·적재 금지(2024.7~, 일부 예외 2029)<\/td><\/tr>\n<tr><td>선형·추진<\/td><td>쇄빙 선수와 개빙 수역 내항성 절충, 포드 빙하중, 출력 여유<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 북극항로 선박은 구조·재료·설비 전반의 저온 대응이 필요하며, Arc7 쇄빙 LNG선 실적을 가진 국내 조선소는 북극항로 상업화 시 쇄빙 컨테이너선·LNG선 수요를 선점할 수 있음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"biofouling","p":15,"n":"15.10","h":"선체 생물오손(Biofouling) 관리 지침","t":"선체 생물오손(Biofouling) 관리 지침","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"IMO 2023 생물오손 관리 지침(MEPC.378(80))은 선체와 틈새(niche) 부위에 붙은 생물이 외래종을 옮기는 것을 막고 연비를 지키기 위해, 생물오손 관리계획서와 기록부, 방오 시스템 선정, 점검·수중 청소(포집 포함)를 권고한다. 호주·뉴질랜드 등은 입항 선박에 청결 기준을 강제하고 있다.","x":"\n<p class=\"key\">IMO 2023 생물오손 관리 지침(MEPC.378(80))은 선체와 틈새(niche) 부위에 붙은 생물이 외래종을 옮기는 것을 막고 연비를 지키기 위해, 생물오손 관리계획서와 기록부, 방오 시스템 선정, 점검·수중 청소(포집 포함)를 권고한다. 호주·뉴질랜드 등은 입항 선박에 청결 기준을 강제하고 있다.<\/p>\n<ul>\n<li><b>관리계획서·기록부<\/b>: 선박별 방오 시스템, 점검 주기, 청소 방법, 운항 프로파일(장기 정박 위험) 기록.<\/li>\n<li><b>틈새 부위 설계<\/b>: 씨체스트·그레이팅, 스러스터 터널, 타 힌지, 프로펠러 보스, 빌지킬 끝단, 흡·배출구 → 틈새 최소화, 점검 접근, MGPS·내오손 도장 적용.<\/li>\n<li><b>수중 청소<\/b>: 사전 예방 청소(초기 미세 부착 단계), 청소 잔해 포집, 도막 손상 방지.<\/li>\n<li><b>연계 효과<\/b>: 오손 감소로 마찰저항·연료 감소(CII 개선), 수중방사소음 감소.<\/li>\n<li>조선소 대응: 틈새 부위 설계 표준, 도장 사양(오염박리 도료), 인도 시 관리계획서 초안 제공.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>선체 생물오손(Biofouling) 관리<\/td><td class=\"num\">10<\/td><td>지침 근거·관리계획·틈새 부위·청소<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의·근거<\/h5><p>선체와 틈새 부위에 수중 생물이 부착하는 현상. 외래종 확산과 연비 악화를 막기 위해 IMO 2023 지침(MEPC.378(80))이 관리를 권고, 호주·뉴질랜드 등은 입항 기준 강제.<\/p>\n<h5>2. 관리 요소<\/h5><ul><li>생물오손 관리계획서·기록부<\/li><li>방오 시스템 선정(오염박리 도료 등)<\/li><li>틈새 부위 설계: 씨체스트, 스러스터 터널, 타 힌지, 빌지킬 끝단 → 최소화·점검 접근·MGPS<\/li><li>점검·수중 청소(잔해 포집, 도막 보호)<\/li><\/ul>\n<p class=\"concl\"><b>3. 의견<\/b>: 오손 관리는 CII 개선과 수중방사소음 감소에도 기여하므로 설계 단계 틈새 최소화가 가장 효과적임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"urn","p":15,"n":"15.11","h":"선박 수중방사소음(URN) 저감","t":"선박 수중방사소음(URN) 저감","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"수중방사소음은 선박이 물속으로 내보내는 소음으로, 해양 포유류 의사소통·행동에 영향을 준다. IMO는 2023년 지침(MEPC.1/Circ.906)을 2024년 11월 개정(Rev.1)해 설계 초기부터 URN 관리계획을 세우도록 권고한다. 주 소음원은 프로펠러 캐비테이션이고, 저감 기술은 선체 진동·소음 대책과 같은 원리다.","x":"\n<p class=\"key\">수중방사소음은 선박이 물속으로 내보내는 소음으로, 해양 포유류 의사소통·행동에 영향을 준다. IMO는 2023년 지침(MEPC.1/Circ.906)을 2024년 11월 개정(Rev.1)해 설계 초기부터 URN 관리계획을 세우도록 권고한다. 주 소음원은 프로펠러 캐비테이션이고, 저감 기술은 선체 진동·소음 대책과 같은 원리다.<\/p>\n<ul>\n<li><b>소음원<\/b>: 프로펠러 캐비테이션(광대역·날개진동수 성분, 가장 큼), 기관·발전기 구조 전달, 유동 소음.<\/li>\n<li><b>설계 대책<\/b>: 캐비테이션 개시 속도를 높이는 프로펠러 설계(스큐, 날개 끝 하중 경감), 반류 균일화, 탄성 마운트·이중 탄성 지지, 선체 감쇠재, 저소음 보기.<\/li>\n<li><b>운항 대책<\/b>: 감속(캐비테이션 개시 속도 이하), 선체·프로펠러 청결 유지, 민감 해역 항로 조정.<\/li>\n<li><b>평가<\/b>: 계측 표준(ISO 17208), 선급 부기(DNV SILENT 등), 관리계획(목표·기술·운항·점검).<\/li>\n<li>함정의 음향 스텔스 기술과 같은 축이어서, 국내 조선소의 함정 기술과 연결된다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>선박 수중방사소음(URN)<\/td><td class=\"num\">10<\/td><td>원인·지침·대책<\/td><\/tr>\n<tr><td>선박 소음·진동과 수중방사소음 저감 설계<\/td><td class=\"num\">25<\/td><td>기존 소음·진동 지식에 URN 관리계획 연결<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의·근거<\/h5><p>선박이 물속으로 방사하는 소음으로 해양 포유류에 영향. IMO 지침 MEPC.1/Circ.906(2023), 2024.11 개정(Rev.1)으로 설계 초기 URN 관리계획 권고.<\/p>\n<h5>2. 원인<\/h5><p>프로펠러 캐비테이션(최대), 기관·발전기 구조 전달, 유동 소음.<\/p>\n<h5>3. 대책<\/h5><ul><li>설계: 캐비테이션 개시 속도 상향(스큐·날개 끝 하중 경감), 반류 균일화, 탄성 마운트, 감쇠재<\/li><li>운항: 개시 속도 이하 감속, 선체·프로펠러 청결, 민감 해역 항로 조정<\/li><li>평가: ISO 17208 계측, 선급 부기(DNV SILENT 등)<\/li><\/ul>\n<p class=\"concl\"><b>4. 의견<\/b>: 캐비테이션 저감은 진동·효율·URN을 동시에 개선하므로 설계 우선순위가 높음.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"masga","p":15,"n":"15.12","h":"한미 조선협력(MASGA)과 함정 MRO가 국내 조선산업에 미치는 영향","t":"한미 조선협력(MASGA)과 함정 MRO가 국내 조선산업에 미치는 영향","c":0,"r":0,"b":[{"c":"pred","t":"예상"},{"c":"mdl","t":"모범답안 수록"}],"ch":[],"q":[],"k":"MASGA(Make American Shipbuilding Great Again)는 2025년 한미 통상 합의의 대미 투자 3,500억 달러 중 1,500억 달러를 미국 조선업 재건에 쓰는 협력 패키지다. 한국 기업이 주도하고 정책금융이 보증·금융을 뒷받침하며, 2026년 6월 정책금융기관과 국내 3대 조선사의 이행 MOU, 7월 워싱턴 한미 조선협력센터 개소로 본격화됐다.","x":"\n<p class=\"key\">MASGA(Make American Shipbuilding Great Again)는 2025년 한미 통상 합의의 대미 투자 3,500억 달러 중 1,500억 달러를 미국 조선업 재건에 쓰는 협력 패키지다. 한국 기업이 주도하고 정책금융이 보증·금융을 뒷받침하며, 2026년 6월 정책금융기관과 국내 3대 조선사의 이행 MOU, 7월 워싱턴 한미 조선협력센터 개소로 본격화됐다.<\/p>\n<h4>주요 내용<\/h4>\n<ul>\n<li><b>현지 투자<\/b>: 미국 조선소 인수·현대화(한화의 필리조선소 등), 스마트야드·자동화 기술 이전.<\/li>\n<li><b>함정 MRO<\/b>: 미 해군 지원함 정비·수리(MRO)를 국내 조선소가 수행하는 실적 축적.<\/li>\n<li><b>공급망·인력<\/b>: 기자재 공급망, 용접·설계 인력 양성, 공동 R&amp;D.<\/li>\n<li><b>배경<\/b>: 미국 상선·함정 건조 능력 약화, 중국 견제(미국 USTR의 중국 관련 선박 입항 수수료 조치는 2025년 11월부터 1년 유예).<\/li>\n<\/ul>\n<h4>국내 조선산업 영향<\/h4>\n<div class=\"grid2\"><div class=\"box\"><h5>기회<\/h5><ul><li>미 해군 MRO·신조 시장 진입, 방산 수출<\/li><li>미국 내 LNG선·상선 수요와 연계<\/li><li>기술·장비 수출, 브랜드 신뢰<\/li><\/ul><\/div>\n<div class=\"box\"><h5>과제<\/h5><ul><li>미국 법적 제약(해외 건조 함정 금지, 존스법 등)<\/li><li>현지 인력·생산성, 원가 경쟁력<\/li><li>기술 유출·보안(수출 통제), 국내 생산 기반 공동화 우려<\/li><\/ul><\/div><\/div>\n<p>기술사 관점의 결론은 \"국내 설계·핵심 공정 경쟁력은 지키고, 미국 현지는 MRO·모듈·자동화 협력으로 단계적 진입\"이다. 시험 시점의 진행 상황(사업 선정, 법 개정)을 확인해 쓴다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2027 예상<\/p>\n<h4>예상 문제 문장<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>예상 문장<\/th><th>배점<\/th><th>쓰는 방향<\/th><\/tr><\/thead><tbody>\n<tr><td>한미 조선협력(MASGA)이 국내 조선산업에 미치는 영향과 대응방안<\/td><td class=\"num\">25<\/td><td>배경·내용·기회·과제·대응<\/td><\/tr>\n<tr><td>함정 MRO<\/td><td class=\"num\">10<\/td><td>정의·국내 실적·의의<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 시험 시점 진행 상황 확인 후 작성\">\n<h5>1. 개요<\/h5><p>MASGA는 2025년 한미 통상 합의의 대미 투자 3,500억 달러 중 1,500억 달러를 미국 조선업 재건에 쓰는 협력 패키지로, 기업 주도·정책금융 보증 구조임. 2026.6 이행 MOU, 2026.7 워싱턴 한미 조선협력센터 개소.<\/p>\n<h5>2. 배경<\/h5><p>미국 상선·함정 건조 능력 약화, 해군 정비 수요 적체, 중국 견제(USTR 입항 수수료 조치는 2025.11부터 1년 유예).<\/p>\n<h5>3. 주요 내용<\/h5><ul><li>미국 조선소 인수·현대화, 스마트야드·자동화 기술<\/li><li>미 해군 지원함 MRO 수행<\/li><li>공급망·인력 양성·공동 R&amp;D<\/li><\/ul>\n<h5>4. 영향<\/h5>\n<div class=\"grid2\"><div class=\"box\"><h5>기회<\/h5><ul><li>미 해군 MRO·신조 시장<\/li><li>미국 LNG 수출 연계 LNG선<\/li><li>기술·장비 수출<\/li><\/ul><\/div><div class=\"box\"><h5>과제<\/h5><ul><li>해외 건조 함정 금지·존스법 등 법적 제약<\/li><li>현지 인력·생산성·원가<\/li><li>기술 유출, 국내 생산기반 공동화<\/li><\/ul><\/div><\/div>\n<h5>5. 대응방안<\/h5><ol><li>국내: 설계·핵심 공정·고부가 선종 경쟁력 유지, 인력 확보<\/li><li>미국: MRO → 모듈·블록 공급 → 현지 건조로 단계적 진입<\/li><li>정책: 법 개정 동향 대응, 수출 통제·보안 관리, 금융 보증<\/li><\/ol>\n<p class=\"concl\"><b>6. 결론<\/b>: 한미 협력은 수주 기반 확대 기회지만 국내 조선 생태계의 핵심 역량을 지키는 범위에서 단계적으로 추진해야 하며, 미국 법 개정과 사업 선정 진행을 지속 확인해야 함.<\/p>\n<\/div>\n<\/section><\/details>"}],"guide":"\n\n\n<h3>1. 시험 구조<\/h3>\n<div class=\"scroll\"><table class=\"t\">\n<thead><tr><th>구분<\/th><th>내용<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>시행<\/td><td>연 1회. 최근 10년은 매년 상반기 회차(112·115·…·139회)에 조선기술사가 출제됨. 2027년은 제142회(5월 예상)<\/td><\/tr>\n<tr><td>필기 과목<\/td><td>선박설계, 선박건조공학, 선박동력장치설계, 생산관리 및 기타 조선에 관한 사항<\/td><\/tr>\n<tr><td>1교시<\/td><td>단답형 13문제 중 <b>10문제<\/b> 선택, 각 10점, 100분<\/td><\/tr>\n<tr><td>2·3·4교시<\/td><td>논술형 6문제 중 <b>4문제<\/b> 선택, 각 25점, 교시당 100분<\/td><\/tr>\n<tr><td>합격 기준<\/td><td>필기·면접 모두 100점 만점에 60점 이상. 면접은 구술형 약 30분<\/td><\/tr>\n<tr><td>채점<\/td><td>채점기준과 모범답안은 정보공개법 제9조제1항제5호에 따라 비공개<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>시간으로 환산하면 1교시는 문제당 약 9분, 2~4교시는 문제당 약 23분입니다. 10점 문제는 정의·원리·그림·특징을 반 쪽에서 한 쪽으로, 25점 문제는 개요·원리·본론·실무·결론을 두세 쪽으로 쓰는 것이 기준입니다.<\/p>\n\n<h3>2. 무엇이 나왔나<\/h3>\n<div class=\"stat\">\n<div><b>310<\/b><span>10개 회차 총 문항<\/span><\/div>\n<div><b>5<\/b><span>최다 반복(블록분할·기밀시험 각 5회)<\/span><\/div>\n<div><b>13<\/b><span>3회 이상 반복된 주제<\/span><\/div>\n<div><b>1<\/b><span>순수 계산 문제(121회 1자유도)<\/span><\/div>\n<\/div>\n<figure class=\"fig wide\"><div class=\"scroll\"><svg viewBox=\"0 0 660 406\" role=\"img\" aria-label=\"파트별 기출 문항 수\"><g><title>선박계산 · 복원성 · 만재흘수선: 전체 21문항, 최근 4회(130~139회) 9문항<\/title><text x=\"226\" y=\"24\" class=\"sl\" text-anchor=\"end\">01 선박계산 · 복원성 · 만재흘수선<\/text><path d=\"M236 13 h227.0 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-227.0 z\" class=\"sb\"/><text x=\"475.0\" y=\"25\" class=\"sv\">21<\/text><\/g><g><title>저항 · 추진 · 조종 · 내항: 전체 34문항, 최근 4회(130~139회) 8문항<\/title><text x=\"226\" y=\"52\" class=\"sl\" text-anchor=\"end\">02 저항 · 추진 · 조종 · 내항<\/text><path d=\"M236 41 h370.0 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-370.0 z\" class=\"sb\"/><text x=\"618.0\" y=\"53\" class=\"sv\">34<\/text><\/g><g><title>선체구조 · 강도 · 재료: 전체 27문항, 최근 4회(130~139회) 7문항<\/title><text x=\"226\" y=\"80\" class=\"sl\" text-anchor=\"end\">03 선체구조 · 강도 · 재료<\/text><path d=\"M236 69 h293.0 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-293.0 z\" class=\"sb\"/><text x=\"541.0\" y=\"81\" class=\"sv\">27<\/text><\/g><g><title>진동 · 소음: 전체 7문항, 최근 4회(130~139회) 3문항<\/title><text x=\"226\" y=\"108\" class=\"sl\" text-anchor=\"end\">04 진동 · 소음<\/text><path d=\"M236 97 h73.0 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-73.0 z\" class=\"sb\"/><text x=\"321.0\" y=\"109\" class=\"sv\">7<\/text><\/g><g><title>용접 · 절단 · 가공 · 검사: 전체 21문항, 최근 4회(130~139회) 7문항<\/title><text x=\"226\" y=\"136\" class=\"sl\" text-anchor=\"end\">05 용접 · 절단 · 가공 · 검사<\/tex "/><\/g><g><title>139회 · 조선 경영 · 금융 · 계약: 3문항<\/title><rect x=\"669\" y=\"354\" width=\"46\" height=\"23\" rx=\"3\" class=\"hc hit\" style=\"fill-opacity:0.52\"/><text x=\"692.0\" y=\"369\" class=\"hv\" text-anchor=\"middle\">3<\/text><\/g><\/svg><\/div><figcaption>회차 × 파트 출제 분포. 칸이 진할수록 그 회차에 해당 파트 문항이 많다. 칸에 마우스를 올리면 수치가 보인다.<\/figcaption><\/figure>\n\n<h4>출제 경향 다섯 가지<\/h4>\n<ol>\n<li><b>생산·용접·검사가 가장 두텁다.<\/b> 블록분할(5회), 탱크 기밀시험(5회), 비파괴검사(4회, UT 단독 1회 별도), 곡가공(3회), 절단 정밀도(2회)처럼 조선소 실무 공정이 해마다 나옵니다. 공정 흐름과 원인-대책 표로 쓰면 점수가 안정적입니다.<\/li>\n<li><b>2021년(124회) 이후 친환경 규제가 상수다.<\/b> EEDI·EEXI·CII·연료계수·EU ETS·EU MRV·IMO 2020·HKC·TtW/WtW가 매 회 1~3문항씩 나옵니다. 연도·수치(감축률, 적용 시점)를 정확히 쓰는 것이 차별점입니다.<\/li>\n<li><b>LNG와 가스선이 매년 나온다.<\/b> IGC·IGF, 탱크 형식, 슬로싱, 충전한도, 고망간강·9% Ni, 메탄슬립, LCO<sub>2<\/sub>. 136회는 63,000 DWT 벌크선 제원을 주고 연료탱크 형식과 배치를 결정하게 하는 설계형 문제였습니다.<\/li>\n<li><b>국내 법령 조문형 문제가 늘었다.<\/b> 선박안전법 시행규칙(선박시설), 해상교통안전법 시행규칙(금지 시운전 5종), 전기추진선박기준(경보 10종), 친환경선박법(5종), 선박투자회사법, 선박소방설비기준(전기차 운송선). 개수를 묻기 때문에 목록을 외워야 합니다. 이 책은 2026년 현행 조문을 확인해 실었습니다.<\/li>\n<li><b>현장 시나리오형이 25점 문제의 핵심이다.<\/b> HT36 자리에 HT32 오시공, Suezmax 외판 변형, 인도 전 scantling draught 증가 요구, 화물창 용량 증가, 빌지킬 높이 2배. 정답이 하나가 아니므로 \"검토 → 대안 비교 → 권고안 → 선급·선주 승인\" 흐름으로 쓰는 것이 채점자가 원하는 기술사의 판단입니다.<\/li>\n<\/ol>\n\n<h4>반복 출제 순위<\/h4>\n<div class=\"scroll\"><table class=\"t rank\"><thead><tr><th>횟수<\/th><th>주제<\/th><th>출제 회차<\/th><\/tr><\/thead><tbody><tr><td class=\"num\">5<\/td><td><a href=\"#/t/block-division\">6.1 선체 블록분할(Block Division) 시 고려사항<\/a><\/td><td class=\"sits\">112 · 118 · 124 · 133 · 139<\/td><\/tr><tr><td class=\"num\">5<\/td><td><a href=\"#/t/tightness-tests\">7.4 탱크·선체 기밀시험: Tank Air Test, Hose Test, Leak Test, 수기압(Hydropneumatic) Test<\/a><\/td><td class=\"sits\">124 · 130 · 133 · 139<\/td><\/tr><tr><td class=\"num\">4<\/td><td><a href=\"#/t/inclining\">1.5 경사시험(Inclining Test)의 목적·원리·절차와 복원성 불만족 시 대책<\/a><\/td><td class=\"sits\">118 · 127 · 133 · 136<\/td><\/tr><tr><td class=\"num\">4<\/td><td><a href=\"#/t/ndt\ class=\"sits\">121 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/weld-defects\">5.7 용접부의 주요 결함 종류, 발생원인 및 방지대책 (언더컷 포함)<\/a><\/td><td class=\"sits\">136 · 139<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/cutting-accuracy\">5.12 선각공사에서 절단 정밀도를 좌우하는 요인<\/a><\/td><td class=\"sits\">118 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/corrosion-protection\">6.19 선박 방식장치의 종류와 장단점 (외부전원방식 ICCP 포함)<\/a><\/td><td class=\"sits\">112 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/sea-trials\">7.1 시운전의 목적과 종류, 속력·조종성능 관련 시운전 항목<\/a><\/td><td class=\"sits\">118 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/anchor-mockup\">7.5 앵커 목업시험(Anchor Mock-up Test)의 필요성<\/a><\/td><td class=\"sits\">121 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/dead-ship\">7.8 Dead Ship 상태와 Dead Ship Recovery Test<\/a><\/td><td class=\"sits\">124 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/me-selection\">8.10 최적 주기관(M/E) 선정 시 고려사항<\/a><\/td><td class=\"sits\">124 · 133<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/whrs\">8.12 폐열회수시스템(WHRS)과 미설치 선박과의 연료소비량 비교<\/a><\/td><td class=\"sits\">118 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/shaft-gen\">8.13 샤프트 제너레이터 시스템과 하이브리드의 PTO·PTI·PTH 모드<\/a><\/td><td class=\"sits\">130 · 139<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/electric-propulsion\">8.14 전기추진설비, 그리고 복합(하이브리드)추진과 전기추진의 특징<\/a><\/td><td class=\"sits\">127 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/eprop-rules\">8.15 전기추진선박기준: 조종장소 경보 10가지와 배터리 배치·요건<\/a><\/td><td class=\"sits\">127 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/stern-tube\">8.16 선미관(Stern Tube)의 용도, 종류와 특성, 배치도 각부 명칭<\/a><\/td><td class=\"sits\">118 · 136<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/engine-room\">8.18 일반상선 기관실 구획길이 결정방법과 기관실 구획배치 시 고려사항<\/a><\/td><td class=\"sits\">127 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/container-lashing\">9.2 컨테이너 고박장치: 로드식 고박 속구와 래싱 브리지(Lashing Bridge)<\/a><\/td><td class=\"sits\">112 · 121<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/ballast-system\">9.8 밸러스트 장치의 설계순서와 밸러스트 파이프 배관방식<\/a><\/td><td class=\"sits\">127<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/cargo-pumping\">9.9 액체화물 펌핑시스템의 종류·구성품과 스트리핑 펌프<\/a><\/td><td class=\"sits\">130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/lng-fuel-tank\">10.8 LNG 추진선박의 연료탱크 설계 기준과 선종·크기별 탱크 선정 (개조 포함)<\/a><\/td><td class=\"sits\">124 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/cii\">11.3 탄소집약도지표(CII)와 CII 등급 향상 방안<\/a><\/td><td class=\"sits\">124 · 139<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/bwm\">11.9 선박평형수관리협약(BWM Convention)<\/a><\/td><td class=\"sits\">112 · 124<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/fire-systems\">12.5 선박 화재의 원인, 화재탐지장치·소화장치의 종류와 소방설비<\/a><\/td><td class=\"sits\">121 · 133<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/iacs\">12.14 국제선급연합회(IACS)<\/a><\/td><td class=\"sits\">118 · 133<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/marine-equipment\">13.16 조선기자재의 특성과 요구사항<\/a><\/td><td class=\"sits\">112 · 133<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/freight-indices\">14.1 해운 운임지수: BDI(Baltic Dry Index)와 SCFI(Shanghai Containerized Freight Index)<\/a><\/td><td class=\"sits\">112 · 130<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/heavy-tail\">14.2 선박건조비 지급방식: Heavy-tail과 Top-heavy, 그리고 문제점<\/a><\/td><td class=\"sits\">112 · 139<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/rg\">14.3 RG(Refund Guarantee, 선수금 환급보증)<\/a><\/td><td class=\"sits\">118 · 133<\/td><\/tr><tr><td class=\"num\">2<\/td><td><a href=\"#/t/ship-investment\">14.7 선박투자회사법: 선박투자회사·선박운용회사의 정의와 업무범위<\/a><\/td><td class=\"sits\">121 · 127<\/td><\/tr><\/tbody><\/table><\/div>\n\n<h3>3. 답안 쓰는 법<\/h3>\n<div class=\"grid2\">\n<div class=\"box\"><h5>10점 (1교시)<\/h5>\n<ol>\n<li><b>정의<\/b> 한두 줄. 영문 용어 병기<\/li>\n<li><b>원리·그림<\/b> 식이나 개념도 하나<\/li>\n<li><b>특징·종류·적용<\/b> 3~5개 항목 또는 작은 표<\/li>\n<li><b>의견<\/b> 한 줄: 설계·생산에서 무엇을 조심하는가<\/li>\n<\/ol><\/div>\n<div class=\"box\"><h5>25점 (2~4교시)<\/h5>\n<ol>\n<li><b>개요<\/b> 배경과 왜 중요한가<\/li>\n<li><b>원리<\/b> 역학·열역학·규정의 근거<\/li>\n<li><b>본론<\/b> 분류·절차·비교표, 그림 1~2개<\/li>\n<li><b>실무<\/b> 규칙명·수치·현장 관리점<\/li>\n<li><b>결론<\/b> 기술사로서의 판단과 권고<\/li>\n<\/ol><\/div>\n<\/div>\n<p>채점자는 같은 내용을 수십 장 읽습니다. 첫 줄에 결론이 있고, 그림이 있고, 규칙 이름과 수치가 정확한 답안이 눈에 띕니다. 각 답안 맨 위의 붉은 <b>핵심<\/b> 상자는 답안 첫머리에 그대로 쓰는 문장이고, <b>현업 포인트<\/b>는 결론부에 쓰는 기술사 의견, <b>답안 전략<\/b>은 배점이 갈리는 지점입니다.<\/p>\n\n<h3>4. 이 책을 쓰는 법<\/h3>\n<ul>\n<li>왼쪽 목차의 숫자 배지는 출제 횟수입니다. 붉은 배지(3회 이상)부터 외우십시오. 오른쪽 작은 점은 학습 상태입니다.<\/li>\n<li>각 답안 제목 옆 버튼을 누르면 학습 상태가 <b>학습 전 → 1회독 → 답안 작성 → 암기 완료<\/b> 순으로 바뀝니다. 상태는 이 브라우저에 저장되고, 아래 100일 플랜의 진도표에 바로 반영됩니다.<\/li>\n<li>검색창에 키워드를 넣으면 주제와 기출 원문을 함께 찾습니다. 예: <code>IGF<\/code>, <code>경사<\/code>, <code>139회<\/code>.<\/li>\n<li>\"기출 원문 보기\"를 열면 그 주제로 나온 실제 문제 문장을 모두 볼 수 있습니다. 같은 주제라도 묻는 방향(목적/절차/대책)이 다르니 원문에 맞춰 강조점을 바꾸십시오.<\/li>\n<li>\"예상\" 배지는 아직 출제되지 않았지만 2027년 출제 가능성이 높은 주제입니다(PART 15).<\/li>\n<\/ul>\n<h3>1. 기본 방침: 약한 파트를 먼저, 강한 파트는 손으로 쓰는 속도를<\/h3>\n<p>구조 실무 경력이 있다면 선체구조·강도(PART 03), 진동(04), 용접·검사(05)와 복원성(01)의 상당 부분은 이미 머리에 있습니다. 이 파트들은 시험장에서 고를 \"확실한 득점 문항\"으로 남겨 두고, 100일의 앞쪽은 출제 비중이 크면서 낯선 파트에 씁니다. 다만 아는 내용도 25분 안에 두 쪽을 쓰는 것은 따로 연습해야 하므로, 강한 파트는 후반에 실전 답안 쓰기로 다룹니다.<\/p>\n<div class=\"grid2\">\n<div class=\"box\"><h5>먼저 할 것 (출제 비중 대비 낯선 영역)<\/h5><ul>\n<li>기관·동력장치(08), 의장·배관·HVAC(09)<\/li>\n<li>환경 규제(11), 협약·국내법(12) — 수치·목록 암기형<\/li>\n<li>시운전·검사(07), 경영·금융·계약(14)<\/li>\n<li>가스선·대체연료(10), 2027 예상(15)<\/li><\/ul><\/div>\n<div class=\"box\"><h5>나중에 할 것 (강점 영역 → 실전 쓰기)<\/h5><ul>\n<li>선체구조·강도(03): CSR·종강도·좌굴 답안을 시간 재고 쓰기<\/li>\n<li>진동(04), 용접·검사(05): 표와 그림 위주로 빠르게<\/li>\n<li>복원성(01): 경사시험·손상복원성 수치 정리<\/li>\n<li>생산(06): 블록분할·선행의장 반복 주제<\/li><\/ul><\/div>\n<\/div>\n\n<h3>3. 100일 로드맵<\/h3>\n<div class=\"scroll\"><table class=\"t\">\n<thead><tr><th>단계<\/th><th>기간<\/th><th>목표<\/th><th>방법<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1 기본 1회독<\/td><td>D-100 ~ D-51 (7주)<\/td><td>우선순위 순으로 전 파트 1회독<\/td><td>주 2파트. 각 주제 \"핵심\" 상자와 표·그림을 노트 한 장으로 요약, 상태를 \"1회독\"으로<\/td><\/tr>\n<tr><td>2 반복 주제 답안<\/td><td>D-50 ~ D-29 (3주)<\/td><td>반복 출제 주제와 예상 주제를 답안으로<\/td><td>3회 이상 반복 13주제 + 2회 반복 주제 + PART 15를 손으로 써 보기. 상태 \"답안 작성\"<\/td><\/tr>\n<tr><td>3 실전 모의<\/td><td>D-28 ~ D-8 (3주)<\/td><td>회차별 400분 실전<\/td><td>최근 회차부터(139→112) 주 3회차. 1교시 9분, 2~4교시 23분 시간 엄수. 틀린 주제는 다시 1단계로<\/td><\/tr>\n<tr><td>4 마무리<\/td><td>D-7 ~ D-1<\/td><td>암기·최신 이슈<\/td><td>수치·법령 목록, 핵심 문장, IMO 최근 회의 결과 확인. 상태 \"암기 완료\"<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h3>5. 시험장 전략<\/h3>\n<div class=\"grid2\">\n<div class=\"box\"><h5>1교시 (13문제 중 10문제)<\/h5><ul>\n<li>처음 5분: 13문제를 훑고 쓸 10문제와 순서를 표시<\/li>\n<li>문제당 9분: 정의 2줄 → 그림·식 1개 → 특징 3~5개 → 의견 1줄<\/li>\n<li>모르는 용어 3개는 과감히 버리고, 아는 10개를 꽉 채운다<\/li><\/ul><\/div>\n<div class=\"box\"><h5>2~4교시 (6문제 중 4문제)<\/h5><ul>\n<li>문제당 23분, 두세 쪽. 개요 10% · 본론 70% · 결론 20%<\/li>\n<li>본론에 표 1개와 그림 1개는 반드시. 번호 체계(1. → 1) → ①)로 구조를 보이게<\/li>\n<li>결론에는 \"기술사로서 권고안\"을 한 문단으로<\/li><\/ul><\/div>\n<\/div>\n<ul>\n<li><b>손으로 쓰는 연습<\/b>: 필기는 수기 답안입니다. 3단계부터는 주 3회 이상 실제 답안지 분량으로 쓰고, 글씨·그림 속도를 잰다.<\/li>\n<li><b>서브노트<\/b>: 주제마다 \"핵심 문장 1 + 키워드 5 + 그림 1\"을 한 장에. 시험 전날은 이 노트만 본다.<\/li>\n<li><b>암기 목록<\/b>: IS Code 6개 수치, ICLL 코밍·공기관 높이, 의장수 식, CII 감축률, EEDI Phase, 각종 법령 목록(선박시설, 금지 시운전, 전기추진 경보 10, 친환경선박 5), IGC 수치(에어로크 1.5~2.5 m, FL 98%).<\/li>\n<li><b>최신 이슈<\/b>: 시험 전 3개월 동안 IMO MEPC·MSC 결과(IMO Net-Zero Framework 특별회기, 암모니아·수소 지침)와 국내 정책(북극항로, 한미 조선협력)을 확인한다.<\/li>\n<li><b>면접 대비<\/b>: 필기 합격 후에는 본인 실무(구조 설계·해석) 사례를 \"문제-판단-결과\"로 3~4개 정리해 둔다.<\/li>\n<\/ul>\n","index":"<details class=\"sit\" open><summary>제139회 (2026년) · 31문항<\/summary><div class=\"scroll\"><table class=\"t idx\"><thead><tr><th>교시-번호<\/th><th>문제<\/th><th>본문<\/th><\/tr><\/thead><tbody><tr><td class=\"num\">1-1<\/td><td>repose angle<\/td><td class=\"n   [].forEach.call(document.querySelectorAll('#sth button'),function(b){b.onclick=function(){var v=b.getAttribute('data-v');
    if(v==='auto'){root.removeAttribute('data-theme'); try{localStorage.removeItem('pe-theme');}catch(e){}} else {root.setAttribute('data-theme',v); try{localStorage.setItem('pe-theme',v);}catch(e){}} settings();};});
  [].forEach.call(document.querySelectorAll('#sfs button'),function(b){b.onclick=function(){fsz=+b.getAttribute('data-v'); save('app-fs',fsz); applyFs(); settings();};});
  document.getElementById('sex').onchange=function(e){exam=e.target.value||'2027-05-15'; save('pe-exam',exam); toast('목표일을 바꿨습니다');};
  [].forEach.call(document.querySelectorAll('select[data-p]'),function(s){s.onchange=function(){self[+s.getAttribute('data-p')]=+s.value; save('pe-self',self); toast('우선순위를 다시 계산했습니다');};});
  var code=document.getElementById('code');
  document.getElementById('bk').onclick=function(){var c=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,r:reads,w:wrote,m:mem,s:self,e:exam}))));
    code.value=c; code.select();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(function(){toast('백업 코드를 복사했습니다');},function(){toast('코드를 길게 눌러 복사하세요');}); else toast('코드를 길게 눌러 복사하세요');};
  document.getElementById('rs').onclick=function(){try{var o=JSON.parse(decodeURIComponent(escape(atob(code.value.trim())))); if(!o||o.v!==1) throw 0;
    reads=o.r||{}; wrote=o.w||{}; mem=o.m||{}; self=o.s||self; exam=o.e||exam; save('pe-reads',reads); save('app-wrote',wrote); save('app-mem',mem); save('pe-self',self); save('pe-exam',exam);
    toast('기록을 복원했습니다'); settings();}catch(e){toast('코드를 확인해 주세요');}};
  var armed=false; document.getElementById('rst').onclick=function(){var b=this; if(!armed){armed=true; b.textContent='한 번 더 누르면 지워집니다'; setTimeout(function(){armed=false; b.textContent='모든 학습 기록 지우기';},5000); return;}
    reads={}; wrote={}; mem={}; last=null; save('pe-reads',reads); save('app-wrote',wrote); save('app-mem',mem); save('pe-status',{}); save('app-last',null);
    armed=false; b.textContent='모든 학습 기록 지우기'; document.getElementById('rstm').textContent='학습 기록을 지웠습니다.';};}
function page(kind){tabsOn('toc');
  V.innerHTML='<div class="v"><div class="hd"><a class="ib" href="#/toc" aria-label="목차로">'+ic('back')+'</a><h1>'+esc(kind==='index'?'회차별 기출 원문 색인':L.guide)+'</h1></div><div class="page intro">'+(kind==='index'?D.index:D.guide)+'</div></div>';
  typeset(V);}

// ---------- helpers ----------
var tt=null; function toast(m){var el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},1800);}
function typeset(el){if(window.MathJax&&MathJax.startup&&MathJax.startup.promise){MathJax.startup.promise.then(function(){return MathJax.typesetPromise([el]);}).catch(function(){});}
  else setTimeout(function(){typeset(el);},300);}
function go(h){location.hash=h;}
var scrollMem={}, cur='';
function route(){var h=location.hash||'#/', m;
  if(/^#[a-z0-9-]+$/.test(h)&&T[h.slice(1)]){location.replace('#/t/'+h.slice(1)); return;}
  if(cur&&!/^#\/t\//.test(cur)) scrollMem[cur]=window.scrollY;
  cur=h.split('?')[0];
  if((m=h.match(/^#\/t\/([a-z0-9-]+)(\?resume)?/))) topic(m[1],!!m[2]);
  else if((m=h.match(/^#\/m\/(\d+)/))) module(+m[1]);
  else if(h==='#/toc') toc(); else if(h==='#/search') search(); else if(h==='#/stats') statsView(); else if(h==='#/set') settings();
  else if(h==='#/guide') page('guide'); else if(h==='#/index') page('index'); else home();
  if(!/^#\/t\//.test(h)) window.scrollTo(0,scrollMem[cur]||0);}
window.addEventListener('hashchange',route);
// reading position inside a topic (for 이어보기) + top progress line
var sp=null; window.addEventListener('scroll',function(){var m=cur.match(/^#\/t\/(.+)/); if(!m) return;
  var max=document.documentElement.scrollHeight-innerHeight, y=max>0?Math.min(1,window.scrollY/max):0;
  PROG.style.width=(100*y).toFixed(1)+'%';
  clearTimeout(sp); sp=setTimeout(function(){last={id:m[1],y:y}; save('app-last',last);},400);},{passive:true});
// tap a figure to enlarge
V.addEventListener('click',function(e){var svg=e.target.closest&&e.target.closest('.topic .fig svg, .page .fig svg'); if(!svg) return;
  var z=document.createElement('div'); z.className='zoom'; z.setAttribute('role','dialog'); z.setAttribute('aria-label','그림 크게 보기');
  z.innerHTML='<p>밀어서 이동 · 두 손가락으로 확대</p><button class="ib zx" type="button" aria-label="닫기">'+ic('x')+'</button>';
  z.appendChild(svg.cloneNode(true)); document.body.appendChild(z); z.querySelector('.zx').onclick=function(){z.remove();};});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var z=document.querySelector('.zoom'); if(z) z.remove();}});
route();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();

</script>
