제2종<\/td><td>제1종 설비 전부 + 선교에서의 항해·기관 통합 감시·조종 등 추가 자동화 설비<\/td><\/tr>\n<tr><td>제3종<\/td><td>제2종 설비 전부 + 하역·계류 등 선박 운용 전반의 고도 자동화 설비<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>별표 1은 상위 종이 하위 종의 설비를 모두 갖추는 누적 구조이며, 비고에서 상위 종 기준에 미달하는 설비가 2개 이하이고 그에 상당하는 효과의 다른 설비가 있으면 상위 종으로 인정할 수 있게 한다. 종별 세부 설비 항목은 별표 1 원문으로 확인해 답안에 적는다.<\/p>\n<div class=\"warn\"><p>세부 항목은 법령 별표에 표 형식으로만 실려 있어 개정 여부를 반드시 원문(국가법령정보센터)으로 확인하고 외워야 한다. 위 표의 종별 설명은 누적 구조를 이해하기 위한 요약이다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 별표1 원문 확인 필수\">\n<h5>1. 정의<\/h5><p>선박직원법 제2조제5호: 대통령령으로 정하는 자동운항설비를 갖춘 선박.<\/p>\n<h5>2. 법령 구조(시행령 제3조의2)<\/h5><ul><li>자동운항설비 = 자동화선박 종류(제1·2·3종)에 따른 별표 1 설비<\/li><li>설비 구비·변경 시 지방해양수산청장에 인정 신청 → 종류별 인정서 → 기준 미달 시 반납<\/li><li>제22조: 취업규칙에 육상지원체제·운항사 확보 미명시 시 일반 승무기준 적용<\/li><\/ul>\n<h5>3. 종별 설비기준(누적 구조)<\/h5><ul><li>제1종: 기관구역 무인화 중심(원격 조종, 집중 감시·경보, 발전기 자동화, 화재 탐지)<\/li><li>제2종: 제1종 + 선교 통합 감시·조종 설비<\/li><li>제3종: 제2종 + 운용 전반 고도 자동화<\/li><li>비고: 상위 종 미달 설비 2개 이하 + 상당 효과 설비 시 상위 종 인정<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 자동화선박 제도는 운항사 제도와 묶여 승무 정원을 줄이는 근거이며, 자율운항선박(MASS) 법제화의 출발점임.<\/p><\/div><\/section><\/details>"},{"id":"damage-control-drill","p":12,"n":"12.21","h":"여객선 손상제어훈련의 시행시기, 대상선박, 훈련내용","t":"여객선 손상제어훈련의 시행시기, 대상선박, 훈련내용","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 3교시 2번 · 25점"],"q":["<b>121회(2020) 3-2<\/b> 여객선 손상제어훈련의 시행시기 및 대상선박과 훈련내용"],"k":"SOLAS II-1/19-1(MSC.421(98), 2020년 1월 1일 발효)은 국제항해 여객선(신조·기존 모두)에 최소 3개월마다 손상제어훈련을 요구한다. 침수 사고 시 수밀문 폐쇄, 손상 상태 판단, 복원성 평가, 대응 지휘를 실제처럼 연습하는 훈련이다.","x":"\n<p class=\"key\">SOLAS II-1/19-1(MSC.421(98), 2020년 1월 1일 발효)은 국제항해 여객선(신조·기존 모두)에 최소 3개월마다 손상제어훈련을 요구한다. 침수 사고 시 수밀문 폐쇄, 손상 상태 판단, 복원성 평가, 대응 지휘를 실제처럼 연습하는 훈련이다.<\/p>\n<ul>\n<li><b>대상<\/b>: SOLAS 적용 국제항해 여객선.<\/li>\n<li><b>시기<\/b>: 3개월마다 1회 이상. 승무원 전원이 매번 참여할 필요는 없으나 손상제어 임무자는 순환 참여.<\/li>\n<li><b>훈련 내용<\/b>:\n<ul><li>손상제어 임무 승무원의 손상제어도·손상제어 책자 사용.<\/li>\n<li>수밀문과 수밀 폐쇄장치의 조작 시연.<\/li>\n<li>침수 감지·측심, 교차침수 장치 조작.<\/li>\n<li>선상 복원성 계산기 또는 육상 지원(shore-based support)을 이용한 손상 복원성 평가.<\/li>\n<li>선교-현장 통신, 지휘 체계, 비상 조치 절차 확인.<\/li><\/ul><\/li>\n<li><b>기록<\/b>: 항해일지 기록, 훈련 결과 평가와 개선.<\/li>\n<\/ul>\n<p>국내 연안 여객선은 해운법 운항관리규정과 선원법에 따른 비상훈련(퇴선·소화·인명구조)을 정기적으로 시행하며, 세월호 사고 이후 훈련 주기와 점검이 강화되었다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 근거<\/h5><p>SOLAS II-1/19-1(MSC.421(98)), 2020.1.1 발효.<\/p>\n<h5>2. 대상·시기<\/h5><p>국제항해 여객선(신조·기존), 3개월마다 1회 이상(손상제어 임무자 순환 참여).<\/p>\n<h5>3. 훈련 내용<\/h5><ol><li>손상제어도·손상제어 책자 사용<\/li><li>수밀문·폐쇄장치 조작 시연<\/li><li>침수 감지·측심, 교차침수 장치<\/li><li>선상 복원성 계산기 또는 육상 지원으로 손상 복원성 평가<\/li><li>선교-현장 통신·지휘 체계<\/li><li>항해일지 기록·평가<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 손상 상태 판단의 속도가 생존을 좌우하므로, 선상 복원성 소프트웨어와 육상 지원 연계 훈련이 핵심이며 국내 여객선은 세월호 이후 비상훈련이 강화됨.<\/p><\/div><\/section><\/details>"},{"id":"maritime-safety-mgmt","p":12,"n":"12.22","h":"해사안전관리","t":"해사안전관리","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 9번 · 10점"],"q":["<b>127회(2022) 1-9<\/b> 해사안전관리"],"k":"해사안전기본법 제3조제1호: \"해사안전관리\"란 선원·선박소유자 등 인적 요인, 선박·화물 등 물적 요인, 해상교통체계·교통시설 등 환경적 요인, 국제협약·안전제도 등 제도적 요인을 종합적·체계적으로 관리함으로써 선박의 운용과 관련된 모든 일에서 발생할 수 있는 사고로부터 사람의 생명·신체 및 재산의 안전을 확보하기 위한 모든 활동을 말한다.","x":"\n<p class=\"key\">해사안전기본법 제3조제1호: \"해사안전관리\"란 선원·선박소유자 등 인적 요인, 선박·화물 등 물적 요인, 해상교통체계·교통시설 등 환경적 요인, 국제협약·안전제도 등 제도적 요인을 종합적·체계적으로 관리함으로써 선박의 운용과 관련된 모든 일에서 발생할 수 있는 사고로부터 사람의 생명·신체 및 재산의 안전을 확보하기 위한 모든 활동을 말한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>요인<\/th><th>관리 수단<\/th><\/tr><\/thead><tbody>\n<tr><td>인적<\/td><td>해기사 면허·교육(STCW), 승무 기준, 피로 관리, 안전관리체제(ISM), 음주 운항 금지<\/td><\/tr>\n<tr><td>물적<\/td><td>선박 검사·설비 기준(선박안전법), 화물 적재·고박, 위험물 관리<\/td><\/tr>\n<tr><td>환경적<\/td><td>항로·교통안전특정해역, VTS(해상교통관제), 항로표지, 기상 정보<\/td><\/tr>\n<tr><td>제도적<\/td><td>국제협약 국내 이행, 항만국 통제, 사고 조사·심판, 해사안전 기본계획(5년)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>2024년 분법 후 해사안전기본법은 기본계획·사이버안전·안전산업을, 해상교통안전법은 수역·항법·안전관리체제를 맡는다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의(해사안전기본법 제3조제1호)<\/h5><p>인적(선원·선박소유자)·물적(선박·화물)·환경적(해상교통체계·교통시설)·제도적(국제협약·안전제도) 요인을 종합적·체계적으로 관리해 선박 운용 관련 사고로부터 생명·신체·재산의 안전을 확보하는 모든 활동.<\/p>\n<h5>2. 요인별 수단<\/h5><p>인적: 면허·교육·ISM / 물적: 검사·설비 기준 / 환경: 항로·VTS / 제도: 협약 이행·PSC·기본계획(5년)<\/p><\/div><\/section><\/details>"},{"id":"ship-functions","p":13,"n":"13.1","h":"선박의 6가지 기본기능","t":"선박의 6가지 기본기능","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 1번 · 10점"],"q":["<b>115회(2018) 1-1<\/b> 선박의 6가지 기본기능"],"k":"선박이 운송 수단으로 성립하려면 물에 뜨고(부양성), 화물을 싣고(적재성), 쓰러지지 않으며(복원성), 원하는 속력으로 가고(추진성), 원하는 방향으로 가며(조종성), 파도와 하중을 견뎌야(구조강도·내항성) 한다. 선박설계는 이 여섯 기능을 동시에 만족시키는 균형점을 찾는 일이다.","x":"\n<p class=\"key\">선박이 운송 수단으로 성립하려면 물에 뜨고(부양성), 화물을 싣고(적재성), 쓰러지지 않으며(복원성), 원하는 속력으로 가고(추진성), 원하는 방향으로 가며(조종성), 파도와 하중을 견뎌야(구조강도·내항성) 한다. 선박설계는 이 여섯 기능을 동시에 만족시키는 균형점을 찾는 일이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>기능<\/th><th>의미<\/th><th>지배 설계 요소<\/th><\/tr><\/thead><tbody>\n<tr><td>부양성<\/td><td>중량과 부력 평형, 예비부력<\/td><td>배수량, 건현(ICLL), 수밀 구획<\/td><\/tr>\n<tr><td>적재성<\/td><td>화물을 안전·효율적으로 싣고 내림<\/td><td>재화중량, 화물창 용적·TEU, 하역 설비<\/td><\/tr>\n<tr><td>복원성<\/td><td>외력에 기울어도 원위치로 복귀<\/td><td>GM, GZ 곡선, 손상복원성<\/td><\/tr>\n<tr><td>추진성(속력)<\/td><td>경제적인 속력 확보<\/td><td>저항, 프로펠러, 주기관, 에너지효율(EEDI)<\/td><\/tr>\n<tr><td>조종성<\/td><td>침로 유지·변경, 정지<\/td><td>타, 스러스터, IMO 조종성 기준<\/td><\/tr>\n<tr><td>구조강도·내항성<\/td><td>파랑 하중을 견디고 운동·가속도를 허용 범위 내 유지<\/td><td>종강도·국부 강도·피로, 선형(플레어, 건현), 횡동요 감쇠<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>교재에 따라 내항성과 구조강도를 나누거나 거주성을 넣기도 한다. 답안에서는 기능 간 상충(예: B 증가는 복원성에 유리하나 저항에 불리)을 한 줄 덧붙이면 좋다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<ol><li><b>부양성<\/b>: 중량-부력 평형, 예비부력(건현·수밀 구획)<\/li><li><b>적재성<\/b>: DWT·용적·TEU, 하역<\/li><li><b>복원성<\/b>: GM·GZ, 손상복원성<\/li><li><b>추진성<\/b>: 저항·추진효율·주기관(EEDI)<\/li><li><b>조종성<\/b>: 침로 유지·선회·정지(IMO 기준)<\/li><li><b>구조강도·내항성<\/b>: 파랑 하중 견딤, 운동·가속도 제한<\/li><\/ol>\n<p class=\"concl\"><b>의견<\/b>: 기능 간 상충(폭 증가는 복원성↑ 저항↑)을 균형시키는 것이 설계이며, 교재에 따라 내항성·거주성을 분리하기도 함.<\/p><\/div><\/section><\/details>"},{"id":"design-process","p":13,"n":"13.2","h":"선박 설계과정: 선주가 제시하는 사항과 기본설계 후 성능(상세)설계","t":"선박 설계과정: 선주가 제시하는 사항과 기본설계 후 성능(상세)설계","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 3교시 5번 · 25점"],"q":["<b>121회(2020) 3-5<\/b> 선주가 조선소에 제시하는 사항과 기본설계 후 성능(상세)설계 과정"],"k":"선주는 운송 목적에 필요한 화물 능력, 속력, 항로·항만 조건, 규정·선급, 예산·인도 시기를 제시한다. 조선소는 개념·기본설계로 주요치수와 사양을 정해 계약하고, 계약 후 성능설계에서 선형·추진·구조·진동 성능을 시험과 해석으로 확정한 뒤 상세·생산설계로 넘긴다.","x":"\n<p class=\"key\">선주는 운송 목적에 필요한 화물 능력, 속력, 항로·항만 조건, 규정·선급, 예산·인도 시기를 제시한다. 조선소는 개념·기본설계로 주요치수와 사양을 정해 계약하고, 계약 후 성능설계에서 선형·추진·구조·진동 성능을 시험과 해석으로 확정한 뒤 상세·생산설계로 넘긴다.<\/p>\n<h4>선주 제시사항(Owner's Requirements)<\/h4>\n<ul>\n<li>선종, 재화중량·화물용적·TEU, 화물 종류(밀도, 위험물, 냉동)<\/li>\n<li>서비스 속력과 해상여유, 항속거리, 연료 종류(이중연료 여부)<\/li>\n<li>항로·항만 제약(흘수, 길이, 공기높이, 운하), 빙해 여부<\/li>\n<li>기국, 선급과 부기 표기, 적용 규정(EEDI·CII 목표 등)<\/li>\n<li>하역 장비, 거주구 인원·수준, 선호 기자재(메이커 리스트)<\/li>\n<li>보증 항목(속력, DWT, 연료소비), 가격, 인도일<\/li>\n<\/ul>\n<h4>설계 단계<\/h4>\n<ol>\n<li><b>개념·영업설계<\/b>: 주요치수, 동력, 중량 추정, 개략 GA → 견적.<\/li>\n<li><b>기본설계<\/b>: 선형 초안, 주요치수 확정, GA, 중앙단면, 기관 배치, 용량·복원성·종강도 예비 계산, 사양서.<\/li>\n<li><b>성능(상세) 설계<\/b>(기본설계 후):\n<ul><li>선형 최적화(CFD) → 모형시험(저항·자항·POW·조종·내항) → 속력-동력 확정<\/li>\n<li>프로펠러·ESD 설계, 캐비테이션·압력변동 시험<\/li>\n<li>구조: 화물창 FE, 피로, 좌굴, 선수부 슬래밍<\/li>\n<li>진동(전선·국부)·소음 해석, 축계 정렬·비틀림진동<\/li>\n<li>복원성 계산서, 적재지침서, 손상복원성, EEDI 계산<\/li>\n<li>선급 승인 도면 작성·제출<\/li><\/ul><\/li>\n<li><b>생산설계<\/b>: 블록 분할, 공작도, NC 데이터, 의장 스풀도.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 선주 제시사항<\/h5><p>선종·DWT·용적·TEU, 화물 특성, 속력·해상여유·항속거리, 연료(이중연료), 항로·항만 제약, 기국·선급·부기, 하역 장비·거주, 메이커 리스트, 보증(속력·DWT·연비), 가격·인도일.<\/p>\n<h5>2. 설계 단계<\/h5><p>개념·영업 → 기본(주요치수·선형·GA·중앙단면·사양) → 성능(상세) → 생산설계<\/p>\n<h5>3. 기본설계 후 성능(상세) 설계<\/h5><ol><li>선형 CFD 최적화 → 모형시험(저항·자항·POW·조종·내항) → 속력-동력 확정<\/li><li>프로펠러·ESD, 캐비테이션·압력변동 시험<\/li><li>구조: 화물창 FE, 피로, 좌굴, 슬래밍<\/li><li>진동·소음 해석, 축계 정렬·비틀림진동<\/li><li>복원성 계산서·적재지침서·손상복원성·EEDI<\/li><li>선급 승인 도면<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 성능 설계는 계약 보증을 검증하는 단계이므로 모형시험·해석 결과가 여유를 잠식하면 즉시 설계 대안을 마련해야 함.<\/p><\/div><\/section><\/details>"},{"id":"main-dimensions","p":13,"n":"13.3","h":"선박 설계 시 주요치수의 상호관계와 주요치수 추정 고려사항","t":"선박 설계 시 주요치수의 상호관계와 주요치수 추정 고려사항","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 3교시 1번 · 25점"],"q":["<b>124회(2021) 3-1<\/b> 선박 설계 시 주요치수 상호관계와 주요치수 추정 고려사항"],"k":"주요치수(L, B, D, T, Cb)는 배수량식 Δ = ρ·L·B·T·Cb로 묶여 있고, 각 비율이 저항·복원성·강도·건현을 결정한다. 실적선 통계로 초기값을 잡고 재화중량·용적·복원성·건현·강도·항만 제약을 반복 확인해 수렴시킨다(설계 나선).","x":"\n<p class=\"key\">주요치수(L, B, D, T, C<sub>b<\/sub>)는 배수량식 Δ = ρ·L·B·T·C<sub>b<\/sub>로 묶여 있고, 각 비율이 저항·복원성·강도·건현을 결정한다. 실적선 통계로 초기값을 잡고 재화중량·용적·복원성·건현·강도·항만 제약을 반복 확인해 수렴시킨다(설계 나선).<\/p>\n<h4>상호관계<\/h4>\n<div class=\"eq\"><div class=\"mj\">\\[\\Delta=\\rho\\,L\\,B\\,T\\,C_b\\,(1+s),\\qquad DWT=\\Delta-LW,\\qquad V_{cargo}\\propto L\\,B\\,D\\]<\/div><\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>비율<\/th><th>영향<\/th><th>대략 범위(상선)<\/th><\/tr><\/thead><tbody>\n<tr><td>L/B<\/td><td>저항(클수록 유리), 조종성, 강재중량<\/td><td class=\"num\">5~7<\/td><\/tr>\n<tr><td>B/T<\/td><td>복원성(BM ∝ B²/T), 저항, 횡동요<\/td><td class=\"num\">2.3~3.5<\/td><\/tr>\n<tr><td>L/D<\/td><td>종강도(클수록 처짐·응력 불리)<\/td><td class=\"num\">11~14<\/td><\/tr>\n<tr><td>B/D<\/td><td>복원성(대각도), 건현<\/td><td class=\"num\">1.6~2.0<\/td><\/tr>\n<tr><td>T/D<\/td><td>건현 여유<\/td><td class=\"num\">0.65~0.75<\/td><\/tr>\n<tr><td>C<sub>b<\/sub>–F<sub>n<\/sub><\/td><td>속력에 맞는 비대도<\/td><td>고속일수록 C<sub>b<\/sub> 감소<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>추정 시 고려사항<\/h4>\n<ul>\n<li><b>요구 능력<\/b>: DWT/Δ 비(선종별 실적), 화물 밀도에 따른 용적 한계와 중량 한계 구분.<\/li>\n<li><b>항만·운하<\/b>: 네오파나막스(폭 51.25 m, 길이 366 m, 흘수 15.2 m), 수에즈 흘수, 항만 수심·안벽 길이.<\/li>\n<li><b>성능<\/b>: 목표 속력에서 저항·추진 효율, 프로펠러 잠김.<\/li>\n<li><b>복원성<\/b>: GM 확보(폭), 갑판 화물 높이.<\/li>\n<li><b>건현<\/b>: ICLL 최소 건현 → D 하한.<\/li>\n<li><b>강도·중량<\/b>: L/D와 강재중량, 경제성(건조비 vs 연료비).<\/li>\n<li><b>규정<\/b>: 이중선체 폭(MARPOL), 손상복원성, EEDI.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 상호관계<\/h5><div class=\"calc\">Δ = ρ·L·B·T·C_b·(1+s),  DWT = Δ − LW,  용적 ∝ L·B·D<\/div>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>비율<\/th><th>영향<\/th><th>범위<\/th><\/tr><\/thead><tbody>\n<tr><td>L/B<\/td><td>저항·조종·강재<\/td><td class=\"num\">5~7<\/td><\/tr>\n<tr><td>B/T<\/td><td>복원성(BM ∝ B²/T)·저항<\/td><td class=\"num\">2.3~3.5<\/td><\/tr>\n<tr><td>L/D<\/td><td>종강도<\/td><td class=\"num\">11~14<\/td><\/tr>\n<tr><td>B/D<\/td><td>대각도 복원성·건현<\/td><td class=\"num\">1.6~2.0<\/td><\/tr>\n<tr><td>T/D<\/td><td>건현 여유<\/td><td class=\"num\">0.65~0.75<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>2. 추정 고려사항<\/h5><ul><li>요구 능력: DWT/Δ 실적비, 용적 제한 vs 중량 제한 판단<\/li><li>항만·운하: 네오파나막스 등<\/li><li>성능·복원성·건현(D 하한)·강도·중량<\/li><li>규정: 이중선체 폭, 손상복원성, EEDI<\/li><\/ul>\n<p class=\"concl\"><b>3. 결론<\/b>: 실적 통계로 초기값을 잡고 설계 나선으로 반복 수렴시키며, 제약(항만)과 경제성(RFR)이 최종 치수를 정함.<\/p><\/div><\/section><\/details>"},{"id":"sales-design","p":13,"n":"13.4","h":"선박 영업설계 업무흐름","t":"선박 영업설계 업무흐름","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 3교시 5번 · 25점"],"q":["<b>127회(2022) 3-5<\/b> 선박 영업설계 업무흐름"],"k":"영업설계는 선주 문의를 받아 짧은 기간에 계약 가능한 사양·도면·가격을 만드는 설계다. 정확도는 낮지만 계약 보증(속력·DWT·연비)과 원가가 여기서 결정되므로, 이후 설계의 가장 큰 리스크 관리 단계다.","x":"\n<p class=\"key\">영업설계는 선주 문의를 받아 짧은 기간에 계약 가능한 사양·도면·가격을 만드는 설계다. 정확도는 낮지만 계약 보증(속력·DWT·연비)과 원가가 여기서 결정되므로, 이후 설계의 가장 큰 리스크 관리 단계다.<\/p>\n<ol>\n<li><b>문의 접수(RFQ)·요구 분석<\/b>: 선종, 능력, 속력, 항로, 연료, 규정, 인도 시기.<\/li>\n<li><b>개념 설계<\/b>: 실적선 기반 주요치수, 선형 선정(기존 선형 활용·수정), 속력-동력 추정, 주기관 선정, 경하중량·DWT·용적·복원성 개략 확인, EEDI 예비 계산.<\/li>\n<li><b>개략 사양서·GA·중앙단면 작성<\/b>, 메이커 리스트.<\/li>\n<li><b>원가 견적<\/b>: 강재·기자재(견적 접수)·공수·간접비, 환율·원자재 리스크.<\/li>\n<li><b>제안·협상<\/b>: 기술 질의응답, 선주 의견 반영(사양 변경 → 원가 재산정), 보증 조건·지체상금 협상.<\/li>\n<li><b>LOI·계약<\/b>: 계약서, 사양서, GA, 메이커 리스트, 보증 항목 확정.<\/li>\n<li><b>기본설계 인계<\/b>: 계약 조건과 리스크 항목(보증 여유, 신기술) 이관.<\/li>\n<\/ol>\n<div class=\"pro\"><p>영업 단계의 속력·DWT 여유가 작으면 기본설계에서 모형시험 결과가 조금만 나빠도 보증 미달 위험이 생긴다. 표준선형 DB와 CFD를 영업 단계부터 쓰는 이유다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<ol><li>문의(RFQ)·요구 분석<\/li><li>개념 설계: 주요치수, 선형 선정, 속력-동력, 주기관, 중량·DWT·복원성, EEDI 예비<\/li><li>개략 사양서·GA·중앙단면, 메이커 리스트<\/li><li>원가 견적: 강재·기자재·공수·간접비, 환율 위험<\/li><li>제안·협상: 기술 질의, 사양 변경 원가 재산정, 보증·지체상금<\/li><li>LOI·계약: 계약서·사양서·GA·보증<\/li><li>기본설계 인계: 리스크 항목 이관<\/li><\/ol>\n<p class=\"concl\"><b>결론<\/b>: 영업설계 여유가 작으면 이후 보증 미달 위험이 커지므로, 표준선형 DB·CFD를 영업 단계부터 활용해 정확도를 높여야 함.<\/p><\/div><\/section><\/details>"},{"id":"steel-weight","p":13,"n":"13.5","h":"선박의 선각중량에 영향을 미치는 요소","t":"선박의 선각중량에 영향을 미치는 요소","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 4교시 4번 · 25점"],"q":["<b>133회(2024) 4-4<\/b> 선각중량에 영향을 미치는 요소"],"k":"선각(강재)중량은 주요치수와 선형이 정하는 \"크기\", 화물·하중·규정이 정하는 \"요구 강도\", 재료와 구조 배치가 정하는 \"효율\", 생산·선주 요구가 더하는 \"여유\"로 결정된다.","x":"\n<p class=\"key\">선각(강재)중량은 주요치수와 선형이 정하는 \"크기\", 화물·하중·규정이 정하는 \"요구 강도\", 재료와 구조 배치가 정하는 \"효율\", 생산·선주 요구가 더하는 \"여유\"로 결정된다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>요소<\/th><\/tr><\/thead><tbody>\n<tr><td>크기·형상<\/td><td>L(종굽힘 모멘트 ∝ L²), B, D, C<sub>b<\/sub>, 선루·갑판실 크기<\/td><\/tr>\n<tr><td>하중·규정<\/td><td>구조흘수, 화물 밀도·격창 적재, 설계 파랑 하중, 빙해 등급, 그랩 표기, 슬래밍·green sea, 부식 공제, 피로 기준(설계수명)<\/td><\/tr>\n<tr><td>구조 배치<\/td><td>이중선체·이중저 높이, 늑골 방식(종·횡), 늑골 간격, 대개구(컨테이너선), 격벽 수·형식(파형)<\/td><\/tr>\n<tr><td>재료<\/td><td>고장력강 비율(k), 후판 등급<\/td><\/tr>\n<tr><td>설계 최적화<\/td><td>FE 기반 최적화, 상세 설계(브래킷 축소), 표준 부재<\/td><\/tr>\n<tr><td>생산<\/td><td>최소 두께(용접 변형), 판 두께 표준화로 인한 증가, 덧살·공차<\/td><\/tr>\n<tr><td>선주 요구<\/td><td>추가 두께(owner's extra), 부가 표기(선급 notation), 미래 개조 대비 보강<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"eq\"><div class=\"eql\">Watson–Gilfillan 강재중량 추정<\/div><div class=\"mj\">\\[W_s=K\\,E^{1.36}\\left[1+0.5\\,(C_b^{\\prime}-0.70)\\right],\\qquad E=L(B+T)+0.85L(D-T)+0.85\\textstyle\\sum l_1h_1+0.75\\sum l_2h_2\\]<\/div><span class=\"c\">E: Lloyd's equipment numeral, K: 선종 계수, C<sub>b<\/sub>′: 0.8D에서의 방형계수<\/span><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>요소<\/th><\/tr><\/thead><tbody>\n<tr><td>크기·형상<\/td><td>L(굽힘 ∝ L²), B, D, C<sub>b<\/sub>, 선루 크기<\/td><\/tr>\n<tr><td>하중·규정<\/td><td>구조흘수, 화물 밀도·격창 적재, 파랑 하중, 빙해, 그랩, 슬래밍, 부식 공제, 설계수명<\/td><\/tr>\n<tr><td>구조 배치<\/td><td>이중선체·이중저 높이, 늑골 방식·간격, 대개구, 격벽 수·형식<\/td><\/tr>\n<tr><td>재료<\/td><td>고장력강 비율<\/td><\/tr>\n<tr><td>최적화<\/td><td>FE 최적화, 상세 개선<\/td><\/tr>\n<tr><td>생산<\/td><td>최소 두께, 두께 표준화, 덧살<\/td><\/tr>\n<tr><td>선주<\/td><td>추가 두께, 부기, 개조 대비<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"calc\">Watson–Gilfillan: W_s = K·E^1.36·[1 + 0.5(C_b′ − 0.70)]\nE = L(B+T) + 0.85L(D−T) + 0.85Σl₁h₁ + 0.75Σl₂h₂<\/div>\n<p class=\"concl\"><b>결론<\/b>: 강재중량 1% 감소는 DWT·EEDI·원가에 동시 기여하므로, 고장력강과 FE 최적화를 피로·좌굴 제약 안에서 적용해야 함.<\/p><\/div><\/section><\/details>"},{"id":"length-increase","p":13,"n":"13.6","h":"선박의 길이를 증가시켰을 때의 이점과 불리한 점","t":"선박의 길이를 증가시켰을 때의 이점과 불리한 점","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 2교시 1번 · 25점"],"q":["<b>133회(2024) 2-1<\/b> 선박 길이를 증가시켰을 때 이점과 불리한 점"],"k":"같은 배수량에서 길이를 늘리면 Froude 수가 작아져 조파저항이 줄고 침로안정성·내항성이 좋아진다. 대신 종굽힘 모멘트가 길이의 제곱으로 커져 강재중량과 건조비가 늘고, 선회성과 항만 적합성이 나빠진다.","x":"\n<p class=\"key\">같은 배수량에서 길이를 늘리면 Froude 수가 작아져 조파저항이 줄고 침로안정성·내항성이 좋아진다. 대신 종굽힘 모멘트가 길이의 제곱으로 커져 강재중량과 건조비가 늘고, 선회성과 항만 적합성이 나빠진다.<\/p>\n<div class=\"grid2\"><div class=\"box\"><h5>이점<\/h5><ul>\n<li>조파저항 감소 → 같은 속력에 동력 감소(고속선일수록 큼)<\/li>\n<li>침로안정성 향상, 종동요·가속도 감소(내항성)<\/li>\n<li>화물 용적·갑판 면적 증가<\/li>\n<li>세장한 선형으로 C<sub>b<\/sub>를 유지하면서 속력 향상<\/li><\/ul><\/div>\n<div class=\"box\"><h5>불리한 점<\/h5><ul>\n<li>종굽힘 모멘트(∝ L²) 증가 → 강재중량·건조비 증가<\/li>\n<li>침수표면적 증가로 마찰저항 증가(저속 비대선은 이득이 작음)<\/li>\n<li>선회성 저하, 항만·도크·운하 길이 제약<\/li>\n<li>선체 유연성 증가 → 스프링잉·휘핑, 피로<\/li>\n<li>건현(길이에 따라 증가), 의장수 증가<\/li><\/ul><\/div><\/div>\n<p>운항선 길이 확장(jumboization, 중앙 평행부 삽입)은 종강도(굽힘모멘트 증가와 단면계수 불변), 복원성, 톤수, 조종성, 증서 전반의 재검토가 필요하다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 이점<\/h5><ul><li>Fn↓ → 조파저항↓, 동력↓(고속선일수록 큼)<\/li><li>침로안정성·내항성(종동요·가속도) 향상<\/li><li>화물 용적·갑판 면적 증가<\/li><\/ul>\n<h5>2. 불리한 점<\/h5><ul><li>종굽힘 모멘트 ∝ L² → 강재중량·건조비↑<\/li><li>침수면적↑ 마찰저항↑(저속 비대선은 이득 작음)<\/li><li>선회성 저하, 항만·도크·운하 제약<\/li><li>선체 유연성 → 스프링잉·휘핑·피로<\/li><li>건현·의장수 증가<\/li><\/ul>\n<h5>3. 운항선 길이 확장 시<\/h5><p>중앙 평행부 삽입 → 굽힘모멘트 증가·단면계수 불변 → 종강도 보강, 복원성·톤수·조종성·증서 재검토.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 길이 증가는 고속선에서 연비 이득이 크고 저속 비대선에서는 강재 증가가 상쇄하므로 속력 영역별로 판단해야 함.<\/p><\/div><\/section><\/details>"},{"id":"teu-capacity","p":13,"n":"13.7","h":"컨테이너선의 공칭용량(Nominal Capacity)과 적재용량(Loadable Capacity), 최대화 방법","t":"컨테이너선의 공칭용량(Nominal Capacity)과 적재용량(Loadable Capacity), 최대화 방법","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 2교시 1번 · 25점"],"q":["<b>136회(2025) 2-1<\/b> 컨테이너선 공칭용량과 적재용량, 각 용량 최대화 방법"],"k":"공칭용량은 물리적으로 놓을 수 있는 컨테이너 슬롯 수(TEU)이고, 적재용량은 평균 중량(예: 14 t/TEU) 컨테이너를 실었을 때 흘수(DWT), 복원성, 시야, 래싱, 강도를 모두 만족하며 실제로 실을 수 있는 TEU 수다. 선주 수익은 적재용량에 달려 있다.","x":"\n<p class=\"key\">공칭용량은 물리적으로 놓을 수 있는 컨테이너 슬롯 수(TEU)이고, 적재용량은 평균 중량(예: 14 t/TEU) 컨테이너를 실었을 때 흘수(DWT), 복원성, 시야, 래싱, 강도를 모두 만족하며 실제로 실을 수 있는 TEU 수다. 선주 수익은 적재용량에 달려 있다.<\/p>\n<h4>공칭용량 최대화<\/h4>\n<ul>\n<li>선폭·깊이 최적화로 열(row)·단(tier) 추가, 화물창 깊이 확대.<\/li>\n<li>기관실 길이 최소화, 거주구 전방 배치(2-아일랜드)로 갑판 bay 추가.<\/li>\n<li>선수·선미부 화물창 형상 활용, 해치커버·코밍 배치 최적화.<\/li>\n<\/ul>\n<h4>적재용량 최대화<\/h4>\n<ul>\n<li><b>경하중량 감소<\/b>: 고장력강 최적화, 경량 해치커버 → DWT 증가.<\/li>\n<li><b>복원성(GM) 확보<\/b>: 선폭 증가, KG 낮추기, 밸러스트 의존 최소화(밸러스트수는 화물 DWT를 잠식).<\/li>\n<li><b>래싱 능력<\/b>: 래싱 브리지 높이(2~3단), 항로별 래싱 계산, 고강도 래싱 장비, 스택 중량 한도 상향(탱크탑·해치커버 강도).<\/li>\n<li><b>흘수·강도<\/b>: 구조흘수 여유, 정수중 굽힘모멘트 허용값 확대.<\/li>\n<li><b>시야<\/b>: 선교 전방 배치로 갑판 적재 단수 제약 완화.<\/li>\n<li>냉동 컨테이너 소켓 수, 위험물 적재 구역 확보.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 정의<\/h5><ul><li>공칭용량: 물리적 슬롯 수(TEU)<\/li><li>적재용량: 평균 중량(예: 14 t/TEU) 컨테이너로 흘수·복원성·시야·래싱·강도를 모두 만족하며 실제로 싣는 TEU<\/li><\/ul>\n<h5>2. 공칭용량 최대화<\/h5><p>선폭·깊이 최적화(열·단 추가), 기관실 최소화·2-아일랜드, 선수미 화물창 활용, 해치 배치.<\/p>\n<h5>3. 적재용량 최대화<\/h5><ul><li>경하중량 감소(고장력강, 경량 해치커버)<\/li><li>GM 확보(선폭, KG↓, 밸러스트 의존 최소화)<\/li><li>래싱 브리지 2~3단, 항로별 래싱, 스택 중량 상향<\/li><li>구조흘수·SWBM 여유, 선교 전방 배치(시야)<\/li><\/ul>\n<p class=\"concl\"><b>4. 결론<\/b>: 선주 수익은 적재용량에 달려 있으므로 설계 평가 지표를 \"14 t 균질 적재 TEU\"로 두고 경량화·GM·래싱을 함께 최적화해야 함.<\/p><\/div><\/section><\/details>"},{"id":"tank-capacity","p":13,"n":"13.8","h":"설계변경을 최소화하여 유조선 화물창 용량을 증가시키는 방안과 이유","t":"설계변경을 최소화하여 유조선 화물창 용량을 증가시키는 방안과 이유","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 3교시 1번 · 25점"],"q":["<b>136회(2025) 3-1<\/b> 설계변경을 최소화하여 유조선 화물창 용량을 증가시키는 방안과 이유"],"k":"권고안은 선형(L, B, 선수미 형상)은 그대로 두고 형깊이를 소폭 늘리거나, 이중선체 폭·높이를 MARPOL 최소값 범위까지 줄이고, 화물구역 경계(펌프실·코퍼댐·연료탱크)를 조정하는 것이다. 선형을 유지하면 저항·추진 성능과 모형시험을 다시 할 필요가 없어 변경 범위가 가장 작다.","x":"\n<p class=\"key\">권고안은 선형(L, B, 선수미 형상)은 그대로 두고 형깊이를 소폭 늘리거나, 이중선체 폭·높이를 MARPOL 최소값 범위까지 줄이고, 화물구역 경계(펌프실·코퍼댐·연료탱크)를 조정하는 것이다. 선형을 유지하면 저항·추진 성능과 모형시험을 다시 할 필요가 없어 변경 범위가 가장 작다.<\/p>\n<h4>먼저 확인할 것<\/h4>\n<p>원유선은 화물 밀도에 따라 용적이 아니라 재화중량이 한계일 수 있다. 용적 증가가 실제 적재량 증가로 이어지는지(용적 제한 화물인지) 먼저 판단한다.<\/p>\n<h4>방안 비교<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방안<\/th><th>효과<\/th><th>영향·제약<\/th><\/tr><\/thead><tbody>\n<tr><td>형깊이 D 증가<\/td><td>탱크 높이 증가로 용적 증가, 선형 불변<\/td><td>건현 증가(유리), KG 상승·복원성, 종강도(단면계수 증가는 유리), 중량 증가<\/td><\/tr>\n<tr><td>이중선체 폭·이중저 높이 축소<\/td><td>탱크 폭·높이 증가<\/td><td>MARPOL Reg.19 최소값(선측 w = 0.5 + DWT/20,000 m 또는 2.0 m 중 작은 값, 최소 1.0 m; 이중저 h = B/15 또는 2.0 m 중 작은 값, 최소 1.0 m), 사고 유출 성능(Reg.23), 밸러스트 용량(Reg.18) 감소, 검사 접근<\/td><\/tr>\n<tr><td>화물구역 경계 이동<\/td><td>펌프실 축소·코퍼댐 재배치, 연료탱크 이동으로 탱크 길이 증가<\/td><td>기관실 배치, 연료탱크 보호 위치(Reg.12A)<\/td><\/tr>\n<tr><td>호퍼·챔퍼 형상 조정<\/td><td>하부 모서리 용적 증가<\/td><td>구조 재해석<\/td><\/tr>\n<tr><td>평행부 삽입(L 증가)<\/td><td>용적 크게 증가<\/td><td>선형·강도·성능 전면 변경(최소 변경 목적에 부합하지 않음)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>공통 검토<\/h4>\n<p>손상복원성·탱크 크기 제한(Reg.26), 종강도·화물창 FE, 밸러스트 흘수(분리 밸러스트 용량), 톤수, EEDI(DWT 변화), 선급 재승인, 계약 변경(가격·일정).<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 선행 판단<\/h5><p>원유는 밀도에 따라 용적 제한인지 DWT 제한인지 먼저 확인.<\/p>\n<h5>2. 방안<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방안<\/th><th>효과<\/th><th>제약<\/th><\/tr><\/thead><tbody>\n<tr><td>형깊이 D 소폭 증가<\/td><td>선형 불변 용적↑<\/td><td>KG·중량↑<\/td><\/tr>\n<tr><td>이중선체·이중저 최소화<\/td><td>탱크 폭·높이↑<\/td><td>MARPOL Reg.19 최소(w = 0.5 + DWT/20,000 m 또는 2.0 m, 최소 1.0 m; h = B/15 또는 2.0 m), Reg.23 유출, Reg.18 SBT<\/td><\/tr>\n<tr><td>화물구역 경계 이동<\/td><td>펌프실·코퍼댐·연료탱크 재배치<\/td><td>기관실·Reg.12A<\/td><\/tr>\n<tr><td>호퍼·챔퍼 조정<\/td><td>하부 용적<\/td><td>구조 재해석<\/td><\/tr>\n<tr><td>평행부 삽입<\/td><td>용적 크게↑<\/td><td>전면 변경(최소 변경 목적 부적합)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>3. 권고와 이유<\/h5><p>선형 유지 + D 소폭 증가 + 이중선체 여유분 축소 → 저항·추진 성능과 모형시험 재수행 불필요, 변경 범위 최소.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 손상복원성·탱크 크기(Reg.26)·종강도·톤수·EEDI 재검토와 계약 변경을 함께 진행해야 함.<\/p><\/div><\/section><\/details>"},{"id":"guarantees","p":13,"n":"13.9","h":"일반상선의 주요 보증항목 3가지와 설계단계 대응방안","t":"일반상선의 주요 보증항목 3가지와 설계단계 대응방안","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["136회 4교시 4번 · 25점"],"q":["<b>136회(2025) 4-4<\/b> 일반상선의 주요 보증항목 3가지와 설계단계 대응방안"],"k":"계약 보증의 핵심은 속력, 재화중량, 연료소비다. 미달 시 지체상금(liquidated damages)을 물고, 한도를 넘으면 선주가 인수를 거부할 수 있다. 설계 단계의 대응은 조기 검증과 적정 여유, 중량관리다.","x":"\n<p class=\"key\">계약 보증의 핵심은 속력, 재화중량, 연료소비다. 미달 시 지체상금(liquidated damages)을 물고, 한도를 넘으면 선주가 인수를 거부할 수 있다. 설계 단계의 대응은 조기 검증과 적정 여유, 중량관리다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>보증항목<\/th><th>내용<\/th><th>설계 대응<\/th><\/tr><\/thead><tbody>\n<tr><td>속력<\/td><td>설계 흘수, 지정 출력(예: NCR, 해상여유 15%)에서의 시운전 속력<\/td><td>조기 CFD·모형시험, 속력 여유 확보, 프로펠러 최적 설계·ESD, 부가물 저항 관리, 시운전 보정 절차(ISO 15016) 계약 명시<\/td><\/tr>\n<tr><td>재화중량(DWT)<\/td><td>지정 흘수에서의 DWT<\/td><td>경하중량 추정 정확도, 설계 여유, 공정 내내 중량관리 시스템(블록·의장 실측 반영), 고장력강 최적화<\/td><\/tr>\n<tr><td>연료소비<\/td><td>주기관 공장시험 SFOC(허용 공차 포함) 또는 일일 연료소비<\/td><td>기관 사양(튜닝) 선정, 공차 조건 명확화, 폐열회수·축발전기, 보기 전력 절감<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>그 밖에 화물용적·TEU, 소음·진동 기준, EEDI 달성값이 보증에 들어가기도 한다. 보증 조건(측정 방법, 보정 기준)을 계약서에 정확히 쓰는 것도 설계자의 책임이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 136회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>보증<\/th><th>내용<\/th><th>설계 대응<\/th><\/tr><\/thead><tbody>\n<tr><td>속력<\/td><td>설계 흘수·지정 출력 시운전 속력<\/td><td>조기 CFD·모형시험, 여유, 프로펠러·ESD, 부가물 관리, 보정 절차 명시<\/td><\/tr>\n<tr><td>DWT<\/td><td>지정 흘수 재화중량<\/td><td>경하중량 추정·여유, 중량관리 시스템, 고장력강<\/td><\/tr>\n<tr><td>연료소비<\/td><td>공장시험 SFOC·일일 소비<\/td><td>기관 튜닝 선정, 공차 명확화, WHR·PTO<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>미달 시 지체상금, 한도 초과 시 인수 거부. 그 외 용적·TEU, 소음·진동, EEDI.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 보증 조건(측정·보정 방법)을 계약서에 정확히 쓰는 것도 설계자의 책임임.<\/p><\/div><\/section><\/details>"},{"id":"route-design","p":13,"n":"13.10","h":"항로를 고려한 경제적인 선박설계 기준","t":"항로를 고려한 경제적인 선박설계 기준","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 4교시 6번 · 25점"],"q":["<b>127회(2022) 4-6<\/b> 항로를 고려한 경제적인 선박설계 기준"],"k":"항로는 선박의 크기 상한(항만·운하), 설계 속력(거리·운항 일정), 내항 조건(해상 상태·빙해), 연료·배출 규제(ECA), 화물 흐름(공선 항해 비율)을 정한다. 경제적 설계는 이 조건에서 운송 단위당 비용(RFR)을 최소화하는 사양을 고르는 것이다.","x":"\n<p class=\"key\">항로는 선박의 크기 상한(항만·운하), 설계 속력(거리·운항 일정), 내항 조건(해상 상태·빙해), 연료·배출 규제(ECA), 화물 흐름(공선 항해 비율)을 정한다. 경제적 설계는 이 조건에서 운송 단위당 비용(RFR)을 최소화하는 사양을 고르는 것이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항로 특성<\/th><th>설계 반영<\/th><\/tr><\/thead><tbody>\n<tr><td>항만·운하 제약(흘수, 길이, 폭, 공기높이)<\/td><td>주요치수 상한, 흘수 최적화<\/td><\/tr>\n<tr><td>거리·항해 일정·기항지 수<\/td><td>설계 속력, 주기관 정격(디레이팅), 항만 체류 비율에 따른 하역 설비<\/td><\/tr>\n<tr><td>해상 상태(산포도)<\/td><td>해상여유, 선수 형상·건현, 부가저항 고려 선형, 피로 설계 해역<\/td><\/tr>\n<tr><td>기후·빙해<\/td><td>빙해 등급, 난방·냉방, 동결 방지<\/td><\/tr>\n<tr><td>화물 흐름<\/td><td>공선 항해 비율에 따른 밸러스트 흘수 최적화, 겸용선 검토<\/td><\/tr>\n<tr><td>규제 해역<\/td><td>ECA(저유황·SCR), 이중연료, EU ETS 대상 항로면 탄소비용 반영<\/td><\/tr>\n<tr><td>연료 공급<\/td><td>벙커링 가능 연료(LNG·메탄올), 연료탱크 용량(항속거리)<\/td><\/tr>\n<tr><td>바람 통계<\/td><td>풍력 보조추진 효과<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>평가는 RFR 또는 NPV로 하고, 연료가·운임·탄소가에 대한 민감도 분석으로 견고한 사양을 고른다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항로 특성<\/th><th>설계 반영<\/th><\/tr><\/thead><tbody>\n<tr><td>항만·운하 제약<\/td><td>주요치수·흘수 상한<\/td><\/tr>\n<tr><td>거리·일정·기항<\/td><td>설계 속력, 디레이팅, 하역 설비<\/td><\/tr>\n<tr><td>해상 상태<\/td><td>해상여유, 선수·건현, 피로 해역<\/td><\/tr>\n<tr><td>기후·빙해<\/td><td>빙해 등급, 공조, 동결 방지<\/td><\/tr>\n<tr><td>화물 흐름<\/td><td>밸러스트 흘수 최적화, 겸용선<\/td><\/tr>\n<tr><td>규제 해역<\/td><td>ECA(SCR·저유황), ETS 탄소비용<\/td><\/tr>\n<tr><td>연료 공급<\/td><td>벙커링 연료, 탱크 용량<\/td><\/tr>\n<tr><td>바람<\/td><td>풍력 보조 효과<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: RFR·NPV로 평가하고 연료가·운임·탄소가 민감도 분석으로 견고한 사양을 선택해야 함.<\/p><\/div><\/section><\/details>"},{"id":"speed-history","p":13,"n":"13.11","h":"1970년대부터 현재까지 원양 일반상선의 평균 운항속도 변화(컨테이너선 중심)","t":"1970년대부터 현재까지 원양 일반상선의 평균 운항속도 변화(컨테이너선 중심)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["130회 4교시 2번 · 25점"],"q":["<b>130회(2023) 4-2<\/b> 1970년대부터 현재까지 원양항해 평균 운항속도 변화(컨테이너선 중심)"],"k":"컨테이너선 속력은 연료가와 운임 시장을 따라 움직였다. 1970년대 초 증기터빈 고속선(30 kn급)에서 석유파동 후 디젤화·감속, 1990~2000년대 대형화 속 24~25 kn 설계, 2008년 이후 감속 운항(slow steaming)으로 실운항 14~18 kn 수준, 2020년대는 탄소 규제로 중속 설계가 정착했다. 경제 속력은 연료비와 자본·시간 비용의 균형점이다.","x":"\n<p class=\"key\">컨테이너선 속력은 연료가와 운임 시장을 따라 움직였다. 1970년대 초 증기터빈 고속선(30 kn급)에서 석유파동 후 디젤화·감속, 1990~2000년대 대형화 속 24~25 kn 설계, 2008년 이후 감속 운항(slow steaming)으로 실운항 14~18 kn 수준, 2020년대는 탄소 규제로 중속 설계가 정착했다. 경제 속력은 연료비와 자본·시간 비용의 균형점이다.<\/p>\n<h4>시기별 변화<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>시기<\/th><th>속력 경향<\/th><th>배경<\/th><\/tr><\/thead><tbody>\n<tr><td>1970년대 초<\/td><td>고속 컨테이너선 등장(SL-7급 약 33 kn, 증기터빈)<\/td><td>저유가, 정기선 서비스 경쟁<\/td><\/tr>\n<tr><td>1970년대 중후반~80년대<\/td><td>감속, 증기터빈→저속 디젤 전환, 20~23 kn<\/td><td>1·2차 석유파동<\/td><\/tr>\n<tr><td>1990~2000년대<\/td><td>설계 24~25 kn, 포스트파나막스 대형화<\/td><td>교역 급증, 일정 신뢰성<\/td><\/tr>\n<tr><td>2008~2010년대<\/td><td>감속 운항·초감속(실운항 대략 14~18 kn), 구상선수 개조·디레이팅<\/td><td>금융위기 공급 과잉, 고유가<\/td><\/tr>\n<tr><td>2020년대<\/td><td>설계속력 하향(대략 20~22 kn), 일시 고속(2021 물류 대란), 홍해 우회로 운항 조정<\/td><td>EEXI·CII, EU ETS, 대체연료 비용<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>경제 속력의 원리<\/h4>\n<div class=\"eq\"><div class=\"eql\">해리당 비용과 경제 속력<\/div><div class=\"mj\">\\[C(V)=\\dfrac{a\\,V^3+D}{24\\,V},\\qquad \\dfrac{dC}{dV}=0\\ \\Rightarrow\\ V_{opt}=\\left(\\dfrac{D}{2a}\\right)^{1/3}\\]<\/div><span class=\"c\">a·V³: 일일 연료비(연료 소모 ∝ V³), D: 일일 고정비(자본비·선원비·화물 재고비). 연료가가 오르면 a가 커져 경제 속력이 내려간다.<\/span><\/div>\n<p>예: 20 kn에서 일 100 t 소모, 고정비 일 4만 달러일 때, 연료가 300달러/t이면 V<sub>opt<\/sub> ≈ 17.5 kn, 600달러/t이면 13.9 kn, 900달러/t이면 12.1 kn. 탄소가(EU ETS)는 연료가를 올리는 효과라서 속력을 더 낮춘다. 다만 선대 규모, 서비스 주기, 화물 재고비를 함께 봐야 한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 130회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 시기별 변화<\/h5><ul><li>1970년대 초: 증기터빈 고속선(SL-7급 약 33 kn)<\/li><li>석유파동 후: 디젤화·감속(20~23 kn)<\/li><li>1990~2000년대: 설계 24~25 kn, 대형화<\/li><li>2008~2010년대: 감속 운항(실운항 약 14~18 kn), 구상선수 개조·디레이팅<\/li><li>2020년대: 설계속력 하향(약 20~22 kn), 2021 일시 고속, 홍해 우회 조정, 탄소 규제<\/li><\/ul>\n<h5>2. 경제 속력<\/h5><div class=\"calc\">C(V) = (a·V³ + D)/(24V) → V_opt = (D/2a)^(1/3)\n20 kn·일 100 t, 고정비 4만 달러/일: 연료 300달러/t → 17.5 kn, 600 → 13.9 kn, 900 → 12.1 kn<\/div>\n<p class=\"concl\"><b>3. 결론<\/b>: 연료가와 탄소가가 오를수록 경제 속력이 낮아지므로, 설계 속력보다 실제 운항 분포에 맞춘 선형·기관 최적화가 필요함.<\/p><\/div><\/section><\/details>"},{"id":"naval-ship","p":13,"n":"13.12","h":"신규 함정 획득을 위한 함정설계 과정","t":"신규 함정 획득을 위한 함정설계 과정","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 4교시 4번 · 25점"],"q":["<b>124회(2021) 4-4<\/b> 신규 함정 획득을 위한 함정설계 과정"],"k":"함정은 방위사업법에 따른 획득 절차 안에서 설계된다. 소요 제기와 선행연구로 작전운용성능(ROC)을 정하고, 개념설계 → 기본설계 → 상세설계·건조 → 시험평가 → 전력화 순으로 진행한다. 상선과 달리 생존성(충격·신호 특성·손상통제)과 전투체계 통합이 설계를 지배한다.","x":"\n<p class=\"key\">함정은 방위사업법에 따른 획득 절차 안에서 설계된다. 소요 제기와 선행연구로 작전운용성능(ROC)을 정하고, 개념설계 → 기본설계 → 상세설계·건조 → 시험평가 → 전력화 순으로 진행한다. 상선과 달리 생존성(충격·신호 특성·손상통제)과 전투체계 통합이 설계를 지배한다.<\/p>\n<h4>획득 과정<\/h4>\n<ol>\n<li><b>소요 제기·결정<\/b>: 합참이 작전운용성능(ROC)과 전력화 시기 결정.<\/li>\n<li><b>선행연구·사업추진기본전략<\/b>(방위사업청): 국내 개발 여부, 비용·일정.<\/li>\n<li><b>개념설계<\/b>: 대안 선형·크기·추진체계 비교, 비용-성능 분석.<\/li>\n<li><b>기본설계<\/b>(조선소 수주): 주요치수, 선형, 일반배치, 무장·센서 배치, 중량·전력 예산, 생존성 설계.<\/li>\n<li><b>상세설계·선도함 건조<\/b>: 상세 도면, 전투체계 통합, 함정 표준(KDS, 선급 함정규칙) 적용.<\/li>\n<li><b>시험평가<\/b>: 개발시험평가(조선소·체계 성능), 운용시험평가(해군).<\/li>\n<li><b>후속함 건조·전력화<\/b>, 수명주기 지원(종합군수지원 ILS).<\/li>\n<\/ol>\n<h4>함정 설계의 특징<\/h4>\n<ul>\n<li>생존성: 수중 폭발 충격(shock) 설계, 레이더·적외선·수중방사소음·자기 신호 저감(소자 장치), 손상통제·구획, 이중화 배치.<\/li>\n<li>전투체계: 센서·무장 간섭, 전자기 적합성(EMC), 배치 시야각.<\/li>\n<li>성장 여유: 중량·KG·전력·공간 마진(수명 중 성능 개량).<\/li>\n<li>체계공학: 요구사항 추적, 형상관리, 단계별 설계 검토(SRR, PDR, CDR).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 획득 과정<\/h5><ol><li>소요 제기·결정(합참, ROC·전력화 시기)<\/li><li>선행연구·사업추진기본전략(방사청)<\/li><li>개념설계: 대안 비교, 비용-성능<\/li><li>기본설계(조선소): 주요치수·선형·배치·무장·중량·전력·생존성<\/li><li>상세설계·선도함 건조: 전투체계 통합, 함정 표준<\/li><li>시험평가: 개발·운용 시험평가<\/li><li>후속함·전력화, 종합군수지원<\/li><\/ol>\n<h5>2. 함정 설계 특징<\/h5><ul><li>생존성: 충격, 신호 저감(RCS·IR·소음·자기), 손상통제·이중화<\/li><li>전투체계: 센서·무장 간섭, EMC<\/li><li>성장 여유: 중량·KG·전력·공간 마진<\/li><li>체계공학: 요구사항 추적, 형상관리, 단계 설계검토(SRR·PDR·CDR)<\/li><\/ul>\n<p class=\"concl\"><b>3. 결론<\/b>: 함정은 성능보다 생존성과 수명 중 성능 개량 여유가 설계를 지배하며, 체계공학 기반 관리가 필수임.<\/p><\/div><\/section><\/details>"},{"id":"osv","p":13,"n":"13.13","h":"해양지원선(OSV): PSV, AHTS, SRV, OSCV, DSV","t":"해양지원선(OSV): PSV, AHTS, SRV, OSCV, DSV","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 4교시 4번 · 25점"],"q":["<b>112회(2017) 4-4<\/b> 해양지원선(OSV: PSV, AHTS, SRV, OSCV, DSV 등)"],"k":"해양지원선은 해상 시추·생산 설비를 보급·예인·구조·건설·잠수 작업으로 지원하는 선박군이다. 대부분 DP 위치유지와 넓은 작업 갑판을 갖추며, 임무 장비로 서로 구분된다.","x":"\n<p class=\"key\">해양지원선은 해상 시추·생산 설비를 보급·예인·구조·건설·잠수 작업으로 지원하는 선박군이다. 대부분 DP 위치유지와 넓은 작업 갑판을 갖추며, 임무 장비로 서로 구분된다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>선종<\/th><th>임무<\/th><th>핵심 설비<\/th><\/tr><\/thead><tbody>\n<tr><td>PSV (Platform Supply Vessel)<\/td><td>시추·생산 설비에 자재·액체 화물 보급<\/td><td>넓은 후부 갑판, 이수(mud)·브라인·연료·청수 탱크, 시멘트 등 건화물 탱크, DP2<\/td><\/tr>\n<tr><td>AHTS (Anchor Handling Tug Supply)<\/td><td>리그 예인, 앵커 설치·회수, 보급<\/td><td>대형 앵커 핸들링·예인 윈치, 선미 롤러, 샤크 조·토잉 핀, 큰 볼라드 풀<\/td><\/tr>\n<tr><td>SRV / ERRV (Standby Rescue)<\/td><td>설비 주변 대기, 비상 시 인명 구조<\/td><td>고속 구조정(FRC), 생존자 수용 공간, 의료 설비<\/td><\/tr>\n<tr><td>OSCV (Offshore Subsea Construction)<\/td><td>해저 설비 설치·건설<\/td><td>파랑 보상 대형 크레인, 문풀, ROV, 넓은 갑판, DP2/3<\/td><\/tr>\n<tr><td>DSV (Diving Support Vessel)<\/td><td>포화잠수 작업 지원<\/td><td>포화잠수 시스템, 다이빙 벨, 문풀, 고압 구조 설비, DP3<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>최근에는 해상풍력 지원선(SOV, CSV)이 늘고, 배터리 하이브리드·메탄올 추진 OSV가 등장했다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 112회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>선종<\/th><th>임무<\/th><th>핵심 설비<\/th><\/tr><\/thead><tbody>\n<tr><td>PSV<\/td><td>자재·액체 보급<\/td><td>넓은 갑판, 이수·연료·청수·시멘트 탱크, DP2<\/td><\/tr>\n<tr><td>AHTS<\/td><td>리그 예인·앵커 핸들링<\/td><td>대형 윈치, 선미 롤러, 샤크 조, 볼라드 풀<\/td><\/tr>\n<tr><td>SRV/ERRV<\/td><td>대기·인명 구조<\/td><td>고속 구조정, 생존자 수용·의료<\/td><\/tr>\n<tr><td>OSCV<\/td><td>해저 설비 설치<\/td><td>파랑 보상 크레인, 문풀, ROV, DP2/3<\/td><\/tr>\n<tr><td>DSV<\/td><td>포화잠수 지원<\/td><td>포화잠수 시스템, 다이빙 벨, DP3<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>결론<\/b>: 공통적으로 DP와 넓은 작업 갑판이 핵심이며, 최근 해상풍력 지원선(SOV·CSV)과 하이브리드 추진으로 확대 중임.<\/p><\/div><\/section><\/details>"},{"id":"shuttle-tanker","p":13,"n":"13.14","h":"Tanker와 비교한 Shuttle Tanker의 추가 기능","t":"Tanker와 비교한 Shuttle Tanker의 추가 기능","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 2교시 6번 · 25점"],"q":["<b>115회(2018) 2-6<\/b> Tanker와 비교한 Shuttle Tanker의 추가 기능"],"k":"셔틀탱커는 해상 생산설비(FPSO, 부이)에서 원유를 실어 육상 터미널로 나르는 유조선이다. 일반 유조선과 달리 해상에서 선수로 원유를 받기 위한 선수 적하장치(BLS)와 정밀 위치유지(DP)·추진 이중화가 핵심이며, 국내 조선소(삼성중공업 등)의 주력 고부가 선종이다.","x":"\n<p class=\"key\">셔틀탱커는 해상 생산설비(FPSO, 부이)에서 원유를 실어 육상 터미널로 나르는 유조선이다. 일반 유조선과 달리 해상에서 선수로 원유를 받기 위한 선수 적하장치(BLS)와 정밀 위치유지(DP)·추진 이중화가 핵심이며, 국내 조선소(삼성중공업 등)의 주력 고부가 선종이다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>기능<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>선수 적하장치(BLS)<\/td><td>선수 적하 커플러, 호스 핸들링, 호저 체인 스토퍼·장력 감시, 비상 분리(ESD)<\/td><\/tr>\n<tr><td>DP 위치유지<\/td><td>DP2 등급, 다수 위치 기준 장치(DGNSS, 상대위치 시스템, 수중음향), 탠덤 계류 시 FPSO와 거리 유지<\/td><\/tr>\n<tr><td>추진 이중화<\/td><td>쌍축·CPP, 선수·선미 터널 스러스터와 전방위 추진기, 큰 출력 여유<\/td><\/tr>\n<tr><td>대체 적하 방식<\/td><td>잠수 터렛 적하(STL) 구획, 부이 계류<\/td><\/tr>\n<tr><td>VOC 회수<\/td><td>원유 증기 회수·연료화(노르웨이 요구)<\/td><\/tr>\n<tr><td>환경·안전<\/td><td>북해·바렌츠해 내빙·혹한 사양, 헬기 갑판, 강화 불활성가스·화재 설비<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>운항 특성상 적하 사이클이 짧고 해상 계류 시 하중 반복이 많아, 선수부 구조와 피로 설계가 중요하다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 정의<\/h5><p>해상 생산설비(FPSO·부이)에서 원유를 실어 육상으로 운송하는 유조선.<\/p>\n<h5>2. 추가 기능<\/h5><ol><li>선수 적하장치(BLS): 커플러, 호스 핸들링, 호저 스토퍼·장력 감시, 비상 분리<\/li><li>DP2 위치유지: 다중 위치 기준 장치, FPSO 탠덤 거리 유지<\/li><li>추진 이중화: 쌍축·CPP, 선수·선미 스러스터·전방위 추진기<\/li><li>STL·부이 적하 대응<\/li><li>VOC 회수(노르웨이)<\/li><li>내빙·혹한, 헬기 갑판, 강화 안전설비<\/li><\/ol>\n<p class=\"concl\"><b>3. 결론<\/b>: 짧은 적하 주기와 해상 계류 반복 하중으로 선수부 구조·피로 설계가 중요하며, 국내 조선소(삼성중공업 등)의 주력 고부가 선종임.<\/p><\/div><\/section><\/details>"},{"id":"mooring-systems","p":13,"n":"13.15","h":"해상 부유식 구조물 계류시스템의 종류별 특성과 장·단점","t":"해상 부유식 구조물 계류시스템의 종류별 특성과 장·단점","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 2교시 1번 · 25점"],"q":["<b>118회(2019) 2-1<\/b> 해상 부유식 구조물 계류시스템의 종류별 특성과 장·단점"],"k":"부유식 구조물 계류는 여러 방향으로 고정하는 다점 계류(spread), 한 점을 중심으로 선체가 바람·파도 방향으로 돌게 하는 터렛·단일점 계류, 수직 인장재로 묶는 TLP 텐던, 계류 없이 추진기로 버티는 DP로 나뉜다.","x":"\n<p class=\"key\">부유식 구조물 계류는 여러 방향으로 고정하는 다점 계류(spread), 한 점을 중심으로 선체가 바람·파도 방향으로 돌게 하는 터렛·단일점 계류, 수직 인장재로 묶는 TLP 텐던, 계류 없이 추진기로 버티는 DP로 나뉜다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>특성<\/th><th>장점<\/th><th>단점·적용<\/th><\/tr><\/thead><tbody>\n<tr><td>다점 계류(spread)<\/td><td>선체 여러 지점에서 사방으로 계류줄<\/td><td>단순·저비용, 많은 라이저 수용<\/td><td>방향 고정 → 환경 하중 큼. 서아프리카·브라질 FPSO, 반잠수식<\/td><\/tr>\n<tr><td>터렛 계류(내부·외부)<\/td><td>터렛을 축으로 선체 풍향 추종(weathervaning)<\/td><td>환경 하중 최소화, 가혹 해역<\/td><td>터렛·스위벨 고가·복잡. 북해 FPSO, 분리형은 태풍 해역<\/td><\/tr>\n<tr><td>단일점 계류(CALM·SALM 부이)<\/td><td>부이에 호저로 연결<\/td><td>설치 간단, 선박 교대<\/td><td>호저 하중·피로. 하역용<\/td><\/tr>\n<tr><td>TLP 텐던<\/td><td>과잉 부력을 수직 인장재가 잡음<\/td><td>상하 운동 극소 → 건식 유정<\/td><td>수심 한계, 텐던 피로·비용<\/td><\/tr>\n<tr><td>DP<\/td><td>추진기로 위치 유지<\/td><td>설치 불필요, 이동 쉬움<\/td><td>연료·고장 위험. 시추선·해양작업선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>계류줄 구성은 현수선(체인, 중량에 의한 복원력), 긴장(taut, 폴리에스터 경량, 심해), 반긴장 형식이 있고, 앵커는 끌림 매입형, 석션 파일, 항타 파일, 수직하중 앵커(VLA)를 쓴다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>장점<\/th><th>단점·적용<\/th><\/tr><\/thead><tbody>\n<tr><td>다점 계류<\/td><td>단순·저비용, 많은 라이저<\/td><td>방향 고정·하중 큼 — 서아프리카·브라질 FPSO<\/td><\/tr>\n<tr><td>터렛 계류<\/td><td>풍향 추종, 가혹 해역<\/td><td>고가·복잡 — 북해 FPSO, 분리형은 태풍<\/td><\/tr>\n<tr><td>단일점(CALM)<\/td><td>설치 간단<\/td><td>호저 피로 — 하역<\/td><\/tr>\n<tr><td>TLP 텐던<\/td><td>상하 운동 극소<\/td><td>수심·피로·비용<\/td><\/tr>\n<tr><td>DP<\/td><td>설치 불필요<\/td><td>연료·고장 위험 — 시추선<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>계류줄: 현수선(체인)·긴장(폴리에스터)·반긴장 / 앵커: 끌림 매입, 석션 파일, 항타 파일, VLA.<\/p>\n<p class=\"concl\"><b>결론<\/b>: 해역 환경·수심·라이저 수·이동 필요성으로 방식을 정함.<\/p><\/div><\/section><\/details>"},{"id":"marine-equipment","p":13,"n":"13.16","h":"조선기자재의 특성과 요구사항","t":"조선기자재의 특성과 요구사항","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 3교시 6번 · 25점","133회 4교시 6번 · 25점"],"q":["<b>112회(2017) 3-6<\/b> 조선기자재의 특성","<b>133회(2024) 4-6<\/b> 조선기자재의 요구사항"],"k":"조선기자재는 해양 환경(염분, 진동, 경사, 온습도)에서 20~30년 이상 신뢰성을 유지해야 하고, 선급 형식승인과 국제 규정을 만족해야 하며, 선박별 맞춤 소량 생산이라는 특성이 있다. 납기가 건조 공정을 좌우하고, 전 세계 서비스망이 경쟁력이 된다.","x":"\n<p class=\"key\">조선기자재는 해양 환경(염분, 진동, 경사, 온습도)에서 20~30년 이상 신뢰성을 유지해야 하고, 선급 형식승인과 국제 규정을 만족해야 하며, 선박별 맞춤 소량 생산이라는 특성이 있다. 납기가 건조 공정을 좌우하고, 전 세계 서비스망이 경쟁력이 된다.<\/p>\n<h4>특성<\/h4>\n<ul>\n<li>다품종 소량, 선박별 사양 맞춤, 대형·중량물.<\/li>\n<li>인증 산업: 선급 형식승인, EU MED(휠마크), USCG 등.<\/li>\n<li>긴 수명과 장기 부품 공급 의무, 전 세계 사후 서비스.<\/li>\n<li>조선 경기에 따른 수요 변동, 핵심 기자재(주기관 라이선스, LNG 화물창 기술)의 해외 의존.<\/li>\n<\/ul>\n<h4>요구사항<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>구분<\/th><th>요구<\/th><\/tr><\/thead><tbody>\n<tr><td>환경 내성<\/td><td>IACS UR E10 시험(온도, 습도, 진동, 경사, 전자기 적합성), 방수·방폭 등급<\/td><\/tr>\n<tr><td>규정·인증<\/td><td>형식승인·제품 증서, IMO 성능기준, 친환경 규정(NOx Tier, BWMS)<\/td><\/tr>\n<tr><td>사이버 보안<\/td><td>IACS UR E27(2024년 7월 이후 계약선 설비의 사이버 복원력)<\/td><\/tr>\n<tr><td>유해물질<\/td><td>홍콩협약 IHM용 물질 신고서(MD)·적합 선언서(SDoC)<\/td><\/tr>\n<tr><td>성능·효율<\/td><td>에너지 효율, 연료 유연성(대체연료 대응)<\/td><\/tr>\n<tr><td>정비성·표준화<\/td><td>접근성, 표준 부품, 원격 진단<\/td><\/tr>\n<tr><td>품질·납기·원가<\/td><td>공정 연계 납기, 품질 문서, 경쟁력 있는 가격<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-3-6<\/td><td>조선기자재의 특성<\/td><td>산업 특성(다품종 소량, 인증, 수명)<\/td><\/tr>\n<tr><td class=\"num\">133-4-6<\/td><td>조선기자재의 요구사항<\/td><td>환경 시험·인증·사이버·IHM<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽 · 133회형\">\n<h5>1. 개요<\/h5><p>조선기자재는 선박 원가의 큰 비중을 차지하며, 해양 환경에서 수십 년 신뢰성을 보장해야 하는 인증 산업임.<\/p>\n<h5>2. 특성<\/h5><ul><li>다품종 소량·선박별 맞춤, 대형·중량물<\/li><li>형식승인·인증 필수(선급, EU MED, USCG)<\/li><li>20~30년 부품 공급·전 세계 서비스<\/li><li>조선 경기 연동, 핵심 기자재 해외 의존<\/li><\/ul>\n<h5>3. 요구사항<\/h5>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>환경 내성<\/td><td>IACS UR E10(온도·습도·진동·경사·EMC), 방수·방폭 등급<\/td><\/tr>\n<tr><td>규정<\/td><td>형식승인, IMO 성능기준, Tier III·BWMS 등 친환경<\/td><\/tr>\n<tr><td>사이버<\/td><td>UR E27(2024.7 이후 계약선 설비)<\/td><\/tr>\n<tr><td>유해물질<\/td><td>HKC IHM용 MD·SDoC<\/td><\/tr>\n<tr><td>성능·정비<\/td><td>효율, 대체연료 대응, 원격 진단, 표준 부품<\/td><\/tr>\n<tr><td>품질·납기·원가<\/td><td>공정 연계 납기, 품질 문서<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>4. 결론<\/b>: 대체연료·자율운항 전환기에 기자재는 하드웨어에서 데이터·서비스 결합형으로 바뀌고 있어, 국산화와 사이버·친환경 인증 대응이 경쟁력의 조건임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"mass","p":13,"n":"13.17","h":"자율운항선박(MASS)의 정의, IMO 자율화 등급, 기대효과","t":"자율운항선박(MASS)의 정의, IMO 자율화 등급, 기대효과","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 2교시 2번 · 25점"],"q":["<b>127회(2022) 2-2<\/b> 자율운항선박의 정의, IMO 자율화 등급, 기대효과"],"k":"IMO는 자율운항선박(Maritime Autonomous Surface Ship)을 사람의 개입 없이 다양한 정도로 운항할 수 있는 선박으로 정의하고, 규제 검토를 위해 자율화를 4등급으로 나눴다. 현재 비강제 MASS 코드를 개발 중이며, 이후 강제 코드로 전환할 계획이다.","x":"\n<p class=\"key\">IMO는 자율운항선박(Maritime Autonomous Surface Ship)을 사람의 개입 없이 다양한 정도로 운항할 수 있는 선박으로 정의하고, 규제 검토를 위해 자율화를 4등급으로 나눴다. 현재 비강제 MASS 코드를 개발 중이며, 이후 강제 코드로 전환할 계획이다.<\/p>\n<h4>IMO 자율화 등급<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등급<\/th><th>내용<\/th><\/tr><\/thead><tbody>\n<tr><td>Degree 1<\/td><td>자동화 공정과 의사결정 지원을 갖춘 선박. 선원이 승선해 시스템을 운용·통제<\/td><\/tr>\n<tr><td>Degree 2<\/td><td>선원이 승선한 원격 제어 선박. 다른 장소에서 제어하나 선원이 대응 가능<\/td><\/tr>\n<tr><td>Degree 3<\/td><td>선원 없는 원격 제어 선박<\/td><\/tr>\n<tr><td>Degree 4<\/td><td>완전 자율 선박. 운항 시스템이 스스로 판단·행동<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>기대효과<\/h4>\n<ul>\n<li>안전: 해양사고의 큰 비중을 차지하는 인적 과실 감소, 피로·당직 부담 경감.<\/li>\n<li>경제: 선원 비용·선원 부족 대응, 최적 항로·속력으로 연료 절감, 무인선은 거주구 제거로 화물 공간·중량 이득.<\/li>\n<li>산업: 원격운항센터, 데이터·소프트웨어 서비스, 고부가 기자재. 국내는 자율운항선박 기술개발사업(KASS)과 조선사 자율운항 솔루션(HiNAS, SAS 등) 상용화.<\/li>\n<\/ul>\n<h4>과제<\/h4>\n<p>COLREG 견시·SOLAS 정원·STCW 등 규정 개정, 사고 책임 소재, 통신 신뢰성, 센서·인공지능 검증, 사이버보안, 항만·보험 체계.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 정의<\/h5><p>사람의 개입 없이 다양한 정도로 운항할 수 있는 선박(IMO).<\/p>\n<h5>2. IMO 자율화 등급<\/h5><p>Degree 1 자동화·의사결정 지원(선원 승선) / 2 원격 제어 + 선원 / 3 무인 원격 제어 / 4 완전 자율<\/p>\n<h5>3. 기대효과<\/h5><ul><li>안전: 인적 과실 감소, 피로 경감<\/li><li>경제: 선원 비용·부족 대응, 최적 운항 연료 절감, 거주구 제거 공간·중량<\/li><li>산업: 원격운항센터, 데이터 서비스, 국내 KASS·조선사 솔루션<\/li><\/ul>\n<h5>4. 과제<\/h5><p>COLREG·SOLAS·STCW 개정, 책임, 통신, AI 검증, 사이버보안. IMO 비강제 MASS 코드 개발 중.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 단기는 Degree 1~2 의사결정 지원으로 안전·연비 효과를 얻고, 규정 정비에 맞춰 단계적으로 무인화로 진행될 것임.<\/p><\/div><\/section><\/details>"},{"id":"smart-ship-levels","p":13,"n":"13.18","h":"스마트선박 자동화 5단계","t":"스마트선박 자동화 5단계","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 1번 · 10점"],"q":["<b>127회(2022) 1-1<\/b> 스마트선박 자동화 5단계"],"k":"스마트선박 자동화 단계는 사람의 역할이 \"직접 운항 → 지원받는 운항 → 감독 → 원격 개입 → 무개입\"으로 옮겨가는 정도로 나눈다. 기관과 문헌마다 단계 수가 다르지만(IMO 4등급, LR AL0~AL6 등), 5단계 구분은 다음과 같이 IMO 등급과 대응시켜 이해한다.","x":"\n<p class=\"key\">스마트선박 자동화 단계는 사람의 역할이 \"직접 운항 → 지원받는 운항 → 감독 → 원격 개입 → 무개입\"으로 옮겨가는 정도로 나눈다. 기관과 문헌마다 단계 수가 다르지만(IMO 4등급, LR AL0~AL6 등), 5단계 구분은 다음과 같이 IMO 등급과 대응시켜 이해한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>단계<\/th><th>내용<\/th><th>사람의 역할<\/th><th>IMO 대응<\/th><\/tr><\/thead><tbody>\n<tr><td>1단계 정보 제공<\/td><td>센서·통신 통합, 상태 감시·경보, 데이터 기반 정보 제공<\/td><td>선원이 모든 판단·조작<\/td><td>Degree 1 이전<\/td><\/tr>\n<tr><td>2단계 의사결정 지원<\/td><td>충돌 회피·항로·연비 최적 권고, 기관 상태 진단<\/td><td>선원이 권고를 보고 결정<\/td><td>Degree 1<\/td><\/tr>\n<tr><td>3단계 부분 자율<\/td><td>특정 조건(대양 항해)에서 자동 항해·충돌 회피, 이상 시 선원 개입<\/td><td>선원 감독(human on the loop)<\/td><td>Degree 1~2<\/td><\/tr>\n<tr><td>4단계 원격·조건부 무인<\/td><td>육상 원격운항센터가 감시·제어, 선원 최소 또는 무인<\/td><td>원격 운항자<\/td><td>Degree 2~3<\/td><\/tr>\n<tr><td>5단계 완전 자율<\/td><td>시스템이 전 항해 과정을 스스로 판단·수행<\/td><td>예외적 감시<\/td><td>Degree 4<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>답안에서는 출제자가 어떤 분류를 의도했는지 알 수 없으므로, 기준을 명시하고(위 5단계) IMO 4등급과의 대응을 함께 쓰는 것이 안전하다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 기준 명시 필수\">\n<ol><li>정보 제공: 센서·통신 통합, 감시·경보 (선원 전부 판단)<\/li><li>의사결정 지원: 충돌 회피·항로·연비 권고 (IMO Degree 1)<\/li><li>부분 자율: 대양 자동 항해, 이상 시 개입 (Degree 1~2)<\/li><li>원격·조건부 무인: 육상 원격운항 (Degree 2~3)<\/li><li>완전 자율: 시스템 전 과정 수행 (Degree 4)<\/li><\/ol>\n<p class=\"concl\"><b>의견<\/b>: 기관별 분류가 달라(IMO 4등급, LR AL0~6) 답안 첫머리에 기준을 밝혀야 함.<\/p><\/div><\/section><\/details>"},{"id":"cyber","p":13,"n":"13.19","h":"MASS 자율도 수준별 사이버보안 위협요소와 선박 네트워크 설계 고려사항","t":"MASS 자율도 수준별 사이버보안 위협요소와 선박 네트워크 설계 고려사항","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 3교시 6번 · 25점"],"q":["<b>139회(2026) 3-6<\/b> MASS 자율도 수준별 사이버보안 위협요소와 선박 네트워크 설계 고려사항"],"k":"자율도가 높아질수록 선박의 판단과 제어가 센서 데이터·통신 링크·소프트웨어에 의존하므로, 사이버 공격이 곧 항해 안전 사고가 된다. 설계는 IACS UR E26·E27(2024년 7월 이후 계약선 적용)과 IEC 62443의 구역·도관(zones and conduits) 개념으로 네트워크를 분리하고, 통신 상실·침해 시 안전 상태로 가는 fail-safe를 갖추는 것이다.","x":"\n<p class=\"key\">자율도가 높아질수록 선박의 판단과 제어가 센서 데이터·통신 링크·소프트웨어에 의존하므로, 사이버 공격이 곧 항해 안전 사고가 된다. 설계는 IACS UR E26·E27(2024년 7월 이후 계약선 적용)과 IEC 62443의 구역·도관(zones and conduits) 개념으로 네트워크를 분리하고, 통신 상실·침해 시 안전 상태로 가는 fail-safe를 갖추는 것이다.<\/p>\n<h4>자율도별 위협요소<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>등급<\/th><th>주요 위협<\/th><th>결과<\/th><\/tr><\/thead><tbody>\n<tr><td>Degree 1 (선원 승선 + 의사결정 지원)<\/td><td>GNSS 재밍·스푸핑, AIS 위조, ECDIS 악성코드, USB 경유 감염, 랜섬웨어(IT망)<\/td><td>잘못된 정보로 판단 오류, 선원 개입으로 완화 가능<\/td><\/tr>\n<tr><td>Degree 2 (원격 제어 + 선원)<\/td><td>원격 제어 링크 탈취·명령 주입, 통신 서비스 거부(DoS), 원격 접속 계정 탈취<\/td><td>제어권 혼란, 선원이 현장 복귀 조치<\/td><\/tr>\n<tr><td>Degree 3 (무인 원격)<\/td><td>링크 상실·탈취, 원격운항센터(육상 IT) 침해, 공급망(소프트웨어 업데이트) 공격<\/td><td>제어 상실, 선박 탈취·충돌 위험, 현장 대응 불가<\/td><\/tr>\n<tr><td>Degree 4 (완전 자율)<\/td><td>센서 기만(레이더·카메라·LiDAR 적대적 입력), AI 모델 오염, 운항 소프트웨어 변조<\/td><td>시스템 스스로 위험 행동, 탐지 어려움<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>네트워크 설계 고려사항<\/h4>\n<ol>\n<li><b>자산 목록과 위험 평가<\/b>: 모든 컴퓨터 기반 시스템(CBS)을 목록화하고 중요도 분류(UR E26).<\/li>\n<li><b>망 분리<\/b>: IT(업무)망과 OT(항해·추진·전력 제어)망 분리, 보안 구역(zone)별 방화벽과 DMZ, 단방향 게이트웨이(데이터 다이오드).<\/li>\n<li><b>원격 접속 보안<\/b>: VPN, 다중 인증, 접속 기록, 최소 권한, 세션 승인.<\/li>\n<li><b>통신 이중화<\/b>: 정지궤도 위성(VSAT) + 저궤도 위성 + 연안 5G·LTE, 링크 상실 시 자동 최소위험상태(MRC: 정지·표류·저속 회피) 전환.<\/li>\n<li><b>명령·데이터 무결성<\/b>: 제어 명령 암호화·서명, 센서 데이터 교차 검증(GNSS와 관성항법·레이더 융합으로 스푸핑 탐지).<\/li>\n<li><b>탐지·대응<\/b>: 침입 탐지(IDS), 통합 로그, 사고 대응 계획, 백업·복구 절차(UR E26 탐지·대응·복구 요건).<\/li>\n<li><b>설비 보안<\/b>: UR E27 인증 장비, 보안 부팅, 소프트웨어 업데이트 관리, 이동식 매체 통제.<\/li>\n<li><b>관리체계<\/b>: ISM 안전관리체제에 사이버 위험 관리 포함(MSC.428(98)), 훈련, 침투 시험. 국내는 해사안전기본법이 \"해사 사이버안전\"(선박운항시스템과 정보의 기밀성·무결성·가용성 유지)을 정의한다.<\/li>\n<\/ol>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 3교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 개요<\/h5><p>자율도가 높을수록 판단·제어가 센서·통신·소프트웨어에 의존해 사이버 공격이 곧 항해 사고가 됨. 해사안전기본법은 \"해사 사이버안전\"(선박운항시스템 기밀성·무결성·가용성 유지)을 정의함.<\/p>\n<h5>2. 자율도별 위협<\/h5><ul><li>D1: GNSS 재밍·스푸핑, AIS 위조, ECDIS 악성코드, 랜섬웨어<\/li><li>D2: 원격 링크 탈취·명령 주입, DoS, 계정 탈취<\/li><li>D3: 링크 상실, 원격운항센터 침해, 공급망 공격<\/li><li>D4: 센서 기만, AI 모델 오염, 소프트웨어 변조<\/li><\/ul>\n<h5>3. 네트워크 설계<\/h5><ol><li>자산 목록·위험 평가(IACS UR E26)<\/li><li>IT/OT 분리, 구역·도관(IEC 62443), 방화벽·DMZ·데이터 다이오드<\/li><li>원격 접속: VPN·다중 인증·기록<\/li><li>통신 이중화(VSAT + 저궤도 + 연안망), 링크 상실 시 최소위험상태<\/li><li>명령 암호화·서명, 센서 교차 검증(GNSS 스푸핑 탐지)<\/li><li>IDS·로그·대응·복구<\/li><li>UR E27 장비, 보안 부팅, 업데이트 관리<\/li><li>ISM 사이버 위험관리(MSC.428(98)), 훈련·침투 시험<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 2024.7 이후 계약선은 UR E26·E27이 강제이므로, 자율운항 설계는 처음부터 보안 구역 설계와 fail-safe를 포함해야 함.<\/p><\/div><\/section><\/details>"},{"id":"future-tech","p":13,"n":"13.20","h":"조선산업의 미래기술 발전방향: 탈탄소 친환경선박, AI·Big Data 기반 설계와 유지보수","t":"조선산업의 미래기술 발전방향: 탈탄소 친환경선박, AI·Big Data 기반 설계와 유지보수","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 4교시 3번 · 25점"],"q":["<b>139회(2026) 4-3<\/b> 조선산업 미래기술 발전방향(탈탄소 친환경선박, AI·Big Data 설계 및 유지보수)"],"k":"조선산업의 미래 경쟁력은 두 축이다. 하나는 무탄소 연료와 효율 기술로 IMO 2050 순배출 0 목표를 만족하는 선박을 만드는 능력, 다른 하나는 데이터와 AI로 설계·건조·운항 전 주기를 최적화하는 능력이다.","x":"\n<p class=\"key\">조선산업의 미래 경쟁력은 두 축이다. 하나는 무탄소 연료와 효율 기술로 IMO 2050 순배출 0 목표를 만족하는 선박을 만드는 능력, 다른 하나는 데이터와 AI로 설계·건조·운항 전 주기를 최적화하는 능력이다.<\/p>\n<h4>1) 탈탄소 기반 친환경선박 기술<\/h4>\n<ul>\n<li><b>연료 전환<\/b>: LNG(바이오·합성) → 메탄올·암모니아 이중연료 기관, 수소 연료전지·배터리 하이브리드, 장기적으로 원자력(SMR·MSR).<\/li>\n<li><b>저장·운송<\/b>: 암모니아 운반선, 액화수소 운반선(−253 °C 단열·재료), 대형 LCO₂ 운반선, 연료탱크 기술(Type C 대형화, 멤브레인 응용).<\/li>\n<li><b>효율<\/b>: AI 기반 선형 최적화, ESD, 공기윤활, 풍력(로터·윙세일), 폐열회수.<\/li>\n<li><b>탄소 포집<\/b>: 선상 CO₂ 포집·저장(OCCS).<\/li>\n<li><b>평가<\/b>: 전과정(WtW) 탄소 평가, 탄소비용(EU ETS·IMO 가격제) 반영 설계.<\/li>\n<\/ul>\n<h4>2) AI·Big Data 기반 설계와 유지보수<\/h4>\n<ul>\n<li><b>설계<\/b>: 대리모델(surrogate)과 생성형 설계로 선형·구조 최적화를 빠르게, 규칙 자동 검토, 과거 프로젝트 지식 재사용, 3D 모델 기반 자동 도면.<\/li>\n<li><b>건조<\/b>: 스마트 야드(공정·물류 최적화, 비전 기반 용접 검사, 로봇 자동화), 디지털 트윈으로 공정 시뮬레이션.<\/li>\n<li><b>운항·유지보수<\/b>: 선체 응력 모니터링·피로 추정(구조 디지털 트윈), 기관 상태기반정비(CBM)·고장 예측, 선체 오손 감지와 청소 시점 최적화, 자율운항.<\/li>\n<li><b>기반<\/b>: 선박 데이터 표준(ISO 19847/19848), 통신(저궤도 위성), 사이버보안, 데이터 소유권, 인력 재교육.<\/li>\n<\/ul>\n<p>국내 조선소는 LNG선 기술 우위를 바탕으로 대체연료선과 디지털 솔루션을 결합해 \"선박 + 운항 서비스\" 사업으로 확장하는 것이 방향이다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1) 탈탄소 기반 친환경선박 기술<\/h5><ul><li>연료 전환: LNG(바이오·e) → 메탄올·암모니아 DF, 수소 연료전지·배터리, SMR·MSR<\/li><li>저장·운송: 암모니아·액화수소·대형 LCO₂ 운반선, 연료탱크 대형화<\/li><li>효율: AI 선형 최적화, ESD, 공기윤활, 풍력, 폐열<\/li><li>선상 탄소포집, WtW 평가·탄소비용 반영 설계<\/li><\/ul>\n<h5>2) AI·Big Data 기반 설계와 유지보수<\/h5><ul><li>설계: 대리모델·생성형 설계, 규칙 자동 검토, 자동 도면<\/li><li>건조: 스마트 야드(공정·물류 최적화, 비전 검사, 로봇), 디지털 트윈<\/li><li>운항: 구조 모니터링·잔여수명, CBM·고장 예측, 오손 감지, 자율운항<\/li><li>기반: 데이터 표준(ISO 19847/19848), 위성 통신, 사이버보안, 인력 재교육<\/li><\/ul>\n<p class=\"concl\"><b>3. 결론<\/b>: LNG선 기술 우위를 바탕으로 대체연료선과 디지털 솔루션을 결합한 \"선박 + 운항 서비스\" 사업으로 확장하는 것이 국내 조선산업의 방향임.<\/p><\/div><\/section><\/details>"},{"id":"freight-indices","p":14,"n":"14.1","h":"해운 운임지수: BDI(Baltic Dry Index)와 SCFI(Shanghai Containerized Freight Index)","t":"해운 운임지수: BDI(Baltic Dry Index)와 SCFI(Shanghai Containerized Freight Index)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 11번 · 10점","130회 1교시 11번 · 10점"],"q":["<b>112회(2017) 1-11<\/b> BDI(Baltic Dry Index)","<b>130회(2023) 1-11<\/b> 상하이컨테이너운임지수(SCFI)"],"k":"BDI는 런던 발틱해운거래소가 매일 발표하는 건화물(벌크선) 운임지수이고, SCFI는 상하이해운거래소가 매주 발표하는 컨테이너 현물 운임지수다. 두 지수는 해운 수익의 선행 지표로, 1~2년 뒤 신조 발주 경기를 가늠하는 데 쓰인다.","x":"\n<p class=\"key\">BDI는 런던 발틱해운거래소가 매일 발표하는 건화물(벌크선) 운임지수이고, SCFI는 상하이해운거래소가 매주 발표하는 컨테이너 현물 운임지수다. 두 지수는 해운 수익의 선행 지표로, 1~2년 뒤 신조 발주 경기를 가늠하는 데 쓰인다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>BDI<\/th><th>SCFI<\/th><\/tr><\/thead><tbody>\n<tr><td>발표<\/td><td>Baltic Exchange(런던), 매일<\/td><td>Shanghai Shipping Exchange, 매주<\/td><\/tr>\n<tr><td>대상<\/td><td>건화물 벌크선 정기용선료(케이프사이즈 40%, 파나막스 30%, 수프라막스 30% 가중, 2018년 개편)<\/td><td>상하이발 주요 항로(유럽, 지중해, 미주 서안·동안 등) 컨테이너 현물 운임<\/td><\/tr>\n<tr><td>기준<\/td><td>1985년 1,000<\/td><td>2009년 10월 1,000<\/td><\/tr>\n<tr><td>특징<\/td><td>철광석·석탄·곡물 수요와 선복 공급에 민감, 변동성 매우 큼(2008년 5월 11,000대 → 같은 해 12월 600대)<\/td><td>정기선 현물 시장 지표, 2022년 초 5,000대 고점 후 급락<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>쓰임<\/h4>\n<ul>\n<li>해운 경기 판단, 운임 연동 계약(index-linked charter), 파생상품(FFA) 정산.<\/li>\n<li>조선 측면: 운임 상승 → 선사 수익·현금 증가 → 신조 발주(시차) → 선가 상승. 반대로 선복 과잉은 운임 하락과 발주 절벽으로 이어진다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-1-11<\/td><td>BDI<\/td><td>발표·구성·의미<\/td><\/tr>\n<tr><td class=\"num\">130-1-11<\/td><td>SCFI<\/td><td>발표·대상·조선 영향<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · BDI / SCFI 공용\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>BDI<\/th><th>SCFI<\/th><\/tr><\/thead><tbody>\n<tr><td>발표<\/td><td>발틱해운거래소(런던), 매일<\/td><td>상하이해운거래소, 매주<\/td><\/tr>\n<tr><td>대상<\/td><td>벌크선 정기용선료(케이프 40·파나막스 30·수프라막스 30%)<\/td><td>상하이발 주요 항로 컨테이너 현물 운임<\/td><\/tr>\n<tr><td>기준<\/td><td>1985년 1,000<\/td><td>2009년 10월 1,000<\/td><\/tr>\n<tr><td>특징<\/td><td>원자재 수요 민감, 변동성 매우 큼<\/td><td>정기선 현물 시장 지표<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 운임 상승 → 선사 수익 → 1~2년 시차로 신조 발주·선가 상승으로 이어지므로 조선 수주 선행지표로 활용함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"heavy-tail","p":14,"n":"14.2","h":"선박건조비 지급방식: Heavy-tail과 Top-heavy, 그리고 문제점","t":"선박건조비 지급방식: Heavy-tail과 Top-heavy, 그리고 문제점","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["112회 1교시 12번 · 10점","139회 1교시 6번 · 10점"],"q":["<b>112회(2017) 1-12<\/b> 선박건조비 지급방식 중 Heavy-Tail 방식과 문제점","<b>139회(2026) 1-6<\/b> Heavy-tail vs Top-heavy"],"k":"신조선 대금은 계약·강재절단·용골거치·진수·인도 시점에 나누어 받는다. 인도 시점에 대금이 몰리는 것이 Heavy-tail, 초기에 많이 받는 것이 Top-heavy다. Heavy-tail은 구매자 시장에서 선주에게 유리하고 조선소의 건조 자금 부담과 인도 거부 위험을 키운다.","x":"\n<p class=\"key\">신조선 대금은 계약·강재절단·용골거치·진수·인도 시점에 나누어 받는다. 인도 시점에 대금이 몰리는 것이 Heavy-tail, 초기에 많이 받는 것이 Top-heavy다. Heavy-tail은 구매자 시장에서 선주에게 유리하고 조선소의 건조 자금 부담과 인도 거부 위험을 키운다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>방식<\/th><th>지급 구조 예<\/th><th>시장<\/th><th>유불리<\/th><\/tr><\/thead><tbody>\n<tr><td>균등 분할<\/td><td>20/20/20/20/20<\/td><td>균형<\/td><td>표준형<\/td><\/tr>\n<tr><td>Heavy-tail<\/td><td>10/10/10/10/60 또는 20/80<\/td><td>구매자 시장(발주 부진기)<\/td><td>선주: 초기 자금 부담 적음, 위험 이전 / 조선소: 건조 자금 차입, 이자·환율 노출, 인도 시 선주 지급 불능·인도 거부 위험<\/td><\/tr>\n<tr><td>Top-heavy<\/td><td>계약 초기 40~60%<\/td><td>판매자 시장(호황기)<\/td><td>조선소: 현금 흐름 양호 / 선주: 자금 부담, 조선소 부도 위험 노출 → 큰 금액의 RG 요구<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>Heavy-tail의 문제점(조선소)<\/h4>\n<ul>\n<li>건조 원가를 자체 자금·차입으로 조달 → 부채비율 상승, 금융비용 증가.<\/li>\n<li>환율 변동 위험 기간이 길어짐(대금 대부분이 인도 시 달러로 입금).<\/li>\n<li>시황 악화 시 선주가 인도를 거부·지연하면 미인도 선박 재고와 대금 손실(2010년대 해양·상선 사례).<\/li>\n<li>재무 악화로 RG 발급 한도 축소 → 수주 능력 저하의 악순환.<\/li>\n<li>대응: 제작 금융, 환헤지, 선주 신용 평가, 인도 전 대금 비율 협상, 정책 금융 보증.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">112-1-12<\/td><td>Heavy-tail 방식과 문제점<\/td><td>조선소 재무 위험<\/td><\/tr>\n<tr><td class=\"num\">139-1-6<\/td><td>Heavy-tail vs Top-heavy<\/td><td>비교표, 시장 상황<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분 · 139회형\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>Heavy-tail<\/th><th>Top-heavy<\/th><\/tr><\/thead><tbody>\n<tr><td>구조 예<\/td><td>10/10/10/10/60, 20/80<\/td><td>계약 초기 40~60%<\/td><\/tr>\n<tr><td>시장<\/td><td>구매자 시장(불황)<\/td><td>판매자 시장(호황)<\/td><\/tr>\n<tr><td>조선소<\/td><td>건조 자금 차입·환율 노출·인도 거부 위험<\/td><td>현금 흐름 양호<\/td><\/tr>\n<tr><td>선주<\/td><td>초기 부담 적음<\/td><td>자금 부담, 큰 RG 요구<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>Heavy-tail 문제점<\/h5><p>부채비율·금융비용 증가, 환위험 기간 장기화, 시황 악화 시 인도 거부, 재무 악화 → RG 한도 축소 → 수주 능력 저하의 악순환.<\/p>\n<p class=\"concl\"><b>의견<\/b>: 선주 신용 평가와 환헤지, 정책금융 보증으로 위험을 관리해야 함.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"rg","p":14,"n":"14.3","h":"RG(Refund Guarantee, 선수금 환급보증)","t":"RG(Refund Guarantee, 선수금 환급보증)","c":2,"r":1,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 1교시 10번 · 10점","133회 1교시 8번 · 10점"],"q":["<b>118회(2019) 1-10<\/b> RG","<b>133회(2024) 1-8<\/b> RG(Refund guarantee)"],"k":"RG는 조선소가 인도 전에 받은 선수금을, 건조 지연·성능 미달·파산 등 조선소 귀책으로 계약이 해제될 때 선주에게 이자와 함께 돌려주겠다고 은행(또는 보증기관)이 보증하는 것이다. 선주는 RG를 받아야 첫 선수금을 지급하므로, RG 발급 능력이 곧 조선소의 수주 능력이다.","x":"\n<p class=\"key\">RG는 조선소가 인도 전에 받은 선수금을, 건조 지연·성능 미달·파산 등 조선소 귀책으로 계약이 해제될 때 선주에게 이자와 함께 돌려주겠다고 은행(또는 보증기관)이 보증하는 것이다. 선주는 RG를 받아야 첫 선수금을 지급하므로, RG 발급 능력이 곧 조선소의 수주 능력이다.<\/p>\n<ul>\n<li><b>발급 기관<\/b>: 수출입은행, 무역보험공사, 시중은행, 보험사.<\/li>\n<li><b>금액<\/b>: 인도 전 누적 선수금 + 약정 이자. Top-heavy일수록 커짐.<\/li>\n<li><b>발동 조건<\/b>: 계약서의 선주 해제권(장기 지연, 속력·DWT 등 성능 한도 초과 미달, 조선소 지급불능)과 연결.<\/li>\n<li><b>문제<\/b>: 조선소 재무 상태가 나쁘면 은행이 발급을 꺼려 수주를 하고도 계약이 무산된다(중형 조선소 RG 한도 문제). 정책금융기관의 특례 보증으로 보완.<\/li>\n<li><b>실무<\/b>: 보증 문안(무조건·요구불 여부, 중재 연계 조항), 만기, 수수료, 다른 보증(성능보증, 선수금 보증)과 구분.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 10점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">118-1-10 · 133-1-8<\/td><td>RG(Refund Guarantee)<\/td><td>정의·발동 조건·수주 능력과의 관계<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선수금 환급보증: 조선소 귀책(지연·성능 미달·파산)으로 계약 해제 시 인도 전 선수금과 이자를 선주에게 반환하겠다는 은행·보증기관의 보증.<\/p>\n<h5>2. 특징<\/h5><ul><li>발급: 수출입은행·무역보험공사·시중은행<\/li><li>금액: 누적 선수금 + 이자(Top-heavy일수록 큼)<\/li><li>선주는 RG 수령 후 첫 선수금 지급<\/li><\/ul>\n<h5>3. 문제<\/h5><p>조선소 재무 악화 시 발급 기피 → 수주 무산(중형 조선소 RG 한도 문제), 정책 특례 보증으로 보완.<\/p>\n<p class=\"concl\"><b>4. 의견<\/b>: RG 발급 능력이 곧 수주 능력이므로 조선소 재무 건전성 관리가 영업 경쟁력임.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"slb","p":14,"n":"14.4","h":"S&amp;LB(Sale and Lease Back)","t":"S&LB(Sale and Lease Back)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 1교시 2번 · 10점"],"q":["<b>121회(2020) 1-2<\/b> S&amp;LB"],"k":"S&LB는 선주가 보유 선박을 리스사·금융기관에 팔고, 그 선박을 다시 장기 용선(주로 나용선)해 계속 운항하는 금융 방식이다. 선박 가치를 현금화해 유동성을 확보하면서 운항은 유지하고, 용선 종료 시 매입 옵션(또는 의무)으로 선박을 되찾는다.","x":"\n<p class=\"key\">S&amp;LB는 선주가 보유 선박을 리스사·금융기관에 팔고, 그 선박을 다시 장기 용선(주로 나용선)해 계속 운항하는 금융 방식이다. 선박 가치를 현금화해 유동성을 확보하면서 운항은 유지하고, 용선 종료 시 매입 옵션(또는 의무)으로 선박을 되찾는다.<\/p>\n<ul>\n<li><b>목적<\/b>: 유동성 확보, 차입 한도 보완, 은행 대출이 어려울 때의 대체 금융, 신조 대금 조달.<\/li>\n<li><b>구조<\/b>: 매각 대금 → 선주, 선주는 나용선료(원금 + 이자 성격) 지급, 매입 옵션 가격 사전 약정.<\/li>\n<li><b>장점<\/b>: 담보대출보다 높은 조달 비율, 신속한 자금화.<\/li>\n<li><b>단점<\/b>: 실질 금리 높음, 소유권 이전으로 운용 제약, 회계상 리스 부채 인식(IFRS 16).<\/li>\n<li><b>국내<\/b>: 한국해양진흥공사(2018 설립)의 S&amp;LB 프로그램이 해운 불황기 선사 유동성 지원 수단으로 활용되었다. 세계적으로는 중국계 리스사의 비중이 크다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 121회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선주가 선박을 금융사에 매각하고 나용선으로 다시 빌려 운항하며, 종료 시 매입 옵션으로 되찾는 금융.<\/p>\n<h5>2. 목적·특징<\/h5><p>유동성 확보, 대출 대체 / 높은 조달 비율·신속 vs 높은 실질 금리, 소유권 이전, 리스 부채(IFRS 16).<\/p>\n<p class=\"concl\"><b>3. 국내<\/b>: 한국해양진흥공사(2018) S&amp;LB로 불황기 선사 지원.<\/p><\/div><\/section><\/details>"},{"id":"pandi","p":14,"n":"14.5","h":"P&amp;I Club(선주상호보험조합)","t":"P&I Club(선주상호보험조합)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 1교시 10번 · 10점"],"q":["<b>124회(2021) 1-10<\/b> P&amp;I Club"],"k":"P&I Club은 선주들이 서로 출자해 만든 상호보험조합으로, 선체보험(H&M)이 담보하지 않는 제3자 배상책임을 보상한다. 국제 P&I 그룹(IG) 소속 12개 클럽이 전 세계 외항 선복량의 대부분을 담보한다.","x":"\n<p class=\"key\">P&amp;I Club은 선주들이 서로 출자해 만든 상호보험조합으로, 선체보험(H&amp;M)이 담보하지 않는 제3자 배상책임을 보상한다. 국제 P&amp;I 그룹(IG) 소속 12개 클럽이 전 세계 외항 선복량의 대부분을 담보한다.<\/p>\n<h4>주요 담보<\/h4>\n<ul>\n<li>선원 상해·사망·질병, 송환.<\/li>\n<li>화물 손상·멸실 배상책임.<\/li>\n<li>충돌 배상책임 중 선체보험 미담보분, 부두·고정물 손상.<\/li>\n<li>유류 오염, 난파물 제거, 벌금, 밀항자, 여객 책임.<\/li>\n<\/ul>\n<h4>특징<\/h4>\n<ul>\n<li>상호보험: 가입 선주가 보험료(콜) 납부, 손해율에 따라 추가 콜 가능.<\/li>\n<li>IG 클럽 간 대형 손해 공동 부담(풀링)과 공동 재보험.<\/li>\n<li>협약 증서(블루카드): CLC·벙커·난파물 제거협약 강제보험 증명.<\/li>\n<li>국내: 한국선주상호보험(KP&amp;I).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>선주 상호보험조합: 선체보험이 담보하지 않는 제3자 배상책임 보상.<\/p>\n<h5>2. 담보<\/h5><p>선원 상해·송환, 화물 손해, 충돌 미담보분, 유류 오염, 난파물 제거, 벌금, 여객.<\/p>\n<h5>3. 특징<\/h5><p>상호보험(콜), IG 12개 클럽 풀링·공동 재보험, 블루카드(CLC·벙커·난파물 협약), 국내 KP&amp;I.<\/p><\/div><\/section><\/details>"},{"id":"ship-finance","p":14,"n":"14.6","h":"우리나라 선박금융의 문제점","t":"우리나라 선박금융의 문제점","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["118회 2교시 6번 · 25점"],"q":["<b>118회(2019) 2-6<\/b> 우리나라 선박금융의 문제점 5가지"],"k":"우리나라는 세계 1~2위 조선국이고 상위 해운국이지만 선박금융은 정책금융 의존이 크고, 민간 금융의 전문성과 상품 다양성이 부족해 시황 하락기에 자금이 끊기는 경기순응성이 강하다.","x":"\n<p class=\"key\">우리나라는 세계 1~2위 조선국이고 상위 해운국이지만 선박금융은 정책금융 의존이 크고, 민간 금융의 전문성과 상품 다양성이 부족해 시황 하락기에 자금이 끊기는 경기순응성이 강하다.<\/p>\n<ol>\n<li><b>정책금융 편중<\/b>: 수출입은행·산업은행·무역보험공사 중심, 시중은행·자본시장 참여 부족.<\/li>\n<li><b>전문성 부족<\/b>: 선박 가치·용선 계약 기반의 자산금융 심사 역량과 전문 인력 부족, 담보·신용 위주 단기 대출.<\/li>\n<li><b>경기순응성<\/b>: 불황기 대출 회수·신규 중단 → 선사 유동성 위기 심화(2016년 대형 선사 파산).<\/li>\n<li><b>상품 다양성 부족<\/b>: 지분 투자, 메자닌, 리스, 선박펀드 규모가 작고 투자자 기반 약함.<\/li>\n<li><b>RG·제작금융 한도<\/b>: 조선소 재무 악화 시 보증 발급 위축으로 수주 제약.<\/li>\n<li><b>조달 비용<\/b>: 달러 조달 비용과 신용등급에 따른 금리 부담, 중소 선사 담보 요구.<\/li>\n<li><b>해운-조선-화주 연계 부족<\/b>: 일본·중국처럼 화주(장기운송계약)·금융·조선이 결합한 모델이 약함.<\/li>\n<\/ol>\n<p>대응으로 한국해양진흥공사 설립(2018), 선박투자회사 제도, 보증 프로그램, 친환경선 전환 금융이 운영되고 있다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 118회 2교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽 · 문제점 5가지\">\n<h5>1. 개요<\/h5><p>조선·해운 강국 대비 선박금융은 정책금융 의존·경기순응성이 강함.<\/p>\n<h5>2. 문제점 5가지<\/h5><ol><li>정책금융 편중(수은·산은·무보), 시중은행·자본시장 참여 부족<\/li><li>자산금융 심사 전문성·인력 부족, 단기·담보 위주<\/li><li>경기순응성: 불황기 회수·중단 → 선사 위기 심화<\/li><li>상품 다양성 부족: 지분·메자닌·리스·선박펀드 규모 작음<\/li><li>RG·제작금융 한도 → 조선소 수주 제약<\/li><\/ol><p>(추가) 달러 조달 비용, 해운-조선-화주 연계 부족<\/p>\n<h5>3. 대응<\/h5><p>한국해양진흥공사, 선박투자회사, 보증 프로그램, 친환경선 전환 금융.<\/p>\n<p class=\"concl\"><b>4. 결론<\/b>: 경기 역행적 공적 금융과 민간 전문 금융 육성을 병행해야 조선·해운 경쟁력이 함께 유지됨.<\/p><\/div><\/section><\/details>"},{"id":"ship-investment","p":14,"n":"14.7","h":"선박투자회사법: 선박투자회사·선박운용회사의 정의와 업무범위","t":"선박투자회사법: 선박투자회사·선박운용회사의 정의와 업무범위","c":2,"r":0,"b":[{"c":"","t":"2회 출제"},{"c":"mdl","t":"모범답안 수록"}],"ch":["121회 2교시 2번 · 25점","127회 2교시 6번 · 25점"],"q":["<b>121회(2020) 2-2<\/b> 선박투자회사법상 선박투자회사의 정의와 업무의 범위","<b>127회(2022) 2-6<\/b> 선박투자회사법상 선박운용회사의 의미와 선박투자회사의 업무범위"],"k":"선박투자회사법은 일반 투자자 자금을 모아 선박에 투자하고 수익을 배분하는 선박펀드 제도의 근거법이다. 선박투자회사는 1척의 선박만 소유하는 명목회사(페이퍼 컴퍼니)이고, 실제 자산 운용은 해양수산부 허가를 받은 선박운용회사가 맡는다.","x":"\n<p class=\"key\">선박투자회사법은 일반 투자자 자금을 모아 선박에 투자하고 수익을 배분하는 선박펀드 제도의 근거법이다. 선박투자회사는 1척의 선박만 소유하는 명목회사(페이퍼 컴퍼니)이고, 실제 자산 운용은 해양수산부 허가를 받은 선박운용회사가 맡는다.<\/p>\n<h4>정의(제2조)<\/h4>\n<ul>\n<li><b>선박투자회사<\/b>: 자산을 선박에 투자하여 그 수익을 주주에게 분배하는 것을 목적으로 이 법에 따라 설립된 회사.<\/li>\n<li><b>선박운용회사<\/b>: 선박투자회사의 위탁을 받아 선박 등의 자산을 운용하는 업무를 하는 자로서 제31조에 따라 해양수산부장관의 허가를 받은 회사.<\/li>\n<li><b>자산보관회사<\/b>: 자본시장법상 신탁업자로서 선박투자회사의 위탁을 받아 자산의 보관과 관련 업무를 하는 회사.<\/li>\n<li><b>선박운항회사<\/b>: 선박투자회사 또는 그 자회사가 소유하는 선박을 대선받아 운항 또는 대선하는 회사.<\/li>\n<\/ul>\n<h4>선박투자회사의 업무 범위(제24조)<\/h4>\n<ol>\n<li>선박의 취득<\/li>\n<li>선박의 대선<\/li>\n<li>자금의 차입 및 사채의 발행<\/li>\n<li>주식의 발행<\/li>\n<li>취득한 선박의 관리·매각<\/li>\n<li>그 밖에 대통령령으로 정하는 업무<\/li>\n<\/ol>\n<p>다른 업무 겸업 금지, 유가증권 투자 금지(자회사 주식 제외).<\/p>\n<h4>기타 특징(제3조·제6조)<\/h4>\n<ul>\n<li>주식회사로 하고, 1척의 선박을 소유(자회사를 두면 자회사가 각 1척, 이 경우 본사는 선박 소유 불가), 존립기간 중 선박 대체 금지.<\/li>\n<li>본점 외 영업소, 상근 임원, 직원을 둘 수 없음(명목회사).<\/li>\n<li>존립기간은 선박투자업 인가일부터 3년 이상.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\">\n<p class=\"mtitle\">MODEL ANSWER · 2회 출제(모두 25점)<\/p>\n<h4>출제 각도 분석<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>회차<\/th><th>문제<\/th><th>강조할 것<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">121-2-2<\/td><td>선박투자회사 정의와 업무범위<\/td><td>제2조·제24조 조문<\/td><\/tr>\n<tr><td class=\"num\">127-2-6<\/td><td>선박운용회사 의미와 업무범위<\/td><td>운용회사 허가, 명목회사 구조<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>실전 모범답안<\/h4>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<h5>1. 개요<\/h5><p>선박투자회사법은 일반 투자자 자금으로 선박을 사서 대선 수익을 배분하는 선박펀드 제도의 근거법임.<\/p>\n<h5>2. 정의(제2조)<\/h5><ul><li>선박투자회사: 자산을 선박에 투자해 수익을 주주에게 분배하는 회사<\/li><li>선박운용회사: 선박투자회사 위탁으로 선박 등 자산을 운용, 해양수산부장관 허가(제31조)<\/li><li>자산보관회사: 신탁업자로서 자산 보관<\/li><li>선박운항회사: 소유 선박을 대선받아 운항·대선<\/li><\/ul>\n<h5>3. 업무범위(제24조)<\/h5><ol><li>선박의 취득<\/li><li>선박의 대선<\/li><li>자금의 차입 및 사채의 발행<\/li><li>주식의 발행<\/li><li>취득한 선박의 관리·매각<\/li><li>대통령령으로 정하는 업무<\/li><\/ol><p>겸업 금지, 유가증권 투자 금지(자회사 주식 제외).<\/p>\n<h5>4. 구조적 특징(제3·6조)<\/h5><p>주식회사, 1척 소유(자회사는 각 1척), 존립기간 중 선박 대체 금지, 상근 임직원 없음(명목회사), 존립기간 3년 이상.<\/p>\n<p class=\"concl\"><b>5. 결론<\/b>: 명목회사 구조로 위험을 선박 단위로 분리하는 제도이며, 해운 불황기 민간 자금 유입이 약한 것이 한계로 지적됨.<\/p>\n<\/div>\n<\/section><\/details>"},{"id":"national-essential-ships","p":14,"n":"14.8","h":"국가필수선박","t":"국가필수선박","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["127회 1교시 12번 · 10점"],"q":["<b>127회(2022) 1-12<\/b> 국가필수선박"],"k":"국가필수선박은 전시·사변 같은 비상사태나 해운업체 파산 등으로 해운·항만 기능에 중대한 장애가 생겼을 때, 국민경제에 긴요한 물자와 군수물자를 수송하기 위해 해양수산부장관이 지정한 선박이다(「비상사태등에 대비하기 위한 해운 및 항만 기능 유지에 관한 법률」).","x":"\n<p class=\"key\">국가필수선박은 전시·사변 같은 비상사태나 해운업체 파산 등으로 해운·항만 기능에 중대한 장애가 생겼을 때, 국민경제에 긴요한 물자와 군수물자를 수송하기 위해 해양수산부장관이 지정한 선박이다(「비상사태등에 대비하기 위한 해운 및 항만 기능 유지에 관한 법률」).<\/p>\n<ul>\n<li><b>지정 대상(제5조)<\/b>: 국제선박등록법의 국제선박, 또는 공공기관 소유 선박 중 규모·선령·수송 화물 종류가 대통령령 기준에 맞는 선박. 소유자 등의 신청을 받아 관계 중앙행정기관과 협의 후 지정, 필요 최소 범위에서 목표 지정 척수 달성 노력.<\/li>\n<li><b>의무<\/b>: 비상사태등 발생 시 장관의 소집·수송 명령에 따라야 하며, 명령 수행 방해 금지.<\/li>\n<li><b>지원<\/b>: 지정 선박에 대한 지원(예: 한국인 선원 고용에 따른 인건비 차액 지원), 명령 이행에 따른 손실보상(제13조).<\/li>\n<li><b>배경<\/b>: 외국인 선원 비중 증가와 선박 해외 매각으로 비상시 국가 수송력이 약해지는 문제에 대응. 한진해운 파산(2016) 이후 해운·항만 기능 유지로 범위를 넓혔다(항만운영협약 포함).<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 127회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>비상사태등에 국민경제 긴요 물자·군수물자 수송을 위해 해양수산부장관이 지정한 선박(해운항만기능유지법).<\/p>\n<h5>2. 지정·운영<\/h5><p>국제선박 또는 공공기관 소유 선박 중 규모·선령·화물 기준 충족 선박을 신청받아 지정 / 비상시 소집·수송 명령, 따를 의무 / 인건비 차액 지원, 손실보상.<\/p>\n<p class=\"concl\"><b>3. 의의<\/b>: 외국인 선원·해외 매각 증가에 대응해 국가 수송력 확보.<\/p><\/div><\/section><\/details>"},{"id":"dry-bulk-market","p":14,"n":"14.9","h":"Dry 벌크 해운의 특성: 정기선 시장과 부정기선 시장","t":"Dry 벌크 해운의 특성: 정기선 시장과 부정기선 시장","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["124회 4교시 6번 · 25점"],"q":["<b>124회(2021) 4-6<\/b> Dry 벌크 해운의 특성(정기선 시장과 부정기선 시장)"],"k":"해운 시장은 정해진 항로·일정으로 다수 화주의 소량 화물을 나르는 정기선(liner, 주로 컨테이너) 시장과, 화물이 있는 곳으로 배를 보내 대량 단일 화물을 나르는 부정기선(tramp) 시장으로 나뉜다. 건화물 벌크 해운은 대표적인 부정기선 시장이며, 국내에서는 제철·발전사와의 장기 전용선 계약이 정기선에 가까운 안정 수요를 만든다.","x":"\n<p class=\"key\">해운 시장은 정해진 항로·일정으로 다수 화주의 소량 화물을 나르는 정기선(liner, 주로 컨테이너) 시장과, 화물이 있는 곳으로 배를 보내 대량 단일 화물을 나르는 부정기선(tramp) 시장으로 나뉜다. 건화물 벌크 해운은 대표적인 부정기선 시장이며, 국내에서는 제철·발전사와의 장기 전용선 계약이 정기선에 가까운 안정 수요를 만든다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>정기선 시장<\/th><th>부정기선 시장(Dry bulk)<\/th><\/tr><\/thead><tbody>\n<tr><td>운항<\/td><td>고정 항로·일정, 기항지 공시<\/td><td>화물에 따라 항로·일정 결정<\/td><\/tr>\n<tr><td>화물<\/td><td>컨테이너 잡화, 소량 다수 화주<\/td><td>철광석·석탄·곡물·보크사이트 등 대량 단일 화물<\/td><\/tr>\n<tr><td>계약<\/td><td>선하증권·운임표(tariff), 서비스 계약<\/td><td>항해용선, 정기용선, 장기운송계약(COA), 전용선 계약<\/td><\/tr>\n<tr><td>운임<\/td><td>상대적으로 안정(얼라이언스·서비스 경쟁)<\/td><td>수급으로 결정, 변동성 매우 큼(BDI)<\/td><\/tr>\n<tr><td>시장 구조<\/td><td>소수 대형 선사·얼라이언스 과점<\/td><td>다수 선주, 완전경쟁에 가까움<\/td><\/tr>\n<tr><td>선박<\/td><td>컨테이너선 대형화<\/td><td>핸디·수프라/울트라막스·파나막스/캄사르막스·케이프사이즈·VLOC<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>Dry 벌크 해운의 특성<\/h4>\n<ul>\n<li>수요는 중국 등 원자재 수입국 경기와 철강·전력 생산에 좌우되고, 공급은 신조 인도와 해체로 수년 시차를 두고 조정되어 경기 순환이 크다.<\/li>\n<li>항만 체선, 계절(곡물), 운하 제한 등이 단기 운임을 흔든다.<\/li>\n<li>국내 선사는 장기 전용선 계약(제철·발전)으로 안정성을 확보하고, 현물 시장 노출을 관리한다.<\/li>\n<li>탄소 규제(CII)는 노후 저효율선의 퇴출과 감속 운항을 통해 선복 공급을 줄이는 효과가 있다.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 124회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2쪽\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>정기선<\/th><th>부정기선(Dry bulk)<\/th><\/tr><\/thead><tbody>\n<tr><td>운항<\/td><td>고정 항로·일정<\/td><td>화물 따라 결정<\/td><\/tr>\n<tr><td>화물<\/td><td>컨테이너 소량 다수<\/td><td>철광석·석탄·곡물 대량 단일<\/td><\/tr>\n<tr><td>계약<\/td><td>B/L·운임표·서비스 계약<\/td><td>항해·정기용선, COA, 전용선<\/td><\/tr>\n<tr><td>운임<\/td><td>상대적 안정<\/td><td>수급 결정, BDI 변동성 큼<\/td><\/tr>\n<tr><td>구조<\/td><td>대형 선사·얼라이언스<\/td><td>다수 선주, 완전경쟁<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h5>Dry 벌크 특성<\/h5><ul><li>원자재 수입국 경기 의존, 신조 인도 시차로 큰 순환<\/li><li>체선·계절·운하 제한이 단기 운임 변동<\/li><li>국내는 제철·발전사 장기 전용선으로 안정성 확보<\/li><li>CII가 노후선 퇴출·감속으로 공급 축소 효과<\/li><\/ul><\/div><\/section><\/details>"},{"id":"npv","p":14,"n":"14.10","h":"선박 신규사양 경제성 평가기법 중 순현재가치법(NPV)","t":"선박 신규사양 경제성 평가기법 중 순현재가치법(NPV)","c":1,"r":0,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["115회 1교시 2번 · 10점"],"q":["<b>115회(2018) 1-2<\/b> 선박 신규사양 경제성 평가기법 중 순현재가치법(NPV)"],"k":"NPV는 투자로 생기는 미래 현금흐름을 할인율로 현재가치로 바꿔 합하고 초기 투자비를 뺀 값이다. NPV > 0이면 그 사양(예: ESD, 스크러버, 이중연료)을 채택할 가치가 있다.","x":"\n<p class=\"key\">NPV는 투자로 생기는 미래 현금흐름을 할인율로 현재가치로 바꿔 합하고 초기 투자비를 뺀 값이다. NPV &gt; 0이면 그 사양(예: ESD, 스크러버, 이중연료)을 채택할 가치가 있다.<\/p>\n<div class=\"eq\"><div class=\"eql\">잔존가치가 있으면 그 현재가치를 더한다<\/div><div class=\"mj\">\\[\\mathrm{NPV}=\\sum_{t=1}^{n}\\dfrac{CF_t}{(1+r)^t}-I_0\\]<\/div><\/div>\n<h4>적용 절차<\/h4>\n<ol>\n<li>신규 사양의 추가 투자비 I<sub>0<\/sub>(설비·설치·공기 손실).<\/li>\n<li>연간 증분 현금흐름: 연료 절감 + 탄소비용 절감(EU ETS) + 운임 프리미엄 − 정비비·전력 소비.<\/li>\n<li>할인율 r(자본비용, WACC), 평가 기간(잔여 선령).<\/li>\n<li>NPV 계산과 민감도 분석(연료가, 운항일수, 탄소가).<\/li>\n<\/ol>\n<h4>예시<\/h4>\n<p>ESD 설치비 50만 달러, 하루 30 t 연료의 3% 절감, 연료가 600달러/t, 연 280일 운항 → 연간 절감 0.03 × 30 × 600 × 280 = 151,200달러. 할인율 8%, 15년이면 연금현가계수 8.559 → 현재가치 약 129만 달러 → NPV ≈ +79만 달러로 채택.<\/p>\n<h4>장단점<\/h4>\n<p>화폐의 시간가치와 전체 수명을 반영하고 대안 간 비교가 명확하다. 그러나 할인율과 미래 연료가 가정에 민감하므로 IRR, 회수기간과 함께 보고, 시나리오별로 제시한다.<\/p>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 115회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"calc\">NPV = Σ CF_t/(1+r)^t − I_0  → NPV > 0 이면 채택\n예) ESD 50만 달러, 연 151,200달러 절감, r = 8%, 15년\n    연금현가계수 8.559 → PV ≈ 129만 → NPV ≈ +79만 달러<\/div>\n<p>장점: 시간가치·수명 전체 반영 / 단점: 할인율·연료가 가정 민감 → IRR·회수기간·민감도 병행.<\/p><\/div><\/section><\/details>"},{"id":"epc","p":14,"n":"14.11","h":"EPC(Engineering, Procurement &amp; Construction) Project의 정의, 특징, 계약서상 주의점","t":"EPC(Engineering, Procurement & Construction) Project의 정의, 특징, 계약서상 주의점","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["133회 4교시 2번 · 25점"],"q":["<b>133회(2024) 4-2<\/b> EPC Project의 정의 및 특징, 계약서상 주의점"],"k":"EPC는 한 계약자가 설계(E)·조달(P)·건설(C)과 보통 시운전까지 일괄 책임지는 계약 방식이다. 해양플랜트(FPSO, 플랫폼)는 대개 고정가 일괄(LSTK)로 계약되어 계약자가 설계·물량·일정 위험을 대부분 진다. 2010년대 국내 조선소의 해양플랜트 대규모 손실은 미성숙한 기본설계(FEED) 위에서 고정가로 계약하고 설계 변경을 보상받지 못한 데서 비롯됐다.","x":"\n<p class=\"key\">EPC는 한 계약자가 설계(E)·조달(P)·건설(C)과 보통 시운전까지 일괄 책임지는 계약 방식이다. 해양플랜트(FPSO, 플랫폼)는 대개 고정가 일괄(LSTK)로 계약되어 계약자가 설계·물량·일정 위험을 대부분 진다. 2010년대 국내 조선소의 해양플랜트 대규모 손실은 미성숙한 기본설계(FEED) 위에서 고정가로 계약하고 설계 변경을 보상받지 못한 데서 비롯됐다.<\/p>\n<h4>특징<\/h4>\n<ul>\n<li>단일 책임(single point responsibility), 고정 가격·일정.<\/li>\n<li>발주처 표준·사양(company specifications)이 방대하고 승인 절차가 길다.<\/li>\n<li>다수 공종·기자재·하도급 인터페이스, 높은 위험과 높은 수주액.<\/li>\n<\/ul>\n<h4>계약서상 주의할 점<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>주의점<\/th><\/tr><\/thead><tbody>\n<tr><td>범위·사양<\/td><td>FEED 완성도, 작업 범위·경계 명확화, 발주처 사양 간 상충 해결 순위<\/td><\/tr>\n<tr><td>설계 변경<\/td><td>변경 지시(change order) 절차·가격·일정 조정 기준, 발주처 검토 지연 책임<\/td><\/tr>\n<tr><td>지체상금·성능 보증<\/td><td>LD 요율과 상한(계약가의 일정 %), 성능 미달 LD, 유일한 구제수단(sole remedy) 조항<\/td><\/tr>\n<tr><td>책임 제한<\/td><td>총 책임 상한, 간접·결과적 손해 배제, 상호 면책(knock-for-knock)<\/td><\/tr>\n<tr><td>대금·보증<\/td><td>마일스톤 지급, 선급금·이행 보증서, 유보금<\/td><\/tr>\n<tr><td>불가항력·제재<\/td><td>사유 범위, 통지 기한, 장기 불가항력 시 해지<\/td><\/tr>\n<tr><td>현지 조건<\/td><td>현지 조달 비율(local content), 세금, 인허가<\/td><\/tr>\n<tr><td>환율·원자재<\/td><td>통화, 가격 조정 조항<\/td><\/tr>\n<tr><td>보증·하자<\/td><td>하자보증 기간, 범위<\/td><\/tr>\n<tr><td>분쟁<\/td><td>준거법, 중재지, 단계적 분쟁 해결<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 133회 4교시<\/p>\n<div class=\"sheet\" data-meta=\"25점 · 약 23분 · 2.5쪽\">\n<h5>1. 정의<\/h5><p>한 계약자가 설계·조달·건설(·시운전)을 일괄 책임지는 계약. 해양플랜트는 대개 고정가 일괄(LSTK).<\/p>\n<h5>2. 특징<\/h5><p>단일 책임, 고정 가격·일정, 방대한 발주처 사양, 다수 인터페이스, 고위험·고수주액.<\/p>\n<h5>3. 계약서상 주의점<\/h5><ol><li>범위·사양: FEED 완성도, 경계, 사양 상충 해결 순위<\/li><li>설계 변경: 변경 지시 절차·가격·일정, 발주처 검토 지연 책임<\/li><li>지체상금·성능 보증: 요율·상한, sole remedy<\/li><li>책임 제한: 총액 상한, 간접 손해 배제, knock-for-knock<\/li><li>대금·보증: 마일스톤, 선급금·이행 보증, 유보금<\/li><li>불가항력·제재, 현지 조달·세금, 환율·원자재, 하자보증, 준거법·중재<\/li><\/ol>\n<p class=\"concl\"><b>4. 결론<\/b>: 2010년대 국내 조선소 해양플랜트 손실은 미성숙 FEED + 고정가 + 변경 미보상이 원인이었으므로, 범위 확정과 변경 보상 조항이 가장 중요함.<\/p><\/div><\/section><\/details>"},{"id":"force-majeure","p":14,"n":"14.12","h":"Force Majeure(불가항력)","t":"Force Majeure(불가항력)","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 2번 · 10점"],"q":["<b>139회(2026) 1-2<\/b> force majeure"],"k":"불가항력은 당사자가 예견·통제할 수 없는 사건(전쟁, 천재지변, 전염병, 정부 조치 등) 때문에 계약 이행이 불가능하거나 지연될 때, 그 책임을 면제하거나 이행 기한을 연장해 주는 계약 조항이다. 신조선 계약에서는 \"허용 지연(permissible delay)\"으로 인도 기한을 늘려 지체상금을 면제하는 형태로 쓰인다.","x":"\n<p class=\"key\">불가항력은 당사자가 예견·통제할 수 없는 사건(전쟁, 천재지변, 전염병, 정부 조치 등) 때문에 계약 이행이 불가능하거나 지연될 때, 그 책임을 면제하거나 이행 기한을 연장해 주는 계약 조항이다. 신조선 계약에서는 \"허용 지연(permissible delay)\"으로 인도 기한을 늘려 지체상금을 면제하는 형태로 쓰인다.<\/p>\n<ul>\n<li><b>사유<\/b>: 전쟁·폭동·테러, 지진·태풍·홍수, 화재·폭발, 전염병, 정부 규제·제재, 일반 파업(조선소 노동쟁의 포함 여부는 계약별), 주요 기자재 공급자의 불가항력.<\/li>\n<li><b>요건<\/b>: 통제 불능·예견 불가, 이행과의 인과관계, 정해진 기한 내 서면 통지와 증빙.<\/li>\n<li><b>효과<\/b>: 해당 기간만큼 인도일 연장, 지체상금 면제. 누적 지연이 일정 일수를 넘으면 선주 해제권.<\/li>\n<li><b>실무 쟁점<\/b>: 코로나19 지연, 러시아 제재(2022)로 인한 계약 해지·대금 송금 불가, 사유 범위 해석, 통지 누락에 따른 권리 상실.<\/li>\n<\/ul>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<h5>1. 정의<\/h5><p>예견·통제 불가 사건으로 이행 불능·지연 시 책임 면제 또는 기한 연장 조항. 신조선 계약은 허용 지연(permissible delay)으로 인도일 연장·지체상금 면제.<\/p>\n<h5>2. 사유·요건<\/h5><p>전쟁·천재지변·전염병·정부 조치·파업(계약별) / 통제 불능, 인과관계, 기한 내 서면 통지·증빙.<\/p>\n<h5>3. 효과·쟁점<\/h5><p>누적 지연 한도 초과 시 선주 해제권 / 코로나19, 러시아 제재(2022) 사례, 통지 누락 시 권리 상실.<\/p><\/div><\/section><\/details>"},{"id":"loi-mou","p":14,"n":"14.13","h":"LOI, MOU, Contract 비교","t":"LOI, MOU, Contract 비교","c":1,"r":1,"b":[{"c":"mdl","t":"모범답안 수록"}],"ch":["139회 1교시 13번 · 10점"],"q":["<b>139회(2026) 1-13<\/b> LOI, MOU 및 Contract 비교"],"k":"LOI는 계약 체결 의사와 주요 조건을 밝힌 의향서, MOU는 당사자 간 이해와 협력 틀을 정리한 양해각서, Contract는 권리·의무를 확정한 법적 구속력 있는 계약이다. 다만 구속력은 문서 제목이 아니라 내용과 당사자 의사로 판단되므로, LOI·MOU에도 구속 조항과 비구속 조항을 명시해야 한다.","x":"\n<p class=\"key\">LOI는 계약 체결 의사와 주요 조건을 밝힌 의향서, MOU는 당사자 간 이해와 협력 틀을 정리한 양해각서, Contract는 권리·의무를 확정한 법적 구속력 있는 계약이다. 다만 구속력은 문서 제목이 아니라 내용과 당사자 의사로 판단되므로, LOI·MOU에도 구속 조항과 비구속 조항을 명시해야 한다.<\/p>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>LOI(Letter of Intent)<\/th><th>MOU(Memorandum of Understanding)<\/th><th>Contract<\/th><\/tr><\/thead><tbody>\n<tr><td>성격<\/td><td>계약 체결 의향, 주요 조건 제시<\/td><td>협력·합의 방향의 이해 정리<\/td><td>권리·의무 확정<\/td><\/tr>\n<tr><td>구속력<\/td><td>원칙적으로 비구속(비밀유지·독점협상·유효기간 조항은 구속으로 두는 경우 많음)<\/td><td>원칙적으로 비구속<\/td><td>구속<\/td><\/tr>\n<tr><td>내용<\/td><td>선가, 인도 시기, 척수·옵션, 개략 사양<\/td><td>공동 개발·협력 범위, 역할<\/td><td>사양서, 대금·지급, 인도, 보증, 지체상금, RG, 하자보증, 준거법·중재<\/td><\/tr>\n<tr><td>조선 실무<\/td><td>수주 발표의 근거, 이후 본계약 협상<\/td><td>기술 협력, 정부·기관 간 협력<\/td><td>발효 조건(RG 발급, 선수금 입금) 충족 후 효력<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"warn\"><p>선박 매매(S&amp;P)의 MOA(Memorandum of Agreement, Norwegian Saleform)는 이름이 메모랜덤이지만 구속력 있는 매매계약이다. 제목으로 구속력을 판단하면 안 된다는 대표 예다.<\/p><\/div>\n<details class=\"mwrap\"><summary>모범답안 보기<\/summary><section class=\"model\"><p class=\"mtitle\">MODEL ANSWER · 139회 1교시<\/p>\n<div class=\"sheet\" data-meta=\"10점 · 약 9분\">\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>항목<\/th><th>LOI<\/th><th>MOU<\/th><th>Contract<\/th><\/tr><\/thead><tbody>\n<tr><td>성격<\/td><td>체결 의향·주요 조건<\/td><td>협력 이해<\/td><td>권리·의무 확정<\/td><\/tr>\n<tr><td>구속력<\/td><td>원칙 비구속(비밀유지·독점 조항 구속)<\/td><td>원칙 비구속<\/td><td>구속<\/td><\/tr>\n<tr><td>내용<\/td><td>선가·인도·척수·옵션<\/td><td>협력 범위<\/td><td>사양·대금·보증·지체상금·RG·중재<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"concl\"><b>의견<\/b>: 구속력은 제목이 아니라 내용으로 판단함(선박 매매 MOA는 구속력 있는 계약).<\/p><\/div><\/section><\/details>"},{"id":"trend-map","p":15,"n":"15.1","h":"2027년(제142회) 출제 트렌드 지도","t":"2027년(제142회) 출제 트렌드 지도","c":0,"r":0,"b":[{"c":"pred","t":"예상"}],"ch":[],"q":[],"k":"최근 4회(130~139회) 출제는 친환경 연료·규제, 가스 화물·연료 격납, 디지털·자율운항, 국내 법령, 생산 현장 시나리오로 수렴한다. 2027년에는 여기에 암모니아·메탄올·수소의 실선 적용, IMO Net-Zero Framework 채택 여부, AI 설계·디지털 트윈, 북극항로와 한미 조선협력 같은 산업 이슈가 더해질 가능성이 크다.","x":"\n<p class=\"key\">최근 4회(130~139회) 출제는 친환경 연료·규제, 가스 화물·연료 격납, 디지털·자율운항, 국내 법령, 생산 현장 시나리오로 수렴한다. 2027년에는 여기에 암모니아·메탄올·수소의 실선 적용, IMO Net-Zero Framework 채택 여부, AI 설계·디지털 트윈, 북극항로와 한미 조선협력 같은 산업 이슈가 더해질 가능성이 크다.<\/p>\n<h4>규제·산업 일정으로 본 출제 근거<\/h4>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 248\" role=\"img\" aria-label=\"2023~2030 해운 탈탄소 규제 일정\">\n<line x1=\"30\" y1=\"120\" x2=\"620\" y2=\"120\" class=\"ln\"/>\n<g class=\"t2\">\n<line x1=\"50\" y1=\"114\" x2=\"50\" y2=\"126\" class=\"ln\"/><text x=\"50\" y=\"142\" text-anchor=\"middle\">2023<\/text>\n<line x1=\"130\" y1=\"114\" x2=\"130\" y2=\"126\" class=\"ln\"/><text x=\"130\" y=\"142\" text-anchor=\"middle\">2024<\/text>\n<line x1=\"210\" y1=\"114\" x2=\"210\" y2=\"126\" class=\"ln\"/><text x=\"210\" y=\"142\" text-anchor=\"middle\">2025<\/text>\n<line x1=\"290\" y1=\"114\" x2=\"290\" y2=\"126\" class=\"ln\"/><text x=\"290\" y=\"142\" text-anchor=\"middle\">2026<\/text>\n<line x1=\"370\" y1=\"114\" x2=\"370\" y2=\"126\" class=\"ln\"/><text x=\"370\" y=\"142\" text-anchor=\"middle\">2027<\/text>\n<line x1=\"450\" y1=\"114\" x2=\"450\" y2=\"126\" class=\"ln\"/><text x=\"450\" y=\"142\" text-anchor=\"middle\">2028<\/text>\n<line x1=\"610\" y1=\"114\" x2=\"610\" y2=\"126\" class=\"ln\"/><text x=\"610\" y=\"142\" text-anchor=\"middle\">2030<\/text>\n<\/g>\n<rect x=\"358\" y=\"100\" width=\"24\" height=\"18\" rx=\"4\" class=\"fr\"/><text x=\"370\" y=\"94\" text-anchor=\"middle\" class=\"tr\">시험 5월<\/text>\n<g class=\"t1\">\n<circle cx=\"50\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"50\" y=\"40\">EEXI·CII 시행<\/text><line x1=\"50\" y1=\"46\" x2=\"50\" y2=\"114\" class=\"lg\"/>\n<circle cx=\"130\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"130\" y=\"64\">EU ETS 해운<\/text><line x1=\"130\" y1=\"70\" x2=\"130\" y2=\"114\" class=\"lg\"/>\n<circle cx=\"210\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"190\" y=\"40\">FuelEU · HKC 발효<\/text><line x1=\"210\" y1=\"46\" x2=\"210\" y2=\"114\" class=\"lg\"/>\n<circle cx=\"290\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"268\" y=\"64\">ETS 100%·CH₄ 포함<\/text><line x1=\"290\" y1=\"70\" x2=\"290\" y2=\"114\" class=\"lg\"/>\n<circle cx=\"300\" cy=\"120\" r=\"4\" class=\"dot\"/><text x=\"300\" y=\"178\" text-anchor=\"middle\">NZF 특별회기(12월)<\/text><line x1=\"300\" y1=\"126\" x2=\"300\" y2=\"164\" class=\"lg\"/>\n<circle cx=\"450\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"450\" y=\"178\" text-anchor=\"middle\">NZF 적용 목표(승인안)<\/text><line x1=\"450\" y1=\"126\" x2=\"450\" y2=\"164\" class=\"lg\"/>\n<circle cx=\"610\" cy=\"120\" r=\"5\" class=\"dot\"/><text x=\"600\" y=\"64\" text-anchor=\"end\">CII Z = 21.5%<\/text><line x1=\"610\" y1=\"70\" x2=\"610\" y2=\"114\" class=\"lg\"/>\n<\/g>\n<text x=\"30\" y=\"212\" class=\"t2\">IMO 지침: 2024.5 액화수소 운송 권고 개정 · 2024.11 수중방사소음 지침 개정<\/text><text x=\"30\" y=\"232\" class=\"t2\">2024.12 암모니아 연료 잠정지침 승인<\/text>\n<\/svg><figcaption>시험 직전 1~2년 사이에 시행·채택된 규제가 출제로 이어지는 경향이 있다. 2027년 시험은 IMO Net-Zero Framework 결정 직후다.<\/figcaption><\/figure>\n<h4>분야별 예상 주제<\/h4>\n<div class=\"scroll\"><table class=\"t\"><thead><tr><th>분야<\/th><th>최근 출제 흐름<\/th><th>2027 예상 주제<\/th><th>가능성<\/th><\/tr><\/thead><tbody>\n<tr><td>대체연료<\/td><td>LNG 연료탱크(124·130·136), 탄소중립 연료(130)<\/td><td><a href=\"#/t/ammonia-fuel\">암모니아 연료추진<\/a>, <a href=\"#/t/methanol-fuel\">메탄올 연료추진<\/a>, <a href=\"#/t/lng-fgss\">LNG 연료공급시스템(FGSS)<\/a><\/td><td>높음<\/td><\/tr>\n<tr><td>수소<\/td><td>연료전지(136)<\/td><td><a href=\"#/t/lh2-carrier\">액화수소 운반선 화물창<\/a>, 수소 연료 안전<\/td><td>중간~높음<\/td><\/tr>\n<tr><td>탄소 규제<\/td><td>EEDI·EEXI·CII·ETS·MRV 매회<\/td><t
